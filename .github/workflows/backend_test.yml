name: Firebase Functions Test

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'backend_strava/functions/**'
      - '.github/workflows/backend_test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend_strava/functions/**'
      - '.github/workflows/backend_test.yml'

jobs:
  test_functions:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend_strava/functions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './backend_strava/functions/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
