<!doctype html>
<!--
  App Store search results asset, 3:2, 3840×2560 PNG. Phase 1b of #69.
  Notes and texts: README.md.

  URL parameters (append in Chrome; the page reloads):
    ?lang=de   German texts (default: English)
    ?video     hide the front phone for the video variant (tool/marketing/build_kit.py)
    ?safe      draw Apple's art safe area (836, 765, 2168×1030)

  Render (Windows and macOS, repo root):
    python tool/marketing/render_images.py appstore-search
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>App Store Search Results Asset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@500&display=block" rel="stylesheet">
<link rel="stylesheet" href="creative.css">
<style>
  html, body { width: 3840px; height: 2560px; }
  .safe-area { left: 836px; top: 765px; width: 2168px; height: 1030px; }
  /* Drawn at 4425×2247 and scaled down: the same layout as the earlier 16:9 universal draft,
     which looked right in App Store Connect's search results preview. */
  .stage {
    position: absolute;
    left: 50%; top: 50%;
    width: 4425px; height: 2247px;
    transform: translate(-50%, -50%) scale(.8);
    display: flex;
    align-items: center;
  }
  .copy { flex: 0 0 2350px; padding-left: 60px; }
  .brand { display: flex; align-items: center; gap: 56px; margin-bottom: 120px; }
  .brand img { width: 260px; height: 260px; border-radius: 58px; box-shadow: 0 20px 50px rgba(0, 0, 0, .18); }
  .brand span { font-size: 130px; font-weight: 500; color: var(--ink-muted); }
  h1 { font-size: 300px; }
  p.sub {
    margin-top: 110px;
    font-size: 120px;
    line-height: 1.3;
    color: var(--ink-muted);
    text-wrap: balance;
  }
  .phones { position: relative; flex: 1; height: 100%; }
  .phone.back { left: 0; top: 70px; transform: scale(.70); }
  .phone.front { left: 920px; top: 0; transform: scale(.75); }
</style>
</head>
<body>
  <div class="stage">
    <div class="copy">
      <div class="brand">
        <img src="../../../icons/logo_1024.png" alt="">
        <span>Bike Setup Tracker</span>
      </div>
      <h1 data-i18n="headline"></h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="phones">
      <div class="phone back">
        <img class="screen" src="../iPhone-17-Pro-Max/03_raw.png" alt="">
        <img class="frame" src="../iPhone-17-Pro-Max/frame.png" alt="">
      </div>
      <div class="phone front" data-video>
        <img class="screen" src="../iPhone-17-Pro-Max/04_raw.png" alt="">
        <img class="frame" src="../iPhone-17-Pro-Max/frame.png" alt="">
      </div>
    </div>
  </div>
  <div class="safe-area"></div>
<script>
  const strings = {
    en: {
      headline: 'Never Lose Your <em>Suspension Sweet Spot</em>',
      sub: 'Log suspension, tire pressure and trail conditions for every ride.',
    },
    de: {
      headline: 'Nie wieder den <em>Sweet Spot</em> deines Fahrwerks verlieren',
      sub: 'Fahrwerk, Reifendruck und Trail-Bedingungen für jede Ausfahrt.',
    },
  };
  const params = new URLSearchParams(location.search);
  const lang = params.get('lang') === 'de' ? 'de' : 'en';
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    el.innerHTML = strings[lang][el.dataset.i18n];
  });
  if (params.has('safe')) document.body.classList.add('show-safe');
</script>
<script src="../../../../docs/marketing/templates/template.js"></script>
</body>
</html>
