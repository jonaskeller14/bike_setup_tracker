# RockShox mountain-bike forks — adjustment preset database
#
# Same design as fork/fox.yaml and fork/ohlins.yaml: click ranges belong to the
# DAMPER cartridge, defined once under `option_values.damper` and referenced by id from
# each fork's trims. See SCHEMA.md in this folder.

brand: RockShox
component_type: fork
sources:
  - https://www.sram.com/en/rockshox/products/forks
  - https://www.sram.com/en/rockshox/learn/charger-3-setup
  - https://www.sram.com/en/rockshox/learn/fork-deep-dives/compression-knob-logic
  # Primary — SRAM service manuals / technical specifications (PDF)
  - https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/front-suspension/2023-zeb-lyrik-pike-service-manual.pdf
  - https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/front-suspension/2023-front-suspension-oil-air-coil-token-specifications-english.pdf
  - https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/front-suspension/2021-2023-sid-and-sid-sl-service-manual.pdf
  - https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/bottomless-tokens-english.pdf
  # Primary — RockShox rider-support knowledge base
  - https://support.rockshox.com/hc/en-us/articles/5910471591579-What-is-the-range-of-adjustability-on-Charger-3
  - https://support.rockshox.com/hc/en-us/articles/26413299077659-How-did-the-adjustment-range-of-Low-Speed-Compression-and-High-Speed-Compression-change-on-RockShox-Charger-3-1
  - https://support.rockshox.com/hc/en-us/articles/26413313637531-Does-the-RockShox-Charger-3-1-damper-offer-more-clicks-of-adjustment
  - https://support.rockshox.com/hc/en-us/articles/46637226489755-What-are-the-differences-between-Charger-3-Charger-3-1-and-Charger-3-2
  - https://support.rockshox.com/hc/en-us/articles/46638364341531-Which-damper-upgrades-are-available-for-the-BoXXer-D2
  - https://support.rockshox.com/hc/en-us/articles/5930461078683-What-RockShox-forks-come-with-Charger-3-dampers
  - https://support.rockshox.com/hc/en-us/articles/24895607833499-What-is-the-range-of-adjustability-on-the-Isolator-Damper
  - https://support.rockshox.com/hc/en-us/articles/24895680722331-What-RockShox-forks-is-the-Isolator-damper-compatible-with
  - https://support.rockshox.com/hc/en-us/articles/24894984507035-What-is-the-difference-between-the-RockShox-Domain-and-Psylo-forks
  - https://support.rockshox.com/hc/en-us/articles/17232924126235-What-are-the-travel-options-for-BoXXer
  - https://support.rockshox.com/hc/en-us/articles/17233262282011-Why-change-BoXXer-s-offset-options-to-44mm-48mm-and-52mm
  - https://support.rockshox.com/hc/en-us/articles/47697676072475-Can-I-change-the-travel-of-the-2024-Boxxer-D1
  - https://support.rockshox.com/hc/en-us/articles/45761068389403-Can-I-change-the-travel-of-the-2020-2023-Boxxer-C2
  - https://support.rockshox.com/hc/en-us/articles/24894559854747-What-is-the-difference-between-the-Race-Day-and-Race-Day-2-damper
  - https://support.rockshox.com/hc/en-us/articles/17383057951259-How-do-the-Charger-XC-and-Rush-XC-differ-from-Charger-Race-Day-2
  # Secondary — editorial, used for context only, no numbers taken from them
  - https://flowmountainbike.com/tests/2025-rockshox-zeb-lyrik-pike-fork-review/
  - https://enduro-mtb.com/en/rockshox-2025-fork-charger-review/
  - https://freehub.com/product-reviews/2014-rockshox-pike-rct3-160mm-review
updated: 2026-09-10
# Counting conventions, verified per damper against SRAM material:
#   * Charger 3 / 3.1 / 3.2 compression counts from the MIDDLE detent — HSC has
#     5 positions (-2..+2), LSC has 15 positions (-7..+7). Stored with those
#     literal ranges plus `visualization: dial_cw` (increasing value = clockwise;
#     -2 lies counterclockwise of the 0 detent).
#   * Rebound on every RockShox fork damper is counted from fully OPEN (fastest),
#     so `min: 0` with the default `dial_ccw`.
# Damper-per-trim assignments come from the exploded views in the 2023-2027
# ZEB/Lyrik/Pike service manual (pp. 12-31), not from marketing copy.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    charger_3:
      name: Charger 3 RC2
      description: |-
        - Independent high- and low-speed compression circuits, both counted from a centre detent
        - HSC is a 5-position dial, LSC a 15-position dial, rebound 18 clicks
        - Fitted to 2023-2024 Pike, Lyrik and ZEB Ultimate / Select+
      adjustments:
        - { name: HSC, type: step, min: -2, max: 2, visualization: dial_cw, notes: "High-Speed Compression; Counted from the middle detent" }
        - { name: LSC, type: step, min: -7, max: 7, visualization: dial_cw, notes: "Low-Speed Compression; Counted from the middle detent", dialSize: small }
        - { name: Rebound, type: step, max: 18, notes: Counted from fully open (fastest), dialColor: red }
      source:
        - https://support.rockshox.com/hc/en-us/articles/5910471591579-What-is-the-range-of-adjustability-on-Charger-3
        - https://support.rockshox.com/hc/en-us/articles/5930461078683-What-RockShox-forks-come-with-Charger-3-dampers
        - https://www.sram.com/en/rockshox/learn/fork-deep-dives/compression-knob-logic
        - https://freehub.com/product-reviews/2014-rockshox-pike-rct3-160mm-review
      note: >-
        RockShox states "15 clicks of Low Speed Compression, 5 clicks of High Speed
        Compression, and 18 clicks of Rebound". The 15/5 compression dials are the
        centre-detent -7..+7 and -2..+2 ranges. Per RockShox's "Compression Knob
        Logic" page, HSC is the larger of the two knobs and LSC is the smaller one
        stacked on top of it.

    charger_3_1:
      name: Charger 3.1 RC2
      description: |-
        - Same adjuster layout and click count as Charger 3, with a wider useful range per click
        - More open LSC at the open end and firmer HSC at the closed end
        - Fitted to 2025-2027 Pike, Lyrik and ZEB Ultimate / Select+
      adjustments:
        - { name: HSC, type: step, min: -2, max: 2, visualization: dial_cw, notes: "High-Speed Compression; Counted from the middle detent" }
        - { name: LSC, type: step, min: -7, max: 7, visualization: dial_cw, notes: "Low-Speed Compression; Counted from the middle detent", dialSize: small }
        - { name: Rebound, type: step, max: 18, notes: Counted from fully open (fastest), dialColor: red }
      source:
        - https://support.rockshox.com/hc/en-us/articles/26413313637531-Does-the-RockShox-Charger-3-1-damper-offer-more-clicks-of-adjustment
        - https://support.rockshox.com/hc/en-us/articles/26413299077659-How-did-the-adjustment-range-of-Low-Speed-Compression-and-High-Speed-Compression-change-on-RockShox-Charger-3-1
        - https://www.sram.com/en/rockshox/learn/fork-deep-dives/compression-knob-logic
        - https://freehub.com/product-reviews/2014-rockshox-pike-rct3-160mm-review
      note: >-
        RockShox: "Charger 3.1 offers the same number of adjustment clicks as
        Charger 3, but with a broader range of adjustment." Counts therefore carried
        over from the Charger 3 range-of-adjustability article, not inferred.
      dial_marking: >-
        The +/- symbol on each compression dial shows direction relative to the
        white etched indicator line.

    charger_3_2:
      name: Charger 3.2 RC2
      description: >-
        Highest-damping Charger, built to match the Linear XL air spring and the
        2027 chassis. Adjustments incomplete: please add HSC, LSC and Rebound
        yourself.
      adjustments: []
      source:
        - https://support.rockshox.com/hc/en-us/articles/46637226489755-What-are-the-differences-between-Charger-3-Charger-3-1-and-Charger-3-2
        - https://support.rockshox.com/hc/en-us/articles/46638364341531-Which-damper-upgrades-are-available-for-the-BoXXer-D2
      note: >-
        SRAM confirms the damper exists and pairs with Linear XL (Charger 3/3.1
        pairs with DebonAir+), and that BoXXer D2 Ultimate ships with it — but
        publishes no click counts for 3.2. Do not copy the Charger 3/3.1 numbers
        across: SRAM describes 3.2 as a different tune and range.

    charger_2_1_rc2:
      name: Charger 2.1 RC2
      description: >-
        Gravity damper of the 2019-2023 BoXXer, with separate high- and low-speed
        compression dials. Adjustments incomplete: please add HSC, LSC and Rebound
        yourself.
      adjustments: []
      source: https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/front-suspension/2023-front-suspension-oil-air-coil-token-specifications-english.pdf
      note: >-
        Damper-to-model assignment from the 2023 Front Suspension Specifications
        (BoXXer Ultimate FS-BXR-ULT-C2). SRAM publishes no click counts for
        Charger 2.1 RC2, so none are recorded here.

    charger_race_day:
      name: Charger Race Day
      description: >-
        Featherweight XC damper with a rebound dial and a compression lever that
        firms the fork for climbs. Adjustments incomplete: please add Rebound and
        Compression yourself.
      adjustments: []
      source: https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/front-suspension/2021-2023-sid-and-sid-sl-service-manual.pdf
      note: >-
        Fitted to 2021-2023 SID / SID SL Ultimate and Rudy XPLR Ultimate. The
        service manual documents the rebound adjuster only as "counter-clockwise
        until it stops" and gives no click count.

    charger_race_day_2:
      name: Charger Race Day 2
      description: >-
        Featherweight XC damper for marathon and cross-country racing, with a
        rebound dial and a 2- or 3-position compression lever. Adjustments
        incomplete: please add Rebound and Compression yourself.
      adjustments: []
      source:
        - https://support.rockshox.com/hc/en-us/articles/24894559854747-What-is-the-difference-between-the-Race-Day-and-Race-Day-2-damper
        - https://support.rockshox.com/hc/en-us/articles/17383057951259-How-do-the-Charger-XC-and-Rush-XC-differ-from-Charger-Race-Day-2
      note: >-
        SRAM sells the cartridge as 2P (Open / Lock) and 3P (Open / Pedal / Lock),
        so the compression mode options depend on the individual fork. No rebound
        click count is published; nothing inferred from the Race Day 1 damper.

    charger_2_rl:
      name: Charger 2 RL
      description: >-
        Cross-country damper with a rebound dial and a lockout lever. Adjustments
        incomplete: please add Rebound and Compression yourself.
      adjustments: []
      source: https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/front-suspension/2021-2023-sid-and-sid-sl-service-manual.pdf
      note: Fitted to 2021-2023 SID / SID SL Select+. No click counts published.

    charger_rl:
      name: Charger RL
      description: >-
        Sealed-bladder trail damper with a rebound dial and a lockout lever.
        Adjustments incomplete: please add Rebound and Compression yourself.
      adjustments: []
      source: https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/front-suspension/2021-2023-sid-and-sid-sl-service-manual.pdf
      note: Fitted to 2021-2023 SID / SID SL Select. No click counts published.

    rush_rc:
      name: Rush RC
      description: |-
        - Cost-focused trail damper for Base-trim Pike, Lyrik and ZEB
        - Rebound dial with 16 clicks, counted from fully open
        - Low-speed compression knob on top of the damper leg
      adjustments:
        - { name: Rebound, type: step, max: 16, notes: Counted from fully open (fastest), dialColor: red }
      source:
        - https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/front-suspension/2023-zeb-lyrik-pike-service-manual.pdf
        - https://freehub.com/product-reviews/2014-rockshox-pike-rct3-160mm-review
      note: >-
        Rebound count from "Damper Assembly - Rush RC" (p. 172): "rotate it
        counterclockwise 16 clicks from the closed position. This is the full open
        position." The LSC knob appears in the exploded views (p. 31) but its click
        count is not published, so it is deliberately omitted.

    rush_rl:
      name: Rush RL
      description: |-
        - Entry-level cross-country damper for Base-trim SID and SID SL
        - Rebound dial with 16 clicks, counted from fully open
        - Compression lockout lever, available with a bar remote
      adjustments:
        - { name: Rebound, type: step, max: 16, notes: Counted from fully open (fastest), dialColor: red }
      source:
        - https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/front-suspension/2021-2023-sid-and-sid-sl-service-manual.pdf
        - https://freehub.com/product-reviews/2014-rockshox-pike-rct3-160mm-review
      note: >-
        Rebound count from the Rush Damper RL "Damper Assembly" step (p. 74):
        "rotate it counter-clockwise 16 clicks from the closed position."

    isolator:
      name: Isolator
      description: |-
        - Trail damper of the Psylo Gold RC and Domain Gold RC
        - 16 clicks of rebound, counted from fully open
        - Three-position compression lever: Open, Pedal and Firm
      adjustments:
        - { name: Rebound, type: step, max: 16, notes: Counted from fully open (fastest), dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Pedal, Firm] }
      source:
        - https://support.rockshox.com/hc/en-us/articles/24895607833499-What-is-the-range-of-adjustability-on-the-Isolator-Damper
        - https://support.rockshox.com/hc/en-us/articles/24895680722331-What-RockShox-forks-is-the-Isolator-damper-compatible-with
        - https://freehub.com/product-reviews/2014-rockshox-pike-rct3-160mm-review
      note: >-
        RockShox: "The Isolator Damper has 16 clicks of Rebound adjustment and a
        three-position Compression adjustment with Open, Pedal, and Firm settings."

    motion_control_rc:
      name: Motion Control RC
      description: >-
        Long-travel trail damper with a rebound dial and a compression dial that
        sweeps from open to a firm pedalling platform. Adjustments incomplete:
        please add Rebound and Compression yourself.
      adjustments: []
      source: https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/front-suspension/2023-front-suspension-oil-air-coil-token-specifications-english.pdf
      note: >-
        Fitted to Yari, Revelation and Domain per the 2023 Front Suspension
        Specifications damper column. No click counts published by SRAM.

    motion_control_rl:
      name: Motion Control RL
      description: >-
        Cross-country damper with a rebound dial and a lockout lever, offered with
        a bar remote. Adjustments incomplete: please add Rebound and Compression
        yourself.
      adjustments: []
      source: https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/front-suspension/2023-front-suspension-oil-air-coil-token-specifications-english.pdf
      note: >-
        Fitted to Reba, Recon Gold and 35 Gold per the 2023 Front Suspension
        Specifications damper column. No click counts published by SRAM.

# --------------------------------------------------------------------------
# Forks — current lineup first, then the models that only exist as an earlier
# generation (Yari, Revelation, Recon Gold). A model with several generations
# nests them as `generation` nodes, newest first. Each generation gets its own
# damper id — SRAM revises internals under an unchanged badge.
# Every fork here is air-sprung, so trims share the `&air_spring` anchor
# (Pressure only). Trims whose Bottomless Token maximum IS published carry their
# own literal list with a Volume Spacers entry instead of the alias.
# --------------------------------------------------------------------------
nodes:
  - label: "SID SL"
    level: model
    category: XC
    children:
      - label: "2025–2026"
        level: generation
        id: "2025"
        draft: true
        years: "2025-2026"
        url: https://www.sram.com/en/rockshox/series/sid-sl
        children:
          - label: Ultimate
            level: trim
            specs: { stanchion: 32mm, spring: Air }
            adjustments: &air_spring
              - { name: Pressure, type: numerical, unit: psi, min: 0 }
            options:
              damper: [charger_race_day_2]
              travel_mm: [100, 110]
              wheel_size: [29]
          - label: Select+
            level: trim
            specs: { stanchion: 32mm, spring: Air }
