# BOS Suspension mountain-bike forks — adjustment preset database
#
# Same design as fork/fox.yaml: click ranges belong to the DAMPER cartridge,
# defined once under `option_values.damper` and referenced by id from each fork's trims.
# See SCHEMA.md in this folder.
#
# BOS is a small French manufacturer. Its own product pages (bos-suspension.com,
# the official BOS site) list the total click count of every damper circuit and
# quote each as "plus ou moins 2 clics" (+/-2 clicks, manufacturing tolerance).
# The "Quickstart" PDFs quote "standard settings" (11/10/10 clicks etc.), which
# are recommended starting points and NOT maximums — they are used here only for
# the click-counting direction, air-pressure range and token maximum.
#
# Scope: the current (2025) Grabber-generation lineup only. BOS's older forks
# (Deville II 35 FCV, Idylle 39 FCV/SC, Deville 34/35, ...) are not listed —
# see the Follow-ups footer.

brand: BOS
component_type: fork
sources:
  - https://www.bos-suspension.com/PBCPPlayer.asp?ID=2410051
  - https://www.bos-suspension.com/PBCPPlayer.asp?ID=2422873
  - https://www.bos-suspension.com/PBCPPlayer.asp?ID=2422386
  - https://www.bos-suspension.com/PBCPPlayer.asp?ID=2422364
  - https://www.bos-suspension.com/PBCPPlayer.asp?ID=2422906
  - https://www.bos-suspension.com/PBCPPlayer.asp?ID=2422893
  # BOS Quickstart guides (PDF) — click-counting direction, air-pressure range, token maximum
  - https://www.bos-suspension.com/Files/125448/Quickstart_DEVILLE__35_GRABBER_EN.pdf
  - https://www.bos-suspension.com/Files/125448/Quickstart_KYLL_39_GRABBER_EN.pdf
  - https://www.bos-suspension.com/Files/125448/Quickstart_IDYLLE_39_GRABBER_EN.pdf
  - https://www.bos-suspension.com/Files/125448/Quickstart_Obsys-EN.pdf
  - https://www.bos-suspension.com/PBCPPlayer.asp?ID=2252919
updated: 2026-10-13
# Clicks are counted from fully closed (firmest) = 0, opening counter-clockwise
# (BOS Quickstart guides) → default `dial_ccw`.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    grabber_2025:
      name: Grabber FCV (2025)
      description: |-
        - Pressurised closed three-way cartridge with the FCV valve
        - Separate low-speed compression, high-speed compression and rebound dials
        - Every click is counted from fully closed, opening counter-clockwise
      description_de: |-
        - Geschlossene Druckkartusche mit drei Einstellwegen und FCV-Ventil
        - Getrennte Räder für Low-Speed-Druckstufe, High-Speed-Druckstufe und Zugstufe
        - Jeder Klick wird von ganz geschlossen gezählt, Öffnen gegen den Uhrzeigersinn
      description_fr: |-
        - Cartouche à trois voies fermée et pressurisée avec la valve FCV
        - Molettes séparées de compression basse vitesse, de compression haute vitesse et de détente
        - Chaque clic est compté depuis la position entièrement fermée, en ouvrant dans le sens antihoraire
      description_it: |-
        - Cartuccia a tre vie chiusa e pressurizzata con la valvola FCV
        - Manopole separate di compressione a bassa velocità, di compressione ad alta velocità e di ritorno
        - Ogni scatto è contato a partire dalla posizione completamente chiusa, aprendo in senso antiorario
      description_es: |-
        - Cartucho de tres vías cerrado y presurizado con la válvula FCV
        - Ruedas separadas de compresión de baja velocidad, de compresión de alta velocidad y de rebote
        - Cada clic se cuenta desde la posición totalmente cerrada, abriendo en sentido antihorario
      description_pt: |-
        - Cartucho de três vias fechado e pressurizado com a válvula FCV
        - Seletores separados de compressão de baixa velocidade, de compressão de alta velocidade e de retorno
        - Cada clique é contado a partir da posição totalmente fechada, abrindo no sentido anti-horário
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 25, notes: High-Speed Compression, notes_de: High-Speed-Druckstufe, notes_fr: Compression haute vitesse, notes_it: Compressione ad alta velocità, notes_es: Compresión de alta velocidad, notes_pt: Compressão de alta velocidade }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 27, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 30, notes: Low-Speed Rebound, notes_de: Low-Speed-Zugstufe, notes_fr: Détente basse vitesse, notes_it: Ritorno a bassa velocità, notes_es: Rebote de baja velocidad, notes_pt: Retorno de baixa velocidade }
      source:
        - https://www.bos-suspension.com/PBCPPlayer.asp?ID=2422873
        - https://www.bos-suspension.com/PBCPPlayer.asp?ID=2422386
        - https://www.bos-suspension.com/Files/125448/Quickstart_DEVILLE__35_GRABBER_EN.pdf
      note: >-
        Deville 35 Grabber and Kyll 39 Grabber product pages both list "Compression
        Basses Vitesses (27 clics)", "Compression Hautes vitesses (25 clics)",
        "Détente Basses Vitesses (30 clics)" with "Plus ou moins 2 clics". BOS labels
        the single rebound circuit "Low-Speed". Counting direction from the Deville
        35 Grabber Quickstart ("turn the knob clockwise until it stops (clic = 0)").

    grabber_dh_2025:
      name: Grabber FCV with hydraulic end stop (2025)
      description: |-
        - Downhill version of the pressurised closed three-way Grabber cartridge with FCV valve
        - Adds a hydraulic end-of-travel stop
        - Every click is counted from fully closed, opening counter-clockwise
      description_de: |-
        - Downhill-Version der geschlossenen Druckkartusche Grabber mit drei Einstellwegen und FCV-Ventil
        - Mit hydraulischem Endanschlag am Ende des Federwegs
        - Jeder Klick wird von ganz geschlossen gezählt, Öffnen gegen den Uhrzeigersinn
      description_fr: |-
        - Version descente de la cartouche Grabber à trois voies, fermée et pressurisée, avec valve FCV
        - Ajoute une butée hydraulique de fin de course
        - Chaque clic est compté depuis la position entièrement fermée, en ouvrant dans le sens antihoraire
      description_it: |-
        - Versione downhill della cartuccia Grabber a tre vie, chiusa e pressurizzata, con valvola FCV
        - Aggiunge un arresto idraulico di fine corsa
        - Ogni scatto è contato a partire dalla posizione completamente chiusa, aprendo in senso antiorario
      description_es: |-
        - Versión de descenso del cartucho Grabber de tres vías, cerrado y presurizado, con válvula FCV
        - Añade un tope hidráulico de final de recorrido
        - Cada clic se cuenta desde la posición totalmente cerrada, abriendo en sentido antihorario
      description_pt: |-
        - Versão downhill do cartucho Grabber de três vias, fechado e pressurizado, com válvula FCV
        - Acrescenta um batente hidráulico de fim de curso
        - Cada clique é contado a partir da posição totalmente fechada, abrindo no sentido anti-horário
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 25, notes: High-Speed Compression, notes_de: High-Speed-Druckstufe, notes_fr: Compression haute vitesse, notes_it: Compressione ad alta velocità, notes_es: Compresión de alta velocidad, notes_pt: Compressão de alta velocidade }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 27, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 30, notes: Low-Speed Rebound, notes_de: Low-Speed-Zugstufe, notes_fr: Détente basse vitesse, notes_it: Ritorno a bassa velocità, notes_es: Rebote de baja velocidad, notes_pt: Retorno de baixa velocidade }
      source:
        - https://www.bos-suspension.com/PBCPPlayer.asp?ID=2422364
        - https://www.bos-suspension.com/Files/125448/Quickstart_IDYLLE_39_GRABBER_EN.pdf
      note: >-
        Idylle 39 Grabber product page: "Cartouche fermée pressurisée 3 voies dotée
        de la valve FCV et d'une butée de fin de course hydraulique" with 27/25/30
        clics, "Plus ou moins 2 clics". No adjuster for the end stop is described.
        Read off the Idylle's own page, not inherited from the Deville/Kyll cartridge.

    obsys_2025:
      name: Obsys two-way (2025)
      description: |-
        - Pressurised closed two-way downhill cartridge
        - One compression dial and one rebound dial
        - Progressive hydraulic end stop; every click is counted from fully closed
      description_de: |-
        - Geschlossene Downhill-Druckkartusche mit zwei Einstellwegen
        - Ein Druckstufenrad und ein Zugstufenrad
        - Progressiver hydraulischer Endanschlag; jeder Klick wird von ganz geschlossen gezählt
      description_fr: |-
        - Cartouche descente à deux voies fermée et pressurisée
        - Une molette de compression et une molette de détente
        - Butée hydraulique de fin de course progressive ; chaque clic est compté depuis la position entièrement fermée
      description_it: |-
        - Cartuccia da downhill a due vie chiusa e pressurizzata
        - Una manopola di compressione e una di ritorno
        - Arresto idraulico di fine corsa progressivo; ogni scatto è contato a partire dalla posizione completamente chiusa
      description_es: |-
        - Cartucho de descenso de dos vías cerrado y presurizado
        - Una rueda de compresión y una de rebote
        - Tope hidráulico de final de recorrido progresivo; cada clic se cuenta desde la posición totalmente cerrada
      description_pt: |-
        - Cartucho de downhill de duas vias fechado e pressurizado
        - Um seletor de compressão e um de retorno
        - Batente hidráulico de fim de curso progressivo; cada clique é contado a partir da posição totalmente fechada
      adjustments:
        - { name: Compression, name_de: Druckstufe, name_fr: Compression, name_it: Compressione, name_es: Compresión, name_pt: Compressão, type: step, max: 20 }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 28 }
      source:
        - https://www.bos-suspension.com/PBCPPlayer.asp?ID=2422906
        - https://www.bos-suspension.com/Files/125448/Quickstart_Obsys-EN.pdf
      note: >-
        Obsys 42 product page: "Cartouche fermée pressurisée 2 voies dotée d'une
        butée de fin de couse hydraulique progressive", "Compression (20 clics*)",
        "Détente (28 clics*)", "*Plus ou moins 2 clics". The page gives no
        high/low-speed qualifier for compression or rebound. The Quickstart's
        "Compression 20 clicks / Rebound 13 clicks" is a starting point; the
        product page's 28 rebound clicks is used as the range.

    toxik_open_2025:
      name: Open three-way (2025)
      description: |-
        - Open three-way cartridge tuned for dirt jump
        - Separate low-speed compression, high-speed compression and rebound dials
        - Every click is counted from fully closed, opening counter-clockwise
      description_de: |-
        - Offene Kartusche mit drei Einstellwegen, auf Dirt Jump abgestimmt
        - Getrennte Räder für Low-Speed-Druckstufe, High-Speed-Druckstufe und Zugstufe
        - Jeder Klick wird von ganz geschlossen gezählt, Öffnen gegen den Uhrzeigersinn
      description_fr: |-
        - Cartouche ouverte à trois voies réglée pour le dirt jump
        - Molettes séparées de compression basse vitesse, de compression haute vitesse et de détente
        - Chaque clic est compté depuis la position entièrement fermée, en ouvrant dans le sens antihoraire
      description_it: |-
        - Cartuccia aperta a tre vie tarata per il dirt jump
        - Manopole separate di compressione a bassa velocità, di compressione ad alta velocità e di ritorno
        - Ogni scatto è contato a partire dalla posizione completamente chiusa, aprendo in senso antiorario
      description_es: |-
        - Cartucho abierto de tres vías tarado para dirt jump
        - Ruedas separadas de compresión de baja velocidad, de compresión de alta velocidad y de rebote
        - Cada clic se cuenta desde la posición totalmente cerrada, abriendo en sentido antihorario
      description_pt: |-
        - Cartucho aberto de três vias calibrado para dirt jump
        - Seletores separados de compressão de baixa velocidade, de compressão de alta velocidade e de retorno
        - Cada clique é contado a partir da posição totalmente fechada, abrindo no sentido anti-horário
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 25, notes: High-Speed Compression, notes_de: High-Speed-Druckstufe, notes_fr: Compression haute vitesse, notes_it: Compressione ad alta velocità, notes_es: Compresión de alta velocidad, notes_pt: Compressão de alta velocidade }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 27, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 30, notes: Low-Speed Rebound, notes_de: Low-Speed-Zugstufe, notes_fr: Détente basse vitesse, notes_it: Ritorno a bassa velocità, notes_es: Rebote de baja velocidad, notes_pt: Retorno de baixa velocidade }
      source: https://www.bos-suspension.com/PBCPPlayer.asp?ID=2422893
      note: >-
        Toxik product page: "Cartouche Ouverte 3 voies" with 27/25/30 clics, "Plus
        ou moins 2 clics". Read off the Toxik's own page rather than the Grabber
        pages, since the open cartridge is a different part.

# --------------------------------------------------------------------------
# Setup guides — the BOS Quickstarts' starting points as data (SCHEMA.md,
# "Setup guides"), transcribed from docs/research/setup_guides/bos.md.
#   * Pressure: rider weight (kg) → psi, as printed points. The "±5 psi by use
#     and riding style" advice is a note, as FOX's ±10 psi is.
#   * Standard settings are counted from fully closed, as the catalog dampers
#     are; the stock token count is the volume spacer value.
#   * Deville 35: its table (55-121 psi) contradicts the same Quickstart's
#     115-350 psi window, so no guide until BOS clarifies.
#   * Kyll 39: the e-MTB ("VTTAE") pressure block has no catalog option.
#   * Obsys 42: the separate preload valve (0-500 g) has no catalog adjuster
#     and no recommended value.
# --------------------------------------------------------------------------
guides:
  bos_kyll39_2025:
    label: BOS Kyll 39 Grabber Quickstart (2025)
    label_de: BOS Kyll 39 Grabber Schnellstart (2025)
    label_fr: Guide de démarrage rapide BOS Kyll 39 Grabber (2025)
    label_it: Guida rapida BOS Kyll 39 Grabber (2025)
    label_es: Guía de inicio rápido BOS Kyll 39 Grabber (2025)
    label_pt: Guia rápido BOS Kyll 39 Grabber (2025)
    source: https://www.bos-suspension.com/Files/125448/Quickstart_KYLL_39_GRABBER_EN.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { travel_mm: 160 }
        rows: {
          60: 167, 65: 182, 70: 196, 75: 210, 80: 224, 85: 237,
          90: 251, 95: 265, 100: 279, 105: 293, 110: 307
        }
        note: &bos_pressure_style Up to 5 psi more or less depending on use and riding style
        note_de: &bos_pressure_style_de Bis zu 5 psi mehr oder weniger je nach Einsatz und Fahrstil
        note_fr: &bos_pressure_style_fr Jusqu’à 5 psi de plus ou de moins selon l’usage et le style de pilotage
        note_it: &bos_pressure_style_it Fino a 5 psi in più o in meno a seconda dell’uso e dello stile di guida
        note_es: &bos_pressure_style_es Hasta 5 psi más o menos según el uso y el estilo de pilotaje
        note_pt: &bos_pressure_style_pt Até 5 psi a mais ou a menos conforme o uso e o estilo de pilotagem
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { travel_mm: 170 }
        rows: {
          60: 159, 65: 171, 70: 184, 75: 196, 80: 208, 85: 220,
          90: 233, 95: 245, 100: 257, 105: 269, 110: 282
        }
        note: *bos_pressure_style
        note_de: *bos_pressure_style_de
        note_fr: *bos_pressure_style_fr
        note_it: *bos_pressure_style_it
        note_es: *bos_pressure_style_es
        note_pt: *bos_pressure_style_pt
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { travel_mm: 180 }
        rows: {
          60: 150, 65: 162, 70: 173, 75: 185, 80: 197, 85: 208,
          90: 220, 95: 231, 100: 243, 105: 255, 110: 266
        }
        note: *bos_pressure_style
        note_de: *bos_pressure_style_de
        note_fr: *bos_pressure_style_fr
        note_it: *bos_pressure_style_it
        note_es: *bos_pressure_style_es
        note_pt: *bos_pressure_style_pt
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { travel_mm: 190 }
        rows: {
          60: 142, 65: 153, 70: 164, 75: 175, 80: 186, 85: 197,
          90: 208, 95: 220, 100: 231, 105: 242, 110: 253
        }
        note: *bos_pressure_style
        note_de: *bos_pressure_style_de
        note_fr: *bos_pressure_style_fr
        note_it: *bos_pressure_style_it
        note_es: *bos_pressure_style_es
        note_pt: *bos_pressure_style_pt
      - &grabber_lsc { target: lsc, value: 11 }
      - &grabber_hsc { target: hsc, value: 10 }
      - &grabber_rebound { target: rebound, value: 10 }
      - &grabber_tokens { target: volume_spacers, value: 1, note: The factory-fitted token, note_de: Der werkseitig verbaute Token, note_fr: Le token monté en usine, note_it: Il token montato in fabbrica, note_es: El token montado de fábrica, note_pt: O token montado de fábrica }

  bos_idylle39_2025:
    label: BOS Idylle 39 Grabber Quickstart (2025)
    label_de: BOS Idylle 39 Grabber Schnellstart (2025)
    label_fr: Guide de démarrage rapide BOS Idylle 39 Grabber (2025)
    label_it: Guida rapida BOS Idylle 39 Grabber (2025)
    label_es: Guía de inicio rápido BOS Idylle 39 Grabber (2025)
    label_pt: Guia rápido BOS Idylle 39 Grabber (2025)
    source: https://www.bos-suspension.com/Files/125448/Quickstart_IDYLLE_39_GRABBER_EN.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          60: 151, 65: 164, 70: 177, 75: 190, 80: 203, 85: 217,
          90: 230, 95: 243, 100: 256, 105: 270, 110: 283
        }
        note: *bos_pressure_style
        note_de: *bos_pressure_style_de
        note_fr: *bos_pressure_style_fr
        note_it: *bos_pressure_style_it
        note_es: *bos_pressure_style_es
        note_pt: *bos_pressure_style_pt
      - *grabber_lsc
      - *grabber_hsc
      - *grabber_rebound
      - *grabber_tokens

  bos_obsys42_2025:
    label: BOS Obsys Quickstart
    label_de: BOS Obsys Schnellstart
    label_fr: Guide de démarrage rapide BOS Obsys
    label_it: Guida rapida BOS Obsys
    label_es: Guía de inicio rápido BOS Obsys
    label_pt: Guia rápido BOS Obsys
    source: https://www.bos-suspension.com/Files/125448/Quickstart_Obsys-EN.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          55: 149, 60: 160, 65: 169, 70: 179, 75: 187, 80: 195, 85: 202,
          90: 209, 95: 216, 100: 221, 105: 226, 110: 231, 115: 235, 120: 238
        }
        note: *bos_pressure_style
        note_de: *bos_pressure_style_de
        note_fr: *bos_pressure_style_fr
        note_it: *bos_pressure_style_it
        note_es: *bos_pressure_style_es
        note_pt: *bos_pressure_style_pt
      - { target: compression, value: 20 }
      - { target: rebound, value: 13 }

# --------------------------------------------------------------------------
# Forks — current BOS MTB lineup (2025 air-spring cartridge).
# The Deville, Kyll and Idylle share `&air_spring_tokens` (a single Pressure plus
# up to 5 tokens, per the BOS Quickstarts). The Obsys and Toxik list a Pressure
# only: the Obsys progresses via extra air pressure, and the Toxik's page names
# anti-volume spacers without stating a maximum.
# --------------------------------------------------------------------------
