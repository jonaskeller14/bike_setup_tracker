#   - Brand domain: the task brief named bos-mtb.com, which does not resolve;
#     all data here comes from bos-suspension.com (BOS's official site, with
#     the "BOS Cycling" 2025 range).
#   - "Rambler": no fork of that name appears on BOS's current or archived
#     manuals pages, so none is listed.
#   - Launch year: the product pages label the air cartridge "Version 2025" and
#     carry no explicit model-year; `years: "2025-2026"` follows that label.
#     The Vital MTB "2025 range" press release could not be loaded to confirm
#     it.
#   - Toxik volume spacers and pressure: the page lists "Progressivité (via
#     entretoises antivolume)" but no maximum and no pressure range, so no
#     Volume Spacers adjustment is generated and Pressure is unbounded.
#   - Pressure maxima: the Quickstarts state "between 115 and 350 psi" (Deville,
#     Kyll, Idylle) and "between 135 and 250 psi" (Obsys); the upper bound is
#     used as `max`.
#   - Preload: the Grabber, Obsys and Toxik pages list "Précontrainte" and the
#     Obsys Quickstart mentions a separate PRELOAD valve ("range from 0 to
#     500 gr"), but no unit/range that maps onto an adjuster is published. Not
#     modelled.
#   - Dial knob colours/sizes: the Quickstart PDFs are image-only and no BOS page
#     states them in text, so the defaults are used.
#   - Setup guides: the Quickstart PDFs (EN) of the Deville 35, Kyll 39, Idylle 39
#     and Obsys; the Toxik has no manual listed on the BOS manuals page.
#   - Legacy forks with manuals on bos-suspension.com (Deville II 35 FCV, Deville
#     35/34/34 AM, Idylle 39 FCV/SC, Idylle 37/36, Idylle Rare/Air/SC, Dizzy,
#     Obsys pre-2025): the manuals and Quickstarts only show single recommended
#     starting clicks (e.g. Deville 35 10/10/14, Void 2 12/12/12), not total
#     click counts or a setup table, and no approved editorial states totals,
#     so no older generation is listed.
