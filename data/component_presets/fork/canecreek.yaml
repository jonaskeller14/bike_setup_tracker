# Cane Creek mountain-bike forks — adjustment preset database
#
# Purpose: let a user pick their exact fork (brand › model › trim › damper) and
# have the app auto-add the correct adjustment presets, including the real
# rebound/compression click ranges.
#
# Design: click ranges are a property of the DAMPER, not the model. So dampers
# are defined once under `option_values.damper` and each fork trim references a damper id.
#
# See SCHEMA.md in this folder for the sparse `adjustments:` format, the field
# defaults table, and how these entries map to the app's Adjustment presets.

brand: Cane Creek
component_type: fork
sources:
  - https://www.canecreek.com/collections/forks
  - https://www.canecreek.com/products/helm-mkii
  - https://www.canecreek.com/products/helm-mkii-coil
  - https://www.canecreek.com/products/helm-works-series
  - https://www.canecreek.com/products/helm-works-series-130
  - https://www.canecreek.com/products/helm-dj
  - https://www.canecreek.com/blogs/journal/helm-yeah
  - https://support.canecreek.com/support/solutions/articles/62000210355-helm-mkii-air-volume-adjustment
  - https://www.canecreek.com/pages/forks-product-support
  - https://www.canecreek.com/pages/legacy-products-product-support
  # Official PDF instruction manuals (linked from the two support pages above)
  - https://cdn.shopify.com/s/files/1/0579/5987/4639/files/HelmMKII_UserManual_04_03_2025.pdf
  - https://cdn.shopify.com/s/files/1/0579/5987/4639/files/Helm_UserManual_1_12_18_FINAL_4a8c4476-2bc0-4f03-ae32-0ced7f5f3137.pdf
  - https://www.pinkbike.com/news/cane-creek-helm-fork-review-2017.html
  - https://www.singletracks.com/mtb-gear/cane-creeks-sleek-helm-air-fork-is-a-legit-workhorse-on-the-trail-review/
  - https://www.perpetualdisappointment.co.uk/cane-creek-helm-coil-fork-long-term-review/
updated: 2026-10-13
# Service intervals (`tasks`) come from the Helm and Helm MKII manuals (the
# nodes' `setup_guide`): lower legs every 50 hours, an air spring and damper
# rebuild every 100 hours, no time-based interval. The Helm DJ has no manual
# with a schedule, so it keeps the generic templates.
#
# Click ranges below come from the "Damping Adjustments" table in each
# generation's official Cane Creek instruction manual (see each damper's
# `source:`). Clicks are counted from fully closed (firmest); the default
# `dial_ccw` visualization applies unless noted. Both Helm manuals footnote
# that "count of adjuster positions may vary with some fork builds. The range
# of adjustment will remain the same."

# --------------------------------------------------------------------------
# Dampers — shared across the forks that ship with them. One id per
# generation: the MK1 and MKII cartridges do NOT share click counts.
# --------------------------------------------------------------------------
option_values:
  damper:
    helm_mkii_damper:
      name: Helm MKII Damper
      description: |-
        - Independent High-Speed Compression, Low-Speed Compression and rebound circuits, all externally adjustable
        - 10 positions per adjuster, counted from fully closed
        - Clockwise adds damping, counter-clockwise takes it away
      description_de: |-
        - Unabhängige Kreise für High-Speed-Druckstufe, Low-Speed-Druckstufe und Zugstufe, alle extern einstellbar
        - 10 Positionen pro Versteller, von ganz geschlossen gezählt
        - Im Uhrzeigersinn erhöht die Dämpfung, gegen den Uhrzeigersinn verringert sie
      description_fr: |-
        - Circuits indépendants de compression haute vitesse, de compression basse vitesse et de détente, tous réglables de l’extérieur
        - 10 positions par réglage, comptées depuis la position entièrement fermée
        - Le sens horaire ajoute de l’amortissement, le sens antihoraire en retire
      description_it: |-
        - Circuiti indipendenti di compressione ad alta velocità, di compressione a bassa velocità e di ritorno, tutti regolabili dall’esterno
        - 10 posizioni per regolatore, contate a partire dalla posizione completamente chiusa
        - Il senso orario aumenta lo smorzamento, il senso antiorario lo riduce
      description_es: |-
        - Circuitos independientes de compresión de alta velocidad, de compresión de baja velocidad y de rebote, todos ajustables desde el exterior
        - 10 posiciones por ajuste, contadas desde la posición totalmente cerrada
        - El sentido horario añade amortiguación y el antihorario la quita
      description_pt: |-
        - Circuitos independentes de compressão de alta velocidade, de compressão de baixa velocidade e de retorno, todos ajustáveis externamente
        - 10 posições por ajuste, contadas a partir da posição totalmente fechada
        - O sentido horário aumenta o amortecimento e o anti-horário o reduz
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 10, notes: High-Speed Compression, notes_de: High-Speed-Druckstufe, notes_fr: Compression haute vitesse, notes_it: Compressione ad alta velocità, notes_es: Compresión de alta velocidad, notes_pt: Compressão de alta velocidade, dialColor: grey }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 10, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade, dialColor: orange, dialSize: small }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 10, notes: Low-Speed Rebound, notes_de: Low-Speed-Zugstufe, notes_fr: Détente basse vitesse, notes_it: Ritorno a bassa velocità, notes_es: Rebote de baja velocidad, notes_pt: Retorno de baixa velocidade, dialColor: orange }
      source: https://cdn.shopify.com/s/files/1/0579/5987/4639/files/HelmMKII_UserManual_04_03_2025.pdf
      note: >-
        Helm MKII instruction manual (rev. 04/03/2025), "Fork Features Overview
        → Damping Adjustments", p. 6: Compression Low Speed 10 Positions,
        Compression High Speed 10 Positions, Rebound Low Speed 10 Positions.
        Cane Creek labels Rebound Low Speed the fork's single rebound circuit (no
        separate high-speed rebound adjuster). This replaces the earlier 10/17/10 figure in this file — LSC 17 is the
        first-generation Helm number (see helm_mk1_damper), not the MKII's.
        Same cartridge spec covers Helm MKII Air, Helm MKII Coil and the Helm
        Works Series, which are all documented by this one manual.

    helm_mk1_damper:
      name: Helm Damper (MK1)
      description: |-
        - First-generation Helm cartridge: separate High-Speed and Low-Speed Compression plus a single rebound circuit
        - 17 positions of Low-Speed Compression, 10 each of High-Speed Compression and rebound
        - Clockwise adds damping, counter-clockwise takes it away
      description_de: |-
        - Helm-Kartusche der ersten Generation: getrennte High-Speed- und Low-Speed-Druckstufe plus ein einzelner Zugstufenkreis
        - 17 Positionen für die Low-Speed-Druckstufe, je 10 für High-Speed-Druckstufe und Zugstufe
        - Im Uhrzeigersinn erhöht die Dämpfung, gegen den Uhrzeigersinn verringert sie
      description_fr: |-
        - Cartouche Helm de première génération : compression haute vitesse et compression basse vitesse séparées, plus un seul circuit de détente
        - 17 positions de compression basse vitesse, 10 pour la compression haute vitesse et 10 pour la détente
        - Le sens horaire ajoute de l’amortissement, le sens antihoraire en retire
      description_it: |-
        - Cartuccia Helm di prima generazione: compressione ad alta e a bassa velocità separate, più un solo circuito di ritorno
        - 17 posizioni di compressione a bassa velocità, 10 sia per la compressione ad alta velocità sia per il ritorno
        - Il senso orario aumenta lo smorzamento, il senso antiorario lo riduce
      description_es: |-
        - Cartucho Helm de primera generación: compresión de alta y de baja velocidad por separado, más un único circuito de rebote
        - 17 posiciones de compresión de baja velocidad, 10 de compresión de alta velocidad y 10 de rebote
        - El sentido horario añade amortiguación y el antihorario la quita
      description_pt: |-
        - Cartucho Helm de primeira geração: compressão de alta e de baixa velocidade separadas, mais um único circuito de retorno
        - 17 posições de compressão de baixa velocidade, 10 de compressão de alta velocidade e 10 de retorno
        - O sentido horário aumenta o amortecimento e o anti-horário o reduz
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 10, notes: High-Speed Compression, notes_de: High-Speed-Druckstufe, notes_fr: Compression haute vitesse, notes_it: Compressione ad alta velocità, notes_es: Compresión de alta velocidad, notes_pt: Compressão de alta velocidade, dialColor: grey }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 17, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade, dialColor: orange, dialSize: small }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 10, notes: Low-Speed Rebound, notes_de: Low-Speed-Zugstufe, notes_fr: Détente basse vitesse, notes_it: Ritorno a bassa velocità, notes_es: Rebote de baja velocidad, notes_pt: Retorno de baixa velocidade, dialColor: orange }
      source: https://cdn.shopify.com/s/files/1/0579/5987/4639/files/Helm_UserManual_1_12_18_FINAL_4a8c4476-2bc0-4f03-ae32-0ced7f5f3137.pdf
      note: >-
        Helm (original) instruction manual, rev. 01/12/2018, "Damping
        Adjustments" table, p. 5: Compression Low Speed 17 Clicks, Compression
        High Speed 10 Clicks, Rebound Low Speed 10 Clicks. Cane Creek labels it the fork's single
        rebound circuit. Distinct from the
        MKII cartridge, which the 2025 MKII manual lists as 10/10/10.

    helm_dj_damper:
      name: Helm DJ Damper
      description: >-
        Dirt-jump tune of the Helm cartridge, set up firm for repeated hard landings.
      description_de: >-
        Dirt-Jump-Abstimmung der Helm-Kartusche, fest ausgelegt für wiederholte
        harte Landungen.
      description_fr: Réglage dirt jump de la cartouche Helm, réglée ferme pour les atterrissages durs répétés.
      description_it: Taratura dirt jump della cartuccia Helm, impostata rigida per ripetuti atterraggi duri.
      description_es: Tarado dirt jump del cartucho Helm, ajustado firme para aterrizajes duros repetidos.
      description_pt: Calibragem dirt jump do cartucho Helm, ajustada firme para aterrissagens duras repetidas.
      missing_adjustments: [Compression]
      missing_adjustments_de: [Druckstufe]
      missing_adjustments_fr: [Compression]
      missing_adjustments_it: [Compressione]
      missing_adjustments_es: [Compresión]
      missing_adjustments_pt: [Compressão]
      adjustments:
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 10, notes: "Counted from fully closed; estimated maximum, check your dial and edit it if it differs", notes_de: "Von ganz geschlossen gezählt; geschätztes Maximum, am Drehrad prüfen und bei Abweichung anpassen", notes_fr: "Compté depuis la position entièrement fermée ; maximum estimé, vérifiez votre cadran et modifiez-le s’il diffère", notes_it: "Contato a partire dalla posizione completamente chiusa; massimo stimato, controlla la tua manopola e modificalo se è diverso", notes_es: "Contado desde la posición totalmente cerrada; máximo estimado, comprueba tu dial y edítalo si es distinto", notes_pt: "Contado a partir da posição totalmente fechada; máximo estimado, confira o seu seletor e edite-o se for diferente" }
      source: https://www.canecreek.com/products/helm-dj
      note: >-
        canecreek.com/products/helm-dj documents only a recommended rebound
        dial-in window ("between 5 and 10 clicks from closed", at 95-125 psi) and
        names no compression adjuster; no total click range is given anywhere on
        the page, and the Helm DJ has no entry on canecreek.com/pages/forks-
        product-support. Estimate: rebound counts from fully closed, so the
        window's highest value, 10, is used as the maximum; the true total may be
        higher. It is not inherited from the MKII's 10/10/10.

# --------------------------------------------------------------------------
# Setup guides — the manuals' starting points as data (SCHEMA.md, "Setup
# guides"), transcribed from docs/research/setup_guides/canecreek.md. Cane
# Creek prints no weight table for the air spring, only a share of the rider's
# weight in lb read as psi; the rows are calculated from it at 5 kg steps.
# No Helm manual prints damper starting clicks.
# --------------------------------------------------------------------------
guides:
  canecreek_helm_mkii_2025:
    label: Cane Creek Helm MKII user manual (2025)
    label_de: Cane Creek Helm MKII Bedienungsanleitung (2025)
    label_fr: Manuel d’utilisation Cane Creek Helm MKII (2025)
    label_it: Manuale d’uso Cane Creek Helm MKII (2025)
    label_es: Manual del usuario Cane Creek Helm MKII (2025)
    label_pt: Manual do usuário Cane Creek Helm MKII (2025)
    source: https://cdn.shopify.com/s/files/1/0579/5987/4639/files/HelmMKII_UserManual_04_03_2025.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          50: [33, 44], 55: [36, 49], 60: [40, 53], 65: [43, 57], 70: [46, 62],
          75: [50, 66], 80: [53, 71], 85: [56, 75], 90: [60, 79], 95: [63, 84],
          100: [66, 88], 105: [69, 93], 110: [73, 97], 115: [76, 101], 120: [79, 106]
        }
        note: Calculated from Cane Creek's starting point (30-40 % of rider weight in lb, as psi); set the final pressure by SAG
        note_de: Berechnet aus dem Ausgangspunkt von Cane Creek (30-40 % des Fahrergewichts in lb, als psi); den endgültigen Druck über den SAG einstellen
        note_fr: Calculé à partir du point de départ de Cane Creek (30-40 % du poids du pilote en lb, en psi) ; réglez la pression finale au SAG
        note_it: Calcolato dal punto di partenza di Cane Creek (30-40 % del peso del rider in lb, come psi); regola la pressione finale in base al SAG
        note_es: Calculado a partir del punto de partida de Cane Creek (30-40 % del peso del rider en lb, como psi); ajusta la presión final según el SAG
        note_pt: Calculado a partir do ponto de partida da Cane Creek (30-40 % do peso do rider em lb, como psi); defina a pressão final pelo SAG
      # Rider weight to spring from the Helm MKII Coil product page. Its bounds
      # overlap as printed (90-120, 120-160 ...), read as half-open brackets.
      - target: spring_rate
        unit: lbs/in
        input: rider_weight
        input_unit: lb
        rows: { 90-120: 35, 120-160: 45, 160-200: 55, 200-240: 65 }
      - { target: sag, range: [15, 25], comfort_at: max, when: { trim: air } }
      - { target: sag, range: [10, 25], comfort_at: max, when: { trim: coil } }
      # The factory Volume Adjustment position is left out: the launch post
      # says 2 of 8 notches, the current support article says no piston.

  canecreek_helm_mk1_2018:
    label: Cane Creek Helm user manual (2018)
    label_de: Cane Creek Helm Bedienungsanleitung (2018)
    label_fr: Manuel d’utilisation Cane Creek Helm (2018)
    label_it: Manuale d’uso Cane Creek Helm (2018)
    label_es: Manual del usuario Cane Creek Helm (2018)
    label_pt: Manual do usuário Cane Creek Helm (2018)
    source: https://cdn.shopify.com/s/files/1/0579/5987/4639/files/Helm_UserManual_1_12_18_FINAL_4a8c4476-2bc0-4f03-ae32-0ced7f5f3137.pdf
    # The manual maps no spring rate to rider weight; the Helm MKII Coil chart
    # is not applied to the MK1.
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          50: 55, 55: 61, 60: 66, 65: 72, 70: 77,
          75: 83, 80: 88, 85: 94, 90: 99, 95: 105,
          100: 110, 105: 116, 110: 121, 115: 127, 120: 132
        }
        note: Calculated from Cane Creek's starting point (half the rider weight in lb, as psi); set the final pressure by SAG
        note_de: Berechnet aus dem Ausgangspunkt von Cane Creek (halbes Fahrergewicht in lb, als psi); den endgültigen Druck über den SAG einstellen
        note_fr: Calculé à partir du point de départ de Cane Creek (la moitié du poids du pilote en lb, en psi) ; réglez la pression finale au SAG
        note_it: Calcolato dal punto di partenza di Cane Creek (metà del peso del rider in lb, come psi); regola la pressione finale in base al SAG
        note_es: Calculado a partir del punto de partida de Cane Creek (la mitad del peso del rider en lb, como psi); ajusta la presión final según el SAG
        note_pt: Calculado a partir do ponto de partida da Cane Creek (metade do peso do rider em lb, como psi); defina a pressão final pelo SAG
      - { target: sag, range: [15, 25], comfort_at: max, when: { trim: air } }
      - { target: sag, range: [10, 25], comfort_at: max, when: { trim: coil } }

  canecreek_helm_dj_2025:
    label: Cane Creek Helm DJ setup recommendations
    label_de: Cane Creek Helm DJ Setup-Empfehlungen
    label_fr: Recommandations de setup Cane Creek Helm DJ
    label_it: Consigli per il setup Cane Creek Helm DJ
    label_es: Recomendaciones de setup Cane Creek Helm DJ
    label_pt: Recomendações de setup Cane Creek Helm DJ
    source: https://www.canecreek.com/products/helm-dj
    # Windows without a rider weight mapping: the midpoint is applied.
    rules:
      - { target: pressure, unit: psi, value: [95, 125], note: Pick the end that suits your weight and preferred ride height, note_de: "Das Ende wählen, das zu deinem Gewicht und deiner bevorzugten Fahrhöhe passt", note_fr: Choisissez l’extrémité qui convient à votre poids et à la hauteur de conduite que vous préférez, note_it: Scegli l’estremo che si adatta al tuo peso e all’altezza di guida che preferisci, note_es: Elige el extremo que se adapte a tu peso y a la altura de conducción que prefieras, note_pt: Escolha o extremo que combina com o seu peso e com a altura de pilotagem que prefere }
      - { target: rebound, value: [5, 10] }

# --------------------------------------------------------------------------
# Forks — current (2025/2026) lineup plus the first-generation Helm. Cane
# Creek's carbon "Invert" gravel fork is out of scope (drop-bar gravel, not a
# mountain-bike suspension fork).
# --------------------------------------------------------------------------
nodes:
  - label: "Helm MKII"
    level: model
    category: Downcountry / Trail / Enduro
    category_de: Downcountry / Trail / Enduro
    category_fr: Downcountry / Trail / Enduro
    category_it: Downcountry / Trail / Enduro
    category_es: Downcountry / Trail / Enduro
    category_pt: Downcountry / Trail / Enduro
    tasks: &helm_service
      fork:lower_leg_service: { interval: { moving_time_h: 50 }, source: Cane Creek Helm manual, source_de: Cane-Creek-Helm-Handbuch, source_fr: Manuel Cane Creek Helm, source_it: Manuale Cane Creek Helm, source_es: Manual Cane Creek Helm, source_pt: Manual Cane Creek Helm }
      fork:full_service: { interval: { moving_time_h: 100 }, source: Cane Creek Helm manual, source_de: Cane-Creek-Helm-Handbuch, source_fr: Manuel Cane Creek Helm, source_it: Manuale Cane Creek Helm, source_es: Manual Cane Creek Helm, source_pt: Manual Cane Creek Helm }
    children:
      - label: "2020–2026"
        level: generation
        id: "2020"
        years: "2020-2026"
        url: https://www.canecreek.com/products/helm-mkii
        setup_guide: https://cdn.shopify.com/s/files/1/0579/5987/4639/files/HelmMKII_UserManual_04_03_2025.pdf
        guide: canecreek_helm_mkii_2025
        children:
          - label: Air
            level: trim
            specs: { stanchion: 35mm, stanchion_de: 35mm, stanchion_fr: 35mm, stanchion_it: 35mm, stanchion_es: 35mm, stanchion_pt: 35mm, spring: Air, spring_de: Luft, spring_fr: Air, spring_it: Aria, spring_es: Aire, spring_pt: Ar }
            adjustments: &helm_air_spring
              - { name: Pressure, name_de: Luftdruck, name_fr: Pression d’air, name_it: Pressione dell’aria, name_es: Presión de aire, name_pt: Pressão do ar, type: numerical, unit: psi, min: 30, max: 150, notes: "30 psi minimum, 150 psi maximum; Cane Creek recommends 15-25% sag", notes_de: "Minimum 30 psi, Maximum 150 psi; Cane Creek empfiehlt 15-25 % SAG", notes_fr: "30 psi minimum, 150 psi maximum ; Cane Creek recommande 15-25 % de SAG", notes_it: "Minimo 30 psi, massimo 150 psi; Cane Creek consiglia un SAG del 15-25 %", notes_es: "Mínimo 30 psi, máximo 150 psi; Cane Creek recomienda un SAG del 15-25 %", notes_pt: "Mínimo 30 psi, máximo 150 psi; a Cane Creek recomenda 15-25 % de SAG" }
              - { name: Volume Adjustment, name_de: Volumenanpassung, name_fr: Réglage du volume, name_it: Regolazione del volume, name_es: Ajuste del volumen, name_pt: Ajuste de volume, type: step, max: 8, visualization: stepper, notes: Indexed rod/piston (not stackable spacers) — higher notch count = more progressive. Factory default is 2 of 8 notches down., notes_de: "Indexierte Stange/Kolben (keine stapelbaren Spacer) — mehr Rasten = progressiver. Werkseinstellung: 2 von 8 Rasten abgesenkt.", notes_fr: "Tige/piston indexé (pas d’entretoises empilables) — plus il y a de crans, plus c’est progressif. Réglage d’usine : 2 crans sur 8.", notes_it: "Asta/pistone indicizzato (non distanziali impilabili) — più scatti, più progressività. Impostazione di fabbrica: 2 scatti su 8.", notes_es: "Varilla/pistón indexado (no espaciadores apilables) — cuantas más muescas, más progresivo. De fábrica: 2 de 8 muescas.", notes_pt: "Haste/pistão indexado (não espaçadores empilháveis) — quanto mais cliques, mais progressivo. Padrão de fábrica: 2 de 8 cliques." }
            options:
              damper: [helm_mkii_damper]
              travel_mm: [100, 110, 120, 130, 140, 150, 160, 170]
              wheel_size: [29, 27.5]
            note: 29in offered in 120-160mm; 27.5in offered in 130-170mm (10mm internal increments, no extra parts required). Up to seven 10mm travel reducers allow settings down to 100mm.
            note_de: 29in in 120-160mm erhältlich; 27.5in in 130-170mm erhältlich (10mm-Schritte intern, keine zusätzlichen Teile nötig). Bis zu sieben 10mm-Federwegreduzierer erlauben Einstellungen bis hinunter auf 100mm.
            note_fr: 29" proposé en 120-160 mm ; 27,5" proposé en 130-170 mm (paliers internes de 10 mm, aucune pièce supplémentaire requise). Jusqu’à sept réducteurs de débattement de 10 mm permettent des réglages jusqu’à 100 mm.
            note_it: 29" disponibile in 120-160 mm; 27,5" disponibile in 130-170 mm (passi interni da 10 mm, nessun componente aggiuntivo necessario). Fino a sette riduttori di escursione da 10 mm permettono regolazioni fino a 100 mm.
            note_es: 29" disponible en 120-160 mm; 27,5" disponible en 130-170 mm (pasos internos de 10 mm, sin piezas adicionales). Hasta siete reductores de recorrido de 10 mm permiten ajustes hasta 100 mm.
            note_pt: 29" disponível em 120-160 mm; 27,5" disponível em 130-170 mm (passos internos de 10 mm, sem peças adicionais). Até sete redutores de curso de 10 mm permitem ajustes até 100 mm.
          - label: Coil
            level: trim
            url: https://www.canecreek.com/products/helm-mkii-coil
