# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - Lefty Ocho (100mm, 2018) click totals are the majority figure of three
#     editorial sources (BikeRadar and Brujula Bike 6 LSC / 23 LSR, Pinkbike
#     8 / 22); Cannondale's manual gives only a starting-rebound table (16 to 2
#     clicks out from closed). Replace with a service-guide total if one appears.
#   - Lefty Ocho 120 (2021) totals (7 LSC / 21 LSR) come from a single hands-on
#     test (Brujula Bike); Cannondale's product listing is quoted elsewhere with
#     six compression clicks. The manual's spec table (p.9) says air pressure max
#     250 psi but its recommendation table (p.10) says 200 psi, so no Pressure
#     maximum is set.
#   - Lefty Ocho 100 Ramp Clamp maximum count is not published (the Ocho 120's is 6),
#     so no Volume Spacers adjustment is declared for the 100mm trims.
#   - Lefty Oliver rebound maximum (11) is an ESTIMATE: the highest value of the
#     2020 (10) and 2025 40mm (11) manuals' rebound tables. The 40mm Oliver
#     (manual 195403: 700c only, Carbon/Alloy, Analog-Bike and E-Bike tables)
#     is not added as a generation yet. The 2020 supplement lists wheel sizes 650b and
#     700c, but the existing `29` / `27.5` option ids are kept. No `years` set
#     because the first year of this generation is not confirmed.
#   - Lefty Oliver (2016, original dual-crown, PBR) and Lefty Supermax / Supermax 2.0
#     / Olaf / Hybrid / Lefty (2011-2012) generations have manuals on the same page
#     but publish no click counts; not added. Lefty 2.0 has no confirmed production
#     years either (the manual is the 2016 supplement) so `years` is omitted; its
#     rebound dial has no click count, so the generation stays `draft: true`.
# --------------------------------------------------------------------------
