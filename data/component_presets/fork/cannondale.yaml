          - Il volume della molla pneumatica si regola con Ramp Rings sul supporto (serve un attrezzo speciale)
          - Aggiungi aria a piccoli passi e fai lavorare la forcella su tutta l’escursione tra un passo e l’altro
          - Lockout sulla parte alta dello stelo con blow-off
        note_es: |-
          - Horquilla gravel de una sola pierna con 30 mm de recorrido y offset de 55 mm; necesita un buje Lefty 50
          - El volumen del muelle neumático se ajusta con Ramp Rings en el soporte (hace falta una herramienta especial)
          - Añade aire en pequeños pasos y comprime la horquilla por todo su recorrido entre un paso y otro
          - Lockout en la parte superior de la pierna con blow-off
        note_pt: |-
          - Garfo gravel de uma perna só com 30 mm de curso e offset de 55 mm; exige um cubo Lefty 50
          - O volume da mola a ar é ajustado com Ramp Rings no suporte (é preciso uma ferramenta especial)
          - Adicione ar em pequenos passos e comprima o garfo por todo o curso entre um passo e outro
          - Lockout na parte superior da perna com blow-off

