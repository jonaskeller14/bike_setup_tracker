              - Telaio in carbonio, offset di 50 mm sul 27,5" e di 55 mm sul 29"
              - Una sola valvola SideCar carica la molla pneumatica e la camera negativa si equilibra da sola
              - I Ramp Clamps opzionali aggiungono progressività a fine corsa
              - Lockout remoto con modalità Descend e Climb, attacco freno a sgancio rapido StopLock
            note_es: |-
              - Horquilla XC de una sola pierna y corona simple sobre rodamientos de agujas triangulados; necesita un buje Lefty 60
              - Chasis de carbono, offset de 50 mm en 27,5" y de 55 mm en 29"
              - Una sola válvula SideCar carga el muelle neumático y la cámara negativa se equilibra sola
              - Los Ramp Clamps opcionales añaden progresividad al final del recorrido
              - Lockout remoto con modos Descend y Climb, anclaje de freno de liberación rápida StopLock
            note_pt: |-
              - Garfo XC de uma perna só e coroa simples sobre rolamentos de agulhas triangulados; exige um cubo Lefty 60
              - Chassi de carbono, offset de 50 mm no 27,5" e de 55 mm no 29"
              - Uma única válvula SideCar carrega a mola a ar e a câmara negativa se equaliza sozinha
              - Os Ramp Clamps opcionais acrescentam progressividade no fim do curso
              - Lockout remoto com modos Descend e Climb, fixação de freio de liberação rápida StopLock
          - label: Alloy
            level: trim
            specs: { spring: Air, spring_de: Luft, spring_fr: Air, spring_it: Aria, spring_es: Aire, spring_pt: Ar }
            adjustments: *ocho_air_spring
