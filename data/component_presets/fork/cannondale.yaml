              - Single-leg, single-crown XC fork on triangulated needle bearings; needs a Lefty 60 hub
              - Carbon chassis, 50mm offset on 27.5in and 55mm on 29in
              - One SideCar valve charges the air spring and the negative chamber equalizes itself
              - Optional Ramp Clamps add progression near the end of the stroke
