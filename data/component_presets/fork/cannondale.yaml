      fork:damper_inspection: { name: "Air spring & damper inspection", preselected: true, interval: { moving_time_h: 100 }, fallback: { days: 365 }, source: Lefty Oliver owner's manual }
      fork:full_service: { interval: { moving_time_h: 200 }, source: Lefty Oliver owner's manual }
    children:
      - label: Carbon
        level: trim
        specs: { spring: Air }
        adjustments:
          - { name: Pressure, type: numerical, unit: psi, min: 50, max: 200 }
          - { name: Volume Spacers, type: step, max: 6, visualization: stepper, notes: "Ramp Rings on the air-piston carrier; three are fitted as standard" }
        options:
          damper: [oliver]
          travel_mm: [30]
          wheel_size: [29, 27.5]
        note: |-
          - Single-leg gravel fork with 30mm of travel and a 55mm offset; needs a Lefty 50 hub
          - Air spring volume is tuned with Ramp Rings on the carrier (a special tool is needed)
          - Add air in small steps and cycle the fork through its travel between each step
          - Lockout on top of the leg with blow-off

