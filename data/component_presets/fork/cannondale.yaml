        High-flow Chamber damper with a crown-top Low Speed Compression dial, a
        rebound dial at the bottom of the leg and a remote lockout.
      description_de: >-
        Chamber-Dämpfer mit hohem Durchfluss, Low-Speed-Druckstufenrad oben an
        der Gabelbrücke, Zugstufenrad unten am Gabelbein und
        Fernbedienungs-Lockout.
      description_fr: Amortisseur Chamber à fort débit avec une molette de compression basse vitesse sur le dessus du té, une molette de détente en bas de la jambe et un lockout déporté.
      description_it: Ammortizzatore Chamber ad alto flusso con una manopola di compressione a bassa velocità sopra la piastra, una manopola del ritorno in basso sullo stelo e un lockout remoto.
      description_es: Amortiguador Chamber de alto flujo con una rueda de compresión de baja velocidad en la parte superior de la corona, una rueda de rebote en la parte inferior de la pierna y un lockout remoto.
      description_pt: Amortecedor Chamber de alto fluxo com um seletor de compressão de baixa velocidade no alto da coroa, um seletor de retorno na parte inferior da perna e um lockout remoto.
      adjustments:
        - { name: Compression, name_de: Druckstufe, name_fr: Compression, name_it: Compressione, name_es: Compresión, name_pt: Compressão, type: step, max: 7, notes: "Low-Speed Compression; black knob on top of the crown, clockwise (+) = harder to compress; do not force past the stops", notes_de: "Low-Speed-Druckstufe; schwarzer Knopf oben auf der Gabelbrücke, im Uhrzeigersinn (+) = schwerer einfedernd; nicht über die Anschläge hinaus drehen", notes_fr: "Compression basse vitesse ; molette noire sur le dessus du té, sens horaire (+) = plus dur à comprimer ; ne forcez pas au-delà des butées", notes_it: "Compressione a bassa velocità; manopola nera sopra la piastra, senso orario (+) = più dura da comprimere; non forzare oltre i fine corsa", notes_es: "Compresión de baja velocidad; rueda negra en la parte superior de la corona, sentido horario (+) = más dura de comprimir; no fuerces más allá de los topes", notes_pt: "Compressão de baixa velocidade; seletor preto no alto da coroa, sentido horário (+) = mais dura de comprimir; não force além dos batentes" }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 21, notes: "Low-Speed Rebound; counted in clicks out from fully closed (slowest)", notes_de: Low-Speed-Zugstufe; in Klicks von ganz geschlossen (am langsamsten) aus gezählt, notes_fr: Détente basse vitesse ; comptée en clics depuis la position entièrement fermée (la plus lente), notes_it: Ritorno a bassa velocità; contato in scatti a partire dalla posizione completamente chiusa (il più lento), notes_es: Rebote de baja velocidad; contado en clics desde la posición totalmente cerrada (el más lento), notes_pt: Retorno de baixa velocidade; contado em cliques a partir da posição totalmente fechada (o mais lento) }
      source:
        - https://www.cannondale.com/en/gear/components/suspension/lefty-ocho/lefty-ocho-120-carbon
        - https://www.cannondale.com/en-gb/owners-manuals/-/media/files/manual-uploads/my21/021_138227_oms_lefty%20ocho_120_pdfs_021_138227_oms_lefty%20ocho_en.pdf
        - https://en.brujulabike.com/testing-lefty-ocho-carbon-120-2021/
      note: >-
        Owner's manual 138227 (p.10, p.12-13) describes both dials (rebound counted out
        from SLOW, compression clockwise = harder) and a recommended-rebound table (17 to
        5 clicks out from slow) but no total. Totals from Brujula Bike's hands-on test: "a
        range of 21 clicks" of rebound and "the 7 clicks" of the crown compression dial.
        Not copied from the 100mm Ocho (6 / 23).

    oliver:
      name: Oliver
      description: >-
        Gravel-specific damper with a rebound knob at the bottom of the leg and a
        top-of-leg lockout that blows off if you hit an obstacle while locked.
      description_de: >-
        Gravel-spezifischer Dämpfer mit Zugstufenknopf unten am Gabelbein und
        einem Lockout oben am Gabelbein, der bei einem Hindernis im gesperrten
        Zustand durchschlägt (Blow-off).
      description_fr: Amortisseur spécifique gravel avec une molette de détente en bas de la jambe et un lockout en haut de la jambe qui se relâche si vous heurtez un obstacle en position verrouillée.
      description_it: Ammortizzatore specifico per il gravel con una manopola del ritorno in basso sullo stelo e un lockout in cima allo stelo che si sblocca se colpisci un ostacolo mentre è bloccato.
      description_es: Amortiguador específico para gravel con una rueda de rebote en la parte inferior de la pierna y un lockout en la parte superior que se libera si golpeas un obstáculo con él bloqueado.
      description_pt: Amortecedor específico para gravel com um seletor de retorno na parte inferior da perna e um lockout no alto da perna que se libera se você bater em um obstáculo com ele travado.
      adjustments:
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 11, notes: "Counted in clicks out from fully closed (slowest); estimated maximum, check your dial and edit it if it differs", notes_de: "In Klicks von ganz geschlossen (am langsamsten) aus gezählt; geschätztes Maximum, am Drehrad prüfen und bei Abweichung anpassen", notes_fr: "Compté en clics depuis la position entièrement fermée (la plus lente) ; maximum estimé, vérifiez votre cadran et modifiez-le s’il diffère", notes_it: "Contato in scatti a partire dalla posizione completamente chiusa (la più lenta); massimo stimato, controlla la tua manopola e modificalo se è diverso", notes_es: "Contado en clics desde la posición totalmente cerrada (la más lenta); máximo estimado, comprueba tu dial y edítalo si es distinto", notes_pt: "Contado em cliques a partir da posição totalmente fechada (a mais lenta); máximo estimado, confira o seu seletor e edite-o se for diferente" }
      source:
        - https://www.cannondale.com/en/gear/components/suspension/lefty-oliver/lefty-oliver-carbon
        - https://www.bikeradar.com/reviews/components/forks/suspension-forks/cannondale-oliver-lefty-carbon-gravel-fork-review
        - https://www.cannondale.com/-/media/files/manual-uploads/MY21/137390%20Rev%201%20CD%20OMS%20MY21%20Lefty%20Oliver%20Folder_137390%20Rev%201%20CD%20OMS%20MY21%20Lefty%20Oliver_EU_EN.pdf
      note: >-
        Cannondale's product page lists "Air spring, rebound, and lockout (with blowoff),
        adjustments"; BikeRadar's review says "Rebound damping can be adjusted via a knob
        at the bottom of the fork leg". No total is published. Estimate: the 2020 Lefty
