              - Stelo superiore in carbonio, stelo inferiore in alluminio, offset di 50 mm, ruote da 29"
              - Una sola valvola SideCar carica la molla pneumatica e la camera negativa si equilibra da sola
              - I Ramp Clamps regolano quanto è progressivo il finale della corsa
              - Lockout remoto o sulla piastra, attacco freno a sgancio rapido StopLock
            note_es: |-
              - Horquilla de una sola pierna y corona simple sobre rodamientos de agujas triangulados; necesita un buje Lefty 60
              - Pierna superior de carbono, pierna inferior de aluminio, offset de 50 mm, ruedas de 29"
              - Una sola válvula SideCar carga el muelle neumático y la cámara negativa se equilibra sola
              - Los Ramp Clamps regulan lo progresivo que se siente el final del recorrido
              - Lockout remoto o en la corona, anclaje de freno de liberación rápida StopLock
            note_pt: |-
              - Garfo de uma perna só e coroa simples sobre rolamentos de agulhas triangulados; exige um cubo Lefty 60
              - Perna superior de carbono, perna inferior de alumínio, offset de 50 mm, rodas de 29"
              - Uma única válvula SideCar carrega a mola a ar e a câmara negativa se equaliza sozinha
              - Os Ramp Clamps regulam o quanto o fim do curso é progressivo
              - Lockout remoto ou na coroa, fixação de freio de liberação rápida StopLock

