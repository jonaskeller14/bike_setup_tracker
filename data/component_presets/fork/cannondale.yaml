              - Châssis carbone, déport de 50 mm en 27,5" et de 55 mm en 29"
              - Une seule valve SideCar gonfle le ressort pneumatique et la chambre négative s’équilibre toute seule
              - Les Ramp Clamps en option ajoutent de la progressivité en fin de course
              - Lockout à distance avec modes Descend et Climb, fixation de frein à démontage rapide StopLock
            note_it: |-
