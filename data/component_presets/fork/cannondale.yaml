# --------------------------------------------------------------------------
# Setup guides — transcribed from docs/research/setup_guides/cannondale.md.
#   * Every Lefty table is printed as single rider + gear weight points in lb
#     (kg rounded alongside), so rows are points in lb.
#   * Rebound is printed in clicks out from closed (slow), the catalog's own
#     counting direction, so it is encoded as published.
#   * The Lefty Ocho 120 manual (138227) is not encoded: its 230 lb row
#     (209 psi) exceeds the 200 psi limit printed on the same page, and its
#     two pressure maxima (250 / 200 psi) disagree.
#   * The Lefty Oliver 40mm manual (195403, 2025) has no catalog generation
#     (40mm travel, 700c only) and its second column is for e-bikes; not
#     encoded.
# --------------------------------------------------------------------------
guides:
  cannondale_lefty_ocho_2018:
    label: Lefty Ocho owner's manual supplement (2018)
    label_de: Lefty Ocho Bedienungsanleitung, Nachtrag (2018)
    label_fr: Supplément au manuel d’utilisation Lefty Ocho (2018)
    label_it: Supplemento al manuale d’uso Lefty Ocho (2018)
    label_es: Suplemento del manual del usuario Lefty Ocho (2018)
    label_pt: Suplemento do manual do usuário Lefty Ocho (2018)
    source: https://www.cannondale.com/-/media/files/manual-uploads/manuals/018_%20lefty%20ocho_134923_screen_en.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        rows: {
          100: 81, 110: 89, 120: 97, 130: 105, 140: 112, 150: 120, 160: 128,
          170: 136, 180: 143, 190: 151, 200: 159, 210: 167, 220: 174, 230: 182
        }
        note: Rider weight including riding gear
        note_de: Fahrergewicht inklusive Fahrausrüstung
        note_fr: Poids du pilote équipement compris
        note_it: Peso del rider compresa l’attrezzatura da guida
        note_es: Peso del rider incluido el equipo de pilotaje
        note_pt: Peso do rider incluindo o equipamento de pilotagem
      - target: rebound
        input: rider_weight
        input_unit: lb
        rows: {
          100: 16, 110: 15, 120: 14, 130: 13, 140: 11, 150: 10, 160: 9,
          170: 8, 180: 7, 190: 6, 200: 5, 210: 4, 220: 3, 230: 2
        }
      - { target: sag, value: 25 }

  cannondale_lefty_oliver_2020:
    label: Lefty Oliver owner's manual supplement (2020)
    label_de: Lefty Oliver Bedienungsanleitung, Nachtrag (2020)
    label_fr: Supplément au manuel d’utilisation Lefty Oliver (2020)
    label_it: Supplemento al manuale d’uso Lefty Oliver (2020)
    label_es: Suplemento del manual del usuario Lefty Oliver (2020)
    label_pt: Suplemento do manual do usuário Lefty Oliver (2020)
    source: https://www.cannondale.com/-/media/files/manual-uploads/MY21/137390%20Rev%201%20CD%20OMS%20MY21%20Lefty%20Oliver%20Folder_137390%20Rev%201%20CD%20OMS%20MY21%20Lefty%20Oliver_EU_EN.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        rows: {
          120: 70, 130: 76, 140: 79, 150: 85, 160: 88, 170: 94, 180: 97,
          190: 102, 200: 106, 210: 111, 220: 115, 230: 120, 240: 124, 250: 129
        }
        note: Rider weight including riding gear
        note_de: Fahrergewicht inklusive Fahrausrüstung
        note_fr: Poids du pilote équipement compris
        note_it: Peso del rider compresa l’attrezzatura da guida
        note_es: Peso del rider incluido el equipo de pilotaje
        note_pt: Peso do rider incluindo o equipamento de pilotagem
      - target: rebound
        input: rider_weight
        input_unit: lb
        rows: {
          120: 10, 130: 9, 140: 9, 150: 8, 160: 8, 170: 7, 180: 7,
          190: 6, 200: 6, 210: 5, 220: 5, 230: 4, 240: 4, 250: 4
        }
      - { target: sag, value: 0, note: The fork is set up to ride at the top of its travel, note_de: "Die Gabel ist so abgestimmt, dass sie im oberen Bereich ihres Federwegs fährt", note_fr: La fourche est réglée pour rouler en haut de son débattement, note_it: La forcella è impostata per lavorare nella parte alta dell’escursione, note_es: La horquilla está ajustada para rodar en la parte alta de su recorrido, note_pt: O garfo é ajustado para rodar na parte alta do curso }
      # Stock Ramp Ring count at 30mm travel (650b and 700c).
      - { target: volume_spacers, value: 3 }

  cannondale_lefty_2_0_2016:
    label: Lefty owner's manual supplement (2016)
    label_de: Lefty Bedienungsanleitung, Nachtrag (2016)
    label_fr: Supplément au manuel d’utilisation Lefty (2016)
    label_it: Supplemento al manuale d’uso Lefty (2016)
    label_es: Suplemento del manual del usuario Lefty (2016)
    label_pt: Suplemento do manual do usuário Lefty (2016)
    source: https://www.cannondale.com/-/media/files/manual-uploads/manuals/133095%20MY16%20LEFTY%20OMS_EN.pdf
    rules:
      # One column per printed travel / wheel combination; 120 and 130mm on
      # 29in wheels have no column. The `>240` row (`>162` / `>147` psi) is
      # left out: as a band to the 225 psi maximum it would apply a midpoint
      # far above the table's trend, so heavier riders are outside the table.
      # The `<120` row's `<71` becomes a band to the published 50 psi minimum.
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 100 }
        rows: {
          "<120": [min, 71], 120: 71, 130: 79, 140: 87, 150: 94, 160: 102, 170: 109,
          180: 117, 190: 125, 200: 132, 210: 140, 220: 147, 230: 155, 240: 162
