            note_de: |-
              - Aluminium-Chassis-Version der Ocho mit derselben Luftfeder und demselben Dämpfer
              - Schwerer als die Carbon-Gabel, ansonsten identisch einzustellen
            note_fr: |-
              - Version à châssis aluminium de l’Ocho, avec le même ressort pneumatique et le même amortisseur
              - Plus lourde que la fourche carbone, sinon réglée de la même façon
            note_it: |-
              - Versione con telaio in alluminio dell’Ocho, con la stessa molla pneumatica e lo stesso ammortizzatore
              - Più pesante della forcella in carbonio, per il resto regolata allo stesso modo
            note_es: |-
              - Versión con chasis de aluminio de la Ocho, con el mismo muelle neumático y el mismo amortiguador
              - Más pesada que la horquilla de carbono, por lo demás se ajusta igual
            note_pt: |-
              - Versão com chassi de alumínio da Ocho, com a mesma mola a ar e o mesmo amortecedor
              - Mais pesado que o garfo de carbono, no mais é ajustado da mesma forma

