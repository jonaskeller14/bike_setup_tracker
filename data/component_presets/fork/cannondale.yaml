      description_fr: Molette de détente sur le dessus de la jambe. Le mode Climb vient d’un bouton-poussoir sous la molette (PBR) ou d’une commande déportée RockShox XLoc au guidon (XLR).
      description_it: Manopola del ritorno in cima allo stelo. La modalità Climb si attiva con un pulsante sotto la manopola (PBR) o con un comando remoto RockShox XLoc al manubrio (XLR).
      description_es: Rueda de rebote en la parte superior de la pierna. El modo Climb viene de un pulsador bajo la rueda (PBR) o de un mando remoto RockShox XLoc en el manillar (XLR).
      description_pt: Seletor de retorno no alto da perna. O modo Climb vem de um botão sob o seletor (PBR) ou de um comando remoto RockShox XLoc no guidão (XLR).
      missing_adjustments: [Rebound]
      missing_adjustments_de: [Zugstufe]
      missing_adjustments_fr: [Détente]
      missing_adjustments_it: [Ritorno]
      missing_adjustments_es: [Rebote]
      missing_adjustments_pt: [Retorno]
      adjustments: []
      source:
        - https://www.cannondale.com/-/media/files/manual-uploads/manuals/133095%20MY16%20LEFTY%20OMS_EN.pdf
      note: >-
        2016 Lefty Owner's Manual Supplement 133095 p.13-14 describes the rebound dial
