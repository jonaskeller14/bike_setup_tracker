# Cannondale Lefty single-leg suspension forks — adjustment preset database
#
# Same design as fork/fox.yaml, fork/rockshox.yaml, fork/ext.yaml: click ranges
# belong to the DAMPER, defined once under `option_values.damper` and referenced by id from
# each fork's trims. See SCHEMA.md in this folder.
#
# Scope: Cannondale is a bike brand; the only suspension it builds itself is the
# Lefty family (single-leg, needle-bearing, "Delta Cage" triangulated telescope
# with a dedicated Lefty hub). The Fox / RockShox forks and shocks that spec on
# most Cannondale full-suspension bikes belong in fork/fox.yaml, fork/rockshox.yaml
# and the matching shock files. Cannondale currently sells no proprietary rear
# shock, so there is no shock/cannondale.yaml.
#
# Lefty air-spring notes (from Cannondale's Ocho / Ocho 120 owner's manual
# supplements): a single Schrader "SideCar" valve near the spindle charges the
# positive chamber and the negative chamber equalizes automatically once the fork
# has been compressed ~30mm five to ten times after every pressure change. There
# is no spacer / spring-rate hardware to swap on the outside like a telescopic
# fork; volume is tuned with "Ramp Clamps" (Ocho) / "Ramp Rings" (Oliver) on the
# air-piston carrier. Rebound is counted in clicks OUT FROM CLOSED (slow) on the
# Ocho and Ocho 120 tables.
#
# Click ranges: Cannondale's own manuals list recommended STARTING click values
# (a rider-weight table) but never state an adjuster's total range, so totals
# come from press coverage (Ocho, Ocho 120) or, for the Oliver, from the
# largest value of the manual's rebound table (an estimate). The Lefty 2.0 has
# no published count and stays without one. See Follow-ups.

brand: Cannondale
component_type: fork
sources:
  - https://www.cannondale.com/en/gear/components/suspension
  - https://www.cannondale.com/en/gear/components/suspension/lefty-ocho
  - https://www.cannondale.com/en/gear/components/suspension/lefty-ocho/lefty-ocho-120-carbon
  - https://www.cannondale.com/en/gear/components/suspension/lefty-oliver
  - https://www.cannondale.com/en/gear/components/suspension/lefty-oliver/lefty-oliver-carbon
  - https://www.cannondale.com/en-us/owners-manuals/lefty
  # Lefty Ocho Owner's Manual Supplement 134923 (2018), Specifications p.6, External Adjustments p.8, Rebound p.10, Compression p.11
  - https://www.cannondale.com/-/media/files/manual-uploads/manuals/018_%20lefty%20ocho_134923_screen_en.pdf
  # Lefty Ocho 120 Owner's Manual 138227 Rev 1 (01/2021), Specifications p.9, Adjustments p.10-13, parts list p.22
  - https://www.cannondale.com/en-gb/owners-manuals/-/media/files/manual-uploads/my21/021_138227_oms_lefty%20ocho_120_pdfs_021_138227_oms_lefty%20ocho_en.pdf
  # 2016 Lefty Owner's Manual Supplement 133095 (09/15), Safety Information p.2, Air pressure p.15, Rebound p.13-14
  - https://www.cannondale.com/-/media/files/manual-uploads/manuals/133095%20MY16%20LEFTY%20OMS_EN.pdf
  - https://www.bikeradar.com/news/everything-you-need-to-know-about-the-new-cannondale-lefty-ocho-fork
  - https://www.bikeradar.com/news/lefty-ocho-120-fork-debuts-on-cannondale-scalpel-se-ltd
  - https://www.bikeradar.com/reviews/components/forks/suspension-forks/cannondale-oliver-lefty-carbon-gravel-fork-review
  - https://www.pinkbike.com/news/cannondale-lefty-ocho-review-2018.html
  - https://en.brujulabike.com/test-fork-lefty-ocho/
  - https://en.brujulabike.com/testing-lefty-ocho-carbon-120-2021/
  # Lefty Oliver (2020) Owner's Manual Supplement 137390 Rev 1: Specifications p.9 (ramp rings, pressure limits), rebound table p.10
  - https://www.cannondale.com/-/media/files/manual-uploads/MY21/137390%20Rev%201%20CD%20OMS%20MY21%20Lefty%20Oliver%20Folder_137390%20Rev%201%20CD%20OMS%20MY21%20Lefty%20Oliver_EU_EN.pdf
  # Primary — service intervals
  - https://www.cannondale.com/-/media/files/manual-uploads/manuals/015_LEFTY%20OLIVER%20OMS%20133320_EN.pdf
updated: 2026-10-13
# Service intervals (`tasks`) come from the Lefty owner's manual supplements:
#   * Ocho / Ocho 120: a "100 Hour Service" (telescope lubrication, air spring
#     service, damper inspection) every 100 hours or annually, and a full
#     service every 200 hours or every two years.
#   * Oliver (2016) / Lefty 2.0 (MY16): telescope lubrication every 100 hours,
#     an air spring and damper inspection every 100 (Oliver) or 50 (2.0) hours
#     or yearly, and a full service every 200 hours.
# A Lefty has no lower legs, so the telescope service is a brand-only task.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    chamber_ocho_2018:
      name: Chamber (Ocho 100)
      description: |-
        - Self-bleeding Chamber damper with an external Low Speed Compression knob on top of the crown
        - Low Speed Rebound dial at the bottom of the leg, counted in clicks out from fully closed
        - Handlebar remote lockout with Descend and Climb modes
      description_de: |-
        - Selbstentlüftender Chamber-Dämpfer mit externem Low-Speed-Druckstufenknopf oben an der Gabelbrücke
        - Low-Speed-Zugstufenrad unten am Gabelbein, in Klicks von ganz geschlossen aus gezählt
        - Lockout per Lenkerfernbedienung mit den Modi Descend und Climb
      description_fr: |-
        - Amortisseur Chamber à purge automatique avec une molette externe de compression basse vitesse sur le dessus du té
        - Molette de détente basse vitesse en bas de la jambe, comptée en clics depuis la position entièrement fermée
        - Lockout déporté au guidon avec modes Descend et Climb
      description_it: |-
        - Ammortizzatore Chamber a spurgo automatico con una manopola esterna di compressione a bassa velocità sopra la piastra
        - Manopola del ritorno a bassa velocità in basso sullo stelo, contata in scatti a partire dalla posizione completamente chiusa
        - Lockout remoto al manubrio con modalità Descend e Climb
      description_es: |-
        - Amortiguador Chamber de purga automática con una rueda externa de compresión de baja velocidad en la parte superior de la corona
        - Rueda de rebote de baja velocidad en la parte inferior de la pierna, contada en clics desde la posición totalmente cerrada
        - Lockout remoto en el manillar con modos Descend y Climb
      description_pt: |-
        - Amortecedor Chamber de sangria automática com um seletor externo de compressão de baixa velocidade no alto da coroa
        - Seletor de retorno de baixa velocidade na parte inferior da perna, contado em cliques a partir da posição totalmente fechada
        - Lockout remoto no guidão com modos Descend e Climb
      adjustments:
        - { name: Compression, name_de: Druckstufe, name_fr: Compression, name_it: Compressione, name_es: Compresión, name_pt: Compressão, type: step, max: 6, notes: "Low-Speed Compression; black knob on top of the crown, clockwise (+) = harder to compress; do not force past the stops", notes_de: "Low-Speed-Druckstufe; schwarzer Knopf oben auf der Gabelbrücke, im Uhrzeigersinn (+) = schwerer einfedernd; nicht über die Anschläge hinaus drehen", notes_fr: "Compression basse vitesse ; molette noire sur le dessus du té, sens horaire (+) = plus dur à comprimer ; ne forcez pas au-delà des butées", notes_it: "Compressione a bassa velocità; manopola nera sopra la piastra, senso orario (+) = più dura da comprimere; non forzare oltre i fine corsa", notes_es: "Compresión de baja velocidad; rueda negra en la parte superior de la corona, sentido horario (+) = más dura de comprimir; no fuerces más allá de los topes", notes_pt: "Compressão de baixa velocidade; seletor preto no alto da coroa, sentido horário (+) = mais dura de comprimir; não force além dos batentes" }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 23, notes: "Low-Speed Rebound; dial at the bottom of the leg, counted in clicks out from fully closed (slowest)", notes_de: "Low-Speed-Zugstufe; Rad unten am Gabelbein, in Klicks von ganz geschlossen (am langsamsten) aus gezählt", notes_fr: "Détente basse vitesse ; molette en bas de la jambe, comptée en clics depuis la position entièrement fermée (la plus lente)", notes_it: "Ritorno a bassa velocità; manopola in basso sullo stelo, contato in scatti a partire dalla posizione completamente chiusa (il più lento)", notes_es: "Rebote de baja velocidad; rueda en la parte inferior de la pierna, contado en clics desde la posición totalmente cerrada (el más lento)", notes_pt: "Retorno de baixa velocidade; seletor na parte inferior da perna, contado em cliques a partir da posição totalmente fechada (o mais lento)" }
      source:
        - https://www.cannondale.com/-/media/files/manual-uploads/manuals/018_%20lefty%20ocho_134923_screen_en.pdf
        - https://www.bikeradar.com/news/everything-you-need-to-know-about-the-new-cannondale-lefty-ocho-fork
        - https://en.brujulabike.com/test-fork-lefty-ocho/
        - https://www.pinkbike.com/news/cannondale-lefty-ocho-review-2018.html
      note: >-
        Adjuster direction and counting convention from Cannondale's Lefty Ocho manual
        supplement 134923 (Rebound p.10: close clockwise toward SLOW, then count clicks out
        toward FAST; Compression p.11). Cannondale's manual gives no total. Two editorial
        sources agree on 6 compression / 23 rebound: BikeRadar's launch article ("six clicks of
        compression adjustment and 23 clicks of rebound adjustment") and Brujula Bike's
        test ("6 modes of low speed compression", "23 rebound adjustment points").
        Pinkbike's review differs ("eight clicks of low-speed compression, twenty-two of
        low-speed rebound"); the majority figure is used. The manual's recommended-rebound
        table runs from 16 clicks (light riders) to 2 clicks (heavy riders).

