            note_de: |-
              - Einbein-XC-Gabel mit einer Brücke auf triangulierten Nadellagern; benötigt eine Lefty-60-Nabe
              - Carbon-Chassis, 50mm Offset bei 27.5in und 55mm bei 29in
              - Ein SideCar-Ventil befüllt die Luftfeder und die Negativkammer gleicht sich selbst aus
              - Optionale Ramp Clamps sorgen für mehr Progression gegen Ende des Federwegs
              - Fernbedienungs-Lockout mit den Modi Descend und Climb, StopLock-Schnellspann-Bremsaufnahme
            note_fr: |-
