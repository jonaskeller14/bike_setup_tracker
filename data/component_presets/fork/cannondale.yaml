# Cannondale Lefty single-leg suspension forks — adjustment preset database
#
# Same design as fork/fox.yaml, fork/rockshox.yaml, fork/ext.yaml: click ranges
# belong to the DAMPER, defined once under `option_values.damper` and referenced by id from
# each fork's trims. See SCHEMA.md in this folder.
#
# Scope: Cannondale is a bike brand; the only suspension it builds itself is the
# Lefty family (single-leg, needle-bearing, "Delta Cage" triangulated telescope
# with a dedicated Lefty hub). The Fox / RockShox forks and shocks that spec on
# most Cannondale full-suspension bikes belong in fork/fox.yaml, fork/rockshox.yaml
# and the matching shock files. Cannondale currently sells no proprietary rear
# shock, so there is no shock/cannondale.yaml.
#
# Lefty air-spring notes (from Cannondale's Ocho / Ocho 120 owner's manual
# supplements): a single Schrader "SideCar" valve near the spindle charges the
# positive chamber and the negative chamber equalizes automatically once the fork
# has been compressed ~30mm five to ten times after every pressure change. There
# is no spacer / spring-rate hardware to swap on the outside like a telescopic
# fork; volume is tuned with "Ramp Clamps" (Ocho) / "Ramp Rings" (Oliver) on the
# air-piston carrier. Rebound is counted in clicks OUT FROM CLOSED (slow) on the
# Ocho and Ocho 120 tables.
#
# Click ranges: Cannondale's own manuals list recommended STARTING click values
# (a rider-weight table) but never state an adjuster's total range, so totals
# come from press coverage (Ocho, Ocho 120) or, for the Oliver, from the
# largest value of the manual's rebound table (an estimate). The Lefty 2.0 has
# no published count and stays without one. See Follow-ups.

brand: Cannondale
component_type: fork
sources:
  - https://www.cannondale.com/en/gear/components/suspension
  - https://www.cannondale.com/en/gear/components/suspension/lefty-ocho
  - https://www.cannondale.com/en/gear/components/suspension/lefty-ocho/lefty-ocho-120-carbon
  - https://www.cannondale.com/en/gear/components/suspension/lefty-oliver
  - https://www.cannondale.com/en/gear/components/suspension/lefty-oliver/lefty-oliver-carbon
  - https://www.cannondale.com/en-us/owners-manuals/lefty
  # Lefty Ocho Owner's Manual Supplement 134923 (2018), Specifications p.6, External Adjustments p.8, Rebound p.10, Compression p.11
  - https://www.cannondale.com/-/media/files/manual-uploads/manuals/018_%20lefty%20ocho_134923_screen_en.pdf
  # Lefty Ocho 120 Owner's Manual 138227 Rev 1 (01/2021), Specifications p.9, Adjustments p.10-13, parts list p.22
  - https://www.cannondale.com/en-gb/owners-manuals/-/media/files/manual-uploads/my21/021_138227_oms_lefty%20ocho_120_pdfs_021_138227_oms_lefty%20ocho_en.pdf
  # 2016 Lefty Owner's Manual Supplement 133095 (09/15), Safety Information p.2, Air pressure p.15, Rebound p.13-14
  - https://www.cannondale.com/-/media/files/manual-uploads/manuals/133095%20MY16%20LEFTY%20OMS_EN.pdf
  - https://www.bikeradar.com/news/everything-you-need-to-know-about-the-new-cannondale-lefty-ocho-fork
  - https://www.bikeradar.com/news/lefty-ocho-120-fork-debuts-on-cannondale-scalpel-se-ltd
  - https://www.bikeradar.com/reviews/components/forks/suspension-forks/cannondale-oliver-lefty-carbon-gravel-fork-review
  - https://www.pinkbike.com/news/cannondale-lefty-ocho-review-2018.html
  - https://en.brujulabike.com/test-fork-lefty-ocho/
  - https://en.brujulabike.com/testing-lefty-ocho-carbon-120-2021/
  # Lefty Oliver (2020) Owner's Manual Supplement 137390 Rev 1: Specifications p.9 (ramp rings, pressure limits), rebound table p.10
  - https://www.cannondale.com/-/media/files/manual-uploads/MY21/137390%20Rev%201%20CD%20OMS%20MY21%20Lefty%20Oliver%20Folder_137390%20Rev%201%20CD%20OMS%20MY21%20Lefty%20Oliver_EU_EN.pdf
  # Primary — service intervals
  - https://www.cannondale.com/-/media/files/manual-uploads/manuals/015_LEFTY%20OLIVER%20OMS%20133320_EN.pdf
updated: 2026-10-13
# Service intervals (`tasks`) come from the Lefty owner's manual supplements:
#   * Ocho / Ocho 120: a "100 Hour Service" (telescope lubrication, air spring
#     service, damper inspection) every 100 hours or annually, and a full
#     service every 200 hours or every two years.
#   * Oliver (2016) / Lefty 2.0 (MY16): telescope lubrication every 100 hours,
#     an air spring and damper inspection every 100 (Oliver) or 50 (2.0) hours
#     or yearly, and a full service every 200 hours.
# A Lefty has no lower legs, so the telescope service is a brand-only task.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    chamber_ocho_2018:
      name: Chamber (Ocho 100)
      description: |-
        - Self-bleeding Chamber damper with an external Low Speed Compression knob on top of the crown
        - Low Speed Rebound dial at the bottom of the leg, counted in clicks out from fully closed
        - Handlebar remote lockout with Descend and Climb modes
      adjustments:
        - { name: Compression, type: step, max: 6, notes: "Low-Speed Compression; black knob on top of the crown, clockwise (+) = harder to compress; do not force past the stops" }
        - { name: Rebound, type: step, max: 23, notes: "Low-Speed Rebound; dial at the bottom of the leg, counted in clicks out from fully closed (slowest)" }
      source:
        - https://www.cannondale.com/-/media/files/manual-uploads/manuals/018_%20lefty%20ocho_134923_screen_en.pdf
        - https://www.bikeradar.com/news/everything-you-need-to-know-about-the-new-cannondale-lefty-ocho-fork
        - https://en.brujulabike.com/test-fork-lefty-ocho/
        - https://www.pinkbike.com/news/cannondale-lefty-ocho-review-2018.html
      note: >-
        Adjuster direction and counting convention from Cannondale's Lefty Ocho manual
        supplement 134923 (Rebound p.10: close clockwise toward SLOW, then count clicks out
        toward FAST; Compression p.11). Cannondale's manual gives no total. Two editorial
        sources agree on 6 compression / 23 rebound: BikeRadar's launch article ("six clicks of
        compression adjustment and 23 clicks of rebound adjustment") and Brujula Bike's
        test ("6 modes of low speed compression", "23 rebound adjustment points").
        Pinkbike's review differs ("eight clicks of low-speed compression, twenty-two of
        low-speed rebound"); the majority figure is used. The manual's recommended-rebound
        table runs from 16 clicks (light riders) to 2 clicks (heavy riders).

    chamber_ocho120_2021:
      name: Chamber (Ocho 120)
      description: >-
        High-flow Chamber damper with a crown-top Low Speed Compression dial, a
        rebound dial at the bottom of the leg and a remote lockout.
      adjustments:
        - { name: Compression, type: step, max: 7, notes: "Low-Speed Compression; black knob on top of the crown, clockwise (+) = harder to compress; do not force past the stops" }
        - { name: Rebound, type: step, max: 21, notes: "Low-Speed Rebound; counted in clicks out from fully closed (slowest)" }
      source:
        - https://www.cannondale.com/en/gear/components/suspension/lefty-ocho/lefty-ocho-120-carbon
        - https://www.cannondale.com/en-gb/owners-manuals/-/media/files/manual-uploads/my21/021_138227_oms_lefty%20ocho_120_pdfs_021_138227_oms_lefty%20ocho_en.pdf
        - https://en.brujulabike.com/testing-lefty-ocho-carbon-120-2021/
      note: >-
        Owner's manual 138227 (p.10, p.12-13) describes both dials (rebound counted out
        from SLOW, compression clockwise = harder) and a recommended-rebound table (17 to
        5 clicks out from slow) but no total. Totals from Brujula Bike's hands-on test: "a
        range of 21 clicks" of rebound and "the 7 clicks" of the crown compression dial.
        Not copied from the 100mm Ocho (6 / 23).

    oliver:
      name: Oliver
      description: >-
        Gravel-specific damper with a rebound knob at the bottom of the leg and a
        top-of-leg lockout that blows off if you hit an obstacle while locked.
      adjustments:
        - { name: Rebound, type: step, max: 11, notes: "Counted in clicks out from fully closed (slowest); estimated maximum, check your dial and edit it if it differs" }
      source:
        - https://www.cannondale.com/en/gear/components/suspension/lefty-oliver/lefty-oliver-carbon
        - https://www.bikeradar.com/reviews/components/forks/suspension-forks/cannondale-oliver-lefty-carbon-gravel-fork-review
        - https://www.cannondale.com/-/media/files/manual-uploads/MY21/137390%20Rev%201%20CD%20OMS%20MY21%20Lefty%20Oliver%20Folder_137390%20Rev%201%20CD%20OMS%20MY21%20Lefty%20Oliver_EU_EN.pdf
      note: >-
        Cannondale's product page lists "Air spring, rebound, and lockout (with blowoff),
        adjustments"; BikeRadar's review says "Rebound damping can be adjusted via a knob
        at the bottom of the fork leg". No total is published. Estimate: the 2020 Lefty
        Oliver owner's manual supplement 137390 (p.10) recommends 10 down to 4 clicks "out
        from slow" for 55-114 kg riders, and the 2025 Lefty Oliver 40mm owner's manual
        195403 (p.10) starts at 11; counted from the closed (slow) end, so the highest
        value (11) is used as the minimum total.

    lefty_2_2016:
      name: Lefty 2.0 (PBR / XLR)
      description: >-
        Rebound dial on top of the leg. Climb mode comes from a push button under the
        dial (PBR) or from a handlebar RockShox XLoc remote (XLR).
      missing_adjustments: [Rebound]
      adjustments: []
      source:
        - https://www.cannondale.com/-/media/files/manual-uploads/manuals/133095%20MY16%20LEFTY%20OMS_EN.pdf
      note: >-
        2016 Lefty Owner's Manual Supplement 133095 p.13-14 describes the rebound dial
        (rotate toward "+" to slow, "-" to speed up) for both control systems but gives no
        click count and no recommended-clicks table.

# --------------------------------------------------------------------------
# Setup guides — transcribed from docs/research/setup_guides/cannondale.md.
#   * Every Lefty table is printed as single rider + gear weight points in lb
#     (kg rounded alongside), so rows are points in lb.
#   * Rebound is printed in clicks out from closed (slow), the catalog's own
#     counting direction, so it is encoded as published.
#   * The Lefty Ocho 120 manual (138227) is not encoded: its 230 lb row
#     (209 psi) exceeds the 200 psi limit printed on the same page, and its
#     two pressure maxima (250 / 200 psi) disagree.
#   * The Lefty Oliver 40mm manual (195403, 2025) has no catalog generation
#     (40mm travel, 700c only) and its second column is for e-bikes; not
#     encoded.
# --------------------------------------------------------------------------
guides:
  cannondale_lefty_ocho_2018:
    label: Lefty Ocho owner's manual supplement (2018)
    source: https://www.cannondale.com/-/media/files/manual-uploads/manuals/018_%20lefty%20ocho_134923_screen_en.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        rows: {
          100: 81, 110: 89, 120: 97, 130: 105, 140: 112, 150: 120, 160: 128,
          170: 136, 180: 143, 190: 151, 200: 159, 210: 167, 220: 174, 230: 182
        }
        note: Rider weight including riding gear
      - target: rebound
        input: rider_weight
        input_unit: lb
        rows: {
          100: 16, 110: 15, 120: 14, 130: 13, 140: 11, 150: 10, 160: 9,
          170: 8, 180: 7, 190: 6, 200: 5, 210: 4, 220: 3, 230: 2
        }
      - { target: sag, value: 25 }

  cannondale_lefty_oliver_2020:
    label: Lefty Oliver owner's manual supplement (2020)
    source: https://www.cannondale.com/-/media/files/manual-uploads/MY21/137390%20Rev%201%20CD%20OMS%20MY21%20Lefty%20Oliver%20Folder_137390%20Rev%201%20CD%20OMS%20MY21%20Lefty%20Oliver_EU_EN.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        rows: {
          120: 70, 130: 76, 140: 79, 150: 85, 160: 88, 170: 94, 180: 97,
          190: 102, 200: 106, 210: 111, 220: 115, 230: 120, 240: 124, 250: 129
        }
        note: Rider weight including riding gear
      - target: rebound
        input: rider_weight
        input_unit: lb
        rows: {
          120: 10, 130: 9, 140: 9, 150: 8, 160: 8, 170: 7, 180: 7,
          190: 6, 200: 6, 210: 5, 220: 5, 230: 4, 240: 4, 250: 4
        }
      - { target: sag, value: 0, note: The fork is set up to ride at the top of its travel }
      # Stock Ramp Ring count at 30mm travel (650b and 700c).
      - { target: volume_spacers, value: 3 }

  cannondale_lefty_2_0_2016:
    label: Lefty owner's manual supplement (2016)
    source: https://www.cannondale.com/-/media/files/manual-uploads/manuals/133095%20MY16%20LEFTY%20OMS_EN.pdf
    rules:
      # One column per printed travel / wheel combination; 120 and 130mm on
      # 29in wheels have no column. The `>240` row (`>162` / `>147` psi) is
      # left out: as a band to the 225 psi maximum it would apply a midpoint
      # far above the table's trend, so heavier riders are outside the table.
      # The `<120` row's `<71` becomes a band to the published 50 psi minimum.
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 100 }
        rows: {
          "<120": [min, 71], 120: 71, 130: 79, 140: 87, 150: 94, 160: 102, 170: 109,
          180: 117, 190: 125, 200: 132, 210: 140, 220: 147, 230: 155, 240: 162
        }
        note: Rider weight including riding gear
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: [120, 130], wheel_size: "27.5" }
        rows: {
          "<120": 65, 120: 71, 130: 77, 140: 83, 150: 90, 160: 96, 170: 102,
          180: 109, 190: 115, 200: 121, 210: 128, 220: 134, 230: 140, 240: 147
        }
        note: Rider weight including riding gear
      - { target: sag, unit: mm, range: [25, 30], when: { travel_mm: 100 } }
      - { target: sag, unit: mm, range: [30, 35], when: { travel_mm: [120, 130], wheel_size: "27.5" } }

# --------------------------------------------------------------------------
# Forks — current Lefty lineup, then legacy.
