updated: 2026-10-22
# Service intervals (`tasks`) come from the user manuals cited above: a small
# service every 50 operating hours and a full service annually or after 200
# operating hours.
#
# Counting conventions:
#   * Rebound is counted from fully OPEN (fastest): the F 535 / F 535 ONE user
#     manual's rebound-recommendation table is headed "Rebound clicks (from
#     fully opened)". Clockwise = more damping.
#   * Compression is a single low-speed adjuster on top of the damper leg.
#     Fully open is "counterclockwise to the stop" and is DT Swiss's recommended
#     setting; turning clockwise adds damping. Counted from fully open.
#   * Click totals for the F 535 / F 535 ONE (12 compression, 29 rebound) come
#     from Enduro-MTB's 2023 first-ride review; DT Swiss's own pages and manuals
#     print the recommended settings but never the total.
#   * APT volume spacers: the maximum of three is DT Swiss's own limit
#     ("Never mount more than three volume spacers!").
#   * F 132 ONE rebound is counted from fully open as well ("Rebound klicks
#     (from fully opened)" in its user manual). The F 132 has no compression,
#     lockout or rebound adjuster and no user-adjustable volume spacer (the
#     technical manual shows one fixed spacer inside the stanchion), so it has
#     no damper entry.
#   * Service intervals of the F 132 / F 132 ONE (small service annually or 150
#     operating hours, full service every 2 years or 500 operating hours) are
#     identical in both user manuals and the F 132 ONE technical manual.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    incontrol_odl_plushport_2023:
      name: INCONTROL O.D.L. with PLUSHPORT
      description: |-
        - Travel-dependent low-speed compression: the first 30% of travel runs through an open bypass port for small-bump sensitivity, then closes progressively for mid-stroke support and bottom-out control
        - Lever with three modes: Open, Drive (partly closed compression) and Lock (with a blow-off valve)
        - External low-speed compression and rebound adjusters
      description_de: |-
        - Federwegabhängige Low-Speed-Druckstufe: die ersten 30 % des Federwegs laufen durch eine offene Bypassöffnung für Ansprechen bei kleinen Schlägen, danach schließt sie progressiv für Halt im mittleren Federweg und Kontrolle gegen Durchschlag
        - Hebel mit drei Modi: Open, Drive (teilweise geschlossene Druckstufe) und Lock (mit Blow-off-Ventil)
        - Externe Versteller für Low-Speed-Druckstufe und Zugstufe
      description_fr: |-
        - Compression basse vitesse dépendante du débattement : les premiers 30 % de course passent par un orifice de bypass ouvert pour la sensibilité aux petites bosses, puis il se ferme progressivement pour le soutien en milieu de course et le contrôle de fin de course
        - Levier à trois modes : Open, Drive (compression partiellement fermée) et Lock (avec une valve blow-off)
        - Réglages externes de compression basse vitesse et de détente
      description_it: |-
        - Compressione a bassa velocità dipendente dall’escursione: il primo 30 % della corsa passa attraverso una luce di bypass aperta per la sensibilità alle piccole asperità, poi si chiude progressivamente per il sostegno a metà corsa e il controllo del fondocorsa
        - Leva a tre modalità: Open, Drive (compressione parzialmente chiusa) e Lock (con una valvola blow-off)
        - Regolatori esterni di compressione a bassa velocità e di ritorno
      description_es: |-
        - Compresión de baja velocidad que depende del recorrido: el primer 30 % del recorrido pasa por un orificio de bypass abierto para la sensibilidad en pequeños baches y después se cierra progresivamente para dar apoyo en la parte media y controlar el final de carrera
        - Palanca de tres modos: Open, Drive (compresión parcialmente cerrada) y Lock (con una válvula blow-off)
        - Ajustes externos de compresión de baja velocidad y de rebote
      description_pt: |-
        - Compressão de baixa velocidade que depende do curso: os primeiros 30 % do curso passam por uma abertura de bypass aberta para sensibilidade em pequenas irregularidades e depois ela se fecha progressivamente para dar apoio no meio e controlar o fim de curso
        - Alavanca de três modos: Open, Drive (compressão parcialmente fechada) e Lock (com uma válvula blow-off)
        - Ajustes externos de compressão de baixa velocidade e de retorno
      adjustments:
        - { name: Compression Mode, name_de: Druckstufenmodus, name_fr: Mode de compression, name_it: Modalità di compressione, name_es: Modo de compresión, name_pt: Modo de compressão, type: categorical, options: [Open, Drive, Lock], options_de: [Offen, Drive, Lock], options_fr: [Ouvert, Drive, Lock], options_it: [Aperto, Drive, Lock], options_es: [Abierto, Drive, Lock], options_pt: [Aberto, Drive, Lock] }
        - { name: Compression, name_de: Druckstufe, name_fr: Compression, name_it: Compressione, name_es: Compresión, name_pt: Compressão, type: step, max: 12, notes: "Low-Speed Compression; Counted from fully open (softest); DT Swiss recommends fully open", notes_de: Low-Speed-Druckstufe; von ganz offen (am weichsten) gezählt; DT Swiss empfiehlt ganz offen, notes_fr: Compression basse vitesse ; comptée depuis la position entièrement ouverte (la plus souple) ; DT Swiss recommande entièrement ouvert, notes_it: Compressione a bassa velocità; contata a partire dalla posizione completamente aperta (la più morbida); DT Swiss consiglia completamente aperto, notes_es: Compresión de baja velocidad; contada desde la posición totalmente abierta (la más blanda); DT Swiss recomienda totalmente abierto, notes_pt: Compressão de baixa velocidade; contada a partir da posição totalmente aberta (a mais macia); a DT Swiss recomenda totalmente aberto }
