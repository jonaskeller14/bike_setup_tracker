# DT Swiss mountain-bike and gravel forks — adjustment preset database
#
# Same design as fork/fox.yaml and fork/rockshox.yaml: click ranges belong to
# the DAMPER cartridge, defined once under `option_values.damper` and referenced by id from
# each fork's trims. See SCHEMA.md in this folder.
#
# DT Swiss sells one model per family and no trim tiers, so every fork has a
# single "Standard" trim. Lever vs. remote and travel are ordering options, not
# separate trims.

brand: DT Swiss
component_type: fork
