#   - Fork rebound dial color: none of the F 535 / F 535 ONE / F 232 ONE
#     manuals or the approved reviews name it (the shock manuals do say "red
#     rebound wheel"), so the fork rebound adjusters carry no `dialColor`.
#     The F 232 ONE manual (sec. 4.3) names the compression adjuster "blue".
#   - F 232 ONE compression click count: DT Swiss's product page, user manual
#     (V2021.09) and technical manual publish no total and the manual has no
#     compression table, so it carries `max: ~`. The rebound maximum of 25 is
#     an estimate from the manual's rebound table (counted from fully open).
#     (Non-approved outlets - off-road.cc, Bike Perfect - quote figures; do not
#     use them without a primary or approved secondary source.)
#   - Pre-2023 F 535 ONE (2018-2022; 27.5" / 29", 44 or 51mm offset, HSC/LSC
#     knob under the crown cap): no click count is published by DT Swiss or an
#     approved outlet for that generation, and Enduro-MTB's 12/29 figures are
#     for the 2023 forks, so the generation is not listed. The user manual
#     V2021.08 (MAN_FXWXXXXX2019UMXXS_WEB_ZZ_001.pdf) would be the start point.
#   - Maximum air pressure is printed per travel in the user manuals (F 535
#     ONE 13.6-10.6 bar, F 535 13.2-10.2 bar, F 232 ONE 10.5-10 bar); Pressure
#     carries the highest value and the per-travel maxima in its notes.
#   - F 132 ONE rebound click count: DT Swiss publishes no total. The user
#     manual's rebound table runs 0-10 clicks from fully open, Rennrad-News and
#     Tour state 9 clicks. Carries `max: 10` as an estimate; check it on a real
#     fork. Compression Mode, the red rebound knob and the Open / Lock lever are
#     from the manual.
#   - F 132 / F 132 ONE model year: both user manuals are V2026 and the
#     magazine articles are dated 14 Oct 2026 ("ab sofort"), so the generation is
#     2026. The F 132 ONE first shipped on the Canyon Grail CFR RIFT; an earlier
#     year may exist but no manual shows it.
#   - F 132 / F 132 ONE e-bike pressure column (the user manuals print a second,
#     higher column) is not encoded, the catalog has no e-bike option.
