# --------------------------------------------------------------------------
# Setup guides — the user manuals' starting points as data (SCHEMA.md,
# "Setup guides"), transcribed from docs/research/setup_guides/dtswiss.md.
#   * Pressure: one rule per printed travel column, psi at 5 kg points. The
#     F 535 / F 535 ONE table is headed "system weight" without a definition;
#     it is read as rider weight with gear (its first row is 50 kg).
#   * Rebound: keyed by the fork's air pressure, counted from fully open as the
#     catalog dials are. The F 535 bands share their printed edges, so they are
#     written as contiguous brackets. The tables hold for about 25 °C; the cold
#     correction (open 6 clicks at 0 °C) is a note, temperature is no input.
#   * The setupguide.dtswiss.com app stays the `setup_guide` link: it is DT
#     Swiss's own rider-facing guide; the manuals are each guide's `source`.
# --------------------------------------------------------------------------
guides:
  dtswiss_f535_2023:
    label: DT Swiss F 535 / F 535 ONE user manual (2023)
    label_de: DT Swiss F 535 / F 535 ONE Bedienungsanleitung (2023)
    label_fr: Manuel d’utilisation DT Swiss F 535 / F 535 ONE (2023)
    label_it: Manuale d’uso DT Swiss F 535 / F 535 ONE (2023)
    label_es: Manual del usuario DT Swiss F 535 / F 535 ONE (2023)
    label_pt: Manual do usuário DT Swiss F 535 / F 535 ONE (2023)
    source: https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/04/85/7/MAN_FXD10000004857S_WEB_ZZ_001.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { damper: incontrol_odl_plushport_2023, travel_mm: 120 }
        rows: {
          50: 46, 55: 54, 60: 59, 65: 67, 70: 73,
          75: 80, 80: 86, 85: 93, 90: 99, 95: 106,
          100: 112, 105: 119, 110: 125, 115: 132, 120: 138,
          125: 145, 130: 151, 135: 158, 140: 164, 145: 171,
          150: 177
        }
