# DT Swiss mountain-bike and gravel forks — adjustment preset database
#
# Same design as fork/fox.yaml and fork/rockshox.yaml: click ranges belong to
# the DAMPER cartridge, defined once under `option_values.damper` and referenced by id from
# each fork's trims. See SCHEMA.md in this folder.
#
# DT Swiss sells one model per family and no trim tiers, so every fork has a
# single "Standard" trim. Lever vs. remote and travel are ordering options, not
# separate trims.

brand: DT Swiss
component_type: fork
sources:
  - https://www.dtswiss.com/en/suspension/forks/f-535-one
  - https://www.dtswiss.com/en/suspension/forks/f-535
  - https://www.dtswiss.com/en/suspension/forks/f-232-one
  - https://www.dtswiss.com/en/suspension/forks/f-132-one
  - https://www.dtswiss.com/en/suspension/forks/f-132
  - https://www.dtswiss.com/en/support/manuals
  - https://setupguide.dtswiss.com/en/
  # Primary — DT Swiss official user / technical manuals (PDF)
  - https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/04/85/7/MAN_FXD10000004857S_WEB_ZZ_001.pdf
  - https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/04/85/8/MAN_FXD10000004858S_WEB_EN_001.pdf
  - https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/05/10/2/MAN_FXD10000005102S_WEB_EN_001.pdf
  - https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/02/81/9/MAN_FXD10000002819S_WEB_ZZ_001.pdf
  - https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/02/82/0/MAN_FXD10000002820S_WEB_EN_001.pdf
  - https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/00/87/0/MAN_FXWXXXXXXXXXUMEXXS_WEB_EN_001.pdf
  - https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/06/17/6/MAN_FXD10000006176S_WEB_ZZ_001.pdf
  - https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/06/17/7/MAN_FXD10000006177S_WEB_EN_001.pdf
  - https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/07/78/8/MAN_FXD10000007788S_WEB_ZZ_001.pdf
  # Secondary — editorial (article body text only)
  - https://enduro-mtb.com/en/dt-swiss-f-535-and-f-535-one-forks-test/
  - https://www.pinkbike.com/news/first-ride-dt-swisss-new-232-one-platform.html
  - https://www.tour-magazin.de/rennraeder/gravel-bike/dt-swiss-f-132-f-132-one-gravel-federgabeln/
  - https://www.rennrad-news.de/news/dt-swiss-f-132-one-f-132-gravel-federgabel/
updated: 2026-10-22
# Service intervals (`tasks`) come from the user manuals cited above: a small
# service every 50 operating hours and a full service annually or after 200
# operating hours.
#
# Counting conventions:
#   * Rebound is counted from fully OPEN (fastest): the F 535 / F 535 ONE user
#     manual's rebound-recommendation table is headed "Rebound clicks (from
#     fully opened)". Clockwise = more damping.
#   * Compression is a single low-speed adjuster on top of the damper leg.
#     Fully open is "counterclockwise to the stop" and is DT Swiss's recommended
#     setting; turning clockwise adds damping. Counted from fully open.
#   * Click totals for the F 535 / F 535 ONE (12 compression, 29 rebound) come
#     from Enduro-MTB's 2023 first-ride review; DT Swiss's own pages and manuals
#     print the recommended settings but never the total.
#   * APT volume spacers: the maximum of three is DT Swiss's own limit
#     ("Never mount more than three volume spacers!").
#   * F 132 ONE rebound is counted from fully open as well ("Rebound klicks
#     (from fully opened)" in its user manual). The F 132 has no compression,
#     lockout or rebound adjuster and no user-adjustable volume spacer (the
#     technical manual shows one fixed spacer inside the stanchion), so it has
#     no damper entry.
#   * Service intervals of the F 132 / F 132 ONE (small service annually or 150
#     operating hours, full service every 2 years or 500 operating hours) are
#     identical in both user manuals and the F 132 ONE technical manual.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    incontrol_odl_plushport_2023:
      name: INCONTROL O.D.L. with PLUSHPORT
      description: |-
        - Travel-dependent low-speed compression: the first 30% of travel runs through an open bypass port for small-bump sensitivity, then closes progressively for mid-stroke support and bottom-out control
        - Lever with three modes: Open, Drive (partly closed compression) and Lock (with a blow-off valve)
        - External low-speed compression and rebound adjusters
      adjustments:
        - { name: Compression Mode, type: categorical, options: [Open, Drive, Lock] }
        - { name: Compression, type: step, max: 12, notes: "Low-Speed Compression; Counted from fully open (softest); DT Swiss recommends fully open" }
        - { name: Rebound, type: step, max: 29, notes: Counted from fully open (fastest) }
      source:
        - https://enduro-mtb.com/en/dt-swiss-f-535-and-f-535-one-forks-test/
        - https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/04/85/7/MAN_FXD10000004857S_WEB_ZZ_001.pdf
      note: >-
        Enduro-MTB (21 Jun 2023): "Both forks offer 12 clicks of low-speed
        compression and 29 clicks of rebound." Three modes per the same article
        and the F 535 / F 535 ONE user manual V2023.05 (sec. 4.2). Compression
        and rebound direction and counting from the same manual (secs. 4.4, 4.5).

    incontrol_ol_2023:
      name: INCONTROL O.L.
      description: |-
        - Conventional (not travel-dependent) low-speed compression damper
        - Two-position lever: Open and Lock (with a blow-off valve)
        - External low-speed compression and rebound adjusters
      adjustments:
        - { name: Compression Mode, type: categorical, options: [Open, Lock] }
        - { name: Compression, type: step, max: 12, notes: "Low-Speed Compression; Counted from fully open (softest); DT Swiss recommends fully open" }
        - { name: Rebound, type: step, max: 29, notes: Counted from fully open (fastest) }
      source:
        - https://enduro-mtb.com/en/dt-swiss-f-535-and-f-535-one-forks-test/
        - https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/04/85/7/MAN_FXD10000004857S_WEB_ZZ_001.pdf
      note: >-
        Enduro-MTB (21 Jun 2023): both new forks offer 12 clicks of low-speed
        compression and 29 clicks of rebound; the base F 535 only has Open and
        Lock. Two modes per the F 535 / F 535 ONE user manual V2023.05 (sec. 4.3).

    incontrol_odl_232_2020:
      name: INCONTROL O.D.L. (XC)
      description: >-
        Lightweight cross-country damper with a three-position lever (Open, Drive,
        Lock) and external rebound and low-speed compression adjusters.
      adjustments:
        - { name: Compression Mode, type: categorical, options: [Open, Drive, Lock] }
        - { name: Compression, type: step, max: ~, notes: "Low-Speed Compression; blue T10 Torx adjuster, affects Open mode only", dialColor: blue }
        - { name: Rebound, type: step, max: 25, notes: "Counted from fully open (fastest); estimated maximum, check your dial and edit it if it differs" }
      source:
        - https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/02/81/9/MAN_FXD10000002819S_WEB_ZZ_001.pdf
        - https://www.pinkbike.com/news/first-ride-dt-swisss-new-232-one-platform.html
      note: >-
        Lever modes and the blue compression adjuster (T10 Torx, affects Open
        mode only) from the F 232 ONE user manual V2021.09 (sec. 4.3). No total
        click count is published for compression or rebound, so compression keeps
        `max: ~`. Rebound is an estimate: the manual's rebound table (sec. 4.4,
        "Rebound klicks (from fully opened)", 29-138 psi) tops out at 25 clicks,
        so the dial has at least 25 clicks counted from fully open.

    plaingain_ol_2026:
      name: PLAINGAIN O.L.
      description: |-
        - Open and Lock modes, switched with the L1 remote lever on the handlebar (PUSHCONTROL)
        - Open is the most sensitive, factory-set mode; in Lock a blow-off valve releases the oil flow on heavy impacts
        - External rebound adjuster on the lower leg
      adjustments:
        - { name: Compression Mode, type: categorical, options: [Open, Lock] }
        - { name: Rebound, type: step, max: 10, notes: "Counted from fully open (fastest); estimated maximum, check your dial and edit it if it differs", dialColor: red }
      source:
        - https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/06/17/6/MAN_FXD10000006176S_WEB_ZZ_001.pdf
        - https://www.dtswiss.com/en/suspension/forks/f-132-one
        - https://www.rennrad-news.de/news/dt-swiss-f-132-one-f-132-gravel-federgabel/
        - https://www.tour-magazin.de/rennraeder/gravel-bike/dt-swiss-f-132-f-132-one-gravel-federgabeln/
      note: >-
        Open / Lock modes, the factory-set Open mode and the blow-off valve from
        the F 132 ONE user manual V2026.03 (sec. 4.2); damper name from the
        product page. Rebound direction and counting from the same manual (sec.
        4.3, "Rebound klicks (from fully opened)"); the red knob on the lower
        leg is shown in its illustration and named by Rennrad-News. DT Swiss
        publishes no click total; the manual's rebound table (0-10 clicks, 29-189
        psi) tops out at 10, so `max: 10` is an estimate. Rennrad-News and
        Tour state 9 clicks, which would not cover the manual's own 10-click
        recommendation above 160 psi; the manual wins, check against a real fork.
        No compression adjuster: the F 132 ONE has only the lever.

# --------------------------------------------------------------------------
# Setup guides — the user manuals' starting points as data (SCHEMA.md,
# "Setup guides"), transcribed from docs/research/setup_guides/dtswiss.md.
#   * Pressure: one rule per printed travel column, psi at 5 kg points. The
#     F 535 / F 535 ONE table is headed "system weight" without a definition;
#     it is read as rider weight with gear (its first row is 50 kg).
#   * Rebound: keyed by the fork's air pressure, counted from fully open as the
#     catalog dials are. The F 535 bands share their printed edges, so they are
#     written as contiguous brackets. The tables hold for about 25 °C; the cold
#     correction (open 6 clicks at 0 °C) is a note, temperature is no input.
#   * The setupguide.dtswiss.com app stays the `setup_guide` link: it is DT
#     Swiss's own rider-facing guide; the manuals are each guide's `source`.
# --------------------------------------------------------------------------
