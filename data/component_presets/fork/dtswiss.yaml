# --------------------------------------------------------------------------
# Forks — current lineup. DT Swiss only offers 29" versions of the three
# mountain-bike forks; the two gravel forks are 700c.
# --------------------------------------------------------------------------
nodes:
  - label: "F 535 ONE"
    level: model
    category: Trail / All-Mountain
    tasks: &dtswiss_service
      fork:lower_leg_service: { interval: { moving_time_h: 50 }, source: DT Swiss user manual }
      fork:full_service: { interval: { moving_time_h: 200 }, fallback: { days: 365 }, source: DT Swiss user manual }
    children:
      - label: "2023–2026"
        level: generation
        id: "2023"
        years: "2023-2026"
        url: https://www.dtswiss.com/en/suspension/forks/f-535-one
        setup_guide: https://setupguide.dtswiss.com/en/
        guide: dtswiss_f535_2023
        children:
          - label: Standard
            level: trim
            specs: { stanchion: 35mm, spring: Air }
            offset_mm: [44]
            adjustments:
              - { name: Pressure, type: numerical, unit: psi, min: 0, max: 197, notes: "Maximum depends on travel: 120mm 197 psi, 130mm 186, 140mm 175, 150mm 164, 160mm 154" }
              - { name: Volume Spacers, type: step, max: 3, visualization: stepper, notes: APT volume spacers }
            options:
              damper: [incontrol_odl_plushport_2023]
              travel_mm: [120, 130, 140, 150, 160]
              wheel_size: [29]
            note: |-
              - COILPAIR spring: a small coil works with the air spring over the first 30mm of travel
              - PLUSHPORT travel-dependent damping
              - One APT volume spacer fitted as delivered, two more in the box
              - 15mm Boost thru-axle, magnesium lowers

  - label: "F 535"
    level: model
    category: Trail / All-Mountain
    tasks: *dtswiss_service
    children:
      - label: "2023–2026"
        level: generation
        id: "2023"
        years: "2023-2026"
        url: https://www.dtswiss.com/en/suspension/forks/f-535
        setup_guide: https://setupguide.dtswiss.com/en/
        guide: dtswiss_f535_2023
        children:
          - label: Standard
            level: trim
            specs: { stanchion: 35mm, spring: Air }
            offset_mm: [44]
            adjustments:
              - { name: Pressure, type: numerical, unit: psi, min: 0, max: 191, notes: "Maximum depends on travel: 120mm 191 psi, 130mm 180, 140mm 170, 150mm 158, 160mm 148" }
              - { name: Volume Spacers, type: step, max: 3, visualization: stepper, notes: APT volume spacers }
            options:
              damper: [incontrol_ol_2023]
              travel_mm: [120, 130, 140, 150, 160]
              wheel_size: [29]
