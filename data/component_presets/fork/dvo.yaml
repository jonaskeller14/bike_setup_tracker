# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - Onyx 38 HSC total rotations: the Onyx 38 Set-Up Guide v1.0 (p.12) gives
#     only a 0-5 "Full Rotations (NOT Clicks)" base chart. Modelled as an
#     unbounded numerical in turns. RESOLVED-AS-REMOVED: the previous
#     `OTT max: 12` on the 38 D1 was read off the guide's 1-12 OTT base chart,
#     which is not a range statement — DVO's own docs prove chart columns
#     overshoot the real total (Diamond rebound chart 22 vs. stated 20 clicks).
#     It is now an unbounded numerical too. Needs an Onyx 38 owner's manual or
#     a DVO statement to pin down either total.
#   - Rebound totals of Sapphire 34 / Sapphire 32 / Onyx SC / Onyx DC (quick_range
#     dampers) and Diamond D3/E3 are estimates (22): the top of the 2020 guide's
#     "Rebound Clicks - Starting From Closed" chart axis. These chassis have no
#     per-model page on tech.dvosuspension.com/setup, which publishes "Range: N
#     clicks total" blocks for the Diamond, Emerald and Jade only — ask DVO.
#     Their HSC is a full-rotation adjuster without a stated total.
#   - diamond36_d1e1 (LSC 5, rebound 25) comes from the Diamond 36 guide.
#   - Sapphire 34 / Sapphire 32 travel, wheel size and offset: dvosuspension.com's
#     Sapphire pages still serve an empty cart page instead of product content
#     (re-checked 2026-10-10), and the 2020 guide lists no chassis specs.
#     Stanchion diameters are from the model names themselves.
#   - Volume-spacer maxima of Onyx SC, Onyx DC, Sapphire and Diamond D3/E3: the
#     2020 guide has no spacer section, so none is declared.
#   - Whether the Diamond 36 D1 SL carries the external OTT adjuster: the Diamond
#     36 guide shows no OTT, so none is declared.
#   - Diamond D3 / E3 `travel_mm`: dvosuspension.com/product/diamond-d3 states only
#     "Max Travel: 160mm" and diamond-e3 "27.5 = 150-170mm, 29 = 140-160mm" with no
#     step size, and a travel axis cannot be tied to a wheel size, so none is declared.
