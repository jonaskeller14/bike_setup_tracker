    tasks: &dvo_service
      fork:lower_leg_service: { interval: { moving_time_h: 50 }, source: DVO fork owner's manual, source_de: DVO-Gabel-Handbuch, source_fr: Manuel d’utilisation de la fourche DVO, source_it: Manuale d’uso della forcella DVO, source_es: Manual del usuario de la horquilla DVO, source_pt: Manual do usuário do garfo DVO }
      fork:full_service: { interval: { moving_time_h: 100 }, source: DVO fork owner's manual, source_de: DVO-Gabel-Handbuch, source_fr: Manuel d’utilisation de la fourche DVO, source_it: Manuale d’uso della forcella DVO, source_es: Manual del usuario de la horquilla DVO, source_pt: Manual do usuário do garfo DVO }
    children:
      - label: "2024–2026"
        level: generation
        id: "2024"
        years: "2024-2026"
        url: https://dvosuspension.com/product/onyx-d1-38/
        setup_guide: https://dvosuspension.com/wp-content/uploads/2024/08/38-Setup-Guide-v1.1.pdf
        guide: dvo_onyx38_2024
        # Air-pressure max (100 PSI), volume-spacer max (4) and travel options all
        # from the Onyx 38 Set-Up Guide v1.0: p.8 "DO NOT exceed maximum air
        # pressure of 100PSI"; p.18 "A maximum of 4 volume spacers can be used";
        # p.20 table "Travel 160-180mm / Factory Installed 0 / Max Volume Spacers 4".
        note: >-
          Also sold as co-branded "D1 x RENEN" and "SL x WP" editions, which share this
          chassis and its adjusters.
        note_de: >-
          Wird auch als Co-Branding-Editionen „D1 x RENEN“ und „SL x WP“
          verkauft, die dieses Chassis und seine Versteller teilen.
        note_fr: Aussi vendue en éditions co-brandées « D1 x RENEN » et « SL x WP », qui partagent ce châssis et ses réglages.
        note_it: Venduta anche nelle edizioni co-brandizzate «D1 x RENEN» e «SL x WP», che condividono questo telaio e le sue regolazioni.
        note_es: También se vende en ediciones con doble marca «D1 x RENEN» y «SL x WP», que comparten este chasis y sus ajustes.
        note_pt: Também vendida nas edições com marca compartilhada “D1 x RENEN” e “SL x WP”, que compartilham este chassi e suas regulagens.
        children:
          - label: D1
            level: trim
            specs: { stanchion: 38mm Tapered Alloy, stanchion_de: "38mm Alu, konisch", stanchion_fr: 38mm alu conique, stanchion_it: 38mm lega conica, stanchion_es: 38mm aleación cónica, stanchion_pt: 38mm liga cônica, spring: Air, spring_de: Luft, spring_fr: Air, spring_it: Aria, spring_es: Aire, spring_pt: Ar }
            adjustments:
              - { name: Pressure, name_de: Luftdruck, name_fr: Pression d’air, name_it: Pressione dell’aria, name_es: Presión de aire, name_pt: Pressão do ar, type: numerical, unit: psi, min: 0, max: 100 }
              - { name: Volume Spacers, name_de: Volumenspacer, name_fr: Tokens, name_it: Token, name_es: Tokens, name_pt: Tokens, type: step, max: 4, visualization: stepper }
              - { name: OTT, name_de: OTT, name_fr: OTT, name_it: OTT, name_es: OTT, name_pt: OTT, type: numerical, unit: turns, min: 0, notes: "Off The Top negative-spring preload; 5mm allen key under the left leg, full rotations only; more OTT = plusher off the top. Let the air out of the fork before adjusting", notes_de: "Vorspannung der Negativfeder (Off The Top); 5-mm-Inbusschlüssel unter dem linken Gabelbein, nur ganze Umdrehungen; mehr OTT = sensibleres Ansprechen am Anfang des Federwegs. Vor dem Verstellen die Luft aus der Gabel lassen", notes_fr: "Précontrainte du ressort négatif Off The Top ; clé Allen de 5 mm sous la jambe gauche, tours complets uniquement ; plus d’OTT = plus souple en début de course. Videz l’air de la fourche avant de régler", notes_it: "Precarico della molla negativa Off The Top; chiave a brugola da 5 mm sotto lo stelo sinistro, solo giri completi; più OTT = più morbida all’inizio della corsa. Scarica l’aria dalla forcella prima di regolare", notes_es: "Precarga del muelle negativo Off The Top; llave Allen de 5 mm bajo la pierna izquierda, solo vueltas completas; más OTT = más blanda al inicio del recorrido. Deja salir el aire de la horquilla antes de ajustar", notes_pt: "Pré-carga da mola negativa Off The Top; chave Allen de 5 mm sob a perna esquerda, somente voltas completas; mais OTT = mais macia no início do curso. Esvazie o ar do garfo antes de ajustar" }
            options:
              damper: [onyx38_d1e1]
              travel_mm: [160, 170, 180]
              wheel_size: [29]
            note: |-
              - OTT (Off The Top) preloads the negative coil spring inside the air cartridge
              - More OTT softens roughly the first 30mm of travel without softening mid-stroke
              - 5mm allen key under the left leg, turned in full rotations; let the air out first
              - The only Onyx 38 trim with the external OTT adjuster
            note_de: |-
              - OTT (Off The Top) spannt die Negativ-Stahlfeder in der Luftkartusche vor
              - Mehr OTT macht etwa die ersten 30mm des Federwegs weicher, ohne den mittleren Federweg weicher zu machen
              - 5-mm-Inbusschlüssel unter dem linken Gabelbein, in vollen Umdrehungen gedreht; vorher die Luft ablassen
              - Die einzige Onyx-38-Ausstattung mit dem externen OTT-Versteller
            note_fr: |-
              - L’OTT (Off The Top) précontraint le ressort hélicoïdal négatif dans la cartouche pneumatique
              - Plus d’OTT adoucit à peu près les 30 premiers mm de débattement sans adoucir le milieu de course
              - Clé Allen de 5 mm sous la jambe gauche, tournée par tours complets ; videz d’abord l’air
              - La seule finition de l’Onyx 38 avec le réglage OTT externe
            note_it: |-
              - L’OTT (Off The Top) precarica la molla elicoidale negativa nella cartuccia pneumatica
              - Più OTT ammorbidisce circa i primi 30 mm di escursione senza ammorbidire la parte centrale
              - Chiave a brugola da 5 mm sotto lo stelo sinistro, a giri completi; scarica prima l’aria
              - L’unico allestimento dell’Onyx 38 con il regolatore OTT esterno
            note_es: |-
              - El OTT (Off The Top) precarga el muelle helicoidal negativo dentro del cartucho neumático
              - Más OTT suaviza aproximadamente los primeros 30 mm de recorrido sin suavizar la parte media
              - Llave Allen de 5 mm bajo la pierna izquierda, en vueltas completas; deja salir primero el aire
              - El único acabado de la Onyx 38 con el ajuste OTT externo
            note_pt: |-
              - O OTT (Off The Top) pré-carrega a mola helicoidal negativa dentro do cartucho a ar
              - Mais OTT suaviza aproximadamente os primeiros 30 mm de curso sem suavizar o meio
              - Chave Allen de 5 mm sob a perna esquerda, em voltas completas; esvazie o ar antes
              - O único acabamento da Onyx 38 com o ajuste OTT externo
