# --------------------------------------------------------------------------
# Setup guides — transcribed from docs/research/setup_guides/dvo.md.
#   * Pressure: each rider-weight row shades a Plush-to-Firm span of psi
#     columns. One rule holds the span as a band (its midpoint for a rider
#     without a riding style); a `comfort` rule takes the Plush end and a
#     `race` rule the Firm end. Brackets are the printed lb columns
#     (`120-139` → `120-140`).
#   * Rebound, HSC and the Onyx 38 OTT are keyed by air pressure, read from
#     the rider's pressure (or the recommended one). All DVO click charts
#     count in the catalog adjuster's own direction, so cells are as printed.
#   * Several pressure-keyed charts skip a row (Onyx 38 rebound has no 85-90,
#     its OTT no 80-85, HSC no 95-100). The parser rejects a gap between
#     brackets, so the rows above a gap are left out: those riders are
#     outside the table. Each rule says which rows.
#   * E-bike columns and the e-bike "+5-10 psi" tip are not encoded (no
#     e-bike option, #72); the internal D2/E2 OTT and the 2020 LSC advice
#     (descend open, climb firm) are situational or not rider-adjustable.
# --------------------------------------------------------------------------
guides:
  dvo_onyx38_2024:
    label: DVO Onyx 38 Series Set-Up Guide (v1.1, 2024)
    label_de: DVO Onyx 38 Serie Setup-Anleitung (v1.1, 2024)
    label_fr: Guide de setup DVO Onyx 38 Series (v1.1, 2024)
    label_it: Guida al setup DVO Onyx 38 Series (v1.1, 2024)
    label_es: Guía de setup DVO Onyx 38 Series (v1.1, 2024)
    label_pt: Guia de setup DVO Onyx 38 Series (v1.1, 2024)
    source: https://dvosuspension.com/wp-content/uploads/2024/08/38-Setup-Guide-v1.1.pdf
    rules:
      - &dvo_36_38_air
        target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        rows: {
          120-140: [50, 60], 140-160: [55, 65], 160-180: [60, 70], 180-200: [65, 75],
          200-220: [70, 80], 220-240: [75, 85], 240-250: [80, 90], 250-260: [90, 100]
        }
        note: The band runs from DVO's Plush to its Firm setting
        note_de: Das Band reicht von der Plush- bis zur Firm-Einstellung von DVO
        note_fr: La plage va du réglage Plush de DVO à son réglage Firm
        note_it: La fascia va dall’impostazione Plush di DVO a quella Firm
        note_es: La banda va del ajuste Plush de DVO a su ajuste Firm
        note_pt: A faixa vai do ajuste Plush da DVO ao seu ajuste Firm
      - &dvo_36_38_air_plush
        target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { riding_style: comfort }
        rows: {
          120-140: 50, 140-160: 55, 160-180: 60, 180-200: 65,
          200-220: 70, 220-240: 75, 240-250: 80, 250-260: 90
        }
        note: DVO's Plush setting
        note_de: Die Plush-Einstellung von DVO
        note_fr: Réglage Plush de DVO
        note_it: Impostazione Plush di DVO
        note_es: Ajuste Plush de DVO
        note_pt: Ajuste Plush da DVO
      - &dvo_36_38_air_firm
        target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { riding_style: race }
        rows: {
          120-140: 60, 140-160: 65, 160-180: 70, 180-200: 75,
          200-220: 80, 220-240: 85, 240-250: 90, 250-260: 100
        }
        note: DVO's Firm setting
        note_de: Die Firm-Einstellung von DVO
        note_fr: Réglage Firm de DVO
        note_it: Impostazione Firm di DVO
        note_es: Ajuste Firm de DVO
        note_pt: Ajuste Firm da DVO
      # The 90-95 and 100+ rows are left out: the chart has no 85-90 row.
      - &dvo_36_38_rebound
        target: rebound
        input: pressure
        input_unit: psi
        rows: {
          50-55: [20, 24], 55-60: [18, 22], 60-65: [16, 20], 65-70: [14, 18],
          70-75: [12, 16], 75-80: [10, 14], 80-85: [8, 12]
        }
        note: The band runs from slower to faster rebound
        note_de: Das Band reicht von langsamerer bis zu schnellerer Zugstufe
        note_fr: La plage va d’une détente plus lente à une plus rapide
        note_it: La fascia va dal ritorno più lento a quello più rapido
        note_es: La banda va de un rebote más lento a uno más rápido
        note_pt: A faixa vai do retorno mais lento ao mais rápido
      # The 100+ row (4) is left out: the chart has no 95-100 row.
      - &dvo_36_38_hsc
        target: hsc
        input: pressure
        input_unit: psi
        when: { damper: onyx38_d1e1 }
        rows: {
          50-55: 0, 55-60: 0, 60-65: 1, 65-70: 1, 70-75: 2,
          75-80: 2, 80-85: 3, 85-90: 3, 90-95: 4
        }
        note: Full turns in from fully open
        note_de: Volle Umdrehungen von ganz offen aus eingedreht
        note_fr: Tours complets depuis la position entièrement ouverte
        note_it: Giri completi a partire dalla posizione completamente aperta
        note_es: Vueltas completas desde la posición totalmente abierta
        note_pt: Voltas completas a partir da posição totalmente aberta
      # The 85-90 and 90-100 rows are left out: the chart has no 80-85 row.
      - target: ott
        input: pressure
        input_unit: psi
        when: { trim: d1 }
        rows: {
          50-55: [1, 4], 55-60: [3, 5], 60-65: [4, 6], 65-70: [5, 7],
          70-75: [6, 8], 75-80: [7, 9]
        }
        note: Full turns in from fully open
        note_de: Volle Umdrehungen von ganz offen aus eingedreht
        note_fr: Tours complets depuis la position entièrement ouverte
        note_it: Giri completi a partire dalla posizione completamente aperta
        note_es: Vueltas completas desde la posición totalmente abierta
        note_pt: Voltas completas a partir da posição totalmente aberta
      # DVO says volume spacers are for the SL forks only, so the factory
      # count is given for the D1 SL alone.
      - { target: volume_spacers, value: 0, when: { trim: d1-sl } }
      - &dvo_fork_sag { target: sag, range: [15, 30], comfort_at: max, note: "Toward 15 % for stability at speed, toward 30 % for comfort and cornering", note_de: "Richtung 15 % für Stabilität bei hohem Tempo, Richtung 30 % für Komfort und Kurvenfahrt", note_fr: "Vers 15 % pour la stabilité à haute vitesse, vers 30 % pour le confort et les virages", note_it: "Verso il 15 % per la stabilità alle alte velocità, verso il 30 % per comfort e curve", note_es: "Hacia el 15 % para la estabilidad a alta velocidad, hacia el 30 % para la comodidad y las curvas", note_pt: "Perto de 15 % para estabilidade em alta velocidade, perto de 30 % para conforto e curvas" }

