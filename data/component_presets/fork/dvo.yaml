# DVO Suspension mountain-bike forks — adjustment preset database
#
# Same design as fork/fox.yaml, fork/rockshox.yaml, fork/ohlins.yaml: click
# ranges belong to the DAMPER cartridge, defined once under `option_values.damper` and
# referenced by id from each fork's trims. See SCHEMA.md in this folder.
#
# DVO organizes its dampers into tiers shared across models: D1/E1 (top,
# externally adjustable OTT + full-range HSC + "Quick Range" LSC), D2/E2 (mid,
# internally adjustable 3-position OTT + fewer-click "Quick Range" LSC, no
# HSC), D3/E3 (base, full-range turn-based LSC only, no OTT, no HSC). "E"
# variants are e-bike-tuned valving of the same tier. Exact click counts within
# a tier are NOT identical across fork models (Diamond's D1/E1 LSC is 6 clicks
# while Onyx 38's D1/E1 LSC is 5 clicks) — each fork model gets its own damper
# id rather than assuming numbers carry over between chassis.
#
# Two DVO documentation habits matter when reading numbers out of their docs:
#   1. HSC and OTT are adjusted in FULL ROTATIONS, not clicks. DVO publishes a
#      rotation total for some models (Diamond 14, Emerald 15) and none at all
#      for others (Onyx 38) — where none exists the adjuster is modelled as an
#      unbounded `numerical` in `turns` rather than inventing a maximum.
#   2. The "base setting chart" columns in DVO's guides are NOT the adjuster's
#      range. Proof from DVO's own docs: the 2020 Fork Set-Up Guide's Diamond
#      rebound chart runs out to column 22, while tech.dvosuspension.com states
#      the Diamond's real rebound range is 20 clicks total. Chart columns are
#      therefore only ever used as a flagged estimate (never as a stated total),
#      and only where the guide counts the clicks from closed: the rebound of
#      the 2020-generation dampers (22).

brand: DVO
component_type: fork
sources:
  - https://dvosuspension.com/product-category/suspension/fork/
  - https://dvosuspension.com/product/onyx-d1-38/
  - https://dvosuspension.com/wp-content/uploads/2023/09/onyx38setupguide-v1.pdf
  - https://dvosuspension.com/product/onyx-sc-d2/
  - https://dvosuspension.com/product/onyx-dc-d1/
  - https://dvosuspension.com/product/diamond-36-core/
  - https://dvosuspension.com/product/diamond-d1-2024/
  - https://dvosuspension.com/product/diamond-d3/
  - https://dvosuspension.com/product/diamond-e3/
  - https://dvosuspension.com/wp-content/uploads/2026/05/V3Diamond-CORE-Set-up-Guide.pdf
  - https://dvosuspension.com/wp-content/uploads/2024/05/DVO-Diamond-36-Setup-Guide-May16.pdf
  - https://dvosuspension.com/wp-content/uploads/2024/08/38-Setup-Guide-v1.1.pdf
  - https://tech.dvosuspension.com/setup/
  - https://tech.dvosuspension.com/setup/diamond/
  - https://tech.dvosuspension.com/setup/emerald/
  - https://tech.dvosuspension.com/wp-content/uploads/2020/09/DVO-Set-Up-Guide-2020-v4.pdf
  - https://tech.dvosuspension.com/wp-content/uploads/2018/06/DVO-Fork-OwnersManual.pdf
  - https://tech.dvosuspension.com/wp-content/uploads/2018/08/DVO-SET-UP-GUIDE_fork.pdf
  - https://tech.dvosuspension.com/setup/onyx-sc/
  - https://tech.dvosuspension.com/setup/sapphire-series/
  - https://tech.dvosuspension.com/setup/onyx-dc-set-up/
  # Emerald chassis specs (travel / stanchion / wheel size / offset) — DVO's own
  # Emerald page serves an empty cart page, so these come from staff-written
  # editorial coverage, which SCHEMA.md allows as a secondary tier.
  - https://www.bikeradar.com/reviews/components/forks/suspension-forks/dvo-emerald-inverted-downhill-fork-review
  - https://www.pinkbike.com/news/dvo-emerald-review-2014.html
updated: 2026-10-13
# Service intervals (`tasks`) come from DVO's general fork owner's manual
# (Fork Tuning Guide 2017): lower legs every 50 hours, air spring and damper
# cartridge every 100 hours, no time-based interval. DVO publishes no shock
# schedule.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    # Shared "D1/E1" and "D2/E2" tier dampers for the 2020-generation chassis
    # (Sapphire, Onyx SC, Onyx DC). DVO's Fork Set-Up Guide (2020 v4, p.14)
    # states the LSC click count generically for "our suspension forks" at each
    # tier; it expresses HSC in rotations with no total, and gives rebound only
    # as a base-setting chart. Rebound/HSC totals are published per-model on
    # tech.dvosuspension.com for the Diamond and Emerald only.
    quick_range_d1e1:
      name: Quick Range D1/E1
      description: |-
        - Low Speed Compression "Quick Range", 6 clicks: 1 wide open to descend, 6 the firmest pedalling platform
        - Full-range High Speed Compression on a second dial, moved in full 1-2 rotations rather than clicks
      adjustments:
        - { name: LSC, type: step, max: 6, notes: "Low-Speed Compression; DVO 'Quick Range' adjuster; position 1 = fully open (softest), 6 = firmest", dialColor: green }
        - { name: HSC, type: numerical, unit: turns, min: 0, notes: "High-Speed Compression; Start fully open (counter-clockwise) and adjust 1-2 full rotations at a time; clockwise = firmer" }
        - { name: Rebound, type: step, max: 22, notes: "Counted from fully closed (slowest); estimated maximum, check your dial and edit it if it differs" }
      source:
        - https://tech.dvosuspension.com/wp-content/uploads/2020/09/DVO-Set-Up-Guide-2020-v4.pdf
      note: >-
        LSC 6 clicks from the DVO Fork Set-Up Guide 2020 v4, p.14: "Our suspension forks come
        with a 'Quick Range' low speed compression adjuster that has 6 clicks of adjustment.
        Setting '1' is wide open ... you can switch the LSC to '6'". HSC on p.12 of the same
        guide is a "full range" adjuster with a rotations-based base chart (0-5) and no stated
        total. Rebound 22 is an estimate: the highest column of the "Rebound Clicks - Starting
        From Closed" charts (2-22 in 2-click steps, p.10) for Sapphire 34 D1 / Onyx SC / Onyx
        DC. DVO states no total for these forks; for the Diamond the same chart axis runs to
        22 against a stated 20, so the axis can overshoot.

    quick_range_d2e2:
      name: Quick Range D2/E2 (BERYL)
      description: |-
        - Mid-tier BERYL damper with a 4-click "Quick Range" Low Speed Compression dial, soft through firm
        - OTT is set internally to one of three positions for your body weight, so it is not a trailside adjustment
      adjustments:
        - { name: Compression, type: step, max: 4, notes: "Low-Speed Compression; Soft → Medium → Firm dial; counted from fully open (soft)", dialColor: green }
        - { name: Rebound, type: step, max: 22, notes: "Counted from fully closed (slowest); estimated maximum, check your dial and edit it if it differs" }
      source:
        - https://tech.dvosuspension.com/wp-content/uploads/2020/09/DVO-Set-Up-Guide-2020-v4.pdf
      note: >-
        LSC 4 clicks from the DVO Fork Set-Up Guide 2020 v4, p.14: "The BERYL 'D2 damper' comes
        with a 'Quick Range' low speed compression adjuster that has 4 clicks of adjustment."
        Internal 3-position OTT (Open / Middle / Max by rider weight) from p.5 of the same
        guide. No HSC at this tier. Rebound 22 is an estimate: the highest column of the
        "Rebound Clicks - Starting From Closed" chart (2-22, p.10, Onyx SC D1/E1 - D2/E2);
        DVO states no total.

    diamond36_d1e1:
      name: D1/E1 (Diamond 36)
      description: |-
        - Low Speed Compression, 5 settings: fully clockwise is open, each counter-clockwise click adds support
        - Rebound, 25 clicks counted out from fully closed
        - Full-range High Speed Compression on the green dial, moved a half to a full turn at a time
      adjustments:
        - { name: LSC, type: step, max: 5, notes: "Low-Speed Compression; Counted from fully open (softest); counter-clockwise click = firmer", dialColor: grey, dialSize: small }
        - { name: Rebound, type: step, max: 25, notes: "Counted from fully closed (slowest); opening (counter-clockwise) increases speed", dialColor: green }
        - { name: HSC, type: numerical, unit: turns, min: 0, notes: "High-Speed Compression; Start fully open (counter-clockwise) and adjust a half to a full turn at a time; clockwise = firmer. DVO publishes no total rotation count" }
      source:
        - https://dvosuspension.com/wp-content/uploads/2024/05/DVO-Diamond-36-Setup-Guide-May16.pdf
      note: >-
        Diamond 36 Set-Up Guide v1.1: "The D1 models have an adjustable low speed compression
        with 5 settings"; rebound 25 from the numbered scale strip "Open 25 24 ... 2 1 Closed"
        on p.8 (an explicit scale, not a chart-column count); HSC on p.10 is a "Full Rotations
        (NOT Clicks)" adjuster with a 0-5 base chart and no stated total.

    diamond_d3e3:
      name: D3/E3 (Diamond)
      description: |-
        - Base-tier closed-cartridge damper with a full-range Low Speed Compression dial
        - LSC is not click-indexed: start fully open and add support a full turn at a time
      adjustments:
        - { name: Compression, type: numerical, unit: turns, min: 0, notes: "Low-Speed Compression; Full-range adjuster with no detents — start fully open (counter-clockwise) and make full-turn adjustments; clockwise = firmer" }
        - { name: Rebound, type: step, max: 22, notes: "Counted from fully closed (slowest); estimated maximum, check your dial and edit it if it differs" }
      source:
        - https://tech.dvosuspension.com/wp-content/uploads/2020/09/DVO-Set-Up-Guide-2020-v4.pdf
      note: >-
        DVO Fork Set-Up Guide 2020 v4, p.14: "The D3/E3 Model forks come with a full range low
        speed compression ... Start from full open, (counter-clockwise) then make full turn
        adjustments at a time." There is therefore no LSC click total to find — the adjuster
        is continuous. Rebound 22 is an estimate: the highest column of the "Rebound Clicks -
        Starting From Closed" chart for the Diamond D3/E3 (2-22, p.10); DVO states no total.
        No HSC and no OTT at this tier (p.4: "D3 / E3 Models: No OTT Feature").

    diamond_core:
      name: CORE (Diamond 36 CORE)
      description: |-
        - All-new damper for the Diamond 36 CORE with full-range Low Speed Compression and Rebound dials
        - Rebound, 28 clicks counted out from fully closed
        - Low Speed Compression, 14 clicks; counter-clockwise is softer
      adjustments:
        - { name: Compression, type: step, max: 14, notes: "Low-Speed Compression; Counted from fully closed (firmest); counter-clockwise = softer" }
        - { name: Rebound, type: step, max: 28, notes: "Counted from fully closed (slowest); opening (counter-clockwise) increases speed" }
      source:
        - https://dvosuspension.com/product/diamond-36-core/
        - https://dvosuspension.com/wp-content/uploads/2026/05/V3Diamond-CORE-Set-up-Guide.pdf
      note: >-
        Diamond CORE Set-Up Guide (V3, 2026/05): the rebound scale strip reads "Open 28 27 ...
        2 1 Closed" (captioned Fastest/Slowest Rebound Setting) and the "LSC Base Setting
        Chart" strip reads "Open 14 13 ... 2 1 Closed" with "Softer Setting
        (Counter-Clockwise)". Both are explicit scale strips, not chart-column counts, read
        the same way as the Onyx 38's rebound strip. The guide calls the LSC "full range" but
        also says to move "one to two clicks", so it is click-indexed.

    onyx38_d1e1:
      name: D1/E1 (Onyx 38)
      description: |-
        - Low Speed Compression, 5 settings: fully clockwise is open, each click counter-clockwise adds support
        - Rebound, 25 clicks counted out from fully closed — the same scale on every Onyx 38
        - Full-range High Speed Compression on the green dial, moved a half to a full turn at a time
      adjustments:
        - { name: LSC, type: step, max: 5, notes: "Low-Speed Compression; Counted from fully open (softest); counter-clockwise click = firmer", dialColor: grey, dialSize: small }
        - { name: Rebound, type: step, max: 25, notes: "Counted from fully closed (slowest); shared scale across all Onyx 38 models", dialColor: green }
        - { name: HSC, type: numerical, unit: turns, min: 0, notes: "High-Speed Compression; Start fully open (counter-clockwise) and adjust a half to a full turn at a time; clockwise = firmer. DVO publishes no total rotation count" }
      source:
        - https://dvosuspension.com/wp-content/uploads/2023/09/onyx38setupguide-v1.pdf
      note: >-
        Onyx 38 Set-Up Guide v1.0. LSC from p.14: "The D1/E1 models have an adjustable low
        speed compression with 5 settings." Rebound 25 from the numbered scale strip on p.10
        ("Open | 25 24 23 ... 2 1 | Closed", captioned Fastest/Slowest Rebound Setting) — an
        explicit full scale, not a chart column count; the p.10 chart is labelled "for all
        onyx 38 models". HSC on p.12 is a "Full Rotations (NOT Clicks)" adjuster with a 0-5
        base chart and no stated total.

    onyx38_d2e2:
      name: D2/E2 (Onyx 38)
      description: |-
        - Low Speed Compression, 3 settings: fully counter-clockwise is open, each click clockwise adds support
        - Rebound, 25 clicks counted out from fully closed — the same scale on every Onyx 38
        - No High Speed Compression dial at this tier
      adjustments:
        - { name: Compression, type: step, max: 3, notes: "Low-Speed Compression; Counted from fully open (softest); clockwise click = firmer", dialColor: green }
        - { name: Rebound, type: step, max: 25, notes: "Counted from fully closed (slowest); shared scale across all Onyx 38 models", dialColor: green }
      source:
        - https://dvosuspension.com/wp-content/uploads/2023/09/onyx38setupguide-v1.pdf
      note: >-
        Onyx 38 Set-Up Guide v1.0, p.14: "The D2/E2 models have an adjustable low speed
        compression with three settings." Rebound 25 from the numbered scale strip on p.10.

    onyx38_d3e3:
      name: D3/E3 (Onyx 38)
      description: |-
        - Full-range Low Speed Compression: not click-indexed, so start fully open and add support a full turn at a time
        - Rebound, 25 clicks counted out from fully closed — the same scale on every Onyx 38
        - No High Speed Compression dial at this tier
      adjustments:
        - { name: Compression, type: numerical, unit: turns, min: 0, notes: "Low-Speed Compression; Full-range adjuster with no detents — start fully open (counter-clockwise) and make full-turn adjustments; clockwise = firmer" }
        - { name: Rebound, type: step, max: 25, notes: "Counted from fully closed (slowest); shared scale across all Onyx 38 models", dialColor: green }
      source:
        - https://dvosuspension.com/wp-content/uploads/2023/09/onyx38setupguide-v1.pdf
      note: >-
        Onyx 38 Set-Up Guide v1.0, p.14: "The D3/E3 Model forks come with a full range low
        speed compression ... Start from full open, (counter-clockwise) then make full turn
        adjustments at a time." Rebound 25 from the numbered scale strip on p.10.

    emerald_damper:
      name: Emerald
      description: |-
        - Twin-tube open-bath damper with both compression dials at the bottom of the right leg
        - High Speed Compression, 33 clicks, and Low Speed Compression, 27 clicks, counted in from wide open
        - Rebound, 40 clicks, set from the top of the leg
      adjustments:
        - { name: HSC, type: step, max: 33, notes: "High-Speed Compression; Adjuster at the bottom of the right leg; counted clockwise (firmer) from wide open" }
        - { name: LSC, type: step, max: 27, notes: "Low-Speed Compression; Adjuster at the bottom of the right leg; counted clockwise (firmer) from wide open" }
        - { name: Rebound, type: step, max: 40, notes: "Adjuster at the top of the leg; counted clockwise (slower) from wide open" }
      source:
        - https://tech.dvosuspension.com/setup/emerald/
      note: >-
        tech.dvosuspension.com/setup/emerald states each total outright: "High Speed
        Compression (HSC) Range: 33 clicks total", "Low Speed Compression (LSC) Range: 27
        clicks total", "Rebound Range: 40 clicks total", "OTT Range: 6 clicks = 1 full
        rotation. 15 full rotations total." and "Air Pressure Range: 60-100psi". The same page
        gives the base-tune convention: "each adjustment below refers to making adjustments
        clockwise from the Wide-Open setting".

# --------------------------------------------------------------------------
# Setup guides — transcribed from docs/research/setup_guides/dvo.md.
#   * Pressure: each rider-weight row shades a Plush-to-Firm span of psi
#     columns. One rule holds the span as a band (its midpoint for a rider
#     without a riding style); a `comfort` rule takes the Plush end and a
#     `race` rule the Firm end. Brackets are the printed lb columns
#     (`120-139` → `120-140`).
#   * Rebound, HSC and the Onyx 38 OTT are keyed by air pressure, read from
#     the rider's pressure (or the recommended one). All DVO click charts
#     count in the catalog adjuster's own direction, so cells are as printed.
#   * Several pressure-keyed charts skip a row (Onyx 38 rebound has no 85-90,
#     its OTT no 80-85, HSC no 95-100). The parser rejects a gap between
#     brackets, so the rows above a gap are left out: those riders are
#     outside the table. Each rule says which rows.
#   * E-bike columns and the e-bike "+5-10 psi" tip are not encoded (no
#     e-bike option, #72); the internal D2/E2 OTT and the 2020 LSC advice
#     (descend open, climb firm) are situational or not rider-adjustable.
# --------------------------------------------------------------------------
guides:
  dvo_onyx38_2024:
    label: DVO Onyx 38 Series Set-Up Guide (v1.1, 2024)
    source: https://dvosuspension.com/wp-content/uploads/2024/08/38-Setup-Guide-v1.1.pdf
    rules:
      - &dvo_36_38_air
        target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        rows: {
          120-140: [50, 60], 140-160: [55, 65], 160-180: [60, 70], 180-200: [65, 75],
          200-220: [70, 80], 220-240: [75, 85], 240-250: [80, 90], 250-260: [90, 100]
        }
        note: The band runs from DVO's Plush to its Firm setting
      - &dvo_36_38_air_plush
        target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { riding_style: comfort }
        rows: {
          120-140: 50, 140-160: 55, 160-180: 60, 180-200: 65,
          200-220: 70, 220-240: 75, 240-250: 80, 250-260: 90
        }
        note: DVO's Plush setting
      - &dvo_36_38_air_firm
        target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { riding_style: race }
        rows: {
          120-140: 60, 140-160: 65, 160-180: 70, 180-200: 75,
          200-220: 80, 220-240: 85, 240-250: 90, 250-260: 100
        }
        note: DVO's Firm setting
      # The 90-95 and 100+ rows are left out: the chart has no 85-90 row.
      - &dvo_36_38_rebound
        target: rebound
        input: pressure
        input_unit: psi
        rows: {
          50-55: [20, 24], 55-60: [18, 22], 60-65: [16, 20], 65-70: [14, 18],
          70-75: [12, 16], 75-80: [10, 14], 80-85: [8, 12]
        }
        note: The band runs from slower to faster rebound
      # The 100+ row (4) is left out: the chart has no 95-100 row.
      - &dvo_36_38_hsc
        target: hsc
        input: pressure
        input_unit: psi
        when: { damper: onyx38_d1e1 }
        rows: {
          50-55: 0, 55-60: 0, 60-65: 1, 65-70: 1, 70-75: 2,
          75-80: 2, 80-85: 3, 85-90: 3, 90-95: 4
        }
        note: Full turns in from fully open
      # The 85-90 and 90-100 rows are left out: the chart has no 80-85 row.
      - target: ott
        input: pressure
        input_unit: psi
        when: { trim: d1 }
        rows: {
          50-55: [1, 4], 55-60: [3, 5], 60-65: [4, 6], 65-70: [5, 7],
          70-75: [6, 8], 75-80: [7, 9]
        }
        note: Full turns in from fully open
      # DVO says volume spacers are for the SL forks only, so the factory
      # count is given for the D1 SL alone.
      - { target: volume_spacers, value: 0, when: { trim: d1-sl } }
      - &dvo_fork_sag { target: sag, range: [15, 30], comfort_at: max, note: "Toward 15 % for stability at speed, toward 30 % for comfort and cornering" }

  dvo_diamond36_2024:
    label: DVO Diamond 36 Series Set-Up Guide (v1.1, 2024)
    source: https://dvosuspension.com/wp-content/uploads/2024/05/DVO-Diamond-36-Setup-Guide-May16.pdf
    rules:
      - *dvo_36_38_air
      - *dvo_36_38_air_plush
      - *dvo_36_38_air_firm
      # Same chart as the Onyx 38; the rows above its 85-90 gap are left out.
      - *dvo_36_38_rebound
      # Same chart as the Onyx 38; the 100+ row is left out.
      - target: hsc
        input: pressure
        input_unit: psi
        rows: {
          50-55: 0, 55-60: 0, 60-65: 1, 65-70: 1, 70-75: 2,
          75-80: 2, 80-85: 3, 85-90: 3, 90-95: 4
        }
        note: Full turns in from fully open
      - { target: volume_spacers, value: 0 }
      - *dvo_fork_sag

  dvo_diamond36core_2026:
    label: DVO Diamond CORE Series Set-Up Guide (2026)
    source: https://dvosuspension.com/wp-content/uploads/2026/05/V3Diamond-CORE-Set-up-Guide.pdf
    rules:
      - *dvo_36_38_air
      - *dvo_36_38_air_plush
      - *dvo_36_38_air_firm
      # Same rows as the Onyx 38 chart; the 90-95 and 100 rows are left out
      # (no 85-90 row).
      - *dvo_36_38_rebound
      - { target: compression, value: 7, note: The middle of the range }
      - { target: volume_spacers, value: 0 }
      - *dvo_fork_sag

  dvo_fork_2020:
    label: DVO Fork Set-Up Guide (2020)
    source: https://tech.dvosuspension.com/wp-content/uploads/2020/09/DVO-Set-Up-Guide-2020-v4.pdf
    rules:
      # Sapphire 34 D1. The psi axis is printed 55, 65, 75, 80, 85 …, so the
      # first band spans 55-75.
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { model: sapphire-34 }
        rows: {
          120-140: [55, 75], 140-160: [75, 85], 160-180: [85, 95], 180-200: [95, 105],
          200-220: [105, 115], 220-240: [115, 125], 240+: [125, 135]
        }
        note: The band runs from DVO's Plush to its Firm setting
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { model: sapphire-34, riding_style: comfort }
        rows: { 120-140: 55, 140-160: 75, 160-180: 85, 180-200: 95, 200-220: 105, 220-240: 115, 240+: 125 }
        note: DVO's Plush setting
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { model: sapphire-34, riding_style: race }
        rows: { 120-140: 75, 140-160: 85, 160-180: 95, 180-200: 105, 200-220: 115, 220-240: 125, 240+: 135 }
        note: DVO's Firm setting
      # Onyx SC: the D1/D2 column (the catalog has the D2 only; E1/E2 not encoded).
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { model: onyx-sc }
        rows: {
          120-140: [60, 65], 140-160: [70, 75], 160-180: [75, 80], 180-200: [80, 85],
          200-220: [85, 90], 220-240: [90, 95], 240+: [95, 100]
        }
        note: The band runs from DVO's Plush to its Firm setting
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { model: onyx-sc, riding_style: comfort }
        rows: { 120-140: 60, 140-160: 70, 160-180: 75, 180-200: 80, 200-220: 85, 220-240: 90, 240+: 95 }
        note: DVO's Plush setting
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { model: onyx-sc, riding_style: race }
        rows: { 120-140: 65, 140-160: 75, 160-180: 80, 180-200: 85, 200-220: 90, 220-240: 95, 240+: 100 }
        note: DVO's Firm setting
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { model: onyx-dc }
        rows: {
          120-140: [65, 70], 140-160: [70, 75], 160-180: [75, 80], 180-200: [80, 85],
          200-220: [85, 90], 220-240: [90, 95], 240+: [95, 100]
        }
        note: The band runs from DVO's Plush to its Firm setting
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { model: onyx-dc, riding_style: comfort }
