nodes:
  - label: "38"
    level: model
    category: Enduro / DH
    source: https://dvosuspension.com/wp-content/uploads/2023/09/onyx38setupguide-v1.pdf
    tasks: &dvo_service
      fork:lower_leg_service: { interval: { moving_time_h: 50 }, source: DVO fork owner's manual }
      fork:full_service: { interval: { moving_time_h: 100 }, source: DVO fork owner's manual }
    children:
      - label: "2024–2026"
        level: generation
        id: "2024"
        years: "2024-2026"
        url: https://dvosuspension.com/product/onyx-d1-38/
        setup_guide: https://dvosuspension.com/wp-content/uploads/2024/08/38-Setup-Guide-v1.1.pdf
        guide: dvo_onyx38_2024
        # Air-pressure max (100 PSI), volume-spacer max (4) and travel options all
        # from the Onyx 38 Set-Up Guide v1.0: p.8 "DO NOT exceed maximum air
        # pressure of 100PSI"; p.18 "A maximum of 4 volume spacers can be used";
        # p.20 table "Travel 160-180mm / Factory Installed 0 / Max Volume Spacers 4".
        note: >-
          Also sold as co-branded "D1 x RENEN" and "SL x WP" editions, which share this
          chassis and its adjusters.
        children:
          - label: D1
            level: trim
            specs: { stanchion: 38mm Tapered Alloy, spring: Air }
            adjustments:
              - { name: Pressure, type: numerical, unit: psi, min: 0, max: 100 }
              - { name: Volume Spacers, type: step, max: 4, visualization: stepper }
              - { name: OTT, type: numerical, unit: turns, min: 0, notes: "Off The Top negative-spring preload; 5mm allen key under the left leg, full rotations only; more OTT = plusher off the top. Let the air out of the fork before adjusting" }
            options:
              damper: [onyx38_d1e1]
              travel_mm: [160, 170, 180]
              wheel_size: [29]
            note: |-
              - OTT (Off The Top) preloads the negative coil spring inside the air cartridge
              - More OTT softens roughly the first 30mm of travel without softening mid-stroke
              - 5mm allen key under the left leg, turned in full rotations; let the air out first
              - The only Onyx 38 trim with the external OTT adjuster
          - label: D1 SL
            level: trim
            specs: { stanchion: 38mm Tapered Alloy, spring: Air }
            adjustments: &onyx38_air_spring
              - { name: Pressure, type: numerical, unit: psi, min: 0, max: 100 }
              - { name: Volume Spacers, type: step, max: 4, visualization: stepper }
            options:
              damper: [onyx38_d1e1]
              travel_mm: [160, 170, 180]
              wheel_size: [29]
            note: Super-Light dual air system; no OTT adjuster on this trim.
          - label: D2
            level: trim
            specs: { stanchion: 38mm Tapered Alloy, spring: Air }
            adjustments: *onyx38_air_spring
            options:
              damper: [onyx38_d2e2]
              travel_mm: [160, 170, 180]
              wheel_size: [29]
            note: OEM only. No OTT adjuster on this trim.
          - label: D3
            level: trim
            specs: { stanchion: 38mm Tapered Alloy, spring: Air }
            adjustments: *onyx38_air_spring
            options:
              damper: [onyx38_d3e3]
              travel_mm: [160, 170, 180]
              wheel_size: [29]
            note: OEM only. No OTT adjuster on this trim.

