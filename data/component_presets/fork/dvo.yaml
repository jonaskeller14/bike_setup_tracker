updated: 2026-10-13
# Service intervals (`tasks`) come from DVO's general fork owner's manual
# (Fork Tuning Guide 2017): lower legs every 50 hours, air spring and damper
# cartridge every 100 hours, no time-based interval. DVO publishes no shock
# schedule.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    # Shared "D1/E1" and "D2/E2" tier dampers for the 2020-generation chassis
    # (Sapphire, Onyx SC, Onyx DC). DVO's Fork Set-Up Guide (2020 v4, p.14)
    # states the LSC click count generically for "our suspension forks" at each
    # tier; it expresses HSC in rotations with no total, and gives rebound only
    # as a base-setting chart. Rebound/HSC totals are published per-model on
    # tech.dvosuspension.com for the Diamond and Emerald only.
    quick_range_d1e1:
      name: Quick Range D1/E1
      description: |-
        - Low Speed Compression "Quick Range", 6 clicks: 1 wide open to descend, 6 the firmest pedalling platform
        - Full-range High Speed Compression on a second dial, moved in full 1-2 rotations rather than clicks
      description_de: |-
        - Low-Speed-Druckstufe „Quick Range“, 6 Klicks: 1 ganz offen für die Abfahrt, 6 die festeste Pedalplattform
        - High-Speed-Druckstufe über den gesamten Bereich auf einem zweiten Rad, verstellt in vollen 1-2 Umdrehungen statt in Klicks
      description_fr: |-
        - Compression basse vitesse « Quick Range », 6 clics : 1 grand ouvert pour descendre, 6 la plateforme de pédalage la plus ferme
        - Compression haute vitesse sur toute la plage sur une seconde molette, déplacée par 1-2 tours complets plutôt que par clics
      description_it: |-
        - Compressione a bassa velocità «Quick Range», 6 scatti: 1 tutta aperta per scendere, 6 la piattaforma di pedalata più rigida
        - Compressione ad alta velocità a corsa completa su una seconda manopola, spostata di 1-2 giri completi invece che a scatti
      description_es: |-
        - Compresión de baja velocidad «Quick Range», 6 clics: 1 totalmente abierta para bajar, 6 la plataforma de pedaleo más firme
        - Compresión de alta velocidad de rango completo en una segunda rueda, que se mueve en 1-2 vueltas completas en lugar de clics
      description_pt: |-
        - Compressão de baixa velocidade “Quick Range”, 6 cliques: 1 totalmente aberta para descer, 6 a plataforma de pedalada mais firme
        - Compressão de alta velocidade de faixa completa em um segundo seletor, movido em 1-2 voltas completas em vez de cliques
      adjustments:
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 6, notes: "Low-Speed Compression; DVO 'Quick Range' adjuster; position 1 = fully open (softest), 6 = firmest", notes_de: "Low-Speed-Druckstufe; DVO-„Quick Range“-Versteller; Position 1 = ganz offen (am weichsten), 6 = am festesten", notes_fr: "Compression basse vitesse ; réglage « Quick Range » de DVO ; position 1 = entièrement ouvert (le plus souple), 6 = le plus ferme", notes_it: "Compressione a bassa velocità; regolatore «Quick Range» di DVO; posizione 1 = completamente aperto (il più morbido), 6 = il più rigido", notes_es: "Compresión de baja velocidad; ajuste «Quick Range» de DVO; posición 1 = totalmente abierto (el más blando), 6 = el más firme", notes_pt: "Compressão de baixa velocidade; ajuste “Quick Range” da DVO; posição 1 = totalmente aberto (o mais macio), 6 = o mais firme", dialColor: green }
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: numerical, unit: turns, min: 0, notes: "High-Speed Compression; Start fully open (counter-clockwise) and adjust 1-2 full rotations at a time; clockwise = firmer", notes_de: High-Speed-Druckstufe; ganz offen beginnen (gegen den Uhrzeigersinn) und jeweils 1-2 volle Umdrehungen verstellen; im Uhrzeigersinn = fester, notes_fr: Compression haute vitesse ; partez entièrement ouvert (sens antihoraire) et réglez de 1-2 tours complets à la fois ; sens horaire = plus ferme, notes_it: Compressione ad alta velocità; parti completamente aperto (senso antiorario) e regola di 1-2 giri completi alla volta; senso orario = più rigido, notes_es: Compresión de alta velocidad; empieza totalmente abierto (sentido antihorario) y ajusta 1-2 vueltas completas cada vez; sentido horario = más firme, notes_pt: Compressão de alta velocidade; comece totalmente aberto (sentido anti-horário) e ajuste 1-2 voltas completas de cada vez; sentido horário = mais firme }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 22, notes: "Counted from fully closed (slowest); estimated maximum, check your dial and edit it if it differs", notes_de: "Von ganz geschlossen (am langsamsten) gezählt; geschätztes Maximum, am Drehrad prüfen und bei Abweichung anpassen", notes_fr: "Compté depuis la position entièrement fermée (la plus lente) ; maximum estimé, vérifiez votre cadran et modifiez-le s’il diffère", notes_it: "Contato a partire dalla posizione completamente chiusa (la più lenta); massimo stimato, controlla la tua manopola e modificalo se è diverso", notes_es: "Contado desde la posición totalmente cerrada (la más lenta); máximo estimado, comprueba tu dial y edítalo si es distinto", notes_pt: "Contado a partir da posição totalmente fechada (a mais lenta); máximo estimado, confira o seu seletor e edite-o se for diferente" }
      source:
        - https://tech.dvosuspension.com/wp-content/uploads/2020/09/DVO-Set-Up-Guide-2020-v4.pdf
      note: >-
        LSC 6 clicks from the DVO Fork Set-Up Guide 2020 v4, p.14: "Our suspension forks come
        with a 'Quick Range' low speed compression adjuster that has 6 clicks of adjustment.
        Setting '1' is wide open ... you can switch the LSC to '6'". HSC on p.12 of the same
        guide is a "full range" adjuster with a rotations-based base chart (0-5) and no stated
        total. Rebound 22 is an estimate: the highest column of the "Rebound Clicks - Starting
        From Closed" charts (2-22 in 2-click steps, p.10) for Sapphire 34 D1 / Onyx SC / Onyx
        DC. DVO states no total for these forks; for the Diamond the same chart axis runs to
        22 against a stated 20, so the axis can overshoot.

    quick_range_d2e2:
      name: Quick Range D2/E2 (BERYL)
      description: |-
        - Mid-tier BERYL damper with a 4-click "Quick Range" Low Speed Compression dial, soft through firm
        - OTT is set internally to one of three positions for your body weight, so it is not a trailside adjustment
      description_de: |-
        - BERYL-Dämpfer der mittleren Klasse mit 4-Klick-„Quick Range“-Low-Speed-Druckstufenrad, von weich bis fest
        - OTT wird intern je nach Körpergewicht auf eine von drei Positionen gesetzt und ist daher keine Einstellung am Trailrand
      description_fr: |-
        - Amortisseur BERYL de milieu de gamme avec une molette de compression basse vitesse « Quick Range » à 4 clics, de souple à ferme
        - L’OTT est réglé en interne sur l’une de trois positions selon votre poids, ce n’est donc pas un réglage à faire au bord du sentier
      description_it: |-
        - Ammortizzatore BERYL di fascia media con una manopola di compressione a bassa velocità «Quick Range» a 4 scatti, da morbida a rigida
        - L’OTT è impostato internamente su una di tre posizioni in base al tuo peso, quindi non è una regolazione da fare a bordo sentiero
      description_es: |-
        - Amortiguador BERYL de gama media con una rueda de compresión de baja velocidad «Quick Range» de 4 clics, de blanda a firme
        - El OTT se ajusta internamente en una de tres posiciones según tu peso corporal, así que no es un ajuste para hacer a pie de sendero
      description_pt: |-
        - Amortecedor BERYL de nível intermediário com um seletor de compressão de baixa velocidade “Quick Range” de 4 cliques, de macio a firme
        - O OTT é ajustado internamente em uma de três posições conforme o seu peso, então não é um ajuste para fazer na beira da trilha
      adjustments:
        - { name: Compression, name_de: Druckstufe, name_fr: Compression, name_it: Compressione, name_es: Compresión, name_pt: Compressão, type: step, max: 4, notes: "Low-Speed Compression; Soft → Medium → Firm dial; counted from fully open (soft)", notes_de: Low-Speed-Druckstufe; Rad Soft → Medium → Firm; von ganz offen (weich) gezählt, notes_fr: Compression basse vitesse ; molette Souple → Moyen → Ferme ; comptée depuis la position entièrement ouverte (souple), notes_it: Compressione a bassa velocità; manopola Morbida → Media → Rigida; contata a partire dalla posizione completamente aperta (morbida), notes_es: Compresión de baja velocidad; rueda Blanda → Media → Firme; contada desde la posición totalmente abierta (blanda), notes_pt: Compressão de baixa velocidade; seletor Macia → Média → Firme; contada a partir da posição totalmente aberta (macia), dialColor: green }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 22, notes: "Counted from fully closed (slowest); estimated maximum, check your dial and edit it if it differs", notes_de: "Von ganz geschlossen (am langsamsten) gezählt; geschätztes Maximum, am Drehrad prüfen und bei Abweichung anpassen", notes_fr: "Compté depuis la position entièrement fermée (la plus lente) ; maximum estimé, vérifiez votre cadran et modifiez-le s’il diffère", notes_it: "Contato a partire dalla posizione completamente chiusa (la più lenta); massimo stimato, controlla la tua manopola e modificalo se è diverso", notes_es: "Contado desde la posición totalmente cerrada (la más lenta); máximo estimado, comprueba tu dial y edítalo si es distinto", notes_pt: "Contado a partir da posição totalmente fechada (a mais lenta); máximo estimado, confira o seu seletor e edite-o se for diferente" }
      source:
        - https://tech.dvosuspension.com/wp-content/uploads/2020/09/DVO-Set-Up-Guide-2020-v4.pdf
      note: >-
        LSC 4 clicks from the DVO Fork Set-Up Guide 2020 v4, p.14: "The BERYL 'D2 damper' comes
        with a 'Quick Range' low speed compression adjuster that has 4 clicks of adjustment."
        Internal 3-position OTT (Open / Middle / Max by rider weight) from p.5 of the same
        guide. No HSC at this tier. Rebound 22 is an estimate: the highest column of the
        "Rebound Clicks - Starting From Closed" chart (2-22, p.10, Onyx SC D1/E1 - D2/E2);
        DVO states no total.

    diamond36_d1e1:
      name: D1/E1 (Diamond 36)
      description: |-
        - Low Speed Compression, 5 settings: fully clockwise is open, each counter-clockwise click adds support
        - Rebound, 25 clicks counted out from fully closed
        - Full-range High Speed Compression on the green dial, moved a half to a full turn at a time
      description_de: |-
        - Low-Speed-Druckstufe, 5 Einstellungen: ganz im Uhrzeigersinn ist offen, jeder Klick gegen den Uhrzeigersinn gibt mehr Halt
        - Zugstufe, 25 Klicks von ganz geschlossen aus gezählt
        - High-Speed-Druckstufe über den gesamten Bereich am grünen Rad, verstellt in halben bis ganzen Umdrehungen
      description_fr: |-
        - Compression basse vitesse, 5 réglages : entièrement sens horaire = ouvert, chaque clic dans le sens antihoraire ajoute du soutien
        - Détente, 25 clics comptés depuis la position entièrement fermée
        - Compression haute vitesse sur toute la plage sur la molette verte, déplacée d’un demi-tour à un tour complet à la fois
      description_it: |-
        - Compressione a bassa velocità, 5 impostazioni: tutto in senso orario = aperta, ogni scatto in senso antiorario aggiunge sostegno
        - Ritorno, 25 scatti contati a partire dalla posizione completamente chiusa
        - Compressione ad alta velocità a corsa completa sulla manopola verde, spostata da mezzo giro a un giro completo alla volta
      description_es: |-
        - Compresión de baja velocidad, 5 ajustes: todo en sentido horario = abierta, cada clic en sentido antihorario añade apoyo
        - Rebote, 25 clics contados desde la posición totalmente cerrada
        - Compresión de alta velocidad de rango completo en la rueda verde, que se mueve de media vuelta a una vuelta completa cada vez
      description_pt: |-
        - Compressão de baixa velocidade, 5 ajustes: todo no sentido horário = aberta, cada clique no sentido anti-horário acrescenta apoio
        - Retorno, 25 cliques contados a partir da posição totalmente fechada
        - Compressão de alta velocidade de faixa completa no seletor verde, movido de meia volta a uma volta completa de cada vez
      adjustments:
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 5, notes: "Low-Speed Compression; Counted from fully open (softest); counter-clockwise click = firmer", notes_de: Low-Speed-Druckstufe; von ganz offen (am weichsten) gezählt; Klick gegen den Uhrzeigersinn = fester, notes_fr: Compression basse vitesse ; comptée depuis la position entièrement ouverte (la plus souple) ; clic dans le sens antihoraire = plus ferme, notes_it: Compressione a bassa velocità; contata a partire dalla posizione completamente aperta (la più morbida); scatto in senso antiorario = più rigido, notes_es: Compresión de baja velocidad; contada desde la posición totalmente abierta (la más blanda); clic en sentido antihorario = más firme, notes_pt: Compressão de baixa velocidade; contada a partir da posição totalmente aberta (a mais macia); clique no sentido anti-horário = mais firme, dialColor: grey, dialSize: small }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 25, notes: "Counted from fully closed (slowest); opening (counter-clockwise) increases speed", notes_de: Von ganz geschlossen (am langsamsten) gezählt; Öffnen (gegen den Uhrzeigersinn) erhöht die Geschwindigkeit, notes_fr: Compté depuis la position entièrement fermée (la plus lente) ; ouvrir (sens antihoraire) augmente la vitesse, notes_it: Contato a partire dalla posizione completamente chiusa (la più lenta); aprire (senso antiorario) aumenta la velocità, notes_es: Contado desde la posición totalmente cerrada (la más lenta); abrir (sentido antihorario) aumenta la velocidad, notes_pt: Contado a partir da posição totalmente fechada (a mais lenta); abrir (sentido anti-horário) aumenta a velocidade, dialColor: green }
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: numerical, unit: turns, min: 0, notes: "High-Speed Compression; Start fully open (counter-clockwise) and adjust a half to a full turn at a time; clockwise = firmer. DVO publishes no total rotation count", notes_de: High-Speed-Druckstufe; ganz offen beginnen (gegen den Uhrzeigersinn) und jeweils eine halbe bis ganze Umdrehung verstellen; im Uhrzeigersinn = fester. DVO gibt keine Gesamtzahl der Umdrehungen an, notes_fr: Compression haute vitesse ; partez entièrement ouvert (sens antihoraire) et réglez d’un demi-tour à un tour complet à la fois ; sens horaire = plus ferme. DVO ne publie pas le nombre total de tours, notes_it: Compressione ad alta velocità; parti completamente aperto (senso antiorario) e regola da mezzo giro a un giro completo alla volta; senso orario = più rigido. DVO non pubblica il numero totale di giri, notes_es: Compresión de alta velocidad; empieza totalmente abierto (sentido antihorario) y ajusta de media vuelta a una vuelta completa cada vez; sentido horario = más firme. DVO no publica el número total de vueltas, notes_pt: Compressão de alta velocidade; comece totalmente aberto (sentido anti-horário) e ajuste de meia volta a uma volta completa de cada vez; sentido horário = mais firme. A DVO não publica o número total de voltas }
      source:
        - https://dvosuspension.com/wp-content/uploads/2024/05/DVO-Diamond-36-Setup-Guide-May16.pdf
      note: >-
        Diamond 36 Set-Up Guide v1.1: "The D1 models have an adjustable low speed compression
        with 5 settings"; rebound 25 from the numbered scale strip "Open 25 24 ... 2 1 Closed"
        on p.8 (an explicit scale, not a chart-column count); HSC on p.10 is a "Full Rotations
        (NOT Clicks)" adjuster with a 0-5 base chart and no stated total.

    diamond_d3e3:
      name: D3/E3 (Diamond)
      description: |-
        - Base-tier closed-cartridge damper with a full-range Low Speed Compression dial
        - LSC is not click-indexed: start fully open and add support a full turn at a time
      description_de: |-
        - Geschlossene Kartusche der Einstiegsklasse mit Low-Speed-Druckstufenrad über den gesamten Bereich
        - LSC hat keine Klick-Indexierung: ganz offen beginnen und jeweils eine ganze Umdrehung mehr Halt geben
      description_fr: |-
        - Amortisseur à cartouche fermée d’entrée de gamme avec une molette de compression basse vitesse sur toute la plage
        - Le LSC n’est pas indexé par clics : partez entièrement ouvert et ajoutez du soutien d’un tour complet à la fois
      description_it: |-
        - Ammortizzatore a cartuccia chiusa di fascia base con una manopola di compressione a bassa velocità a corsa completa
        - L’LSC non è indicizzato a scatti: parti completamente aperto e aggiungi sostegno un giro completo alla volta
      description_es: |-
        - Amortiguador de cartucho cerrado de gama básica con una rueda de compresión de baja velocidad de rango completo
        - El LSC no está indexado por clics: empieza totalmente abierto y añade apoyo una vuelta completa cada vez
      description_pt: |-
        - Amortecedor de cartucho fechado de nível básico com um seletor de compressão de baixa velocidade de faixa completa
        - O LSC não é indexado por cliques: comece totalmente aberto e acrescente apoio uma volta completa de cada vez
      adjustments:
        - { name: Compression, name_de: Druckstufe, name_fr: Compression, name_it: Compressione, name_es: Compresión, name_pt: Compressão, type: numerical, unit: turns, min: 0, notes: "Low-Speed Compression; Full-range adjuster with no detents — start fully open (counter-clockwise) and make full-turn adjustments; clockwise = firmer", notes_de: Low-Speed-Druckstufe; Versteller über den gesamten Bereich ohne Rasten — ganz offen beginnen (gegen den Uhrzeigersinn) und in ganzen Umdrehungen verstellen; im Uhrzeigersinn = fester, notes_fr: Compression basse vitesse ; réglage sur toute la plage sans crans — partez entièrement ouvert (sens antihoraire) et réglez par tours complets ; sens horaire = plus ferme, notes_it: Compressione a bassa velocità; regolatore a corsa completa senza scatti — parti completamente aperto (senso antiorario) e regola a giri completi; senso orario = più rigido, notes_es: Compresión de baja velocidad; ajuste de rango completo sin muescas — empieza totalmente abierto (sentido antihorario) y ajusta por vueltas completas; sentido horario = más firme, notes_pt: Compressão de baixa velocidade; ajuste de faixa completa sem cliques — comece totalmente aberto (sentido anti-horário) e ajuste por voltas completas; sentido horário = mais firme }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 22, notes: "Counted from fully closed (slowest); estimated maximum, check your dial and edit it if it differs", notes_de: "Von ganz geschlossen (am langsamsten) gezählt; geschätztes Maximum, am Drehrad prüfen und bei Abweichung anpassen", notes_fr: "Compté depuis la position entièrement fermée (la plus lente) ; maximum estimé, vérifiez votre cadran et modifiez-le s’il diffère", notes_it: "Contato a partire dalla posizione completamente chiusa (la più lenta); massimo stimato, controlla la tua manopola e modificalo se è diverso", notes_es: "Contado desde la posición totalmente cerrada (la más lenta); máximo estimado, comprueba tu dial y edítalo si es distinto", notes_pt: "Contado a partir da posição totalmente fechada (a mais lenta); máximo estimado, confira o seu seletor e edite-o se for diferente" }
      source:
        - https://tech.dvosuspension.com/wp-content/uploads/2020/09/DVO-Set-Up-Guide-2020-v4.pdf
