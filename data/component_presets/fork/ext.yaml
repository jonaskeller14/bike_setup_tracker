# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - Era V2.1 / V2 LT (16 / 14 / 20) and Vaia (16 / 10 / 18) totals come from
#     staff-written reviews, not from EXT. The LT carries the V2.1 numbers
#     because EXT lists the same 3-way cartridge; no review gives LT counts.
#   - Era V2.1/V2 LT: published max inflation is a single combined figure
#     (200 psi / 14 bar) rather than separate + / ++ chamber limits like the
#     Aria shock; it is set as both chambers' `max`, the limit neither can
#     exceed. The Era V2.1 uses the Era V2 quick manual's table, which EXT
#     links from the V2.1 page; no V2.1-specific table was found.
#   - Vaia: same ambiguity, single combined ceiling of 250 psi / 17 bar. The
#     Vaia takes positive and negative volume spacers (stock 4 positive, 2
#     negative per the Pinkbike review) but EXT states no maximum count.
#   - Era V2 LT: no wheel size source (Pinkbike's launch article lists none),
#     so the axis is omitted. Era V2S (single air chamber, 4 compression
#     clicks, 20 rebound clicks per its quick manual) is not on EXT's current
#     MTB product list and is not modeled.
#   - Wheel size is not stated on EXT's product pages. Era V2.1 (29" only) and
#     Vaia (designed for 29") come from Pinkbike's review spec lists.
#   - Dial colors: EXT's quick manuals describe the LSC adjuster as nickel-colored
#     and the HSC adjuster as black; neither maps to a palette color, so only
#     the red rebound dials carry `dialColor`.
#   - HS3 volume-spacer / ramp-up chamber counts are not published per model.
