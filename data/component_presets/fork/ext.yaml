# EXT (Extreme Racing Shox) mountain-bike forks — adjustment preset database
#
# Same design as fork/fox.yaml and fork/ohlins.yaml: click ranges belong to
# the DAMPER cartridge, defined once under `option_values.damper` and referenced by id
# from each fork's trims. See SCHEMA.md in this folder.
#
# EXT is an Italian boutique brand (extremeshox.com). Its current MTB fork
# lineup is small: the single-crown "Era" trail/enduro fork (V2.1 and the
# longer-travel V2 LT) and the dual-crown DH/enduro "Vaia". Both use EXT's
# "HS3" hybrid air spring: two positive air valves (Main "+" chamber, filled
# first via a high-pressure Secondary "++" chamber) plus a self-equalizing
# negative chamber.
#
# IMPORTANT — click counts: EXT's product pages and official "quick manual"
# PDFs (extremeshox.com/manuals/) name each hydraulic adjuster (Low-Speed
# Compression, High-Speed Compression, Rebound) and confirm the counting
# convention (turning fully clockwise = fully closed = click 0; opening is
# counterclockwise — the same convention as the schema's default `dial_ccw`),
# but neither publishes a maximum click count for any of the three adjusters.
# The quick manuals only print a rider-weight-based table of *suggested
# starting* clicks (well short of the mechanical max), which is not the same
# thing as the click range — so, per SCHEMA.md's "never guess a number" rule,
# every adjuster is declared with `max: ~`. See "Follow-ups".
brand: EXT
component_type: fork
sources:
  - https://extremeshox.com/
  - https://extremeshox.com/manuals/
  - https://extremeshox.com/product/ext-era-v2-1/
  - https://extremeshox.com/product/ext-era-v2-lt/
  - https://extremeshox.com/product/vaia/
  - https://extremeshox.com/wp-content/uploads/2023/08/quick-manual-Era-v2_20x30.pdf
  - https://extremeshox.com/wp-content/uploads/2024/12/Vaia-Quick-Manual-1.pdf
  - https://extremeshox.com/wp-content/uploads/2023/09/ERA_V2S_quick_manual-5.pdf
  # Secondary — editorial spec lists (wheel size)
  - https://www.pinkbike.com/news/review-ext-era-v21-fork.html
  - https://www.pinkbike.com/news/review-ext-vaia-extra-adjustable-usd-fork.html
updated: 2026-10-05

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    era_cartridge:
      name: EXT Era 3-Way Cartridge
      description: >
        Shared damper cartridge of the Era V2.1 and Era V2 LT: high volume
        cartridge with a 22mm piston, HDRV compression valve (24mm piston) and
        a 24mm-piston IFP reservoir. Independently adjustable Low-Speed
        Compression, High-Speed Compression and Rebound, all counted from fully
        closed (click 0).
      adjustments:
        - { name: LSC, type: step, max: ~, notes: Low-Speed Compression }
        - { name: HSC, type: step, max: ~, notes: High-Speed Compression }
        - { name: Rebound, type: step, max: ~, dialColor: red }
      adjusters: LSC (nickel dial, top of right leg) / HSC (black dial, top of right leg) / Rebound (red dial, bottom of right leg)

    vaia_cartridge:
      name: EXT Vaia 3-Way Cartridge
      description: >
        Vaia's own damper cartridge (dual-crown downhill fork). Independently
        adjustable Low-Speed Compression, High-Speed Compression and Rebound,
        all counted from fully closed (click 0) with the same clockwise-closes
        convention as Era.
      adjustments:
        - { name: LSC, type: step, max: ~, notes: Low-Speed Compression }
        - { name: HSC, type: step, max: ~, notes: High-Speed Compression }
        - { name: Rebound, type: step, max: ~, dialColor: red }
      adjusters: LSC (nickel dial) / HSC (black dial) / Rebound (red dial), all on the fork's left leg

# --------------------------------------------------------------------------
# Forks — current EXT MTB lineup (extremeshox.com, checked 2026-07-17).
# Both forks share the HS3 hybrid air spring (Main "+" / Secondary "++"
# chambers), so trims share the &hs3_air_spring anchor. EXT states an overall
# max inflation pressure per fork (not broken out per chamber the way the
# Aria shock's is) — recorded as a note rather than a per-chamber `max`.
# Wheel size isn't stated on the product pages: Era V2.1 and Vaia take it from
# Pinkbike's review spec lists (29" only / "Designed for 29" wheels"); Era V2 LT
# has no source and is omitted — see Follow-ups.
# --------------------------------------------------------------------------
nodes:
  - label: "Era V2.1"
    level: model
    category: Trail / Enduro
    years: "2025-2026"
    url: https://extremeshox.com/product/ext-era-v2-1/
    setup_guide: https://extremeshox.com/wp-content/uploads/2023/08/quick-manual-Era-v2_20x30.pdf
    children:
      - label: Standard
        level: trim
        specs: { stanchion: "36mm, forged AL 7050 T6 crown", spring: Air }
        adjustments: &hs3_air_spring
          - { name: Main Chamber Pressure, type: numerical, unit: psi, min: 0 }
          - { name: Secondary Chamber Pressure, type: numerical, unit: psi, min: 0, notes: Inflate ++ (secondary) chamber before + (main) chamber; do not exceed 200 psi / 14 bar combined per the product warning label (not broken out per chamber) }
        options:
          damper: [era_cartridge]
          travel_mm: [130, 140, 150, 160, 170]
          wheel_size: [29]
        note: HS3 hybrid dual-positive-chamber air spring; 15QR Boost Torque Cap dropout (15x110mm)

  - label: "Era V2 LT"
    level: model
    category: Enduro
    years: "2025-2026"
    url: https://extremeshox.com/product/ext-era-v2-lt/
    setup_guide: https://extremeshox.com/wp-content/uploads/2023/09/ERA_V2S_quick_manual-5.pdf
    children:
      - label: Standard
        level: trim
        specs: { stanchion: "36mm, stem/crown-integrated design", spring: Air }
        adjustments: *hs3_air_spring
        options:
          damper: [era_cartridge]
          travel_mm: [180, 190]
        note: >
          Longer-travel Super Enduro sibling of the Era V2.1; same HS3
          spring/damper system per EXT's combined Era V2/V2 LT quick manual.
          Axle-to-crown: 594mm (180mm travel) / 604mm (190mm travel).

  - label: "Vaia"
    level: model
    category: Downhill / Enduro
    years: "2025-2026"
    url: https://extremeshox.com/product/vaia/
    setup_guide: https://extremeshox.com/wp-content/uploads/2024/12/Vaia-Quick-Manual-1.pdf
    children:
      - label: Standard
        level: trim
        specs: { stanchion: "38.5mm tapered, dual-crown", spring: Air }
        offset_mm: [44, 48]
        adjustments:
          - { name: Main Chamber Pressure, type: numerical, unit: psi, min: 0 }
          - { name: Secondary Chamber Pressure, type: numerical, unit: psi, min: 0, notes: Inflate ++ (secondary) chamber before + (main) chamber; do not exceed 250 psi / 17 bar combined per the product warning label (not broken out per chamber) }
        options:
          damper: [vaia_cartridge]
          travel_mm: [170, 180, 190, 200]
          wheel_size: [29]
        note: >
          Interchangeable 20mm/15mm(110 Boost) Grade-5 titanium axle;
          two-position cam stem sets 44mm (enduro) or 48mm (DH) offset.
          Weight ~3195g (200mm travel, 20mm axle, cut steerer, oil included).

# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - No maximum click counts are published anywhere for LSC/HSC/Rebound on
#     either Era (V2.1/V2 LT) or Vaia. The Era quick manual's rider-weight
#     table gives only a *suggested starting point* (e.g. HSC-LSC-R = 10-10-18
#     for a <60kg rider), which is not the mechanical max, so all three carry
#     `max: ~`. Verify the real range with EXT support/dealer.
#   - Era V2.1/V2 LT: published max inflation is a single combined figure
#     (200 psi / 14 bar) rather than separate + / ++ chamber limits like the
#     Aria shock (280/600 psi) — not modeled as a per-chamber `max` to avoid
#     misattributing the number to the wrong valve.
#   - Vaia: same ambiguity, single combined ceiling of 250 psi / 17 bar.
#   - Wheel size is not stated on EXT's product pages. Era V2.1 (29" only) and
#     Vaia (designed for 29") come from Pinkbike's review spec lists; Era V2 LT
#     has no approved source (Pinkbike's launch article lists no wheel size),
#     so the axis is omitted there.
#   - Dial colors: EXT's quick manuals describe the LSC adjuster as nickel-colored
#     and the HSC adjuster as black; neither maps to a palette color, so only
#     the red rebound dials carry `dialColor`.
#   - HS3 volume-spacer / ramp-up chamber counts are not published per model.
#   - No older/legacy EXT MTB fork generations (pre-Era V2) are covered —
#     only the current (2026) lineup listed on extremeshox.com.
# --------------------------------------------------------------------------
