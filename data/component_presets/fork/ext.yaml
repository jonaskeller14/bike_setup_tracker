# EXT (Extreme Racing Shox) mountain-bike forks — adjustment preset database
#
# Same design as fork/fox.yaml and fork/ohlins.yaml: click ranges belong to
# the DAMPER cartridge, defined once under `option_values.damper` and referenced by id
# from each fork's trims. See SCHEMA.md in this folder.
#
# EXT is an Italian boutique brand (extremeshox.com). Its current MTB fork
# lineup is small: the single-crown "Era" trail/enduro fork (V2.1 and the
# longer-travel V2 LT) and the dual-crown DH/enduro "Vaia". Both use EXT's
# "HS3" hybrid air spring: two positive air valves (Main "+" chamber, filled
# first via a high-pressure Secondary "++" chamber) plus a self-equalizing
# negative chamber.
#
# IMPORTANT — click counts: EXT's product pages and official "quick manual"
# PDFs (extremeshox.com/manuals/) name each hydraulic adjuster (Low-Speed
# Compression, High-Speed Compression, Rebound) and confirm the counting
# convention (turning fully clockwise = fully closed = click 0; opening is
# counterclockwise — the same convention as the schema's default `dial_ccw`),
# but publish no maximum click count. The totals below therefore come from
# staff-written magazine reviews (secondary tier of SCHEMA.md): Pinkbike and
# Enduro-MTB for the Era V2.1, Pinkbike for the Vaia. See "Follow-ups".
brand: EXT
component_type: fork
sources:
  - https://extremeshox.com/
  - https://extremeshox.com/manuals/
  - https://extremeshox.com/product/ext-era-v2-1/
  - https://extremeshox.com/product/ext-era-v2-lt/
  - https://extremeshox.com/product/vaia/
  - https://extremeshox.com/wp-content/uploads/2023/08/quick-manual-Era-v2_20x30.pdf
  - https://extremeshox.com/wp-content/uploads/2024/12/Vaia-Quick-Manual-1.pdf
  - https://extremeshox.com/wp-content/uploads/2023/09/ERA_V2S_quick_manual-5.pdf
  # Secondary — editorial spec lists (wheel size)
  - https://www.pinkbike.com/news/review-ext-era-v21-fork.html
  - https://www.pinkbike.com/news/review-ext-vaia-extra-adjustable-usd-fork.html
  # Secondary — editorial click totals (rebound / LSC / HSC)
  - https://enduro-mtb.com/en/ext-era-v2-1-best-mtb-fork-test/
updated: 2026-10-13
# Service intervals (`tasks`) come from the quick manuals (the nodes'
# `setup_guide`): every 100 hours or 1 year for amateur use (racing: 50 hours
# or 6 months; the amateur figure is used).

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    era_cartridge:
      name: EXT Era 3-Way Cartridge
      description: >
        Shared damper cartridge of the Era V2.1 and Era V2 LT: high volume
        cartridge with a 22mm piston, HDRV compression valve (24mm piston) and
        a 24mm-piston IFP reservoir. Independently adjustable Low-Speed
        Compression, High-Speed Compression and Rebound, all counted from fully
        closed (click 0).
      description_de: >
        Gemeinsame Dämpferkartusche der Era V2.1 und Era V2 LT: Kartusche mit
        hohem Volumen, 22mm-Kolben, HDRV-Druckstufenventil (24mm-Kolben) und
        IFP-Ausgleichsbehälter mit 24mm-Kolben. Low-Speed-Druckstufe,
        High-Speed-Druckstufe und Zugstufe sind unabhängig einstellbar, alle von
        ganz geschlossen (Klick 0) gezählt.
      description_fr: "Cartouche d’amortisseur commune aux Era V2.1 et Era V2 LT : cartouche grand volume avec un piston de 22 mm, une valve de compression HDRV (piston de 24 mm) et un réservoir IFP à piston de 24 mm. Compression basse vitesse, compression haute vitesse et détente réglables indépendamment, toutes comptées depuis la position entièrement fermée (clic 0)."
      description_it: "Cartuccia dell’ammortizzatore condivisa da Era V2.1 ed Era V2 LT: cartuccia ad alto volume con un pistone da 22 mm, una valvola di compressione HDRV (pistone da 24 mm) e un serbatoio IFP con pistone da 24 mm. Compressione a bassa velocità, compressione ad alta velocità e ritorno regolabili in modo indipendente, tutti contati a partire dalla posizione completamente chiusa (scatto 0)."
      description_es: "Cartucho de amortiguador compartido por las Era V2.1 y Era V2 LT: cartucho de gran volumen con un pistón de 22 mm, una válvula de compresión HDRV (pistón de 24 mm) y un depósito IFP con pistón de 24 mm. Compresión de baja velocidad, compresión de alta velocidad y rebote ajustables de forma independiente, todos contados desde la posición totalmente cerrada (clic 0)."
      description_pt: "Cartucho de amortecedor compartilhado pelas Era V2.1 e Era V2 LT: cartucho de alto volume com um pistão de 22 mm, uma válvula de compressão HDRV (pistão de 24 mm) e um reservatório IFP com pistão de 24 mm. Compressão de baixa velocidade, compressão de alta velocidade e retorno ajustáveis de forma independente, todos contados a partir da posição totalmente fechada (clique 0)."
      adjustments:
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 16, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade }
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 14, notes: High-Speed Compression, notes_de: High-Speed-Druckstufe, notes_fr: Compression haute vitesse, notes_it: Compressione ad alta velocità, notes_es: Compresión de alta velocidad, notes_pt: Compressão de alta velocidade }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 20, dialColor: red }
      adjusters: LSC (nickel dial, top of right leg) / HSC (black dial, top of right leg) / Rebound (red dial, bottom of right leg)
      source:
        - https://www.pinkbike.com/news/review-ext-era-v21-fork.html
        - https://enduro-mtb.com/en/ext-era-v2-1-best-mtb-fork-test/
      note: >-
        Click totals are not published by EXT; taken from the body text of
        Pinkbike's Era V2.1 review ("low-speed and high-speed compression
        adjustment (16 and 14 clicks, respectively) plus 20 clicks of rebound")
        and Enduro-MTB's Era V2.1 test, which gives the same figures. Applied
        to the Era V2 LT, which EXT lists with the same 3-way cartridge.

    vaia_cartridge:
      name: EXT Vaia 3-Way Cartridge
      description: >
        Vaia's own damper cartridge (dual-crown downhill fork). Independently
        adjustable Low-Speed Compression, High-Speed Compression and Rebound,
        all counted from fully closed (click 0) with the same clockwise-closes
        convention as Era.
      description_de: >
        Vaias eigene Dämpferkartusche (Downhill-Gabel mit Doppelbrücke).
        Low-Speed-Druckstufe, High-Speed-Druckstufe und Zugstufe sind unabhängig
        einstellbar, alle von ganz geschlossen (Klick 0) gezählt, mit derselben
        Konvention „im Uhrzeigersinn schließt“ wie bei der Era.
      description_fr: "Cartouche d’amortisseur propre à Vaia (fourche de descente à double té). Compression basse vitesse, compression haute vitesse et détente réglables indépendamment, toutes comptées depuis la position entièrement fermée (clic 0) avec la même convention que sur l’Era : le sens horaire ferme."
      description_it: "Cartuccia dell’ammortizzatore propria di Vaia (forcella da downhill a doppia piastra). Compressione a bassa velocità, compressione ad alta velocità e ritorno regolabili in modo indipendente, tutti contati a partire dalla posizione completamente chiusa (scatto 0) con la stessa convenzione dell’Era: il senso orario chiude."
      description_es: "Cartucho de amortiguador propio de Vaia (horquilla de descenso de doble corona). Compresión de baja velocidad, compresión de alta velocidad y rebote ajustables de forma independiente, todos contados desde la posición totalmente cerrada (clic 0) con la misma convención que la Era: el sentido horario cierra."
      description_pt: "Cartucho de amortecedor próprio da Vaia (garfo de downhill de dupla coroa). Compressão de baixa velocidade, compressão de alta velocidade e retorno ajustáveis de forma independente, todos contados a partir da posição totalmente fechada (clique 0) com a mesma convenção da Era: o sentido horário fecha."
      adjustments:
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 16, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade }
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 10, notes: High-Speed Compression, notes_de: High-Speed-Druckstufe, notes_fr: Compression haute vitesse, notes_it: Compressione ad alta velocità, notes_es: Compresión de alta velocidad, notes_pt: Compressão de alta velocidade }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 18, dialColor: red }
      adjusters: LSC (nickel dial) / HSC (black dial) / Rebound (red dial), all on the fork's left leg
      source: https://www.pinkbike.com/news/review-ext-vaia-extra-adjustable-usd-fork.html
      note: >-
        Click totals are not published by EXT; read off the setup block of
        Pinkbike's Vaia review ("Rebound: -18/18 (open) LSC -12/16 HSC -8/10"),
        where each entry reads clicks from closed / total clicks.

# --------------------------------------------------------------------------
# Setup guide — the Era V2 quick manual's suggested setup as data (SCHEMA.md,
# "Setup guides"), transcribed from docs/research/setup_guides/ext.md. The
# table keys rider weight by points (60-90 kg) and prints open rows below
# 60 kg and above 100 kg. Clicks count from fully closed, the catalog's
# direction. The Vaia quick manual prints no setup values.
# --------------------------------------------------------------------------
guides:
  ext_era_v2_2023:
    label: EXT Era V2 quick manual (2023)
    label_de: EXT Era V2 Kurzanleitung (2023)
    label_fr: Guide rapide EXT Era V2 (2023)
    label_it: Guida rapida EXT Era V2 (2023)
    label_es: Manual rápido EXT Era V2 (2023)
    label_pt: Manual rápido EXT Era V2 (2023)
    source: https://extremeshox.com/wp-content/uploads/2023/08/quick-manual-Era-v2_20x30.pdf
    # The "> 100 kg" row is left out of every rule: an open row must continue
    # the table at its edge, and the table jumps from the 90 kg point to it.
    # The "< 60 kg" pressure cells (< 45 / < 70 psi) have no published
    # minimum, so that row stays only in the click rules.
    rules:
      - target: main_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: { 60: 45, 70: 55, 80: 65, 90: 75 }
      - target: secondary_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: { 60: 70, 70: 85, 80: 100, 90: 115 }
      - target: hsc
        input: rider_weight
        input_unit: kg
        rows: { "<60": 10, 60: 9, 70: 8, 80: 7, 90: 6 }
      - target: lsc
        input: rider_weight
        input_unit: kg
        rows: { "<60": 10, 60: 9, 70: 8, 80: 7, 90: 6 }
      - target: rebound
        input: rider_weight
        input_unit: kg
        rows: { "<60": 18, 60: 16, 70: 14, 80: 12, 90: 10 }
      # EXT's Suspension Setup page, which names the Era V2.1 and Era V2 LT.
      - { target: sag, range: [15, 20], comfort_at: max }

# --------------------------------------------------------------------------
# Forks — current EXT MTB lineup (extremeshox.com, checked 2026-07-17).
# Both forks share the HS3 hybrid air spring (Main "+" / Secondary "++"
# chambers), so trims share the &hs3_air_spring anchor. EXT states an overall
# max inflation pressure per fork (not broken out per chamber the way the
# Aria shock's is). Neither chamber can exceed it, so the Era's 200 psi is
# each chamber's `max`; the Vaia's 250 psi stays a note.
# Wheel size isn't stated on the product pages: Era V2.1 and Vaia take it from
# Pinkbike's review spec lists (29" only / "Designed for 29" wheels"); Era V2 LT
# has no source and is omitted — see Follow-ups.
