        - Lockout sulla piastra con forza di lockout regolabile
      description_es: |-
        - Cartucho de inserción directa con Internal Floating Technology (unas rótulas permiten que el muelle neumático y el cartucho se muevan con independencia del chasis)
        - Una sola rueda de compresión mueve a la vez la compresión de alta y de baja velocidad
        - Las válvulas Compression Tuning System (CTS) se cambian para modificaciones más grandes
        - Lockout en la corona con fuerza de lockout ajustable
      description_pt: |-
        - Cartucho de encaixe direto com Internal Floating Technology (juntas esféricas permitem que a mola a ar e o cartucho se movam independentemente do chassi)
        - Um único seletor de compressão move juntas a compressão de alta e de baixa velocidade
        - As válvulas Compression Tuning System (CTS) são trocadas para mudanças maiores
        - Lockout na coroa com força de lockout ajustável
      adjustments:
        - { name: Compression, name_de: Druckstufe, name_fr: Compression, name_it: Compressione, name_es: Compresión, name_pt: Compressão, type: step, max: 12, notes: High and Low Speed (one combined dial), notes_de: High- und Low-Speed (ein gemeinsames Rad), notes_fr: Haute et basse vitesse (une seule molette combinée), notes_it: Alta e bassa velocità (un’unica manopola combinata), notes_es: Alta y baja velocidad (una sola rueda combinada), notes_pt: Alta e baixa velocidade (um único seletor combinado) }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 21 }
        - { name: Lockout, name_de: Lockout, name_fr: Lockout, name_it: Lockout, name_es: Lockout, name_pt: Lockout, type: categorical, options: [Open, Locked], options_de: [Offen, Gesperrt], options_fr: [Ouvert, Verrouillé], options_it: [Aperto, Bloccato], options_es: [Abierto, Bloqueado], options_pt: [Aberto, Travado], notes: Crown-mounted lever, notes_de: Hebel an der Gabelbrücke, notes_fr: Levier sur le té, notes_it: Leva sulla piastra, notes_es: Palanca en la corona, notes_pt: Alavanca na coroa }
      source:
