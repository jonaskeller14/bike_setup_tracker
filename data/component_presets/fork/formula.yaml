# --------------------------------------------------------------------------
# Setup guides — the owner's manuals' starting points as data (SCHEMA.md,
# "Setup guides"), transcribed from docs/research/setup_guides/formula.md.
#   * The manuals print rider weight → air pressure only; no clicks or SAG.
#   * Multi-chamber forks get one rule per chamber. The rules between the
#     chambers (inflation order, Bronze relative to Silver) are notes.
#   * Selva V: its table prints the "PSI" and "BAR" headers swapped, so it
#     stays out until the headers are settled (see Follow-ups).
#   * Selva C and Nero C: no spring-by-weight chart is published.
# --------------------------------------------------------------------------
guides:
  formula_selva_s_2018:
    label: Formula Selva S owner's manual
    label_de: Formula Selva S Bedienungsanleitung
    label_fr: Manuel d’utilisation Formula Selva S
    label_it: Manuale d’uso Formula Selva S
    label_es: Manual del usuario Formula Selva S
    label_pt: Manual do usuário Formula Selva S
    source: https://www.rideformula.com/wp-content/uploads/2018/10/Manuale_SELVA_S_GB.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: { 50: 45, 60: 55, 70: 65, 80: 75, 90: 85, 100: 95, 110: 105, 120: 115 }
      - { target: neopos, value: 0, note: Neopos are optional on the Selva S, note_de: Neopos sind bei der Selva S optional, note_fr: Les Neopos sont en option sur la Selva S, note_it: I Neopos sono opzionali sulla Selva S, note_es: Los Neopos son opcionales en la Selva S, note_pt: Os Neopos são opcionais na Selva S }

  formula_selva_r_2023:
    label: Formula Selva R owner's manual
    label_de: Formula Selva R Bedienungsanleitung
    label_fr: Manuel d’utilisation Formula Selva R
    label_it: Manuale d’uso Formula Selva R
    label_es: Manual del usuario Formula Selva R
    label_pt: Manual do usuário Formula Selva R
    source: https://www.rideformula.com/wp-content/uploads/2023/06/Manuale_SELVA_R_GB-Def.pdf
    rules:
      # The table prints no unit; its values only fit psi (the manual's
      # limits are 125 psi and a ±10 psi Bronze window).
      - target: main_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: { 60: 60, 70: 70, 80: 80, 90: 90, 100: 100 }
        note: Inflate the Silver chamber first
        note_de: Zuerst die Silver-Kammer befüllen
        note_fr: Gonflez d’abord la chambre Silver
        note_it: Gonfia prima la camera Silver
        note_es: Infla primero la cámara Silver
        note_pt: Encha primeiro a câmara Silver
      - target: negative_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: { 60: 80, 70: 90, 80: 100, 90: 110, 100: 120 }
        note: "Set after Silver, with the lockout closed; up to 10 psi more for a softer initial stroke, up to 10 psi less for a firmer one"
        note_de: Nach Silver einstellen, bei geschlossenem Lockout; bis zu 10 psi mehr für einen weicheren Anfangsfederweg, bis zu 10 psi weniger für einen festeren
        note_fr: À régler après Silver, lockout fermé ; jusqu’à 10 psi de plus pour une première partie de course plus souple, jusqu’à 10 psi de moins pour une plus ferme
        note_it: Da impostare dopo Silver, con il lockout chiuso; fino a 10 psi in più per una prima parte di corsa più morbida, fino a 10 psi in meno per una più rigida
        note_es: Se ajusta después de Silver, con el lockout cerrado; hasta 10 psi más para un inicio de recorrido más blando, hasta 10 psi menos para uno más firme
        note_pt: Ajuste depois de Silver, com o lockout fechado; até 10 psi a mais para um início de curso mais macio, até 10 psi a menos para um mais firme
      - { target: neopos, value: 1, note: One Neopos fitted as delivered, note_de: Ein Neopos ist wie ausgeliefert verbaut, note_fr: Un Neopos monté à la livraison, note_it: Un Neopos montato alla consegna, note_es: Un Neopos montado de fábrica, note_pt: Um Neopos montado na entrega }

  formula_belva_2024:
    label: Formula Belva user manual
    label_de: Formula Belva Bedienungsanleitung
    label_fr: Manuel d’utilisation Formula Belva
    label_it: Manuale d’uso Formula Belva
    label_es: Manual del usuario Formula Belva
    label_pt: Manual do usuário Formula Belva
    source: https://www.rideformula.com/wp-content/uploads/2024/03/Manuale-Utente-Belva-ENG.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: { 50: 50, 70: 65, 90: 80 }

  formula_nero_r_2017:
    label: Formula Nero R owner's manual
    label_de: Formula Nero R Bedienungsanleitung
    label_fr: Manuel d’utilisation Formula Nero R
    label_it: Manuale d’uso Formula Nero R
    label_es: Manual del usuario Formula Nero R
    label_pt: Manual do usuário Formula Nero R
    source: https://www.rideformula.com/wp-content/uploads/2017/08/Nero-R-owner-manual.pdf
    rules:
      - target: progressivity_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: { 60: 110, 70: 120, 80: 130, 90: 140, 100: 150 }
        note: Inflate Gold first and keep it at or above Silver
        note_de: Zuerst Gold befüllen und auf oder über dem Silver-Druck halten
        note_fr: Gonflez Gold en premier et gardez-le au moins à la pression de Silver
        note_it: Gonfia Gold per prima e tienila almeno alla pressione di Silver
        note_es: Infla Gold primero y mantenla al menos a la presión de Silver
        note_pt: Encha Gold primeiro e mantenha-a pelo menos na pressão de Silver
      - target: main_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: { 60: 80, 70: 90, 80: 100, 90: 110, 100: 120 }
        note: Inflate Silver after Gold; let Bronze out before checking it
        note_de: Silver nach Gold befüllen; vor der Kontrolle Luft aus Bronze ablassen
        note_fr: Gonflez Silver après Gold ; videz Bronze avant de la contrôler
        note_it: Gonfia Silver dopo Gold; scarica Bronze prima di controllarla
