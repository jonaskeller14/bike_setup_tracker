# Formula mountain-bike forks — adjustment preset database
#
# Same design as fork/fox.yaml: click ranges belong to the DAMPER cartridge,
# defined once under `option_values.damper` and referenced by id from each fork's trims.
# See SCHEMA.md in this folder.
#
# Formula (Formula SRL, Italy — the official site is rideformula.com) sells a
# small lineup: the single-crown Selva family (V, S, R, C), the dual-crown
# Belva and the DH-only Nero (R, C). Every fork uses a "drop-in cartridge with
# Internal Floating Technology" damper; the Selva family shares one damper
# design (the Selva C page: "the same damping as the other models of the Selva
# family"), the Nero R and Nero C share another ("The damper is identical to
# that used in the Nero R"). The Selva V and the Belva each list a different
# rebound total, so each gets its own damper id — nothing is copied across.
#
# Formula's product pages give one "Compression: High and Low Speed N click
# adjustment" line for the Selva/Belva family. BikeRadar's Selva R review
# (2023) explains that those forks have a single compression dial that moves
# high- and low-speed compression together, so it is modelled as one
# `Compression` adjuster. The Nero is the exception: its page lists separate
# "Compression LS" and "Compression HS" totals, so it gets two adjusters.
#
# Scope: the current lineup. Formula's older Thirty-Five / earlier forks and
# the 100-unit Josh Bryceland Edition Selva are not listed — see Follow-ups.

brand: Formula
component_type: fork
sources:
  - https://www.rideformula.com/cat/mtb-forks/
  - https://www.rideformula.com/products/mountain-bike/selva-v/
  - https://www.rideformula.com/products/mountain-bike/selva-s/
  - https://www.rideformula.com/products/mountain-bike/selva-r-2/
  - https://www.rideformula.com/products/mountain-bike/selva-c/
  - https://www.rideformula.com/products/mtb-forks/belva/
  - https://www.rideformula.com/products/mountain-bike/nero-r/
  - https://www.rideformula.com/products/mountain-bike/nero-c/
  # Formula user manuals (PDF)
  - https://www.rideformula.com/wp-content/uploads/2025/06/Selva_V_User_Manual_EN-1.pdf
  - https://www.rideformula.com/wp-content/uploads/2023/06/Manuale_SELVA_R_GB-Def.pdf
  - https://www.rideformula.com/wp-content/uploads/2017/08/Nero-R-owner-manual.pdf
  - https://www.rideformula.com/wp-content/uploads/2017/08/Nero-C-Owner-manual.pdf
  - https://www.rideformula.com/wp-content/uploads/2024/03/Manuale-Utente-Belva-ENG.pdf
  - https://www.rideformula.com/wp-content/uploads/2018/10/Manuale_SELVA_S_GB.pdf
  - https://www.rideformula.com/wp-content/uploads/2018/10/2021_02-FORCEL_SELVA_C_GB.pdf
  # Editorial — used for the single-dial compression design (BikeRadar) and
  # the first model years only, never for click counts
  - https://www.bikeradar.com/reviews/components/forks/suspension-forks/formula-selva-r-suspension-fork-review
  - https://www.pinkbike.com/news/formula-nero-dh-fork-first-look-2017.html
  - https://www.pinkbike.com/news/formula-presents-the-new-selva-coil.html
  - https://www.mbr.co.uk/news/2019-formula-selva-r-377158
  - https://www.mbr.co.uk/news/formula-new-selva-v-boasts-less-stiction-450993
  - https://www.bikeradar.com/news/2024formula-belva
updated: 2026-10-13
# Service intervals (`tasks`) come from the owner's manuals cited above (Selva,
# Nero, Belva share the table): leg cleaning with seal and bushing check every
# 30 hours or 6 months, cartridge and air spring every 100 hours or 1 year.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    selva_v_2025:
      name: Selva V cartridge
      description: |-
        - Drop-in bladder-style cartridge with Internal Floating Technology
        - One compression dial moves high- and low-speed compression together
        - Compression Tuning System (CTS) valves swap in for larger changes
        - Crown-mounted lockout with an adjustable lockout force
      adjustments:
        - { name: Compression, type: step, max: 12, notes: High and Low Speed (one combined dial), dialColor: blue }
        - { name: Rebound, type: step, max: 19 }
        - { name: Lockout, type: categorical, options: [Open, Locked], notes: Crown-mounted lever }
      source:
        - https://www.rideformula.com/products/mountain-bike/selva-v/
        - https://www.rideformula.com/wp-content/uploads/2025/06/Selva_V_User_Manual_EN-1.pdf
      note: >-
        Selva V page: "Rebound: 19 Click Adjustment", "Compression: High and Low
        Speed 12 click adjustment", "Blue and Gold valves included". The V manual
        (sections 8-9) describes a single blue compression knob, a gold lockout
        lever and a black lockout-force adjuster. The page says the damper
        architecture is unchanged from the previous Selva, yet lists 19 rebound
        clicks against the older Selva's 21, so the two are kept apart.

    selva_2017:
      name: Selva cartridge
      description: |-
        - Drop-in cartridge with Internal Floating Technology (ball joints let the air spring and cartridge move independently of the chassis)
        - One compression dial moves high- and low-speed compression together
        - Compression Tuning System (CTS) valves swap in for larger changes
        - Crown-mounted lockout with an adjustable lockout force
      adjustments:
        - { name: Compression, type: step, max: 12, notes: High and Low Speed (one combined dial) }
        - { name: Rebound, type: step, max: 21 }
        - { name: Lockout, type: categorical, options: [Open, Locked], notes: Crown-mounted lever }
      source:
        - https://www.rideformula.com/products/mountain-bike/selva-s/
        - https://www.rideformula.com/products/mountain-bike/selva-r-2/
        - https://www.rideformula.com/products/mountain-bike/selva-c/
        - https://www.bikeradar.com/reviews/components/forks/suspension-forks/formula-selva-r-suspension-fork-review
      note: >-
        Selva S, R and C pages each state "Rebound: 21 Click Adjustment" and
        "Compression: High and Low Speed 12 Click Adjustment". BikeRadar's Selva R
        review confirms one dial for high- and low-speed compression together and
        counts rebound "from closed out of 21".

    belva_2024:
      name: Belva cartridge
      description: |-
        - Drop-in cartridge with Internal Floating Technology
        - One compression dial moves high- and low-speed compression together
        - Compression Tuning System (CTS) valves swap in for larger changes
        - Crown-mounted lockout, optional remote cartridge control
      adjustments:
        - { name: Compression, type: step, max: 12, notes: High and Low Speed (one combined dial), dialColor: blue }
        - { name: Rebound, type: step, max: 18 }
        - { name: Lockout, type: categorical, options: [Open, Locked], notes: Crown-mounted lever }
      source: https://www.rideformula.com/products/mtb-forks/belva/
      note: >-
        Belva page: "Rebound: 18 Click Adjustment", "Compression: High and Low
        Speed 12 Click Adjustment". The Belva page shows 18 rebound clicks, not
        the Selva's 21.

    nero_2017:
      name: Nero cartridge
      description: |-
        - Downhill drop-in cartridge with Internal Floating Technology
        - Separate high-speed compression, low-speed compression and rebound dials
        - Compression Tuning System (CTS) valves swap in for larger changes
      adjustments:
        - { name: HSC, type: step, max: 20, notes: High-Speed Compression }
        - { name: LSC, type: step, max: 12, notes: Low-Speed Compression }
        - { name: Rebound, type: step, max: 21 }
      source:
        - https://www.rideformula.com/products/mountain-bike/nero-r/
        - https://www.rideformula.com/products/mountain-bike/nero-c/
        - https://www.rideformula.com/wp-content/uploads/2017/08/Nero-R-owner-manual.pdf
      note: >-
        Nero R and Nero C pages: "Rebound: 21 Click adjustment", "Compression LS:
        12 Click adjustment", "Compression HS: 20 Click adjustment". The Nero C
        page states its damper is identical to the Nero R's. The Nero R manual
        (section 3.2) confirms separate high-speed and low-speed knobs.

# --------------------------------------------------------------------------
# Setup guides — the owner's manuals' starting points as data (SCHEMA.md,
# "Setup guides"), transcribed from docs/research/setup_guides/formula.md.
#   * The manuals print rider weight → air pressure only; no clicks or SAG.
#   * Multi-chamber forks get one rule per chamber. The rules between the
#     chambers (inflation order, Bronze relative to Silver) are notes.
#   * Selva V: its table prints the "PSI" and "BAR" headers swapped, so it
#     stays out until the headers are settled (see Follow-ups).
#   * Selva C and Nero C: no spring-by-weight chart is published.
# --------------------------------------------------------------------------
guides:
  formula_selva_s_2018:
    label: Formula Selva S owner's manual
    source: https://www.rideformula.com/wp-content/uploads/2018/10/Manuale_SELVA_S_GB.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: { 50: 45, 60: 55, 70: 65, 80: 75, 90: 85, 100: 95, 110: 105, 120: 115 }
      - { target: neopos, value: 0, note: Neopos are optional on the Selva S }

  formula_selva_r_2023:
    label: Formula Selva R owner's manual
    source: https://www.rideformula.com/wp-content/uploads/2023/06/Manuale_SELVA_R_GB-Def.pdf
    rules:
      # The table prints no unit; its values only fit psi (the manual's
      # limits are 125 psi and a ±10 psi Bronze window).
      - target: main_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: { 60: 60, 70: 70, 80: 80, 90: 90, 100: 100 }
        note: Inflate the Silver chamber first
      - target: negative_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: { 60: 80, 70: 90, 80: 100, 90: 110, 100: 120 }
        note: "Set after Silver, with the lockout closed; up to 10 psi more for a softer initial stroke, up to 10 psi less for a firmer one"
      - { target: neopos, value: 1, note: One Neopos fitted as delivered }

  formula_belva_2024:
    label: Formula Belva user manual
    source: https://www.rideformula.com/wp-content/uploads/2024/03/Manuale-Utente-Belva-ENG.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: { 50: 50, 70: 65, 90: 80 }

  formula_nero_r_2017:
    label: Formula Nero R owner's manual
    source: https://www.rideformula.com/wp-content/uploads/2017/08/Nero-R-owner-manual.pdf
    rules:
      - target: progressivity_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: { 60: 110, 70: 120, 80: 130, 90: 140, 100: 150 }
        note: Inflate Gold first and keep it at or above Silver
      - target: main_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: { 60: 80, 70: 90, 80: 100, 90: 110, 100: 120 }
        note: Inflate Silver after Gold; let Bronze out before checking it
      - target: sensitivity_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: { 60: 100, 70: 110, 80: 120, 90: 130, 100: 140 }
        note: Inflate Bronze last and keep it at least 20 psi above Silver
      # Neopos: the manual allows up to three but no count fitted as delivered
      # is published, so there is no rule.

# --------------------------------------------------------------------------
# Forks — newest first
# Selva V (2025) and the earlier Selva S / R / C are trims of the one Selva
# model. They are not generations of each other, so each trim carries its own
# `years` and `url` instead of sitting below a generation node.
# --------------------------------------------------------------------------
nodes:
  - label: "Selva"
    level: model
    category: Enduro / All-Mountain
    setup_guide: https://www.rideformula.com/wp-content/uploads/2023/06/Manuale_SELVA_R_GB-Def.pdf
    tasks: &formula_service
      fork:lower_leg_service: { interval: { moving_time_h: 30 }, fallback: { days: 180 }, source: Formula owner's manual }
      fork:full_service: { interval: { moving_time_h: 100 }, fallback: { days: 365 }, source: Formula owner's manual }
    children:
      - label: V
        level: trim
        years: "2025-2026"
        url: https://www.rideformula.com/products/mountain-bike/selva-v/
        setup_guide: https://www.rideformula.com/wp-content/uploads/2025/06/Selva_V_User_Manual_EN-1.pdf
        specs: { stanchion: 35mm 7075 aluminum, spring: Air }
        offset_mm: [43]
        adjustments:
          - { name: Pressure, type: numerical, unit: psi, min: 0 }
          - { name: Neopos, type: step, max: 3, visualization: stepper, unit: tokens, notes: Sponge-like tokens in the positive chamber for mid-stroke support }
        options:
          damper: [selva_v_2025]
          travel_mm: [160, 170, 180]
          wheel_size: [29, 27.5]
        # Neopos count: Selva V manual, section 11 ("Between 0 and 3 neopos")
        note: |-
          - New dual-chamber V air spring with a floating piston for low friction
          - One valve inflates both chambers; a bypass valve balances them and a reset valve empties both to start over
          - 15x110mm Boost with the Integrated Locking System axle, PM7 brake mount, from 2030g
      - label: R
        level: trim
        years: "2019-2026"
        url: https://www.rideformula.com/products/mountain-bike/selva-r-2/
        guide: formula_selva_r_2023
        specs: { stanchion: 35mm 7075 aluminum, spring: Air }
        offset_mm: [37, 43]
        adjustments:
          - { name: Main Chamber Pressure, type: numerical, unit: psi, min: 0, max: 125, notes: Silver chamber (positive) }
          - { name: Negative Chamber Pressure, type: numerical, unit: psi, min: 0, max: 125, notes: Bronze chamber (sensitivity) }
          - { name: Neopos, type: step, max: 3, visualization: stepper, unit: tokens, notes: Sponge-like tokens in the positive chamber for mid-stroke support; one included }
        options:
          damper: [selva_2017]
          travel_mm: [120, 130, 140, 160, 170, 180]
          wheel_size: [29, 27.5]
        # Neopos count: Selva R manual ("max. three Neopos"); max pressure
        # 125 psi: Selva R manual; Silver/Bronze
        # naming: Selva R page ("Silver (main), Bronze (sensitivity)")
        note: |-
          - 2Air spring: separate positive (Silver) and negative (Bronze) chambers, each set with a shock pump
          - Travel is internally adjustable with spacers, in a 27.5" and a 29" / 27.5+ chassis
      - label: C
        level: trim
        years: "2019-2026"
        url: https://www.rideformula.com/products/mountain-bike/selva-c/
        setup_guide: https://www.rideformula.com/wp-content/uploads/2018/10/2021_02-FORCEL_SELVA_C_GB.pdf
        specs: { stanchion: 35mm 7075 aluminum, spring: Coil }
        offset_mm: [37, 43]
        adjustments:
          - { name: Spring Rate, type: categorical, options: [Soft, Medium, Firm, Super Firm], notes: Medium is the default coil }
          - { name: Preload, type: step, max: 10, notes: External preload knob on the right side of the fork }
        options:
          damper: [selva_2017]
          travel_mm: [160, 170]
          wheel_size: [29, 27.5]
        note: |-
          - Steel coil spring with an external preload knob
          - Same damper and CTS tunability as the air Selvas
      - label: S
        level: trim
        years: "2017-2026"
        url: https://www.rideformula.com/products/mountain-bike/selva-s/
        setup_guide: https://www.rideformula.com/wp-content/uploads/2018/10/Manuale_SELVA_S_GB.pdf
        guide: formula_selva_s_2018
        specs: { stanchion: 35mm 7075 aluminum, spring: Air }
        offset_mm: [37, 43]
        adjustments:
          - { name: Pressure, type: numerical, unit: psi, min: 0, max: 125 }
          - { name: Neopos, type: step, max: 3, visualization: stepper, unit: tokens, notes: Sponge-like tokens in the positive chamber for mid-stroke support }
        options:
          damper: [selva_2017]
          travel_mm: [120, 160, 170, 180]
          wheel_size: [29, 27.5]
        note: |-
          - Single positive air chamber with a steel negative spring (triple coil technology)
          - Travel is internally adjustable with spacers; Neopos are optional
          - Can be converted to a Selva R with Formula's 2Air kit

  - label: "Belva"
    level: model
    category: Enduro / All-Mountain
    tasks: *formula_service
    children:
      - label: "2024–2026"
        level: generation
        id: "2024"
        years: "2024-2026"
        url: https://www.rideformula.com/products/mtb-forks/belva/
        setup_guide: https://www.rideformula.com/wp-content/uploads/2024/03/Manuale-Utente-Belva-ENG.pdf
        guide: formula_belva_2024
        children:
          - label: Air
            level: trim
            specs: { stanchion: 35mm 7075 aluminum, spring: Air }
            offset_mm: [43]
            adjustments:
              - { name: Pressure, type: numerical, unit: psi, min: 0, max: 85 }
            options:
              damper: [belva_2024]
              travel_mm: [170, 180]
              wheel_size: [29, 27.5]
            note: |-
              - Dual-crown enduro fork built on the Selva lowers, 43mm offset, tapered 1.5" steerer
              - Steel negative spring (triple coil technology); Neopos are optional
              - 15x110mm Boost with the Integrated Locking System axle, from 2370g

  - label: "Nero"
    level: model
    category: Downhill
    tasks: *formula_service
    children:
      - label: "2017–2026"
        level: generation
        id: "2017"
        years: "2017-2026"
        url: https://www.rideformula.com/products/mountain-bike/nero-r/
        setup_guide: https://www.rideformula.com/wp-content/uploads/2017/08/Nero-R-owner-manual.pdf
        children:
          - label: R
            level: trim
            guide: formula_nero_r_2017
            specs: { stanchion: 35mm 7075 aluminum, spring: Air }
            offset_mm: [50, 56]
            adjustments:
              - { name: Main Chamber Pressure, type: numerical, unit: psi, min: 0, notes: Silver chamber }
              - { name: Sensitivity Chamber Pressure, type: numerical, unit: psi, min: 0, notes: Bronze chamber (negative) }
              - { name: Progressivity Chamber Pressure, type: numerical, unit: psi, min: 0, notes: Gold chamber (end-stroke) }
              - { name: Neopos, type: step, max: 3, visualization: stepper, unit: tokens, notes: Sponge-like tokens in the positive chamber; one included }
            options:
              damper: [nero_2017]
              travel_mm: [180, 190, 200]
              wheel_size: [29, 27.5]
            # Neopos count: Nero R manual, section 3.4 ("up to three Neopos");
            # travel: 200mm standard, 180/190mm optional on 29" (Nero R page)
            note: |-
              - 3Air spring: three chambers set in the order Gold, Silver, Bronze
              - Keep Gold at or above the Silver pressure and Bronze at least 20 psi above Silver
              - 20mm Boost axle with the FIRM locking system, from 2620g
          - label: C
            level: trim
            url: https://www.rideformula.com/products/mountain-bike/nero-c/
            setup_guide: https://www.rideformula.com/wp-content/uploads/2017/08/Nero-C-Owner-manual.pdf
            specs: { stanchion: 35mm 7075 aluminum, spring: Coil }
            offset_mm: [50, 56]
            adjustments:
              - { name: Spring Rate, type: categorical, options: [Soft, Medium, Firm], notes: Medium is the default coil }
              - { name: Preload, type: numerical, notes: "Tool-free external preload ring nut; fully loose is minimum preload" }
            options:
              damper: [nero_2017]
              travel_mm: [200]
              wheel_size: [29, 27.5]
            note: |-
              - Steel coil spring with a tool-free external preload ring nut
              - Same damper as the Nero R, from 2850g

# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - Click counting direction: no Formula page or manual states where
#     clicks are counted from for the Selva V, Belva or Nero dials. The
#     manuals only say clockwise adds damping; only BikeRadar's Selva R review
#     counts rebound "from closed". The default `dial_ccw` is used everywhere.
#   - Neopos: the Selva S manual states "max. three Neopos"; the Belva manual
#     only says to "add a Neopos" (optional) with no limit, so the Belva has no
#     Neopos adjuster until one is published.
#   - Maximum air pressure: Selva S and R manuals "maximum allowable pressure is
#     125psi"; Belva manual "maximum suggested pressure is 85 psi". The Selva V
#     and Nero R manuals and all product pages state none, so Pressure is
#     unbounded there.
#   - Travel: the product pages give ranges ("120-160mm internally adjustable"
#     for the Selva S, "140-160mm, 120-130mm optional" for the Selva R). The
#     intermediate steps (Selva S 130/140/150mm, Selva R 150mm) are not listed
#     one by one, so they are left out.
#   - Selva C spring options: the spec table lists "Hyper Soft / Super Soft,
#     Soft, Medium (default), Firm, Super Firm" while the intro text names four
#     coils (soft, medium, firm, super firm). The intro's four are used.
#   - Nero C preload: the page and manual describe a tool-free ring nut but no
#     turn or click total, so Preload is an open-ended numerical. (The Selva C
#     page lists a "10-click adjustment" preload, used for its Preload.)
#   - Selva V and Belva wheel sizes come from the manuals' max-wheel-size
#     tables (29x2.5 / 27.5x3.0); the product pages list no wheel size.
#   - Dial colors: the Selva V and Belva manuals name the compression knob blue
#     (gold lockout lever, black lockout-force adjuster); no manual names the
#     rebound knob color, nor any Selva S/R/C or Nero knob.
#   - Model years are first-appearance years from editorial coverage (Nero and
#     Selva S 2017, Selva R and Selva C 2019, Belva 2024, Selva V 2025); Formula
#     publishes no model-year table.
#   - Selva V setup guide: the manual's pressure table prints the "PSI" and
#     "BAR" headers swapped (bar-scale values under PSI, psi bands under
#     BAR). Re-labelled by magnitude it reads 40-50 ... 110-120 psi for
#     50-120 kg; encode once Formula or a newer manual revision confirms it.
#   - Not covered: the 2024 Josh Bryceland Edition Selva (limited to 100 forks,
#     170mm), and older Formula forks (Thirty-Five and earlier); no current
#     Formula page lists them. No current Formula fork named "35" or "Neutron"
#     appears on rideformula.com.
# --------------------------------------------------------------------------
