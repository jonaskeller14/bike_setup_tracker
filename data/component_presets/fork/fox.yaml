# --------------------------------------------------------------------------
# Forks — the current (2025-2027) FOX lineup. A model whose owner's manuals
# differ between model years (36, 36 SL, 38) nests them as `generation` nodes,
# newest first; a new generation starts where a manual changes a table, damper
# range or base tune, not for every model year (see SCHEMA.md, "Generations").
# Years whose manuals match on everything encoded here share one node, and
# `years` spans them.
# Trims are the user-facing sub-models; the damper (and therefore the click
# ranges) can differ per trim. Where a trim offers a choice of damper, list all.
#
# Every FOX fork here is air-sprung; the `&pressure` anchor is the shared
# Pressure entry, and each trim adds its own Volume Spacers maximum where FOX
# publishes one for that chassis.
# --------------------------------------------------------------------------
nodes:
  - label: "32 Taper-Cast"
    level: model
    category: Gravel
    tasks: &fox_service
      fork:full_service: { interval: { moving_time_h: 125 }, fallback: { days: 365 }, source: FOX owner's manual }
    children:
      - label: "2025–2027"
        level: generation
        id: "2025"
        years: "2025-2027"
        url: https://ridefox.com/pages/fox-32-taper-cast
        setup_guide: https://tech.ridefox.com/bike/owners-manuals/3162/fork--2027-32mm--or-34mm-(including-32-step-cast-and-32-taper-cast)
        guide: fox_32_34_2027
        note: 12x100 Kabolt thru-axle, integrated fender mounts
        children:
          - label: Factory
            level: trim
            specs: { stanchion: Kashima, spring: Air }
            adjustments:
              - { name: Pressure, type: numerical, unit: psi, min: 0, max: 150 }
              - { name: Volume Spacers, type: step, max: 4, visualization: stepper, notes: "Maximum 4 at both 40mm and 50mm travel" }
            options:
              damper: [grip_sl]
              travel_mm: [40, 50]
              wheel_size: [700c, 650b]
          - label: Performance
            level: trim
            specs: { stanchion: "7000-series alloy, black anodized", spring: Air }
            adjustments:
              - { name: Pressure, type: numerical, unit: psi, min: 0, max: 150 }
              - { name: Volume Spacers, type: step, max: 4, visualization: stepper }
            options:
              damper: [grip_tc]
              travel_mm: [40]
