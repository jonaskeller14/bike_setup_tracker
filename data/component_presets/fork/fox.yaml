        url: https://ridefox.com/pages/fox-awl
        setup_guide: https://tech.ridefox.com/bike/owners-manuals/3168/fork--2027-awl-or-awl-sport-and-awl-hd-or-awl-hd-sport
        guide: fox_awl_2027
        # travel options + spacer maximums: tech.ridefox.com owner's manual 3101
        children:
          - label: Standard
            level: trim
            specs: { stanchion: 34mm, spring: Air }
            adjustments:
              - { name: Pressure, type: numerical, unit: psi, min: 0, max: 140 }
              - { name: Volume Spacers, type: step, max: 6, visualization: stepper, notes: "Max per travel: 6 at 100mm and 110mm, 5 at 120mm and 130mm, 4 at 140mm and 150mm" }
