# FOX mountain-bike forks — adjustment preset database
#
# Purpose: let a user pick their exact fork (brand › model › trim › damper) and
# have the app auto-add the correct adjustment presets, including the real
# rebound/compression click ranges.
#
# Design: click ranges are a property of the DAMPER, not the model. So dampers
# are defined once under `dampers:` and each fork trim references a damper key.
# This keeps the numbers correct in exactly one place.
#
# See SCHEMA.md in this folder for field definitions and how these entries map
# to the app's Adjustment presets (lib/widgets/sheets/component_add_adjustment.dart).

brand: FOX
component_type: fork
sources:
  - https://ridefox.com/pages/bike-forks
  - https://ridefox.com/pages/fox-36
  - https://ridefox.com/pages/fox-38
  - https://ridefox.com/pages/fox-34
  - https://ridefox.com/pages/fox-40
  - https://ridefox.com/pages/fox-34-sl
  - https://ridefox.com/pages/fox-36-sl
  - https://ridefox.com/pages/fox-32-step-cast
  - https://ridefox.com/pages/fox-32-taper-cast
  - https://ridefox.com/products/podium
  - https://ridefox.com/pages/fox-awl
updated: 2026-07-05
# All click ranges below were taken from the per-model spec tables on the
# official FOX product pages (ridefox.com/pages/fox-<model>). Clicks are counted
# from fully closed (firmest); an adjuster with "18 clicks" has range 0..18.

# --------------------------------------------------------------------------
# Dampers — click ranges shared across every fork that ships with the damper.
# --------------------------------------------------------------------------
dampers:
  grip_x2:
    name: GRIP X2
    description: Most tunable, descent-focused damper (enduro/DH). Four external adjusters.
    adjusters:
      high_speed_compression: { clicks: 8 }
      low_speed_compression:  { clicks: 18 }
      high_speed_rebound:     { clicks: 8 }
      low_speed_rebound:      { clicks: 16 }
    valves: 23

  grip_x:
    name: GRIP X
    description: Trail-focused damper. HSC dial has a Firm detent at its final click (170° sweep).
    adjusters:
      high_speed_compression: { clicks: 15 }   # firm mode engaged at final click
      low_speed_compression:  { clicks: 16 }
      rebound:                { clicks: 17 }   # FOX labels this "low-speed rebound"; single rebound knob
    firm_mode: at final HSC click

  grip_sl:
    name: GRIP SL
    description: Lightweight XC damper. Three on-the-fly compression positions (Open/Medium/Firm), 2-position remote compatible.
    adjusters:
      rebound: { clicks: 17 }   # FOX labels "low-speed rebound"; single rebound knob
    compression_positions: [Open, Medium, Firm]
    remote: 2-position

  grip:
    name: GRIP
    description: Updated GRIP cartridge (Performance/Rhythm trims). Three on-the-fly compression positions with micro-adjust detents.
    adjusters:
      rebound: { clicks: 10 }
    compression_positions: [Open, Medium, Firm]

  rail:
    name: RAIL
    description: Adventure/e-bike damper (AWL). Tool-free external adjusters.
    adjusters:
      rebound: { clicks: 9 }
    compression_positions: [1, 2]   # 2-position "SWEEP ADJUST" compression

# --------------------------------------------------------------------------
# Forks — current (2025/2026) FOX lineup.
# `trims` are the user-facing sub-models; the damper (and therefore the click
# ranges) can differ per trim. Where a trim offers a choice of damper, list all.
# --------------------------------------------------------------------------
