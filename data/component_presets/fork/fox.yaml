# --------------------------------------------------------------------------
# Forks — the current (2025-2027) FOX lineup. A model whose owner's manuals
# differ between model years (36, 36 SL, 38) nests them as `generation` nodes,
# newest first; a new generation starts where a manual changes a table, damper
# range or base tune, not for every model year (see SCHEMA.md, "Generations").
# Years whose manuals match on everything encoded here share one node, and
# `years` spans them.
# Trims are the user-facing sub-models; the damper (and therefore the click
# ranges) can differ per trim. Where a trim offers a choice of damper, list all.
#
# Every FOX fork here is air-sprung; the `&pressure` anchor is the shared
# Pressure entry, and each trim adds its own Volume Spacers maximum where FOX
# publishes one for that chassis.
# --------------------------------------------------------------------------
