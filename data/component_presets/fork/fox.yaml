    # ------------------------------------------------------------------------
    # Legacy dampers. FOX's owner's manuals for these years publish the GRIP2
    # compression ranges as a diagram and the FIT4 open-mode adjust range, but
    # give rebound only as a rider-weight starting-point table. A rebound total
    # is therefore the highest value of that table (counted from fully closed,
    # flagged "estimated maximum" in the adjustment notes).
    # Each generation keeps its own id even where the badge did not change.
    # ------------------------------------------------------------------------
    grip2_2019:
      name: GRIP2 (2019-2020)
      description: |-
        - Four-way descent damper: high- and low-speed compression and rebound
        - Only the 16 high-speed compression clicks nearest fully closed change damping
      description_de: |-
        - Vierwege-Dämpfer für die Abfahrt: High- und Low-Speed-Druckstufe sowie Zugstufe
        - Nur die 16 High-Speed-Druckstufen-Klicks nahe ganz geschlossen verändern die Dämpfung
      description_fr: |-
        - Amortisseur de descente à quatre voies : compression et détente haute et basse vitesse
        - Seuls les 16 clics de compression haute vitesse proches de la position entièrement fermée modifient l’amortissement
      description_it: |-
        - Ammortizzatore da discesa a quattro vie: compressione e ritorno ad alta e bassa velocità
        - Solo i 16 scatti di compressione ad alta velocità più vicini alla posizione completamente chiusa modificano lo smorzamento
      description_es: |-
        - Amortiguador de descenso de cuatro vías: compresión y rebote de alta y baja velocidad
        - Solo los 16 clics de compresión de alta velocidad más cercanos a la posición totalmente cerrada cambian la amortiguación
      description_pt: |-
        - Amortecedor de descida de quatro vias: compressão e retorno de alta e baixa velocidade
        - Só os 16 cliques de compressão de alta velocidade mais próximos da posição totalmente fechada mudam o amortecimento
