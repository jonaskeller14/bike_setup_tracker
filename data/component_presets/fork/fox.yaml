# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - Legacy rebound totals. The 2018-2024 owner's manuals give rebound only as
#     starting-point tables, never as a range, so grip2_2019 / grip2_vvc_2021
#     (LSR, HSR), fit4_2019 / fit4_2021 and grip_2019 use the highest table
#     value (estimates, flagged in the adjustment notes). A FOX service manual
#     or a staff-written bench test stating the totals would replace them.
#   - grip2_vvc_2021: the 2021 and 2024 manuals carry a 16-usable-HSC-click
#     paragraph from the 2018 cartridge next to a diagram giving 8 HSC and 16
#     LSC clicks. The diagram is recorded; check a physical 2021-2024 GRIP2
#     dial if possible.
#   - 36 Rhythm 2025-2026: spacer maximum comes from the 2025 manual, the 2026
#     36mm manual has no Rhythm table; the travels beyond 150/160mm in that
#     table (130, 140, 170mm) are not offered as options.
#   - E-Bike+ / E-Optimized chassis variants have their own factory-installed
#     and maximum spacer counts. They are not modelled as separate trims yet;
#     the maximums recorded here are the non-e figures.
#   - AWL Sport and AWL HD Sport are separate FOX SKUs (34mm and 36mm). They
#     share the AWL/AWL HD spacer tables but their damper spec was not found,
#     so only the Standard and HD trims are listed.
#   - Pre-2025 generations of the 32, 34 and 40 (FIT4, GRIP2 on the 40, RC2,
#     CTD) are not covered. They can be added as older siblings of the
#     existing generations. The 2018-2024 40mm manuals publish spacer tables
#     and GRIP2/FIT4 starting-point tables, the 2014-2017 archive only spec
#     drawings.
#   - Rebound maxima of grip, grip_tc, rail and rail_hd are the highest values
#     of the owner's manuals' setup tables (the product pages state 10 and 9).
#     A physical dial count would settle them.
#   - Setup guides: the 40's GRIP X2 HSR column (10 at 120-130 lb) exceeds the
#     8-click HSR dial and repeats the LSR column, so it is not encoded. The
#     E-Bike+ / E-Optimized columns wait for an e-bike option (#72).
#   - 38 2027 wheel sizes: neither the 2027 manual nor the product page states
#     them; carried over from 2025-2026.
#   - 36 2018: the 2018 manual predates the GRIP2 damper (RC2 compression
#     adjusters, a single GRIP/RC2 rebound column), so the 2019-2020
#     generation starts in 2019. 2018 is not covered.
#   - 36 Rhythm: only the 2025 manual lists it, so the trim carries
#     `years: "2025"`; whether it continued in 2026-2027 is not documented.
#   - 38 Rhythm: the 38 Rhythm tables first appear in the 2023 manual
#     (2021-2022 list the 36 Rhythm only), hence `years: "2023-2024"`.
#   - Model-year coverage was checked against every FOX fork manual from 2018
#     to 2027 (tech.ridefox.com/bike/list/owners-manuals): 2023 and 2024 36/38
#     are identical, 2025 and 2026 differ only by dropped columns, and the 2025
#     manual's 34 Step-Cast tables have no catalog node.
# --------------------------------------------------------------------------
