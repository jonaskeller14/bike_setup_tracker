# FOX mountain-bike forks — adjustment preset database
#
# Purpose: let a user pick their exact fork (brand › model › generation › trim,
# then the damper) and have the app auto-add the correct adjustment presets,
# including the real rebound/compression click ranges.
#
# Design: click ranges are a property of the DAMPER, not the model. So dampers
# are defined once under `option_values.damper` and each fork trim lists the
# damper ids it ships with under `options.damper`. This keeps the numbers
# correct in exactly one place.
#
# See SCHEMA.md in this folder for the sparse `adjustments:` format, the field
# defaults table, and how these entries map to the app's Adjustment presets.

brand: FOX
component_type: fork
sources:
  - https://ridefox.com/pages/bike-forks
  - https://ridefox.com/pages/fox-36
  - https://ridefox.com/pages/fox-38
  - https://ridefox.com/pages/fox-34
  - https://ridefox.com/pages/fox-40
  - https://ridefox.com/pages/fox-34-sl
  - https://ridefox.com/pages/fox-36-sl
  - https://ridefox.com/pages/fox-32-step-cast
  - https://ridefox.com/pages/fox-32-taper-cast
  - https://ridefox.com/products/podium
  - https://ridefox.com/pages/fox-awl
  # Archived spec sheets + owner's manuals (tech.ridefox.com) — the source for
  # every Volume Spacers maximum, the AWL travel options and the legacy dampers.
  - https://tech.ridefox.com/bike/list/spec-sheets
  - https://tech.ridefox.com/bike/list/owners-manuals
  - https://tech.ridefox.com/bike/owners-manuals/3104/fork--2026-32mm--or-34mm-(including-32-step-cast-and-32-taper-cast)
  - https://tech.ridefox.com/bike/owners-manuals/3087/fork--2026-34sl
  - https://tech.ridefox.com/bike/owners-manuals/3089/fork--2026-36mm
  - https://tech.ridefox.com/bike/owners-manuals/3088/fork--2026-36sl
  - https://tech.ridefox.com/bike/owners-manuals/3103/fork--2026-38mm
  - https://tech.ridefox.com/bike/owners-manuals/3102/fork--2026-40mm
  - https://tech.ridefox.com/bike/owners-manuals/3101/fork--2026-awl-or-awl-sport-and-awl-hd-or-awl-hd-sport
  - https://tech.ridefox.com/bike/owners-manuals/3108/fork--2026-podium-
  - https://tech.ridefox.com/bike/owners-manuals/1040/fork--2020-36mm
  - https://tech.ridefox.com/bike/owners-manuals/1082/fork--2021-36mm-or-38mm
  - https://tech.ridefox.com/bike/owners-manuals/2930/fork--2024-36mm-or-38mm
  - https://tech.ridefox.com/bike/owners-manuals/2979/fork--2025-36mm-or-38mm
updated: 2026-10-16
# Current-lineup click ranges were taken from the per-model spec tables on the
# official FOX product pages (ridefox.com/pages/fox-<model>). Clicks are counted
# from fully closed (firmest); an adjuster with "18 clicks" has range 0..18
# (the default `dial_ccw` visualization).
#
# Volume Spacers maximums come from the "Volume Spacer Configurations" tables in
# the FOX owner's manuals listed above — they are published PER TRAVEL, so each
# trim's `max` is the highest figure across the travels that trim offers and the
# per-travel breakdown is spelled out in the adjustment's `notes`.
#
# Service intervals (`tasks`) come from the "Recommended Minimum Fork
# Maintenance" table, identical in every fork owner's manual from 2016 to 2027:
# a full fork service every 125 hours or yearly, whichever comes first. That
# service includes the bath oil and wipers; FOX publishes no separate lower-leg
# interval, so only `fork:full_service` is overridden.

# --------------------------------------------------------------------------
# Dampers — click ranges shared across every fork that ships with the damper.
# --------------------------------------------------------------------------
option_values:
  damper:
    grip_x2:
      name: GRIP X2
      description: Most tunable, descent-focused damper (enduro/DH). Four external adjusters.
      adjustments:
        - { name: HSC, type: step, max: 8, notes: High-Speed Compression, dialColor: blue }
        - { name: LSC, type: step, max: 18, notes: Low-Speed Compression, dialColor: blue, dialSize: small }
        - { name: HSR, type: step, max: 8, notes: High-Speed Rebound, dialColor: red }
        - { name: LSR, type: step, max: 16, notes: Low-Speed Rebound, dialColor: red, dialSize: small }
      valves: 23
      source: https://ridefox.com/pages/fox-36

    grip_x:
      name: GRIP X
      description: Trail-focused damper. HSC dial has a Firm detent at its final click (170° sweep).
      adjustments:
        - { name: HSC, type: step, max: 15, notes: "High-Speed Compression; Firm mode engaged at the final click", dialColor: blue }
        - { name: LSC, type: step, max: 16, notes: Low-Speed Compression, dialColor: blue, dialSize: small }
        - { name: Rebound, type: step, max: 17, notes: FOX labels this "low-speed rebound"; single rebound knob, dialColor: red }
      firm_mode: at final HSC click
      source: https://ridefox.com/pages/fox-34

    grip_sl:
      name: GRIP SL
      description: Lightweight XC damper. Three on-the-fly compression positions (Open/Medium/Firm), 2-position remote compatible.
      adjustments:
        - { name: Rebound, type: step, max: 17, notes: FOX labels this "low-speed rebound"; single rebound knob, dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Medium, Firm] }
      remote: 2-position
      source: https://ridefox.com/pages/fox-34-sl

    grip:
      name: GRIP
      description: Updated GRIP cartridge (Performance/Rhythm trims). Three on-the-fly compression positions with micro-adjust detents.
      adjustments:
        - { name: Rebound, type: step, max: 13, notes: "estimated maximum, check your dial and edit it if it differs", dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Medium, Firm] }
      source:
        - https://ridefox.com/pages/fox-34
        - https://tech.ridefox.com/bike/owners-manuals/3164/fork--2027-36mm
      note: >-
        The product page lists 10 rebound clicks, but every GRIP rebound
        starting-point table of the 2025-2027 owner's manuals (34, 34 SL, 36,
        36 SL, 38, counted from fully closed) runs to 13, so the maximum is
        that table's highest value.

    grip_tc:
      name: GRIP (32 Taper-Cast)
      description: GRIP cartridge of the 32 Taper-Cast gravel fork. Three on-the-fly compression positions with micro-adjust detents.
      adjustments:
        - { name: Rebound, type: step, max: 22, notes: "estimated maximum, check your dial and edit it if it differs", dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Medium, Firm] }
      source: https://tech.ridefox.com/bike/owners-manuals/3162/fork--2027-32mm--or-34mm-(including-32-step-cast-and-32-taper-cast)
      note: >-
        Own id because its rebound table differs from every other GRIP: the
        32mm Taper-Cast GRIP column of the 2026-2027 32/34 manuals runs to 22
        clicks from fully closed (120-250 lb), the maximum used here.

    rail:
      name: RAIL
      description: Adventure/e-bike damper (AWL). Tool-free external adjusters.
      adjustments:
        - { name: Rebound, type: step, max: 10, notes: "estimated maximum, check your dial and edit it if it differs", dialColor: red }
        - { name: Compression Mode, type: categorical, options: ["1", "2"], notes: 2-position SWEEP ADJUST compression }
      source:
        - https://ridefox.com/pages/fox-awl
        - https://tech.ridefox.com/bike/owners-manuals/3168/fork--2027-awl-or-awl-sport-and-awl-hd-or-awl-hd-sport
      note: >-
        The product page lists 9 rebound clicks; the 34mm AWL rebound table of
        the 2025-2027 manuals (120-250 lb, counted from fully closed) runs to
        10, the maximum used here.

    rail_hd:
      name: RAIL (AWL HD)
      description: Adventure/e-bike damper of the 36mm AWL HD. Tool-free external adjusters.
      adjustments:
        - { name: Rebound, type: step, max: 13, notes: "estimated maximum, check your dial and edit it if it differs", dialColor: red }
        - { name: Compression Mode, type: categorical, options: ["1", "2"], notes: 2-position SWEEP ADJUST compression }
      source: https://tech.ridefox.com/bike/owners-manuals/3168/fork--2027-awl-or-awl-sport-and-awl-hd-or-awl-hd-sport
      note: >-
        Own id because the 36mm AWL HD rebound table of the 2025-2027 manuals
        (120-250 lb, counted from fully closed) runs to 13, against 10 on the
        34mm AWL; 13 is the maximum used here.

    # ------------------------------------------------------------------------
    # Legacy dampers. FOX's owner's manuals for these years publish the GRIP2
    # compression ranges as a diagram and the FIT4 open-mode adjust range, but
    # give rebound only as a rider-weight starting-point table. A rebound total
    # is therefore the highest value of that table (counted from fully closed,
    # flagged "estimated maximum" in the adjustment notes).
    # Each generation keeps its own id even where the badge did not change.
    # ------------------------------------------------------------------------
    grip2_2019:
      name: GRIP2 (2019-2020)
      description: |-
        - Four-way descent damper: high- and low-speed compression and rebound
        - Only the 16 high-speed compression clicks nearest fully closed change damping
      adjustments:
        - { name: HSC, type: step, max: 16, notes: "High-Speed Compression; clicks past 16 out from fully closed have no damping effect", dialColor: blue }
        - { name: LSC, type: step, max: 12, notes: Low-Speed Compression, dialColor: blue, dialSize: small }
        - { name: HSR, type: step, max: 8, notes: "High-Speed Rebound; estimated maximum, check your dial and edit it if it differs", dialColor: red }
        - { name: LSR, type: step, max: 9, notes: "Low-Speed Rebound; estimated maximum, check your dial and edit it if it differs", dialColor: red, dialSize: small }
      source: https://tech.ridefox.com/bike/owners-manuals/1040/fork--2020-36mm
      note: >-
        "Factory and Performance-Elite Series GRIP2 Compression Adjusters" section
        states the 16 usable HSC clicks and its setting diagram gives an
        adjustment range of 12 clicks for LSC. HSR and LSR are not stated: the
        maxima are the highest values of the 36mm rebound starting-point table
        (55-106 psi, counted from fully closed): LSR 9, HSR 8.

    grip2_vvc_2021:
      name: GRIP2 VVC (2021-2024)
      description: |-
        - Four-way descent damper with Variable Valve Control high-speed circuits
      adjustments:
        - { name: HSC, type: step, max: 8, notes: High-Speed Compression, dialColor: blue }
        - { name: LSC, type: step, max: 16, notes: Low-Speed Compression, dialColor: blue, dialSize: small }
        - { name: HSR, type: step, max: 8, notes: "High-Speed Rebound; estimated maximum, check your dial and edit it if it differs", dialColor: red }
        - { name: LSR, type: step, max: 9, notes: "Low-Speed Rebound; estimated maximum, check your dial and edit it if it differs", dialColor: red, dialSize: small }
      source:
        - https://tech.ridefox.com/bike/owners-manuals/1082/fork--2021-36mm-or-38mm
        - https://tech.ridefox.com/bike/owners-manuals/2930/fork--2024-36mm-or-38mm
      note: >-
        The setting diagram in the GRIP2 compression section of the 2021 and
        2024 manuals gives 8 clicks for HSC and 16 for LSC (start 5 and 10 clicks
        out, matching the text). The paragraph above it still carries the
        2018-2020 wording about 16 usable HSC clicks; the diagram is the
        figure for this VVC cartridge. HSR and LSR are not stated: the maxima
        are the highest values of the rebound starting-point table (120-250 lb,
        counted from fully closed): LSR 9, HSR 8.

    fit4_2019:
      name: FIT4 (2019-2020)
      description: |-
        - Three-position compression lever: Open, Medium, Firm
        - Open mode carries 22 extra clicks of low-speed fine tuning (22 plushest, 1 firmest)
      adjustments:
        - { name: Rebound, type: step, max: 8, notes: "estimated maximum, check your dial and edit it if it differs", dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Medium, Firm] }
        - { name: Open Mode Adjust, type: step, max: 22, notes: "Low-Speed Compression in Open mode; Factory and Performance Elite forks only", dialColor: blue, dialSize: small }
      source: https://tech.ridefox.com/bike/owners-manuals/1040/fork--2020-36mm
      note: >-
        "OPEN mode adjust provides 22 additional fine tuning adjustments for the
        OPEN mode." Rebound total is not stated: the maximum is the highest
        FIT4 value of the 36mm rebound starting-point table (55-106 psi,
        counted from fully closed), 8.

    fit4_2021:
      name: FIT4 (2021-2024)
      description: |-
        - Three-position compression lever: Open, Medium, Firm
        - Open mode carries 22 extra clicks of low-speed fine tuning (22 plushest, 1 firmest)
      adjustments:
        - { name: Rebound, type: step, max: 14, notes: "estimated maximum, check your dial and edit it if it differs", dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Medium, Firm] }
        - { name: Open Mode Adjust, type: step, max: 22, notes: "Low-Speed Compression in Open mode; Factory and Performance Elite forks only", dialColor: blue, dialSize: small }
      source:
        - https://tech.ridefox.com/bike/owners-manuals/1082/fork--2021-36mm-or-38mm
        - https://tech.ridefox.com/bike/owners-manuals/2930/fork--2024-36mm-or-38mm
      note: >-
        Separate key from fit4_2019 per SCHEMA.md; the published 22-position
        open-mode range is identical. Rebound total is not stated: the maximum
        is the highest FIT4 value of the rebound starting-point table (120-250
        lb, counted from fully closed), 14.

    grip_2019:
      name: GRIP (2019-2024)
      description: |-
        - Three-position compression lever: Open, Medium, Firm
        - The detents between the three modes are usable for fine tuning
      adjustments:
        - { name: Rebound, type: step, max: 13, notes: "estimated maximum, check your dial and edit it if it differs", dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Medium, Firm] }
      source:
        - https://tech.ridefox.com/bike/owners-manuals/1040/fork--2020-36mm
        - https://tech.ridefox.com/bike/owners-manuals/2930/fork--2024-36mm-or-38mm
      note: >-
        Rebound total unstated for this cartridge generation; the current GRIP
        (10 clicks) figure comes from a 2025+ product page and must not be
        carried backwards. The maximum is the highest GRIP value of the 36/38
        rebound starting-point tables (55-106 psi in the 2020 manual, 120-250 lb
        in the 2021 and 2024 manuals, counted from fully closed), 13 in both.

# --------------------------------------------------------------------------
# Setup guides — the owner's manuals' starting points as data (SCHEMA.md,
# "Setup guides"), transcribed from docs/research/setup_guides/fox.md.
# --------------------------------------------------------------------------
guides:
  fox_32_34_2027:
    label: FOX 32/34 owner's manual (2027)
    source: https://tech.ridefox.com/bike/owners-manuals/3162/fork--2027-32mm--or-34mm-(including-32-step-cast-and-32-taper-cast)
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { model: 32-taper-cast }
        rows: {
          120-130: 100, 130-140: 104, 140-150: 108, 150-160: 113, 160-170: 117,
          170-180: 121, 180-190: 125, 190-200: 129, 200-210: 133, 210-220: 138,
          220-230: 142, 230-240: 146, 240-250: 150
        }
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { model: 32-step-cast }
        rows: {
          120-130: 65, 130-140: 70, 140-150: 74, 150-160: 80, 160-170: 85,
          170-180: 90, 180-190: 96, 190-200: 101, 200-210: 106, 210-220: 111,
          220-230: 116, 230-240: 121, 240-250: 126
        }
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { model: "34", trim: [factory, performance-elite, performance] }
        rows: {
          120-130: 64, 130-140: 69, 140-150: 74, 150-160: 78, 160-170: 83,
          170-180: 88, 180-190: 92, 190-200: 97, 200-210: 102, 210-220: 106,
          220-230: 111, 230-240: 116, 240-250: 120
        }
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { model: "34", trim: rhythm }
        rows: {
          120-130: 58, 130-140: 63, 140-150: 68, 150-160: 72, 160-170: 77,
          170-180: 82, 180-190: 86, 190-200: 91, 200-210: 96, 210-220: 100,
          220-230: 105, 230-240: 110, 240-250: 114
        }
      - target: rebound
        input: rider_weight
        input_unit: lb
        when: { model: 32-taper-cast, damper: grip_tc }
        rows: {
          120-130: 22, 130-140: 21, 140-150: 20, 150-160: 19, 160-170: 18,
          170-180: 17, 180-190: 16, 190-200: 15, 200-210: 13, 210-220: 11,
          220-230: 10, 230-240: 9, 240-250: 8
        }
      - target: rebound
        input: rider_weight
        input_unit: lb
        when: { model: 32-taper-cast, damper: grip_sl }
        rows: {
          120-130: 17, 130-140: 16, 140-150: 15, 150-160: 14, 160-170: 13,
          170-180: 12, 180-190: 11, 190-200: 10, 200-210: 9, 210-220: 8,
          220-230: 7, 230-240: 6, 240-250: 5
        }
      - target: rebound
        input: rider_weight
        input_unit: lb
        when: { model: 32-step-cast }
        rows: {
          120-130: 13, 130-140: 12, 140-150: 11, 150-160: 10, 160-170: 9,
          170-180: 8, 180-190: 7, 190-200: 6, 200-210: 5, 210-220: 4,
          220-230: 3, 230-240: 2, 240-250: 1
        }
      - target: rebound
        input: rider_weight
        input_unit: lb
        when: { model: "34", damper: grip }
        rows: {
          120-130: 13, 130-140: 12, 140-150: 11, 150-160: 10, 160-170: 9,
          170-180: 8, 180-190: 7, 190-200: 6, 200-210: 5, 210-220: 4,
          220-230: 3, 230-240: 2, 240-250: 1
        }
      - { target: hsc, value: 10, when: { damper: grip_x } }
      - { target: lsc, value: 10, when: { damper: grip_x } }
      - { target: sag, range: [15, 20], comfort_at: max, note: "15 % is FOX's firm end, 20 % the plush end" }
      - target: volume_spacers
        input: travel_mm
        when: { model: 32-taper-cast }
        rows: { 40: 3, 50: 2 }
      - target: volume_spacers
        input: travel_mm
        when: { model: 32-step-cast }
        rows: { 100: 1 }
      - target: volume_spacers
        input: travel_mm
        when: { model: "34", trim: [factory, performance-elite, performance] }
        rows: { 130: 2, 140: 1 }
      - target: volume_spacers
        input: travel_mm
        when: { model: "34", trim: rhythm }
        rows: { 130: 1, 150: 0 }

  fox_34sl_2027:
    label: FOX 34 SL owner's manual (2027)
    source: https://tech.ridefox.com/bike/owners-manuals/3163/fork--2027-34sl
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        rows: {
          120-130: 64, 130-140: 69, 140-150: 74, 150-160: 78, 160-170: 83,
          170-180: 88, 180-190: 92, 190-200: 97, 200-210: 102, 210-220: 106,
          220-230: 111, 230-240: 116, 240-250: 120
        }
      - target: rebound
        input: rider_weight
        input_unit: lb
        rows: {
          120-130: 13, 130-140: 12, 140-150: 11, 150-160: 10, 160-170: 9,
          170-180: 8, 180-190: 7, 190-200: 6, 200-210: 5, 210-220: 4,
          220-230: 3, 230-240: 2, 240-250: 1
        }
      - { target: sag, range: [15, 20], comfort_at: max, note: "15 % is FOX's firm end, 20 % the plush end" }
      - target: volume_spacers
        input: travel_mm
        rows: { 120: 2, 130: 1 }

  fox_36sl_2027:
    label: FOX 36 SL owner's manual (2027)
    source: https://tech.ridefox.com/bike/owners-manuals/3165/fork--2027-36sl
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        rows: &fox_36sl_pressure {
          120-130: 65, 130-140: 68, 140-150: 72, 150-160: 76, 160-170: 79,
          170-180: 83, 180-190: 87, 190-200: 90, 200-210: 94, 210-220: 97,
          220-230: 101, 230-240: 105, 240-250: 108
        }
        note: Some riders need up to 10 psi more or less than the table value
      - target: rebound
        input: rider_weight
        input_unit: lb
        when: { damper: grip }
        rows: &fox_36sl_rebound_grip {
          120-130: 13, 130-140: 12, 140-150: 11, 150-160: 10, 160-170: 9,
          170-180: 8, 180-190: 7, 190-200: 6, 200-210: 5, 210-220: 4,
          220-230: 3, 230-240: 2, 240-250: 1
        }
      - target: rebound
        input: rider_weight
        input_unit: lb
        when: { damper: grip_x }
        rows: &fox_36sl_rebound_grip_x {
          120-130: 16, 130-140: 14, 140-150: 12, 150-160: 10, 160-170: 9,
          170-180: 8, 180-190: 7, 190-200: 6, 200-210: 5, 210-220: 4,
          220-230: 3, 230-240: 2, 240-250: 1
        }
      - { target: hsc, value: 5, when: { damper: grip_x } }
      - { target: lsc, value: 5, when: { damper: grip_x } }
      - { target: sag, range: [15, 20], comfort_at: max, note: "15 % is FOX's firm end, 20 % the plush end" }
      - target: volume_spacers
        input: travel_mm
        rows: { 130: 2, 140: 1 }

  # The 2026 36 SL manual carries the 2027 tables; only the GRIP X base tune
  # differs (10 instead of 5 clicks).
  fox_36sl_2026:
    label: FOX 36 SL owner's manual (2026)
    source: https://tech.ridefox.com/bike/owners-manuals/3088/fork--2026-36sl
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        rows: *fox_36sl_pressure
        note: Some riders need up to 10 psi more or less than the table value
      - target: rebound
        input: rider_weight
        input_unit: lb
        when: { damper: grip }
        rows: *fox_36sl_rebound_grip
      - target: rebound
        input: rider_weight
        input_unit: lb
        when: { damper: grip_x }
        rows: *fox_36sl_rebound_grip_x
      - { target: hsc, value: 10, when: { damper: grip_x } }
      - { target: lsc, value: 10, when: { damper: grip_x } }
      - { target: sag, range: [15, 20], comfort_at: max, note: "15 % is FOX's firm end, 20 % the plush end" }
      - target: volume_spacers
        input: travel_mm
        rows: { 130: 2, 140: 1 }

  fox_36_2027:
    label: FOX 36 owner's manual (2027)
    source: https://tech.ridefox.com/bike/owners-manuals/3164/fork--2027-36mm
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        rows: &fox_36_pressure {
          120-130: 66, 130-140: 70, 140-150: 74, 150-160: 78, 160-170: 82,
          170-180: 86, 180-190: 89, 190-200: 94, 200-210: 99, 210-220: 105,
          220-230: 109, 230-240: 113, 240-250: 117
        }
        note: Some riders need up to 10 psi more or less than the table value
      - target: rebound
        input: rider_weight
        input_unit: lb
        when: { damper: grip }
        rows: &fox_36_rebound_grip {
          120-130: 13, 130-140: 12, 140-150: 11, 150-160: 10, 160-170: 9,
          170-180: 8, 180-190: 7, 190-200: 6, 200-210: 5, 210-220: 4,
          220-230: 3, 230-240: 2, 240-250: 1
        }
      - target: rebound
        input: rider_weight
        input_unit: lb
        when: { damper: grip_x }
        rows: &fox_36_rebound_grip_x {
          120-130: 16, 130-140: 14, 140-150: 12, 150-160: 10, 160-170: 9,
          170-180: 8, 180-190: 7, 190-200: 6, 200-210: 5, 210-220: 4,
          220-230: 3, 230-240: 2, 240-250: 1
        }
      - target: lsr
        input: rider_weight
