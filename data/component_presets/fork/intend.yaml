# INTEND mountain-bike forks — adjustment preset database
#
# Same design as fork/fox.yaml and fork/ohlins.yaml: click ranges belong to the
# DAMPER cartridge, defined once under `option_values.damper` and referenced by id from
# each fork's trims. See SCHEMA.md in this folder.
#
# INTEND (Freiburg, Germany) builds inverted (upside-down) MTB forks only — no
# shocks, hence no shock/intend.yaml. Every current model is air-sprung; no
# coil fork is currently offered.
#
# IMPORTANT: unlike FOX/Öhlins, INTEND does not publish a total click count for
# either the Rebound or Compression dial on any current damper. Their own
# official fork-setup guide (intend-bc.com/fork-setup/) describes Low-Speed
# Compression as having two *feel zones* ("clicks 1-6" coarser for racers,
# then a finer zone continuing to "fully open" for comfort riders) but never
# states a total maximum. That guide shows the compression dial is click-
# indexed and counted from fully closed, so it is declared with `max: ~`; the
# setup guide's "click 6" is NOT a total (the finer zone continues beyond it),
# so no estimate is made from it. Rebound is only described as "start in the
# middle of the range", with no click indexing, and stays a missing adjuster.
# See the Follow-ups footer.

brand: INTEND
component_type: fork
sources:
  - https://www.intend-bc.com/product-page-category/forks/
  - https://www.intend-bc.com/fork-chart/
  - https://www.intend-bc.com/fork-setup/
  - https://www.intend-bc.com/products/smooth-operator/
  - https://www.intend-bc.com/products/samurai-xc/
  - https://www.intend-bc.com/products/samurai-32/
  - https://www.intend-bc.com/products/samurai-supertr/
  - https://www.intend-bc.com/products/intend-hero/
  - https://www.intend-bc.com/products/essentials/
  - https://www.intend-bc.com/products/intend-edge/
  - https://www.intend-bc.com/products/intend-flash/
  - https://www.intend-bc.com/products/flash-38/
  - https://www.intend-bc.com/products/infinity-en/
  - https://www.intend-bc.com/products/bandit/
  # Secondary — editorial first look (damper design, no click counts)
  - https://www.pinkbike.com/news/first-look-intend-flash-38-fork-and-smooth-operator-compression-valve.html
updated: 2026-10-13
# Service interval (`tasks`) from the fork setup guide: the small (upper leg)
# service at least once a year. No hour-based interval is published.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    closed_cartridge:
      name: Closed Cartridge (self-bleeding)
      description: >
        INTEND's standard closed-cartridge damper, shared across Samurai Super TR,
        Hero, Edge, Flash 35, Flash 38, Infinity EN and Bandit. A single external
        Rebound dial and a single external Compression dial (no HS/LS split).
        Current-production units ship with the retrofittable "Smooth Operator"
        compression valve as standard equipment on Hero/Edge/Flash 35/Flash
        38/Infinity EN/Bandit (not on Samurai or Essential, and not on older
        units — retrofittable separately).
      description_de: >
        INTENDs Standard-Dämpfer mit geschlossener Kartusche, verbaut in Samurai
        Super TR, Hero, Edge, Flash 35, Flash 38, Infinity EN und Bandit. Ein
        einzelnes externes Zugstufenrad und ein einzelnes externes
        Druckstufenrad (keine HS/LS-Aufteilung). Aktuelle Serienmodelle werden
        bei Hero/Edge/Flash 35/Flash 38/Infinity EN/Bandit serienmäßig mit dem
        nachrüstbaren „Smooth Operator“-Druckstufenventil ausgeliefert (nicht
        bei Samurai oder Essential und nicht bei älteren Modellen — dort separat
        nachrüstbar).
      description_fr: Amortisseur standard à cartouche fermée d’INTEND, partagé entre les Samurai Super TR, Hero, Edge, Flash 35, Flash 38, Infinity EN et Bandit. Une seule molette externe de détente et une seule molette externe de compression (pas de séparation HS/LS). Les exemplaires de production actuelle sont livrés avec la valve de compression « Smooth Operator » en équipement de série sur les Hero/Edge/Flash 35/Flash 38/Infinity EN/Bandit (pas sur les Samurai ni Essential, ni sur les anciens exemplaires — montable séparément).
      description_it: Ammortizzatore standard a cartuccia chiusa di INTEND, condiviso tra Samurai Super TR, Hero, Edge, Flash 35, Flash 38, Infinity EN e Bandit. Una sola manopola esterna del ritorno e una sola manopola esterna di compressione (nessuna divisione HS/LS). Gli esemplari di produzione attuale hanno di serie la valvola di compressione «Smooth Operator» su Hero/Edge/Flash 35/Flash 38/Infinity EN/Bandit (non su Samurai ed Essential, né sugli esemplari più vecchi — montabile a parte).
      description_es: Amortiguador estándar de cartucho cerrado de INTEND, compartido por las Samurai Super TR, Hero, Edge, Flash 35, Flash 38, Infinity EN y Bandit. Una sola rueda externa de rebote y una sola rueda externa de compresión (sin separación HS/LS). Las unidades de producción actual llevan de serie la válvula de compresión «Smooth Operator» en las Hero/Edge/Flash 35/Flash 38/Infinity EN/Bandit (no en las Samurai ni Essential, ni en unidades antiguas — se puede montar aparte).
      description_pt: Amortecedor padrão de cartucho fechado da INTEND, compartilhado entre as Samurai Super TR, Hero, Edge, Flash 35, Flash 38, Infinity EN e Bandit. Um único seletor externo de retorno e um único seletor externo de compressão (sem divisão HS/LS). As unidades de produção atual trazem de série a válvula de compressão “Smooth Operator” nas Hero/Edge/Flash 35/Flash 38/Infinity EN/Bandit (não nas Samurai nem Essential, nem em unidades mais antigas — instalável à parte).
      missing_adjustments: [Rebound]
      missing_adjustments_de: [Zugstufe]
      missing_adjustments_fr: [Détente]
      missing_adjustments_it: [Ritorno]
      missing_adjustments_es: [Rebote]
      missing_adjustments_pt: [Retorno]
      adjustments:
        - { name: Compression, name_de: Druckstufe, name_fr: Compression, name_it: Compressione, name_es: Compresión, name_pt: Compressão, type: step, max: ~, notes: Counted from fully closed (firmest), notes_de: Von ganz geschlossen (am festesten) gezählt, notes_fr: Compté depuis la position entièrement fermée (la plus ferme), notes_it: Contato a partire dalla posizione completamente chiusa (la più rigida), notes_es: Contado desde la posición totalmente cerrada (la más firme), notes_pt: Contado a partir da posição totalmente fechada (a mais firme) }
      source: https://www.intend-bc.com/fork-setup/
      note: Fork setup guide describes compression clicks counted from fully closed (1-6 coarse zone, then a finer zone to fully open) with no total.

    open_bath:
      name: Open Bath (self-bleeding)
      description: >
        Essential's entry-level open-bath damper. External Low-Speed Rebound and
        Low-Speed Compression dials.
      description_de: >
        Essentials Einstiegsdämpfer mit offenem Ölbad. Externe Räder für
        Low-Speed-Zugstufe und Low-Speed-Druckstufe.
      description_fr: Amortisseur à bain d’huile ouvert d’entrée de gamme d’Essential. Molettes externes de détente basse vitesse et de compression basse vitesse.
      description_it: Ammortizzatore a bagno d’olio aperto entry-level di Essential. Manopole esterne di ritorno a bassa velocità e di compressione a bassa velocità.
      description_es: Amortiguador de baño de aceite abierto de gama de entrada de Essential. Ruedas externas de rebote de baja velocidad y de compresión de baja velocidad.
      description_pt: Amortecedor de banho de óleo aberto de entrada da Essential. Seletores externos de retorno de baixa velocidade e de compressão de baixa velocidade.
      missing_adjustments: [Rebound]
      missing_adjustments_de: [Zugstufe]
      missing_adjustments_fr: [Détente]
      missing_adjustments_it: [Ritorno]
      missing_adjustments_es: [Rebote]
      missing_adjustments_pt: [Retorno]
      adjustments:
        - { name: Compression, name_de: Druckstufe, name_fr: Compression, name_it: Compressione, name_es: Compresión, name_pt: Compressão, type: step, max: ~, notes: "Low-Speed Compression; Counted from fully closed (firmest)", notes_de: Low-Speed-Druckstufe; von ganz geschlossen (am festesten) gezählt, notes_fr: Compression basse vitesse ; comptée depuis la position entièrement fermée (la plus ferme), notes_it: Compressione a bassa velocità; contata a partire dalla posizione completamente chiusa (la più rigida), notes_es: Compresión de baja velocidad; contada desde la posición totalmente cerrada (la más firme), notes_pt: Compressão de baixa velocidade; contada a partir da posição totalmente fechada (a mais firme) }
      source: https://www.intend-bc.com/fork-setup/
      note: Same compression counting as the closed cartridge per the fork setup guide; no total published.

    energizer:
      name: INTEND Energizer
      description: >
        3-position lockout cartridge offered on the Samurai XC (29" and 32").
        Open / Gravel / Road modes; Road is ~99% firm and lets the fork sink
        slowly into sag for a climbing position. Optional remote available.
      description_de: >
        3-Positionen-Lockout-Kartusche für die Samurai XC (29" und 32"). Modi
        Open / Gravel / Road; Road ist zu ca. 99 % fest und lässt die Gabel
        langsam in den SAG einsinken, für eine Kletterposition. Optional mit
        Fernbedienung.
      description_fr: Cartouche de lockout à 3 positions proposée sur la Samurai XC (29" et 32"). Modes Open / Gravel / Road ; Road est ferme à ~99 % et laisse la fourche s’enfoncer lentement dans le SAG pour une position de montée. Commande déportée disponible en option.
      description_it: Cartuccia di lockout a 3 posizioni offerta sulla Samurai XC (29" e 32"). Modalità Open / Gravel / Road; Road è rigida al ~99 % e lascia che la forcella affondi lentamente nel SAG per una posizione da salita. Comando remoto disponibile come optional.
      description_es: Cartucho de lockout de 3 posiciones que se ofrece en la Samurai XC (29" y 32"). Modos Open / Gravel / Road; Road es firme al ~99 % y deja que la horquilla se hunda despacio en el SAG para una posición de subida. Mando remoto disponible como opción.
      description_pt: Cartucho de lockout de 3 posições oferecido na Samurai XC (29" e 32"). Modos Open / Gravel / Road; Road é firme a ~99 % e deixa o garfo afundar devagar no SAG para uma posição de subida. Comando remoto disponível como opcional.
      adjustments:
        - { name: Mode, name_de: Modus, name_fr: Mode, name_it: Modalità, name_es: Modo, name_pt: Modo, type: categorical, options: [Open, Gravel, Road], options_de: [Offen, Gravel, Straße], options_fr: [Ouvert, Gravel, Route], options_it: [Aperto, Gravel, Strada], options_es: [Abierto, Gravel, Carretera], options_pt: [Aberto, Gravel, Estrada] }

    rs_charger_raceday:
      name: RockShox Charger Raceday (OEM)
      description: >
        Third-party RockShox Charger Raceday cartridge (Raceday 1 or 2
        generation), offered as an alternative to the Energizer on the Samurai
        XC (29"/32") for riders standardizing on RockShox damping; limits the
        fork to 120mm max travel. 2- or 3-position lockout, with or without
        remote. Its click/damping specs are RockShox's own and are out of scope
        for this INTEND brand file — not modelled here.
      description_de: >
        RockShox-Charger-Raceday-Kartusche eines Drittanbieters (Generation
        Raceday 1 oder 2), als Alternative zum Energizer für die Samurai XC
        (29"/32") für Fahrer, die auf RockShox-Dämpfung setzen; begrenzt die
        Gabel auf maximal 120mm Federweg. 2- oder 3-Positionen-Lockout, mit oder
        ohne Fernbedienung. Die Klick- und Dämpfungswerte stammen von RockShox
        und gehören nicht in diese INTEND-Markendatei — hier nicht abgebildet.
      description_fr: Cartouche RockShox Charger Raceday tierce (génération Raceday 1 ou 2), proposée comme alternative à l’Energizer sur la Samurai XC (29"/32") pour les pilotes qui s’alignent sur l’amortissement RockShox ; limite la fourche à 120 mm de débattement max. Lockout à 2 ou 3 positions, avec ou sans commande déportée. Ses caractéristiques de clics/amortissement sont celles de RockShox et sortent du périmètre de ce fichier de marque INTEND — non modélisées ici.
      description_it: Cartuccia RockShox Charger Raceday di terzi (generazione Raceday 1 o 2), offerta come alternativa all’Energizer sulla Samurai XC (29"/32") per i rider che puntano sullo smorzamento RockShox; limita la forcella a 120 mm di escursione massima. Lockout a 2 o 3 posizioni, con o senza comando remoto. Le sue specifiche di scatti/smorzamento sono quelle di RockShox e non rientrano in questo file del marchio INTEND — non modellate qui.
      description_es: Cartucho RockShox Charger Raceday de terceros (generación Raceday 1 o 2), que se ofrece como alternativa al Energizer en la Samurai XC (29"/32") para riders que apuestan por la amortiguación RockShox; limita la horquilla a 120 mm de recorrido máximo. Lockout de 2 o 3 posiciones, con o sin mando remoto. Sus datos de clics/amortiguación son los propios de RockShox y quedan fuera de este archivo de la marca INTEND — no se modelan aquí.
      description_pt: Cartucho RockShox Charger Raceday de terceiros (geração Raceday 1 ou 2), oferecido como alternativa ao Energizer na Samurai XC (29"/32") para riders que padronizam o amortecimento RockShox; limita o garfo a 120 mm de curso máximo. Lockout de 2 ou 3 posições, com ou sem comando remoto. As especificações de cliques/amortecimento são as da própria RockShox e ficam fora deste arquivo da marca INTEND — não modeladas aqui.
      adjustments: []

# --------------------------------------------------------------------------
# Setup guide — transcribed from docs/research/setup_guides/intend.md.
#   * Pressure: INTEND publishes a formula (psi = factor × rider weight in kg,
#     1.0 or 1.3 per model) with no rider range, so the rows are calculated at
#     5 kg steps over 50-120 kg. Essential has no factor.
#   * Compression: 6 clicks from closed on every model with a click dial.
#   * Rebound "start in the middle of the range" is not encoded: the catalog
#     has no Rebound adjuster, since no source states that the dial is
#     click-indexed or which end it counts from.
#   * No SAG target, pressure limit or spacer count is published.
# --------------------------------------------------------------------------
guides:
  intend_fork_setup_2025:
    label: INTEND fork setup guide (2025)
    label_de: INTEND Gabel-Setup-Anleitung (2025)
    label_fr: Guide de setup de la fourche INTEND (2025)
    label_it: Guida al setup della forcella INTEND (2025)
    label_es: Guía de setup de la horquilla INTEND (2025)
    label_pt: Guia de setup do garfo INTEND (2025)
    source: https://www.intend-bc.com/fork-setup/
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { model: [samurai-xc-29, samurai-xc-32, samurai-super-tr, hero, edge, flash-35, flash-38] }
        rows: {
          50: 50, 55: 55, 60: 60, 65: 65, 70: 70,
          75: 75, 80: 80, 85: 85, 90: 90, 95: 95,
          100: 100, 105: 105, 110: 110, 115: 115, 120: 120
        }
        note: "Calculated from INTEND's formula: 1.0 psi per kg of rider weight"
        note_de: "Berechnet nach der Formel von INTEND: 1,0 psi pro kg Fahrergewicht"
        note_fr: "Calculé selon la formule d’INTEND : 1,0 psi par kg de poids du pilote"
        note_it: "Calcolato con la formula di INTEND: 1,0 psi per kg di peso del rider"
        note_es: "Calculado con la fórmula de INTEND: 1,0 psi por kg de peso del rider"
        note_pt: "Calculado pela fórmula da INTEND: 1,0 psi por kg de peso do rider"
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { model: [infinity-en, bandit] }
        rows: {
          50: 65, 55: 71.5, 60: 78, 65: 84.5, 70: 91,
          75: 97.5, 80: 104, 85: 110.5, 90: 117, 95: 123.5,
          100: 130, 105: 136.5, 110: 143, 115: 149.5, 120: 156
        }
        note: "Calculated from INTEND's formula: 1.3 psi per kg of rider weight"
        note_de: "Berechnet nach der Formel von INTEND: 1,3 psi pro kg Fahrergewicht"
        note_fr: "Calculé selon la formule d’INTEND : 1,3 psi par kg de poids du pilote"
        note_it: "Calcolato con la formula di INTEND: 1,3 psi per kg di peso del rider"
        note_es: "Calculado con la fórmula de INTEND: 1,3 psi por kg de peso del rider"
        note_pt: "Calculado pela fórmula da INTEND: 1,3 psi por kg de peso do rider"
      - target: compression
        value: 6
        when: { damper: [closed_cartridge, open_bath] }
        note: Clicks 1-6 are coarse steps for race support; past 6 they get finer for comfort
        note_de: Die Klicks 1-6 sind grobe Schritte für Halt im Rennen; ab 6 werden sie für mehr Komfort feiner
        note_fr: Les clics 1 à 6 sont des paliers grossiers pour le soutien en course ; au-delà de 6 ils deviennent plus fins pour le confort
        note_it: Gli scatti da 1 a 6 sono passi grossolani per il sostegno in gara; oltre il 6 diventano più fini per il comfort
        note_es: Los clics 1 a 6 son pasos gruesos para el apoyo en carrera; a partir del 6 son más finos para el confort
        note_pt: Os cliques 1 a 6 são passos grossos para o apoio em competição; a partir do 6 ficam mais finos para o conforto

