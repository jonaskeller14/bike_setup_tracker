# INTEND mountain-bike forks — adjustment preset database
#
# Same design as fork/fox.yaml and fork/ohlins.yaml: click ranges belong to the
# DAMPER cartridge, defined once under `option_values.damper` and referenced by id from
# each fork's trims. See SCHEMA.md in this folder.
#
# INTEND (Freiburg, Germany) builds inverted (upside-down) MTB forks only — no
# shocks, hence no shock/intend.yaml. Every current model is air-sprung; no
# coil fork is currently offered.
#
# IMPORTANT: unlike FOX/Öhlins, INTEND does not publish a total click count for
# either the Rebound or Compression dial on any current damper. Their own
# official fork-setup guide (intend-bc.com/fork-setup/) describes Low-Speed
# Compression as having two *feel zones* ("clicks 1-6" coarser for racers,
# then a finer zone continuing to "fully open" for comfort riders) but never
# states a total maximum — so, per the "never guess a number" rule, no step
# adjustment is generated for Rebound/Compression on any INTEND damper. See
# the Follow-ups footer.

brand: INTEND
component_type: fork
sources:
  - https://www.intend-bc.com/product-page-category/forks/
  - https://www.intend-bc.com/fork-chart/
  - https://www.intend-bc.com/fork-setup/
  - https://www.intend-bc.com/products/smooth-operator/
  - https://www.intend-bc.com/products/samurai-xc/
  - https://www.intend-bc.com/products/samurai-32/
  - https://www.intend-bc.com/products/samurai-supertr/
  - https://www.intend-bc.com/products/intend-hero/
  - https://www.intend-bc.com/products/essentials/
  - https://www.intend-bc.com/products/intend-edge/
  - https://www.intend-bc.com/products/intend-flash/
  - https://www.intend-bc.com/products/flash-38/
  - https://www.intend-bc.com/products/infinity-en/
  - https://www.intend-bc.com/products/bandit/
updated: 2026-07-17

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    closed_cartridge:
      name: Closed Cartridge (self-bleeding)
      description: >
        INTEND's standard closed-cartridge damper, shared across Samurai Super TR,
        Hero, Edge, Flash 35, Flash 38, Infinity EN and Bandit. A single external
        Rebound dial and a single external Compression dial (no HS/LS split).
        Current-production units ship with the retrofittable "Smooth Operator"
        compression valve as standard equipment on Hero/Edge/Flash 35/Flash
        38/Infinity EN/Bandit (not on Samurai or Essential, and not on older
        units — retrofittable separately). No total click count is published for
        either dial; the official setup guide only describes Low-Speed
        Compression as having a coarser zone (clicks 1-6) followed by a finer
        zone continuing to fully open. Never independently confirmed/quantified
        — not modelled as a step adjustment. See Follow-ups.
      adjustments: []

    open_bath:
      name: Open Bath (self-bleeding)
      description: >
        Essential's entry-level open-bath damper. External Low-Speed Rebound and
        Low-Speed Compression dials. No click counts published — see Follow-ups.
      adjustments: []

    energizer:
      name: INTEND Energizer
      description: >
        3-position lockout cartridge offered on the Samurai XC (29" and 32").
        Open / Gravel / Road modes; Road is ~99% firm and lets the fork sink
        slowly into sag for a climbing position. Optional remote available.
      adjustments:
        - { name: Mode, type: categorical, options: [Open, Gravel, Road] }

    rs_charger_raceday:
      name: RockShox Charger Raceday (OEM)
      description: >
        Third-party RockShox Charger Raceday cartridge (Raceday 1 or 2
        generation), offered as an alternative to the Energizer on the Samurai
        XC (29"/32") for riders standardizing on RockShox damping; limits the
        fork to 120mm max travel. 2- or 3-position lockout, with or without
        remote. Its click/damping specs are RockShox's own and are out of scope
        for this INTEND brand file — not modelled here.
      adjustments: []

# --------------------------------------------------------------------------
# Forks — current INTEND lineup (all inverted, all air-sprung).
# Every trim shares the `&air_spring` anchor (Pressure only); INTEND's
# swappable "progression" bottom caps are a relative soft/firm choice with no
# published volume number, so no Volume Spacers adjustment is generated — see
# Follow-ups.
# --------------------------------------------------------------------------
nodes:
  - label: "Samurai XC 29"
    level: model
    category: XC / Down-country
    years: "2025-2026"
    url: https://www.intend-bc.com/products/samurai-xc/
    children:
      - label: Standard
        level: trim
        draft: true
        specs: { spring: Air }
        offset_mm: [44]
        adjustments: &air_spring
          - { name: Pressure, type: numerical, unit: psi, min: 0 }
        options:
          damper: [energizer, rs_charger_raceday]
          travel_mm: [100, 110, 120, 130]
          wheel_size: [29]
        note: >
          Max travel is 130mm with the Energizer cartridge but only 120mm
          when fitted with the RockShox Charger Raceday cartridge.

  - label: "Samurai XC 32"
    level: model
    category: XC
    years: "2025-2026"
    url: https://www.intend-bc.com/products/samurai-32/
    children:
      - label: Standard
        level: trim
        draft: true
        specs: { stanchion: 35mm, spring: Air }
        offset_mm: [46, 48] # 46mm at sag, 48mm fully extended
        adjustments: *air_spring
        options:
          damper: [energizer, rs_charger_raceday]
          travel_mm: [120, 130]
          wheel_size: [32]
        note: >
          Max travel is 130mm with the Energizer cartridge but only 120mm
          when fitted with the RockShox Charger Raceday cartridge.

  - label: "Samurai Super TR"
