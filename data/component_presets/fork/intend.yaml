# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - Rebound/Compression click counts (closed_cartridge, open_bath): INTEND
#     does not publish a total click count anywhere on their official site.
#     The fork-setup guide describes Low-Speed Compression as a coarser zone
#     (clicks 1-6 from fully closed) followed by a finer zone continuing to
#     fully open, with no stated maximum, so Compression carries `max: ~`.
#     The only totals in circulation are forum posts (an older needle with 11
#     clicks, a later one with 17), which are not an admissible source. Rebound
#     has no stated click indexing or counting direction, so it remains in
#     `missing_adjustments` and every trim stays `draft: true`.
#   - RockShox Charger Raceday (rs_charger_raceday): click/damping specs are
#     RockShox's own, not published on the INTEND product pages — would need
#     to come from RockShox's own documentation, out of scope here.
#   - Progression / volume bottom caps: every model ships with 2 interchangeable
#     bottom caps (a "less" and "more" progression option, one pre-installed)
#     but no numeric volume (cc) is published per model, so no Volume Spacers
#     adjustment is generated. The fork-setup guide (1.0 psi per kg of rider
#     weight on Hero/Edge/Flash/Samurai, 1.3 on Infinity EN/Bandit) gives no
#     maximum pressure either.
#   - The fork-setup guide's Travelizer table lists Samurai TR 100-130mm and
#     Samurai XC 90-120mm, which differs from the Samurai XC / Super TR travels
#     on the product pages used above; the product pages were kept.
#   - Smooth Operator compression valve: standard equipment on current-
#     production Hero/Edge/Flash 35/Flash 38/Infinity EN/Bandit (since ~Dec
#     2025) and separately retrofittable to older units; purely a shim-stack
#     refinement with no published click spec, so it isn't modelled as its own
#     damper id.
#   - Older/legacy INTEND fork generations (e.g. Ebonite and pre-Blackline
#     2-piece-crown models) are not covered — only the current lineup shown on
#     intend-bc.com/fork-chart/ as of 2026-07-17.
#   - Setup guide: every model links intend-bc.com/fork-setup/, INTEND's one
#     brand-wide fork setup page. No text source states a dial colour.
# --------------------------------------------------------------------------
