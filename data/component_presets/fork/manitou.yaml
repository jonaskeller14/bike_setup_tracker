# Service intervals (`tasks`) come from the Manitou suspension maintenance
# schedule: lower legs every 50 hours, a full service every 200 hours or
# yearly.
#
# Counting conventions, taken from the "Set-up notes" of every guide above:
#   * Damper knobs are turned fully clockwise to reach the maximum "zero"
#     position and are counted counterclockwise (opening) from there — i.e.
#     clicks from fully CLOSED, the default `dial_ccw`. That includes rebound,
#     where closed means slowest (unlike RockShox, which counts from fully open).
#   * VTT-6 compression is the exception: position 1 is minimum (fully
#     counterclockwise) and it is counted clockwise up to position 6 (maximum).
#   * IRT (Infinite Rate Tune) is a genuinely separate air chamber with its own
#     valve, so it is modelled as its own `IRT Pressure` adjustment. The guides
#     say to fill it first, then the main chamber.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    mc2_pro_x_2026:
      name: MC2 Pro-X
      description: |-
        - Four independent damping adjusters: high- and low-speed compression, high- and low-speed rebound
        - Air-backed bladder cartridge for low breakaway friction
        - Non-adjustable hydraulic bottom-out over the last 30 mm of travel
      description_de: |-
        - Vier unabhängige Dämpfungsversteller: High- und Low-Speed-Druckstufe, High- und Low-Speed-Zugstufe
        - Luftunterstützte Bladder-Kartusche für geringe Losbrechreibung
        - Nicht einstellbarer hydraulischer Durchschlagschutz auf den letzten 30 mm des Federwegs
      description_fr: |-
        - Quatre réglages d’amortissement indépendants : compression haute et basse vitesse, détente haute et basse vitesse
        - Cartouche à bladder à contre-pression d’air pour un faible frottement de décollage
        - Fin de course hydraulique non réglable sur les 30 derniers mm de débattement
      description_it: |-
        - Quattro regolatori di smorzamento indipendenti: compressione ad alta e bassa velocità, ritorno ad alta e bassa velocità
        - Cartuccia a bladder con contropressione d’aria per un basso attrito di primo movimento
        - Fondocorsa idraulico non regolabile negli ultimi 30 mm di escursione
      description_es: |-
        - Cuatro ajustes de amortiguación independientes: compresión de alta y baja velocidad, rebote de alta y baja velocidad
        - Cartucho de bladder con respaldo de aire para una baja fricción de arranque
        - Final de carrera hidráulico no ajustable en los últimos 30 mm de recorrido
      description_pt: |-
        - Quatro ajustes de amortecimento independentes: compressão de alta e baixa velocidade, retorno de alta e baixa velocidade
        - Cartucho de bladder com contrapressão de ar para baixo atrito de partida
        - Fim de curso hidráulico não ajustável nos últimos 30 mm de curso
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 8, notes: High-Speed Compression, notes_de: High-Speed-Druckstufe, notes_fr: Compression haute vitesse, notes_it: Compressione ad alta velocità, notes_es: Compresión de alta velocidad, notes_pt: Compressão de alta velocidade }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 10, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade }
        - { name: HSR, name_de: HSR, name_fr: HSR, name_it: HSR, name_es: HSR, name_pt: HSR, type: step, max: 8, notes: "High-Speed Rebound; Counted from fully closed (slowest)", notes_de: High-Speed-Zugstufe; von ganz geschlossen (am langsamsten) gezählt, notes_fr: Détente haute vitesse ; comptée depuis la position entièrement fermée (la plus lente), notes_it: Ritorno ad alta velocità; contato a partire dalla posizione completamente chiusa (il più lento), notes_es: Rebote de alta velocidad; contado desde la posición totalmente cerrada (el más lento), notes_pt: Retorno de alta velocidade; contado a partir da posição totalmente fechada (o mais lento) }
        - { name: LSR, name_de: LSR, name_fr: LSR, name_it: LSR, name_es: LSR, name_pt: LSR, type: step, max: 10, notes: "Low-Speed Rebound; Counted from fully closed (slowest)", notes_de: Low-Speed-Zugstufe; von ganz geschlossen (am langsamsten) gezählt, notes_fr: Détente basse vitesse ; comptée depuis la position entièrement fermée (la plus lente), notes_it: Ritorno a bassa velocità; contato a partire dalla posizione completamente chiusa (il più lento), notes_es: Rebote de baja velocidad; contado desde la posición totalmente cerrada (el más lento), notes_pt: Retorno de baixa velocidade; contado a partir da posição totalmente fechada (o mais lento) }
      source:
        - https://hayesbicycle.zendesk.com/hc/article_attachments/43742231652503
        - https://www.pinkbike.com/news/first-ride-the-manitou-mezzer-lt-class-leading-sensitivity.html
      note: >-
        Ranges "10-0" (LSC, LSR) and "8-0" (HSC, HSR) read off the Mezzer G2 Pro &
