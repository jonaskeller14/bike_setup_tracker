updated: 2026-10-13
# Service intervals (`tasks`) come from the Manitou suspension maintenance
# schedule: lower legs every 50 hours, a full service every 200 hours or
# yearly.
#
# Counting conventions, taken from the "Set-up notes" of every guide above:
#   * Damper knobs are turned fully clockwise to reach the maximum "zero"
#     position and are counted counterclockwise (opening) from there — i.e.
#     clicks from fully CLOSED, the default `dial_ccw`. That includes rebound,
#     where closed means slowest (unlike RockShox, which counts from fully open).
#   * VTT-6 compression is the exception: position 1 is minimum (fully
#     counterclockwise) and it is counted clockwise up to position 6 (maximum).
#   * IRT (Infinite Rate Tune) is a genuinely separate air chamber with its own
#     valve, so it is modelled as its own `IRT Pressure` adjustment. The guides
#     say to fill it first, then the main chamber.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    mc2_pro_x_2026:
      name: MC2 Pro-X
      description: |-
        - Four independent damping adjusters: high- and low-speed compression, high- and low-speed rebound
        - Air-backed bladder cartridge for low breakaway friction
        - Non-adjustable hydraulic bottom-out over the last 30 mm of travel
      adjustments:
        - { name: HSC, type: step, max: 8, notes: High-Speed Compression }
        - { name: LSC, type: step, max: 10, notes: Low-Speed Compression }
        - { name: HSR, type: step, max: 8, notes: "High-Speed Rebound; Counted from fully closed (slowest)" }
        - { name: LSR, type: step, max: 10, notes: "Low-Speed Rebound; Counted from fully closed (slowest)" }
      source:
        - https://hayesbicycle.zendesk.com/hc/article_attachments/43742231652503
        - https://www.pinkbike.com/news/first-ride-the-manitou-mezzer-lt-class-leading-sensitivity.html
      note: >-
        Ranges "10-0" (LSC, LSR) and "8-0" (HSC, HSR) read off the Mezzer G2 Pro &
        LT Pro set-up guide (2025). Pinkbike's May 2026 first ride independently
        states 8 clicks HSC, 10 LSC, 8 HSR, 10 LSR.

    mc2_mezzer_2019:
      name: MC2
      description: |-
        - Bladder cartridge with independent high- and low-speed compression
        - Single rebound adjuster
        - Non-adjustable hydraulic bottom-out over the final stretch of travel
      adjustments:
        - { name: HSC, type: step, max: 4, notes: "High-Speed Compression; Outer knob" }
        - { name: LSC, type: step, max: 10, notes: "Low-Speed Compression; Inner knob" }
        - { name: Rebound, type: step, max: 10, notes: Counted from fully closed (slowest) }
      source: https://hayesbicycle.zendesk.com/hc/article_attachments/43742473560727
      note: >-
        Mezzer Pro (Gen 1) set-up guide Rev A 3/2019: rebound "10-0"; the row for
        unsprung wheel movement (Hi-speed, outer knob) is "4-0"; the row for sprung
        chassis movement (Lo-speed, inner knob) is "10-0".

    vtt6_mezzer_g1:
      name: VTT-6
      description: |-
        - Single six-position compression dial that shapes high- and low-speed damping together
        - Separate rebound dial
      adjustments:
        - { name: Compression, type: step, min: 1, max: 6, visualization: dial_cw, notes: "VTT-6 position; Counted clockwise from position 1 (minimum); adjusts high- and low-speed damping together" }
        - { name: Rebound, type: step, max: 10, notes: Counted from fully closed (slowest) }
      source: https://hayesbicycle.zendesk.com/hc/article_attachments/43742488803479
      note: Mezzer Expert (Gen 1) set-up guide Rev A 5/2021 — VTT "1-6", TPC rebound "10-0".

    vtt6_mezzer_g2:
      name: VTT-6
      description: |-
        - Single six-position compression dial that shapes high- and low-speed damping together
        - Separate rebound dial with 12 clicks
      adjustments:
        - { name: Compression, type: step, min: 1, max: 6, visualization: dial_cw, notes: "VTT-6 position; Counted clockwise from position 1 (minimum); adjusts high- and low-speed damping together" }
        - { name: Rebound, type: step, max: 12, notes: Counted from fully closed (slowest) }
      source: https://hayesbicycle.zendesk.com/hc/article_attachments/41067689282071
      note: Mezzer G2 Expert set-up guide (2025) — VTT-6 "1-6", TPC rebound "12-0".

    abs_plus_mezzer_lt_2026:
      name: ABS+
      description: |-
        - Simple single-knob compression adjustment
        - Separate rebound knob with 10 clicks
      adjustments:
        - { name: Compression, type: step, max: 10, notes: Counted from fully closed (firmest) }
        - { name: Rebound, type: step, max: 10, notes: Counted from fully closed (slowest) }
      source: https://hayesbicycle.zendesk.com/hc/article_attachments/43742211211927
      note: Mezzer G2 LT Comp set-up guide — ABS+ "10-0", TPC rebound "10-0".

    mc2_mattoc_2023:
      name: MC2
      description: |-
        - Sealed bladder cartridge with independent high- and low-speed compression
        - Rebound adjuster on the bottom of the leg with 20 clicks
        - Non-adjustable hydraulic bottom-out over the last 30 mm of travel
      adjustments:
        - { name: HSC, type: step, max: 4, notes: "High-Speed Compression; Outer knob" }
        - { name: LSC, type: step, max: 10, notes: "Low-Speed Compression; Inner knob" }
        - { name: Rebound, type: step, max: 20, notes: Counted from fully closed (slowest) }
      source: https://hayesbicycle.zendesk.com/hc/article_attachments/14639548710935
      note: Mattoc Pro set-up guide Rev 1 2/2023 — rebound "20-0", Hi-speed "4-0", Lo-speed "10-0".

    vtt6_2023:
      name: VTT-6
      description: |-
        - Single six-position compression dial that shapes high- and low-speed damping together
        - Separate rebound dial with 20 clicks
      adjustments:
        - { name: Compression, type: step, min: 1, max: 6, visualization: dial_cw, notes: "VTT-6 position; Counted clockwise from position 1 (minimum); adjusts high- and low-speed damping together" }
        - { name: Rebound, type: step, max: 20, notes: Counted from fully closed (slowest) }
      source:
        - https://hayesbicycle.zendesk.com/hc/article_attachments/14639542611479
        - https://hayesbicycle.zendesk.com/hc/article_attachments/17493411154967
      note: Mattoc Expert (Rev 1 2/2023) and Mastodon Pro (Rev 1 6/2023) set-up guides — VTT-6 "1-6", rebound "20-0".

    abs_plus_2023:
      name: ABS+
      description: |-
        - Simple single-knob compression adjustment with 9 clicks
        - Rebound knob has no click stops
      adjustments:
        - { name: Compression, type: step, max: 9, notes: Counted from fully closed (firmest) }
        - { name: Rebound, type: categorical, options: ["12 o'clock", "1 o'clock", "2 o'clock", "3 o'clock", "4 o'clock", "5 o'clock", "6 o'clock"], notes: "Not detented; set by clock position from 12 o'clock (minimum) to 6 o'clock (maximum)" }
      source:
        - https://hayesbicycle.zendesk.com/hc/article_attachments/14639496469143
        - https://hayesbicycle.zendesk.com/hc/article_attachments/17493359414167
      note: Mattoc Comp (Rev 1 2/2023) and Mastodon Comp (Rev 1 6/2023) set-up guides — Absolute+ "9-0"; rebound is not detented.

    vtt_pro_x_r8:
      name: VTT Pro-X
      description: |-
        - Three factory-tuned compression modes: Open, Firm and Lock
        - Open-mode adjuster fine-tunes the Open setting with a 3 mm hex key
        - Compatible with the Deuce remote lockout
      adjustments:
        - { name: Compression Mode, type: categorical, options: [Open, Firm, Lock] }
        - { name: Open Mode Compression, type: step, max: 20, notes: Counted from fully closed (firmest); only affects Open mode }
        - { name: Rebound, type: step, max: 18, notes: Counted from fully closed (slowest) }
      source: https://hayesbicycle.zendesk.com/hc/article_attachments/24504253740951
      note: R8 Pro set-up guide (2024) — rebound "18-0", open-mode adjust "20-0".

    tpc_plus_dorado_2022:
      name: TPC+
      description: |-
        - Independent high-speed (outer) and low-speed (inner) compression, plus rebound
        - Non-adjustable hydraulic bottom-out over the last 30 mm of travel
      adjustments:
        - { name: HSC, type: step, max: 15, notes: "High-Speed Compression; Outer knob" }
        - { name: LSC, type: step, max: 15, notes: "Low-Speed Compression; TPC+ inner knob" }
        - { name: Rebound, type: step, max: 24, notes: Counted from fully closed (slowest) }
      source:
        - https://hayesbicycle.zendesk.com/hc/article_attachments/4404709083799
        - https://hayesbicycle.zendesk.com/hc/article_attachments/4404701744407
      note: Dorado Pro (Rev 1 2/2021) and Dorado Expert (Rev 1 11/2020) set-up guides — rebound "24-0", Hi-speed "15-0", TPC+ "15-0".

    abs_plus_dorado_2022:
      name: ABS+
      description: |-
        - Single-knob compression adjustment with 20 clicks
        - Separate rebound knob with 20 clicks
      adjustments:
        - { name: Compression, type: step, max: 20, notes: "Low-Speed Compression; Counted from fully closed (firmest)" }
        - { name: Rebound, type: step, max: 20, notes: Counted from fully closed (slowest) }
      source:
        - https://hayesbicycle.zendesk.com/hc/article_attachments/4404709071767
        - https://hayesbicycle.com/products/new-dorado-coil
      note: Dorado Comp set-up guide Rev 1 1/2021 — rebound "20-0", ABS+ "20-0"; the product page lists the compression adjuster as "LS Compression".

# --------------------------------------------------------------------------
# Setup guides — the Hayes set-up guides' starting points as data (SCHEMA.md,
# "Setup guides"), transcribed from docs/research/setup_guides/manitou.md.
#   * Pressure (and IRT / IVA): one rule per printed travel column. Travels a
#     guide prints no column for (R8 80/90/110 mm, Mastodon 90/110 mm) get no
#     pressure or IVA value.
#   * Rider weight is in lb. The Gen 1 Mezzer and Dorado tables end in a ">220"
#     row; it is left out (an open-ended row would apply one pressure to every
#     heavier rider while the table keeps rising), so riders above 200 lb are
#     outside the published range.
#   * Every click table counts from fully closed, as the catalog dampers do;
#     VTT-6 positions run 1-6 on both sides. Encoded as published.
#   * Compression by riding style: Plush / Mid / Firm and Comfort / Balanced /
#     Support wordings map onto `riding_style`. Discipline names (Downhill /
#     Enduro / Trail, Standard / DH Race / Park) and the Mattoc Pro's two-way
#     Aggressive / Compliant tune don't map 1:1 and get no rule; their values
#     are kept in comments next to the guide.
#   * E-bike / downhill and trail pressure offsets are relative: notes only.
# --------------------------------------------------------------------------
guides:
  manitou_mezzer_g2_pro_2025:
    label: Manitou Mezzer G2 Pro & LT Pro set-up guide (2025)
    source: https://hayesbicycle.zendesk.com/hc/article_attachments/43742231652503
    rules:
      # 140 mm is the Mezzer Pro only; 180 and 190 mm are the Mezzer LT Pro only.
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 140 }
        rows: { 120-140: 40, 140-160: 49, 160-180: 59, 180-200: 68, 200-220: 77, 220-240: 86, 240-260: 95 }
        note: &mezzer_g2_pro_main_offset E-bike or downhill riding takes 3-4 psi more, trail riding 3-4 psi less
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 150 }
        rows: { 120-140: 39, 140-160: 48, 160-180: 57, 180-200: 66, 200-220: 75, 220-240: 84, 240-260: 93 }
        note: *mezzer_g2_pro_main_offset
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 160 }
        rows: { 120-140: 38, 140-160: 47, 160-180: 55, 180-200: 64, 200-220: 73, 220-240: 82, 240-260: 91 }
        note: *mezzer_g2_pro_main_offset
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 170 }
        rows: { 120-140: 37, 140-160: 45, 160-180: 54, 180-200: 62, 200-220: 71, 220-240: 80, 240-260: 88 }
        note: *mezzer_g2_pro_main_offset
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 180 }
        rows: { 120-140: 35, 140-160: 44, 160-180: 52, 180-200: 61, 200-220: 69, 220-240: 77, 240-260: 86 }
        note: *mezzer_g2_pro_main_offset
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 190 }
        rows: { 120-140: 34, 140-160: 42, 160-180: 51, 180-200: 59, 200-220: 67, 220-240: 75, 240-260: 83 }
        note: *mezzer_g2_pro_main_offset
      - target: irt_pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 140 }
        rows: { 120-140: 61, 140-160: 74, 160-180: 87, 180-200: 100, 200-220: 113, 220-240: 126, 240-260: 139 }
        note: &mezzer_g2_pro_irt_offset E-bike or downhill riding takes 5-10 psi more, trail riding 5-10 psi less
      - target: irt_pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 150 }
        rows: { 120-140: 59, 140-160: 72, 160-180: 85, 180-200: 98, 200-220: 111, 220-240: 124, 240-260: 137 }
        note: *mezzer_g2_pro_irt_offset
      - target: irt_pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 160 }
        rows: { 120-140: 57, 140-160: 70, 160-180: 83, 180-200: 96, 200-220: 109, 220-240: 122, 240-260: 135 }
        note: *mezzer_g2_pro_irt_offset
      - target: irt_pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 170 }
        rows: { 120-140: 55, 140-160: 68, 160-180: 81, 180-200: 94, 200-220: 107, 220-240: 120, 240-260: 133 }
        note: *mezzer_g2_pro_irt_offset
      - target: irt_pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 180 }
        rows: { 120-140: 53, 140-160: 66, 160-180: 79, 180-200: 92, 200-220: 105, 220-240: 118, 240-260: 131 }
        note: *mezzer_g2_pro_irt_offset
      - target: irt_pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 190 }
        rows: { 120-140: 51, 140-160: 64, 160-180: 77, 180-200: 90, 200-220: 103, 220-240: 116, 240-260: 129 }
        note: *mezzer_g2_pro_irt_offset
      - target: lsr
        input: rider_weight
        input_unit: lb
        rows: &mezzer_g2_rebound {
          120-140: [9, 10], 140-160: [8, 9], 160-180: [7, 8], 180-200: [6, 7],
          200-220: [4, 5], 220-240: [3, 4], 240-260: [2, 3]
        }
      - target: hsr
        input: rider_weight
        input_unit: lb
        rows: {
          120-140: [7, 8], 140-160: [6, 8], 160-180: [5, 7], 180-200: [4, 6],
          200-220: [3, 6], 220-240: [2, 5], 240-260: [1, 4]
        }
      - { target: lsc, range: [6, 9], when: { riding_style: comfort }, note: Plush Natural }
      - { target: lsc, range: [4, 6], when: { riding_style: balanced }, note: Mid Mixed }
      - { target: lsc, range: [2, 4], when: { riding_style: race }, note: Firm Park }
      - { target: hsc, range: [5, 7], when: { riding_style: comfort }, note: Plush Natural }
      - { target: hsc, range: [4, 6], when: { riding_style: balanced }, note: Mid Mixed }
      - { target: hsc, range: [2, 4], when: { riding_style: race }, note: Firm Park }
      - &manitou_fork_sag_20_25 { target: sag, range: [20, 25], comfort_at: max }

  manitou_mezzer_g2_expert_2025:
    label: Manitou Mezzer G2 Expert set-up guide (2025)
    source: https://hayesbicycle.zendesk.com/hc/article_attachments/41067689282071
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 140 }
        rows: { 120-140: 46, 140-160: 57, 160-180: 68, 180-200: 79, 200-220: 90, 220-240: 101, 240-260: 112 }
        note: *mezzer_g2_pro_main_offset
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 150 }
        rows: { 120-140: 44, 140-160: 54, 160-180: 64, 180-200: 74, 200-220: 84, 220-240: 94, 240-260: 104 }
        note: *mezzer_g2_pro_main_offset
      # The 160 mm column is above the 150 mm one in every row, as printed.
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 160 }
        rows: { 120-140: 44, 140-160: 55, 160-180: 65, 180-200: 75, 200-220: 85, 220-240: 96, 240-260: 106 }
        note: *mezzer_g2_pro_main_offset
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 170 }
        rows: { 120-140: 40, 140-160: 50, 160-180: 59, 180-200: 69, 200-220: 78, 220-240: 88, 240-260: 97 }
        note: *mezzer_g2_pro_main_offset
      - { target: iva_position, value: 4, when: { travel_mm: [140, 150] } }
      - { target: iva_position, value: 3, when: { travel_mm: [160, 170] } }
      - target: rebound
        input: rider_weight
        input_unit: lb
        rows: *mezzer_g2_rebound
      - { target: compression, range: [1, 2], when: { riding_style: comfort }, note: Plush Comfort }
      - { target: compression, range: [3, 4], when: { riding_style: balanced }, note: Balanced Performance }
      - { target: compression, range: [5, 6], when: { riding_style: race }, note: Firm Support }
      - *manitou_fork_sag_20_25

  manitou_mezzer_g2_ltcomp_2025:
    label: Manitou Mezzer G2 LT Comp set-up guide (2025)
    source: https://hayesbicycle.zendesk.com/hc/article_attachments/43742211211927
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 140 }
        rows: { 120-140: 56, 140-160: 67, 160-180: 77, 180-200: 88, 200-220: 98, 220-240: 108, 240-260: 119 }
        note: &mezzer_ltcomp_main_offset E-bike or downhill riding takes 3-5 psi more, trail riding 3-5 psi less
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 150 }
        rows: { 120-140: 55, 140-160: 65, 160-180: 76, 180-200: 86, 200-220: 96, 220-240: 106, 240-260: 116 }
        note: *mezzer_ltcomp_main_offset
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 160 }
        rows: { 120-140: 54, 140-160: 64, 160-180: 74, 180-200: 84, 200-220: 94, 220-240: 104, 240-260: 114 }
        note: *mezzer_ltcomp_main_offset
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { travel_mm: 170 }
        rows: { 120-140: 51, 140-160: 61, 160-180: 71, 180-200: 81, 200-220: 91, 220-240: 100, 240-260: 110 }
        note: *mezzer_ltcomp_main_offset
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
