#     Hayes Performance Systems help center.
#   - Year ranges are derived from Hayes listing creation dates (Mezzer G2
#     Apr 2026, Mattoc May 2023, R8 Jun 2024, Dorado MY22 Jun 2021, Mastodon
#     Gen 3 Sep 2023) and Pinkbike launch coverage (Mezzer Gen 1 May 2019, Gen 2
#     May 2026). Gen 1 end year (2025) and the Gen 1 Expert introduction year are
#     not confirmed by a Manitou source.
#   - IVA (Incremental Volume Adjust) maximum position on Mezzer / Mezzer LT
#     Expert & Comp, Mattoc Expert & Comp and Mastodon: the set-up-guide tables
#     only list recommended positions, never the maximum. The IVA Position
#     maximum is estimated from each trim's own guide table (Mezzer Expert 4,
#     Mezzer LT Comp 3, Mattoc Expert / Comp 3, Mastodon 5); confirm with Hayes.
#     Published positions (1-3) are captured for R8 and Dorado Expert.
#   - Rebound on Mattoc Comp / Mastodon Comp is a non-detented knob; no click
#     count exists, so it is a categorical of the guides' clock positions.
#   - Pressure / IRT maxima (120 / 150 / 200 psi) are the set-up guides' limits.
#   - Not covered: Machete, Markhor (Kwik Toggle / TPC rebound, no click counts
#     in the service guides), JUNIT and Circus (youth / dirt-jump / BMX), Magnum,
#     Dorado 36 and the 2018-2022 Mattoc generations.
