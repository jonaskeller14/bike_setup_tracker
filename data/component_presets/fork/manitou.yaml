#   - IVA (Incremental Volume Adjust) maximum position on Mezzer / Mezzer LT
#     Expert & Comp, Mattoc Expert & Comp and Mastodon: the set-up-guide tables
#     only list recommended positions, never the maximum. The IVA Position
#     maximum is estimated from each trim's own guide table (Mezzer Expert 4,
#     Mezzer LT Comp 3, Mattoc Expert / Comp 3, Mastodon 5); confirm with Hayes.
#     Published positions (1-3) are captured for R8 and Dorado Expert.
#   - Rebound on Mattoc Comp / Mastodon Comp is a non-detented knob; no click
#     count exists, so it is a categorical of the guides' clock positions.
