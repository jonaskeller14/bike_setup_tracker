          - { name: IRT Pressure, type: numerical, unit: psi, min: 0, notes: "Infinite Rate Tune chamber; fill before the main chamber; max 200 psi" }
        offset_mm: [47, 57]
        note: |-
          - 37mm downhill chassis with carbon outer legs, 20mm x 110mm Boost axle
          - Dorado Air spring with Infinite Rate Tune (IRT)
          - Trail Side Relief (TSR) button equalizes casting pressure
      - trim: Expert
        key: fork-manitou-dorado-expert-2022
        url: https://hayesbicycle.com/products/new-my22-dorado-expert
        travel_mm: [180, 190, 203]
        stanchion: 37mm
