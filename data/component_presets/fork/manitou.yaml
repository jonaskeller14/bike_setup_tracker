      - trim: Expert
        key: fork-manitou-mezzer-expert-2019
        travel_mm: [140, 150, 160, 170, 180]
        stanchion: 37mm
        spring: Air
        dampers: [vtt6_mezzer_g1]
        adjustments: *expert_air_spring
        offset_mm: [37, 44, 51]
        note: |-
          - Reverse Arch 37mm chassis, Boost only
          - Expert Air spring with Incremental Volume Adjust (IVA)

# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - manitoumtb.com redirects to manitou.hayesbicycle.com, which sits behind a
#     bot challenge; product specs were read from the identical listings on
#     hayesbicycle.com and click counts from the set-up guide PDFs hosted on the
#     Hayes Performance Systems help center.
#   - Year ranges are derived from Hayes listing creation dates (Mezzer G2
#     Apr 2026, Mattoc May 2023, R8 Jun 2024, Dorado MY22 Jun 2021, Mastodon
