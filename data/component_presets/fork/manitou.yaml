# Manitou mountain-bike forks — adjustment preset database
#
# Same design as fork/fox.yaml and fork/rockshox.yaml: click ranges belong to the
# DAMPER cartridge, defined once under `dampers:` and referenced by key from
# each fork's trims. See SCHEMA.md in this folder.

brand: Manitou
component_type: fork
sources:
