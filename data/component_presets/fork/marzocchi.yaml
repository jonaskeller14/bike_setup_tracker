              Federrate in lbs/in je Farbe nicht an.
            note_fr: Débattement réglable à la baisse par paliers de 10 mm avec les entretoises internes fournies. Ressorts vendus séparément, repérés par couleur selon le poids du pilote (Violet/Bleu/Vert/Jaune ~ Souple/Moyen/Ferme/X-Ferme) ; Marzocchi ne publie pas la raideur réelle en lbs/in de chaque couleur.
