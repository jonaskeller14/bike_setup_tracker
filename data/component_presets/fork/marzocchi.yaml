# Marzocchi mountain-bike forks — adjustment preset database
#
# Marzocchi has been a FOX Factory-owned brand since 2015 ("Marzocchi by FOX")
# and its current Bomber-series forks share Fox-style adjuster mechanisms
# (RAIL / GRIP dampers) and Fox's official documentation infrastructure
# (tech.ridefox.com hosts Marzocchi's tuning guides and owner's guides).
#
# See SCHEMA.md in this folder for the sparse `adjustments:` format, the field
# defaults table, and how these entries map to the app's Adjustment presets.

brand: Marzocchi
component_type: fork
sources:
  - https://bike.marzocchi.com/collections/forks
  - https://bike.marzocchi.com/products/bomber-z1
  - https://bike.marzocchi.com/products/bomber-z1-coil
  - https://bike.marzocchi.com/products/bomber-z2
  - https://bike.marzocchi.com/products/bomber-dj
  - https://bike.marzocchi.com/products/bomber-58
  - https://cdn.shopify.com/s/files/1/0618/4989/5143/files/605-00-311_REV_B_-_Marzocchi_BOMBER_Z1_Owners_Guide.pdf
  - https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-256_RevB_DJ-Z1_TuningGuide.pdf
  - https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-237-%20RevA_Z2_TuningGuide.pdf
  - https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-174-58_TuningGuide-revA.pdf
  - https://www.pinkbike.com/news/marzocchi-bomber-z1-review.html
  - https://nsmb.com/articles/marzocchi-bomber-z1-reviewed/
  # Primary — service intervals
  - https://tech.ridefox.com/img/help/page2839-HZFA/inline/605-00-255%20REV%20A%20-%202021%20Marzocchi%20Forks%20Owners%20Guide.pdf
updated: 2026-10-13
# Service intervals (`tasks`) come from the 2021 Marzocchi Forks Owner's Guide:
# a full service (damper and air spring rebuild, bath oil and wipers) every
# 125 hours or yearly. No separate lower-leg interval is published.
#
# Rebound/compression numbers below come from the official Marzocchi tuning
# guides (PDFs hosted on tech.ridefox.com), not the marketing product pages,
# which describe adjusters in prose only ("simple sweep adjuster") without
# click counts. Clicks are counted from fully closed (firmest); the tuning
# guides all show a 9-position "OPEN 9-8-7-6-5-4-3-2-1 CLOSED" rebound scale,
# i.e. the default `dial_ccw` visualization.

# --------------------------------------------------------------------------
# Dampers — click ranges shared across every fork that ships with the damper.
# --------------------------------------------------------------------------
option_values:
  damper:
    rail:
      name: RAIL
      description: >
        Damper on Bomber Z1 (Air), Bomber Z1 Coil and Bomber Z2: a simple sweep
        compression lever and a clicked rebound dial.
      description_de: >
        Dämpfer der Bomber Z1 (Air), Bomber Z1 Coil und Bomber Z2: ein einfacher
        Sweep-Druckstufenhebel und ein Zugstufenrad mit Klicks.
      description_fr: "Amortisseur des Bomber Z1 (Air), Bomber Z1 Coil et Bomber Z2 : un simple levier de compression à balayage et une molette de détente à clics."
      description_it: "Ammortizzatore delle Bomber Z1 (Air), Bomber Z1 Coil e Bomber Z2: una semplice leva di compressione a corsa continua e una manopola del ritorno a scatti."
      description_es: "Amortiguador de las Bomber Z1 (Air), Bomber Z1 Coil y Bomber Z2: una sencilla palanca de compresión de barrido y una rueda de rebote con clics."
      description_pt: "Amortecedor das Bomber Z1 (Air), Bomber Z1 Coil e Bomber Z2: uma alavanca de compressão de varredura simples e um seletor de retorno com cliques."
      adjustments: &sweep_2pos
        - { name: Compression Mode, name_de: Druckstufenmodus, name_fr: Mode de compression, name_it: Modalità di compressione, name_es: Modo de compresión, name_pt: Modo de compressão, type: categorical, options: [Open, Firm], options_de: [Offen, Fest], options_fr: [Ouvert, Ferme], options_it: [Aperto, Rigido], options_es: [Abierto, Firme], options_pt: [Aberto, Firme], notes: "Sweep lever, continuously variable between Open and Firm", notes_de: "Sweep-Hebel, stufenlos zwischen Open und Firm", notes_fr: "Levier à balayage, variable en continu entre Open et Firm", notes_it: "Leva a corsa continua, variabile senza scatti tra Open e Firm", notes_es: "Palanca de barrido, variable de forma continua entre Open y Firm", notes_pt: "Alavanca de varredura, variável continuamente entre Open e Firm" }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 13, notes: "Counted from fully closed (slowest); estimated maximum, check your dial and edit it if it differs", notes_de: "Von ganz geschlossen (am langsamsten) gezählt; geschätztes Maximum, am Drehrad prüfen und bei Abweichung anpassen", notes_fr: "Compté depuis la position entièrement fermée (la plus lente) ; maximum estimé, vérifiez votre cadran et modifiez-le s’il diffère", notes_it: "Contato a partire dalla posizione completamente chiusa (la più lenta); massimo stimato, controlla la tua manopola e modificalo se è diverso", notes_es: "Contado desde la posición totalmente cerrada (la más lenta); máximo estimado, comprueba tu dial y edítalo si es distinto", notes_pt: "Contado a partir da posição totalmente fechada (a mais lenta); máximo estimado, confira o seu seletor e edite-o se for diferente", dialColor: red }
      source:
        - https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-256_RevB_DJ-Z1_TuningGuide.pdf
        - https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-237-%20RevA_Z2_TuningGuide.pdf
      note: >-
        Sweep lever from the 2020 Bomber Z1/DJ tuning guide (then labelled
        "GRIP") and the 2019 Bomber Z2 tuning guide, which show the identical
        spec under both names. Rebound maximum is an estimate: both guides'
        rebound tables ("turn the rebound knob clockwise until it stops, then
        counter-clockwise to the number of clicks", 120-250 lbs) start at 13
        clicks, so the dial has at least 13 clicks counted from fully closed.
        The guides' printed "OPEN 9 ... 1 CLOSED" scale does not match their own
        table. Current Z2 copy mentions a "new RAIL damper" without a republished
        spec.

    grip:
      name: GRIP
      description: Damper on Bomber DJ with a sweep compression lever and a clicked rebound dial.
      description_de: Dämpfer der Bomber DJ mit Sweep-Druckstufenhebel und Zugstufenrad mit Klicks.
      description_fr: Amortisseur de la Bomber DJ avec un levier de compression à balayage et une molette de détente à clics.
      description_it: Ammortizzatore della Bomber DJ con una leva di compressione a corsa continua e una manopola del ritorno a scatti.
      description_es: Amortiguador de la Bomber DJ con una palanca de compresión de barrido y una rueda de rebote con clics.
      description_pt: Amortecedor da Bomber DJ com uma alavanca de compressão de varredura e um seletor de retorno com cliques.
      adjustments: *sweep_2pos
      source: https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-256_RevB_DJ-Z1_TuningGuide.pdf
      note: Same spec as `rail`, per the shared 2020 "Bomber Z1 & DJ" tuning guide, which calls it GRIP.

    grip_58:
      name: GRIP
      description: >
        Damper on the dual-crown Bomber 58: a clicked low-speed compression dial
        plus a clicked rebound dial.
      description_de: >
        Dämpfer der Bomber 58 mit Doppelbrücke: ein Low-Speed-Druckstufenrad mit
        Klicks plus ein Zugstufenrad mit Klicks.
      description_fr: "Amortisseur de la Bomber 58 à double té : une molette de compression basse vitesse à clics plus une molette de détente à clics."
      description_it: "Ammortizzatore della Bomber 58 a doppia piastra: una manopola di compressione a bassa velocità a scatti più una manopola del ritorno a scatti."
      description_es: "Amortiguador de la Bomber 58 de doble corona: una rueda de compresión de baja velocidad con clics más una rueda de rebote con clics."
      description_pt: "Amortecedor da Bomber 58 de dupla coroa: um seletor de compressão de baixa velocidade com cliques mais um seletor de retorno com cliques."
      adjustments:
        - { name: Compression, name_de: Druckstufe, name_fr: Compression, name_it: Compressione, name_es: Compresión, name_pt: Compressão, type: step, max: 8, notes: "Low-Speed Compression; counted from fully closed (firmest)", notes_de: Low-Speed-Druckstufe; von ganz geschlossen (am festesten) gezählt, notes_fr: Compression basse vitesse ; comptée depuis la position entièrement fermée (la plus ferme), notes_it: Compressione a bassa velocità; contata a partire dalla posizione completamente chiusa (la più rigida), notes_es: Compresión de baja velocidad; contada desde la posición totalmente cerrada (la más firme), notes_pt: Compressão de baixa velocidade; contada a partir da posição totalmente fechada (a mais firme) }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 13, notes: "Counted from fully closed (slowest); estimated maximum, check your dial and edit it if it differs", notes_de: "Von ganz geschlossen (am langsamsten) gezählt; geschätztes Maximum, am Drehrad prüfen und bei Abweichung anpassen", notes_fr: "Compté depuis la position entièrement fermée (la plus lente) ; maximum estimé, vérifiez votre cadran et modifiez-le s’il diffère", notes_it: "Contato a partire dalla posizione completamente chiusa (la più lenta); massimo stimato, controlla la tua manopola e modificalo se è diverso", notes_es: "Contado desde la posición totalmente cerrada (la más lenta); máximo estimado, comprueba tu dial y edítalo si es distinto", notes_pt: "Contado a partir da posição totalmente fechada (a mais lenta); máximo estimado, confira o seu seletor e edite-o se for diferente" }
      source: https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-174-58_TuningGuide-revA.pdf
      note: >-
        Official Bomber 58 tuning guide (605-00-174): the low-speed compression
        diagram shows 8 clicks from fully closed. Rebound maximum is an estimate:
        the guide's rebound table (120-250 lbs, counted counter-clockwise from
        fully closed) starts at 13 clicks. Despite the shared GRIP name, not the
        same cartridge as Bomber DJ's.

# --------------------------------------------------------------------------
# Setup guides — the tuning and owner's guides' starting points as data
# (SCHEMA.md, "Setup guides"), transcribed from
# docs/research/setup_guides/marzocchi.md. Every rebound table counts from
# fully closed, the catalog's direction. Setting SAG with the compression lever
# open is a procedure, not a riding setting, so it gets no rule.
# --------------------------------------------------------------------------
guides:
  marzocchi_z1_2024:
    label: Marzocchi Bomber Z1 owner's guide (2024)
    label_de: Marzocchi Bomber Z1 Bedienungsanleitung (2024)
    label_fr: Manuel d’utilisation Marzocchi Bomber Z1 (2024)
    label_it: Manuale d’uso Marzocchi Bomber Z1 (2024)
    label_es: Manual del usuario Marzocchi Bomber Z1 (2024)
    label_pt: Manual do usuário Marzocchi Bomber Z1 (2024)
    source: https://cdn.shopify.com/s/files/1/0618/4989/5143/files/605-00-311_REV_B_-_Marzocchi_BOMBER_Z1_Owners_Guide.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        rows: &marzocchi_z1_pressure {
          120-130: 55, 130-140: 59, 140-150: 63, 150-160: 67, 160-170: 72,
          170-180: 76, 180-190: 80, 190-200: 85, 200-210: 89, 210-220: 93,
          220-230: 97, 230-240: 102, 240-250: 106
        }
      # The rebound column sits in the air pressure table, so the Z1 Coil gets
      # none.
      - target: rebound
        input: rider_weight
        input_unit: lb
        when: { model: z1 }
        rows: &marzocchi_rebound {
          120-130: 13, 130-140: 12, 140-150: 11, 150-160: 10, 160-170: 9,
          170-180: 8, 180-190: 7, 190-200: 6, 200-210: 5, 210-220: 4,
          220-230: 3, 230-240: 2, 240-250: 1
        }
      - { target: sag, range: [15, 20], comfort_at: max, note: "15 % is Marzocchi's firm end, 20 % the plush end", note_de: "15 % ist das feste Ende von Marzocchi, 20 % das komfortable Ende", note_fr: "15 % est la limite ferme de Marzocchi, 20 % la limite confortable", note_it: "15 % è il limite rigido di Marzocchi, 20 % quello confortevole", note_es: 15 % es el extremo firme de Marzocchi y 20 % el cómodo, note_pt: 15 % é o extremo firme da Marzocchi e 20 % o confortável }
      # Factory spacers for the catalog travels; the guide prints no 100 mm row.
      - target: volume_spacers
        input: travel_mm
        rows: { 150: 3, 160: 2 }
      # The Z1 Coil spring chart (colour per rider weight, no rate) is left
      # out: the 2024 and 2020 guides print different weight bands.

  marzocchi_z1_dj_2020:
    label: Marzocchi Bomber Z1 and DJ tuning guide (2020)
    label_de: Marzocchi Bomber Z1 und DJ Tuning-Anleitung (2020)
    label_fr: Guide de réglage Marzocchi Bomber Z1 et DJ (2020)
    label_it: Guida alla taratura Marzocchi Bomber Z1 e DJ (2020)
    label_es: Guía de tarado Marzocchi Bomber Z1 y DJ (2020)
    label_pt: Guia de calibragem Marzocchi Bomber Z1 e DJ (2020)
    source: https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-256_RevB_DJ-Z1_TuningGuide.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        rows: *marzocchi_z1_pressure
      - target: rebound
        input: rider_weight
        input_unit: lb
        rows: *marzocchi_rebound
      - { target: sag, range: [15, 20], comfort_at: max, note: "15 % is Marzocchi's firm end, 20 % the plush end", note_de: "15 % ist das feste Ende von Marzocchi, 20 % das komfortable Ende", note_fr: "15 % est la limite ferme de Marzocchi, 20 % la limite confortable", note_it: "15 % è il limite rigido di Marzocchi, 20 % quello confortevole", note_es: 15 % es el extremo firme de Marzocchi y 20 % el cómodo, note_pt: 15 % é o extremo firme da Marzocchi e 20 % o confortável }
      - { target: volume_spacers, value: 8 }

  marzocchi_z2_2019:
    label: Marzocchi Bomber Z2 tuning guide (2019)
    label_de: Marzocchi Bomber Z2 Tuning-Anleitung (2019)
    label_fr: Guide de réglage Marzocchi Bomber Z2 (2019)
    label_it: Guida alla taratura Marzocchi Bomber Z2 (2019)
    label_es: Guía de tarado Marzocchi Bomber Z2 (2019)
    label_pt: Guia de calibragem Marzocchi Bomber Z2 (2019)
    source: https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-237-%20RevA_Z2_TuningGuide.pdf
    # Standard column only: the E-Bike+ column waits for an e-bike option (#72).
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        rows: {
          120-130: 58, 130-140: 63, 140-150: 68, 150-160: 72, 160-170: 77,
          170-180: 82, 180-190: 86, 190-200: 91, 200-210: 96, 210-220: 100,
          220-230: 105, 230-240: 110, 240-250: 114
        }
      - target: rebound
        input: rider_weight
        input_unit: lb
        rows: {
          120-130: 13, 130-140: 10, 140-150: 9, 150-160: 9, 160-170: 8,
          170-180: 8, 180-190: 8, 190-200: 7, 200-210: 7, 210-220: 6,
          220-230: 4, 230-240: 3, 240-250: 2
        }
      - { target: sag, range: [15, 20], comfort_at: max, note: "15 % is Marzocchi's firm end, 20 % the plush end", note_de: "15 % ist das feste Ende von Marzocchi, 20 % das komfortable Ende", note_fr: "15 % est la limite ferme de Marzocchi, 20 % la limite confortable", note_it: "15 % è il limite rigido di Marzocchi, 20 % quello confortevole", note_es: 15 % es el extremo firme de Marzocchi y 20 % el cómodo, note_pt: 15 % é o extremo firme da Marzocchi e 20 % o confortável }
      - target: volume_spacers
        input: travel_mm
        rows: { 120: 2, 130: 1, 140: 0, 150: 0 }

  marzocchi_58_2017:
    label: Marzocchi Bomber 58 tuning guide (2017)
    label_de: Marzocchi Bomber 58 Tuning-Anleitung (2017)
    label_fr: Guide de réglage Marzocchi Bomber 58 (2017)
    label_it: Guida alla taratura Marzocchi Bomber 58 (2017)
    label_es: Guía de tarado Marzocchi Bomber 58 (2017)
    label_pt: Guia de calibragem Marzocchi Bomber 58 (2017)
    source: https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-174-58_TuningGuide-revA.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        rows: {
          120-130: 49, 130-140: 53, 140-150: 57, 150-160: 61, 160-170: 65,
          170-180: 69, 180-190: 73, 190-200: 76, 200-210: 80, 210-220: 84,
          220-230: 88, 230-240: 92, 240-250: 96
        }
      - target: rebound
        input: rider_weight
        input_unit: lb
        rows: *marzocchi_rebound
      - { target: compression, value: 4 }
      - { target: sag, range: [15, 20], comfort_at: max, note: "15 % is Marzocchi's firm end, 20 % the plush end", note_de: "15 % ist das feste Ende von Marzocchi, 20 % das komfortable Ende", note_fr: "15 % est la limite ferme de Marzocchi, 20 % la limite confortable", note_it: "15 % è il limite rigido di Marzocchi, 20 % quello confortevole", note_es: 15 % es el extremo firme de Marzocchi y 20 % el cómodo, note_pt: 15 % é o extremo firme da Marzocchi e 20 % o confortável }
      - { target: volume_spacers, value: 4 }

