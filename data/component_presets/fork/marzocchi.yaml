        setup_guide: https://cdn.shopify.com/s/files/1/0618/4989/5143/files/605-00-311_REV_B_-_Marzocchi_BOMBER_Z1_Owners_Guide.pdf
        guide: marzocchi_z1_2024
        children:
          - label: Coil
            level: trim
            specs: { stanchion: "36mm, Black Anodized", stanchion_de: "36mm, schwarz eloxiert", stanchion_fr: "36mm, anodisé noir", stanchion_it: "36mm, anodizzato nero", stanchion_es: "36mm, anodizado negro", stanchion_pt: "36mm, anodizado preto", spring: Coil, spring_de: Stahlfeder, spring_fr: Hélicoïdal, spring_it: Elicoidale, spring_es: Helicoidal, spring_pt: Helicoidal }
            offset_mm: 44
            axle: 15QRx110
            adjustments:
              - { name: Spring Rate, name_de: Federrate, name_fr: Raideur du ressort, name_it: Rigidità della molla, name_es: Rigidez del muelle, name_pt: Rigidez da mola, type: numerical, unit: lbs/in, min: 0 }
            options:
              damper: [rail]
              travel_mm: [160]
              wheel_size: [29]
            note: >
              Travel adjustable down in 10mm increments via included internal
              spacers. Coil springs sold separately, color-coded to rider weight
              (Purple/Blue/Green/Yellow ~ Soft/Medium/Firm/X-Firm); Marzocchi
              does not publish the actual lbs/in rate per color.
            note_de: >
              Der Federweg lässt sich mit den mitgelieferten internen Spacern in
              10mm-Schritten verringern. Stahlfedern separat erhältlich, nach
              Fahrergewicht farbcodiert (Violett/Blau/Grün/Gelb ~
