            offset_mm: 44
            axle: 15QRx110
            adjustments:
              - { name: Pressure, name_de: Luftdruck, name_fr: Pression d’air, name_it: Pressione dell’aria, name_es: Presión de aire, name_pt: Pressão do ar, type: numerical, unit: psi, min: 0, max: 120 }
              - { name: Volume Spacers, name_de: Volumenspacer, name_fr: Tokens, name_it: Token, name_es: Tokens, name_pt: Tokens, type: step, max: 8, visualization: stepper, notes: "Clip-on spacers; maximum depends on travel: 130/140mm 8, 150/160mm 7, 170mm 6, 180mm 5", notes_de: "Aufklipp-Spacer; das Maximum hängt vom Federweg ab: 130/140mm 8, 150/160mm 7, 170mm 6, 180mm 5", notes_fr: "Entretoises à clipser ; le maximum dépend du débattement : 130/140 mm 8, 150/160 mm 7, 170 mm 6, 180 mm 5", notes_it: "Distanziali a clip; il massimo dipende dall’escursione: 130/140 mm 8, 150/160 mm 7, 170 mm 6, 180 mm 5", notes_es: "Espaciadores de clip; el máximo depende del recorrido: 130/140 mm 8, 150/160 mm 7, 170 mm 6, 180 mm 5", notes_pt: "Espaçadores de encaixe; o máximo depende do curso: 130/140 mm 8, 150/160 mm 7, 170 mm 6, 180 mm 5" }
