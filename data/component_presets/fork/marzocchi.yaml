            note_es: Recorrido reducible en pasos de 10 mm con los espaciadores internos incluidos. Muelles vendidos por separado, identificados por color según el peso del rider (Morado/Azul/Verde/Amarillo ~ Blando/Medio/Firme/X-Firme); Marzocchi no publica la rigidez real en lbs/in de cada color.
            note_pt: Curso ajustável para baixo em passos de 10 mm com os espaçadores internos fornecidos. Molas vendidas separadamente, identificadas por cor conforme o peso do rider (Roxo/Azul/Verde/Amarelo ~ Macia/Média/Firme/X-Firme); a Marzocchi não publica a rigidez real em lbs/in de cada cor.

