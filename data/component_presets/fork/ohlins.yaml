        note_de: |-
          - Dreikammer-Luftfeder: Haupt- und Progressionskammer werden getrennt aufgepumpt
          - Offsets gibt es auch in den Versionen mit langer Brücke „44L“ und „51L“
          - Empfohlener SAG sind 10-15 % des Federwegs bei Luft, 15-20 % bei Stahlfeder
        note_fr: |-
          - Ressort pneumatique à trois chambres : principale et progressive se gonflent séparément
          - Les déports existent aussi en versions à long té « 44L » et « 51L »
          - Le SAG recommandé est de 10-15 % du débattement en pneumatique, 15-20 % en ressort
        note_it: |-
          - Molla pneumatica a tre camere: principale e progressiva si gonfiano separatamente
          - Gli offset sono disponibili anche nelle versioni a piastra lunga «44L» e «51L»
          - Il SAG consigliato è del 10-15 % dell’escursione con la molla pneumatica, del 15-20 % con quella a molla
        note_es: |-
          - Muelle neumático de tres cámaras: la principal y la progresiva se inflan por separado
          - Los offsets también existen en versiones de corona larga «44L» y «51L»
          - El SAG recomendado es del 10-15 % del recorrido con aire y del 15-20 % con muelle
        note_pt: |-
          - Mola a ar de três câmaras: a principal e a progressiva são enchidas separadamente
          - Os offsets também existem em versões de coroa longa “44L” e “51L”
          - O SAG recomendado é de 10-15 % do curso com ar e de 15-20 % com mola
