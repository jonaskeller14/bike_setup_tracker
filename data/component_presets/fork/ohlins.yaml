# Öhlins mountain-bike forks — adjustment preset database
#
# Same design as fork/fox.yaml: click ranges belong to the DAMPER cartridge,
# defined once under `option_values.damper` and referenced by id from each fork's trims.
# See SCHEMA.md in this folder.
#
# Öhlins itself versions dampers/forks with "m.1"/"m.2"/"m.3" suffixes, and
# those generations have genuinely different click counts. The suffix IS the
# user-facing distinguishing name, so it is a `version` level of its own below
# the model (RXF36 › m.3) instead of a `generation` named after its years.
# Each version therefore also gets its own damper id; nothing is inherited
# from a sibling version on the assumption that the cartridge is shared.

brand: Öhlins
component_type: fork
sources:
  - https://www.ohlins.eu/de/products/mountainbike/mtb-forks/
  - https://www.ohlins.eu/en/products/mountainbike/rxc34-m1-air-otx14-r--7692/
  - https://www.ohlins.eu/en/products/mountainbike/rxf34-m2-air-otx18-29--7685/
  - https://www.ohlins.eu/de/products/mountainbike/rxf36-m2-air-ttx18-275--7698/
  - https://www.ohlins.eu/en/products/mountainbike/rxf36-m3-air-ttx18-275--7696/
  - https://www.ohlins.eu/en/products/mountainbike/rxf38-m2-air-ttx18-29--7694/
  - https://www.ohlins.eu/en/products/mountainbike/rxf38-m3-air-coil-ttx18--7748/
  - https://www.ohlins.eu/en/products/mountainbike/dh38-m1-downhill-front-fork--7683/
  - https://www.ohlins.eu/en/products/mountainbike/dh38-m2-air-coil-downhill--7747/
  - https://www.ohlins.eu/de/products/mountainbike/rxfdj-m1-air-26-dirt--7687/
  # Öhlins owner's manuals (PDF) — air/coil spring chapters and TTX18 setup chapters
  - https://ohlins.com/storage/9C8C7FB7E305B5CED4AFC6118547113286CF63B94F14ADAB8050C2CFEA78FF38/dcb2294119c04b8da8dd7613ae7db28f/pdf/media/60aa019099bd416e8b0207e44ee4a2ac/OM_07258-09_3_FGxx%2038xx%2021xx.pdf
  - https://ohlins.com/storage/4D81EA83A21214EDFB4A57331844F3692B56F2CCA1ED9BD1BE95A5CDFE6D1B1E/9bd7e6402a3e42ff93f357c6b15e645b/pdf/media/0377e17f271d4af39560e027d515d36d/Owners%20manual%20RXF38%20m.2.pdf
  - https://www.ohlins.com/en-us/document-library
  - https://www.ohlins.eu/download/db/Ohlins_DTC_owners-manual-rxf36-m3--00004297.pdf
  # Editorial, used only for dialColor/dialSize (adjuster knob color/size), never for click counts
  - https://www.bikeperfect.com/reviews/ohlins-rxf34-m2-review
  - https://www.pinkbike.com/news/review-ohlins-rxf36-m2-trail-fork.html
  # Primary — service intervals
  - https://ohlins.com/storage/F1FD2667BEF6A26936BBE79CBD7BC4023A47B74CEF08518C26294D2B1AFF0A33/24e7fcb03154439ea9ae0b6150bcede7/pdf/media/55239c8bd8da48c19d511823f9b1c5c6/OM_07258-12_4_RXF36%20m3%20air%20front%20fork.pdf
  - https://ohlins.com/storage/B799A00056AAEF9DE3E7BAB002F50562A6D1BA21B2998148273DF3D42E6199C0/4def7de90bca493cb2a999f99d34bdbf/pdf/media/fe3f1b241587489f98caf3f73ccd9139/OM_07258-07_7_MI_RXF36_m.2_AirCoil_TTX18.pdf
  # Primary - owner's manuals used for volume spacers, setup tables and coil spring rates
  - https://www.ohlins.com/storage/B9AC95E58353CFA82EC9840F30F16E6AD76B61BF05DB8A5B7CDE65BC9E15C8D0/469d00f818d54e0ca34230baa6eaa34e/pdf/media/fa74b243c1a34513a89ddb391dd8a5c7/Owners%20manual%20RXF34%20m2.pdf
  - https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-rxc34-m1--00003982.pdf
  - https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-federgabel-rxf36--00003012.pdf
  - https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-federgabel-rxf36--00004180.pdf
  - https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-federgabel-rxf38--00003536.pdf
  - https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-federgabel-rxf38--00004275.pdf
  - https://ohlins.pl/sites/default/files/mtb_rxf34_rxf36_27.5-29-1.pdf
  - https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-doppelbrueckengabel-dh38--00002991.pdf
  - https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-downhillgabel-dh38--00004274.pdf
  - https://www.ohlins.eu/de/products/mountainbike/mtb-forks/?show_unavailable=1
  # Editorial, used only for the RXC34 m.1 rebound and low-speed compression totals
  - https://www.ambmag.com.au/feature/ohlins-xc-suspension-review
updated: 2026-10-13
# Service intervals (`tasks`) come from the maintenance table that every
# Öhlins fork owner's manual cited above shares: lower legs every 50 hours,
# and the air spring, lower-leg seals and damping cartridge every 100 hours or
# once a year. The RXF DJ has no published manual, so it keeps the generic
# templates.
#
# Click ranges taken from the individual product pages at ohlins.eu plus the
# Öhlins owner's manuals linked above. Clicks are counted from fully closed
# (firmest) → default `dial_ccw`. Where only a setup table exists, the maximum is
# estimated from it (see SCHEMA.md) and the damper's `note:` says so.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    otx14_r:
      name: OTX14 R
      description: |-
        - XC race cartridge with a three-position lever: Open, Pedal and Lockout
        - Rebound, low-speed and high-speed compression each get their own dial
      adjustments:
        - { name: HSC, type: step, max: ~, notes: High-Speed Compression }
        - { name: LSC, type: step, max: 10, notes: "Low-Speed Compression; manual-lever version" }
        - { name: Rebound, type: step, max: 12 }
        - { name: Ride Mode, type: categorical, options: [Open, Pedal, Lockout], notes: "Crown lever or bar remote; 7.5mm cable pull per click, 5.5mm/click adapter available" }
      source:
        - https://www.ohlins.eu/en/products/mountainbike/rxc34-m1-air-otx14-r--7692/
        - https://www.ambmag.com.au/feature/ohlins-xc-suspension-review
      note: >-
        RXC34 m.1 page lists "3 Ride Modes: open, pedal, lockout", "Lockout
        Funktion (7,5 mm per Klick)" and "Getrennt einstellbare Zug- und
        Druckstufendämpfung", but no click totals, and the RXC34 manual
        (00003982) gives none either. Secondary (tier 2): the AMB article body
        says the remote version is "limited to the 3 modes of compression damping
        and 12 clicks of rebound, while the non-remote version sees an added 10
        clicks of low-speed compression". Rebound 12 and LSC 10 come from that
        text; retailer listings quote 16 rebound clicks, which is not used. No
        source gives a high-speed compression total, so HSC carries `max: ~`.

    otx18:
      name: OTX18
      description: |-
        - Trail/downcountry cartridge; damping and air spring live in opposite legs
        - High-speed compression is a three-position dial, 0 being fully closed
        - Every click is counted from fully closed, opening counter-clockwise
      adjustments:
        - { name: HSC, type: step, max: 2, notes: High-Speed Compression, dialColor: grey }
        - { name: LSC, type: step, max: 15, notes: Low-Speed Compression, dialColor: blue, dialSize: small }
        - { name: Rebound, type: step, max: 15, dialColor: orange }
      source:
        - https://www.ohlins.eu/en/products/mountainbike/rxf34-m2-air-otx18-29--7685/
        - https://www.ohlins.com/storage/B9AC95E58353CFA82EC9840F30F16E6AD76B61BF05DB8A5B7CDE65BC9E15C8D0/469d00f818d54e0ca34230baa6eaa34e/pdf/media/fa74b243c1a34513a89ddb391dd8a5c7/Owners%20manual%20RXF34%20m2.pdf
      note: >-
        RXF34 m.2 page: "3-fach High-Speed Druckstufeneinstellung", "15-fach
        Low-Speed Druckstufeneinstellung", "15-fach Zugstufeneinstellung". The
        owner's manual, chapter "4 OTX 18 SETUP", reads "The high speed adjuster
        has three positions. When the adjuster is fully closed it has position 0
        [zero] and when the adjuster is fully open it has position 2", so HSC is
        0-2 here (the TTX18's is 0-3). If the page's "3-fach" counts positions
        rather than clicks, both agree.

    ttx18_m2:
      name: TTX18 (m.2 generation)
      description: |-
        - Twin-tube trail/enduro cartridge, m.2 generation
        - High-speed compression is a four-position dial; 0 is a firm climb platform
        - Every click is counted from fully closed, opening counter-clockwise
      adjustments:
        - { name: HSC, type: step, max: 3, notes: "High-Speed Compression; position 0 is the firm climb platform", dialColor: grey }
        - { name: LSC, type: step, max: 16, notes: Low-Speed Compression, dialColor: blue, dialSize: small }
        - { name: Rebound, type: step, max: 16, dialColor: orange }
      source:
        - https://www.ohlins.eu/de/products/mountainbike/rxf36-m2-air-ttx18-275--7698/
        - https://www.ohlins.eu/en/products/mountainbike/rxf38-m2-air-ttx18-29--7694/
      note: >-
        RXF38 m.2 page: "15-fach Low-Speed Druckstufenverstellung", "15-fach
        Zugstufenverstellung", "3-fach High-Speed Druckstufenverstellung". The
        RXF36 m.2 owner's manual (07258-07_7, setup data p. 13) recommends 14-16
        clicks of rebound and low-speed compression from closed, so LSC and
        Rebound are 16: the pages' "15-fach" reads as 15 steps between 16
        positions or undercounts by one.

    ttx18_m3:
      name: TTX18 (m.3 generation)
      description: |-
        - Twin-tube trail/enduro/DH cartridge, m.3 generation, with reworked internals
        - Reworked internals over the m.2 cartridge
        - Every click is counted from fully closed, opening counter-clockwise
      adjustments:
        - { name: HSC, type: step, max: 3, notes: High-Speed Compression, dialColor: grey }
        - { name: LSC, type: step, max: 16, notes: Low-Speed Compression, dialColor: blue, dialSize: small }
        - { name: Rebound, type: step, max: 16, dialColor: orange }
      source:
        - https://www.ohlins.eu/en/products/mountainbike/rxf36-m3-air-ttx18-275--7696/
        - https://www.ohlins.eu/en/products/mountainbike/rxf38-m3-air-coil-ttx18--7748/
        - https://www.ohlins.eu/en/products/mountainbike/dh38-m2-air-coil-downhill--7747/
      note: >-
        16/16/3 stated independently on all three m.3-generation pages, e.g. DH38
        m.2: "16 Klicks für Low-Speed-Compression", "3 Klicks für High-Speed-
        Compression", "16 Klicks für Rebound".

    ttx18_rxf38_m1:
      name: TTX18 (RXF38 m.1)
      description: |-
        - Twin-tube cartridge of the first-generation RXF38
        - High-speed compression is a four-position dial, shipped fully open at 3
      adjustments:
        - { name: HSC, type: step, max: 3, notes: "High-Speed Compression; 0 is fully closed, 3 fully open", dialColor: grey }
        - { name: LSC, type: step, max: ~, notes: Low-Speed Compression }
        - { name: Rebound, type: step, max: ~ }
      source: https://ohlins.com/storage/9C8C7FB7E305B5CED4AFC6118547113286CF63B94F14ADAB8050C2CFEA78FF38/dcb2294119c04b8da8dd7613ae7db28f/pdf/media/60aa019099bd416e8b0207e44ee4a2ac/OM_07258-09_3_FGxx%2038xx%2021xx.pdf
      note: >-
        Owner's Manual RXF38 m.1 (part no. OM_07258-09_3), chapter "4 TTX18
        SETUP", p. 13: "The high speed adjuster has four positions ... position 0
        [zero] ... position 3." That manual states no click totals for low-speed
        compression or rebound, so those two carry `max: ~` rather than the
        m.2 cartridge's numbers.

    ttx22_fork:
      name: TTX22 (fork cartridge)
      description: |-
        - Twin-tube cartridge of the original RXF34/RXF36, opposite the air spring
        - High-speed compression runs 0 fully closed to 5 fully open, shipped at 5
      adjustments:
        - { name: HSC, type: step, max: 5, notes: "High-Speed Compression; 0 is fully closed, 5 fully open" }
        - { name: LSC, type: step, max: 8, notes: "Low-Speed Compression; estimated maximum, check your dial and edit it if it differs" }
        - { name: Rebound, type: step, max: 8, notes: "Low-Speed Rebound; estimated maximum, check your dial and edit it if it differs" }
      source: https://ohlins.pl/sites/default/files/mtb_rxf34_rxf36_27.5-29-1.pdf
      note: >-
        Öhlins "Front Fork RXF34/RXF36 Owner's Manual / Mounting Instructions",
        chapter "SETTING UP TTX22", p. 10/16: "When the adjuster is fully closed
        it has position 0 [zero] and when the adjuster is fully open it has
        position 5." The same paragraph also calls it "five positions"; the
        explicit 0-5 endpoints are taken as written and the wording conflict is
        left standing rather than resolved by picking a number. That manual
        states no totals for low-speed compression or rebound. Estimate: its
        "SETUP DATA" table (p. 13/16) lists Rebound 7-8 clicks and Compression
        low 7-8 clicks, counted from fully closed (turn clockwise to closed, then
        count clicks open), so both are set to 8, the table's highest value; the
        true totals may be higher. PDF is the Öhlins document hosted by the
        Öhlins Poland importer — ohlins.com no longer publishes this generation.

    stx22_fork:
      name: STX22 (fork cartridge)
      description: |-
        - Simpler cartridge sold alongside the TTX22 in the original RXF36
        - Low-speed compression and rebound only, both shipped at 7 clicks from closed
      adjustments:
        - { name: Compression, type: step, max: 8, notes: "Low-Speed Compression; estimated maximum, check your dial and edit it if it differs" }
        - { name: Rebound, type: step, max: 8, notes: "Low-Speed Rebound; estimated maximum, check your dial and edit it if it differs" }
      source: https://ohlins.pl/sites/default/files/mtb_rxf34_rxf36_27.5-29-1.pdf
      note: >-
        Same manual, chapter "SETTING UP STX22", p. 11/16: "The front forks are
        delivered with the low speed compression and rebound adjuster at 7
        clicks." That is a delivery setting, not a maximum. Estimate: the "SETUP
        DATA" table (p. 13/16) lists the RXF36 STX22 at Rebound 7-8 clicks and
        Compression low 7-8 clicks, counted from fully closed, so both are set to
        8, the table's highest value; the true totals may be higher. The chapter
        describes no high-speed compression adjuster on this cartridge.

    ttx18_dh38_m1:
      name: TTX18 (DH38 m.1)
      description: |-
        - Twin-tube downhill cartridge of the first-generation DH38
        - High-speed compression is a four-position dial
        - Every click is counted from fully closed, opening counter-clockwise
      adjustments:
        - { name: HSC, type: step, max: 3, notes: High-Speed Compression, dialColor: grey }
        - { name: LSC, type: step, max: 15, notes: Low-Speed Compression, dialColor: blue, dialSize: small }
        - { name: Rebound, type: step, max: 15, dialColor: orange }
      source: https://www.ohlins.eu/en/products/mountainbike/dh38-m1-downhill-front-fork--7683/
      note: >-
        Read off the DH38 m.1's own page ("15-fach Zugstufenverstellung",
        "15-fach Low-Speed Druckstufenverstellung", "3-fach High-Speed
        Druckstufenverstellung"), not inherited from the DH38 m.2 — it happens to
        match the m.2-generation TTX18 table, but the DH38 m.2 itself is 16/16/3.

# --------------------------------------------------------------------------
# Setup guides — transcribed from docs/research/setup_guides/ohlins.md.
#   * Pressure: the owner's manuals print a psi band per rider-weight bracket
#     (kg, lb also printed), one per chamber on the two-chamber forks. Riders
#     outside the printed 50-120 kg get no pressure value.
#   * Clicks: the "setup data" base tunes (`14-16 clicks`) are counted from
#     closed like every catalog dial here, so they are encoded as published.
#     HSC values are the delivery positions the manuals state.
#   * Coil charts give one rider weight per spring; spring rates take the
#     nearest point and never interpolate.
#   * The manuals' Performance Suspension Guide (bike-specific base settings)
#     is keyed by bike model, not by rider data, and is not encoded.
# --------------------------------------------------------------------------
guides:
  ohlins_rxc34_m1_2023:
    label: Öhlins RXC34 m.1 owner's manual (2023)
    source: https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-rxc34-m1--00003982.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          50-55: [58, 73], 55-60: [63, 77], 60-65: [67, 82], 65-70: [72, 86],
          70-75: [76, 91], 75-80: [81, 95], 80-85: [85, 100], 85-90: [90, 104],
          90-95: [94, 109], 95-100: [99, 113], 100-105: [103, 118], 105-110: [108, 122],
          110-115: [112, 127], 115-120: [117, 131]
        }
        note: Check the pressure label on the fork as well
      - &ohlins_sag_15_25 { target: sag, range: [15, 25], comfort_at: max }
      # Positive-chamber spacers (8 ml). The 130 mm row has no catalog travel;
      # the negative-chamber spacers (4 × 1 ml) have no catalog adjuster.
      - target: volume_spacers
        input: travel_mm
        rows: { 100: 1, 110: 3, 120: 2 }

  ohlins_rxf34_m2_2026:
    label: Öhlins RXF34 m.2 owner's manual (2026)
    source: https://www.ohlins.com/storage/B9AC95E58353CFA82EC9840F30F16E6AD76B61BF05DB8A5B7CDE65BC9E15C8D0/469d00f818d54e0ca34230baa6eaa34e/pdf/media/fa74b243c1a34513a89ddb391dd8a5c7/Owners%20manual%20RXF34%20m2.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          50-55: [48, 63], 55-60: [53, 67], 60-65: [57, 72], 65-70: [62, 76],
          70-75: [66, 81], 75-80: [71, 85], 80-85: [75, 90], 85-90: [80, 94],
          90-95: [84, 99], 95-100: [89, 103], 100-105: [93, 108], 105-110: [98, 112],
          110-115: [102, 117], 115-120: [107, 121]
        }
      - { target: hsc, value: 2, note: "Delivery setting, fully open" }
      - *ohlins_sag_15_25
      # The chart of forks with a 140 mm maximum travel, the only one covering
      # every catalog travel; forks with a 130 mm maximum take one spacer fewer.
      - target: volume_spacers
        input: travel_mm
        rows: { 120: 5, 130: 4, 140: 3 }
        note: One spacer fewer on forks with a 130 mm maximum travel

  ohlins_rxf34_rxf36_m1:
    label: Öhlins RXF34/RXF36 owner's manual
    source: https://ohlins.pl/sites/default/files/mtb_rxf34_rxf36_27.5-29-1.pdf
    rules:
      - target: main_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          50-60: [80, 90], 60-70: [90, 100], 70-80: [100, 110], 80-90: [110, 120],
          90-100: [120, 130], 100-110: [130, 140], 110-120: [140, 150]
        }
      - target: ramp_up_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: &ohlins_ramp_up {
          50-60: [160, 170], 60-70: [170, 180], 70-80: [180, 190], 80-90: [190, 200],
          90-100: [200, 210], 100-110: [210, 220], 110-120: [220, 230]
        }
      - { target: rebound, range: [7, 8] }
      - { target: lsc, range: [7, 8], when: { damper: ttx22_fork } }
      - { target: compression, range: [7, 8], when: { damper: stx22_fork } }
      # The setup data's TTX22 "Compression high 7-8 clicks" contradicts the
      # 0-5 dial the same manual describes, so only the delivery position is
      # encoded. The STX22's delivery 7 clicks sit inside the 7-8 base tune.
      - { target: hsc, value: 5, when: { damper: ttx22_fork }, note: "Delivery setting, fully open" }
      - { target: sag, range: [10, 15], comfort_at: max }

  ohlins_rxf36_m2_2023:
    label: Öhlins RXF36 m.2 owner's manual (2023)
    source: https://ohlins.com/storage/B799A00056AAEF9DE3E7BAB002F50562A6D1BA21B2998148273DF3D42E6199C0/4def7de90bca493cb2a999f99d34bdbf/pdf/media/fe3f1b241587489f98caf3f73ccd9139/OM_07258-07_7_MI_RXF36_m.2_AirCoil_TTX18.pdf
    rules:
      - &ohlins_main_chamber
        target: main_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          50-60: [70, 80], 60-70: [80, 90], 70-80: [90, 100], 80-90: [100, 110],
          90-100: [110, 120], 100-110: [120, 130], 110-120: [130, 140]
        }
      - &ohlins_ramp_up_chamber
        target: ramp_up_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: *ohlins_ramp_up
      - &ohlins_ttx18_rebound { target: rebound, range: [14, 16] }
      - &ohlins_ttx18_lsc { target: lsc, range: [14, 16] }
      - &ohlins_ttx18_hsc { target: hsc, value: 3, note: "Delivery setting, fully open" }
      # The coil chart lists springs by travel, not by rider weight, so only
      # the factory spring is encoded.
      - { target: spring_rate, unit: N/mm, value: 9.7, when: { trim: coil }, note: The spring fitted at the factory }
      - { target: sag, range: [10, 15], comfort_at: max, when: { trim: air-ttx18 } }
      - &ohlins_coil_sag { target: sag, range: [15, 20], comfort_at: max, when: { trim: coil }, note: Set the preload knob to minimum first }

  # Edition 07258-12_2, the only RXF36 m.3 edition with a setup-data click table.
  ohlins_rxf36_m3_2023:
    label: Öhlins RXF36 m.3 owner's manual (2023)
    source: https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-federgabel-rxf36--00004180.pdf
    rules:
      - *ohlins_main_chamber
      - *ohlins_ramp_up_chamber
      - *ohlins_ttx18_rebound
      - *ohlins_ttx18_lsc
      - *ohlins_ttx18_hsc
      - &ohlins_air_sag { target: sag, range: [10, 15], comfort_at: max }

  ohlins_rxf36_m3_2026:
    label: Öhlins RXF36 m.3 owner's manual (2026)
    source: https://ohlins.com/storage/F1FD2667BEF6A26936BBE79CBD7BC4023A47B74CEF08518C26294D2B1AFF0A33/24e7fcb03154439ea9ae0b6150bcede7/pdf/media/55239c8bd8da48c19d511823f9b1c5c6/OM_07258-12_4_RXF36%20m3%20air%20front%20fork.pdf
    rules:
      - &ohlins_coil_chart
        target: spring_rate
        unit: N/mm
        input: rider_weight
        input_unit: kg
        rows: { 55: 7.0, 64: 7.9, 72: 8.8, 82: 9.7, 91: 10.6, 100: 11.5, 109: 12.4 }
      - *ohlins_ttx18_hsc
      - *ohlins_coil_sag

  # The 2024 edition adds the coil chart; the delivery HSC position is stated
  # in the 2021 air edition, the m.2's `setup_guide`.
  ohlins_rxf38_m2_2024:
    label: Öhlins RXF38 m.2 owner's manual (2024)
    source: https://ohlins.com/storage/4D81EA83A21214EDFB4A57331844F3692B56F2CCA1ED9BD1BE95A5CDFE6D1B1E/9bd7e6402a3e42ff93f357c6b15e645b/pdf/media/0377e17f271d4af39560e027d515d36d/Owners%20manual%20RXF38%20m.2.pdf
    rules:
      - *ohlins_main_chamber
      - *ohlins_ramp_up_chamber
      - *ohlins_ttx18_hsc
      - *ohlins_coil_chart
      - &ohlins_rxf38_air_sag { target: sag, range: [10, 15], comfort_at: max, when: { trim: air } }
      - *ohlins_coil_sag

  # Same tables as the m.2; this edition states no delivery HSC position.
  ohlins_rxf38_m3_2025:
    label: Öhlins RXF38 m.3 owner's manual (2025)
    source: https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-federgabel-rxf38--00004275.pdf
    rules:
      - *ohlins_main_chamber
      - *ohlins_ramp_up_chamber
      - *ohlins_coil_chart
      - *ohlins_rxf38_air_sag
      - *ohlins_coil_sag

  # The DH38 manuals describe a main and a ramp-up chamber but print no
  # pressure table, and give no click recommendations.
  ohlins_dh38_m1_2020:
    label: Öhlins DH38 m.1 owner's manual (2020)
    source: https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-doppelbrueckengabel-dh38--00002991.pdf
    rules:
      - &ohlins_dh38_air_sag { target: sag, range: [20, 25], comfort_at: max, when: { trim: air } }

  ohlins_dh38_m2_2025:
    label: Öhlins DH38 m.2 owner's manual (2025)
    source: https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-downhillgabel-dh38--00004274.pdf
    rules:
      # The 8.8 N/mm spring reads 73 kg here, 72 kg in the RXF36/RXF38 charts.
      - target: spring_rate
        unit: N/mm
        input: rider_weight
        input_unit: kg
        when: { trim: coil }
        rows: { 55: 7.0, 64: 7.9, 73: 8.8, 82: 9.7, 91: 10.6, 100: 11.5, 109: 12.4 }
      - *ohlins_dh38_air_sag
      - *ohlins_coil_sag

# --------------------------------------------------------------------------
# Forks — current Öhlins MTB lineup plus sourceable earlier generations.
# The RXF34 m.1, RXF36, RXF38 and DH38 have a separately pumped main and
# ramp-up chamber, so they share the `&dual_chamber_air` anchor; the RXC34,
# RXF34 m.2 and RXFDJ list a single Pressure. Coil trims list a Spring Rate
# in N/mm, the unit Öhlins stamps on its MTB coil springs.
# Volume Spacers are listed where an owner's manual publishes the maximum (RXC34
# m.1, RXF34 m.2). The RXF36/RXF38/DH38 manuals describe no spacer system; they
# tune progression with the pressurised ramp-up chamber instead.
# --------------------------------------------------------------------------
nodes:
  - label: RXC34
    level: model
    category: XC
    tasks: &ohlins_service
      fork:lower_leg_service: { interval: { moving_time_h: 50 }, source: Öhlins owner's manual }
      fork:full_service: { interval: { moving_time_h: 100 }, fallback: { days: 365 }, source: Öhlins owner's manual }
    children:
      - label: m.1
        level: version
        id: m1
        years: "2025-2026"
        url: https://www.ohlins.eu/de/products/mountainbike/rxc34-m1-air-otx14-r--7692/
        setup_guide: https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-rxc34-m1--00003982.pdf
        guide: ohlins_rxc34_m1_2023
        note: |-
          - Two-chamber air spring, 29" only, from 1496g
          - Floating axle design lets the lowers settle before the axle is clamped
        children:
          - label: Aluminum (remote)
            level: trim
            specs: { spring: Air }
            adjustments: &rxc34_air_spring
              - { name: Pressure, type: numerical, unit: psi, min: 0 }
              - { name: Volume Spacers, type: step, max: 5, visualization: stepper, notes: "8 ml spacers in the positive chamber. Maximum depends on the travel: 100 mm 4, 110 mm 5, 120 mm 5" }
            options:
              damper: [otx14_r]
              travel_mm: [100, 110, 120]
              wheel_size: [29]
          - label: Carbon crown (remote)
            level: trim
            specs: { spring: Air }
            adjustments: *rxc34_air_spring
            options:
              damper: [otx14_r]
              travel_mm: [100, 110, 120]
              wheel_size: [29]
          - label: Carbon crown (manual)
            level: trim
            specs: { spring: Air }
            adjustments: *rxc34_air_spring
            options:
              damper: [otx14_r]
              travel_mm: [100, 110, 120]
              wheel_size: [29]

  - label: RXF34
    level: model
    category: Downcountry / Trail
    tasks: *ohlins_service
    children:
      - label: m.2
        level: version
        id: m2
        years: "2025-2026"
        url: https://www.ohlins.eu/de/products/mountainbike/rxf34-m2-air-otx18-29--7685/
        setup_guide: https://www.ohlins.com/storage/B9AC95E58353CFA82EC9840F30F16E6AD76B61BF05DB8A5B7CDE65BC9E15C8D0/469d00f818d54e0ca34230baa6eaa34e/pdf/media/fa74b243c1a34513a89ddb391dd8a5c7/Owners%20manual%20RXF34%20m2.pdf
        guide: ohlins_rxf34_m2_2026
        children:
          - label: Air OTX18
            level: trim
            specs: { spring: Air }
            offset_mm: [44]
            adjustments:
              - { name: Pressure, type: numerical, unit: psi, min: 0 }
              - { name: Volume Spacers, type: step, max: 7, visualization: stepper, notes: "8 ml spacers in the top cap. Maximum depends on the travel: 120 mm 7, 130 mm 6, 140 mm 5 (one fewer on 120 and 130 mm forks sold with a 130 mm maximum)" }
            options:
              damper: [otx18]
              travel_mm: [120, 130, 140]
              wheel_size: [29]
            note: Air-spring progression is tuned with volume spacers; from 1698g without one.
      - label: m.1
        level: version
        id: m1
        url: https://ohlins.pl/sites/default/files/mtb_rxf34_rxf36_27.5-29-1.pdf   # owner's manual, no product page
        guide: ohlins_rxf34_rxf36_m1
        children:
          - label: Air TTX22
            level: trim
            specs: { spring: Air }
            adjustments: &dual_chamber_air
              - { name: Main Chamber Pressure, type: numerical, unit: psi, min: 0 }
              - { name: Ramp-up Chamber Pressure, type: numerical, unit: psi, min: 0 }
            options:
              damper: [ttx22_fork]
              travel_mm: [120, 140, 160]
              wheel_size: [29]

  - label: RXF36
    level: model
    category: Trail
    tasks: *ohlins_service
    children:
      - label: m.2
        level: version
        id: m2
        years: "2025-2026"
        url: https://www.ohlins.eu/de/products/mountainbike/rxf36-m2-air-ttx18-275--7698/
        setup_guide: https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-federgabel-rxf36--00003012.pdf
        guide: ohlins_rxf36_m2_2023
        children:
          - label: Air TTX18
            level: trim
            specs: { spring: Air }
            offset_mm: [38, 44, 51]
            adjustments: *dual_chamber_air
            options:
              damper: [ttx18_m2]
              travel_mm: [140, 150, 160, 170]
              wheel_size: [29, 27.5]
          - label: Coil
            level: trim
            # Spring rate chart and strokes: Owner's Manual RXF36 m.2 (00003012), pp. 8 and 13
            specs: { spring: Coil }
            adjustments: &coil_spring
              - { name: Spring Rate, type: numerical, unit: N/mm, min: 0 }
              - { name: Preload, type: numerical, unit: turns, min: 0 }
            options:
              damper: [ttx18_m2]
              travel_mm: [120, 130, 140, 150, 160, 165]
              wheel_size: [29, 27.5]
            note: |-
              - Coil springs run 6.1 to 11.5 N/mm in seven steps, colour-coded on the tube
              - The longest strokes are limited by the heaviest springs and by added preload
              - Set the preload knob to minimum, then dial in 15-20% sag
      - label: m.3
        level: version
        id: m3
        years: "2025-2026"
        url: https://www.ohlins.eu/de/products/mountainbike/rxf36-m3-air-ttx18-275--7696/
        setup_guide: https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-federgabel-rxf36--00004180.pdf
        children:
          - label: Air TTX18
            level: trim
            specs: { spring: Air }
            offset_mm: [38, 44, 51]
            guide: ohlins_rxf36_m3_2023
            adjustments: *dual_chamber_air
            options:
              damper: [ttx18_m3]
              travel_mm: [140, 150, 160, 170]   # 140-160mm on 29", up to 170mm on 27.5"
              wheel_size: [29, 27.5]
          - label: Coil
            level: trim
            url: https://www.ohlins.eu/de/products/mountainbike/rxf36-m3-coil--6430/
            setup_guide: https://www.ohlins.eu/download/db/Ohlins_DTC_owners-manual-rxf36-m3--00004297.pdf
            guide: ohlins_rxf36_m3_2026
            specs: { spring: Coil }
            adjustments: *coil_spring
            options:
              damper: [ttx18_m3]
              travel_mm: [160]
              wheel_size: [29]
      - label: m.1
        level: version
        id: m1
        url: https://ohlins.pl/sites/default/files/mtb_rxf34_rxf36_27.5-29-1.pdf   # owner's manual, no product page
        guide: ohlins_rxf34_rxf36_m1
        note: |-
          - Original RXF36 chassis, sold with the TTX22 or the simpler STX22 damper
          - Strokes from 120mm (29") or 140mm (27.5") up to 170mm
        children:
          - label: Air TTX22
            level: trim
            specs: { spring: Air }
            adjustments: *dual_chamber_air
            options:
              damper: [ttx22_fork]
              travel_mm: [120, 140, 150, 160, 170]   # 29": 120/140/150/160, 27.5": 140/150/160/170
              wheel_size: [29, 27.5]
          - label: Air STX22
            level: trim
            specs: { spring: Air }
            adjustments: *dual_chamber_air
            options:
              damper: [stx22_fork]
              travel_mm: [150, 160, 170]   # 29": 150/160, 27.5": 150/170
              wheel_size: [29, 27.5]

  - label: RXF38
