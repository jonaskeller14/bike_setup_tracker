  - https://www.ambmag.com.au/feature/ohlins-xc-suspension-review
updated: 2026-10-13
# Service intervals (`tasks`) come from the maintenance table that every
# Öhlins fork owner's manual cited above shares: lower legs every 50 hours,
# and the air spring, lower-leg seals and damping cartridge every 100 hours or
# once a year. The RXF DJ has no published manual, so it keeps the generic
# templates.
#
# Click ranges taken from the individual product pages at ohlins.eu plus the
# Öhlins owner's manuals linked above. Clicks are counted from fully closed
# (firmest) → default `dial_ccw`. Where only a setup table exists, the maximum is
# estimated from it (see SCHEMA.md) and the damper's `note:` says so.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    otx14_r:
      name: OTX14 R
      description: |-
        - XC race cartridge with a three-position lever: Open, Pedal and Lockout
        - Rebound, low-speed and high-speed compression each get their own dial
      description_de: |-
        - XC-Rennkartusche mit Drei-Positionen-Hebel: Open, Pedal und Lockout
        - Zugstufe, Low-Speed- und High-Speed-Druckstufe haben jeweils ein eigenes Rad
      description_fr: |-
        - Cartouche de course XC avec un levier à trois positions : Open, Pedal et Lockout
        - La détente, la compression basse vitesse et la compression haute vitesse ont chacune leur propre molette
      description_it: |-
        - Cartuccia da gara XC con una leva a tre posizioni: Open, Pedal e Lockout
        - Ritorno, compressione a bassa velocità e compressione ad alta velocità hanno ciascuno la propria manopola
      description_es: |-
        - Cartucho de competición XC con una palanca de tres posiciones: Open, Pedal y Lockout
        - El rebote, la compresión de baja velocidad y la de alta velocidad tienen cada uno su propia rueda
      description_pt: |-
        - Cartucho de competição XC com uma alavanca de três posições: Open, Pedal e Lockout
        - O retorno, a compressão de baixa velocidade e a de alta velocidade têm cada um o seu próprio seletor
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: ~, notes: High-Speed Compression, notes_de: High-Speed-Druckstufe, notes_fr: Compression haute vitesse, notes_it: Compressione ad alta velocità, notes_es: Compresión de alta velocidad, notes_pt: Compressão de alta velocidade }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 10, notes: "Low-Speed Compression; manual-lever version", notes_de: Low-Speed-Druckstufe; Version mit manuellem Hebel, notes_fr: Compression basse vitesse ; version à levier manuel, notes_it: Compressione a bassa velocità; versione con leva manuale, notes_es: Compresión de baja velocidad; versión de palanca manual, notes_pt: Compressão de baixa velocidade; versão com alavanca manual }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 12 }
        - { name: Ride Mode, name_de: Fahrmodus, name_fr: Mode de conduite, name_it: Modalità di guida, name_es: Modo de conducción, name_pt: Modo de pilotagem, type: categorical, options: [Open, Pedal, Lockout], options_de: [Offen, Pedal, Lockout], options_fr: [Ouvert, Pedal, Lockout], options_it: [Aperto, Pedal, Lockout], options_es: [Abierto, Pedal, Lockout], options_pt: [Aberto, Pedal, Lockout], notes: "Crown lever or bar remote; 7.5mm cable pull per click, 5.5mm/click adapter available", notes_de: "Hebel an der Gabelbrücke oder Lenkerfernbedienung; 7,5mm Seilzug pro Klick, Adapter mit 5,5mm/Klick erhältlich", notes_fr: "Levier sur le té ou commande au guidon ; 7,5 mm de course de câble par clic, adaptateur de 5,5 mm/clic disponible", notes_it: "Leva sulla piastra o comando al manubrio; 7,5 mm di corsa del cavo per scatto, adattatore da 5,5 mm/scatto disponibile", notes_es: "Palanca en la corona o mando de manillar; 7,5 mm de recorrido de cable por clic, adaptador de 5,5 mm/clic disponible", notes_pt: "Alavanca na coroa ou comando no guidão; 7,5 mm de puxada de cabo por clique, adaptador de 5,5 mm/clique disponível" }
      source:
        - https://www.ohlins.eu/en/products/mountainbike/rxc34-m1-air-otx14-r--7692/
        - https://www.ambmag.com.au/feature/ohlins-xc-suspension-review
      note: >-
        RXC34 m.1 page lists "3 Ride Modes: open, pedal, lockout", "Lockout
        Funktion (7,5 mm per Klick)" and "Getrennt einstellbare Zug- und
        Druckstufendämpfung", but no click totals, and the RXC34 manual
        (00003982) gives none either. Secondary (tier 2): the AMB article body
        says the remote version is "limited to the 3 modes of compression damping
        and 12 clicks of rebound, while the non-remote version sees an added 10
        clicks of low-speed compression". Rebound 12 and LSC 10 come from that
        text; retailer listings quote 16 rebound clicks, which is not used. No
        source gives a high-speed compression total, so HSC carries `max: ~`.

    otx18:
      name: OTX18
      description: |-
        - Trail/downcountry cartridge; damping and air spring live in opposite legs
        - High-speed compression is a three-position dial, 0 being fully closed
        - Every click is counted from fully closed, opening counter-clockwise
      description_de: |-
        - Trail-/Downcountry-Kartusche; Dämpfung und Luftfeder sitzen in gegenüberliegenden Gabelbeinen
        - Die High-Speed-Druckstufe ist ein Rad mit drei Positionen, 0 ist ganz geschlossen
        - Jeder Klick wird von ganz geschlossen gezählt, Öffnen gegen den Uhrzeigersinn
      description_fr: |-
        - Cartouche trail/downcountry ; l’amortissement et le ressort pneumatique se trouvent dans des jambes opposées
        - La compression haute vitesse est une molette à trois positions, 0 étant entièrement fermé
        - Chaque clic est compté depuis la position entièrement fermée, en ouvrant dans le sens antihoraire
      description_it: |-
        - Cartuccia trail/downcountry; smorzamento e molla pneumatica stanno in steli opposti
        - La compressione ad alta velocità è una manopola a tre posizioni, 0 è completamente chiusa
        - Ogni scatto è contato a partire dalla posizione completamente chiusa, aprendo in senso antiorario
      description_es: |-
        - Cartucho trail/downcountry; la amortiguación y el muelle neumático están en piernas opuestas
        - La compresión de alta velocidad es una rueda de tres posiciones, siendo 0 totalmente cerrada
        - Cada clic se cuenta desde la posición totalmente cerrada, abriendo en sentido antihorario
      description_pt: |-
        - Cartucho trail/downcountry; o amortecimento e a mola a ar ficam em pernas opostas
        - A compressão de alta velocidade é um seletor de três posições, sendo 0 totalmente fechada
        - Cada clique é contado a partir da posição totalmente fechada, abrindo no sentido anti-horário
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 2, notes: High-Speed Compression, notes_de: High-Speed-Druckstufe, notes_fr: Compression haute vitesse, notes_it: Compressione ad alta velocità, notes_es: Compresión de alta velocidad, notes_pt: Compressão de alta velocidade, dialColor: grey }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 15, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade, dialColor: blue, dialSize: small }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 15, dialColor: orange }
      source:
        - https://www.ohlins.eu/en/products/mountainbike/rxf34-m2-air-otx18-29--7685/
        - https://www.ohlins.com/storage/B9AC95E58353CFA82EC9840F30F16E6AD76B61BF05DB8A5B7CDE65BC9E15C8D0/469d00f818d54e0ca34230baa6eaa34e/pdf/media/fa74b243c1a34513a89ddb391dd8a5c7/Owners%20manual%20RXF34%20m2.pdf
      note: >-
        RXF34 m.2 page: "3-fach High-Speed Druckstufeneinstellung", "15-fach
        Low-Speed Druckstufeneinstellung", "15-fach Zugstufeneinstellung". The
        owner's manual, chapter "4 OTX 18 SETUP", reads "The high speed adjuster
        has three positions. When the adjuster is fully closed it has position 0
        [zero] and when the adjuster is fully open it has position 2", so HSC is
        0-2 here (the TTX18's is 0-3). If the page's "3-fach" counts positions
        rather than clicks, both agree.

    ttx18_m2:
      name: TTX18 (m.2 generation)
      description: |-
        - Twin-tube trail/enduro cartridge, m.2 generation
        - High-speed compression is a four-position dial; 0 is a firm climb platform
        - Every click is counted from fully closed, opening counter-clockwise
      description_de: |-
        - Zweirohr-Kartusche für Trail/Enduro, Generation m.2
        - Die High-Speed-Druckstufe ist ein Rad mit vier Positionen; 0 ist eine feste Klettergrundlage (Plattform)
        - Jeder Klick wird von ganz geschlossen gezählt, Öffnen gegen den Uhrzeigersinn
      description_fr: |-
        - Cartouche trail/enduro bitube, génération m.2
        - La compression haute vitesse est une molette à quatre positions ; 0 est une plateforme de montée ferme
        - Chaque clic est compté depuis la position entièrement fermée, en ouvrant dans le sens antihoraire
      description_it: |-
        - Cartuccia trail/enduro bitubo, generazione m.2
        - La compressione ad alta velocità è una manopola a quattro posizioni; 0 è una piattaforma rigida per la salita
        - Ogni scatto è contato a partire dalla posizione completamente chiusa, aprendo in senso antiorario
      description_es: |-
        - Cartucho trail/enduro bitubo, generación m.2
        - La compresión de alta velocidad es una rueda de cuatro posiciones; 0 es una plataforma firme de subida
        - Cada clic se cuenta desde la posición totalmente cerrada, abriendo en sentido antihorario
      description_pt: |-
        - Cartucho trail/enduro bitubo, geração m.2
        - A compressão de alta velocidade é um seletor de quatro posições; 0 é uma plataforma firme de subida
        - Cada clique é contado a partir da posição totalmente fechada, abrindo no sentido anti-horário
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 3, notes: "High-Speed Compression; position 0 is the firm climb platform", notes_de: High-Speed-Druckstufe; Position 0 ist die feste Klettergrundlage (Plattform), notes_fr: Compression haute vitesse ; la position 0 est la plateforme de montée ferme, notes_it: Compressione ad alta velocità; la posizione 0 è la piattaforma rigida per la salita, notes_es: Compresión de alta velocidad; la posición 0 es la plataforma firme de subida, notes_pt: Compressão de alta velocidade; a posição 0 é a plataforma firme de subida, dialColor: grey }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 16, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade, dialColor: blue, dialSize: small }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 16, dialColor: orange }
      source:
        - https://www.ohlins.eu/de/products/mountainbike/rxf36-m2-air-ttx18-275--7698/
        - https://www.ohlins.eu/en/products/mountainbike/rxf38-m2-air-ttx18-29--7694/
      note: >-
        RXF38 m.2 page: "15-fach Low-Speed Druckstufenverstellung", "15-fach
        Zugstufenverstellung", "3-fach High-Speed Druckstufenverstellung". The
