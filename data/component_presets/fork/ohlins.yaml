# --------------------------------------------------------------------------
# Forks — current Öhlins MTB lineup plus sourceable earlier generations.
# The RXF34 m.1, RXF36, RXF38 and DH38 have a separately pumped main and
# ramp-up chamber, so they share the `&dual_chamber_air` anchor; the RXC34,
# RXF34 m.2 and RXFDJ list a single Pressure. Coil trims list a Spring Rate
# in N/mm, the unit Öhlins stamps on its MTB coil springs.
# Volume Spacers are listed where an owner's manual publishes the maximum (RXC34
# m.1, RXF34 m.2). The RXF36/RXF38/DH38 manuals describe no spacer system; they
# tune progression with the pressurised ramp-up chamber instead.
# --------------------------------------------------------------------------
