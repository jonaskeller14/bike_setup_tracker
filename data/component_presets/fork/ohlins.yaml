  - https://ohlins.com/storage/F1FD2667BEF6A26936BBE79CBD7BC4023A47B74CEF08518C26294D2B1AFF0A33/24e7fcb03154439ea9ae0b6150bcede7/pdf/media/55239c8bd8da48c19d511823f9b1c5c6/OM_07258-12_4_RXF36%20m3%20air%20front%20fork.pdf
  - https://ohlins.com/storage/B799A00056AAEF9DE3E7BAB002F50562A6D1BA21B2998148273DF3D42E6199C0/4def7de90bca493cb2a999f99d34bdbf/pdf/media/fe3f1b241587489f98caf3f73ccd9139/OM_07258-07_7_MI_RXF36_m.2_AirCoil_TTX18.pdf
  # Primary - owner's manuals used for volume spacers, setup tables and coil spring rates
  - https://www.ohlins.com/storage/B9AC95E58353CFA82EC9840F30F16E6AD76B61BF05DB8A5B7CDE65BC9E15C8D0/469d00f818d54e0ca34230baa6eaa34e/pdf/media/fa74b243c1a34513a89ddb391dd8a5c7/Owners%20manual%20RXF34%20m2.pdf
  - https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-rxc34-m1--00003982.pdf
  - https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-federgabel-rxf36--00003012.pdf
  - https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-federgabel-rxf36--00004180.pdf
  - https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-federgabel-rxf38--00003536.pdf
  - https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-federgabel-rxf38--00004275.pdf
  - https://ohlins.pl/sites/default/files/mtb_rxf34_rxf36_27.5-29-1.pdf
