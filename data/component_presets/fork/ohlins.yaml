# Öhlins mountain-bike forks — adjustment preset database
#
# Same design as fork/fox.yaml: click ranges belong to the DAMPER cartridge,
# defined once under `dampers:` and referenced by key from each fork's trims.
# See SCHEMA.md in this folder.
#
# Öhlins itself versions dampers/forks with "m.1"/"m.2"/"m.3" suffixes, and
# those generations have genuinely different click counts — so, unlike FOX, the
# generation suffix is kept as part of the `model` name (e.g. "RXF36 m.3")
# rather than folded away, since it IS the user-facing distinguishing name.
# Each generation therefore also gets its own damper key; nothing is inherited
# from a sibling model on the assumption that the cartridge is shared.

brand: Öhlins
component_type: fork
sources:
  - https://www.ohlins.eu/de/products/mountainbike/mtb-forks/
  - https://www.ohlins.eu/en/products/mountainbike/rxc34-m1-air-otx14-r--7692/
  - https://www.ohlins.eu/en/products/mountainbike/rxf34-m2-air-otx18-29--7685/
  - https://www.ohlins.eu/de/products/mountainbike/rxf36-m2-air-ttx18-275--7698/
  - https://www.ohlins.eu/en/products/mountainbike/rxf36-m3-air-ttx18-275--7696/
  - https://www.ohlins.eu/en/products/mountainbike/rxf38-m2-air-ttx18-29--7694/
  - https://www.ohlins.eu/en/products/mountainbike/rxf38-m3-air-coil-ttx18--7748/
  - https://www.ohlins.eu/en/products/mountainbike/dh38-m1-downhill-front-fork--7683/
  - https://www.ohlins.eu/en/products/mountainbike/dh38-m2-air-coil-downhill--7747/
  - https://www.ohlins.eu/de/products/mountainbike/rxfdj-m1-air-26-dirt--7687/
  # Öhlins owner's manuals (PDF) — air/coil spring chapters and TTX18 setup chapters
  - https://ohlins.com/storage/9C8C7FB7E305B5CED4AFC6118547113286CF63B94F14ADAB8050C2CFEA78FF38/dcb2294119c04b8da8dd7613ae7db28f/pdf/media/60aa019099bd416e8b0207e44ee4a2ac/OM_07258-09_3_FGxx%2038xx%2021xx.pdf
  - https://ohlins.com/storage/4D81EA83A21214EDFB4A57331844F3692B56F2CCA1ED9BD1BE95A5CDFE6D1B1E/9bd7e6402a3e42ff93f357c6b15e645b/pdf/media/0377e17f271d4af39560e027d515d36d/Owners%20manual%20RXF38%20m.2.pdf
  - https://www.ohlins.com/en-us/document-library
updated: 2026-09-10
# Click ranges taken from the individual product pages at ohlins.eu plus the
# Öhlins owner's manuals linked above. Clicks are counted from fully closed
# (firmest) → default `dial_ccw`.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
dampers:
  otx14_r:
    name: OTX14 R
    description: |-
      - XC race cartridge with a three-position lever: Open, Pedal and Lockout
      - Rebound, low-speed and high-speed compression each get their own dial
      - Adjustments incomplete: please add Rebound and Compression yourself.
    adjustments:
      - { name: Ride Mode, type: categorical, options: [Open, Pedal, Lockout], notes: "Crown lever or bar remote; 7.5mm cable pull per click, 5.5mm/click adapter available" }
    source: https://www.ohlins.eu/en/products/mountainbike/rxc34-m1-air-otx14-r--7692/
    note: >-
      RXC34 m.1 page lists "3 Ride Modes: open, pedal, lockout", "Lockout
      Funktion (7,5 mm per Klick)" and "Getrennt einstellbare Zug- und
      Druckstufendämpfung", but no click totals for the rebound, low-speed or
      high-speed compression dials. Left out rather than guessed.

  otx18:
    name: OTX18
    description: |-
      - Trail/downcountry cartridge; damping and air spring live in opposite legs
      - High-speed compression is a four-position dial, 0 being fully closed
      - Every click is counted from fully closed, opening counter-clockwise
    adjustments:
      - { name: HSC, type: step, max: 3, notes: High-Speed Compression }
      - { name: LSC, type: step, max: 15, notes: Low-Speed Compression }
      - { name: Rebound, type: step, max: 15 }
    source: https://www.ohlins.eu/en/products/mountainbike/rxf34-m2-air-otx18-29--7685/
    note: >-
      RXF34 m.2 page: "3-fach High-Speed Druckstufeneinstellung", "15-fach
      Low-Speed Druckstufeneinstellung", "15-fach Zugstufeneinstellung".

  ttx18_m2:
    name: TTX18 (m.2 generation)
    description: |-
      - Twin-tube trail/enduro cartridge, m.2 generation
      - High-speed compression is a four-position dial; 0 is a firm climb platform
      - Every click is counted from fully closed, opening counter-clockwise
    adjustments:
      - { name: HSC, type: step, max: 3, notes: "High-Speed Compression; position 0 is the firm climb platform" }
      - { name: LSC, type: step, max: 15, notes: Low-Speed Compression }
      - { name: Rebound, type: step, max: 15 }
    source:
      - https://www.ohlins.eu/de/products/mountainbike/rxf36-m2-air-ttx18-275--7698/
      - https://www.ohlins.eu/en/products/mountainbike/rxf38-m2-air-ttx18-29--7694/
    note: >-
      RXF38 m.2 page: "15-fach Low-Speed Druckstufenverstellung", "15-fach
      Zugstufenverstellung", "3-fach High-Speed Druckstufenverstellung" — i.e.
      the m.2 table is 15/15/3, NOT the m.3's 16/16/3. Both pages agree.

  ttx18_m3:
    name: TTX18 (m.3 generation)
    description: |-
      - Twin-tube trail/enduro/DH cartridge, m.3 generation, with reworked internals
      - One more click of low-speed compression and rebound than the m.2 cartridge
      - Every click is counted from fully closed, opening counter-clockwise
    adjustments:
      - { name: HSC, type: step, max: 3, notes: High-Speed Compression }
      - { name: LSC, type: step, max: 16, notes: Low-Speed Compression }
      - { name: Rebound, type: step, max: 16 }
    source:
      - https://www.ohlins.eu/en/products/mountainbike/rxf36-m3-air-ttx18-275--7696/
      - https://www.ohlins.eu/en/products/mountainbike/rxf38-m3-air-coil-ttx18--7748/
      - https://www.ohlins.eu/en/products/mountainbike/dh38-m2-air-coil-downhill--7747/
    note: >-
      16/16/3 stated independently on all three m.3-generation pages, e.g. DH38
      m.2: "16 Klicks für Low-Speed-Compression", "3 Klicks für High-Speed-
      Compression", "16 Klicks für Rebound".

  ttx18_rxf38_m1:
    name: TTX18 (RXF38 m.1)
    description: |-
      - Twin-tube cartridge of the first-generation RXF38
      - High-speed compression is a four-position dial, shipped fully open at 3
      - Adjustments incomplete: please add Rebound and Low-Speed Compression yourself.
    adjustments:
      - { name: HSC, type: step, max: 3, notes: "High-Speed Compression; 0 is fully closed, 3 fully open" }
    source: https://ohlins.com/storage/9C8C7FB7E305B5CED4AFC6118547113286CF63B94F14ADAB8050C2CFEA78FF38/dcb2294119c04b8da8dd7613ae7db28f/pdf/media/60aa019099bd416e8b0207e44ee4a2ac/OM_07258-09_3_FGxx%2038xx%2021xx.pdf
    note: >-
      Owner's Manual RXF38 m.1 (part no. OM_07258-09_3), chapter "4 TTX18
      SETUP", p. 13: "The high speed adjuster has four positions ... position 0
      [zero] ... position 3." That manual states no click totals for low-speed
      compression or rebound, so those two are omitted rather than copied from
      the m.2 cartridge.

  ttx22_fork:
    name: TTX22 (fork cartridge)
    description: |-
      - Twin-tube cartridge of the original RXF34/RXF36, opposite the air spring
      - High-speed compression runs 0 fully closed to 5 fully open, shipped at 5
      - Adjustments incomplete: please add Rebound and Low-Speed Compression yourself.
    adjustments:
      - { name: HSC, type: step, max: 5, notes: "High-Speed Compression; 0 is fully closed, 5 fully open" }
    source: https://ohlins.pl/sites/default/files/mtb_rxf34_rxf36_27.5-29-1.pdf
    note: >-
      Öhlins "Front Fork RXF34/RXF36 Owner's Manual / Mounting Instructions",
      chapter "SETTING UP TTX22", p. 10/16: "When the adjuster is fully closed
      it has position 0 [zero] and when the adjuster is fully open it has
      position 5." The same paragraph also calls it "five positions"; the
      explicit 0-5 endpoints are taken as written and the wording conflict is
      left standing rather than resolved by picking a number. That manual
      states no totals for low-speed compression or rebound. PDF is the Öhlins
      document hosted by the Öhlins Poland importer — ohlins.com no longer
      publishes this generation.

  stx22_fork:
    name: STX22 (fork cartridge)
    description: |-
      - Simpler cartridge sold alongside the TTX22 in the original RXF36
      - Low-speed compression and rebound only, both shipped at 7 clicks from closed
      - Adjustments incomplete: please add Rebound and Compression yourself.
    adjustments: []
    source: https://ohlins.pl/sites/default/files/mtb_rxf34_rxf36_27.5-29-1.pdf
    note: >-
      Same manual, chapter "SETTING UP STX22", p. 11/16: "The front forks are
      delivered with the low speed compression and rebound adjuster at 7
      clicks." That is a delivery setting, not a maximum, so no click range is
      entered for either circuit. The chapter describes no high-speed
      compression adjuster on this cartridge.

  ttx18_dh38_m1:
    name: TTX18 (DH38 m.1)
    description: |-
      - Twin-tube downhill cartridge of the first-generation DH38
      - High-speed compression is a four-position dial
      - Every click is counted from fully closed, opening counter-clockwise
    adjustments:
      - { name: HSC, type: step, max: 3, notes: High-Speed Compression }
      - { name: LSC, type: step, max: 15, notes: Low-Speed Compression }
      - { name: Rebound, type: step, max: 15 }
    source: https://www.ohlins.eu/en/products/mountainbike/dh38-m1-downhill-front-fork--7683/
    note: >-
      Read off the DH38 m.1's own page ("15-fach Zugstufenverstellung",
      "15-fach Low-Speed Druckstufenverstellung", "3-fach High-Speed
      Druckstufenverstellung"), not inherited from the DH38 m.2 — it happens to
      match the m.2-generation TTX18 table, but the DH38 m.2 itself is 16/16/3.

# --------------------------------------------------------------------------
# Forks — current Öhlins MTB lineup plus sourceable earlier generations.
# Most air trims share the `&air_spring` anchor (a single Pressure); the RXF38
# family has a separately pumped main and ramp-up chamber, so it uses
# `&dual_chamber_air`. Coil trims list a Spring Rate in N/mm, the unit Öhlins
# stamps on its MTB coil springs.
# Öhlins tunes air-spring progression with the pressurised ramp-up chamber
# rather than tokens, so no Volume Spacers adjustment is generated — except
# that the RXF34 lists a spacer without publishing a maximum. See follow-ups.
# --------------------------------------------------------------------------
forks:
  - model: "RXC34 m.1"
    category: XC
    year_range: "2025-2026"
    url: https://www.ohlins.eu/de/products/mountainbike/rxc34-m1-air-otx14-r--7692/
    wheel_size: [29]
    trims:
      - trim: Aluminum (remote)
        travel_mm: [100, 110, 120]
        spring: Air
        dampers: [otx14_r]
        adjustments: &air_spring
          - { name: Pressure, type: numerical, unit: psi, min: 0 }
      - trim: Carbon crown (remote)
        travel_mm: [100, 110, 120]
        spring: Air
        dampers: [otx14_r]
        adjustments: *air_spring
      - trim: Carbon crown (manual)
        travel_mm: [100, 110, 120]
        spring: Air
        dampers: [otx14_r]
        adjustments: *air_spring
    note: |-
      - Two-chamber air spring, 29" only, from 1496g
      - Floating axle design lets the lowers settle before the axle is clamped

  - model: "RXF34 m.2"
    category: Downcountry / Trail
    year_range: "2025-2026"
    url: https://www.ohlins.eu/de/products/mountainbike/rxf34-m2-air-otx18-29--7685/
    wheel_size: [29]
    trims:
      - trim: Air OTX18
        travel_mm: [120, 130, 140]
        offset_mm: [44]
        spring: Air
        dampers: [otx18]
        adjustments: *air_spring
        note: Air-spring progression is tuned with volume spacers; from 1698g without one.

  - model: "RXF36 m.2"
    category: Trail
    year_range: "2025-2026"
    url: https://www.ohlins.eu/de/products/mountainbike/rxf36-m2-air-ttx18-275--7698/
    wheel_size: [29, 27.5]
    trims:
      - trim: Air TTX18
        travel_mm: [140, 150, 160, 170]
        offset_mm: [38, 44, 51]
        spring: Air
        dampers: [ttx18_m2]
        adjustments: *air_spring

  - model: "RXF36 m.3"
    category: Trail
    year_range: "2025-2026"
    url: https://www.ohlins.eu/de/products/mountainbike/rxf36-m3-air-ttx18-275--7696/
    wheel_size: [29, 27.5]
    trims:
      - trim: Air TTX18
        travel_mm: [140, 150, 160, 170]   # 140-160mm on 29", up to 170mm on 27.5"
        offset_mm: [38, 44, 51]
        spring: Air
        dampers: [ttx18_m3]
        adjustments: *air_spring
      - trim: Coil
        url: https://www.ohlins.eu/de/products/mountainbike/rxf36-m3-coil--6430/
        spring: Coil
        dampers: [ttx18_m3]
        adjustments: &coil_spring
          - { name: Spring Rate, type: numerical, unit: N/mm, min: 0 }
          - { name: Preload, type: numerical, unit: turns, min: 0 }

  - model: "RXF38 m.2"
    category: Enduro
    year_range: "2025-2026"
    url: https://www.ohlins.eu/en/products/mountainbike/rxf38-m2-air-ttx18-29--7694/
    wheel_size: [29]
    trims:
      - trim: Air
        travel_mm: [160, 170, 180]
        offset_mm: [44, 51]
        spring: Air
        dampers: [ttx18_m2]
        adjustments: &dual_chamber_air
          - { name: Main Chamber Pressure, type: numerical, unit: psi, min: 0 }
          - { name: Ramp-up Chamber Pressure, type: numerical, unit: psi, min: 0 }
      - trim: Coil
        # Spring rate chart: Owner's Manual RXF38 m.2, "4 COIL SPRING SETUP", p. 12
        travel_mm: [160, 170, 180]
        offset_mm: [44, 51]
        spring: Coil
        dampers: [ttx18_m2]
        adjustments: *coil_spring
        note: |-
          - Coil springs run 7.0 to 12.4 N/mm in seven steps, colour-coded on the tube
          - Set the preload knob to minimum, then dial in 15-20% sag
    note: |-
      - Three-chamber air spring: main and ramp-up are pumped separately
      - Offsets also come in long-crown "44L" and "51L" versions
      - Recommended sag is 10-15% of travel on air, 15-20% on coil

  - model: "RXF38 m.3"
    category: Enduro
    year_range: "2025-2026"
    url: https://www.ohlins.eu/de/products/mountainbike/rxf38-m3-air-coil-ttx18--7748/
    wheel_size: [29]
    trims:
      - trim: Air
        travel_mm: [160, 170, 180]
        offset_mm: [44]
        spring: Air
        dampers: [ttx18_m3]
        adjustments: *dual_chamber_air
      - trim: Coil
        travel_mm: [170]
        offset_mm: [44]
        spring: Coil
        dampers: [ttx18_m3]
        adjustments: *coil_spring
    note: |-
      - Three-chamber air spring: main and ramp-up are pumped separately
      - Reworked internals over the m.2, with one extra click of rebound and low-speed compression
      - 29" only, max tyre 29x2.6, from 2320g

  - model: "DH38 m.1"
    category: Downhill
    year_range: "2025-2026"
    url: https://www.ohlins.eu/en/products/mountainbike/dh38-m1-downhill-front-fork--7683/
    wheel_size: [29, 27.5]
    trims:
      - trim: Air
        travel_mm: [180, 200]
        offset_mm: [46, 50, 54, 58]
        spring: Air
        dampers: [ttx18_dh38_m1]
        adjustments: *air_spring
    note: |-
      - Dual-crown downhill chassis, 180 or 200mm travel, 110mm Boost with a 20mm axle
      - Max tyre 29x2.8 or 27.5x3.0, and rated for e-bike use

  - model: "DH38 m.2"
    category: Downhill
    year_range: "2025-2026"
    url: https://www.ohlins.eu/de/products/mountainbike/dh38-m2-air-coil-downhill--7747/
    wheel_size: [29, 27.5]
    trims:
      - trim: Air
        travel_mm: [200]
        offset_mm: [46, 50, 54, 58]
        spring: Air
        dampers: [ttx18_m3]
        adjustments: *air_spring
      - trim: Coil
        travel_mm: [200]
        offset_mm: [46, 50, 54, 58]
        spring: Coil
        dampers: [ttx18_m3]
        adjustments: *coil_spring
    note: |-
      - Dual-crown downhill chassis, 200mm travel, four offsets from 46 to 58mm
      - Max tyre 27.5x3.2 or 29x2.8, 200/203mm rotors
      - 2820g including axle and hardware

  - model: "RXFDJ m.1"
    category: Dirt Jump
    year_range: "2025-2026"
    url: https://www.ohlins.eu/de/products/mountainbike/rxfdj-m1-air-26-dirt--7687/
    wheel_size: [26]
    trims:
      - trim: Air TTX18
        travel_mm: [90]
        spring: Air
        dampers: [ttx18_m2]
        adjustments: *air_spring

# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - OTX14 R (RXC34 m.1): Öhlins publishes the three ride modes and the
#     7.5mm/click lockout throw, but no click totals for its rebound, low-speed
#     or high-speed compression dials. Only the Ride Mode selector is modelled.
#   - RXF38 m.1: the owner's manual gives the four-position high-speed dial but
#     no low-speed compression or rebound totals, so the m.1 fork is not listed
#     yet — `ttx18_rxf38_m1` is defined and waiting for those two numbers.
#   - RXF34 m.2 volume spacers: the page weighs the fork "ohne Volumenspacer"
#     but never states how many the air spring accepts. No Volume Spacers
#     adjustment is generated until a maximum is published.
#   - Coil preload: RXF36 m.3 / RXF38 coil forks have a preload knob, but no
#     manual states its total turns, so Preload is an open-ended numerical.
#   - Öhlins coil spring rate charts are only confirmed for the RXF38 family
#     (7.0-12.4 N/mm, Owner's Manual RXF38 m.2 p. 12); the RXF36 m.3 coil
#     chart has not been located.
#   - Legacy generations still missing: RXF34 m.1, RXF36 m.1 and m.2 of the
#     2016-2019 era, and the original 2016 RXF 36. Their click tables are not
#     on any current Öhlins page and no archived manual has been located.
# --------------------------------------------------------------------------
