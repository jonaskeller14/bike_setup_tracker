# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - RXF36 m.3 Coil: the product page gives 160mm travel and 29" with 44mm
#     offset only.
#   - setup_guide: RXC34 m.1 only has a German manual on ohlins.eu; RXFDJ m.1
#     lists workshop manuals only, so it carries no setup_guide.
#   - OTX14 R (RXC34 m.1): rebound 12 and low-speed compression 10 come from the
#     AMB article (tier 2); Öhlins and its manual give no totals. The high-speed
#     compression dial exists on the product page but no source gives its total,
#     so it carries `max: ~`. The LSC is described for the manual-lever version
#     only; the remote versions may not have it.
#   - OTX18 (RXF34 m.2) HSC is 0-2 per the owner's manual while the product page
#     says "3-fach"; the manual's wording is used.
#   - RXF38 m.1: the owner's manual gives the four-position high-speed dial but
#     no low-speed compression or rebound totals and no setup table. `ttx18_rxf38_m1`
#     is defined with `max: ~` for those two; the m.1 fork itself is not listed yet.
#   - Volume spacers: the RXF36 m.2/m.3, RXF38 m.2/m.3 and DH38 manuals describe no
#     spacer system; RXFDJ has no manual. Nothing is declared for them.
#   - RXF36 m.1 Air TTX22/STX22 and RXF34 m.1: strokes read off the Öhlins Poland
#     copy of the RXF34/RXF36 manual (setup-data table). Its kit list shows the
#     27.5" TTX22 only at 150/170mm while the setup table gives 140-170mm; the
#     table is used. Production years are not stated, so `years` is omitted. The
#     STX22/TTX22 Rebound and low-speed compression totals are estimates from the
#     7-8 click setup table.
#   - Coil preload: RXF36 m.2/m.3 and RXF38 coil forks have a preload knob, but
#     no manual states its total turns, so Preload is an open-ended numerical.
#   - Öhlins coil spring rate charts: RXF38 (7.0-12.4 N/mm, Owner's Manual RXF38
#     m.2 p. 12 and m.3 p. 12), RXF36 m.3 Coil (7.0-12.4 N/mm, manual 00004297
#     p. 12) and RXF36 m.2 Coil (6.1-11.5 N/mm, manual 00003012 p. 8). The m.2
#     manual lists air strokes of 150-180mm in its setup data while the product
#     page gives 140-170mm; the page is used.
#   - Legacy generations still missing: the 2016-2018 RXF36 Air EVO (separate
#     ohlins.eu listings, no damper table located) and the RXF34 Air 29 120/140/160
#     listings, whose damper click table is not on those pages.
