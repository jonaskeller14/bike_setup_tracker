      note: >-
        Owner's Manual RXF38 m.1 (part no. OM_07258-09_3), chapter "4 TTX18
        SETUP", p. 13: "The high speed adjuster has four positions ... position 0
        [zero] ... position 3." That manual states no click totals for low-speed
        compression or rebound, so those two carry `max: ~` rather than the
        m.2 cartridge's numbers.

    ttx22_fork:
      name: TTX22 (fork cartridge)
      description: |-
        - Twin-tube cartridge of the original RXF34/RXF36, opposite the air spring
        - High-speed compression runs 0 fully closed to 5 fully open, shipped at 5
      description_de: |-
        - Zweirohr-Kartusche der ursprünglichen RXF34/RXF36, gegenüber der Luftfeder
        - Die High-Speed-Druckstufe reicht von 0 ganz geschlossen bis 5 ganz offen, ausgeliefert auf 5
      description_fr: |-
        - Cartouche bitube des RXF34/RXF36 d’origine, à l’opposé du ressort pneumatique
        - La compression haute vitesse va de 0 entièrement fermé à 5 entièrement ouvert, livrée sur 5
      description_it: |-
        - Cartuccia bitubo delle RXF34/RXF36 originali, opposta alla molla pneumatica
        - La compressione ad alta velocità va da 0 completamente chiusa a 5 completamente aperta, fornita su 5
      description_es: |-
        - Cartucho bitubo de las RXF34/RXF36 originales, opuesto al muelle neumático
        - La compresión de alta velocidad va de 0 totalmente cerrada a 5 totalmente abierta, y sale de fábrica en 5
      description_pt: |-
        - Cartucho bitubo das RXF34/RXF36 originais, oposto à mola a ar
        - A compressão de alta velocidade vai de 0 totalmente fechada a 5 totalmente aberta, entregue em 5
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 5, notes: "High-Speed Compression; 0 is fully closed, 5 fully open", notes_de: "High-Speed-Druckstufe; 0 ist ganz geschlossen, 5 ganz offen", notes_fr: "Compression haute vitesse ; 0 est entièrement fermé, 5 entièrement ouvert", notes_it: "Compressione ad alta velocità; 0 è completamente chiuso, 5 completamente aperto", notes_es: "Compresión de alta velocidad; 0 es totalmente cerrado, 5 totalmente abierto", notes_pt: "Compressão de alta velocidade; 0 é totalmente fechado, 5 totalmente aberto" }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 8, notes: "Low-Speed Compression; estimated maximum, check your dial and edit it if it differs", notes_de: "Low-Speed-Druckstufe; geschätztes Maximum, am Drehrad prüfen und bei Abweichung anpassen", notes_fr: "Compression basse vitesse ; maximum estimé, vérifiez votre cadran et modifiez-le s’il diffère", notes_it: "Compressione a bassa velocità; massimo stimato, controlla la tua manopola e modificalo se è diverso", notes_es: "Compresión de baja velocidad; máximo estimado, comprueba tu dial y edítalo si es distinto", notes_pt: "Compressão de baixa velocidade; máximo estimado, confira o seu seletor e edite-o se for diferente" }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 8, notes: "Low-Speed Rebound; estimated maximum, check your dial and edit it if it differs", notes_de: "Low-Speed-Zugstufe; geschätztes Maximum, am Drehrad prüfen und bei Abweichung anpassen", notes_fr: "Détente basse vitesse ; maximum estimé, vérifiez votre cadran et modifiez-le s’il diffère", notes_it: "Ritorno a bassa velocità; massimo stimato, controlla la tua manopola e modificalo se è diverso", notes_es: "Rebote de baja velocidad; máximo estimado, comprueba tu dial y edítalo si es distinto", notes_pt: "Retorno de baixa velocidade; máximo estimado, confira o seu seletor e edite-o se for diferente" }
      source: https://ohlins.pl/sites/default/files/mtb_rxf34_rxf36_27.5-29-1.pdf
      note: >-
        Öhlins "Front Fork RXF34/RXF36 Owner's Manual / Mounting Instructions",
        chapter "SETTING UP TTX22", p. 10/16: "When the adjuster is fully closed
        it has position 0 [zero] and when the adjuster is fully open it has
        position 5." The same paragraph also calls it "five positions"; the
        explicit 0-5 endpoints are taken as written and the wording conflict is
        left standing rather than resolved by picking a number. That manual
        states no totals for low-speed compression or rebound. Estimate: its
        "SETUP DATA" table (p. 13/16) lists Rebound 7-8 clicks and Compression
        low 7-8 clicks, counted from fully closed (turn clockwise to closed, then
        count clicks open), so both are set to 8, the table's highest value; the
        true totals may be higher. PDF is the Öhlins document hosted by the
        Öhlins Poland importer — ohlins.com no longer publishes this generation.

    stx22_fork:
      name: STX22 (fork cartridge)
      description: |-
        - Simpler cartridge sold alongside the TTX22 in the original RXF36
        - Low-speed compression and rebound only, both shipped at 7 clicks from closed
      description_de: |-
        - Einfachere Kartusche, die in der ursprünglichen RXF36 neben der TTX22 angeboten wurde
        - Nur Low-Speed-Druckstufe und Zugstufe, beide ab Werk auf 7 Klicks von geschlossen aus
      description_fr: |-
        - Cartouche plus simple vendue avec le TTX22 dans la RXF36 d’origine
        - Compression basse vitesse et détente uniquement, toutes deux livrées à 7 clics depuis la position fermée
      description_it: |-
        - Cartuccia più semplice venduta insieme al TTX22 nella RXF36 originale
        - Solo compressione a bassa velocità e ritorno, entrambi forniti a 7 scatti dalla posizione chiusa
      description_es: |-
        - Cartucho más sencillo que se vendía junto al TTX22 en la RXF36 original
        - Solo compresión de baja velocidad y rebote, ambos de fábrica a 7 clics desde la posición cerrada
      description_pt: |-
        - Cartucho mais simples vendido junto com o TTX22 na RXF36 original
        - Somente compressão de baixa velocidade e retorno, ambos entregues a 7 cliques da posição fechada
      adjustments:
        - { name: Compression, name_de: Druckstufe, name_fr: Compression, name_it: Compressione, name_es: Compresión, name_pt: Compressão, type: step, max: 8, notes: "Low-Speed Compression; estimated maximum, check your dial and edit it if it differs", notes_de: "Low-Speed-Druckstufe; geschätztes Maximum, am Drehrad prüfen und bei Abweichung anpassen", notes_fr: "Compression basse vitesse ; maximum estimé, vérifiez votre cadran et modifiez-le s’il diffère", notes_it: "Compressione a bassa velocità; massimo stimato, controlla la tua manopola e modificalo se è diverso", notes_es: "Compresión de baja velocidad; máximo estimado, comprueba tu dial y edítalo si es distinto", notes_pt: "Compressão de baixa velocidade; máximo estimado, confira o seu seletor e edite-o se for diferente" }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 8, notes: "Low-Speed Rebound; estimated maximum, check your dial and edit it if it differs", notes_de: "Low-Speed-Zugstufe; geschätztes Maximum, am Drehrad prüfen und bei Abweichung anpassen", notes_fr: "Détente basse vitesse ; maximum estimé, vérifiez votre cadran et modifiez-le s’il diffère", notes_it: "Ritorno a bassa velocità; massimo stimato, controlla la tua manopola e modificalo se è diverso", notes_es: "Rebote de baja velocidad; máximo estimado, comprueba tu dial y edítalo si es distinto", notes_pt: "Retorno de baixa velocidade; máximo estimado, confira o seu seletor e edite-o se for diferente" }
      source: https://ohlins.pl/sites/default/files/mtb_rxf34_rxf36_27.5-29-1.pdf
      note: >-
        Same manual, chapter "SETTING UP STX22", p. 11/16: "The front forks are
        delivered with the low speed compression and rebound adjuster at 7
        clicks." That is a delivery setting, not a maximum. Estimate: the "SETUP
        DATA" table (p. 13/16) lists the RXF36 STX22 at Rebound 7-8 clicks and
        Compression low 7-8 clicks, counted from fully closed, so both are set to
        8, the table's highest value; the true totals may be higher. The chapter
        describes no high-speed compression adjuster on this cartridge.

    ttx18_dh38_m1:
      name: TTX18 (DH38 m.1)
      description: |-
        - Twin-tube downhill cartridge of the first-generation DH38
        - High-speed compression is a four-position dial
        - Every click is counted from fully closed, opening counter-clockwise
      description_de: |-
        - Zweirohr-Downhill-Kartusche der DH38 der ersten Generation
        - Die High-Speed-Druckstufe ist ein Rad mit vier Positionen
        - Jeder Klick wird von ganz geschlossen gezählt, Öffnen gegen den Uhrzeigersinn
      description_fr: |-
        - Cartouche descente bitube de la DH38 de première génération
        - La compression haute vitesse est une molette à quatre positions
        - Chaque clic est compté depuis la position entièrement fermée, en ouvrant dans le sens antihoraire
      description_it: |-
        - Cartuccia da downhill bitubo della DH38 di prima generazione
        - La compressione ad alta velocità è una manopola a quattro posizioni
        - Ogni scatto è contato a partire dalla posizione completamente chiusa, aprendo in senso antiorario
      description_es: |-
        - Cartucho de descenso bitubo de la DH38 de primera generación
        - La compresión de alta velocidad es una rueda de cuatro posiciones
        - Cada clic se cuenta desde la posición totalmente cerrada, abriendo en sentido antihorario
      description_pt: |-
        - Cartucho de downhill bitubo da DH38 de primeira geração
        - A compressão de alta velocidade é um seletor de quatro posições
        - Cada clique é contado a partir da posição totalmente fechada, abrindo no sentido anti-horário
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 3, notes: High-Speed Compression, notes_de: High-Speed-Druckstufe, notes_fr: Compression haute vitesse, notes_it: Compressione ad alta velocità, notes_es: Compresión de alta velocidad, notes_pt: Compressão de alta velocidade, dialColor: grey }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 15, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade, dialColor: blue, dialSize: small }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 15, dialColor: orange }
      source: https://www.ohlins.eu/en/products/mountainbike/dh38-m1-downhill-front-fork--7683/
      note: >-
        Read off the DH38 m.1's own page ("15-fach Zugstufenverstellung",
        "15-fach Low-Speed Druckstufenverstellung", "3-fach High-Speed
        Druckstufenverstellung"), not inherited from the DH38 m.2 — it happens to
        match the m.2-generation TTX18 table, but the DH38 m.2 itself is 16/16/3.

# --------------------------------------------------------------------------
# Setup guides — transcribed from docs/research/setup_guides/ohlins.md.
#   * Pressure: the owner's manuals print a psi band per rider-weight bracket
#     (kg, lb also printed), one per chamber on the two-chamber forks. Riders
#     outside the printed 50-120 kg get no pressure value.
#   * Clicks: the "setup data" base tunes (`14-16 clicks`) are counted from
#     closed like every catalog dial here, so they are encoded as published.
#     HSC values are the delivery positions the manuals state.
#   * Coil charts give one rider weight per spring; spring rates take the
#     nearest point and never interpolate.
#   * The manuals' Performance Suspension Guide (bike-specific base settings)
#     is keyed by bike model, not by rider data, and is not encoded.
# --------------------------------------------------------------------------
guides:
  ohlins_rxc34_m1_2023:
    label: Öhlins RXC34 m.1 owner's manual (2023)
    label_de: Öhlins RXC34 m.1 Bedienungsanleitung (2023)
    label_fr: Manuel d’utilisation Öhlins RXC34 m.1 (2023)
    label_it: Manuale d’uso Öhlins RXC34 m.1 (2023)
    label_es: Manual del usuario Öhlins RXC34 m.1 (2023)
    label_pt: Manual do usuário Öhlins RXC34 m.1 (2023)
    source: https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-rxc34-m1--00003982.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          50-55: [58, 73], 55-60: [63, 77], 60-65: [67, 82], 65-70: [72, 86],
          70-75: [76, 91], 75-80: [81, 95], 80-85: [85, 100], 85-90: [90, 104],
          90-95: [94, 109], 95-100: [99, 113], 100-105: [103, 118], 105-110: [108, 122],
          110-115: [112, 127], 115-120: [117, 131]
        }
        note: Check the pressure label on the fork as well
        note_de: Zusätzlich das Druckschild an der Gabel beachten
        note_fr: Vérifiez aussi l’étiquette de pression sur la fourche
        note_it: Controlla anche l’etichetta della pressione sulla forcella
        note_es: Comprueba también la etiqueta de presión de la horquilla
        note_pt: Confira também a etiqueta de pressão no garfo
      - &ohlins_sag_15_25 { target: sag, range: [15, 25], comfort_at: max }
      # Positive-chamber spacers (8 ml). The 130 mm row has no catalog travel;
      # the negative-chamber spacers (4 × 1 ml) have no catalog adjuster.
      - target: volume_spacers
        input: travel_mm
        rows: { 100: 1, 110: 3, 120: 2 }

  ohlins_rxf34_m2_2026:
    label: Öhlins RXF34 m.2 owner's manual (2026)
    label_de: Öhlins RXF34 m.2 Bedienungsanleitung (2026)
    label_fr: Manuel d’utilisation Öhlins RXF34 m.2 (2026)
    label_it: Manuale d’uso Öhlins RXF34 m.2 (2026)
    label_es: Manual del usuario Öhlins RXF34 m.2 (2026)
    label_pt: Manual do usuário Öhlins RXF34 m.2 (2026)
    source: https://www.ohlins.com/storage/B9AC95E58353CFA82EC9840F30F16E6AD76B61BF05DB8A5B7CDE65BC9E15C8D0/469d00f818d54e0ca34230baa6eaa34e/pdf/media/fa74b243c1a34513a89ddb391dd8a5c7/Owners%20manual%20RXF34%20m2.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          50-55: [48, 63], 55-60: [53, 67], 60-65: [57, 72], 65-70: [62, 76],
          70-75: [66, 81], 75-80: [71, 85], 80-85: [75, 90], 85-90: [80, 94],
          90-95: [84, 99], 95-100: [89, 103], 100-105: [93, 108], 105-110: [98, 112],
          110-115: [102, 117], 115-120: [107, 121]
        }
      - { target: hsc, value: 2, note: "Delivery setting, fully open", note_de: "Auslieferungseinstellung, ganz offen", note_fr: "Réglage d’usine, entièrement ouvert", note_it: "Impostazione di fabbrica, completamente aperto", note_es: "Ajuste de fábrica, totalmente abierto", note_pt: "Ajuste de fábrica, totalmente aberto" }
      - *ohlins_sag_15_25
      # The chart of forks with a 140 mm maximum travel, the only one covering
      # every catalog travel; forks with a 130 mm maximum take one spacer fewer.
      - target: volume_spacers
        input: travel_mm
        rows: { 120: 5, 130: 4, 140: 3 }
        note: One spacer fewer on forks with a 130 mm maximum travel
        note_de: Ein Spacer weniger bei Gabeln mit 130 mm maximalem Federweg
        note_fr: Une entretoise de moins sur les fourches à débattement max. de 130 mm
        note_it: Un distanziale in meno sulle forcelle con escursione massima di 130 mm
        note_es: Un espaciador menos en las horquillas con un recorrido máximo de 130 mm
        note_pt: Um espaçador a menos nos garfos com curso máximo de 130 mm

  ohlins_rxf34_rxf36_m1:
    label: Öhlins RXF34/RXF36 owner's manual
    label_de: Öhlins RXF34/RXF36 Bedienungsanleitung
    label_fr: Manuel d’utilisation Öhlins RXF34/RXF36
    label_it: Manuale d’uso Öhlins RXF34/RXF36
    label_es: Manual del usuario Öhlins RXF34/RXF36
    label_pt: Manual do usuário Öhlins RXF34/RXF36
    source: https://ohlins.pl/sites/default/files/mtb_rxf34_rxf36_27.5-29-1.pdf
    rules:
      - target: main_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          50-60: [80, 90], 60-70: [90, 100], 70-80: [100, 110], 80-90: [110, 120],
          90-100: [120, 130], 100-110: [130, 140], 110-120: [140, 150]
        }
      - target: ramp_up_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: &ohlins_ramp_up {
          50-60: [160, 170], 60-70: [170, 180], 70-80: [180, 190], 80-90: [190, 200],
          90-100: [200, 210], 100-110: [210, 220], 110-120: [220, 230]
        }
      - { target: rebound, range: [7, 8] }
      - { target: lsc, range: [7, 8], when: { damper: ttx22_fork } }
      - { target: compression, range: [7, 8], when: { damper: stx22_fork } }
      # The setup data's TTX22 "Compression high 7-8 clicks" contradicts the
      # 0-5 dial the same manual describes, so only the delivery position is
      # encoded. The STX22's delivery 7 clicks sit inside the 7-8 base tune.
      - { target: hsc, value: 5, when: { damper: ttx22_fork }, note: "Delivery setting, fully open", note_de: "Auslieferungseinstellung, ganz offen", note_fr: "Réglage d’usine, entièrement ouvert", note_it: "Impostazione di fabbrica, completamente aperto", note_es: "Ajuste de fábrica, totalmente abierto", note_pt: "Ajuste de fábrica, totalmente aberto" }
      - { target: sag, range: [10, 15], comfort_at: max }

  ohlins_rxf36_m2_2023:
    label: Öhlins RXF36 m.2 owner's manual (2023)
    label_de: Öhlins RXF36 m.2 Bedienungsanleitung (2023)
    label_fr: Manuel d’utilisation Öhlins RXF36 m.2 (2023)
    label_it: Manuale d’uso Öhlins RXF36 m.2 (2023)
    label_es: Manual del usuario Öhlins RXF36 m.2 (2023)
    label_pt: Manual do usuário Öhlins RXF36 m.2 (2023)
    source: https://ohlins.com/storage/B799A00056AAEF9DE3E7BAB002F50562A6D1BA21B2998148273DF3D42E6199C0/4def7de90bca493cb2a999f99d34bdbf/pdf/media/fe3f1b241587489f98caf3f73ccd9139/OM_07258-07_7_MI_RXF36_m.2_AirCoil_TTX18.pdf
    rules:
      - &ohlins_main_chamber
        target: main_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          50-60: [70, 80], 60-70: [80, 90], 70-80: [90, 100], 80-90: [100, 110],
          90-100: [110, 120], 100-110: [120, 130], 110-120: [130, 140]
        }
      - &ohlins_ramp_up_chamber
        target: ramp_up_chamber_pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: *ohlins_ramp_up
      - &ohlins_ttx18_rebound { target: rebound, range: [14, 16] }
      - &ohlins_ttx18_lsc { target: lsc, range: [14, 16] }
      - &ohlins_ttx18_hsc { target: hsc, value: 3, note: "Delivery setting, fully open", note_de: "Auslieferungseinstellung, ganz offen", note_fr: "Réglage d’usine, entièrement ouvert", note_it: "Impostazione di fabbrica, completamente aperto", note_es: "Ajuste de fábrica, totalmente abierto", note_pt: "Ajuste de fábrica, totalmente aberto" }
      # The coil chart lists springs by travel, not by rider weight, so only
      # the factory spring is encoded.
      - { target: spring_rate, unit: N/mm, value: 9.7, when: { trim: coil }, note: The spring fitted at the factory, note_de: Die werkseitig verbaute Feder, note_fr: Le ressort monté en usine, note_it: La molla montata in fabbrica, note_es: El muelle montado de fábrica, note_pt: A mola montada de fábrica }
      - { target: sag, range: [10, 15], comfort_at: max, when: { trim: air-ttx18 } }
      - &ohlins_coil_sag { target: sag, range: [15, 20], comfort_at: max, when: { trim: coil }, note: Set the preload knob to minimum first, note_de: Zuerst den Vorspannungsknopf auf Minimum stellen, note_fr: Mettez d’abord la molette de précontrainte au minimum, note_it: Porta prima la manopola del precarico al minimo, note_es: Pon primero la rueda de precarga al mínimo, note_pt: Coloque primeiro o seletor de pré-carga no mínimo }

  # Edition 07258-12_2, the only RXF36 m.3 edition with a setup-data click table.
  ohlins_rxf36_m3_2023:
    label: Öhlins RXF36 m.3 owner's manual (2023)
    label_de: Öhlins RXF36 m.3 Bedienungsanleitung (2023)
    label_fr: Manuel d’utilisation Öhlins RXF36 m.3 (2023)
    label_it: Manuale d’uso Öhlins RXF36 m.3 (2023)
    label_es: Manual del usuario Öhlins RXF36 m.3 (2023)
    label_pt: Manual do usuário Öhlins RXF36 m.3 (2023)
    source: https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-federgabel-rxf36--00004180.pdf
    rules:
      - *ohlins_main_chamber
      - *ohlins_ramp_up_chamber
      - *ohlins_ttx18_rebound
      - *ohlins_ttx18_lsc
      - *ohlins_ttx18_hsc
      - &ohlins_air_sag { target: sag, range: [10, 15], comfort_at: max }

  ohlins_rxf36_m3_2026:
    label: Öhlins RXF36 m.3 owner's manual (2026)
    label_de: Öhlins RXF36 m.3 Bedienungsanleitung (2026)
    label_fr: Manuel d’utilisation Öhlins RXF36 m.3 (2026)
    label_it: Manuale d’uso Öhlins RXF36 m.3 (2026)
    label_es: Manual del usuario Öhlins RXF36 m.3 (2026)
    label_pt: Manual do usuário Öhlins RXF36 m.3 (2026)
    source: https://ohlins.com/storage/F1FD2667BEF6A26936BBE79CBD7BC4023A47B74CEF08518C26294D2B1AFF0A33/24e7fcb03154439ea9ae0b6150bcede7/pdf/media/55239c8bd8da48c19d511823f9b1c5c6/OM_07258-12_4_RXF36%20m3%20air%20front%20fork.pdf
    rules:
      - &ohlins_coil_chart
        target: spring_rate
        unit: N/mm
        input: rider_weight
        input_unit: kg
        rows: { 55: 7.0, 64: 7.9, 72: 8.8, 82: 9.7, 91: 10.6, 100: 11.5, 109: 12.4 }
      - *ohlins_ttx18_hsc
      - *ohlins_coil_sag

  # The 2024 edition adds the coil chart; the delivery HSC position is stated
  # in the 2021 air edition, the m.2's `setup_guide`.
  ohlins_rxf38_m2_2024:
    label: Öhlins RXF38 m.2 owner's manual (2024)
    label_de: Öhlins RXF38 m.2 Bedienungsanleitung (2024)
    label_fr: Manuel d’utilisation Öhlins RXF38 m.2 (2024)
    label_it: Manuale d’uso Öhlins RXF38 m.2 (2024)
