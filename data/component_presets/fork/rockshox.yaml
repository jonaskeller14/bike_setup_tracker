# --------------------------------------------------------------------------
# Setup guides — transcribed from docs/research/setup_guides/rockshox.md.
#   * Pressure: the decal tables of SRAM's yearly Front Suspension
#     Specifications, one rule per printed travel column, psi bands per rider
#     weight bracket (lb). The decal's edge cells are left out: `<60` has no
#     published minimum, and `110+` as `[110, max]` would apply the midpoint
#     up to the fork's maximum pressure, far above the decal's trend. Riders
#     outside the printed brackets (mostly 120-220 lb) get no pressure value.
#     The "E-Bikes add 10 psi" header is not encoded (no e-bike option, #72).
#   * Rebound: no PDF prints clicks. RockShox TrailHead computes them from
#     rider weight per model code and travel, counted from closed; the rows are
#     calculated at 5 kg steps and written as `max-N` because every catalog
#     rebound dial counts from open.
#   * HSC / LSC 0 and `lockout: false` are the User Manual's starting positions.
# --------------------------------------------------------------------------
guides:
  rockshox_sid_sl_2026:
    label: RockShox Front Suspension Specifications (2027)
    label_de: RockShox Gabel-Spezifikationen (2027)
    label_fr: Caractéristiques des fourches RockShox (2027)
    label_it: Specifiche delle forcelle RockShox (2027)
    label_es: Especificaciones de las horquillas RockShox (2027)
    label_pt: Especificações dos garfos RockShox (2027)
    source: https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/front-suspension/2027-front-suspension-specifications.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        rows: { 120-140: [85, 95], 140-160: [95, 108], 160-180: [108, 120], 180-200: [120, 132] }
      - target: rebound
        input: rider_weight
        input_unit: kg
        rows: {
          50: max-11, 55: max-11, 60: max-10, 65: max-9, 70: max-8,
          75: max-7, 80: max-7, 85: max-6, 90: max-5, 95: max-4,
          100: max-3, 105: max-3, 110: max-2, 115: max-1, 120: max
        }
        note: Calculated from RockShox TrailHead's formula
        note_de: Berechnet nach der Formel von RockShox TrailHead
        note_fr: Calculé selon la formule du TrailHead de RockShox
        note_it: Calcolato con la formula del TrailHead di RockShox
        note_es: Calculado con la fórmula del TrailHead de RockShox
        note_pt: Calculado pela fórmula do TrailHead da RockShox
      - { target: volume_spacers, value: 0 }

  rockshox_sid_sl_2025:
    label: RockShox Front Suspension Specifications (2025)
    label_de: RockShox Gabel-Spezifikationen (2025)
    label_fr: Caractéristiques des fourches RockShox (2025)
    label_it: Specifiche delle forcelle RockShox (2025)
    label_es: Especificaciones de las horquillas RockShox (2025)
    label_pt: Especificações dos garfos RockShox (2025)
    source: https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/front-suspension/2025-front-suspension-specifications.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        rows: &sid_sl_debonair { 120-140: [70, 90], 140-160: [90, 105], 160-180: [105, 120], 180-200: [120, 135] }
      - target: rebound
        input: rider_weight
        input_unit: kg
        rows: &th_sid_d1 {
          50: max-12, 55: max-11, 60: max-10, 65: max-10, 70: max-9,
          75: max-8, 80: max-7, 85: max-7, 90: max-6, 95: max-5,
          100: max-4, 105: max-4, 110: max-3, 115: max-2, 120: max-2
        }
        note: Calculated from RockShox TrailHead's formula
        note_de: Berechnet nach der Formel von RockShox TrailHead
        note_fr: Calculé selon la formule du TrailHead de RockShox
        note_it: Calcolato con la formula del TrailHead di RockShox
