# --------------------------------------------------------------------------
# Forks — current lineup first, then the models that only exist as an earlier
# generation (Yari, Revelation, Recon Gold). A model with several generations
# nests them as `generation` nodes, newest first. Each generation gets its own
# damper id — SRAM revises internals under an unchanged badge.
# Every fork here is air-sprung: each generation writes its Pressure (with the
# published maximum) and, where the Bottomless Token maximum is published, a
# Volume Spacers entry once as an anchor that its trims alias.
# --------------------------------------------------------------------------
nodes:
  - label: "SID SL"
    level: model
    category: XC
    tasks:
      fork:full_service: &rockshox_full_service { interval: { moving_time_h: 200 }, fallback: { days: 365 }, source: RockShox service intervals }
    children:
      - label: "2026–2027"
        level: generation
        id: "2026"
        draft: true
        years: "2026-2027"
        url: https://www.sram.com/en/rockshox/series/sid-sl
        guide: rockshox_sid_sl_2026
        children:
          - label: Ultimate
            level: trim
            specs: { stanchion: 32mm, spring: Air }
            adjustments: &sid_sl_e1_air_spring
              - { name: Pressure, type: numerical, unit: psi, min: 0, max: 195 }
              - { name: Volume Spacers, type: step, max: 3, unit: tokens, visualization: stepper, notes: Bottomless Tokens }
            options:
              damper: [charger_race_day_2]
              travel_mm: [100, 110]
              wheel_size: [29]
          - label: Select+
            level: trim
            specs: { stanchion: 32mm, spring: Air }
            adjustments: *sid_sl_e1_air_spring
            options:
              damper: [charger_race_day_2]
              travel_mm: [100, 110]
              wheel_size: [29]
            note: OEM only
      - label: "2024–2025"
        level: generation
        id: "2025"
        draft: true
        years: "2024-2025"
        url: https://www.sram.com/en/rockshox/series/sid-sl
        guide: rockshox_sid_sl_2025
