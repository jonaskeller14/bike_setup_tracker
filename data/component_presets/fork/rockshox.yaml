# RockShox mountain-bike forks — adjustment preset database
#
# Same design as fork/fox.yaml and fork/ohlins.yaml: click ranges belong to the
# DAMPER cartridge, defined once under `dampers:` and referenced by key from
# each fork's trims. See SCHEMA.md in this folder.

brand: RockShox
component_type: fork
sources:
  - https://www.sram.com/en/rockshox/products/forks
  - https://www.sram.com/en/rockshox/learn/charger-3-setup
  - https://flowmountainbike.com/tests/2025-rockshox-zeb-lyrik-pike-fork-review/
  - https://enduro-mtb.com/en/rockshox-2025-fork-charger-review/
  - https://support.rockshox.com/hc/en-us/articles/26413299077659-How-did-the-adjustment-range-of-Low-Speed-Compression-and-High-Speed-Compression-change-on-RockShox-Charger-3-1/
updated: 2026-07-05
# Click ranges from SRAM/RockShox support documentation and official product
# pages (sram.com). Charger 3/3.1 compression is counted from the MIDDLE detent
# (HSC -2..+2, LSC -7..+7) and stored with those literal ranges plus
# `visualization: dial_cw` (increasing value = clockwise; -2 lies
# counterclockwise of the 0 detent). Rebound is 0-18, counted from fully OPEN.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
dampers:
  charger_3_1:
    name: Charger 3.1
    description: >
      Updated Charger damper for 2025 Pike, Lyrik, ZEB. Same click counts as
      Charger 3 but improved damping curve, especially in LSC open positions
      (68% more oil flow) and overall reduced damping baseline. RC2 variant
      adds remote control.
    adjustments:
      - { name: High-Speed Compression, type: step, min: -2, max: 2, visualization: dial_cw, notes: Counted from the middle detent }
      - { name: Low-Speed Compression,  type: step, min: -7, max: 7, visualization: dial_cw, notes: Counted from the middle detent }
      - { name: Rebound, type: step, max: 18, notes: Counted from fully open (fastest) }
    note: >
      The +/- symbol on each compression dial indicates direction relative to
      the white etched indicator line.

  charger_3_2:
    name: Charger 3.2
    description: >
      Charger for 2027+ Pike, Lyrik, ZEB, BoXXer. Likely same click counts as
      Charger 3.1 but with further refinements; exact damping internals not
      independently confirmed for 3.2 generation.
    adjustments:
      - { name: High-Speed Compression, type: step, min: -2, max: 2, visualization: dial_cw, notes: Counted from the middle detent }
      - { name: Low-Speed Compression,  type: step, min: -7, max: 7, visualization: dial_cw, notes: Counted from the middle detent }
      - { name: Rebound, type: step, max: 18, notes: Counted from fully open (fastest) }
    note: Same counting method as Charger 3.1.

  charger_race_day_2:
    name: Charger Race Day 2
    description: >
      Lightweight XC damper (SID SL, SID, Reba Ultimate, Rudy XPLR/XL).
      Simpler tuning range than Charger 3.x aimed at marathon/XC racing.
      Exact click counts not confirmed; flagged as follow-up.
    adjustments: []
    note: "Click counts unconfirmed — verify against SRAM official docs"

  motion_control:
    name: Motion Control
    description: Simplified trail damper (Reba, Psylo). Entry-level tuning.
    adjustments: []
    note: "Click counts unconfirmed"

  isolator_rl:
    name: Isolator RL
    description: Remote lockout trail damper. Click counts unconfirmed.
    adjustments: []
    note: "Click counts unconfirmed"

# --------------------------------------------------------------------------
# Forks — current (2025/2026/2027) RockShox lineup.
# Every current RockShox fork is air-sprung, so trims share the `&air_spring`
# anchor (Pressure only; Bottomless Token counts are not published per model,
# so no Volume Spacers adjustment is generated — see follow-ups).
# --------------------------------------------------------------------------
forks:
  - model: "SID SL"
    category: XC
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/sid-sl
    wheel_size: [29]
    trims:
      - trim: Ultimate
        travel_mm: [100, 110]
        stanchion: 32mm
        spring: Air
        dampers: [charger_race_day_2]
        adjustments: &air_spring
          - { name: Pressure, type: numerical, unit: psi, min: 0 }
      - trim: Select+
        travel_mm: [100, 110]
        stanchion: 32mm
        spring: Air
        dampers: [charger_race_day_2]
        adjustments: *air_spring
        note: OEM only

  - model: "SID"
    category: XC
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/sid
    wheel_size: [29]
    trims:
      - trim: Ultimate
        travel_mm: [110, 120]
        stanchion: 35mm
        spring: Air
        dampers: [charger_race_day_2]
        adjustments: *air_spring
      - trim: Select+
        travel_mm: [110, 120]
        stanchion: 35mm
        spring: Air
        dampers: [charger_race_day_2]
        adjustments: *air_spring
        note: OEM only

  - model: "Reba"
    category: XC / Trail
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/reba
    wheel_size: [29]
    trims:
      - trim: Ultimate
        travel_mm: [100, 120, 130]
        stanchion: 35mm
        spring: Air
        dampers: [charger_race_day_2, isolator_rl]
        adjustments: *air_spring
      - trim: Select+
        travel_mm: [100, 120, 130]
        stanchion: 35mm
        spring: Air
        dampers: [charger_race_day_2]
        adjustments: *air_spring
        note: OEM only

  - model: "Pike"
    category: Trail
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/pike
    wheel_size: [29, 27.5]
    trims:
      - trim: Ultimate
        travel_mm: [120, 130, 140]
        stanchion: 35mm
        spring: Air
        dampers: [charger_3_1]
        adjustments: *air_spring
      - trim: Ultimate Flight Attendant
        travel_mm: [120, 130, 140]
        stanchion: 35mm
        spring: Air
        dampers: [charger_3_1]
        adjustments: *air_spring
        note: Electronic damper adjustment
      - trim: Select+
        travel_mm: [120, 130, 140]
        stanchion: 35mm
        spring: Air
        dampers: [charger_3_1]
        adjustments: *air_spring
      - trim: Select
        travel_mm: [130]
        stanchion: 35mm
        spring: Air
        dampers: [charger_3_1]
        adjustments: *air_spring
        note: OEM only
      - trim: Base
        travel_mm: [130]
        stanchion: 35mm
        spring: Air
        dampers: [charger_3_1]
        adjustments: *air_spring
        note: OEM only

  - model: "Lyrik"
    category: Trail / All-Mountain
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/lyrik
    wheel_size: [29, 27.5]
    trims:
      - trim: Ultimate
        travel_mm: [140, 150, 160, 170]
        stanchion: 35mm
        spring: Air
        dampers: [charger_3_1]
        adjustments: *air_spring
      - trim: Select+
        travel_mm: [140, 150, 160, 170]
        stanchion: 35mm
        spring: Air
        dampers: [charger_3_1]
        adjustments: *air_spring
      - trim: Select
        travel_mm: [140, 160]
        stanchion: 35mm
        spring: Air
        dampers: [charger_3_1]
        adjustments: *air_spring
        note: OEM only

  - model: "ZEB"
    category: Enduro
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/zeb
    wheel_size: [29, 27.5]
    trims:
      - trim: Ultimate
        travel_mm: [150, 160, 170, 180]   # 10mm increments
        stanchion: 38mm
        spring: Air
        dampers: [charger_3_1]
        adjustments: *air_spring
      - trim: Select+
        travel_mm: [160, 170, 180]
        stanchion: 38mm
        spring: Air
        dampers: [charger_3_1]
        adjustments: *air_spring
      - trim: Select
        travel_mm: [160, 170]
        stanchion: 38mm
        spring: Air
        dampers: [charger_3_1]
        adjustments: *air_spring
        note: OEM only

  - model: "BoXXer"
    category: Downhill
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/boxxer
    wheel_size: [29, 27.5]
    trims:
      - trim: Ultimate
        stanchion: 38mm (dual-crown)
        spring: Air
        dampers: [charger_3_1]   # or RC2 variant
        adjustments: *air_spring
      - trim: Select+
        stanchion: 38mm (dual-crown)
        spring: Air
        dampers: [charger_3_1]
        adjustments: *air_spring
        note: OEM only

  - model: "Rudy XPLR"
    category: Gravel / Bikepacking
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/rudy-xplr
    wheel_size: ["700c"]
    trims:
      - trim: Ultimate
        travel_mm: [40]
        stanchion: 30mm
        spring: Air
        dampers: [charger_race_day_2]
        adjustments: *air_spring

  - model: "Rudy XL"
    category: Gravel / Bikepacking
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/rudy-xl
    wheel_size: ["700c"]
    trims:
      - trim: Ultimate
        travel_mm: [60]
        stanchion: 30mm
        spring: Air
        dampers: [charger_race_day_2]
        adjustments: *air_spring
    note: Fits 29x2.2" tires max

