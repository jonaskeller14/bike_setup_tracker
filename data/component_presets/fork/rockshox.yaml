# Follow-ups (not yet captured — avoid guessing):
#   - Charger RC (Pike/Lyrik/ZEB Select, 2023-2027) and Delta RC (2027 Base):
#     SRAM's service manual shows an LSC knob and a rebound knob on both but
#     publishes no click counts, so the Select trim is intentionally not listed
#     on those models. Add it once a count is published.
#   - Rush RC / Rush RL low-speed compression click count — the rebound count
#     (16) is published in the service manuals, the LSC count is not.
#   - Charger 3.2 RC2 click counts — SRAM confirms a different tune and range
#     from Charger 3/3.1 but publishes no numbers. BoXXer (2027) stays
#     `complete: false` until they do.
#   - Charger Race Day / Race Day 2 rebound click counts (SID, SID SL, Reba,
#     Rudy) — not published; the 2P/3P compression lever positions are known but
#     which fork gets which is not documented per trim.
#   - Charger 2.1 RC2 (BoXXer 2019-2023) and Motion Control RC / RL (Yari,
#     Revelation, Recon, Reba) click counts — not published by SRAM.
#   - Bottomless Token maxima are recorded per model from the 2023 Front
#     Suspension Specifications and the 2023-2027 ZEB/Lyrik/Pike service manual.
#     Still missing: BoXXer D1/D2 (38mm), Psylo, Domain C1, current SID/SID SL
#     (D1/E1) and the SIDLuxe-style Linear XL forks.
