#     the middle (-7..+7) but its rebound total is not published. BoXXer 2027
#     Select stays `draft: true` for that reason.
#   - Rush RC / Rush RL low-speed compression click count — the rebound count
#     (16) is published in the service manuals, the LSC count is not.
#   - Charger 3.2 RC2 rebound click count — the HSC (-2..+2) and LSC (-7..+7)
#     positions are read off SRAM's Suspension User Manual (open = -2 / -7,
#     middle = 0); rebound carries 18 from the Charger 3 / 3.1 article and is
#     an estimate for 3.2. The Flight
#     Attendant LSC is documented as a 10/11-position dial (middle 5 or 6) and
#     is stored with the RC2 ranges because Flight Attendant sets it electronically.
#   - Charger Race Day / Race Day 2 rebound click counts (SID, SID SL, Rudy) —
#     not published, so rebound carries `max: ~`. The 2P/3P compression lever
#     positions are known but which fork gets which is not documented per trim,
#     so the trims with these dampers stay `draft: true`.
#   - Charger 2.1 RC2 (BoXXer 2019-2023): no click counts, and no statement
#     whether HSC/LSC count from an end stop or the middle. Stays `draft: true`.
#   - Motion Control RC (Yari, Revelation): no click counts; whether the
#     compression dial is click-indexed is not documented. Stays `draft: true`.
#   - Rebound totals of Charger 2 RL, Charger RL and Motion Control RL (SID /
#     SID SL Select+ and Select, Reba, Recon Gold) — not published, so rebound
#     carries `max: ~`.
#   - Bottomless Token maxima are recorded per model from the 2023-2027 Front
#     Suspension Specifications, the 2019-2023 BoXXer and 2023-2027
#     ZEB/Lyrik/Pike service manuals. Still missing: SID SL D1 (2024-2025),
#     whose MY24/25 token page was not transcribed.
#   - Maximum air pressure: from the Front Suspension Specifications where one
#     figure covers the whole generation. Pike C1, Yari, Revelation and Recon
#     Gold print a different maximum per travel and carry none. BoXXer D1/D2:
#     the PDFs print 300 psi, TrailHead and the support knowledge base 260, so
#     D2 keeps 260 and D1 none until SRAM confirms one.
#   - ZEB Base (2023-2026, FS-ZEB-BSE-A2): the specification PDFs print its damper
#     as Charger R, while SRAM's model page lists the Rush RC, which the catalog
#     and the rebound rules follow. FS-ZEB-BSE-A3 (Delta RC, 2027 spec) is not
#     listed, like the other Delta RC trims.
#   - SID SL 2024-2025 (D1, DebonAir) and 2026-2027 (E1, DebonAir+) are split
#     by their different pressure decals; the travel and damper options of the
#     earlier single generation are carried over to both.
#   - Reba Gold/RL B1 (2026+, 80-130 mm, Isolator RL damper) is not modelled:
#     no adjuster ranges are published for the RL variant.
#   - The BoXXer "2027" generation is labelled by the earlier research; SRAM's
#     support site files BoXXer D2 under MY26, so its `years` may need
#     correcting once a model year is confirmed.
#   - Pre-2016 Pike/Lyrik generations (Charger 1, Dual Position Air, Solo Air)
#     are not covered — needs the matching year's Front Suspension
#     Specifications PDF.
#   - Setup guides (`setup_guide`) only exist for Pike/Lyrik/ZEB and BoXXer
#     (SRAM Charger 3 Setup / DH Suspension Welcome Guide). SID, Reba, Rudy and
#     the legacy forks have no model-specific official setup page.
#   - Dial colors: no SRAM source states the knob colors of the Charger
#     compression dials, so they keep the default.
