# Counting conventions, verified per damper against SRAM material:
#   * Charger 3 / 3.1 / 3.2 compression counts from the MIDDLE detent — HSC has
#     5 positions (-2..+2), LSC has 15 positions (-7..+7). Stored with those
#     literal ranges plus `visualization: dial_cw` (increasing value = clockwise;
#     -2 lies counterclockwise of the 0 detent).
#   * Rebound on every RockShox fork damper is counted from fully OPEN (fastest),
#     so `min: 0` with the default `dial_ccw`.
# Damper-per-trim assignments come from the exploded views in the 2023-2027
# ZEB/Lyrik/Pike service manual (pp. 12-31), not from marketing copy.
#
# Service intervals (`tasks`) come from the SRAM/RockShox "Service Intervals"
# chart (GEN.0000000005593 Rev H):
#   * 50 h lower leg service for the families it lists. SID SL, Psylo, Rudy XL
#     and BoXXer are not among them, so they keep the generic template.
#   * 200 h damper and spring service; "1 year" is the spare-parts catalog's
#     "200 HOUR/1 YEAR SERVICE KIT" for every model here, Psylo and Rudy XL included.
#   * BoXXer (2024+) adds a 100 h spring service.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    charger_3:
      name: Charger 3 RC2
      description: |-
        - Independent high- and low-speed compression circuits, both counted from a centre detent
        - HSC is a 5-position dial, LSC a 15-position dial, rebound 18 clicks
        - Fitted to 2023-2024 Pike, Lyrik and ZEB Ultimate / Select+
      description_de: |-
        - Unabhängige High- und Low-Speed-Druckstufenkreise, beide von einer mittleren Raste gezählt
        - HSC ist ein Rad mit 5 Positionen, LSC ein Rad mit 15 Positionen, Zugstufe 18 Klicks
        - Verbaut an Pike, Lyrik und ZEB Ultimate / Select+ der Modelljahre 2023-2024
      description_fr: |-
        - Circuits de compression haute et basse vitesse indépendants, tous deux comptés depuis un cran central
        - Le HSC est une molette à 5 positions, le LSC une molette à 15 positions, la détente 18 clics
        - Monté sur les Pike, Lyrik et ZEB Ultimate / Select+ 2023-2024
      description_it: |-
        - Circuiti di compressione ad alta e bassa velocità indipendenti, entrambi contati a partire da uno scatto centrale
        - L’HSC è una manopola a 5 posizioni, l’LSC una a 15 posizioni, il ritorno 18 scatti
        - Montata su Pike, Lyrik e ZEB Ultimate / Select+ 2023-2024
      description_es: |-
        - Circuitos independientes de compresión de alta y baja velocidad, ambos contados desde una muesca central
        - El HSC es una rueda de 5 posiciones, el LSC una de 15 posiciones y el rebote tiene 18 clics
        - Montado en las Pike, Lyrik y ZEB Ultimate / Select+ 2023-2024
      description_pt: |-
        - Circuitos independentes de compressão de alta e baixa velocidade, ambos contados a partir de um clique central
        - O HSC é um seletor de 5 posições, o LSC um de 15 posições e o retorno tem 18 cliques
        - Instalado nas Pike, Lyrik e ZEB Ultimate / Select+ 2023-2024
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, min: -2, max: 2, visualization: dial_cw, notes: "High-Speed Compression; Counted from the middle detent", notes_de: High-Speed-Druckstufe; von der mittleren Raste gezählt, notes_fr: Compression haute vitesse ; comptée depuis le cran médian, notes_it: Compressione ad alta velocità; contata a partire dallo scatto centrale, notes_es: Compresión de alta velocidad; contada desde la muesca central, notes_pt: Compressão de alta velocidade; contada a partir do clique central }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, min: -7, max: 7, visualization: dial_cw, notes: "Low-Speed Compression; Counted from the middle detent", notes_de: Low-Speed-Druckstufe; von der mittleren Raste gezählt, notes_fr: Compression basse vitesse ; comptée depuis le cran médian, notes_it: Compressione a bassa velocità; contata a partire dallo scatto centrale, notes_es: Compresión de baja velocidad; contada desde la muesca central, notes_pt: Compressão de baixa velocidade; contada a partir do clique central, dialSize: small }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 18, notes: Counted from fully open (fastest), notes_de: Von ganz offen (am schnellsten) gezählt, notes_fr: Compté depuis la position entièrement ouverte (la plus rapide), notes_it: Contato a partire dalla posizione completamente aperta (la più rapida), notes_es: Contado desde la posición totalmente abierta (la más rápida), notes_pt: Contado a partir da posição totalmente aberta (a mais rápida), dialColor: red }
      source:
        - https://support.rockshox.com/hc/en-us/articles/5910471591579-What-is-the-range-of-adjustability-on-Charger-3
        - https://support.rockshox.com/hc/en-us/articles/5930461078683-What-RockShox-forks-come-with-Charger-3-dampers
        - https://www.sram.com/en/rockshox/learn/fork-deep-dives/compression-knob-logic
        - https://freehub.com/product-reviews/2014-rockshox-pike-rct3-160mm-review
      note: >-
        RockShox states "15 clicks of Low Speed Compression, 5 clicks of High Speed
        Compression, and 18 clicks of Rebound". The 15/5 compression dials are the
        centre-detent -7..+7 and -2..+2 ranges. Per RockShox's "Compression Knob
        Logic" page, HSC is the larger of the two knobs and LSC is the smaller one
        stacked on top of it.

    charger_3_1:
      name: Charger 3.1 RC2
      description: |-
        - Same adjuster layout and click count as Charger 3, with a wider useful range per click
        - More open LSC at the open end and firmer HSC at the closed end
        - Fitted to 2025-2027 Pike, Lyrik and ZEB Ultimate / Select+
      description_de: |-
        - Gleiche Verstellerausstattung und Klickzahl wie beim Charger 3, mit größerem nutzbarem Bereich pro Klick
        - Offener LSC am offenen Ende und festerer HSC am geschlossenen Ende
        - Verbaut an Pike, Lyrik und ZEB Ultimate / Select+ der Modelljahre 2025-2027
      description_fr: |-
        - Même disposition des réglages et même nombre de clics que le Charger 3, avec une plage utile plus large par clic
        - LSC plus ouvert côté ouvert et HSC plus ferme côté fermé
        - Monté sur les Pike, Lyrik et ZEB Ultimate / Select+ 2025-2027
      description_it: |-
        - Stessa disposizione dei regolatori e stesso numero di scatti del Charger 3, con una gamma utile più ampia per scatto
        - LSC più aperto all’estremo aperto e HSC più rigido all’estremo chiuso
        - Montata su Pike, Lyrik e ZEB Ultimate / Select+ 2025-2027
      description_es: |-
        - Misma disposición de ajustes y mismo número de clics que el Charger 3, con un rango útil más amplio por clic
        - LSC más abierto en el extremo abierto y HSC más firme en el extremo cerrado
        - Montado en las Pike, Lyrik y ZEB Ultimate / Select+ 2025-2027
      description_pt: |-
        - Mesma disposição de ajustes e mesmo número de cliques do Charger 3, com uma faixa útil mais ampla por clique
        - LSC mais aberto no extremo aberto e HSC mais firme no extremo fechado
        - Instalado nas Pike, Lyrik e ZEB Ultimate / Select+ 2025-2027
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, min: -2, max: 2, visualization: dial_cw, notes: "High-Speed Compression; Counted from the middle detent", notes_de: High-Speed-Druckstufe; von der mittleren Raste gezählt, notes_fr: Compression haute vitesse ; comptée depuis le cran médian, notes_it: Compressione ad alta velocità; contata a partire dallo scatto centrale, notes_es: Compresión de alta velocidad; contada desde la muesca central, notes_pt: Compressão de alta velocidade; contada a partir do clique central }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, min: -7, max: 7, visualization: dial_cw, notes: "Low-Speed Compression; Counted from the middle detent", notes_de: Low-Speed-Druckstufe; von der mittleren Raste gezählt, notes_fr: Compression basse vitesse ; comptée depuis le cran médian, notes_it: Compressione a bassa velocità; contata a partire dallo scatto centrale, notes_es: Compresión de baja velocidad; contada desde la muesca central, notes_pt: Compressão de baixa velocidade; contada a partir do clique central, dialSize: small }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 18, notes: Counted from fully open (fastest), notes_de: Von ganz offen (am schnellsten) gezählt, notes_fr: Compté depuis la position entièrement ouverte (la plus rapide), notes_it: Contato a partire dalla posizione completamente aperta (la più rapida), notes_es: Contado desde la posición totalmente abierta (la más rápida), notes_pt: Contado a partir da posição totalmente aberta (a mais rápida), dialColor: red }
      source:
        - https://support.rockshox.com/hc/en-us/articles/26413313637531-Does-the-RockShox-Charger-3-1-damper-offer-more-clicks-of-adjustment
        - https://support.rockshox.com/hc/en-us/articles/26413299077659-How-did-the-adjustment-range-of-Low-Speed-Compression-and-High-Speed-Compression-change-on-RockShox-Charger-3-1
        - https://www.sram.com/en/rockshox/learn/fork-deep-dives/compression-knob-logic
        - https://freehub.com/product-reviews/2014-rockshox-pike-rct3-160mm-review
      note: >-
        RockShox: "Charger 3.1 offers the same number of adjustment clicks as
        Charger 3, but with a broader range of adjustment." Counts therefore carried
        over from the Charger 3 range-of-adjustability article, not inferred.
      dial_marking: >-
        The +/- symbol on each compression dial shows direction relative to the
