# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - RST publishes NO click/turn counts anywhere (product pages, technology
#     page, the general/high-end owner's manuals, the 2026 catalogue). Every
#     external compression / rebound / hydraulic-lockout adjuster (OCR+, OCR2,
#     OCR2+, OCRC+, BO-TNL, HCR, TNL, TNL-F, TNL-R, RA) is therefore left as
#     `adjustments: []` and every model using one is `draft: true`. Only
#     CAPA (mechanical MLC lockout + undamped T) is fully described.
#   - Hydraulic lockout (TNL / BO-TNL / OCR+ lock-out) is described in the
#     owner's manual as a progressive compression-to-lockout control, not a
#     binary switch, so it was not modelled as a boolean.
#   - Air-spring volume adjustment, negative-spring behaviour and exact coil
#     spring rates/options are not published per model; only Pressure (air) or
#     Spring Rate + Preload (coil) are listed.
#   - Product-page spec tables are partly garbled (columns not aligned with
#     model codes). Damper-per-trim assignments were read literally where the
#     columns were clean; the following are best-effort and should be
#     re-checked against RST directly:
#       * F1RST (f1rst-3): the table lists a Compress-adjust damper against a
#         27.5" column only; Air is mapped to BO-TNL with compress adjust and
#         Air-TRL to BO-TNL without, mirroring the sibling F1RST 110 page.
#       * VIBE V2: the table shows "29 AIR-RL" twice; only one Air-RL trim is
#         listed. RL trims are mapped to the TNL lockout damper.
#       * BLADE: four damper cells cover eight model columns; the -F / -R
#         suffix (fixed / adjustable rebound) is used to map RL variants to
#         TNL-F and RL-R variants to TNL-R.
#       * ROGUE V2: the "Compress adjust / Lock-Out / Rebound adjust" cell
#         spans Air and Air-TRL; Air-TRL is mapped to the same damper.
#   - Model years are not published by RST; no `years` set.
#   - Left out: JUNIOR F1RST / AERIAL 16-26" forks (spec table too garbled to
#     map dampers reliably), SIGMA / GUIDE DC e-moto forks,
#     E-city/trekking (VOYAGE, AVION, PULSE, VOLTA, VOLAIR E, VOLAR, VOGUE E,
#     VIVAIR E, VOLANT, AVALON), cargo (BEAST, PORTER) and gravel (SS, STEM
#     SHOCK) forks.
# --------------------------------------------------------------------------
