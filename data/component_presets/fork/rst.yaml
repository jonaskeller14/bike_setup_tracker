# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - setup_guide: the "high-end models" owner's manual (XC1800-123) names AERIAL,
#     BLADE/PRO, F1RST, KILLAH, REBEL, RENEGADE, REVO, ROGUE, SNYPER, STITCH,
#     STORM and VIBE; the general manual (XC1800-109) names CAPA, BLAZE, GUIDE,
#     OMEGA and mentions DIRT. SLOPE is named in a pressure table of the
#     high-end manual, so it carries that link. SPACE, SHINE and VIVO are not
#     named in either text (the Dirt Jump manual XC1800-105 is a scanned
#     image), so they carry no setup_guide. STITCH 29 Limited Edition is assumed to share the
#     STITCH manual.
#   - Dial colors: no RST page or manual names an adjuster color.
#   - RST publishes NO click/turn counts anywhere (product pages, technology
#     page, the general/high-end owner's manuals, the 2026 catalogue). Every
#     external compression / rebound / hydraulic-lockout adjuster (OCR+, OCR2,
#     OCR2+, OCRC+, BO-TNL, HCR, TNL, TNL-F, TNL-R, RA) is therefore left as
#     `adjustments: []` and every trim using one is `draft: true`. Nothing says
#     whether these knobs are click-indexed or where they count from, so
#     `max: ~` does not apply either. Only the MLC (mechanical lockout), the
#     undamped T and the fixed-rebound DIRT R trims are fully described.
#   - Hydraulic lockout (TNL / BO-TNL / OCR+ lock-out) is described in the
#     owner's manual as a progressive compression-to-lockout control, not a
#     binary switch, so it was not modelled as a boolean.
#   - Air-spring volume adjustment, negative-spring behaviour and exact coil
#     spring rates/options are not published per model; only Pressure (air) or
#     Spring Rate + Preload (coil) are listed.
#   - Product-page spec tables are partly garbled (columns not aligned with
