# RST mountain-bike forks — adjustment preset database
#
# Same design as fork/suntour.yaml, fork/rockshox.yaml: click ranges belong to
# the DAMPER cartridge, defined once under `dampers:` and referenced by key
# from each fork's trims. See SCHEMA.md in this folder.
#
# RST (RST Greenergy Tech Co., Taiwan) is a value/OEM-focused brand. Its
# product pages list, per model code, which functions are fitted ("Compress
# adjust", "Rebound adjust", "Lock-Out", ...) but NEVER publish a click count
# or turn count — neither do the owner's manuals or the 2026 catalogue. So
# every hydraulic adjuster below is left out of `adjustments:` and the models
# using it are `complete: false` (hidden from the picker until counts exist).
# Only the air Pressure / coil Spring Rate + Preload springs and the binary
# mechanical lockout (MLC) are captured. See the Follow-ups footer.
#
# RST does not publish model years, and the site shows only the current
# catalogue, so no `year_range:` is set and trim keys carry no year suffix.
# Model names follow the product page titles; where one title covers two
# chassis (F1RST / AERIAL exist as a 110mm-Boost and a 100mm-spacing XC fork),
# the 110mm-hub one is named "F1RST 110" / "AERIAL 110" as RST's own pages do.
# Junior forks other than CAPA/VIVO, e-city/trekking/cargo/gravel/e-moto forks
# are out of scope.

brand: RST
component_type: fork
sources:
  - https://rstsuspension.com/product-category/forks/
  - https://rstsuspension.com/technology/
  - https://rstsuspension.com/owner-manual/
