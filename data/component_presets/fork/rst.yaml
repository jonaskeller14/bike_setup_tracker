# --------------------------------------------------------------------------
# Setup guides — transcribed from docs/research/setup_guides/rst.md.
#   * The high-end owner's manual (XC1800-123) prints rider weight (kg) →
#     psi tables headed by model lists. "ROGUE … SLOPE … F1RST series …
#     AERIAL series" maps to ROGUE V2, SLOPE, F1RST (110) and AERIAL (110);
#     "STITCH, SPACE Jump" maps to the STITCH family (STITCH 29 and the
#     Limited Edition are assumed to share it). Its F1RST Platinum and VOGUE
#     tables have no catalog node.
#   * The brackets share their printed bounds (40-60, 60-80), read half-open.
#   * SPACE Jump is left out: the Dirt Jump manual (XC1800-105) gives it a
#     different table, and which one applies is unresolved.
#   * The SAG band covers every fork the manual names, coil trims included.
# --------------------------------------------------------------------------
guides:
  rst_highend_forks:
    label: RST owner's manual, high-end models (XC1800-123)
    label_de: RST Bedienungsanleitung, Highend-Modelle (XC1800-123)
    label_fr: Manuel d’utilisation RST, modèles haut de gamme (XC1800-123)
    label_it: Manuale d’uso RST, modelli di fascia alta (XC1800-123)
    label_es: Manual del usuario RST, modelos de gama alta (XC1800-123)
    label_pt: Manual do usuário RST, modelos de topo de linha (XC1800-123)
    source: https://rstsuspension.com/wp-content/uploads/2026/02/01-%E8%AA%AA%E6%98%8E%E6%9B%B8-XC1800-123%E9%AB%98%E9%9A%8E%E6%A9%9F%E7%A8%AE-%E8%8B%B1%E6%96%87ENGLISH_A4.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { model: [rogue-v2, slope, f1rst, f1rst-110, aerial, aerial-110] }
        rows: { 40-60: 60, 60-80: [60, 80], 80-100: [80, 100], 100-110: [100, 120], 110-120: [120, 150] }
      # The last printed row (100-120 kg → 120 psi, right after 55-65 psi)
      # looks misprinted, so it is left out until RST confirms it.
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { model: [stitch, stitch-29, stitch-29-limited-edition] }
        rows: { 20-40: [30, 40], 40-60: [35, 40], 60-80: [45, 55], 80-100: [55, 65] }
      - { target: sag, range: [15, 25] }

