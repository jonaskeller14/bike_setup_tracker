# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
# Function sets are read from each product page's "Damper" row and the
# definitions on https://rstsuspension.com/technology/ (OCR platform, BO-TNL,
# HCR, OCR) and the high-end owner's manual (lockout/rebound operation).
dampers:
  ocrc_plus:
    name: OCRC+
    description: >-
      Open-bath hydraulic damper with external compression and rebound
      adjusters. Adjustments incomplete: please add Compression and Rebound
      yourself.
    adjustments: []
    source:
      - https://rstsuspension.com/products/killah/
      - https://rstsuspension.com/products/stitch-2/
      - https://rstsuspension.com/technology/

  ocr2_plus:
    name: OCR2+
    description: >-
      Open-bath hydraulic damper with external compression and rebound
      adjusters. Adjustments incomplete: please add Compression and Rebound
      yourself.
    adjustments: []
    source:
      - https://rstsuspension.com/products/r-evo-29/
      - https://rstsuspension.com/products/stitch/
      - https://rstsuspension.com/products/stitch-29-limited-edition/
      - https://rstsuspension.com/products/rogue-v2-2/
      - https://rstsuspension.com/technology/

  ocr2_plus_lockout:
    name: OCR2+ (Lock-Out)
    description: >-
      Open-bath hydraulic damper with external compression and rebound
      adjusters plus a hydraulic lockout (handlebar remote on TRL trims).
      Adjustments incomplete: please add Compression and Rebound yourself.
    adjustments: []
    source:
      - https://rstsuspension.com/products/rogue-v2-2/

  ocr_plus:
    name: OCR+
    description: >-
      Open-bath hydraulic damper with external compression and rebound
      adjusters. Adjustments incomplete: please add Compression and Rebound
      yourself.
    adjustments: []
    source:
      - https://rstsuspension.com/products/rebel-v2/
      - https://rstsuspension.com/technology/

  ocr_plus_lockout:
    name: OCR+ (Lock-Out)
    description: >-
      Open-bath hydraulic damper with external compression and rebound
      adjusters plus a crown-mounted hydraulic lockout. Adjustments
      incomplete: please add Compression and Rebound yourself.
    adjustments: []
    source:
      - https://rstsuspension.com/products/rebel-v2/

  ocr_plus_rl:
    name: OCR+ (Remote Lock-Out)
    description: >-
      Open-bath hydraulic damper with external rebound adjuster and a
      handlebar-remote hydraulic lockout. Adjustments incomplete: please add
      Rebound yourself.
    adjustments: []
    source:
      - https://rstsuspension.com/products/rebel-v2/

  ocr2:
    name: OCR2
    description: >-
      Open-bath hydraulic damper with external compression and rebound
      adjusters. Adjustments incomplete: please add Compression and Rebound
      yourself.
    adjustments: []
    source:
      - https://rstsuspension.com/products/slope/

  bo_tnl_crl:
    name: BO-TNL
    description: >-
      Blow-off protected damper with external compression adjust, hydraulic
      lockout and rebound adjust. Adjustments incomplete: please add
      Compression and Rebound yourself.
    adjustments: []
    source:
      - https://rstsuspension.com/products/f1rst/
      - https://rstsuspension.com/products/f1rst-3/
      - https://rstsuspension.com/products/blade-pro/
      - https://rstsuspension.com/products/renegade/
      - https://rstsuspension.com/products/snyper/
      - https://rstsuspension.com/technology/

  bo_tnl_rl:
    name: BO-TNL (Remote Lock-Out)
    description: >-
      Blow-off protected damper with rebound adjust and a handlebar-remote
      hydraulic lockout. Adjustments incomplete: please add Rebound yourself.
    adjustments: []
    source:
      - https://rstsuspension.com/products/f1rst/
      - https://rstsuspension.com/products/f1rst-3/
      - https://rstsuspension.com/products/blade-pro/
      - https://rstsuspension.com/products/renegade/
      - https://rstsuspension.com/products/snyper/
      - https://rstsuspension.com/technology/

  hcr:
    name: HCR
    description: >-
      Hydraulic compression damper with external compression and rebound
      adjusters, no lockout. Adjustments incomplete: please add Compression
      and Rebound yourself.
    adjustments: []
    source:
      - https://rstsuspension.com/products/blade-pro/
      - https://rstsuspension.com/products/vivo/
      - https://rstsuspension.com/technology/

  tnl:
    name: TNL
    description: >-
      Hydraulic lockout damper. Adjustments incomplete: please add the
      Lockout control yourself.
    adjustments: []
    source:
      - https://rstsuspension.com/products/aerial/
      - https://rstsuspension.com/products/aerial-2/
      - https://rstsuspension.com/products/omega/
      - https://rstsuspension.com/products/blaze/
      - https://rstsuspension.com/products/vibe-v2/
      - https://rstsuspension.com/products/vivo/
      - https://rstsuspension.com/products/guide/
      - https://rstsuspension.com/products/renegade/

  tnl_f:
    name: TNL-F
    description: >-
      Hydraulic lockout damper with fixed (non-adjustable) rebound.
      Adjustments incomplete: please add the Lockout control yourself.
    adjustments: []
    source:
      - https://rstsuspension.com/products/blade/

  tnl_r:
    name: TNL-R
    description: >-
      Hydraulic lockout damper with external rebound adjust. Adjustments
      incomplete: please add Rebound and the Lockout control yourself.
    adjustments: []
    source:
      - https://rstsuspension.com/products/blade/

  mlc:
    name: MLC
    description: >-
      Mechanical lockout that locks the fork at any point in its travel.
    adjustments:
      - { name: Lockout, type: boolean, notes: Mechanical lock-out }
    source:
      - https://rstsuspension.com/products/aerial/
      - https://rstsuspension.com/products/capa/
      - https://rstsuspension.com/technology/
      - https://rstsuspension.com/wp-content/uploads/2026/02/01-%E8%AA%AA%E6%98%8E%E6%9B%B8-XC1800-123%E9%AB%98%E9%9A%8E%E6%A9%9F%E7%A8%AE-%E8%8B%B1%E6%96%87ENGLISH_A4.pdf

  ra:
    name: RA
    description: >-
      Simple damper with external rebound adjust. Adjustments incomplete:
      please add Rebound yourself.
    adjustments: []
    source:
      - https://rstsuspension.com/products/vibe-v2/
      - https://rstsuspension.com/products/storm/
      - https://rstsuspension.com/products/space/
      - https://rstsuspension.com/products/shine/
      - https://rstsuspension.com/products/dirt/

# --------------------------------------------------------------------------
# Forks — RST's current MTB lineup (2026 catalogue): downhill, enduro,
# XC/trail, dirt jump, junior and fat-bike forks.
# --------------------------------------------------------------------------
forks:
  # ---- Downhill -----------------------------------------------------------
  - model: "KILLAH"
    complete: false
    category: Downhill
    url: https://rstsuspension.com/products/killah/
    wheel_size: [27.5, 26]
    trims:
      - trim: Air
        key: fork-rst-killah-air
        travel_mm: [200]
        stanchion: 36mm Aluminum
        spring: Air
        dampers: [ocrc_plus]
        adjustments: &air_spring
          - { name: Pressure, type: numerical, unit: psi, min: 0 }
        offset_mm: 43
        axle: 20x110mm bolt axle
        note: |-
          - Dual-crown downhill chassis with magnesium lowers
          - Post-mount disc, 180-220mm rotors
      - trim: Coil
        key: fork-rst-killah-coil
        travel_mm: [200]
        stanchion: 36mm Aluminum
        spring: Coil
        dampers: [ocrc_plus]
        adjustments: &coil_spring
          - { name: Spring Rate, type: numerical, unit: lbs/in, min: 0 }
          - { name: Preload, type: numerical, min: 0 }
        offset_mm: 43
        axle: 20x110mm bolt axle
        note: |-
          - Dual-crown downhill chassis with magnesium lowers
          - Post-mount disc, 180-220mm rotors

  - model: "R.EVO 29"
    complete: false
    category: Downhill
