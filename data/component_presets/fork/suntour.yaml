      description_fr: Cartouche WERX/PCS avec un levier de compression à 2 positions utilisable en roulant (réglages Open, Firm) plus une molette de détente basse vitesse séparée. Au choix de l’acheteur sur AION, ZERON et RAIDON.
      description_it: Cartuccia WERX/PCS con una leva di compressione a 2 posizioni azionabile in marcia (impostazioni Open, Firm) più una manopola separata del ritorno a bassa velocità. A scelta dell’acquirente su AION, ZERON e RAIDON.
      description_es: Cartucho WERX/PCS con una palanca de compresión de 2 posiciones accionable en marcha (ajustes Open, Firm) más una rueda de rebote de baja velocidad independiente. A elección del comprador en AION, ZERON y RAIDON.
      description_pt: Cartucho WERX/PCS com uma alavanca de compressão de 2 posições acionável em movimento (ajustes Open, Firm) mais um seletor de retorno de baixa velocidade separado. À escolha do comprador em AION, ZERON e RAIDON.
      missing_adjustments: [Rebound]
      missing_adjustments_de: [Zugstufe]
      missing_adjustments_fr: [Détente]
      missing_adjustments_it: [Ritorno]
      missing_adjustments_es: [Rebote]
      missing_adjustments_pt: [Retorno]
      adjustments:
        - { name: Compression Mode, name_de: Druckstufenmodus, name_fr: Mode de compression, name_it: Modalità di compressione, name_es: Modo de compresión, name_pt: Modo de compressão, type: categorical, options: [Open, Firm], options_de: [Offen, Fest], options_fr: [Ouvert, Ferme], options_it: [Aperto, Rigido], options_es: [Abierto, Firme], options_pt: [Aberto, Firme], notes: 2-position on-the-fly lever (PCS cartridge), notes_de: 2-Positionen-Hebel zum Umschalten während der Fahrt (PCS-Kartusche), notes_fr: "Levier à 2 positions, utilisable en roulant (cartouche PCS)", notes_it: "Leva a 2 posizioni, azionabile in marcia (cartuccia PCS)", notes_es: "Palanca de 2 posiciones, accionable en marcha (cartucho PCS)", notes_pt: "Alavanca de 2 posições, acionável em movimento (cartucho PCS)" }
