# --------------------------------------------------------------------------
# Setup guides — transcribed from docs/research/setup_guides/suntour.md.
#   * Pressure: the MY26 manual's "EQ air system forks" table, rider weight
#     (kg) → psi band, one rule per printed column. The `95 <` row (`85 +`,
#     `105 +` …) is left out: as a band to the fork's maximum it would apply a
#     midpoint far above the table's trend. The `< 40` cells of the 38mm
#     columns have no published minimum, so those columns start at 55 kg.
#     Factory pressures are shipping values, not recommendations.
#   * SAG: the band by fork travel. Its travel brackets share their bounds,
#     so 120, 160 and 180mm sit in two rows; they get the band spanning both.
#   * Volume spacers: the "Factory setting" count per travel (and wheel size
#     on the AION 38X), not the maximum.
# --------------------------------------------------------------------------
guides:
  suntour_forks_my26:
    label: SR SUNTOUR general fork manual (MY26)
    label_de: SR SUNTOUR Allgemeine Gabelanleitung (MY26)
    label_fr: Manuel général des fourches SR SUNTOUR (MY26)
    label_it: Manuale generale delle forcelle SR SUNTOUR (MY26)
    label_es: Manual general de horquillas SR SUNTOUR (MY26)
    label_pt: Manual geral de garfos SR SUNTOUR (MY26)
    source: https://www.srsuntour.com/fileadmin/user_upload/Downloads/Consumer/Bike/Owners%20manuals/MY_26_Suspension_Fork_Manuals/MY26_General_Fork_Manual_English_20250930.pdf
    rules:
      # The RUX38 / DUROLUX38 and DUROLUX38X / AION38X columns print the same values.
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { model: [rux, durolux-38, aion-38x] }
        rows: { 55-65: [40, 50], 65-75: [50, 60], 75-85: [60, 70], 85-95: [70, 85] }
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { model: [durolux-36x, auron-36] }
        rows: &suntour_eq_36 { "<55": [35, 50], 55-65: [50, 60], 65-75: [60, 70], 75-85: [70, 85], 85-95: [85, 105] }
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { model: [aion-36, zeron-36, zeron-36x] }
        rows: { "<55": [50, 70], 55-65: [70, 80], 65-75: [80, 90], 75-85: [90, 100], 85-95: [100, 125] }
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { model: axon-34-werx }
        rows: { "<55": [40, 55], 55-65: [55, 65], 65-75: [65, 75], 75-85: [75, 85], 85-95: [85, 100] }
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { model: axon-34 }
        rows: { "<55": [35, 50], 55-65: [50, 60], 65-75: [60, 70], 75-85: [70, 80], 85-95: [80, 100] }
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { model: raidon-34 }
        rows: *suntour_eq_36
      - target: sag
        input: travel_mm
