# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - setup_guide is the MY26 general fork manual for every model (the product
#     pages link per-model manuals only as part of that family document).
#   - Dial colors: no SR SUNTOUR page or manual names an adjuster knob color
#     (the pages only say "forged alloy dial knobs"), so none are set.
#   - No official SR SUNTOUR source (product pages, the suspension-fork
#     glossary, or the general fork owner's manual) publishes exact click
#     counts for the continuously-adjustable compression/rebound dials on
#     RC+-PCS, RC-PCS, or the dial portions of RLRC-PCS/LORC-PCS/R-2CR-PCS/
#     3CR-PCS/2CR-PCS. Only the discrete on-the-fly lever positions and the
#     binary lockout state are documented and captured above.
#   - Third-party reviews (Singletracks, NSMB, MBR, etc.) report specific
#     numbers for an older 34mm-stanchion Auron RC2 generation (e.g. "25
#     clicks rebound", "14 clicks HSC / 10 clicks LSC") but these are NOT from
#     an official SR SUNTOUR source and were deliberately excluded. That
#     34mm/RLRC-PCS+RC2-PCS+LORC-PCS-selectable generation also appears to
#     have been superseded by the current 36mm RC+-PCS-only AURON 36 in SR
#     SUNTOUR's product catalog — not included as a separate model since its
#     current-catalog status could not be confirmed.
#   - AION 36X (an eMTB-tuned 36mm sibling of AION 36/ZERON 36X, per the SF26
#     product listing) repeatedly failed to load (HTTP 503/timeout) during
#     verification — not included rather than guessing its travel options.
#   - Volume spacers: the manual's spacer table is a PDF grid whose travel rows
#     are offset from their labels; rows were assigned to travels by counting
#     (ZERON 36X is read as 160-130mm = 9-12, a 120mm row with 13 also exists).
#     Elite (alloy steerer) has no spacer row in MY25; MY26 names it next to
#     the Werx (same counts, max 11). Product pages are JavaScript-rendered and
#     return no specs, so the manual is the only source for these numbers.
#   - AION 36X, MOBIE 36 and RAIDON 34X have spacer rows in the manual but no
#     product page could be loaded, so they are not added as products.
#   - Click counts for RC+ / RC / 3CR / 2CR / RLRC / LORC dials: neither the
#     manual nor the product pages state them. Magazine tests only cover the
#     older 34mm Auron RC2 (different damper), so no number is used and the
#     dampers stay without a click adjuster (3CR/2CR/RC/RLRC/LORC products
#     whose dials are missing remain declared via `missing_adjustments`).
#   - RAIDON32, XCR, XCM, XCT, EPIXON32, GVX, NCX/NVX/NRX/NEX, MOBIE and M3010
#     lines are SR SUNTOUR's entry-level/hybrid/e-city/kids forks (fixed
#     dampers or no externally adjustable compression circuit) and were
#     intentionally left out of this file per the "higher-end/adjustable
#     lineup only" scope.
# --------------------------------------------------------------------------
