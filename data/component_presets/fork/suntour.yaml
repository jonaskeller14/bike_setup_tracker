updated: 2026-10-13
# Service intervals (`tasks`) come from the MY25 general fork manual cited
# above, which lists every fork here: a dealer check every 50 hours and a
# full service every 100 hours or once a year.
#
# SR SUNTOUR's PCS ("Piston Compensator System") cartridges are named by their
# externally-adjustable function rather than a marketing name: RC+ / RC2 / RC
# are continuously-adjustable dial-type compression/rebound circuits; 3CR / 2CR
# / R-2CR are discrete-position on-the-fly compression levers (3 or 2 detented
# positions); RLRC / LORC combine a hydraulic lockout with adjustable rebound
# and compression. Every current model is air-sprung with SR SUNTOUR's "EQ"
# dual air-chamber spring system (positive/negative balanced automatically —
# still just one user-facing Pressure adjustment).
#
# IMPORTANT: none of SR SUNTOUR's official sources (product pages, the
# suspension-fork glossary, or the general fork owner's manual) publish exact
# click counts for any of the continuously-adjustable compression/rebound
# dials (RC+, RC2, RC, and the dial portions of RLRC/LORC). Only the discrete
# on-the-fly lever POSITIONS (3CR/2CR/R-2CR: named Open/Medium/Firm settings)
# and the binary lockout state are documented, so only those are captured as
# adjustments below — see the Follow-ups footer for what was deliberately
# left out rather than guessed.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    rc_plus_pcs:
      name: RC+-PCS
      description: >
        Race-proven WERX cartridge with PCS (Piston Compensator System) floating
        piston. Provides external low-speed compression and rebound adjustment via
        forged alloy dial knobs; high-speed compression/rebound is managed internally
        by shims and is not user-adjustable. Used on the current RUX, DUROLUX and
        AURON.
      description_de: >
        Im Rennen bewährte WERX-Kartusche mit schwimmendem PCS-Kolben (Piston
        Compensator System). Externe Verstellung von Low-Speed-Druckstufe und
        Zugstufe über geschmiedete Alu-Räder; High-Speed-Druckstufe/-Zugstufe
        wird intern über Shims geregelt und ist nicht vom Fahrer einstellbar.
        Verbaut an den aktuellen RUX, DUROLUX und AURON.
      description_fr: Cartouche WERX éprouvée en course avec un piston flottant PCS (Piston Compensator System). Offre un réglage externe de compression basse vitesse et de détente via des molettes en alliage forgé ; la compression/détente haute vitesse est gérée en interne par des lamelles et n’est pas réglable par l’utilisateur. Utilisée sur les RUX, DUROLUX et AURON actuelles.
      description_it: Cartuccia WERX collaudata in gara con pistone flottante PCS (Piston Compensator System). Offre la regolazione esterna di compressione a bassa velocità e di ritorno tramite manopole in lega forgiata; la compressione/ritorno ad alta velocità è gestita internamente da lamelle e non è regolabile dall’utente. Usata sulle attuali RUX, DUROLUX e AURON.
      description_es: Cartucho WERX probado en competición con pistón flotante PCS (Piston Compensator System). Ofrece ajuste externo de compresión de baja velocidad y de rebote mediante ruedas de aleación forjada; la compresión/rebote de alta velocidad se gestiona internamente con láminas y no es ajustable por el usuario. Se usa en las RUX, DUROLUX y AURON actuales.
      description_pt: Cartucho WERX testado em competição com pistão flutuante PCS (Piston Compensator System). Oferece ajuste externo de compressão de baixa velocidade e de retorno por meio de seletores de liga forjada; a compressão/retorno de alta velocidade é gerida internamente por lâminas e não é ajustável pelo usuário. Usado nas RUX, DUROLUX e AURON atuais.
      missing_adjustments: [Low-speed compression, Rebound dials]
      missing_adjustments_de: [Low-Speed-Druckstufe, Zugstufenräder]
      missing_adjustments_fr: [Compression basse vitesse, Molettes de détente]
      missing_adjustments_it: [Compressione a bassa velocità, Manopole del ritorno]
      missing_adjustments_es: [Compresión de baja velocidad, Ruedas de rebote]
      missing_adjustments_pt: [Compressão de baixa velocidade, Seletores de retorno]
      adjustments: []
      note: Low-speed compression and rebound click counts are not published by SR SUNTOUR.

    cr3_pcs:
      name: 3CR-PCS
      description: >
        WERX/PCS cartridge with a 3-position on-the-fly compression lever (Open,
        Medium, Firm settings) plus a separate low-speed rebound dial.
        Buyer-selectable on AION and ZERON.
      description_de: >
        WERX/PCS-Kartusche mit 3-Positionen-Druckstufenhebel zum Umschalten
        während der Fahrt (Einstellungen Open, Medium, Firm) plus separatem
        Low-Speed-Zugstufenrad. Beim Kauf wählbar bei AION und ZERON.
      description_fr: Cartouche WERX/PCS avec un levier de compression à 3 positions utilisable en roulant (réglages Open, Medium, Firm) plus une molette de détente basse vitesse séparée. Au choix de l’acheteur sur AION et ZERON.
      description_it: Cartuccia WERX/PCS con una leva di compressione a 3 posizioni azionabile in marcia (impostazioni Open, Medium, Firm) più una manopola separata del ritorno a bassa velocità. A scelta dell’acquirente su AION e ZERON.
      description_es: Cartucho WERX/PCS con una palanca de compresión de 3 posiciones accionable en marcha (ajustes Open, Medium, Firm) más una rueda de rebote de baja velocidad independiente. A elección del comprador en AION y ZERON.
      description_pt: Cartucho WERX/PCS com uma alavanca de compressão de 3 posições acionável em movimento (ajustes Open, Medium, Firm) mais um seletor de retorno de baixa velocidade separado. À escolha do comprador em AION e ZERON.
      missing_adjustments: [Rebound]
      missing_adjustments_de: [Zugstufe]
      missing_adjustments_fr: [Détente]
      missing_adjustments_it: [Ritorno]
      missing_adjustments_es: [Rebote]
      missing_adjustments_pt: [Retorno]
      adjustments:
        - { name: Compression Mode, name_de: Druckstufenmodus, name_fr: Mode de compression, name_it: Modalità di compressione, name_es: Modo de compresión, name_pt: Modo de compressão, type: categorical, options: [Open, Medium, Firm], options_de: [Offen, Medium, Fest], options_fr: [Ouvert, Medium, Ferme], options_it: [Aperto, Medium, Rigido], options_es: [Abierto, Medium, Firme], options_pt: [Aberto, Medium, Firme], notes: 3-position on-the-fly lever (PCS cartridge), notes_de: 3-Positionen-Hebel zum Umschalten während der Fahrt (PCS-Kartusche), notes_fr: "Levier à 3 positions, utilisable en roulant (cartouche PCS)", notes_it: "Leva a 3 posizioni, azionabile in marcia (cartuccia PCS)", notes_es: "Palanca de 3 posiciones, accionable en marcha (cartucho PCS)", notes_pt: "Alavanca de 3 posições, acionável em movimento (cartucho PCS)" }
      note: "Low-speed rebound click count unconfirmed"

    cr2_pcs:
      name: 2CR-PCS
      description: >
        WERX/PCS cartridge with a 2-position on-the-fly compression lever (Open,
