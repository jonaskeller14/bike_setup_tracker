updated: 2026-07-18
# SR SUNTOUR's PCS ("Piston Compensator System") cartridges are named by their
# externally-adjustable function rather than a marketing name: RC+ / RC2 / RC
# are continuously-adjustable dial-type compression/rebound circuits; 3CR / 2CR
# / R-2CR are discrete-position on-the-fly compression levers (3 or 2 detented
# positions); RLRC / LORC combine a hydraulic lockout with adjustable rebound
# and compression. Every current model is air-sprung with SR SUNTOUR's "EQ"
# dual air-chamber spring system (positive/negative balanced automatically —
# still just one user-facing Pressure adjustment).
#
# IMPORTANT: none of SR SUNTOUR's official sources (product pages, the
# suspension-fork glossary, or the general fork owner's manual) publish exact
# click counts for any of the continuously-adjustable compression/rebound
# dials (RC+, RC2, RC, and the dial portions of RLRC/LORC). Only the discrete
# on-the-fly lever POSITIONS (3CR/2CR/R-2CR: named Open/Medium/Firm settings)
# and the binary lockout state are documented, so only those are captured as
# adjustments below — see the Follow-ups footer for what was deliberately
# left out rather than guessed.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
dampers:
  rc_plus_pcs:
    name: RC+-PCS
    description: >
      Race-proven WERX cartridge with PCS (Piston Compensator System) floating
      piston. Provides external low-speed compression and rebound adjustment
      via forged alloy dial knobs; high-speed compression/rebound is managed
      internally by shims and is not user-adjustable. Used on the current RUX,
      DUROLUX and AURON. Exact click counts for the external LSC/rebound dials
      are not published on any official SR SUNTOUR source.
    adjustments: []
    note: "Low-speed compression and rebound click counts unconfirmed — verify against an official service manual before relying on them"

  cr3_pcs:
    name: 3CR-PCS
    description: >
      WERX/PCS cartridge with a 3-position on-the-fly compression lever (Open,
      Medium, Firm settings, per SR SUNTOUR's official function table) plus a
      separate low-speed rebound dial. Offered as one of the buyer-selectable
      damper options on AION and ZERON. The rebound dial's click count is not
      published.
    adjustments:
      - { name: Compression Mode, type: categorical, options: [Open, Medium, Firm], notes: 3-position on-the-fly lever (PCS cartridge) }
    note: "Low-speed rebound click count unconfirmed"

  cr2_pcs:
    name: 2CR-PCS
    description: >
      WERX/PCS cartridge with a 2-position on-the-fly compression lever (Open,
      Firm settings) plus a separate low-speed rebound dial. Offered as a
      buyer-selectable damper option on AION, ZERON and RAIDON. The rebound
      dial's click count is not published.
    adjustments:
      - { name: Compression Mode, type: categorical, options: [Open, Firm], notes: 2-position on-the-fly lever (PCS cartridge) }
    note: "Low-speed rebound click count unconfirmed"

  rc_pcs:
    name: RC-PCS
    description: >
      WERX/PCS cartridge with external low-speed compression and low-speed
      rebound dials (continuously adjustable, no discrete on-the-fly
      positions). Offered as a buyer-selectable damper option on AION. Click
      counts for both dials are not published.
    adjustments: []
    note: "Low-speed compression and rebound click counts unconfirmed"

  rlrc_pcs:
    name: RLRC-PCS
    description: >
      WERX/PCS cartridge combining a handlebar-remote hydraulic lockout with
      adjustable rebound and compression damping (blow-off protected). Used on
      AXON and AXON Werx/Elite. The lockout on/off function is documented; the
      rebound/compression dial click counts are not published.
    adjustments:
      - { name: Lockout, type: boolean, notes: Handlebar-remote hydraulic lockout with blow-off feature }
    note: "Rebound/compression click counts unconfirmed"

  lorc_pcs:
    name: LORC-PCS
    description: >
      WERX/PCS cartridge combining a crown-mounted (non-remote) hydraulic
      lockout lever with adjustable rebound and compression damping (blow-off
      protected). Offered as an alternative to RLRC-PCS on AXON. Click counts
      are not published.
    adjustments:
      - { name: Lockout, type: boolean, notes: Crown-mounted hydraulic lockout lever with blow-off feature }
    note: "Rebound/compression click counts unconfirmed"

  r_2cr_pcs:
    name: R-2CR-PCS
    description: >
      WERX/PCS cartridge with a handlebar-remote 2-position compression lever
      (Open, Firm settings) plus a low-speed rebound dial. Offered as a
      buyer-selectable damper option on RAIDON alongside the manual 2CR-PCS
      cartridge. The rebound dial's click count is not published.
    adjustments:
      - { name: Compression Mode, type: categorical, options: [Open, Firm], notes: Handlebar-remote 2-position lever (PCS cartridge) }
    note: "Low-speed rebound click count unconfirmed"

# --------------------------------------------------------------------------
# Forks — current (2025/2026) higher-end/externally-adjustable SR SUNTOUR MTB
# lineup. Every model below uses SR SUNTOUR's "EQ" dual-chamber air spring, so
# all trims share the &air_spring anchor (Pressure only; per-travel volume
# spacer max counts are published but vary by travel setting — see
# Follow-ups, same limitation as fork/marzocchi.yaml).
# --------------------------------------------------------------------------
forks:
  - model: "RUX"
    category: Downhill
    year_range: "2025-2026"
    url: https://www.srsuntour.com/products/fork/SF25-RUX38-Boost-8390.html
    wheel_size: [29, 27.5]
    trims:
      - trim: Boost
        travel_mm: [200]
        stanchion: 38mm (Alloy)
        spring: Air
        dampers: [rc_plus_pcs]
        adjustments: &air_spring
          - { name: Pressure, type: numerical, unit: psi, min: 0 }
        offset_mm: 50
        axle: ø20-110 (Q-LOC2 tool-type or tool-free)
        note: Downhill/Freeride chassis. Postmount 203mm, max rotor 220mm.

  - model: "DUROLUX 36X"
    category: All-Mountain (eMTB)
    year_range: "2025-2026"
    url: https://www.srsuntour.com/products/fork/SF25-DUROLUX36X-Boost-8049.html
    wheel_size: [29, 27.5]
    trims:
      - trim: Boost
        travel_mm: [150, 160]
        stanchion: 36mm (Alloy)
        spring: Air
        dampers: [rc_plus_pcs]
        adjustments: *air_spring
        offset_mm: 44
        axle: ø15-110 (15AH4)
        note: eMTB_AM-tuned variant of the DUROLUX chassis with a lighter 36mm stanchion; ABS mount optional.

  - model: "DUROLUX 38"
