updated: 2026-10-13
# Service intervals (`tasks`) come from the MY25 general fork manual cited
# above, which lists every fork here: a dealer check every 50 hours and a
# full service every 100 hours or once a year.
#
# SR SUNTOUR's PCS ("Piston Compensator System") cartridges are named by their
# externally-adjustable function rather than a marketing name: RC+ / RC2 / RC
# are continuously-adjustable dial-type compression/rebound circuits; 3CR / 2CR
# / R-2CR are discrete-position on-the-fly compression levers (3 or 2 detented
# positions); RLRC / LORC combine a hydraulic lockout with adjustable rebound
# and compression. Every current model is air-sprung with SR SUNTOUR's "EQ"
# dual air-chamber spring system (positive/negative balanced automatically —
# still just one user-facing Pressure adjustment).
#
# IMPORTANT: none of SR SUNTOUR's official sources (product pages, the
# suspension-fork glossary, or the general fork owner's manual) publish exact
# click counts for any of the continuously-adjustable compression/rebound
# dials (RC+, RC2, RC, and the dial portions of RLRC/LORC). Only the discrete
# on-the-fly lever POSITIONS (3CR/2CR/R-2CR: named Open/Medium/Firm settings)
# and the binary lockout state are documented, so only those are captured as
# adjustments below — see the Follow-ups footer for what was deliberately
# left out rather than guessed.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    rc_plus_pcs:
      name: RC+-PCS
      description: >
        Race-proven WERX cartridge with PCS (Piston Compensator System) floating
        piston. Provides external low-speed compression and rebound adjustment via
        forged alloy dial knobs; high-speed compression/rebound is managed internally
        by shims and is not user-adjustable. Used on the current RUX, DUROLUX and
        AURON.
      missing_adjustments: [Low-speed compression, Rebound dials]
      adjustments: []
      note: Low-speed compression and rebound click counts are not published by SR SUNTOUR.

    cr3_pcs:
      name: 3CR-PCS
      description: >
        WERX/PCS cartridge with a 3-position on-the-fly compression lever (Open,
        Medium, Firm settings) plus a separate low-speed rebound dial.
        Buyer-selectable on AION and ZERON.
      missing_adjustments: [Rebound]
      adjustments:
        - { name: Compression Mode, type: categorical, options: [Open, Medium, Firm], notes: 3-position on-the-fly lever (PCS cartridge) }
      note: "Low-speed rebound click count unconfirmed"

    cr2_pcs:
      name: 2CR-PCS
      description: >
        WERX/PCS cartridge with a 2-position on-the-fly compression lever (Open,
        Firm settings) plus a separate low-speed rebound dial. Buyer-selectable
        on AION, ZERON and RAIDON.
      missing_adjustments: [Rebound]
      adjustments:
        - { name: Compression Mode, type: categorical, options: [Open, Firm], notes: 2-position on-the-fly lever (PCS cartridge) }
      note: "Low-speed rebound click count unconfirmed"

    rc_pcs:
      name: RC-PCS
      description: >
        WERX/PCS cartridge with external low-speed compression and low-speed rebound
        dials (continuously adjustable, no discrete on-the-fly positions).
        Buyer-selectable on AION.
      missing_adjustments: [Both dials]
      adjustments: []
      note: "Low-speed compression and rebound click counts unconfirmed"

    rlrc_pcs:
      name: RLRC-PCS
      description: >
        WERX/PCS cartridge combining a handlebar-remote hydraulic lockout with
        adjustable rebound and compression damping (blow-off protected). Used on AXON
        and AXON Werx/Elite.
      missing_adjustments: [Rebound, Compression dials]
      adjustments:
        - { name: Lockout, type: boolean, notes: Handlebar-remote hydraulic lockout with blow-off feature }
      note: "Rebound/compression click counts unconfirmed"

    lorc_pcs:
      name: LORC-PCS
      description: >
        WERX/PCS cartridge combining a crown-mounted (non-remote) hydraulic lockout
        lever with adjustable rebound and compression damping (blow-off protected).
        Alternative to RLRC-PCS on AXON.
      missing_adjustments: [Rebound, Compression dials]
      adjustments:
        - { name: Lockout, type: boolean, notes: Crown-mounted hydraulic lockout lever with blow-off feature }
      note: "Rebound/compression click counts unconfirmed"

    r_2cr_pcs:
      name: R-2CR-PCS
      description: >
        WERX/PCS cartridge with a handlebar-remote 2-position compression lever
        (Open, Firm settings) plus a low-speed rebound dial. Buyer-selectable
        on RAIDON alongside the manual 2CR-PCS cartridge.
      missing_adjustments: [Rebound]
      adjustments:
        - { name: Compression Mode, type: categorical, options: [Open, Firm], notes: Handlebar-remote 2-position lever (PCS cartridge) }
      note: "Low-speed rebound click count unconfirmed"

# --------------------------------------------------------------------------
# Setup guides — transcribed from docs/research/setup_guides/suntour.md.
#   * Pressure: the MY26 manual's "EQ air system forks" table, rider weight
#     (kg) → psi band, one rule per printed column. The `95 <` row (`85 +`,
#     `105 +` …) is left out: as a band to the fork's maximum it would apply a
#     midpoint far above the table's trend. The `< 40` cells of the 38mm
#     columns have no published minimum, so those columns start at 55 kg.
#     Factory pressures are shipping values, not recommendations.
#   * SAG: the band by fork travel. Its travel brackets share their bounds,
#     so 120, 160 and 180mm sit in two rows; they get the band spanning both.
#   * Volume spacers: the "Factory setting" count per travel (and wheel size
#     on the AION 38X), not the maximum.
# --------------------------------------------------------------------------
guides:
  suntour_forks_my26:
    label: SR SUNTOUR general fork manual (MY26)
    source: https://www.srsuntour.com/fileadmin/user_upload/Downloads/Consumer/Bike/Owners%20manuals/MY_26_Suspension_Fork_Manuals/MY26_General_Fork_Manual_English_20250930.pdf
    rules:
      # The RUX38 / DUROLUX38 and DUROLUX38X / AION38X columns print the same values.
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { model: [rux, durolux-38, aion-38x] }
        rows: { 55-65: [40, 50], 65-75: [50, 60], 75-85: [60, 70], 85-95: [70, 85] }
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { model: [durolux-36x, auron-36] }
        rows: &suntour_eq_36 { "<55": [35, 50], 55-65: [50, 60], 65-75: [60, 70], 75-85: [70, 85], 85-95: [85, 105] }
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { model: [aion-36, zeron-36, zeron-36x] }
        rows: { "<55": [50, 70], 55-65: [70, 80], 65-75: [80, 90], 75-85: [90, 100], 85-95: [100, 125] }
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { model: axon-34-werx }
        rows: { "<55": [40, 55], 55-65: [55, 65], 65-75: [65, 75], 75-85: [75, 85], 85-95: [85, 100] }
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { model: axon-34 }
        rows: { "<55": [35, 50], 55-65: [50, 60], 65-75: [60, 70], 75-85: [70, 80], 85-95: [80, 100] }
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        when: { model: raidon-34 }
        rows: *suntour_eq_36
      - target: sag
        input: travel_mm
        rows: { 100: [15, 20], 110: [15, 20], 130: [20, 25], 140: [20, 25], 150: [20, 25], 170: [25, 30], 200: [30, 35] }
        note: Measured with the compression open
      - target: sag
        input: travel_mm
        when: { travel_mm: [120, 160, 180] }
        rows: { 120: [15, 25], 160: [20, 30], 180: [25, 35] }
        note: This travel sits between two SAG bands; the range spans both
      - target: volume_spacers
        input: travel_mm
        when: { model: rux }
        rows: { 200: 5 }
      - target: volume_spacers
        input: travel_mm
        when: { model: durolux-38 }
        rows: &suntour_spacers_38 { 160: 4, 170: 3, 180: 2 }
      - target: volume_spacers
        input: travel_mm
        when: { model: durolux-36x }
        rows: { 150: 5, 160: 4 }
      - target: volume_spacers
        input: travel_mm
        when: { model: aion-38x, wheel_size: "29" }
        rows: *suntour_spacers_38
      # 27.5in at 180mm has no printed row.
      - target: volume_spacers
        input: travel_mm
        when: { model: aion-38x, wheel_size: "27.5" }
        rows: { 160: 2, 170: 1 }
      - target: volume_spacers
        input: travel_mm
        when: { model: [aion-36, zeron-36] }
        rows: { 120: 7, 130: 6, 140: 5, 150: 4, 160: 3 }
      - target: volume_spacers
        input: travel_mm
        when: { model: auron-36 }
        rows: { 140: 5, 150: 4, 160: 3 }
      - target: volume_spacers
        input: travel_mm
        when: { model: zeron-36x }
        rows: { 130: 6, 140: 5, 150: 4, 160: 3 }
      - target: volume_spacers
        input: travel_mm
        when: { model: axon-34-werx }
        rows: { 100: 5, 110: 4, 120: 3 }
      - target: volume_spacers
        input: travel_mm
        when: { model: axon-34 }
        rows: { 100: 6, 120: 4, 130: 3, 140: 2 }
      - target: volume_spacers
        input: travel_mm
        when: { model: raidon-34 }
        rows: { 100: 5, 120: 3, 130: 2, 140: 1 }

# --------------------------------------------------------------------------
# Forks — current (2025/2026) higher-end/externally-adjustable SR SUNTOUR MTB
# lineup. Every model below uses SR SUNTOUR's "EQ" dual-chamber air spring.
# Maximum pressure and the maximum rubber-clip spacer count per travel come
# from the "Air pressure adjust" and "Air volume adjust" tables of the MY25
# general fork manual (pp. 14-16), and from the MY26 edition (pp. 13-16) for
# the AION 36 pressure, the AURON 36 140mm row and the AXON 34 Elite; the
# spacer `max` is the highest count of the travels offered, the per-travel
# maxima are listed in the notes.
# --------------------------------------------------------------------------
nodes:
  - label: "RUX"
    level: model
    category: Downhill
    tasks: &suntour_service
      fork:full_service: { interval: { moving_time_h: 100 }, fallback: { days: 365 }, source: SR Suntour owner's manual }
    children:
      - label: "2025–2026"
        level: generation
        id: "2025"
        years: "2025-2026"
        url: https://www.srsuntour.com/products/fork/SF25-RUX38-Boost-8390.html
        setup_guide: https://www.srsuntour.com/fileadmin/user_upload/Downloads/Consumer/Bike/Owners%20manuals/MY_26_Suspension_Fork_Manuals/MY26_General_Fork_Manual_English_20250930.pdf
        guide: suntour_forks_my26
        children:
          - label: Boost
            level: trim
            draft: true
            specs: { stanchion: 38mm (Alloy), spring: Air }
            offset_mm: 50
            axle: ø20-110 (Q-LOC2 tool-type or tool-free)
            adjustments:
              - { name: Pressure, type: numerical, unit: psi, min: 0, max: 105 }
              - { name: Volume Spacers, type: step, max: 7, visualization: stepper, notes: "Rubber clip spacers" }
            options:
              damper: [rc_plus_pcs]
              travel_mm: [200]
              wheel_size: [29, 27.5]
            note: Downhill/Freeride chassis. Postmount 203mm, max rotor 220mm.

