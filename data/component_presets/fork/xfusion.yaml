# --------------------------------------------------------------------------
# Setup guides — transcribed from docs/research/setup_guides/xfusion.md.
#   * Pressure: the fork pressure chart / 2025 set-up guide tables, rider weight
#     (lb) → psi, one rule per printed column. The printed `220+` row is the
#     point 220: the rows are points, and a heavier rider is outside the table.
#     The set-up guides head their table "Spring / Coil", but the chart prints the
#     same 32/34/36mm values as "Air Pressure".
#   * SAG: the guides' recommended 25-30 %.
#   * Rebound: the guides' base setting, counted from fully closed.
# --------------------------------------------------------------------------
guides:
  xfusion_forks_2025:
    label: X-Fusion fork pressure chart and set-up guides (2025)
    label_de: X-Fusion Gabel-Druckdiagramm und Setup-Anleitungen (2025)
    label_fr: Tableau de pressions et guides de réglage des fourches X-Fusion (2025)
    label_it: Tabella delle pressioni e guide al setup delle forcelle X-Fusion (2025)
    label_es: Tabla de presiones y guías de ajuste de las horquillas X-Fusion (2025)
    label_pt: Tabela de pressões e guias de ajuste dos garfos X-Fusion (2025)
    source: https://www.xfusionshox.com/upload/files/Air%20%26%20Coil%20Spring%20Rate-v2.pdf
    rules:
      # The chart's 32/34mm (RC/RL) column: the 32mm forks, and the 34mm RC trims.
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { model: [velvet, rc32] }
        rows: &xfusion_rcrl { 100: 55, 110: 57.5, 120: 60, 130: 65, 140: 70, 150: 75, 160: 80, 170: 85, 180: 90, 190: 95, 200: 100, 220: 110 }
        source: https://www.xfusionshox.com/upload/files/32mm%20Fork%20Set%20Up%20Guide%202025.pdf
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { model: [sweep-boost, slide-boost, slant], trim: rc }
        rows: *xfusion_rcrl
      # The 34mm RoughCut column (the 34mm guide's own table).
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { model: [sweep-boost, slide-boost, slant], trim: [hlr, rcp] }
        rows: { 100: 47.5, 110: 50, 120: 55, 130: 60, 140: 65, 150: 70, 160: 75, 170: 80, 180: 85, 190: 90, 200: 95, 220: 110 }
        source: https://www.xfusionshox.com/upload/files/34mm%20Fork%20Set%20Up%20Guide%202025.pdf
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { model: trace-36 }
        rows: { 100: 45, 110: 47.5, 120: 50, 130: 52.5, 140: 55, 150: 57.5, 160: 60, 170: 65, 180: 70, 190: 75, 200: 80, 220: 85 }
        source: https://www.xfusionshox.com/upload/files/36mm%20Fork%20Set%20Up%20Guide%202025.pdf
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { model: [vengeance-38, rv1-38-dh] }
        rows: { 100: 55, 110: 60, 120: 65, 130: 70, 140: 75, 150: 80, 160: 85, 170: 90, 180: 95, 190: 100, 200: 105, 220: 110 }
        source: https://www.xfusionshox.com/upload/files/38mm%20Fork%20Set%20Up%20Guide%202025.pdf
      - { target: sag, range: [25, 30], comfort_at: max }
      - target: rebound
        value: 8
        when: { model: [velvet, rc32, rezza, sweep-boost, slide-boost, slant, trace-36] }
        note: Starting point; adjust in steps of 2 clicks
        note_de: Ausgangspunkt; in 2-Klick-Schritten anpassen
        note_fr: Point de départ ; ajuster par pas de 2 clics
        note_it: Punto di partenza; regolare a passi di 2 scatti
        note_es: Punto de partida; ajustar en pasos de 2 clics
        note_pt: Ponto de partida; ajustar em passos de 2 cliques
      - target: rebound
        value: 12
        when: { model: [vengeance-38, rv1-38-dh] }
        note: Starting point; adjust in steps of 2 clicks
        note_de: Ausgangspunkt; in 2-Klick-Schritten anpassen
        note_fr: Point de départ ; ajuster par pas de 2 clics
        note_it: Punto di partenza; regolare a passi di 2 scatti
        note_es: Punto de partida; ajustar en pasos de 2 clics
        note_pt: Ponto de partida; ajustar em passos de 2 cliques

