# Service interval (`tasks`) from the 2025 set-up guides: damper and lower-leg
# service every 80 hours of ride time or annually. The owner's manual's service
# table is ride-based instead (oil and seals every 100 rides or yearly), see
# the Follow-ups footer. The G.E.T. 30 and Roamin have no set-up guide, so
# they carry no `tasks`.

