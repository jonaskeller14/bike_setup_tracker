# X-Fusion mountain-bike forks — adjustment preset database
#
# Same design as fork/suntour.yaml, fork/rst.yaml: click ranges belong to the
# DAMPER cartridge, defined once under `option_values.damper` and referenced by id
# from each fork's trims. See SCHEMA.md in this folder.
#
# X-Fusion Shox (Taiwan) writes its name "XFUSION" on its own site; the brand
# id is the slug of `brand` (`x-fusion`), the file is named `xfusion` like
# canecreek / dtswiss.
#
# X-Fusion publishes no model years, and the site shows only the current
# lineup, so no `years` is set and there is no generation level.
#
# Click counts come from the 2025 set-up guides for the 32/34/36/38mm forks
# (xfusionshox.com help page "SETUP GUIDE – FORK"). They are stated as
# "about" or "approximately" figures and count from fully closed, so they are
# declared as published rather than estimated. Dial colors: the guides name
# the rebound knob red and the low-speed compression knob blue; the
# high-speed knob is gold, which the catalog palette lacks, so it has none.
#
# Left out: OEM forks (Migo 9mm / 32mm / 34mm, Bruno 30, Bruno Cargo 32 / 34 —
# coil or air, steel or aluminium stanchions, no set-up guide) and forks named
# only in the owner's manual (Metric, Mcqueen, E-Sweep, E-Slide). See the
# Follow-ups footer.

