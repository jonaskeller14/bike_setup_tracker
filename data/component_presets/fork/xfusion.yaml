# Follow-ups (not yet captured — avoid guessing):
#   - Model years: none published; no generation level.
#   - Draft trims and their missing datum:
#       * Sweep Boost / Slide Boost / Slant RCP: the 3-position platform
#         control's positions are not named anywhere.
#       * Rezza RCP, RLR, RCPR: the three pages share one spec list (Finecut RCP
#         damper, 3-position platform); the feature text also mentions high- and
#         low-speed compression adjusters, and what the "R" of RLR / RCPR adds
#         is not stated. Treated as the same damper until X-Fusion says more.
#       * RC32 (all three): compression "open to firm", no clicks and the 32mm
#         set-up guide only covers the RL2 knobs.
#       * Roamin 20 / 24: compression and rebound adjusters with no counts,
#         direction or set-up guide.
#   - Click counts are "about" figures from the 32 / 34 / 36 / 38mm set-up
#     guides, which name the knob colors per damper family but not the damper
#     generation: the Finecut RL2 / RCP on the Rezza take the 34mm guide's 16
#     rebound clicks ("all 34mm forks"), the Vengeance 38 and RV1 38 DH take the
#     38mm guide's 7 HSC / 14 LSC / 25 rebound. The G.E.T. 30 (30mm, Finecut RL2)
#     has no guide, so its rebound is `max: ~`.
#   - Pressure: the owner's manual lists a minimum of 50 psi for every fork and
#     a maximum of 140 psi (Velvet, Slant, Sweep, Slide, RC32, Vengeance 38,
#     Rezza 29 Boost) or 120 psi (Trace 36, RV1 38). The 36mm chart starts at
#     45 psi, below that minimum, so `min` stays 0. The G.E.T. 30 and Roamin
#     appear in no pressure list, so `max` is unset. Rezza has no pressure rule:
#     the chart names the 32/34mm RC/RL and 34mm RoughCut columns but not the
#     Finecut dampers.
#   - Service: the owner's manual service table says dust seals, oil seals and
#     damper oil every 100 rides or every year; the set-up guides say damper and
#     lower-leg service every 80 hours or annually. The guides' figure is used.
#   - Volume spacers: no fork page, manual or guide publishes a count, so none
#     is declared. The "Oil & Air Value" chart (help_detail/6.htm) gives oil
#     volumes only.
#   - RV1 38 DH: the pressure chart also has an "RV-1 (Coil Spring)" column
#     (spring color by rider weight) while the product page says air spring;
#     only the air version is modelled.
#   - Travel conflicts on the product pages: Rezza text says 100/110/120 mm,
#     the spec list adds 130 mm (the list is used); RC32 (27.5) text says up to
#     120 mm, the spec list says 130 mm (the list is used). Travel options read
#     from the "ITA" (internal travel adjust) values; the Velvet's wheel size is
#     27.5 on its page, the navigation also says 26.
#   - Not modelled: OEM forks (Migo 9mm / 32mm / 34mm, Bruno 30, Bruno Cargo 32 /
#     34 with coil or air and STKM or aluminium variants), Metric / Mcqueen /
#     E-Sweep / E-Slide (named only in the owner's manual) and the Vengeance /
#     Trace "Standard HLR" the 36mm guide mentions next to Roughcut HLR.
#   - Remote lockout: the Rezza and RC32 pages mention remote-lockout options;
#     no remote adjuster is declared.
