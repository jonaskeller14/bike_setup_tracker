# --------------------------------------------------------------------------
# Shocks — current BOS MTB lineup.
# The Stoy 4 and Syors 2 are coil shocks sold without a spring (BOS springs are
# rated in lbs/inch); the Void 4 is a high-volume air shock. Every model comes
# in eyelet or trunnion mounts in imperial and metric sizes; BOS does not list
# a fixed set of strokes on the product pages, so no `size` option is listed.
# --------------------------------------------------------------------------
nodes:
  - label: "Stoy 4"
    level: model
    category: Enduro / Freeride / Downhill
    category_de: Enduro / Freeride / Downhill
    category_fr: Enduro / Freeride / Downhill
    category_it: Enduro / Freeride / Downhill
    category_es: Enduro / Freeride / Downhill
    category_pt: Enduro / Freeride / Downhill
    specs: { spring: Coil, spring_de: Stahlfeder, spring_fr: Hélicoïdal, spring_it: Elicoidale, spring_es: Helicoidal, spring_pt: Helicoidal }
    children:
      - label: "2025–2026"
        level: generation
        id: "2025"
        years: "2025-2026"
        url: https://www.bos-suspension.com/PBCPPlayer.asp?ID=2422708
        note: |-
          - Light, compact three-way monotube shock; 393g in 205x65mm trunnion without spring
          - Coil spring sold separately, with a preload adjustment
        note_de: |-
          - Leichter, kompakter Monotube-Dämpfer mit drei Einstellwegen; 393g in 205x65mm Trunnion ohne Feder
          - Stahlfeder separat erhältlich, mit Vorspannungsverstellung
        note_fr: |-
          - Amortisseur monotube léger et compact à trois voies ; 393 g en 205x65 mm trunnion sans ressort
          - Ressort vendu séparément, avec un réglage de précontrainte
        note_it: |-
          - Ammortizzatore monotubo leggero e compatto a tre vie; 393 g nella 205x65 mm trunnion senza molla
          - Molla venduta separatamente, con regolazione del precarico
        note_es: |-
          - Amortiguador monotubo ligero y compacto de tres vías; 393 g en 205x65 mm trunnion sin muelle
          - Muelle vendido por separado, con ajuste de precarga
        note_pt: |-
          - Amortecedor monotubo leve e compacto de três vias; 393 g no 205x65 mm trunnion sem mola
          - Mola vendida separadamente, com ajuste de pré-carga
        children:
          - label: Standard
            level: trim
            mounts: [Eyelet, Trunnion]
