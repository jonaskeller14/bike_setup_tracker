# Cane Creek mountain-bike shocks — adjustment preset database
#
# Same design as fork/canecreek.yaml: click ranges belong to the DAMPER,
# defined once under `dampers:` and referenced by key from each shock's trims.
# See SCHEMA.md in this folder.

brand: Cane Creek
component_type: shock
sources:
  - https://www.canecreek.com/collections/mountain-biking
  - https://www.canecreek.com/products/air-il
  - https://www.canecreek.com/products/coil-il
  - https://www.canecreek.com/products/kitsuma-g2-air
  - https://www.canecreek.com/products/kisuma-g2-coil
  - https://www.canecreek.com/products/tigon
  - https://www.canecreek.com/blogs/journal/cane-creek-introduces-the-next-generation-of-air-il-and-coil-il-rear-shocks
  - https://www.canecreek.com/blogs/journal/introducing-db-kitsuma
  - https://www.canecreek.com/blogs/journal/cane-creek-announces-second-generation-kitsuma-rear-shocks
  - https://www.canecreek.com/blogs/journal/being-frank-the-history-of-cane-creek-cycling-components
  - https://www.canecreek.com/pages/tigon-set-up-procedure
  - https://www.canecreek.com/pages/air-il-complete-100-hour-service-instructions-part-4-of-4
  - https://www.canecreek.com/pages/dbair-il-trunnion-mount-complete-100-hour-service-part-4-of-4
  - https://www.canecreek.com/pages/shocks-product-support
  - https://www.canecreek.com/pages/legacy-products-product-support
  # Official PDF instruction manuals (linked from the two support pages above)
  - https://cdn.shopify.com/s/files/1/0579/5987/4639/files/DB_IL_G2_Manual_2025_04_01.pdf
  - https://cdn.shopify.com/s/files/1/0579/5987/4639/files/Kitsuma_Manual_2025_04_01.pdf
  - https://cdn.shopify.com/s/files/1/0579/5987/4639/files/Tigon_Manual_2025_04_01.pdf
  - https://cdn.shopify.com/s/files/1/0579/5987/4639/files/DB-IL-Manual_2022_02_25_1_d8229608-3c4e-406c-bf6f-5b97afc6b6f8.pdf
  - https://cdn.shopify.com/s/files/1/0579/5987/4639/files/DBKitsuma-Manual_2022_02_25_1_c25c4778-7d40-4977-a021-ac43a3c30070.pdf
  - https://cdn.shopify.com/s/files/1/0579/5987/4639/files/DB_owners-manual_2014_v11-web_8703fe9e-d4d7-4766-b7db-3350db90bbfb.pdf
  - https://cdn.shopify.com/s/files/1/0579/5987/4639/files/tfg_english_30a0cfe9-1830-4f4f-8436-09f3bfd14390.pdf
updated: 2026-09-10
# Every click/turn count below is read off the "Damper Adjustments" table in
# the relevant generation's official Cane Creek instruction manual (each
# damper carries the exact PDF in its `source:` key). Those tables footnote
# that "count of adjuster positions may vary slightly with some shock builds.
# The range of adjustment will remain the same." Counting runs from fully
# closed (clockwise = closed = more damping), so the default `dial_ccw`
# visualization applies unless noted.
#
# Generations do NOT share numbers — the same twin-tube damper family runs
# 25 clicks of LSC on the current IL, 18 on the G1 IL and 25 on the original
# Double Barrel, so each generation has its own damper key.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
dampers:
  il_twin_tube:
    name: DB Twin Tube (IL)
    description: |-
      - Four independent circuits: High- and Low-Speed Compression, High- and Low-Speed Rebound
      - Low-speed adjusters run 25 clicks; the high-speed adjusters are continuous, 4.5 turns end to end
      - Climb Switch lever with a 3mm adjustment tool nested inside it
    adjustments:
      - { name: LSC, type: step, max: 25, notes: Low-Speed Compression }
      - { name: HSC, type: numerical, unit: turns, min: 0, max: 4.5, notes: "High-Speed Compression; Continuous (no clicks); counted from fully closed" }
      - { name: LSR, type: step, max: 25, notes: Low-Speed Rebound }
      - { name: HSR, type: numerical, unit: turns, min: 0, max: 4.5, notes: "High-Speed Rebound; Continuous (no clicks); counted from fully closed" }
      - { name: Climb Switch, type: categorical, options: [Open, Climb] }
    valves: twin-tube; 2 high-speed + 2 low-speed damping circuits
    source: https://cdn.shopify.com/s/files/1/0579/5987/4639/files/DB_IL_G2_Manual_2025_04_01.pdf
    note: >-
      Air IL & Coil IL (G2) instruction manual, rev. 04/01/2025, "Features
      Overview → Damper Adjustments", p. 6: LSC 25 clicks, LSR 25 clicks, HSC
      4.5 turns, HSR 4.5 turns, CS 2 positions. Climb Switch labels "Open" and
      "Climb" from the same manual's CS Mode page. Supersedes this file's
      earlier figures, which came from Cane Creek's Suspension Setup app.

  kitsuma_g2:
    name: DB Kitsuma G2
    description: |-
      - Tool-free twin-tube gravity damper with four independent circuits (HSC/LSC/HSR/LSR)
      - 11 positions on each of the four adjusters
      - Three-position Climb Switch: Open, Climb (closes the low-speed circuit) and Firm (closes both)
    adjustments:
      - { name: LSC, type: step, max: 11, notes: Low-Speed Compression }
      - { name: HSC, type: step, max: 11, notes: High-Speed Compression }
      - { name: LSR, type: step, max: 11, notes: Low-Speed Rebound }
      - { name: HSR, type: step, max: 11, notes: High-Speed Rebound }
      - { name: Climb Switch, type: categorical, options: [Open, Climb, Firm] }
    source: https://cdn.shopify.com/s/files/1/0579/5987/4639/files/Kitsuma_Manual_2025_04_01.pdf
    note: >-
      Kitsuma (G2) instruction manual, rev. 04/01/2025, "Features Overview →
      Damper Adjustments", p. 5: LSC 11, LSR 11, HSC 11, HSR 11, CS 3
      positions. The CS Mode page (p. 9) names the three settings Open, Climb
      and Firm — this file previously said 10 clicks and "Locked", both wrong.
      One manual covers Kitsuma Air and Kitsuma Coil, so the shared cartridge
      is stated by Cane Creek rather than assumed.

  tigon_damper:
    name: Tigon Damper
    description: |-
      - Twin-tube damper for the coil-plus-air Tigon: separate High- and Low-Speed Compression, single rebound circuit
      - 12 positions of Low-Speed Compression, 15 of rebound, and one full turn of High-Speed Compression
      - Two-position Climb Switch with a 3mm tool nested in the lever
    adjustments:
      - { name: LSC, type: step, max: 12, notes: Low-Speed Compression }
      - { name: HSC, type: numerical, unit: turns, min: 0, max: 1, notes: "High-Speed Compression; Continuous (no clicks); counted from fully closed" }
      - { name: Rebound, type: step, max: 15, notes: Low-Speed Rebound }
      - { name: Climb Switch, type: categorical, options: [Open, Climb] }
    source: https://cdn.shopify.com/s/files/1/0579/5987/4639/files/Tigon_Manual_2025_04_01.pdf
    note: >-
      Tigon instruction manual, rev. 04/01/2025, "Features Overview → Damper
      Adjustments", p. 6: LSC 12 positions, LSR 15 positions, HSC 1 turn, CS 2
      positions, Ramp Tube 0-30psi, coil preload 1-6 turns.

  # ---- Legacy dampers. Same badge, different numbers — never inherited. ----
  il_twin_tube_g1:
    name: DB Twin Tube (IL, G1)
    description: |-
      - First-generation inline Double Barrel damper with four independent circuits
      - Low-speed adjusters run 18 clicks; the high-speed adjusters are continuous, 4.5 turns end to end
      - Two-position Climb Switch with a 3mm adjustment tool nested in the lever
    adjustments:
      - { name: LSC, type: step, max: 18, notes: Low-Speed Compression }
      - { name: HSC, type: numerical, unit: turns, min: 0, max: 4.5, notes: "High-Speed Compression; Continuous (no clicks); counted from fully closed" }
      - { name: LSR, type: step, max: 18, notes: Low-Speed Rebound }
      - { name: HSR, type: numerical, unit: turns, min: 0, max: 4.5, notes: "High-Speed Rebound; Continuous (no clicks); counted from fully closed" }
      - { name: Climb Switch, type: categorical, options: [Open, Climb] }
    source: https://cdn.shopify.com/s/files/1/0579/5987/4639/files/DB-IL-Manual_2022_02_25_1_d8229608-3c4e-406c-bf6f-5b97afc6b6f8.pdf
    note: >-
      DB Air IL / DBcoil IL (G1) instruction manual, rev. 02/25/2022,
      "Features Overview → Damper Adjustments", p. 6: LSC 18 clicks, LSR 18
      clicks, HSC 4.5 turns, HSR 4.5 turns, CS 2 positions; air 50-300psi,
      coil preload 1-6 turns. The G2 runs 25 clicks and 350psi — a real
      generational change, which is why this key exists.

  kitsuma_g1:
    name: DB Kitsuma G1
    description: |-
      - First-generation Kitsuma twin-tube gravity damper with four independent circuits
      - 11 positions of low-speed adjustment per circuit, 13 positions of high-speed
      - Three-position Climb Switch: Open, Climb (closes the low-speed circuit) and Firm (closes both)
    adjustments:
      - { name: LSC, type: step, max: 11, notes: Low-Speed Compression }
      - { name: HSC, type: step, max: 13, notes: High-Speed Compression }
      - { name: LSR, type: step, max: 11, notes: Low-Speed Rebound }
      - { name: HSR, type: step, max: 13, notes: High-Speed Rebound }
      - { name: Climb Switch, type: categorical, options: [Open, Climb, Firm] }
    source: https://cdn.shopify.com/s/files/1/0579/5987/4639/files/DBKitsuma-Manual_2022_02_25_1_c25c4778-7d40-4977-a021-ac43a3c30070.pdf
    note: >-
      DB Kitsuma (G1) instruction manual, rev. 02/25/2022, "Features Overview
      → Damper Adjustments", p. 5: LSC 11, LSR 11, HSC 13, HSR 13, CS 3
      positions; air 50-300psi, coil preload 1-6 turns. The G2 moved the
      high-speed circuits from 13 to 11 positions.

  db_classic:
    name: Double Barrel (Classic)
    description: |-
      - The original four-way Double Barrel twin-tube damper
      - Low-speed compression and rebound run 25 clicks each
      - High-speed compression and rebound are continuous, 4 turns end to end
    adjustments:
      - { name: LSC, type: step, max: 25, notes: Low-Speed Compression }
      - { name: HSC, type: numerical, unit: turns, min: 0, max: 4, notes: "High-Speed Compression; Continuous (no clicks); counted from fully closed" }
      - { name: LSR, type: step, max: 25, notes: Low-Speed Rebound }
      - { name: HSR, type: numerical, unit: turns, min: 0, max: 4, notes: "High-Speed Rebound; Continuous (no clicks); counted from fully closed" }
    source:
      - https://cdn.shopify.com/s/files/1/0579/5987/4639/files/DB_owners-manual_2014_v11-web_8703fe9e-d4d7-4766-b7db-3350db90bbfb.pdf
      - https://cdn.shopify.com/s/files/1/0579/5987/4639/files/tfg_english_30a0cfe9-1830-4f4f-8436-09f3bfd14390.pdf
    note: >-
      Double Barrel owner's manual 2014 v11 (PN AAC0106), "My Settings" range
      chart, p. 36, and the Tuning Field Guide's per-adjuster range bars:
      HSC 0-4 turns, LSC 0-25 clicks, HSR 0-4 turns, LSR 0-25 clicks. Used for
      the Climb-Switch-less DBcoil; db_classic_cs adds the CS lever.

  db_classic_cs:
    name: Double Barrel CS (Classic)
    description: |-
      - The original four-way Double Barrel twin-tube damper plus the Climb Switch lever
      - Low-speed compression and rebound run 25 clicks each; high-speed adjusters are continuous, 4 turns end to end
      - Flipping the Climb Switch on firms up the low-speed circuits for climbing
    adjustments:
      - { name: LSC, type: step, max: 25, notes: Low-Speed Compression }
      - { name: HSC, type: numerical, unit: turns, min: 0, max: 4, notes: "High-Speed Compression; Continuous (no clicks); counted from fully closed" }
      - { name: LSR, type: step, max: 25, notes: Low-Speed Rebound }
      - { name: HSR, type: numerical, unit: turns, min: 0, max: 4, notes: "High-Speed Rebound; Continuous (no clicks); counted from fully closed" }
      - { name: Climb Switch, type: categorical, options: ["Off", "On"], notes: "On engages climb mode (firmer low-speed damping)" }
    source: https://cdn.shopify.com/s/files/1/0579/5987/4639/files/DB_owners-manual_2014_v11-web_8703fe9e-d4d7-4766-b7db-3350db90bbfb.pdf
    note: >-
      Same range chart as db_classic (2014 v11 manual, p. 36). The CS lever is
      documented on that manual's "How CS Works" page, p. 21, which shows the
      two lever positions as ON and OFF for both DBinline and DBair CS.

# --------------------------------------------------------------------------
# Shocks — current Cane Creek MTB lineup first, then the legacy generations
# (G1 IL, G1 Kitsuma, classic Double Barrel), which Cane Creek still supports
# via canecreek.com/pages/legacy-products-product-support.
# --------------------------------------------------------------------------
shocks:
  - model: "Air IL"
    category: XC / Downcountry
    spring: Air
    year_range: "2025-2026"
    url: https://www.canecreek.com/products/air-il
    trims:
      - trim: Standard
        mount: [Standard]
        stroke_mm: ["190x40", "190x42.5", "190x45", "210x50", "210x52.5", "210x55"]
        dampers: [il_twin_tube]
        adjustments: &il_air_spring
          - { name: Pressure, type: numerical, unit: psi, min: 50, max: 350, notes: "50 psi minimum, 350 psi maximum; Cane Creek recommends 25-35% sag" }
      - trim: Trunnion
        mount: [Trunnion]
        stroke_mm: ["165x40", "165x42.5", "165x45", "185x50", "185x52.5", "185x55"]
        dampers: [il_twin_tube]
        adjustments: *il_air_spring
    note: For bikes with 100-140mm rear travel; ~385g. Lightest shock in the Cane Creek lineup.

  - model: "Coil IL"
    category: XC / Trail
    spring: Coil
    year_range: "2025-2026"
    url: https://www.canecreek.com/products/coil-il
    trims:
      - trim: Standard
        mount: [Standard]
        stroke_mm: ["190x40", "190x42.5", "190x45", "210x50", "210x52.5", "210x55"]
        dampers: [il_twin_tube]
        adjustments: &il_coil_spring
          - { name: Spring Rate, type: numerical, unit: lbs/in, min: 0, notes: Cane Creek VALT linear or progressive spring sold separately — see Cane Creek's spring-rate guide }
          - { name: Preload, type: step, min: 3, max: 18, visualization: stepper, unit: clicks, notes: "Detented preload collar, 3 clicks per full turn. Keep at least 1 turn (3 clicks) engaged; 6 turns (18 clicks) is the maximum." }
      - trim: Trunnion
        mount: [Trunnion]
        stroke_mm: ["165x40", "165x42.5", "165x45", "185x50", "185x52.5", "185x55"]
        dampers: [il_twin_tube]
        adjustments: *il_coil_spring
    note: |-
      - ~280g without a spring
      - Not recommended for "clevis"-style suspension designs
      - Not compatible with the Specialized Stumpjumper or Turbo Levo

  - model: "Kitsuma"
    category: Enduro / Downhill
    spring: Air
    year_range: "2025-2026"
    url: https://www.canecreek.com/products/kitsuma-g2-air
    trims:
      - trim: Standard
        mount: [Standard]
        stroke_mm: ["210x50", "210x52.5", "210x55", "230x57.5", "230x60", "230x62.5", "230x65", "250x70", "250x75"]
        dampers: [kitsuma_g2]
        adjustments: &kitsuma_g2_air_spring
          - { name: Pressure, type: numerical, unit: psi, min: 50, max: 300, notes: "50 psi minimum, 300 psi maximum; Cane Creek recommends 25-35% sag" }
      - trim: Trunnion
        mount: [Trunnion]
        stroke_mm: ["185x50", "185x52.5", "185x55", "205x57.5", "205x60", "205x62.5", "205x65", "225x70", "225x75"]
        dampers: [kitsuma_g2]
        adjustments: *kitsuma_g2_air_spring
    note: "~585g. \"Gravity-first\" shock for long-travel trail/enduro/DH bikes; 2nd generation (G2)."

  - model: "Kitsuma Coil"
    category: Enduro / Downhill
    spring: Coil
    year_range: "2025-2026"
    url: https://www.canecreek.com/products/kisuma-g2-coil
    trims:
      - trim: Standard
        mount: [Standard]
        stroke_mm: ["210x50", "210x52.5", "210x55", "230x57.5", "230x60", "230x62.5", "230x65", "250x70", "250x72.5", "250x75"]
        dampers: [kitsuma_g2]
        adjustments: &kitsuma_g2_coil_spring
          - { name: Spring Rate, type: numerical, unit: lbs/in, min: 0, notes: Coil spring sold separately — see Cane Creek's VALT spring-rate guide }
          - { name: Preload, type: numerical, unit: turns, min: 1, max: 6, notes: "Keep at least 1 full turn of preload engaged; 6 turns is the maximum" }
      - trim: Trunnion
        mount: [Trunnion]
        stroke_mm: ["185x50", "185x52.5", "185x55", "205x57.5", "205x60", "205x62.5", "205x65", "225x70", "225x75"]
        dampers: [kitsuma_g2]
        adjustments: *kitsuma_g2_coil_spring
    note: ~417g without spring; 2nd generation (G2).

  - model: "Tigon"
    category: Trail / Enduro
    spring: Coil
    year_range: "2025-2026"
    url: https://www.canecreek.com/products/tigon
    trims:
      - trim: Standard
        mount: [Standard, Trunnion]
        stroke_mm: ["185x50", "185x52.5", "185x55", "205x60", "205x62.5", "205x65", "210x50", "210x52.5", "210x55", "230x60", "230x62.5", "230x65"]
        dampers: [tigon_damper]
        adjustments:
          - { name: Spring Rate, type: numerical, unit: lbs/in, min: 0, notes: Cane Creek VALT linear coil spring only — not compatible with progressive or third-party springs }
          - { name: Preload, type: numerical, unit: turns, min: 1, max: 6, notes: "Set sag with 0 psi in the RAMP Tube; keep at least 1 full turn engaged, 6 turns maximum" }
          - { name: RAMP Tube Pressure, type: numerical, unit: psi, min: 0, max: 30, notes: "Air-assist chamber that adds mid-stroke/end-stroke support alongside the VALT coil spring, independent of coil preload. Add in 5-10psi increments." }
    note: |-
      - "Air-charged coil": a RAMP Tube air spring supplements the coil spring for tunable progression
      - 441g in the 210 size, without a spring
      - 12.7mm shaft

  # ---- Legacy generations ------------------------------------------------
  - model: "DB Air IL G1"
    category: Trail / Enduro
    spring: Air
    url: https://www.canecreek.com/pages/legacy-products-product-support
    # Manual: cdn.shopify.com/.../DB-IL-Manual_2022_02_25_1_...pdf (covers
    # both DB Air IL and DBcoil IL). Trunnion versions exist — Cane Creek
    # publishes a separate trunnion 100-hour service guide for this shock.
    trims:
      - trim: Standard
        mount: [Standard, Trunnion]
        dampers: [il_twin_tube_g1]
        adjustments:
          - { name: Pressure, type: numerical, unit: psi, min: 50, max: 300, notes: "50 psi minimum, 300 psi maximum; Cane Creek recommends 25-35% sag" }
    note: |-
      - First-generation inline Double Barrel air shock, with the LinEair air spring
      - Starting air pressure is roughly the rider's weight in lbs, read as psi

  - model: "DBcoil IL G1"
    category: Trail / Enduro
    spring: Coil
    url: https://www.canecreek.com/pages/legacy-products-product-support
    trims:
      - trim: Standard
        mount: [Standard, Trunnion]
        dampers: [il_twin_tube_g1]
        adjustments:
          - { name: Spring Rate, type: numerical, unit: lbs/in, min: 0, notes: Cane Creek VALT spring sold separately — see Cane Creek's spring-rate guide }
          - { name: Preload, type: numerical, unit: turns, min: 1, max: 6, notes: "Keep at least 1 full turn of preload engaged; 6 turns is the maximum" }
    note: First-generation inline coil Double Barrel — a piggyback-style twin-tube damper in an inline body.

  - model: "DB Kitsuma Air G1"
    category: Enduro / Downhill
    spring: Air
    url: https://www.canecreek.com/blogs/journal/introducing-db-kitsuma
    # Manual: cdn.shopify.com/.../DBKitsuma-Manual_2022_02_25_1_...pdf
    trims:
      - trim: Standard
        mount: [Standard, Trunnion]
        dampers: [kitsuma_g1]
        adjustments:
          - { name: Pressure, type: numerical, unit: psi, min: 50, max: 300, notes: "50 psi minimum, 300 psi maximum; starting point is 75-100% of rider weight in lbs read as psi" }
    note: First-generation Kitsuma piggyback air shock for long-travel enduro and downhill bikes.

  - model: "DB Kitsuma Coil G1"
    category: Enduro / Downhill
    spring: Coil
    url: https://www.canecreek.com/blogs/journal/introducing-db-kitsuma
    trims:
      - trim: Standard
        mount: [Standard, Trunnion]
        dampers: [kitsuma_g1]
        adjustments:
          - { name: Spring Rate, type: numerical, unit: lbs/in, min: 0, notes: Coil spring sold separately — see Cane Creek's VALT spring-rate guide }
          - { name: Preload, type: numerical, unit: turns, min: 1, max: 6, notes: "Keep at least 1 full turn of preload engaged; 6 turns is the maximum" }
    note: First-generation Kitsuma piggyback coil shock for long-travel enduro and downhill bikes.

  - model: "DB Inline"
    category: Trail / All-Mountain
    spring: Air
    year_range: "2014-2019"
    url: https://www.canecreek.com/pages/legacy-products-product-support
    # Manual: cdn.shopify.com/.../DB_owners-manual_2014_v11-web_...pdf
    # 2014 introduction per canecreek.com's own company-history journal post.
    trims:
      - trim: Standard
        mount: [Standard]
        dampers: [db_classic_cs]
        adjustments:
          - { name: Pressure, type: numerical, unit: psi, min: 0 }
    note: |-
      - The Double Barrel packed into an inline body, no piggyback reservoir
      - Air volume is tuned with clip-in spacers inside the air can
      - Adding a large volume spacer usually wants about 1/4 turn more High-Speed Rebound

  - model: "DB Air CS"
    category: Trail / Enduro
    spring: Air
    url: https://www.canecreek.com/pages/legacy-products-product-support
    trims:
      - trim: Standard
        mount: [Standard]
        dampers: [db_classic_cs]
        adjustments:
          - { name: Pressure, type: numerical, unit: psi, min: 0 }
        note: |-
          - Piggyback air Double Barrel with the Climb Switch lever
          - Air volume is tuned with spacers inside the air can
          - The XV version adds an extra-volume air can for a more linear spring

  - model: "DBcoil"
    category: Enduro / Downhill
    spring: Coil
    url: https://www.canecreek.com/pages/legacy-products-product-support
    trims:
      - trim: Standard
        mount: [Standard]
        dampers: [db_classic]
        adjustments:
          - { name: Spring Rate, type: numerical, unit: lbs/in, min: 0, notes: Coil spring sold separately }
          - { name: Preload, type: numerical, unit: turns, min: 1, max: 6, notes: "Keep at least 1 full turn of preload engaged; 6 turns is the maximum" }
    note: Piggyback coil Double Barrel, four-way adjustable, without a Climb Switch lever.

# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - Legacy eye-to-eye / stroke options are not modelled. Cane Creek's legacy
#     support page links per-model dimension PDFs (DBAir-IL-Dimensions,
#     KITSUMA-AIR-USER-SPEC, DBInline_Dimensions, …) that would fill in
#     `stroke_mm:` for every legacy entry; none of them have been read yet.
#   - Legacy production year ranges: Cane Creek publishes none except the
#     DB Inline's 2014 introduction (company-history journal post), so
#     `year_range:` is omitted on the G1 IL, G1 Kitsuma, DB Air CS and DBcoil
#     entries rather than estimated. The DB Air IL/DBcoil IL G1 manual and the
#     DB Kitsuma G1 manual are both revision 02/25/2022, which dates the
#     generation but not its start or end.
#   - Classic Double Barrel air-volume spacers: the 2014 manual explains how
#     to add and remove them but never states how many the can accepts, so no
#     Volume Spacers adjustment is generated for DB Inline / DB Air CS.
#   - Classic Double Barrel air pressure: the 2014 manual gives no minimum or
#     maximum in a spec table (the 200 psi figure on p. 3 is part of a
#     stuck-down troubleshooting procedure, not a pressure limit), so those
