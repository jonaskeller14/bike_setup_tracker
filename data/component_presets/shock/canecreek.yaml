        - 12 Positionen Low-Speed-Druckstufe, 15 Zugstufe und eine volle Umdrehung High-Speed-Druckstufe
        - Zwei-Positionen-Climb-Switch mit einem 3-mm-Werkzeug im Hebel
      description_fr: |-
        - Amortisseur bitube pour le Tigon ressort + air : compression haute vitesse et basse vitesse séparées, un seul circuit de détente
        - 12 positions de compression basse vitesse, 15 de détente et un tour complet de compression haute vitesse
        - Climb Switch à deux positions avec un outil de 3 mm logé dans le levier
      description_it: |-
        - Ammortizzatore bitubo per il Tigon molla + aria: compressione ad alta e a bassa velocità separate, un solo circuito di ritorno
        - 12 posizioni di compressione a bassa velocità, 15 di ritorno e un giro completo di compressione ad alta velocità
        - Climb Switch a due posizioni con un attrezzo da 3 mm alloggiato nella leva
      description_es: |-
