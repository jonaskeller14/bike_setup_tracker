        "Climb" from the same manual's CS Mode page. Supersedes this file's
        earlier figures, which came from Cane Creek's Suspension Setup app.

    kitsuma_g2:
      name: DB Kitsuma G2
      description: |-
        - Tool-free twin-tube gravity damper with four independent circuits (HSC/LSC/HSR/LSR)
        - 11 positions on each of the four adjusters
        - Three-position Climb Switch: Open, Climb (closes the low-speed circuit) and Firm (closes both)
      description_de: |-
        - Werkzeuglos einstellbarer Zweirohr-Gravity-Dämpfer mit vier unabhängigen Kreisen (HSC/LSC/HSR/LSR)
        - 11 Positionen an jedem der vier Versteller
        - Drei-Positionen-Climb-Switch: Open, Climb (schließt den Low-Speed-Kreis) und Firm (schließt beide)
      description_fr: |-
        - Amortisseur gravity bitube sans outil avec quatre circuits indépendants (HSC/LSC/HSR/LSR)
        - 11 positions sur chacun des quatre réglages
        - Climb Switch à trois positions : Open, Climb (ferme le circuit basse vitesse) et Firm (ferme les deux)
      description_it: |-
        - Ammortizzatore gravity bitubo senza attrezzi con quattro circuiti indipendenti (HSC/LSC/HSR/LSR)
        - 11 posizioni su ciascuno dei quattro regolatori
        - Climb Switch a tre posizioni: Open, Climb (chiude il circuito a bassa velocità) e Firm (chiude entrambi)
      description_es: |-
        - Amortiguador gravity bitubo sin herramientas con cuatro circuitos independientes (HSC/LSC/HSR/LSR)
        - 11 posiciones en cada uno de los cuatro ajustes
        - Climb Switch de tres posiciones: Open, Climb (cierra el circuito de baja velocidad) y Firm (cierra ambos)
      description_pt: |-
        - Amortecedor gravity bitubo sem ferramentas com quatro circuitos independentes (HSC/LSC/HSR/LSR)
        - 11 posições em cada um dos quatro ajustes
        - Climb Switch de três posições: Open, Climb (fecha o circuito de baixa velocidade) e Firm (fecha os dois)
      adjustments:
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 11, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade, dialColor: grey }
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 11, notes: High-Speed Compression, notes_de: High-Speed-Druckstufe, notes_fr: Compression haute vitesse, notes_it: Compressione ad alta velocità, notes_es: Compresión de alta velocidad, notes_pt: Compressão de alta velocidade, dialColor: grey }
        - { name: LSR, name_de: LSR, name_fr: LSR, name_it: LSR, name_es: LSR, name_pt: LSR, type: step, max: 11, notes: Low-Speed Rebound, notes_de: Low-Speed-Zugstufe, notes_fr: Détente basse vitesse, notes_it: Ritorno a bassa velocità, notes_es: Rebote de baja velocidad, notes_pt: Retorno de baixa velocidade, dialColor: grey }
        - { name: HSR, name_de: HSR, name_fr: HSR, name_it: HSR, name_es: HSR, name_pt: HSR, type: step, max: 11, notes: High-Speed Rebound, notes_de: High-Speed-Zugstufe, notes_fr: Détente haute vitesse, notes_it: Ritorno ad alta velocità, notes_es: Rebote de alta velocidad, notes_pt: Retorno de alta velocidade, dialColor: grey }
        - { name: Climb Switch, name_de: Climb-Schalter, name_fr: Levier Climb, name_it: Leva Climb, name_es: Palanca Climb, name_pt: Alavanca Climb, type: categorical, options: [Open, Climb, Firm], options_de: [Offen, Climb, Fest], options_fr: [Ouvert, Climb, Ferme], options_it: [Aperto, Climb, Rigido], options_es: [Abierto, Climb, Firme], options_pt: [Aberto, Climb, Firme] }
      source: https://cdn.shopify.com/s/files/1/0579/5987/4639/files/Kitsuma_Manual_2025_04_01.pdf
      note: >-
        Kitsuma (G2) instruction manual, rev. 04/01/2025, "Features Overview →
        Damper Adjustments", p. 5: LSC 11, LSR 11, HSC 11, HSR 11, CS 3
        positions. The CS Mode page (p. 9) names the three settings Open, Climb
        and Firm — this file previously said 10 clicks and "Locked", both wrong.
        One manual covers Kitsuma Air and Kitsuma Coil, so the shared cartridge
        is stated by Cane Creek rather than assumed.

    tigon_damper:
