        - { name: Climb Switch, name_de: Climb-Schalter, name_fr: Levier Climb, name_it: Leva Climb, name_es: Palanca Climb, name_pt: Alavanca Climb, type: categorical, options: [Open, Climb], options_de: [Offen, Climb], options_fr: [Ouvert, Climb], options_it: [Aperto, Climb], options_es: [Abierto, Climb], options_pt: [Aberto, Climb] }
      source: https://cdn.shopify.com/s/files/1/0579/5987/4639/files/Tigon_Manual_2025_04_01.pdf
      note: >-
        Tigon instruction manual, rev. 04/01/2025, "Features Overview → Damper
        Adjustments", p. 6: LSC 12 positions, LSR 15 positions, HSC 1 turn, CS 2
