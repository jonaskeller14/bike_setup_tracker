# Service intervals (`tasks`) come from each shock's manual (its `setup_guide`):
# the current and G1 manuals service damper and air spring together every
# 100 hours or annually. The 2014 Double Barrel manual gives the air spring
# 100 hours or semi-annually and the damper 100 hours.
#
# Every click/turn count below is read off the "Damper Adjustments" table in
# the relevant generation's official Cane Creek instruction manual (each
# damper carries the exact PDF in its `source:` key). Those tables footnote
# that "count of adjuster positions may vary slightly with some shock builds.
# The range of adjustment will remain the same." Counting runs from fully
# closed (clockwise = closed = more damping), so the default `dial_ccw`
# visualization applies unless noted.
#
# Generations do NOT share numbers — the same twin-tube damper family runs
# 25 clicks of LSC on the current IL, 18 on the G1 IL and 25 on the original
# Double Barrel, so each generation has its own damper id.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    il_twin_tube:
      name: DB Twin Tube (IL)
      description: |-
        - Four independent circuits: High- and Low-Speed Compression, High- and Low-Speed Rebound
        - Low-speed adjusters run 25 clicks; the high-speed adjusters are continuous, 4.5 turns end to end
        - Climb Switch lever with a 3mm adjustment tool nested inside it
      description_de: |-
        - Vier unabhängige Kreise: High- und Low-Speed-Druckstufe, High- und Low-Speed-Zugstufe
        - Die Low-Speed-Versteller haben 25 Klicks; die High-Speed-Versteller sind stufenlos, 4,5 Umdrehungen von Anschlag zu Anschlag
        - Climb-Switch-Hebel mit einem darin verstauten 3-mm-Einstellwerkzeug
      description_fr: |-
        - Quatre circuits indépendants : compression haute et basse vitesse, détente haute et basse vitesse
        - Les réglages basse vitesse font 25 clics ; les réglages haute vitesse sont continus, 4,5 tours de bout en bout
        - Levier Climb Switch avec un outil de réglage de 3 mm logé à l’intérieur
      description_it: |-
        - Quattro circuiti indipendenti: compressione ad alta e bassa velocità, ritorno ad alta e bassa velocità
        - I regolatori a bassa velocità hanno 25 scatti; quelli ad alta velocità sono continui, 4,5 giri da un estremo all’altro
        - Leva Climb Switch con un attrezzo di regolazione da 3 mm alloggiato all’interno
      description_es: |-
        - Cuatro circuitos independientes: compresión de alta y baja velocidad, rebote de alta y baja velocidad
        - Los ajustes de baja velocidad tienen 25 clics; los de alta velocidad son continuos, 4,5 vueltas de extremo a extremo
        - Palanca Climb Switch con una herramienta de ajuste de 3 mm alojada en su interior
      description_pt: |-
        - Quatro circuitos independentes: compressão de alta e baixa velocidade, retorno de alta e baixa velocidade
        - Os ajustes de baixa velocidade têm 25 cliques; os de alta velocidade são contínuos, 4,5 voltas de ponta a ponta
        - Alavanca Climb Switch com uma ferramenta de ajuste de 3 mm alojada dentro dela
      adjustments:
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 25, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade, dialColor: orange, dialSize: small }
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: numerical, unit: turns, min: 0, max: 4.5, notes: "High-Speed Compression; Continuous (no clicks); counted from fully closed", notes_de: High-Speed-Druckstufe; stufenlos (ohne Klicks); von ganz geschlossen gezählt, notes_fr: Compression haute vitesse ; continue (sans clics) ; comptée depuis la position entièrement fermée, notes_it: Compressione ad alta velocità; continua (senza scatti); contata a partire dalla posizione completamente chiusa, notes_es: Compresión de alta velocidad; continua (sin clics); contada desde la posición totalmente cerrada, notes_pt: Compressão de alta velocidade; contínua (sem cliques); contada a partir da posição totalmente fechada }
        - { name: LSR, name_de: LSR, name_fr: LSR, name_it: LSR, name_es: LSR, name_pt: LSR, type: step, max: 25, notes: Low-Speed Rebound, notes_de: Low-Speed-Zugstufe, notes_fr: Détente basse vitesse, notes_it: Ritorno a bassa velocità, notes_es: Rebote de baja velocidad, notes_pt: Retorno de baixa velocidade, dialColor: orange, dialSize: small }
        - { name: HSR, name_de: HSR, name_fr: HSR, name_it: HSR, name_es: HSR, name_pt: HSR, type: numerical, unit: turns, min: 0, max: 4.5, notes: "High-Speed Rebound; Continuous (no clicks); counted from fully closed", notes_de: High-Speed-Zugstufe; stufenlos (ohne Klicks); von ganz geschlossen gezählt, notes_fr: Détente haute vitesse ; continue (sans clics) ; comptée depuis la position entièrement fermée, notes_it: Ritorno ad alta velocità; continuo (senza scatti); contato a partire dalla posizione completamente chiusa, notes_es: Rebote de alta velocidad; continuo (sin clics); contado desde la posición totalmente cerrada, notes_pt: Retorno de alta velocidade; contínuo (sem cliques); contado a partir da posição totalmente fechada }
        - { name: Climb Switch, name_de: Climb-Schalter, name_fr: Levier Climb, name_it: Leva Climb, name_es: Palanca Climb, name_pt: Alavanca Climb, type: categorical, options: [Open, Climb], options_de: [Offen, Climb], options_fr: [Ouvert, Climb], options_it: [Aperto, Climb], options_es: [Abierto, Climb], options_pt: [Aberto, Climb] }
      valves: twin-tube; 2 high-speed + 2 low-speed damping circuits
      source: https://cdn.shopify.com/s/files/1/0579/5987/4639/files/DB_IL_G2_Manual_2025_04_01.pdf
      note: >-
        Air IL & Coil IL (G2) instruction manual, rev. 04/01/2025, "Features
        Overview → Damper Adjustments", p. 6: LSC 25 clicks, LSR 25 clicks, HSC
