      shock:air_can_service: { interval: { moving_time_h: 100 }, fallback: { days: 180 }, source: Cane Creek Double Barrel owner's manual, source_de: Cane-Creek-Double-Barrel-Handbuch, source_fr: Manuel d’utilisation Cane Creek Double Barrel, source_it: Manuale d’uso Cane Creek Double Barrel, source_es: Manual del usuario Cane Creek Double Barrel, source_pt: Manual do usuário Cane Creek Double Barrel }
      shock:full_service: &double_barrel_full_service { interval: { moving_time_h: 100 }, source: Cane Creek Double Barrel owner's manual, source_de: Cane-Creek-Double-Barrel-Handbuch, source_fr: Manuel d’utilisation Cane Creek Double Barrel, source_it: Manuale d’uso Cane Creek Double Barrel, source_es: Manual del usuario Cane Creek Double Barrel, source_pt: Manual do usuário Cane Creek Double Barrel }
    children:
      - label: "2014–2019"
        level: generation
        id: "2014"
        years: "2014-2019"
        url: https://www.canecreek.com/pages/legacy-products-product-support
        setup_guide: https://cdn.shopify.com/s/files/1/0579/5987/4639/files/DB_owners-manual_2014_v11-web_8703fe9e-d4d7-4766-b7db-3350db90bbfb.pdf
        guide: canecreek_double_barrel_tfg
        note: |-
          - The Double Barrel packed into an inline body, no piggyback reservoir
          - Air volume is tuned with clip-in spacers inside the air can
          - Adding a large volume spacer usually wants about 1/4 turn more High-Speed Rebound
        note_de: |-
          - Der Double Barrel in einem Inline-Gehäuse, ohne Piggyback-Ausgleichsbehälter
          - Das Luftvolumen wird mit Einklick-Spacern in der Luftkammer abgestimmt
          - Ein großer Volumenspacer erfordert in der Regel etwa 1/4 Umdrehung mehr High-Speed-Zugstufe
        note_fr: |-
          - Le Double Barrel logé dans un corps inline, sans réservoir piggyback
          - Le volume d’air se règle avec des entretoises à clipser dans la chambre à air
          - Ajouter une grande entretoise de volume demande en général environ 1/4 de tour de détente haute vitesse en plus
        note_it: |-
          - Il Double Barrel in un corpo inline, senza serbatoio piggyback
          - Il volume d’aria si regola con distanziali a clip dentro la camera d’aria
          - Aggiungere un distanziale di volume grande richiede in genere circa 1/4 di giro di ritorno ad alta velocità in più
        note_es: |-
          - El Double Barrel en un cuerpo inline, sin depósito piggyback
          - El volumen de aire se ajusta con espaciadores de clip dentro de la cámara de aire
          - Añadir un espaciador de volumen grande suele pedir aproximadamente 1/4 de vuelta más de rebote de alta velocidad
        note_pt: |-
          - O Double Barrel em um corpo inline, sem reservatório piggyback
          - O volume de ar é ajustado com espaçadores de encaixe dentro da câmara de ar
          - Acrescentar um espaçador de volume grande normalmente pede cerca de 1/4 de volta a mais de retorno de alta velocidade
        # Manual: cdn.shopify.com/.../DB_owners-manual_2014_v11-web_...pdf
        # 2014 introduction per canecreek.com's own company-history journal post.
        children:
          - label: Standard
            level: mount
            specs: { mount: Standard }
            adjustments:
              - { name: Pressure, name_de: Luftdruck, name_fr: Pression d’air, name_it: Pressione dell’aria, name_es: Presión de aire, name_pt: Pressão do ar, type: numerical, unit: psi, min: 0 }
            options:
              damper: [db_inline]

