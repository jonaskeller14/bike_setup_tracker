# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - Legacy eye-to-eye / stroke options: DB Kitsuma G1 Air and Coil sizes (with
#     per-size mounts) are read off the variant list of their canecreek.com
#     product pages. DB Air IL G1, DBcoil IL G1, DB Inline, DB Air CS and DBcoil
#     have no product page, and their manuals and dimension drawings only say
#     "refer to owner's manual" without listing sizes, so no `size` axis is
#     declared. Retailer listings show only a few DBair IL / DBcoil IL sizes
#     (165x42.5, 185x50, 185x52.5, 200x50), which is not enough to list.
#   - Volume spacers: only the Kitsuma G2 manual states a maximum (9 or 11
#     single-width strips by size). The Air IL G2, DB Air IL G1 and DB Kitsuma G1
#     manuals explain installing volume reducers but state no count, and the
#     2014 Double Barrel manual never states how many its air can accepts, so no
#     Volume Spacers adjustment is generated for them.
#   - Setup guides: Tigon links Cane Creek's set-up procedure page; every other
#     shock links its instruction manual. No dial colours are stated in text.
#   - Legacy production year ranges: Cane Creek publishes none except the
#     DB Inline's 2014 introduction (company-history journal post), so
#     `years` is omitted on the G1 IL, G1 Kitsuma, DB Air CS and DBcoil
#     entries rather than estimated. The DB Air IL/DBcoil IL G1 manual and the
#     DB Kitsuma G1 manual are both revision 02/25/2022, which dates the
#     generation but not its start or end.
#   - Classic Double Barrel air pressure: the 2014 manual gives no minimum or
#     maximum in a spec table (the 200 psi figure on p. 3 is part of a
#     stuck-down troubleshooting procedure, not a pressure limit), so those
#     entries carry an unbounded Pressure.
#   - DBair CS XV / DBcoil CS: the CS coil and the extra-volume XV air cans
#     are separate SKUs on Cane Creek's legacy support page. They share the
#     classic Double Barrel damper ranges but were not added as their own
#     models; the XV difference is noted on the DB Air CS trim instead.
#
# Tigon (2026-10-10): the manual's spring chart gives 350-650 lbs/in and ties
# the mount to the eye-to-eye length (210 and 230 Standard, 185 and 205
# Trunnion), so sizes now carry their mount.
#
# Resolved 2026-09-10 (all against official Cane Creek PDF manuals):
#   - Every current-lineup click count now comes from a printed manual rather
#     than the Suspension Setup app. Two were wrong: Kitsuma G2 is 11 clicks
#     per circuit (not 10) and its Climb Switch reads Open / Climb / Firm
#     (not "Locked").
#   - Coil IL preload detents: 3 clicks per turn, 6 turns / 18 clicks maximum
#     (Air IL & Coil IL G2 manual, p. 6).
#   - Kitsuma Coil's Climb Switch labels come from the single Kitsuma manual
#     that covers both Air and Coil, so the shared cartridge is now stated by
#     Cane Creek rather than assumed.
#   - G1 vs G2 is a genuine internal change, as suspected: G1 IL runs 18-click
#     low-speed circuits and 300psi max where the G2 runs 25 clicks and
#     350psi; G1 Kitsuma runs 13-position high-speed circuits where the G2
#     runs 11.
# --------------------------------------------------------------------------
