# --------------------------------------------------------------------------
# Setup guides — the manuals' starting points as data (SCHEMA.md, "Setup
# guides"), transcribed from docs/research/setup_guides/canecreek.md.
#   * Air pressure: Cane Creek prints a share of the rider's weight in lb,
#     read as psi, not a table; the rows are calculated from it at 5 kg steps.
#   * No current or G1 manual prints damper starting clicks; only the classic
#     Double Barrel's Tuning Field Guide has a factory base tune.
#   * Coil spring rate: Cane Creek's formula (rear wheel travel / stroke x
#     rider weight) needs the bike's rear travel, so no rule until bike-level
#     inputs exist (#71). The coil preload windows (at least one turn, a
#     stiffer spring past two or three) are limits, not starting points.
# --------------------------------------------------------------------------
guides:
  canecreek_air_coil_il_g2_2025:
    label: Cane Creek Air IL and Coil IL manual (2025)
    label_de: Cane Creek Air IL und Coil IL Handbuch (2025)
    label_fr: Manuel Cane Creek Air IL et Coil IL (2025)
    label_it: Manuale Cane Creek Air IL e Coil IL (2025)
    label_es: Manual Cane Creek Air IL y Coil IL (2025)
    label_pt: Manual Cane Creek Air IL e Coil IL (2025)
    source: https://cdn.shopify.com/s/files/1/0579/5987/4639/files/DB_IL_G2_Manual_2025_04_01.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          50: 132, 55: 146, 60: 159, 65: 172, 70: 185,
          75: 198, 80: 212, 85: 225, 90: 238, 95: 251,
          100: 265, 105: 278, 110: 291, 115: 304, 120: 317
        }
        note: Calculated from Cane Creek's starting point (120 % of rider weight in lb, as psi); set the final pressure by SAG
        note_de: Berechnet aus dem Ausgangspunkt von Cane Creek (120 % des Fahrergewichts in lb, als psi); den endgültigen Druck über den SAG einstellen
        note_fr: Calculé à partir du point de départ de Cane Creek (120 % du poids du pilote en lb, en psi) ; réglez la pression finale au SAG
        note_it: Calcolato dal punto di partenza di Cane Creek (120 % del peso del rider in lb, come psi); regola la pressione finale in base al SAG
        note_es: Calculado a partir del punto de partida de Cane Creek (120 % del peso del rider en lb, como psi); ajusta la presión final según el SAG
        note_pt: Calculado a partir do ponto de partida da Cane Creek (120 % do peso do rider em lb, como psi); defina a pressão final pelo SAG
      - &canecreek_sag { target: sag, range: [25, 35], comfort_at: max, note: "Cane Creek starts at 30 %", note_de: Cane Creek beginnt bei 30 %, note_fr: Cane Creek part de 30 %, note_it: Cane Creek part de 30 %, note_es: Cane Creek parte de un 30 %, note_pt: A Cane Creek parte de 30 % }

  canecreek_kitsuma_g2_2025:
    label: Cane Creek Kitsuma manual (2025)
    label_de: Cane Creek Kitsuma Handbuch (2025)
    label_fr: Manuel Cane Creek Kitsuma (2025)
    label_it: Manuale Cane Creek Kitsuma (2025)
    label_es: Manual Cane Creek Kitsuma (2025)
    label_pt: Manual Cane Creek Kitsuma (2025)
    source: https://cdn.shopify.com/s/files/1/0579/5987/4639/files/Kitsuma_Manual_2025_04_01.pdf
    rules:
      - &canecreek_kitsuma_pressure
        target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          50: [83, 110], 55: [91, 121], 60: [99, 132], 65: [107, 143], 70: [116, 154],
          75: [124, 165], 80: [132, 176], 85: [141, 187], 90: [149, 198], 95: [157, 209],
          100: [165, 220], 105: [174, 231], 110: [182, 243], 115: [190, 254], 120: [198, 265]
        }
        note: Calculated from Cane Creek's starting point (75-100 % of rider weight in lb, as psi); set the final pressure by SAG
        note_de: Berechnet aus dem Ausgangspunkt von Cane Creek (75-100 % des Fahrergewichts in lb, als psi); den endgültigen Druck über den SAG einstellen
        note_fr: Calculé à partir du point de départ de Cane Creek (75-100 % du poids du pilote en lb, en psi) ; réglez la pression finale au SAG
        note_it: Calcolato dal punto di partenza di Cane Creek (75-100 % del peso del rider in lb, come psi); regola la pressione finale in base al SAG
        note_es: Calculado a partir del punto de partida de Cane Creek (75-100 % del peso del rider en lb, como psi); ajusta la presión final según el SAG
        note_pt: Calculado a partir do ponto de partida da Cane Creek (75-100 % do peso do rider em lb, como psi); defina a pressão final pelo SAG
      - *canecreek_sag
