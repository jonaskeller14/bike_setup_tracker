# DT Swiss mountain-bike rear shocks — adjustment preset database
#
# Same design as shock/fox.yaml and shock/rockshox.yaml: click ranges belong to
# the DAMPER, defined once under `option_values.damper` and referenced by id from each
# shock's trims. See SCHEMA.md in this folder.
#
# All three DT Swiss shock lines are LINEAIR dual-air-chamber shocks. The user
# manuals give a different rebound click count for standard-mount (around 40)
# and trunnion-mount (22) shocks, so each mount type is its own trim with its
# own damper.

brand: DT Swiss
component_type: shock
sources:
  - https://www.dtswiss.com/en/suspension/shocks/r-535-one
  - https://www.dtswiss.com/en/suspension/shocks/r-535
  - https://www.dtswiss.com/en/suspension/shocks/r-232-one
  - https://www.dtswiss.com/en/support/manuals
  - https://setupguide.dtswiss.com/en/
  # Primary — DT Swiss official user manuals (PDF)
  - https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/04/86/2/MAN_CXD10000004862S_WEB_ZZ_001.pdf
  - https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/01/87/3/MAN_CXD10000001873S_WEB_ZZ_001.pdf
  - https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/03/02/9/MAN_CXD10000003029S_WEB_ZZ_001.pdf
  # Secondary — editorial (article body text only)
  - https://www.pinkbike.com/news/first-ride-dt-swisss-new-232-one-platform.html
updated: 2026-10-13
# Service intervals (`tasks`) come from the user manuals cited above: a small
# service every 50 operating hours (mapped to the air-can service) and a full
# service annually or after 200 operating hours.
#
# Counting conventions:
#   * Rebound: the manuals describe "rotating the red rebound wheel by around 40
#     clicks (shock with standard mount) or 22 clicks (shock with trunnion
#     mount)"; clockwise adds damping. The counts are DT Swiss's own
#     approximations ("around"), and no zero point is stated, so they are
#     stored as plain 0..N ranges.
#   * Compression has no click adjuster on these shocks — only the lever modes.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    r535_one_standard:
      name: INCONTROL O.D.L. (standard mount)
      description: |-
        - Lever with three modes: Open, Drive (partly closed compression) and Lock (with a blow-off valve)
        - Red rebound wheel, around 40 clicks on standard-mount shocks
      description_de: |-
        - Hebel mit drei Modi: Open, Drive (teilweise geschlossene Druckstufe) und Lock (mit Blow-off-Ventil)
        - Rotes Zugstufenrad, etwa 40 Klicks bei Dämpfern mit Standardaufnahme
      description_fr: |-
        - Levier à trois modes : Open, Drive (compression partiellement fermée) et Lock (avec une valve blow-off)
        - Molette de détente rouge, environ 40 clics sur les amortisseurs à fixation standard
      description_it: |-
        - Leva a tre modalità: Open, Drive (compressione parzialmente chiusa) e Lock (con una valvola blow-off)
        - Manopola rossa del ritorno, circa 40 scatti sugli ammortizzatori con attacco standard
      description_es: |-
        - Palanca de tres modos: Open, Drive (compresión parcialmente cerrada) y Lock (con una válvula blow-off)
        - Rueda roja de rebote, unos 40 clics en los amortiguadores con anclaje estándar
      description_pt: |-
        - Alavanca de três modos: Open, Drive (compressão parcialmente fechada) e Lock (com uma válvula blow-off)
        - Seletor vermelho de retorno, cerca de 40 cliques nos amortecedores com fixação padrão
      adjustments:
        - { name: Compression Mode, name_de: Druckstufenmodus, name_fr: Mode de compression, name_it: Modalità di compressione, name_es: Modo de compresión, name_pt: Modo de compressão, type: categorical, options: [Open, Drive, Lock], options_de: [Offen, Drive, Lock], options_fr: [Ouvert, Drive, Lock], options_it: [Aperto, Drive, Lock], options_es: [Abierto, Drive, Lock], options_pt: [Aberto, Drive, Lock] }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 40, notes: 'Clockwise adds damping; DT Swiss states around 40 clicks', notes_de: Im Uhrzeigersinn erhöht die Dämpfung; DT Swiss nennt etwa 40 Klicks, notes_fr: Le sens horaire ajoute de l’amortissement ; DT Swiss indique environ 40 clics, notes_it: Il senso orario aumenta lo smorzamento; DT Swiss indica circa 40 scatti, notes_es: El sentido horario añade amortiguación; DT Swiss indica unos 40 clics, notes_pt: O sentido horário aumenta o amortecimento; a DT Swiss indica cerca de 40 cliques, dialColor: red }
      source:
        - https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/04/86/2/MAN_CXD10000004862S_WEB_ZZ_001.pdf
