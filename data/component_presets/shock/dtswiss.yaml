# --------------------------------------------------------------------------
# Setup guides — the user manuals' starting points as data (SCHEMA.md,
# "Setup guides"), transcribed from docs/research/setup_guides/dtswiss.md.
# The pressure tables have no size or mount column and assume an average
# leverage ratio (2.5 on the R 535); the final pressure is set by SAG. The
# manuals publish no rebound setting.
# --------------------------------------------------------------------------
guides:
  dtswiss_r535_2023:
    label: DT Swiss R 535 / R 535 ONE user manual (2023)
    label_de: DT Swiss R 535 / R 535 ONE Bedienungsanleitung (2023)
    label_fr: Manuel d’utilisation DT Swiss R 535 / R 535 ONE (2023)
    label_it: Manuale d’uso DT Swiss R 535 / R 535 ONE (2023)
    label_es: Manual del usuario DT Swiss R 535 / R 535 ONE (2023)
    label_pt: Manual do usuário DT Swiss R 535 / R 535 ONE (2023)
    source: https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/04/86/2/MAN_CXD10000004862S_WEB_ZZ_001.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          40: 143, 45: 157, 50: 171, 55: 184, 60: 198,
          65: 211, 70: 225, 75: 239, 80: 252, 85: 266,
          90: 279, 95: 293, 100: 307, 105: 320, 110: 330
        }
        note: &dt_shock_pressure A starting point that varies with the frame; set the final pressure by SAG
        note_de: &dt_shock_pressure_de Ein Ausgangspunkt, der je nach Rahmen variiert; den endgültigen Druck über den SAG einstellen
        note_fr: &dt_shock_pressure_fr Un point de départ qui varie selon le cadre ; réglez la pression finale au SAG
        note_it: &dt_shock_pressure_it Un punto di partenza che varia in base al telaio; regola la pressione finale in base al SAG
        note_es: &dt_shock_pressure_es Un punto de partida que varía según el cuadro; ajusta la presión final según el SAG
        note_pt: &dt_shock_pressure_pt Um ponto de partida que varia conforme o quadro; defina a pressão final pelo SAG
      - &dt_shock_mode { target: compression_mode, value: Open }
      - &dt_shock_sag { target: sag, range: [20, 35], comfort_at: max, note: "DT Swiss: 20-25 % for a firmer cross-country feel, 25-35 % for downhill", note_de: "DT Swiss: 20-25 % für ein festeres Cross-Country-Gefühl, 25-35 % für Downhill", note_fr: "DT Swiss : 20-25 % pour une sensation cross-country plus ferme, 25-35 % pour la descente", note_it: "DT Swiss: 20-25 % per una sensazione cross-country più rigida, 25-35 % per il downhill", note_es: "DT Swiss: 20-25 % para una sensación cross-country más firme, 25-35 % para descenso", note_pt: "DT Swiss: 20-25 % para uma sensação cross-country mais firme, 25-35 % para downhill" }

  dtswiss_r232one_2021:
    label: DT Swiss R 232 ONE user manual (2021)
    label_de: DT Swiss R 232 ONE Bedienungsanleitung (2021)
    label_fr: Manuel d’utilisation DT Swiss R 232 ONE (2021)
    label_it: Manuale d’uso DT Swiss R 232 ONE (2021)
    label_es: Manual del usuario DT Swiss R 232 ONE (2021)
    label_pt: Manual do usuário DT Swiss R 232 ONE (2021)
    source: https://d2a13k6araex7u.cloudfront.net/pmt/00/00/00/00/00/00/00/10/00/00/03/02/9/MAN_CXD10000003029S_WEB_ZZ_001.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          40: 83, 45: 92, 50: 100, 55: 109, 60: 117,
          65: 126, 70: 134, 75: 142, 80: 151, 85: 159,
          90: 168, 95: 176, 100: 185, 105: 193, 110: 201
        }
        note: *dt_shock_pressure
        note_de: *dt_shock_pressure_de
        note_fr: *dt_shock_pressure_fr
        note_it: *dt_shock_pressure_it
        note_es: *dt_shock_pressure_es
        note_pt: *dt_shock_pressure_pt
      - *dt_shock_mode
      - *dt_shock_sag

