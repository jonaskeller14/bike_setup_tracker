# DVO Suspension mountain-bike shocks — adjustment preset database
#
# Same design as shock/fox.yaml, shock/ohlins.yaml: click ranges belong to the
# DAMPER, defined once under `option_values.damper` and referenced by id from each
# shock's trims. See SCHEMA.md in this folder.
#
# DVO's current air-shock lineup (Topaz, Opal) and coil-shock lineup (Jade,
# Jade X) share two damper platforms across models: "Prime" (independent
# High/Low Speed Compression dials) and "T3" (single lever, 3 positions:
# Open/Mid/Firm). Both platforms also expose an externally adjustable
# "bladder" pressure (an IFP alternative), 140-180psi on both the Jade X and
# Topaz Set-Up Guides. The older Jade and the older Topaz T3Air run a higher
# 170-200psi bladder, so bladder ranges are set per generation, never shared.
#
# Reading numbers out of DVO's shock docs, two traps:
#   1. A "base setting chart" is a recommendation table, NOT the adjuster's
#      range. DVO's own docs prove it: the 2020 Fork Set-Up Guide's Diamond
#      rebound chart runs to column 22, while tech.dvosuspension.com states the
#      Diamond's real range is 20 clicks total. A chart column is therefore
#      only used as a flagged estimate (Topaz Prime / T3Air rebound 9); the
#      Topaz Pro's 9 is stated in Pinkbike's Topaz 3 review.
#   2. A scale strip printed on the adjuster page IS a range statement — that
#      is where the Jade X's HSC (Open 1..10 Closed) and LSC (Open 1..5 Closed)
#      come from. The Jade X rebound strip reads "Open 18+ 16 ... 0 Closed":
#      the "18+" is open-ended, so 18 is only a lower bound and is recorded as
#      a flagged estimate.

brand: DVO
component_type: shock
sources:
  - https://dvosuspension.com/product-category/suspension/shocks/
  - https://dvosuspension.com/product/jade-x/
  - https://dvosuspension.com/product/jade-x-prime/
  - https://dvosuspension.com/product/jade-x-wp/
  - https://dvosuspension.com/wp-content/uploads/2023/11/Jade-X-Setup-Guide-Nov20.pdf
  - https://dvosuspension.com/product/jade/
  - https://tech.dvosuspension.com/setup/
  - https://tech.dvosuspension.com/setup/jade/
  - https://tech.dvosuspension.com/setup/jade-x/
  - https://dvosuspension.com/product/topaz-gen-3/
  - https://dvosuspension.com/product/topaz-prime/
  - https://dvosuspension.com/product/topaz-wp-cv/
  - https://dvosuspension.com/wp-content/uploads/2024/05/DVO-Topaz-Setup-Guide-May9.pdf
  - https://dvosuspension.com/product/topaz-2/
  - https://dvosuspension.com/wp-content/uploads/2024/05/DVO-Jade-X-Setup-Guide-May16.pdf
  - https://dvosuspension.com/wp-content/uploads/2024/02/DVO-Jade-X-WP-Setup_Guide_Dec5_2023.pdf
  - https://dvosuspension.com/wp-content/uploads/2024/02/DVO-Topaz-WP-Setup_Guide_Dec5_2023.pdf
