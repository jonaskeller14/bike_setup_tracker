      source:
        - https://dvosuspension.com/wp-content/uploads/2023/11/Jade-X-Setup-Guide-Nov20.pdf
      note: >-
        Jade X Set-Up Guide v2.0. The T3 trim does carry a rebound knob (labelled on the
        adjuster diagram, p.4). Rebound 18 is an estimate: its scale strip (p.12) reads "Open
        18+ 16 14 12 10 8 6 4 2 0 Closed", counted from closed, and the "18+" means the real
        total is at least 18. The p.12 tech tip says to start fully closed and adjust out in
        two-click increments.

    jade_x_prime:
      name: Jade X Prime
      description: |-
        - High Speed Compression on the green dial, 10 clicks from fully open to closed
        - Low Speed Compression on the black dial behind it, 5 clicks; clockwise adds support
      description_de: |-
        - High-Speed-Druckstufe am grünen Rad, 10 Klicks von ganz offen bis geschlossen
        - Low-Speed-Druckstufe am schwarzen Rad dahinter, 5 Klicks; im Uhrzeigersinn gibt mehr Halt
      description_fr: |-
        - Compression haute vitesse sur la molette verte, 10 clics de la position entièrement ouverte à fermée
        - Compression basse vitesse sur la molette noire derrière, 5 clics ; le sens horaire ajoute du soutien
      description_it: |-
        - Compressione ad alta velocità sulla manopola verde, 10 scatti da completamente aperta a chiusa
        - Compressione a bassa velocità sulla manopola nera dietro, 5 scatti; il senso orario aumenta il sostegno
      description_es: |-
        - Compresión de alta velocidad en la rueda verde, 10 clics de totalmente abierta a cerrada
        - Compresión de baja velocidad en la rueda negra de detrás, 5 clics; el sentido horario añade apoyo
      description_pt: |-
        - Compressão de alta velocidade no seletor verde, 10 cliques de totalmente aberto a fechado
        - Compressão de baixa velocidade no seletor preto atrás dele, 5 cliques; o sentido horário acrescenta apoio
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 10, notes: "High-Speed Compression; Counted from fully open (softest); clockwise = more support", notes_de: High-Speed-Druckstufe; von ganz offen (am weichsten) gezählt; im Uhrzeigersinn = mehr Unterstützung, notes_fr: Compression haute vitesse ; comptée depuis la position entièrement ouverte (la plus souple) ; sens horaire = plus de soutien, notes_it: Compressione ad alta velocità; contata a partire dalla posizione completamente aperta (la più morbida); senso orario = più sostegno, notes_es: Compresión de alta velocidad; contada desde la posición totalmente abierta (la más blanda); sentido horario = más apoyo, notes_pt: Compressão de alta velocidade; contada a partir da posição totalmente aberta (a mais macia); sentido horário = mais apoio, dialColor: green }
