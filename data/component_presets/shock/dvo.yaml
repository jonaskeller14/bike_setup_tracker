# --------------------------------------------------------------------------
# Setup guides — transcribed from docs/research/setup_guides/dvo.md.
#   * Air pressure (Topaz): each rider-weight row shades a Plush-to-Firm span
#     of psi columns. One rule holds the span as a band (its midpoint for a
#     rider without a riding style); a `comfort` rule takes the Plush end and
#     a `race` rule the Firm end. Brackets are the printed lb columns
#     (`120-139` → `120-140`).
#   * Not encoded: the Topaz rebound charts (their header says air pressure,
#     their rows read like rider-weight brackets; asked of DVO), the
#     gradient bladder charts of the 2023+ guides (positions on a gradient,
#     not printed numbers) and the T3 trail-style charts (terrain and
#     climb/descent, not a riding style).
# --------------------------------------------------------------------------
guides:
  dvo_jadex_2024:
    label: DVO Jade X Set-Up Guide (v2.0, 2024)
    label_de: DVO Jade X Setup-Anleitung (v2.0, 2024)
    label_fr: Guide de setup DVO Jade X (v2.0, 2024)
    label_it: Guida al setup DVO Jade X (v2.0, 2024)
    label_es: Guía de setup DVO Jade X (v2.0, 2024)
    label_pt: Guia de setup DVO Jade X (v2.0, 2024)
    source: https://dvosuspension.com/wp-content/uploads/2024/05/DVO-Jade-X-Setup-Guide-May16.pdf
    rules:
      - &dvo_jade_x_sag { target: sag, range: [25, 30], comfort_at: max }

  dvo_jadexwp_2023:
    label: DVO Jade X WP1 Set-Up Guide (2023)
    label_de: DVO Jade X WP1 Setup-Anleitung (2023)
    label_fr: Guide de setup DVO Jade X WP1 (2023)
    label_it: Guida al setup DVO Jade X WP1 (2023)
    label_es: Guía de setup DVO Jade X WP1 (2023)
    label_pt: Guia de setup DVO Jade X WP1 (2023)
    source: https://dvosuspension.com/wp-content/uploads/2024/02/DVO-Jade-X-WP-Setup_Guide_Dec5_2023.pdf
    rules:
      - target: spring_rate
        unit: lbs/in
        input: rider_weight
        input_unit: kg
        rows: { 54-60: 300, 60-70: 350, 70-80: 400, 80-100: 450, 100+: 500 }
      - &dvo_wp_hsc { target: hsc, value: 4 }
      - &dvo_wp_lsc { target: lsc, value: 6 }
      - *dvo_jade_x_sag

  dvo_jade_tech:
    label: DVO Jade set-up page
    label_de: DVO Jade Setup-Seite
    label_fr: Page de setup DVO Jade
    label_it: Pagina del setup DVO Jade
    label_es: Página de setup DVO Jade
    label_pt: Página de setup DVO Jade
    source: https://tech.dvosuspension.com/setup/jade/
    # The base tunes cover three catalog sizes. Table 3 (10.5x3.5in) and the
    # 9.5x3in size of table 2 are not catalog sizes; every other size gets
    # the bladder chart and SAG only. The table 2 HSC cell of 140-160 lb is
    # printed "3" followed by a blank, possibly a cut-off "3½"; kept as 3.
    rules:
      - target: bladder_pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        rows: { 120-140: 170, 140-160: 175, 160-180: 180, 180-200: 185, 200-220: 190, 220+: 200 }
      - target: bladder_pressure
        unit: psi
        input: rider_weight
        input_unit: lb
        when: { size: ["200.025x57.15", "215.9x63.5", "222.25x69.85"] }
        rows: { 120-140: [170, 175], 140-160: [175, 180], 160-180: [180, 185], 180-200: [185, 190], 200-220: [190, 200] }
      - target: spring_rate
        unit: lbs/in
        input: rider_weight
        input_unit: lb
        when: { size: ["200.025x57.15", "215.9x63.5"] }
        rows: { 120-140: 400, 140-160: 450, 160-180: 500, 180-200: 550, 200-220: 600 }
      - target: spring_rate
        unit: lbs/in
        input: rider_weight
        input_unit: lb
        when: { size: "222.25x69.85" }
        rows: { 120-140: 350, 140-160: 400, 160-180: 450, 180-200: 500, 200-220: 550 }
      # Printed slow to fast ("34-32"), written as ascending bands.
      - target: rebound
        input: rider_weight
        input_unit: lb
        when: { size: ["200.025x57.15", "215.9x63.5", "222.25x69.85"] }
        rows: { 120-140: [32, 34], 140-160: [31, 33], 160-180: [29, 32], 180-200: [28, 31], 200-220: [26, 29] }
      - target: hsc
        input: rider_weight
        input_unit: lb
        when: { size: ["200.025x57.15", "215.9x63.5"] }
        rows: { 120-140: 3, 140-160: 4, 160-180: [4, 6], 180-200: [6, 9], 200-220: [6, 9] }
      - target: hsc
        input: rider_weight
        input_unit: lb
        when: { size: "222.25x69.85" }
        rows: { 120-140: 2, 140-160: 3, 160-180: [3, 5], 180-200: [5, 8], 200-220: [5, 8] }
      - target: lsc
        input: rider_weight
        input_unit: lb
        when: { size: ["200.025x57.15", "215.9x63.5"] }
        rows: { 120-140: 1, 140-160: 2, 160-180: [3, 5], 180-200: [5, 8], 200-220: [5, 8] }
      - target: lsc
        input: rider_weight
        input_unit: lb
        when: { size: "222.25x69.85" }
        rows: { 120-140: 1, 140-160: 2, 160-180: [2, 5], 180-200: [5, 8], 200-220: [5, 8] }
      - { target: sag, range: [25, 30], comfort_at: max, note: Measured in the attack position, note_de: In der Angriffsposition gemessen, note_fr: Mesuré en position d’attaque, note_it: Misurato in posizione d’attacco, note_es: Medido en posición de ataque, note_pt: Medido na posição de ataque }

  dvo_topaz_2024:
    label: DVO Topaz Set-Up Guide (v2.1, 2024)
    label_de: DVO Topaz Setup-Anleitung (v2.1, 2024)
    label_fr: Guide de setup DVO Topaz (v2.1, 2024)
    label_it: Guida al setup DVO Topaz (v2.1, 2024)
