#   - Opal HV T3: no setup guide; no tech page (/setup/opal/ is a 404), no set-up guide PDF, no
#     click counts for its T3 lever or its rebound dial. Rebound carries
#     `max: ~`, but the lever's positions are unnamed, so the trim stays
#     `draft: true` and the picker hides it until DVO publishes them.
#   - Volume-spacer counts: DVO documents WHAT the Topaz and Opal spacers do
