      - &dvo_topaz_sag { target: sag, range: [20, 30], comfort_at: max, note: "20 % is DVO's supportive end, 30 % the plush end", note_de: "20 % ist das unterstützende Ende von DVO, 30 % das komfortable Ende", note_fr: "20 % est la limite de soutien de DVO, 30 % la limite confortable", note_it: "20 % è il limite di sostegno di DVO, 30 % quello confortevole", note_es: 20 % es el extremo de apoyo de DVO y 30 % el cómodo, note_pt: 20 % é o extremo de apoio da DVO e 30 % o confortável }

