#   - Topaz Pro / Topaz WP CV / Opal HV T3 exact per-model stroke/eye-to-eye
#     tables were read off the "Topaz Gen 3" and "Opal HV T3" product pages;
#     not independently re-verified per trim (Pro vs Prime vs WP CV may differ
#     slightly).
#   - Topaz 2 (Maestro HV) and Opal HV T3: no dedicated PDF/tech setup guide
#     with numeric click counts was found (only qualitative descriptions) —
#     left largely unconfirmed.
#   - Volume spacer counts (Topaz positive/negative chambers, Opal negative
