# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - Jade X rebound total (both the T3 and the Prime): 18 is an estimate, the
#     highest value of the Set-Up Guide's strip "Open 18+ 16 ... 2 0 Closed"
#     counted from closed; "18+" means the real total is higher.
#     tech.dvosuspension.com/setup/jade-x hosts only that same PDF — ask DVO
#     for a "Rebound Range: N clicks total" figure like the Jade's.
#   - Topaz rebound total: Pro 9 is stated in Pinkbike's Topaz 3 review; the
#     Prime and the T3Air carry 9 as an estimate from the guides' "Rebound
#     Clicks from Closed" chart (1-9), which DVO's own Diamond figures show can
#     overshoot the real range (chart 22 vs. 20 clicks total).
#   - Jade X WP CV / Topaz WP CV: WP Suspension's Cone Valve internals. The
#     WP1 Set-Up Guides print the HSC / LSC strips but no rebound total, and
#     they have no page under tech.dvosuspension.com/setup.
#   - Per-trim stroke / eye-to-eye tables: the Jade X, Jade and Topaz lists
#     follow each product page's size dropdown and its "Standard / Metric /
#     Trunnion Sizes" text. The Topaz Gen 3 (Pro) page also sells HV (high
#     volume air can) variants of 230x60, 165x42.5, 205x57.5 and 205x65; they
#     are not separate sizes here. The Pro page lists 165x50 in its text and
#     165x45 in its dropdown, so both are kept.
#   - Opal HV T3: no setup guide; no tech page (/setup/opal/ is a 404), no set-up guide PDF, no
#     click counts for its T3 lever or its rebound dial. Rebound carries
#     `max: ~`, but the lever's positions are unnamed, so the trim stays
#     `draft: true` and the picker hides it until DVO publishes them.
#   - Volume-spacer counts: DVO documents WHAT the Topaz and Opal spacers do
#     (positive vs. negative chamber, "add 1-2") but never a maximum count, so
#     no Volume Spacers adjustment is declared on any shock. Contrast the Onyx
#     38 fork, where DVO does state "A maximum of 4 volume spacers can be used".
#   - Opal maximum air pressure and bladder range: the Opal has no guide.
#   - Topaz 2 `years: "2016-2022"`: brackets DVO's 2016-dated Topaz manuals
#     and the Gen 3's arrival; DVO publishes no start/end year for the
#     generation. Same for the first-generation Topaz, which has no separate
#     documentation and is therefore not modelled at all. Topaz 2 T3Air has no
#     shock product page (only spare-part pages), so no sizes.
#   - Older Jade revisions: tech.dvosuspension.com/setup/jade carries a single
#     un-generationed page, so there is no way to tell which numbers belong to
#     which revision. Not split, per SCHEMA.md's rule against inheriting counts
#     across generations. The Jade page's FAQ also mentions a 10.5x3.5in IFP
#     size that is not in its dropdown; not added.
# --------------------------------------------------------------------------
