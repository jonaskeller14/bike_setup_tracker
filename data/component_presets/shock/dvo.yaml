option_values:
  damper:
    jade_x_t3:
      name: Jade X T3
      description: |-
        - One lever, three on-the-fly settings: Open for rough descents, Mid for support, Firm for fire-road climbs
        - Firm is a pedalling platform, not a lockout
      description_de: |-
        - Ein Hebel, drei Einstellungen zum Umschalten während der Fahrt: Open für ruppige Abfahrten, Mid für Unterstützung, Firm für Forstweganstiege
        - Firm ist eine Pedalplattform, kein Lockout
      description_fr: |-
        - Un levier, trois réglages utilisables en roulant : Open pour les descentes cassantes, Mid pour le soutien, Firm pour les montées sur piste forestière
        - Firm est une plateforme de pédalage, pas un lockout
      description_it: |-
        - Una leva, tre impostazioni azionabili in marcia: Open per le discese sconnesse, Mid per il sostegno, Firm per le salite su sterrato
        - Firm è una piattaforma di pedalata, non un lockout
      description_es: |-
        - Una palanca, tres ajustes accionables en marcha: Open para bajadas rotas, Mid para apoyo, Firm para subidas por pista forestal
        - Firm es una plataforma de pedaleo, no un lockout
      description_pt: |-
        - Uma alavanca, três ajustes acionáveis em movimento: Open para descidas acidentadas, Mid para apoio, Firm para subidas em estrada de terra
        - Firm é uma plataforma de pedalada, não um lockout
      adjustments:
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 18, notes: "Counted from fully closed (slowest); estimated maximum, check your dial and edit it if it differs", notes_de: "Von ganz geschlossen (am langsamsten) gezählt; geschätztes Maximum, am Drehrad prüfen und bei Abweichung anpassen", notes_fr: "Compté depuis la position entièrement fermée (la plus lente) ; maximum estimé, vérifiez votre cadran et modifiez-le s’il diffère", notes_it: "Contato a partire dalla posizione completamente chiusa (la più lenta); massimo stimato, controlla la tua manopola e modificalo se è diverso", notes_es: "Contado desde la posición totalmente cerrada (la más lenta); máximo estimado, comprueba tu dial y edítalo si es distinto", notes_pt: "Contado a partir da posição totalmente fechada (a mais lenta); máximo estimado, confira o seu seletor e edite-o se for diferente" }
