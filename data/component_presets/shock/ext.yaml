# EXT (Extreme Racing Shox) mountain-bike shocks — adjustment preset database
#
# Same design as shock/fox.yaml and shock/ohlins.yaml: click ranges belong to
# the DAMPER, defined once under `option_values.damper` and referenced by id from each
# shock's trims. See SCHEMA.md in this folder.
#
# EXT (Italian boutique brand, extremeshox.com) currently sells five MTB
# shock lines: the coil "Storia" (trail/enduro) and "Arma" (downhill), each
# now in a V3(-S) and a newer V4 generation with different feature sets under
# the same family name (per SCHEMA.md's "give each generation its own damper
# id" rule); the e-MTB-tuned coil "e-Storia"; the air "Aria"; and the newest
# coil shock, "Vecta".
#
# IMPORTANT — click counts: EXT's product pages and official "quick manual"
# PDFs (extremeshox.com/manuals/) name every hydraulic adjuster (LSC/BL, HSC/
# BH, Rebound/R, HBC, LOK) and confirm the counting convention (turning fully
# clockwise = fully closed = click 0; opening is counterclockwise — the same
# convention as the schema's default `dial_ccw`), but none of them publishes
# a maximum click count. The Storia V3(-S), Arma V3 and Storia V4 quick manuals
# only give a single suggested *starting* setting (e.g. "BH7 BL6 R7"), not a
# range — that is no table to estimate from, so those adjusters keep `max: ~`.
# Totals come from staff-written magazine reviews (storia_v3, storia_v4 HBC,
# arma_v4, vecta) and, for the first-generation Aria, are estimated from the
# weight table of its quick manual. See "Follow-ups" for the rest.
brand: EXT
component_type: shock
sources:
  - https://extremeshox.com/
  - https://extremeshox.com/manuals/
  - https://extremeshox.com/product/storia-v4/
  - https://extremeshox.com/product/ext-storia/
  - https://extremeshox.com/product/arma-v4/
  - https://extremeshox.com/product/arma-v3/
  - https://extremeshox.com/product/ext-aria/
  - https://extremeshox.com/product/ext-e-storia/
  - https://extremeshox.com/product/vecta/
  - https://extremeshox.com/wp-content/uploads/2023/08/Storia_V3-S_Quick_Manual_1.1.pdf
  - https://extremeshox.com/wp-content/uploads/2023/09/e-Storia-quick-manual.pdf
  - https://extremeshox.com/wp-content/uploads/2023/08/Quick-manual-Aria-min.pdf
  - https://extremeshox.com/wp-content/uploads/2025/06/EXT-Vecta-Quick-Manual.pdf
  - https://extremeshox.com/wp-content/uploads/2024/06/Arma-Storia-V4-Quick-Manual.pdf
  - https://extremeshox.com/wp-content/uploads/2023/09/ARMA-STORIA_V3_quick_manual.pdf
  - https://www.pinkbike.com/news/review-ext-storia-v3-shock.html
  - https://www.pinkbike.com/news/review-ext-arma-v4-one-of-the-best-mtb-shocks-gets-even-better.html
  - https://www.pinkbike.com/news/review-exts-new-storia-v4-coil-shock.html
  - https://www.pinkbike.com/news/review-ext-vecta-coil-shock.html
  - https://nsmb.com/articles/ext-storia-lok-v4-rear-shock/
  - https://extremeshox.com/product/aria-v2/
  - https://extremeshox.com/product/aria-v2-dh/
  - https://extremeshox.com/wp-content/uploads/2026/09/Quick-manual-Aria-V2-3.pdf
  - https://extremeshox.com/vecta-ridemaster/
updated: 2026-10-13
# Service intervals (`tasks`) come from the quick manuals (the nodes'
# `setup_guide`): every 100 hours or 1 year for amateur use (racing: 50 hours
# or 6 months; the amateur figure is used).

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    storia_v3:
      name: Storia V3(-S)
      description: >
        Four-way adjustable damper (LSC, HSC, rebound and the LOK pedal-platform
        lever) without an adjustable bottom-out circuit.
      description_de: >
        Vierwege-einstellbarer Dämpfer (LSC, HSC, Zugstufe und der
        LOK-Pedalplattform-Hebel) ohne einstellbaren Durchschlagkreis.
      description_fr: Amortisseur réglable à quatre voies (LSC, HSC, détente et le levier de plateforme de pédalage LOK) sans circuit de fin de course réglable.
      description_it: Ammortizzatore regolabile a quattro vie (LSC, HSC, ritorno e la leva della piattaforma di pedalata LOK) senza circuito di fondocorsa regolabile.
      description_es: Amortiguador ajustable de cuatro vías (LSC, HSC, rebote y la palanca de plataforma de pedaleo LOK) sin circuito de final de carrera ajustable.
      description_pt: Amortecedor ajustável de quatro vias (LSC, HSC, retorno e a alavanca de plataforma de pedalada LOK) sem circuito de fim de curso ajustável.
      adjustments:
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 14, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade }
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 14, notes: High-Speed Compression, notes_de: High-Speed-Druckstufe, notes_fr: Compression haute vitesse, notes_it: Compressione ad alta velocità, notes_es: Compresión de alta velocidad, notes_pt: Compressão de alta velocidade }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 10 }
        - { name: LOK (Climb Switch), name_de: LOK (Climb-Schalter), name_fr: LOK (levier Climb), name_it: LOK (leva Climb), name_es: LOK (palanca Climb), name_pt: LOK (alavanca Climb), type: boolean, notes: "Clockwise = LOK (firm pedal platform), counterclockwise = Open. Not a true lockout", notes_de: "Im Uhrzeigersinn = LOK (feste Pedalplattform), gegen den Uhrzeigersinn = Open. Kein echter Lockout", notes_fr: "Sens horaire = LOK (plateforme de pédalage ferme), sens antihoraire = Open. Ce n’est pas un vrai lockout", notes_it: "In senso orario = LOK (piattaforma di pedalata rigida), in senso antiorario = Open. Non è un vero lockout", notes_es: "Sentido horario = LOK (plataforma de pedaleo firme), sentido antihorario = Open. No es un lockout de verdad", notes_pt: "Sentido horário = LOK (plataforma de pedalada firme), sentido anti-horário = Open. Não é um lockout de verdade" }
      adjusters: LSC/BL (4mm Allen) / HSC/BH (12mm wrench or socket) / Rebound/R (bottom knob)
      source: https://www.pinkbike.com/news/review-ext-storia-v3-shock.html
      note: >-
        Click totals are not published by EXT; taken from Pinkbike's Storia V3
        review body text: "There are 14 clicks of LSC, 14 clicks of HSC, and 10
        possible rebound settings."

    storia_v4:
      name: Storia V4
      description: >
        Four-way adjustable damper (LSC, HSC, rebound, HBC) plus the LOK 2.0
        pedal-platform lever.
      description_de: >
        Vierwege-einstellbarer Dämpfer (LSC, HSC, Zugstufe, HBC) plus der
        LOK-2.0-Pedalplattform-Hebel.
      description_fr: Amortisseur réglable à quatre voies (LSC, HSC, détente, HBC) plus le levier de plateforme de pédalage LOK 2.0.
      description_it: Ammortizzatore regolabile a quattro vie (LSC, HSC, ritorno, HBC) più la leva della piattaforma di pedalata LOK 2.0.
      description_es: Amortiguador ajustable de cuatro vías (LSC, HSC, rebote, HBC) más la palanca de plataforma de pedaleo LOK 2.0.
      description_pt: Amortecedor ajustável de quatro vias (LSC, HSC, retorno, HBC) mais a alavanca de plataforma de pedalada LOK 2.0.
      adjustments:
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: ~, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade }
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: ~, notes: High-Speed Compression, notes_de: High-Speed-Druckstufe, notes_fr: Compression haute vitesse, notes_it: Compressione ad alta velocità, notes_es: Compresión de alta velocidad, notes_pt: Compressão de alta velocidade }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: ~, notes: Low-Speed Rebound, notes_de: Low-Speed-Zugstufe, notes_fr: Détente basse vitesse, notes_it: Ritorno a bassa velocità, notes_es: Rebote de baja velocidad, notes_pt: Retorno de baixa velocidade }
        - { name: HBC, name_de: HBC, name_fr: HBC, name_it: HBC, name_es: HBC, name_pt: HBC, type: step, max: 10, notes: Hydraulic bottom-out control, notes_de: Hydraulische Durchschlagsregelung, notes_fr: Réglage de la butée hydraulique de fin de course, notes_it: Regolazione del fondocorsa idraulico, notes_es: Control del final de carrera hidráulico, notes_pt: Controle do fim de curso hidráulico }
        - { name: LOK 2.0 (Climb Switch), name_de: LOK 2.0 (Climb-Schalter), name_fr: LOK 2.0 (levier Climb), name_it: LOK 2.0 (leva Climb), name_es: LOK 2.0 (palanca Climb), name_pt: LOK 2.0 (alavanca Climb), type: boolean, notes: "Clockwise = LOK (firm pedal platform), counterclockwise = Open. Not a true lockout", notes_de: "Im Uhrzeigersinn = LOK (feste Pedalplattform), gegen den Uhrzeigersinn = Open. Kein echter Lockout", notes_fr: "Sens horaire = LOK (plateforme de pédalage ferme), sens antihoraire = Open. Ce n’est pas un vrai lockout", notes_it: "In senso orario = LOK (piattaforma di pedalata rigida), in senso antiorario = Open. Non è un vero lockout", notes_es: "Sentido horario = LOK (plataforma de pedaleo firme), sentido antihorario = Open. No es un lockout de verdad", notes_pt: "Sentido horário = LOK (plataforma de pedalada firme), sentido anti-horário = Open. Não é um lockout de verdade" }
      adjusters: LSC/BL (4mm Allen) / HSC/BH (12mm wrench or socket) / Rebound/R (bottom knob) / HBC (4mm Allen, top of compression valve)
      source:
        - https://www.pinkbike.com/news/review-exts-new-storia-v4-coil-shock.html
        - https://nsmb.com/articles/ext-storia-lok-v4-rear-shock/
        - https://extremeshox.com/wp-content/uploads/2024/06/Arma-Storia-V4-Quick-Manual.pdf
      note: >-
        HBC total from Pinkbike's Storia V4 review ("5 clicks from closed (out of
        a total of 10)") and NSMB's ("can be adjusted externally for 10 clicks").
        LSC, HSC and rebound totals appear in no review text, and the quick
        manual prints a single starting setting (HSC 10, LSC 10, R 9, HBC 5), so
        those three keep `max: ~`.

    arma_v3:
      name: Arma V3
      description: Downhill-race damper with four adjusters (LSC, HSC, rebound, HBC) and no climb switch.
      description_de: Downhill-Renndämpfer mit vier Verstellern (LSC, HSC, Zugstufe, HBC) und ohne Climb-Schalter.
      description_fr: Amortisseur de course de descente avec quatre réglages (LSC, HSC, détente, HBC) et sans climb switch.
      description_it: Ammortizzatore da gara downhill con quattro regolatori (LSC, HSC, ritorno, HBC) e senza climb switch.
      description_es: Amortiguador de competición de descenso con cuatro ajustes (LSC, HSC, rebote, HBC) y sin climb switch.
      description_pt: Amortecedor de competição de downhill com quatro ajustes (LSC, HSC, retorno, HBC) e sem climb switch.
      adjustments:
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: ~, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade }
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: ~, notes: High-Speed Compression, notes_de: High-Speed-Druckstufe, notes_fr: Compression haute vitesse, notes_it: Compressione ad alta velocità, notes_es: Compresión de alta velocidad, notes_pt: Compressão de alta velocidade }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: ~, notes: Low-Speed Rebound, notes_de: Low-Speed-Zugstufe, notes_fr: Détente basse vitesse, notes_it: Ritorno a bassa velocità, notes_es: Rebote de baja velocidad, notes_pt: Retorno de baixa velocidade }
        - { name: HBC, name_de: HBC, name_fr: HBC, name_it: HBC, name_es: HBC, name_pt: HBC, type: step, max: ~, notes: Hydraulic bottom-out control, notes_de: Hydraulische Durchschlagsregelung, notes_fr: Réglage de la butée hydraulique de fin de course, notes_it: Regolazione del fondocorsa idraulico, notes_es: Control del final de carrera hidráulico, notes_pt: Controle do fim de curso hidráulico }
      adjusters: LSC / HSC / Rebound / HBC — no LOK on Arma (confirmed "Available on Storia V4 only")

    arma_v4:
      name: Arma V4
      description: >
        Downhill damper with four adjusters (LSC, HSC, rebound, HBC), tunable
        with a multi-tool (5mm and 4mm Allen keys). No climb switch.
      description_de: >
        Downhill-Dämpfer mit vier Verstellern (LSC, HSC, Zugstufe, HBC),
        abstimmbar mit einem Multitool (Inbusschlüssel 5mm und 4mm). Ohne
        Climb-Schalter.
      description_fr: Amortisseur de descente avec quatre réglages (LSC, HSC, détente, HBC), réglable avec un multi-outil (clés Allen de 5 mm et 4 mm). Pas de climb switch.
      description_it: Ammortizzatore da discesa con quattro regolatori (LSC, HSC, ritorno, HBC), regolabile con un multiutensile (brugole da 5 mm e 4 mm). Nessun climb switch.
      description_es: Amortiguador de descenso con cuatro ajustes (LSC, HSC, rebote, HBC), ajustable con una multiherramienta (llaves Allen de 5 mm y 4 mm). Sin climb switch.
      description_pt: Amortecedor de descida com quatro ajustes (LSC, HSC, retorno, HBC), ajustável com uma multiferramenta (chaves Allen de 5 mm e 4 mm). Sem climb switch.
      adjustments:
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 14, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade }
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 15, notes: High-Speed Compression, notes_de: High-Speed-Druckstufe, notes_fr: Compression haute vitesse, notes_it: Compressione ad alta velocità, notes_es: Compresión de alta velocidad, notes_pt: Compressão de alta velocidade }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 14, notes: Low-Speed Rebound, notes_de: Low-Speed-Zugstufe, notes_fr: Détente basse vitesse, notes_it: Ritorno a bassa velocità, notes_es: Rebote de baja velocidad, notes_pt: Retorno de baixa velocidade }
        - { name: HBC, name_de: HBC, name_fr: HBC, name_it: HBC, name_es: HBC, name_pt: HBC, type: step, max: 10, notes: "Hydraulic bottom-out control, last 20% of stroke", notes_de: "Hydraulische Durchschlagsregelung, letzte 20 % des Federwegs", notes_fr: "Réglage de la butée hydraulique de fin de course, sur les derniers 20 % du débattement", notes_it: "Regolazione del fondocorsa idraulico, sull’ultimo 20 % della corsa", notes_es: "Control del final de carrera hidráulico, en el último 20 % del recorrido", notes_pt: "Controle do fim de curso hidráulico, nos últimos 20 % do curso" }
      adjusters: LSC (4mm Allen) / HSC (5mm Allen) / Rebound / HBC
      source: https://www.pinkbike.com/news/review-ext-arma-v4-one-of-the-best-mtb-shocks-gets-even-better.html
      note: >-
        Click totals are not published by EXT; taken from Pinkbike's Arma V4
        review: setup table "LSC: -7/14 (7 clicks from closed, 14 in total)",
        "HSC: -8/15", and in prose HBC "can be tweaked to your liking with 10
        clicks of adjustment." The table's Rebound entry reads "R: -5/-14"; the
        stray minus before the total is taken as a typo of the "N/total"
        notation of the other rows, giving 14 in total.

    aria:
      name: Aria
      description: >
        EXT's first air shock: four hydraulic adjusters (LSC, HSC, rebound,
        HBC) plus a LOK climb lever.
      description_de: >
        EXTs erster Luftdämpfer: vier hydraulische Versteller (LSC, HSC,
        Zugstufe, HBC) plus ein LOK-Climb-Hebel.
      description_fr: "Premier amortisseur pneumatique d’EXT : quatre réglages hydrauliques (LSC, HSC, détente, HBC) plus un levier Climb LOK."
      description_it: "Il primo ammortizzatore pneumatico di EXT: quattro regolatori idraulici (LSC, HSC, ritorno, HBC) più una leva Climb LOK."
      description_es: "El primer amortiguador neumático de EXT: cuatro ajustes hidráulicos (LSC, HSC, rebote, HBC) más una palanca Climb LOK."
      description_pt: "O primeiro amortecedor a ar da EXT: quatro ajustes hidráulicos (LSC, HSC, retorno, HBC) mais uma alavanca Climb LOK."
      adjustments:
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 12, notes: "Low-Speed Compression; estimated maximum, check your dial and edit it if it differs", notes_de: "Low-Speed-Druckstufe; geschätztes Maximum, am Drehrad prüfen und bei Abweichung anpassen", notes_fr: "Compression basse vitesse ; maximum estimé, vérifiez votre cadran et modifiez-le s’il diffère", notes_it: "Compressione a bassa velocità; massimo stimato, controlla la tua manopola e modificalo se è diverso", notes_es: "Compresión de baja velocidad; máximo estimado, comprueba tu dial y edítalo si es distinto", notes_pt: "Compressão de baixa velocidade; máximo estimado, confira o seu seletor e edite-o se for diferente" }
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 10, notes: "High-Speed Compression; estimated maximum, check your dial and edit it if it differs", notes_de: "High-Speed-Druckstufe; geschätztes Maximum, am Drehrad prüfen und bei Abweichung anpassen", notes_fr: "Compression haute vitesse ; maximum estimé, vérifiez votre cadran et modifiez-le s’il diffère", notes_it: "Compressione ad alta velocità; massimo stimato, controlla la tua manopola e modificalo se è diverso", notes_es: "Compresión de alta velocidad; máximo estimado, comprueba tu dial y edítalo si es distinto", notes_pt: "Compressão de alta velocidade; máximo estimado, confira o seu seletor e edite-o se for diferente" }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 13, notes: "Estimated maximum, check your dial and edit it if it differs", notes_de: "Geschätztes Maximum, am Drehrad prüfen und bei Abweichung anpassen", notes_fr: "Maximum estimé, vérifiez votre cadran et modifiez-le s’il diffère", notes_it: "Massimo stimato, controlla la tua manopola e modificalo se è diverso", notes_es: "Máximo estimado, comprueba tu dial y edítalo si es distinto", notes_pt: "Máximo estimado, confira o seu seletor e edite-o se for diferente" }
        - { name: HBC, name_de: HBC, name_fr: HBC, name_it: HBC, name_es: HBC, name_pt: HBC, type: step, max: 4, notes: "Hydraulic bottom-out control; estimated maximum, check your dial and edit it if it differs", notes_de: "Hydraulische Durchschlagsregelung; geschätztes Maximum, am Drehrad prüfen und bei Abweichung anpassen", notes_fr: "Réglage de la butée hydraulique de fin de course ; maximum estimé, vérifiez votre cadran et modifiez-le s’il diffère", notes_it: "Regolazione del fondocorsa idraulico; massimo stimato, controlla la tua manopola e modificalo se è diverso", notes_es: "Control del final de carrera hidráulico; máximo estimado, comprueba tu dial y edítalo si es distinto", notes_pt: "Controle do fim de curso hidráulico; máximo estimado, confira o seu seletor e edite-o se for diferente" }
        - { name: LOK (Climb Switch), name_de: LOK (Climb-Schalter), name_fr: LOK (levier Climb), name_it: LOK (leva Climb), name_es: LOK (palanca Climb), name_pt: LOK (alavanca Climb), type: boolean, notes: "Clockwise = LOK (firm pedal platform), counterclockwise = Open. Not a true lockout", notes_de: "Im Uhrzeigersinn = LOK (feste Pedalplattform), gegen den Uhrzeigersinn = Open. Kein echter Lockout", notes_fr: "Sens horaire = LOK (plateforme de pédalage ferme), sens antihoraire = Open. Ce n’est pas un vrai lockout", notes_it: "In senso orario = LOK (piattaforma di pedalata rigida), in senso antiorario = Open. Non è un vero lockout", notes_es: "Sentido horario = LOK (plataforma de pedaleo firme), sentido antihorario = Open. No es un lockout de verdad", notes_pt: "Sentido horário = LOK (plataforma de pedalada firme), sentido anti-horário = Open. Não é um lockout de verdade" }
      adjusters: LSC/BL (4mm Allen) / HSC/BH (12mm wrench) / Rebound/R (bottom knob) / HBC/H (4mm Allen)
      source: https://extremeshox.com/wp-content/uploads/2023/08/Quick-manual-Aria-min.pdf
      note: >-
        Totals are estimates: the highest value per column of the quick manual's
        suggested setup table (seven rows from < 250 lb to > 600 lb equivalent
        spring rate), counted from fully closed = click 0. BH 10, BL 12, R 13,
        H 4. The manual states no totals and no review gives any.

    e_storia:
      name: e-Storia
      description: >
        Damper tuned for e-MTB use (heavier bikes, higher speeds) with a
        stiffer spring platform and negative spring. Adjusters: LSC, HSC,
        rebound, HBC and LOK.
      description_de: >
        Für den E-MTB-Einsatz abgestimmter Dämpfer (schwerere Bikes, höhere
        Geschwindigkeiten) mit steiferer Federplattform und Negativfeder.
        Versteller: LSC, HSC, Zugstufe, HBC und LOK.
      description_fr: "Amortisseur réglé pour le VTT électrique (vélos plus lourds, vitesses plus élevées) avec une plateforme de ressort plus raide et un ressort négatif. Réglages : LSC, HSC, détente, HBC et LOK."
      description_it: "Ammortizzatore tarato per l’e-MTB (bici più pesanti, velocità più elevate) con una piattaforma della molla più rigida e una molla negativa. Regolatori: LSC, HSC, ritorno, HBC e LOK."
      description_es: "Amortiguador tarado para e-MTB (bicicletas más pesadas, velocidades más altas) con una plataforma de muelle más rígida y un muelle negativo. Ajustes: LSC, HSC, rebote, HBC y LOK."
