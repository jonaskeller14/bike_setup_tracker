# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - EXT itself publishes no maximum click counts on any current damper.
#     Sourced from staff-written reviews: storia_v3 (LSC 14, HSC 14, rebound 10;
#     Pinkbike), arma_v4 (LSC 14, HSC 15, HBC 10, rebound 14; Pinkbike — the
#     rebound entry "R: -5/-14" is read as 14 in total), vecta (LSC 14, HSC 14,
#     rebound 16; Pinkbike), storia_v4 HBC 10 (Pinkbike, NSMB). Estimated from
#     the quick manual's setup table: aria (HSC 10, LSC 12, rebound 13, HBC 4).
#   - Still `max: ~`: storia_v4 LSC / HSC / rebound, arma_v3, e_storia, aria_v2,
#     aria_v2_dh. Their quick manuals print only one starting setting (Storia /
#     Arma V3 "BH10 BL6 R4", Storia V3-S "BH7 BL6 R7", Storia / Arma V4
#     HSC 10, LSC 10, R 9, HBC 5) or none; a single point is not a table to
#     estimate a total from. A Vital MTB snippet claims 16 rebound clicks for
#     the Storia V4, but the review page could not be read.
#   - Arma V3 sizes follow EXT's product page (11 standard, 12 trunnion, 3 imperial).
#   - Aria V1 pressure limits (+ 280 psi / ++ 600 psi) are from its own quick
#     manual; the Aria V2 manual states + 300 psi / ++ 600 psi.
#   - Dial colors: EXT's quick manuals call the LSC adjuster nickel-colored and
#     the HSC adjuster / LOK lever black, none of which maps to a palette
#     color, so no shock adjuster carries `dialColor`.
#   - Volume-spacer / air-chamber-size options for the Aria's AS3 spring do not
#     exist: EXT's pages say the spring is tuned by chamber pressure ("forget
#     about tokens").
#   - Mount of the imperial sizes (Storia V3, Arma V3) is not stated.
#   - "Superlight V2" (coil spring product, extremeshox.com/product/ext-
#     superlight-v2-springs/) is a spring accessory, not its own shock model
#     — not modeled here. Storia V3-S has its own page (extremeshox.com/
#     product/storia-v3s/) with the same sizes as Storia V3 minus the 200x51
#     imperial size; it is covered by the Storia V3 nodes.
#   - No older/legacy EXT MTB shock generations (pre-Storia V3 / pre-Arma V3)
#     are covered — only the current (2026) lineup listed on
#     extremeshox.com.
# --------------------------------------------------------------------------
