# --------------------------------------------------------------------------
# Setup guides — the quick manuals' and RideMaster's starting points as data
# (SCHEMA.md, "Setup guides"), transcribed from docs/research/setup_guides/ext.md.
# Every EXT source counts clicks from fully closed, the catalog's direction.
# Not encoded:
#   * Storia V3: the Arma / Storia V3 and the Storia V3-S quick manuals print
#     different starting clicks (BH10 BL6 R4 against BH7 BL6 R7).
#   * Aria (V1): its table is keyed by an equivalent coil spring rate, which
#     the air shock has no adjuster for.
#   * Aria V2 / Aria V2 DH: RideMaster derives their pressures from rider and
#     bike weight, rear travel and stroke, and some results exceed the
#     published chamber limits.
#   * Spring rates: RideMaster and the Spring Calculator need the bike's
#     weight and rear travel (#71).
#   * e-Storia: its quick manual prints no starting point.
# --------------------------------------------------------------------------
guides:
  ext_arma_storia_v3_2023:
    label: EXT Arma / Storia V3 quick manual (2023)
    label_de: EXT Arma / Storia V3 Kurzanleitung (2023)
    label_fr: Guide rapide EXT Arma / Storia V3 (2023)
    label_it: Guida rapida EXT Arma / Storia V3 (2023)
    label_es: Manual rápido EXT Arma / Storia V3 (2023)
    label_pt: Manual rápido EXT Arma / Storia V3 (2023)
    source: https://extremeshox.com/wp-content/uploads/2023/09/ARMA-STORIA_V3_quick_manual.pdf
    # No HBC starting point is printed.
    rules:
      - { target: hsc, value: 10 }
      - { target: lsc, value: 6 }
      - { target: rebound, value: 4 }

  ext_arma_storia_v4_2024:
    label: EXT Arma / Storia V4 quick manual (2024)
    label_de: EXT Arma / Storia V4 Kurzanleitung (2024)
    label_fr: Guide rapide EXT Arma / Storia V4 (2024)
    label_it: Guida rapida EXT Arma / Storia V4 (2024)
    label_es: Manual rápido EXT Arma / Storia V4 (2024)
    label_pt: Manual rápido EXT Arma / Storia V4 (2024)
    source: https://extremeshox.com/wp-content/uploads/2024/06/Arma-Storia-V4-Quick-Manual.pdf
    rules:
      - { target: hsc, value: 10 }
      - { target: lsc, value: 10 }
      - { target: rebound, value: 9 }
      - { target: hbc, value: 5, note: Close it step by step if the shock bottoms out often, note_de: "Schrittweise schließen, wenn der Dämpfer oft durchschlägt", note_fr: Fermez-le pas à pas si l’amortisseur talonne souvent, note_it: Chiudilo un passo alla volta se l’ammortizzatore va spesso a fondocorsa, note_es: Ciérralo paso a paso si el amortiguador llega al fondo a menudo, note_pt: Feche-o passo a passo se o amortecedor chega ao fim do curso com frequência }

  ext_ridemaster_2026:
    label: EXT RideMaster (Vecta)
    label_de: EXT RideMaster (Vecta)
    label_fr: EXT RideMaster (Vecta)
    label_it: EXT RideMaster (Vecta)
    label_es: EXT RideMaster (Vecta)
    label_pt: EXT RideMaster (Vecta)
    source: https://extremeshox.com/vecta-ridemaster/
    # RideMaster's starting clicks per spring rate, before its trail type and
    # riding level offsets. Its riding levels are skill, not firmness, so they
    # get no riding-style rule.
    rules:
      - target: hsc
        input: spring_rate
        input_unit: lbs/in
        rows: &ext_ridemaster_compression {
          325: 8, 350: 8, 375: 8, 400: 8, 425: 7, 450: 7, 475: 7, 500: 7,
          525: 6, 550: 6, 575: 6, 600: 6, 625: 5, 650: 5, 675: 5, 700: 5,
          725: 4, 750: 4, 775: 4, 800: 4
        }
        note: "RideMaster's start; technical trails +2, jumps and flow -2"
        note_de: Ausgangspunkt von RideMaster; technische Trails +2, Sprünge und Flow -2
        note_fr: Point de départ de RideMaster ; trails techniques +2, sauts et flow -2
        note_it: Punto di partenza di RideMaster; trail tecnici +2, salti e flow -2
        note_es: Punto de partida de RideMaster; trails técnicos +2, saltos y flow -2
        note_pt: Ponto de partida do RideMaster; trilhas técnicas +2, saltos e flow -2
      - target: lsc
        input: spring_rate
        input_unit: lbs/in
        rows: *ext_ridemaster_compression
        note: "RideMaster's start; technical trails +1, jumps and flow -1"
        note_de: Ausgangspunkt von RideMaster; technische Trails +1, Sprünge und Flow -1
        note_fr: Point de départ de RideMaster ; trails techniques +1, sauts et flow -1
        note_it: Punto di partenza di RideMaster; trail tecnici +1, salti e flow -1
        note_es: Punto de partida de RideMaster; trails técnicos +1, saltos y flow -1
        note_pt: Ponto de partida do RideMaster; trilhas técnicas +1, saltos e flow -1
      - target: rebound
        input: spring_rate
        input_unit: lbs/in
        rows: {
          325: 12, 350: 12, 375: 11, 400: 11, 425: 10, 450: 10, 475: 9, 500: 9,
          525: 8, 550: 8, 575: 7, 600: 7, 625: 6, 650: 6, 675: 5, 700: 5,
          725: 4, 750: 4, 775: 3, 800: 3
        }
        note: "RideMaster's start; technical trails +2, jumps and flow -2"
        note_de: Ausgangspunkt von RideMaster; technische Trails +2, Sprünge und Flow -2
        note_fr: Point de départ de RideMaster ; trails techniques +2, sauts et flow -2
        note_it: Punto di partenza di RideMaster; trail tecnici +2, salti e flow -2
        note_es: Punto de partida de RideMaster; trails técnicos +2, saltos y flow -2
        note_pt: Ponto de partida do RideMaster; trilhas técnicas +2, saltos e flow -2
      - { target: sag, range: [28, 33], comfort_at: max, note: "RideMaster picks 28 % for gentle, 30 % for medium and 33 % for steep trails", note_de: "RideMaster wählt 28 % für sanfte, 30 % für mittlere und 33 % für steile Trails", note_fr: "RideMaster retient 28 % pour les trails doux, 30 % pour les trails moyens et 33 % pour les trails raides", note_it: "RideMaster sceglie il 28 % per i trail dolci, il 30 % per quelli medi e il 33 % per quelli ripidi", note_es: "RideMaster elige un 28 % para trails suaves, un 30 % para medios y un 33 % para empinados", note_pt: "O RideMaster escolhe 28 % para trilhas suaves, 30 % para médias e 33 % para íngremes" }

