# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - EXT itself publishes no maximum click counts for LSC/HSC/Rebound/HBC on
#     any current damper. storia_v3 (LSC 14, HSC 14, Rebound 10) and arma_v4
#     (LSC 14, HSC 15, HBC 10) now carry real totals sourced from Pinkbike
#     review body text per SCHEMA.md's sourcing-policy exception — but
#     storia_v4, arma_v3, e_storia, aria and vecta still have none, and
#     arma_v4's own Rebound has no range either (see its damper description
#     above: the Pinkbike setup table's "R: -5/-14" doesn't parse as cleanly
#     as the LSC/HSC entries did). All of these carry `max: ~`. The Storia V3-S
#     and e-Storia quick manuals only give a single suggested *starting*
#     setting (e.g. "BH7 BL6 R7"), never the mechanical max — verify with EXT
#     support/dealer, or a Pinkbike review of those specific models, before
#     replacing the placeholders.
#   - Arma V3 sizes follow EXT's product page (11 standard, 12 trunnion, 3 imperial).
#   - Dial colors: EXT's quick manuals call the LSC adjuster nickel-colored and
#     the HSC adjuster / LOK lever black, none of which maps to a palette
#     color, so no shock adjuster carries `dialColor`.
#   - Volume-spacer / air-chamber-size options for the Aria's AS3 spring are
#     not published as a count — omitted rather than guessed.
#   - "Superlight V2" (coil spring product, extremeshox.com/product/ext-
#     superlight-v2-springs/) is a spring accessory, not its own shock model
#     — not modeled here.
#   - No older/legacy EXT MTB shock generations (pre-Storia V3 / pre-Arma V3)
#     are covered — only the current (2026) lineup listed on
#     extremeshox.com.
# --------------------------------------------------------------------------
