# EXT (Extreme Racing Shox) mountain-bike shocks — adjustment preset database
#
# Same design as shock/fox.yaml and shock/ohlins.yaml: click ranges belong to
# the DAMPER, defined once under `option_values.damper` and referenced by id from each
# shock's trims. See SCHEMA.md in this folder.
#
# EXT (Italian boutique brand, extremeshox.com) currently sells five MTB
# shock lines: the coil "Storia" (trail/enduro) and "Arma" (downhill), each
# now in a V3(-S) and a newer V4 generation with different feature sets under
# the same family name (per SCHEMA.md's "give each generation its own damper
# id" rule); the e-MTB-tuned coil "e-Storia"; the air "Aria"; and the newest
# coil shock, "Vecta".
#
# IMPORTANT — click counts: EXT's product pages and official "quick manual"
# PDFs (extremeshox.com/manuals/) name every hydraulic adjuster (LSC/BL, HSC/
# BH, Rebound/R, HBC, LOK) and confirm the counting convention (turning fully
# clockwise = fully closed = click 0; opening is counterclockwise — the same
# convention as the schema's default `dial_ccw`), but none of them publishes
# a maximum click count. The e-Storia and Storia V3-S quick manuals only give
# a single suggested *starting* setting (e.g. "BH7 BL6 R7"), not the range —
# so, per SCHEMA.md's "never guess a number" rule, those adjusters are
# declared with `max: ~`. Exception: storia_v3 and arma_v4 below carry real
# click-count totals sourced from Pinkbike review body text (not comments) per
# SCHEMA.md's sourcing-policy exception for this case. See "Follow-ups" for
# the rest.
brand: EXT
component_type: shock
sources:
  - https://extremeshox.com/
  - https://extremeshox.com/manuals/
  - https://extremeshox.com/product/storia-v4/
  - https://extremeshox.com/product/ext-storia/
  - https://extremeshox.com/product/arma-v4/
  - https://extremeshox.com/product/arma-v3/
  - https://extremeshox.com/product/ext-aria/
  - https://extremeshox.com/product/ext-e-storia/
  - https://extremeshox.com/product/vecta/
  - https://extremeshox.com/wp-content/uploads/2023/08/Storia_V3-S_Quick_Manual_1.1.pdf
  - https://extremeshox.com/wp-content/uploads/2023/09/e-Storia-quick-manual.pdf
  - https://extremeshox.com/wp-content/uploads/2023/08/Quick-manual-Aria-min.pdf
  - https://extremeshox.com/wp-content/uploads/2025/06/EXT-Vecta-Quick-Manual.pdf
  - https://extremeshox.com/wp-content/uploads/2024/06/Arma-Storia-V4-Quick-Manual.pdf
  - https://extremeshox.com/wp-content/uploads/2023/09/ARMA-STORIA_V3_quick_manual.pdf
  - https://www.pinkbike.com/news/review-ext-storia-v3-shock.html
  - https://www.pinkbike.com/news/review-ext-arma-v4-one-of-the-best-mtb-shocks-gets-even-better.html
updated: 2026-10-05

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    storia_v3:
      name: Storia V3(-S)
      description: >
        Four-way adjustable damper (LSC, HSC, rebound and the LOK pedal-platform
        lever) without an adjustable bottom-out circuit.
      adjustments:
        - { name: LSC, type: step, max: 14, notes: Low-Speed Compression }
        - { name: HSC, type: step, max: 14, notes: High-Speed Compression }
        - { name: Rebound, type: step, max: 10 }
        - { name: LOK (Climb Switch), type: boolean, notes: "Clockwise = LOK (firm pedal platform), counterclockwise = Open. Not a true lockout" }
      adjusters: LSC/BL (4mm Allen) / HSC/BH (12mm wrench or socket) / Rebound/R (bottom knob)
      source: https://www.pinkbike.com/news/review-ext-storia-v3-shock.html
      note: >-
        Click totals are not published by EXT; taken from Pinkbike's Storia V3
        review body text: "There are 14 clicks of LSC, 14 clicks of HSC, and 10
        possible rebound settings."

    storia_v4:
      name: Storia V4
      description: >
        Four-way adjustable damper (LSC, HSC, rebound, HBC) plus the LOK 2.0
        pedal-platform lever.
      adjustments:
        - { name: LSC, type: step, max: ~, notes: Low-Speed Compression }
        - { name: HSC, type: step, max: ~, notes: High-Speed Compression }
        - { name: Rebound, type: step, max: ~, notes: Low-Speed Rebound }
        - { name: HBC, type: step, max: ~, notes: Hydraulic bottom-out control }
        - { name: LOK 2.0 (Climb Switch), type: boolean, notes: "Clockwise = LOK (firm pedal platform), counterclockwise = Open. Not a true lockout" }
      adjusters: LSC/BL (4mm Allen) / HSC/BH (12mm wrench or socket) / Rebound/R (bottom knob) / HBC (4mm Allen, top of compression valve)

    arma_v3:
      name: Arma V3
      description: Downhill-race damper with four adjusters (LSC, HSC, rebound, HBC) and no climb switch.
      adjustments:
        - { name: LSC, type: step, max: ~, notes: Low-Speed Compression }
        - { name: HSC, type: step, max: ~, notes: High-Speed Compression }
        - { name: Rebound, type: step, max: ~, notes: Low-Speed Rebound }
        - { name: HBC, type: step, max: ~, notes: Hydraulic bottom-out control }
      adjusters: LSC / HSC / Rebound / HBC — no LOK on Arma (confirmed "Available on Storia V4 only")

    arma_v4:
      name: Arma V4
      description: >
        Downhill damper with four adjusters (LSC, HSC, rebound, HBC), tunable
        with a multi-tool (5mm and 4mm Allen keys). No climb switch.
      adjustments:
        - { name: LSC, type: step, max: 14, notes: Low-Speed Compression }
        - { name: HSC, type: step, max: 15, notes: High-Speed Compression }
        - { name: Rebound, type: step, max: ~, notes: Low-Speed Rebound }
        - { name: HBC, type: step, max: 10, notes: "Hydraulic bottom-out control, last 20% of stroke" }
      adjusters: LSC (4mm Allen) / HSC (5mm Allen) / Rebound / HBC
      source: https://www.pinkbike.com/news/review-ext-arma-v4-one-of-the-best-mtb-shocks-gets-even-better.html
      note: >-
        Click totals are not published by EXT; taken from Pinkbike's Arma V4
        review: setup table "LSC: -7/14 (7 clicks from closed, 14 in total)",
        "HSC: -8/15", and in prose HBC "can be tweaked to your liking with 10
        clicks of adjustment." The table's Rebound entry ("R: -5/-14") does not
        follow the same notation, so Rebound has no recorded range.

    aria:
      name: Aria
      description: >
        EXT's first air shock: four hydraulic adjusters (LSC, HSC, rebound,
        HBC) plus a LOK climb lever.
      adjustments:
        - { name: LSC, type: step, max: ~, notes: Low-Speed Compression }
        - { name: HSC, type: step, max: ~, notes: High-Speed Compression }
        - { name: Rebound, type: step, max: ~ }
        - { name: HBC, type: step, max: ~, notes: Hydraulic bottom-out control }
        - { name: LOK (Climb Switch), type: boolean, notes: "Clockwise = LOK (firm pedal platform), counterclockwise = Open. Not a true lockout" }
      adjusters: LSC/BL (4mm Allen) / HSC/BH (12mm wrench) / Rebound/R (bottom knob) / HBC/H (4mm Allen)

    e_storia:
      name: e-Storia
      description: >
        Damper tuned for e-MTB use (heavier bikes, higher speeds) with a
        stiffer spring platform and negative spring. Adjusters: LSC, HSC,
        rebound, HBC and LOK.
      adjustments:
        - { name: LSC, type: step, max: ~, notes: Low-Speed Compression }
        - { name: HSC, type: step, max: ~, notes: High-Speed Compression }
        - { name: Rebound, type: step, max: ~ }
        - { name: HBC, type: step, max: ~, notes: Hydraulic bottom-out control }
        - { name: LOK (Climb Switch), type: boolean, notes: "Clockwise = LOK (firm pedal platform), counterclockwise = Open. Not a true lockout" }
      adjusters: LSC/BL (4mm Allen) / HSC/BH (12mm wrench) / Rebound/R (bottom knob) / HBC (4mm Allen)
      note: High-rate springs (>600 lbs/in / 105 N/mm) require EXT-specific mounting adapters; spring preload must not exceed 2mm.

    vecta:
      name: Vecta
      description: >
        Monotube coil damper with LSC (4mm Allen), HSC (5mm Allen), rebound and
        a LOK 2.0 climb lever. The HBC is factory-tuned and not adjustable.
      adjustments:
        - { name: LSC, type: step, max: ~, notes: Low-Speed Compression }
        - { name: HSC, type: step, max: ~, notes: High-Speed Compression }
        - { name: Rebound, type: step, max: ~ }
        - { name: LOK 2.0 (Climb Switch), type: boolean, notes: "Clockwise = LOK (firm pedal platform), counterclockwise = Open. Not a true lockout" }
      adjusters: LSC (4mm Allen) / HSC (5mm Allen) / Rebound (bottom knob)

# --------------------------------------------------------------------------
# Shocks — current EXT MTB lineup (extremeshox.com, checked 2026-07-17).
# All shocks below are coil except Aria (air). Coil trims share the
# &coil_spring anchor (Spring Rate; springs are sold separately for every
# EXT coil shock). Stroke/eye-to-eye options are listed exactly as published.
# --------------------------------------------------------------------------
nodes:
  - label: "Storia V3"
    level: model
    category: Enduro / Trail
    years: "2025-2026"
    url: https://extremeshox.com/product/ext-storia/
    setup_guide: https://extremeshox.com/wp-content/uploads/2023/09/ARMA-STORIA_V3_quick_manual.pdf
    specs: { spring: Coil }
    note: Sold as "Storia V3-S" per the official quick manual; features a spring thrust bearing between spring and collar — do not omit it during spring install.
    children:
      - label: Metric Standard
        level: trim
        adjustments: &coil_spring
          - { name: Spring Rate, type: numerical, unit: lbs/in, min: 0 }
        options:
          damper: [storia_v3]
          size: ["210x50", "210x52.5", "210x55", "230x57.5", "230x60", "230x62.5", "230x65", "250x67.5", "250x70", "250x72.5", "250x75"]
