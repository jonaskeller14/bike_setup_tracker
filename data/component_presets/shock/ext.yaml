# EXT (Extreme Racing Shox) mountain-bike shocks — adjustment preset database
#
# Same design as shock/fox.yaml and shock/ohlins.yaml: click ranges belong to
# the DAMPER, defined once under `option_values.damper` and referenced by id from each
# shock's trims. See SCHEMA.md in this folder.
#
# EXT (Italian boutique brand, extremeshox.com) currently sells five MTB
# shock lines: the coil "Storia" (trail/enduro) and "Arma" (downhill), each
# now in a V3(-S) and a newer V4 generation with different feature sets under
# the same family name (per SCHEMA.md's "give each generation its own damper
# id" rule); the e-MTB-tuned coil "e-Storia"; the air "Aria"; and the newest
# coil shock, "Vecta".
#
# IMPORTANT — click counts: EXT's product pages and official "quick manual"
# PDFs (extremeshox.com/manuals/) name every hydraulic adjuster (LSC/BL, HSC/
# BH, Rebound/R, HBC, LOK) and confirm the counting convention (turning fully
# clockwise = fully closed = click 0; opening is counterclockwise — the same
# convention as the schema's default `dial_ccw`), but none of them publishes
# a maximum click count. The Storia V3(-S), Arma V3 and Storia V4 quick manuals
# only give a single suggested *starting* setting (e.g. "BH7 BL6 R7"), not a
# range — that is no table to estimate from, so those adjusters keep `max: ~`.
# Totals come from staff-written magazine reviews (storia_v3, storia_v4 HBC,
# arma_v4, vecta) and, for the first-generation Aria, are estimated from the
# weight table of its quick manual. See "Follow-ups" for the rest.
brand: EXT
component_type: shock
sources:
  - https://extremeshox.com/
  - https://extremeshox.com/manuals/
  - https://extremeshox.com/product/storia-v4/
  - https://extremeshox.com/product/ext-storia/
  - https://extremeshox.com/product/arma-v4/
  - https://extremeshox.com/product/arma-v3/
  - https://extremeshox.com/product/ext-aria/
  - https://extremeshox.com/product/ext-e-storia/
  - https://extremeshox.com/product/vecta/
  - https://extremeshox.com/wp-content/uploads/2023/08/Storia_V3-S_Quick_Manual_1.1.pdf
  - https://extremeshox.com/wp-content/uploads/2023/09/e-Storia-quick-manual.pdf
  - https://extremeshox.com/wp-content/uploads/2023/08/Quick-manual-Aria-min.pdf
  - https://extremeshox.com/wp-content/uploads/2025/06/EXT-Vecta-Quick-Manual.pdf
  - https://extremeshox.com/wp-content/uploads/2024/06/Arma-Storia-V4-Quick-Manual.pdf
  - https://extremeshox.com/wp-content/uploads/2023/09/ARMA-STORIA_V3_quick_manual.pdf
  - https://www.pinkbike.com/news/review-ext-storia-v3-shock.html
  - https://www.pinkbike.com/news/review-ext-arma-v4-one-of-the-best-mtb-shocks-gets-even-better.html
  - https://www.pinkbike.com/news/review-exts-new-storia-v4-coil-shock.html
  - https://www.pinkbike.com/news/review-ext-vecta-coil-shock.html
  - https://nsmb.com/articles/ext-storia-lok-v4-rear-shock/
  - https://extremeshox.com/product/aria-v2/
  - https://extremeshox.com/product/aria-v2-dh/
  - https://extremeshox.com/wp-content/uploads/2026/09/Quick-manual-Aria-V2-3.pdf
  - https://extremeshox.com/vecta-ridemaster/
updated: 2026-10-13
# Service intervals (`tasks`) come from the quick manuals (the nodes'
# `setup_guide`): every 100 hours or 1 year for amateur use (racing: 50 hours
# or 6 months; the amateur figure is used).

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    storia_v3:
      name: Storia V3(-S)
      description: >
        Four-way adjustable damper (LSC, HSC, rebound and the LOK pedal-platform
        lever) without an adjustable bottom-out circuit.
      adjustments:
        - { name: LSC, type: step, max: 14, notes: Low-Speed Compression }
        - { name: HSC, type: step, max: 14, notes: High-Speed Compression }
        - { name: Rebound, type: step, max: 10 }
        - { name: LOK (Climb Switch), type: boolean, notes: "Clockwise = LOK (firm pedal platform), counterclockwise = Open. Not a true lockout" }
      adjusters: LSC/BL (4mm Allen) / HSC/BH (12mm wrench or socket) / Rebound/R (bottom knob)
      source: https://www.pinkbike.com/news/review-ext-storia-v3-shock.html
      note: >-
        Click totals are not published by EXT; taken from Pinkbike's Storia V3
        review body text: "There are 14 clicks of LSC, 14 clicks of HSC, and 10
        possible rebound settings."

    storia_v4:
      name: Storia V4
      description: >
        Four-way adjustable damper (LSC, HSC, rebound, HBC) plus the LOK 2.0
        pedal-platform lever.
      adjustments:
        - { name: LSC, type: step, max: ~, notes: Low-Speed Compression }
        - { name: HSC, type: step, max: ~, notes: High-Speed Compression }
        - { name: Rebound, type: step, max: ~, notes: Low-Speed Rebound }
        - { name: HBC, type: step, max: 10, notes: Hydraulic bottom-out control }
        - { name: LOK 2.0 (Climb Switch), type: boolean, notes: "Clockwise = LOK (firm pedal platform), counterclockwise = Open. Not a true lockout" }
      adjusters: LSC/BL (4mm Allen) / HSC/BH (12mm wrench or socket) / Rebound/R (bottom knob) / HBC (4mm Allen, top of compression valve)
      source:
        - https://www.pinkbike.com/news/review-exts-new-storia-v4-coil-shock.html
        - https://nsmb.com/articles/ext-storia-lok-v4-rear-shock/
        - https://extremeshox.com/wp-content/uploads/2024/06/Arma-Storia-V4-Quick-Manual.pdf
      note: >-
        HBC total from Pinkbike's Storia V4 review ("5 clicks from closed (out of
        a total of 10)") and NSMB's ("can be adjusted externally for 10 clicks").
        LSC, HSC and rebound totals appear in no review text, and the quick
        manual prints a single starting setting (HSC 10, LSC 10, R 9, HBC 5), so
        those three keep `max: ~`.

    arma_v3:
      name: Arma V3
      description: Downhill-race damper with four adjusters (LSC, HSC, rebound, HBC) and no climb switch.
      adjustments:
        - { name: LSC, type: step, max: ~, notes: Low-Speed Compression }
        - { name: HSC, type: step, max: ~, notes: High-Speed Compression }
        - { name: Rebound, type: step, max: ~, notes: Low-Speed Rebound }
        - { name: HBC, type: step, max: ~, notes: Hydraulic bottom-out control }
      adjusters: LSC / HSC / Rebound / HBC — no LOK on Arma (confirmed "Available on Storia V4 only")

    arma_v4:
      name: Arma V4
      description: >
        Downhill damper with four adjusters (LSC, HSC, rebound, HBC), tunable
        with a multi-tool (5mm and 4mm Allen keys). No climb switch.
      adjustments:
        - { name: LSC, type: step, max: 14, notes: Low-Speed Compression }
        - { name: HSC, type: step, max: 15, notes: High-Speed Compression }
        - { name: Rebound, type: step, max: 14, notes: Low-Speed Rebound }
        - { name: HBC, type: step, max: 10, notes: "Hydraulic bottom-out control, last 20% of stroke" }
      adjusters: LSC (4mm Allen) / HSC (5mm Allen) / Rebound / HBC
      source: https://www.pinkbike.com/news/review-ext-arma-v4-one-of-the-best-mtb-shocks-gets-even-better.html
      note: >-
        Click totals are not published by EXT; taken from Pinkbike's Arma V4
        review: setup table "LSC: -7/14 (7 clicks from closed, 14 in total)",
        "HSC: -8/15", and in prose HBC "can be tweaked to your liking with 10
        clicks of adjustment." The table's Rebound entry reads "R: -5/-14"; the
        stray minus before the total is taken as a typo of the "N/total"
        notation of the other rows, giving 14 in total.

    aria:
      name: Aria
      description: >
        EXT's first air shock: four hydraulic adjusters (LSC, HSC, rebound,
        HBC) plus a LOK climb lever.
      adjustments:
        - { name: LSC, type: step, max: 12, notes: "Low-Speed Compression; estimated maximum, check your dial and edit it if it differs" }
        - { name: HSC, type: step, max: 10, notes: "High-Speed Compression; estimated maximum, check your dial and edit it if it differs" }
        - { name: Rebound, type: step, max: 13, notes: "Estimated maximum, check your dial and edit it if it differs" }
        - { name: HBC, type: step, max: 4, notes: "Hydraulic bottom-out control; estimated maximum, check your dial and edit it if it differs" }
        - { name: LOK (Climb Switch), type: boolean, notes: "Clockwise = LOK (firm pedal platform), counterclockwise = Open. Not a true lockout" }
      adjusters: LSC/BL (4mm Allen) / HSC/BH (12mm wrench) / Rebound/R (bottom knob) / HBC/H (4mm Allen)
      source: https://extremeshox.com/wp-content/uploads/2023/08/Quick-manual-Aria-min.pdf
      note: >-
        Totals are estimates: the highest value per column of the quick manual's
        suggested setup table (seven rows from < 250 lb to > 600 lb equivalent
        spring rate), counted from fully closed = click 0. BH 10, BL 12, R 13,
        H 4. The manual states no totals and no review gives any.

    e_storia:
      name: e-Storia
      description: >
        Damper tuned for e-MTB use (heavier bikes, higher speeds) with a
        stiffer spring platform and negative spring. Adjusters: LSC, HSC,
        rebound, HBC and LOK.
      adjustments:
        - { name: LSC, type: step, max: ~, notes: Low-Speed Compression }
        - { name: HSC, type: step, max: ~, notes: High-Speed Compression }
        - { name: Rebound, type: step, max: ~ }
        - { name: HBC, type: step, max: ~, notes: Hydraulic bottom-out control }
        - { name: LOK (Climb Switch), type: boolean, notes: "Clockwise = LOK (firm pedal platform), counterclockwise = Open. Not a true lockout" }
      adjusters: LSC/BL (4mm Allen) / HSC/BH (12mm wrench) / Rebound/R (bottom knob) / HBC (4mm Allen)
      note: High-rate springs (>600 lbs/in / 105 N/mm) require EXT-specific mounting adapters; spring preload must not exceed 2mm.

    vecta:
      name: Vecta
      description: >
        Monotube coil damper with LSC (4mm Allen), HSC (5mm Allen), rebound and
        a LOK 2.0 climb lever. The HBC is factory-tuned and not adjustable.
      adjustments:
        - { name: LSC, type: step, max: 14, notes: Low-Speed Compression }
        - { name: HSC, type: step, max: 14, notes: High-Speed Compression }
        - { name: Rebound, type: step, max: 16 }
        - { name: LOK 2.0 (Climb Switch), type: boolean, notes: "Clockwise = LOK (firm pedal platform), counterclockwise = Open. Not a true lockout" }
      adjusters: LSC (4mm Allen) / HSC (5mm Allen) / Rebound (bottom knob)
      source: https://www.pinkbike.com/news/review-ext-vecta-coil-shock.html
      note: >-
        Click totals are not published by EXT; taken from Pinkbike's Vecta
        review: "Each compression dial offered 14 clicks of adjustment" and the
        setup block "LSC: -7/14 HSC: -11/14 R: -11/16" (clicks from closed /
        total).

    aria_v2:
      name: Aria V2
      description: >
        Air-shock damper with LSC (4mm Allen), HSC (5mm Allen), rebound and an
        adjustable HBC, plus the LOK 2.0 climb lever.
      adjustments:
        - { name: LSC, type: step, max: ~, notes: Low-Speed Compression }
        - { name: HSC, type: step, max: ~, notes: High-Speed Compression }
        - { name: Rebound, type: step, max: ~ }
        - { name: HBC, type: step, max: ~, notes: Hydraulic bottom-out control }
        - { name: LOK 2.0 (Climb Switch), type: boolean, notes: "Clockwise = LOK (firm pedal platform), counterclockwise = Open. Not a true lockout" }
      adjusters: LSC/BL (4mm Allen) / HSC/BH (12mm wrench) / Rebound/R (bottom knob) / HBC/H (4mm Allen) / LOK (lever)
      source:
        - https://extremeshox.com/product/aria-v2/
        - https://extremeshox.com/wp-content/uploads/2026/09/Quick-manual-Aria-V2-3.pdf
      note: >-
        The Aria V2 quick manual names the adjusters but prints no totals and
        no setup table (setup suggestions moved to EXT's Ridemaster app).

    aria_v2_dh:
      name: Aria V2 DH
      description: >
        Downhill version of the Aria V2 damper with a DH-specific HBC tune
        (20% more force at the end of the stroke) and no climb lever.
      adjustments:
        - { name: LSC, type: step, max: ~, notes: Low-Speed Compression }
        - { name: HSC, type: step, max: ~, notes: High-Speed Compression }
        - { name: Rebound, type: step, max: ~ }
        - { name: HBC, type: step, max: ~, notes: Hydraulic bottom-out control }
      adjusters: LSC/BL (4mm Allen) / HSC/BH (12mm wrench) / Rebound/R (bottom knob) / HBC/H (4mm Allen)
      source:
        - https://extremeshox.com/product/aria-v2-dh/
        - https://extremeshox.com/wp-content/uploads/2026/09/Quick-manual-Aria-V2-3.pdf

# --------------------------------------------------------------------------
# Setup guides — the quick manuals' and RideMaster's starting points as data
# (SCHEMA.md, "Setup guides"), transcribed from docs/research/setup_guides/ext.md.
# Every EXT source counts clicks from fully closed, the catalog's direction.
# Not encoded:
#   * Storia V3: the Arma / Storia V3 and the Storia V3-S quick manuals print
#     different starting clicks (BH10 BL6 R4 against BH7 BL6 R7).
#   * Aria (V1): its table is keyed by an equivalent coil spring rate, which
#     the air shock has no adjuster for.
#   * Aria V2 / Aria V2 DH: RideMaster derives their pressures from rider and
#     bike weight, rear travel and stroke, and some results exceed the
#     published chamber limits.
#   * Spring rates: RideMaster and the Spring Calculator need the bike's
#     weight and rear travel (#71).
#   * e-Storia: its quick manual prints no starting point.
# --------------------------------------------------------------------------
guides:
  ext_arma_storia_v3_2023:
    label: EXT Arma / Storia V3 quick manual (2023)
    source: https://extremeshox.com/wp-content/uploads/2023/09/ARMA-STORIA_V3_quick_manual.pdf
    # No HBC starting point is printed.
    rules:
      - { target: hsc, value: 10 }
      - { target: lsc, value: 6 }
      - { target: rebound, value: 4 }

  ext_arma_storia_v4_2024:
    label: EXT Arma / Storia V4 quick manual (2024)
    source: https://extremeshox.com/wp-content/uploads/2024/06/Arma-Storia-V4-Quick-Manual.pdf
    rules:
      - { target: hsc, value: 10 }
      - { target: lsc, value: 10 }
      - { target: rebound, value: 9 }
      - { target: hbc, value: 5, note: Close it step by step if the shock bottoms out often }

  ext_ridemaster_2026:
    label: EXT RideMaster (Vecta)
    source: https://extremeshox.com/vecta-ridemaster/
    # RideMaster's starting clicks per spring rate, before its trail type and
    # riding level offsets. Its riding levels are skill, not firmness, so they
    # get no riding-style rule.
    rules:
      - target: hsc
        input: spring_rate
        input_unit: lbs/in
        rows: &ext_ridemaster_compression {
          325: 8, 350: 8, 375: 8, 400: 8, 425: 7, 450: 7, 475: 7, 500: 7,
          525: 6, 550: 6, 575: 6, 600: 6, 625: 5, 650: 5, 675: 5, 700: 5,
          725: 4, 750: 4, 775: 4, 800: 4
        }
        note: "RideMaster's start; technical trails +2, jumps and flow -2"
      - target: lsc
        input: spring_rate
        input_unit: lbs/in
        rows: *ext_ridemaster_compression
        note: "RideMaster's start; technical trails +1, jumps and flow -1"
      - target: rebound
        input: spring_rate
        input_unit: lbs/in
        rows: {
          325: 12, 350: 12, 375: 11, 400: 11, 425: 10, 450: 10, 475: 9, 500: 9,
          525: 8, 550: 8, 575: 7, 600: 7, 625: 6, 650: 6, 675: 5, 700: 5,
          725: 4, 750: 4, 775: 3, 800: 3
        }
        note: "RideMaster's start; technical trails +2, jumps and flow -2"
      - { target: sag, range: [28, 33], comfort_at: max, note: "RideMaster picks 28 % for gentle, 30 % for medium and 33 % for steep trails" }

# --------------------------------------------------------------------------
# Shocks — current EXT MTB lineup (extremeshox.com, checked 2026-07-17).
# All shocks below are coil except Aria (air). Coil trims share the
# &coil_spring anchor (Spring Rate; springs are sold separately for every
# EXT coil shock). Stroke/eye-to-eye options are listed exactly as published.
# --------------------------------------------------------------------------
nodes:
  - label: "Storia V3"
    level: model
    category: Enduro / Trail
    specs: { spring: Coil }
    tasks: &ext_service
      shock:full_service: { interval: { moving_time_h: 100 }, fallback: { days: 365 }, source: EXT quick manual }
    children:
      - label: "2025–2026"
        level: generation
        id: "2025"
        years: "2025-2026"
        url: https://extremeshox.com/product/ext-storia/
        setup_guide: https://extremeshox.com/wp-content/uploads/2023/09/ARMA-STORIA_V3_quick_manual.pdf
        note: Sold as "Storia V3-S" per the official quick manual; features a spring thrust bearing between spring and collar — do not omit it during spring install.
        children:
          - label: Metric Standard
            level: trim
            adjustments: &coil_spring
              - { name: Spring Rate, type: numerical, unit: lbs/in, min: 0 }
            options:
              damper: [storia_v3]
              size: ["210x50", "210x52.5", "210x55", "230x57.5", "230x60", "230x62.5", "230x65", "250x67.5", "250x70", "250x72.5", "250x75"]
