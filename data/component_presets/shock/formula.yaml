# --------------------------------------------------------------------------
# Setup guides — the owner's manuals' starting points as data (SCHEMA.md,
# "Setup guides"), transcribed from docs/research/setup_guides/formula.md.
#   * Rebound and compression are the manuals' base tunes, counted from fully
#     closed as the catalog dials are.
#   * Not encoded: the compression switch positions (situational: open for
#     descents, firmer for climbs), the Nebbia's SAG-indicator marks (keyed by
#     discipline, not a SAG value) and the MOD preload window (2-5 mm, a
#     limit the Preload range already holds, not a setting).
#   * No spring-rate chart is published for the MOD / MOD DH.
# --------------------------------------------------------------------------
guides:
  formula_nebbia_2024:
    label: Formula Nebbia user manual
    label_de: Formula Nebbia Bedienungsanleitung
    label_fr: Manuel d’utilisation Formula Nebbia
    label_it: Manuale d’uso Formula Nebbia
    label_es: Manual del usuario Formula Nebbia
    label_pt: Manual do usuário Formula Nebbia
    source: https://www.rideformula.com/wp-content/uploads/2024/07/Manuale-Utente-Nebbia-ENG.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          50-60: [120, 130], 60-70: [130, 140], 70-80: [140, 150],
          80-90: [150, 170], 90-100: [170, 190], 100+: [190, 210]
        }
        note: Frames can differ by up to 30 psi; set the final pressure by SAG
        note_de: Rahmen können um bis zu 30 psi abweichen; den endgültigen Druck über den SAG einstellen
        note_fr: Les cadres peuvent différer jusqu’à 30 psi ; réglez la pression finale au SAG
        note_it: I telai possono differire fino a 30 psi; regola la pressione finale in base al SAG
        note_es: Los cuadros pueden diferir hasta 30 psi; ajusta la presión final según el SAG
        note_pt: Os quadros podem diferir em até 30 psi; defina a pressão final pelo SAG
      - { target: rebound, value: 12 }
      - { target: compression, value: 10 }

  formula_mod_2020:
    label: Formula MOD owner's manual
    label_de: Formula MOD Bedienungsanleitung
    label_fr: Manuel d’utilisation Formula MOD
    label_it: Manuale d’uso Formula MOD
    label_es: Manual del usuario Formula MOD
    label_pt: Manual do usuário Formula MOD
    source: https://www.rideformula.com/wp-content/uploads/2020/09/MOD-Owner-Manual.pdf
    rules:
      - { target: rebound, value: 6, note: "A stiffer spring needs a little more: 1-2 clicks going from 400 to 450 lbs/in", note_de: "Eine härtere Feder braucht etwas mehr: 1-2 Klicks beim Wechsel von 400 auf 450 lbs/in", note_fr: "Un ressort plus dur en demande un peu plus : 1-2 clics en passant de 400 à 450 lbs/in", note_it: "Una molla più dura ne richiede un po’ di più: 1-2 scatti passando da 400 a 450 lbs/in", note_es: "Un muelle más duro pide un poco más: 1-2 clics al pasar de 400 a 450 lbs/in", note_pt: "Uma mola mais dura pede um pouco mais: 1-2 cliques ao passar de 400 para 450 lbs/in" }
      - { target: compression, value: 9 }
      - { target: sag, value: 30, note: "Set with preload between 2 and 5 mm; beyond that, change the spring", note_de: Mit Vorspannung zwischen 2 und 5 mm einstellen; darüber hinaus die Feder wechseln, note_fr: "À régler avec une précontrainte entre 2 et 5 mm ; au-delà, changez de ressort", note_it: "Da impostare con un precarico tra 2 e 5 mm; oltre, cambia la molla", note_es: "Se ajusta con una precarga de entre 2 y 5 mm; si te pasas, cambia el muelle", note_pt: "Defina com uma pré-carga entre 2 e 5 mm; acima disso, troque a mola" }

