# Formula mountain-bike shocks — adjustment preset database
#
# Same design as shock/fox.yaml: click ranges belong to the DAMPER, defined
# once under `option_values.damper` and referenced by id from each shock's trims.
# See SCHEMA.md in this folder.
#
# Formula (Formula SRL, Italy — the official site is rideformula.com) sells
# three rear shocks: the Nebbia air shock (2024) and the MOD and MOD DH coil
# shocks. All three use a bladder oil reservoir and Formula's Compression
# Tuning System (CTS) valves, but each product page lists its own
# click totals, so each shock gets its own damper id.

brand: Formula
component_type: shock
sources:
  - https://www.rideformula.com/cat/mtb-shocks/
  - https://www.rideformula.com/products/mtb-shocks/nebbia/
  - https://www.rideformula.com/products/mtb-shocks/mod/
  - https://www.rideformula.com/products/mtb-shocks/mod-dh/
  # Formula user manuals (PDF) — setup guides and knob colors
  - https://www.rideformula.com/wp-content/uploads/2024/07/Manuale-Utente-Nebbia-ENG.pdf
  - https://www.rideformula.com/wp-content/uploads/2020/09/MOD-Owner-Manual.pdf
  - https://www.rideformula.com/wp-content/uploads/2020/09/MOD-Manuale-utente.pdf
  # Editorial — first model years only, never for click counts
  - https://www.mbr.co.uk/news/formula-launches-its-first-air-shock-called-the-nebbia-and-it-promises-high-performance-with-simplified-set-up-437962
  - https://www.mbr.co.uk/reviews/shocks/formula-mod-coil-shock
updated: 2026-10-13
# Service intervals (`tasks`) come from the owner's manuals cited above: Nebbia
# air seals every 60 hours or 6 months and oil change every 125 hours or
# 1 year (non-Yoke frames); MOD and MOD DH a full service every 200 hours or
# 1 year.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    nebbia_2024:
      name: Nebbia damper
      description: |-
        - Bladder-backed damper with a three-position compression switch: Open, Platform, Firm
        - Compression Tuning System (CTS) valves swap in for larger changes
        - Very wide rebound range so one tune suits many frames
      description_de: |-
        - Dämpfer mit Bladder und Drei-Positionen-Druckstufenschalter: Open, Platform, Firm
        - Ventile des Compression Tuning System (CTS) werden für größere Änderungen getauscht
        - Sehr großer Zugstufenbereich, sodass eine Abstimmung zu vielen Rahmen passt
      description_fr: |-
        - Amortisseur à bladder avec un commutateur de compression à trois positions : Open, Platform, Firm
        - Les valves Compression Tuning System (CTS) s’échangent pour des changements plus importants
        - Plage de détente très large, pour qu’un seul réglage convienne à de nombreux cadres
      description_it: |-
        - Ammortizzatore a bladder con un selettore di compressione a tre posizioni: Open, Platform, Firm
        - Le valvole Compression Tuning System (CTS) si sostituiscono per cambiamenti più importanti
        - Gamma del ritorno molto ampia, così una sola taratura va bene per molti telai
      description_es: |-
        - Amortiguador con bladder y un selector de compresión de tres posiciones: Open, Platform, Firm
        - Las válvulas Compression Tuning System (CTS) se cambian para modificaciones más grandes
        - Rango de rebote muy amplio, de modo que un solo tarado sirve para muchos cuadros
      description_pt: |-
        - Amortecedor com bladder e um seletor de compressão de três posições: Open, Platform, Firm
        - As válvulas Compression Tuning System (CTS) são trocadas para mudanças maiores
        - Faixa de retorno bem ampla, de modo que uma única calibragem serve para muitos quadros
      adjustments:
        - { name: Compression, name_de: Druckstufe, name_fr: Compression, name_it: Compressione, name_es: Compresión, name_pt: Compressão, type: step, max: 21, dialColor: blue }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 23 }
        - { name: Compression Mode, name_de: Druckstufenmodus, name_fr: Mode de compression, name_it: Modalità di compressione, name_es: Modo de compresión, name_pt: Modo de compressão, type: categorical, options: [Open, Platform, Firm], options_de: [Offen, Platform, Fest], options_fr: [Ouvert, Platform, Ferme], options_it: [Aperto, Platform, Rigido], options_es: [Abierto, Platform, Firme], options_pt: [Aberto, Platform, Firme] }
      source: https://www.rideformula.com/products/mtb-shocks/nebbia/
      note: >-
        Nebbia page: "Compression: 21 Click Adjustment", "Rebound: 23 Click
        Adjustment", "CTS: Gold, Orange and Green valves included", "Compression
        Switch: Three position - Open, Platform, Firm".

    mod_2020:
      name: MOD damper
      description: |-
        - Single-tube damper with a 30mm piston and a large-volume bladder reservoir
        - Two-position compression switch: Open or Firm
        - Compression Tuning System (CTS) valves swap in for larger changes
      description_de: |-
        - Eirohr-Dämpfer mit 30mm-Kolben und großvolumigem Bladder-Ausgleichsbehälter
        - Zwei-Positionen-Druckstufenschalter: Open oder Firm
        - Ventile des Compression Tuning System (CTS) werden für größere Änderungen getauscht
      description_fr: |-
        - Amortisseur monotube avec un piston de 30 mm et un grand réservoir à bladder
        - Commutateur de compression à deux positions : Open ou Firm
        - Les valves Compression Tuning System (CTS) s’échangent pour des changements plus importants
      description_it: |-
        - Ammortizzatore monotubo con pistone da 30 mm e un serbatoio a bladder di grande volume
        - Selettore di compressione a due posizioni: Open o Firm
        - Le valvole Compression Tuning System (CTS) si sostituiscono per cambiamenti più importanti
      description_es: |-
        - Amortiguador monotubo con un pistón de 30 mm y un gran depósito de bladder
        - Selector de compresión de dos posiciones: Open o Firm
        - Las válvulas Compression Tuning System (CTS) se cambian para modificaciones más grandes
      description_pt: |-
        - Amortecedor monotubo com um pistão de 30 mm e um grande reservatório de bladder
        - Seletor de compressão de duas posições: Open ou Firm
        - As válvulas Compression Tuning System (CTS) são trocadas para mudanças maiores
      adjustments:
        - { name: Compression, name_de: Druckstufe, name_fr: Compression, name_it: Compressione, name_es: Compresión, name_pt: Compressão, type: step, max: 17, dialColor: blue }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 13, dialColor: red }
        - { name: Compression Mode, name_de: Druckstufenmodus, name_fr: Mode de compression, name_it: Modalità di compressione, name_es: Modo de compresión, name_pt: Modo de compressão, type: categorical, options: [Open, Firm], options_de: [Offen, Fest], options_fr: [Ouvert, Ferme], options_it: [Aperto, Rigido], options_es: [Abierto, Firme], options_pt: [Aberto, Firme] }
      source: https://www.rideformula.com/products/mtb-shocks/mod/
      note: >-
        MOD page: "Compression: 17 Click Adjustment", "Rebound: 13 Click
        Adjustment", "Compression Switch: Two position - Open, Firm", "CTS: Gold,
        Orange and Green valves included".

    mod_dh:
      name: MOD DH damper
      description: |-
        - Downhill version of the MOD damper, without a climb switch
        - Single-tube damper with a 30mm piston and a large-volume bladder reservoir
        - Compression Tuning System (CTS) valves swap in for larger changes
      description_de: |-
        - Downhill-Version des MOD-Dämpfers, ohne Climb-Schalter
        - Eirohr-Dämpfer mit 30mm-Kolben und großvolumigem Bladder-Ausgleichsbehälter
        - Ventile des Compression Tuning System (CTS) werden für größere Änderungen getauscht
      description_fr: |-
        - Version descente de l’amortisseur MOD, sans climb switch
        - Amortisseur monotube avec un piston de 30 mm et un grand réservoir à bladder
        - Les valves Compression Tuning System (CTS) s’échangent pour des changements plus importants
      description_it: |-
        - Versione downhill dell’ammortizzatore MOD, senza climb switch
        - Ammortizzatore monotubo con pistone da 30 mm e un serbatoio a bladder di grande volume
        - Le valvole Compression Tuning System (CTS) si sostituiscono per cambiamenti più importanti
      description_es: |-
        - Versión de descenso del amortiguador MOD, sin climb switch
        - Amortiguador monotubo con un pistón de 30 mm y un gran depósito de bladder
        - Las válvulas Compression Tuning System (CTS) se cambian para modificaciones más grandes
      description_pt: |-
        - Versão downhill do amortecedor MOD, sem climb switch
        - Amortecedor monotubo com um pistão de 30 mm e um grande reservatório de bladder
        - As válvulas Compression Tuning System (CTS) são trocadas para mudanças maiores
      adjustments:
        - { name: Compression, name_de: Druckstufe, name_fr: Compression, name_it: Compressione, name_es: Compresión, name_pt: Compressão, type: step, max: 17, dialColor: blue }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 13, dialColor: red }
      source: https://www.rideformula.com/products/mtb-shocks/mod-dh/
      note: >-
        MOD DH page: "Compression: 17 Click Adjustment", "Rebound: 13 Click
