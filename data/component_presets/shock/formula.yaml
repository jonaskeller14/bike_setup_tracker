# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - Click counting direction is not stated on any of the three product
#     pages, so the default `dial_ccw` is used.
#   - Nebbia volume spacers: the page says the shock is "Compatible" but gives
#     no spacer count, so no Volume Spacers adjustment is generated.
#   - MOD / MOD DH preload: the MOD user manual (also used for the DH) gives a
#     permissible preload of 2-5 mm at 1.25 mm per turn; the spec tables list
#     "Preload" without a click total, so it is a numerical in mm.
#   - MOD spring rates: the MOD page lists 300-700 lbs/in and the MOD DH page
#     250-550 lbs/in in 50 lbs/in steps; no sag-by-weight chart was read, so
#     Spring Rate stays open-ended.
#   - MOD DH launch year is not confirmed by a readable editorial source, so
#     it carries no `years` (the MOD's 2020 comes from MBR's Sept 2020
#     review, the Nebbia's 2024 from its May 2024 launch coverage).
#   - Dial colors come from the user manuals: blue CTS compression knob on all
#     three (the Nebbia manual) and a red rebound knob on the MOD / MOD DH; the
#     Nebbia manual names no rebound color. The MOD DH manual is the Italian one
#     on its product page (the English MOD manual covers the MOD).
#   - Sizes (eye-to-eye x stroke, with mount) are as printed on each product page.
# --------------------------------------------------------------------------
