# Click ranges taken from the per-model spec tables on the official FOX
# product pages (ridefox.com/pages/fox-<model>). Clicks counted from fully
# closed (firmest) → default `dial_ccw`; an adjuster with "16 clicks" is 0..16.
#
# The FOX owner's manuals never state a total click range for a shock adjuster —
# they publish a pressure-vs-clicks (or spring-rate) starting-point table. Where
# a legacy damper has such a table counted from fully closed, its maximum is the
# highest value of that table (see SCHEMA.md, "Estimating a click range"), and
# every such adjuster carries the "estimated maximum" warning. Adjusters without
# a table stay `max: ~`.
#
# Service intervals (`tasks`) come from the "Recommended Minimum Shock
# Maintenance" table, identical in every shock owner's manual from 2016 to 2027:
# a full shock service (damper rebuild, air seal replacement for air shocks)
# every 125 hours or yearly, whichever comes first. FOX publishes no separate
# air-can interval, so only `shock:full_service` is overridden.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    vvc2:
      name: VVC2 (4-Way Adjust)
      description: |-
        - Gravity damper shared by FLOAT X2 and DHX2
        - Variable Valve Control on both high-speed circuits
        - Factory and Performance Elite add a 2-position Firm Mode lever
      adjustments:
        - { name: HSC, type: step, max: 8, notes: High-Speed Compression, dialColor: blue }
        - { name: LSC, type: step, max: 16, notes: Low-Speed Compression, dialColor: blue, dialSize: small }
        - { name: HSR, type: step, max: 8, notes: High-Speed Rebound, dialColor: red }
        - { name: LSR, type: step, max: 16, notes: Low-Speed Rebound, dialColor: red, dialSize: small }
      firm_mode: optional 2-position independent lever
      source:
        - https://ridefox.com/pages/fox-float-x2
        - https://ridefox.com/pages/fox-dhx2

    float_x:
      name: FLOAT X damper
      description: All-mountain air shock damper. Tool-free 2-position lever (Open/Firm).
      adjustments:
        - { name: Compression, type: step, max: 11, notes: Low-Speed Compression, dialColor: blue }
        - { name: Rebound, type: step, max: 16, notes: Low-Speed Rebound, dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Firm] }
      source: https://ridefox.com/pages/fox-float-x

    float:
      name: FLOAT damper
      description: XC/Trail air shock damper. 2-position lever (Open/Firm) plus a 3-position open-mode adjust (1 plush, 3 firm).
      adjustments:
        - { name: Rebound, type: step, max: 12, dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Firm] }
        - { name: Open Mode Adjust, type: categorical, options: ["1", "2", "3"], notes: "Low-Speed Compression in Open mode; 1 is plushest, 3 firmest" }
      open_mode_micro_adjust: 3-position
      source:
        - https://ridefox.com/pages/fox-float
        - https://tech.ridefox.com/bike/owners-manuals/3099/shock--2026-float

    float_sl:
      name: FLOAT SL damper
      description: |-
        - Lightest XC race damper
        - 3-position lever (Open/Medium/Firm) plus a 3-position open-mode adjust
        - 2-position and 3-position handlebar remotes available
      adjustments:
        - { name: Rebound, type: step, max: 12, dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Medium, Firm] }
        - { name: Open Mode Adjust, type: categorical, options: ["1", "2", "3"], notes: "Low-Speed Compression in Open mode; 1 is plushest, 3 firmest" }
      source:
        - https://ridefox.com/pages/fox-float-sl
        - https://tech.ridefox.com/bike/owners-manuals/3098/shock--2026-float-sl-and-float-x

    dhx_coil:
      name: DHX damper (coil)
      description: Coil-sprung trail/enduro damper. Tool-free adjusters, 2-position Firm switch.
      adjustments:
        - { name: Compression, type: step, max: 11, notes: Low-Speed Compression, dialColor: blue }
        - { name: Rebound, type: step, max: 16, notes: Low-Speed Rebound, dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Firm] }
      source: https://ridefox.com/products/fox-dhx-factory

    # ------------------------------------------------------------------------
    # Legacy dampers — one id per cartridge generation, never reusing a current
    # id. Click totals are absent from FOX's material for all of these, so the
    # adjusters FOX describes are declared with `max: ~`.
    # ------------------------------------------------------------------------
    x2_2016:
      name: X2 4-Way (2016-2020)
      description: |-
        - Four-way gravity damper shared by FLOAT X2 and DHX2 of these years
        - Hex-key adjusters: 6mm for the high-speed circuits, 3mm for the low-speed
      adjustments:
        - { name: HSC, type: step, max: 23, notes: "High-Speed Compression; estimated maximum, check your dial and edit it if it differs", dialColor: blue }
        - { name: LSC, type: step, max: 24, notes: "Low-Speed Compression; estimated maximum, check your dial and edit it if it differs", dialColor: blue, dialSize: small }
        - { name: HSR, type: step, max: 23, notes: "High-Speed Rebound; estimated maximum, check your dial and edit it if it differs", dialColor: red }
        - { name: LSR, type: step, max: 24, notes: "Low-Speed Rebound; estimated maximum, check your dial and edit it if it differs", dialColor: red, dialSize: small }
      source:
        - https://tech.ridefox.com/bike/owners-manuals/556/shock--2016-float-x2
        - https://tech.ridefox.com/bike/owners-manuals/695/shock--2017-float-x2
        - https://tech.ridefox.com/bike/owners-manuals/825/shock--2018-float-x2
        - https://tech.ridefox.com/bike/owners-manuals/941/shock--2019-float-x2
        - https://tech.ridefox.com/bike/owners-manuals/1036/shock--2020-float-x2
        - https://tech.ridefox.com/bike/owners-manuals/1038/shock--2020-all-coil-shocks-(dhx2-and-van-models)
      note: >-
        No stated click range. Maxima are the highest values of the
        starting-point tables in the FLOAT X2 manuals (90-250 psi in 2016-2018,
        90-300 psi in 2019-2020, counted from fully closed): 2016-2017 LSR 23,
        HSR 23, LSC 24, HSC 23; 2018-2020 LSR 24, HSR 19, LSC 22, HSC 23. The
        DHX2 manuals list 23 as the top of one combined range for all four
        adjusters.

    x2_vvc_2021:
      name: X2 VVC 4-Way (2021-2024)
      description: |-
        - Four-way gravity damper with Variable Valve Control high-speed circuits
        - Shared by FLOAT X2 and DHX2 of these years
      adjustments:
        - { name: HSC, type: step, max: 8, notes: "High-Speed Compression; estimated maximum, check your dial and edit it if it differs", dialColor: blue }
        - { name: LSC, type: step, max: 18, notes: "Low-Speed Compression; estimated maximum, check your dial and edit it if it differs", dialColor: blue, dialSize: small }
        - { name: HSR, type: step, max: 8, notes: "High-Speed Rebound; estimated maximum, check your dial and edit it if it differs", dialColor: red }
        - { name: LSR, type: step, max: 18, notes: "Low-Speed Rebound; estimated maximum, check your dial and edit it if it differs", dialColor: red, dialSize: small }
      source:
        - https://tech.ridefox.com/bike/owners-manuals/1078/shock--2021-float-x2
        - https://tech.ridefox.com/bike/owners-manuals/2926/shock--2024-float-x2
        - https://tech.ridefox.com/bike/owners-manuals/1080/shock--2021-all-coil-shocks-(dhx2-and-van-models)
      note: >-
        No stated click range. Maxima are the highest values of the starting-point
        table in the 2024 FLOAT X2 manual (90-300 psi, counted from fully closed):
        LSR 16-18, HSR 7-8, LSC 16-18, HSC 7-8. The 2021 DHX2 manual's spring-rate
        tables top out at LSR 15-16, HSR 7-8, LSC 16-17, HSC 7-8, which is within
        these figures.

    x2_vvc_2021_ls:
      name: X2 VVC Low-Speed (2021-2024)
      description: Performance Elite version of the X2 damper. Low-speed compression and rebound only, no high-speed adjusters.
      adjustments:
        - { name: Compression, type: step, max: 18, notes: "Low-Speed Compression; estimated maximum, check your dial and edit it if it differs", dialColor: blue }
        - { name: Rebound, type: step, max: 18, notes: "Low-Speed Rebound; estimated maximum, check your dial and edit it if it differs", dialColor: red }
      source: https://tech.ridefox.com/bike/owners-manuals/2926/shock--2024-float-x2
      note: >-
        HSR and HSC are Factory Series only. Maxima are the highest values of the
        manual's starting-point table (LSR 16-18, LSC 16-18).

    x2_2016_ls:
      name: X2 Low-Speed (2016-2020)
      description: Performance Elite version of the X2 damper. Low-speed compression and rebound only, no high-speed adjusters.
      adjustments:
        - { name: Compression, type: step, max: 24, notes: "Low-Speed Compression; estimated maximum, check your dial and edit it if it differs", dialColor: blue }
        - { name: Rebound, type: step, max: 24, notes: "Low-Speed Rebound; estimated maximum, check your dial and edit it if it differs", dialColor: red }
      source:
        - https://tech.ridefox.com/bike/owners-manuals/556/shock--2016-float-x2
        - https://tech.ridefox.com/bike/owners-manuals/1036/shock--2020-float-x2
      note: >-
        The FLOAT X2 manuals reserve the high-speed adjusters for the Factory
        Series. Maxima are the highest LSC (24) and LSR (24) values of the
        starting-point tables, counted from fully closed (see x2_2016).

    dps_2016:
      name: DPS (2016-2023)
      description: |-
        - Dual Piston System trail damper with an EVOL negative air sleeve
        - 3-position lever (Open/Medium/Firm) plus a 3-position open-mode adjust
      adjustments:
        - { name: Rebound, type: step, max: 11, notes: "estimated maximum, check your dial and edit it if it differs", dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Medium, Firm] }
        - { name: Open Mode Adjust, type: categorical, options: ["1", "2", "3"], notes: "Low-Speed Compression in Open mode; Factory and Performance Elite non-remote shocks only" }
      source:
        - https://tech.ridefox.com/bike/owners-manuals/1079/shock--2021-float-dps-and-dpx2
        - https://tech.ridefox.com/bike/owners-manuals/824/shock--2018-float-dps-and-dpx2
      note: >-
        Open-mode adjust described as "3 additional fine tuning adjustments".
        Rebound total is not stated: the maximum is the highest number of the
        manual's rebound starting-point table (100-300 psi, 11 clicks from fully
        closed; below 100 psi the table says Open).

    dpx2_2018:
      name: DPX2 (2018-2021)
      description: |-
        - Larger-bodied trail/enduro version of the DPS damper
        - 3-position lever (Open/Medium/Firm) plus a Comp Adj knob for overall compression
      adjustments:
        - { name: Compression, type: step, max: ~, notes: Comp Adj knob, dialColor: blue }
        - { name: Rebound, type: step, max: ~, dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Medium, Firm] }
      source: https://tech.ridefox.com/bike/owners-manuals/1079/shock--2021-float-dps-and-dpx2
      note: Neither the Comp Adj knob's detent count nor the rebound total is stated in the 2018-2021 manuals.

# --------------------------------------------------------------------------
# Shocks — current (2025/2026) FOX lineup, then legacy generations.
# Shocks are sold by eye-to-eye/stroke length to match a given frame, not by a
# fixed "travel" like forks — `options.size` lists commonly offered strokes
# rather than an exhaustive per-frame spec.
#
# The model-level `specs.spring` names the spring type: air shocks share the
# `&air_spring` anchor (Pressure), coil shocks list a Spring Rate. Volume
# Spacers appear only on the FLOAT X2 2016-2024 generations, the only shocks
# whose manual publishes a maximum spacer count — see follow-ups.
# --------------------------------------------------------------------------
nodes:
  - label: "FLOAT SL"
    level: model
    category: XC
    years: "2025-2026"
    url: https://ridefox.com/pages/fox-float-sl
    setup_guide: https://tech.ridefox.com/bike/owners-manuals/3098/shock--2026-float-sl-and-float-x
    specs: { spring: Air }
    tasks: &fox_service
      shock:full_service: { interval: { moving_time_h: 125 }, fallback: { days: 365 }, source: FOX owner's manual }
    children:
      - label: Factory
        level: trim
        specs: { stanchion: Kashima }
        adjustments: &air_spring_sl
          - { name: Pressure, type: numerical, unit: psi, min: 0, max: 350, notes: Maximum 300 psi on shocks without EVOL air sleeve }
        options:
          damper: [float_sl]
          size:
            - { size: "190x40/42.5/45", mount: Standard }
            - { size: "210x55", mount: Standard }
            - { size: "165x40/42.5/45", mount: Trunnion }
      - label: Performance
        level: trim
        specs: { stanchion: "7000-series alloy, black anodized" }
        adjustments: *air_spring_sl
