          240: [3, 5], 250: [2, 4], 260: [2, 4], 270: [1, 3], 280: [1, 3],
          290: [1, 3], 300: [1, 2]
        }
      - target: hsr
        input: pressure
        input_unit: psi
        when: { damper: x2_vvc_2021 }
        rows: {
          90: [7, 8], 100: [7, 8], 110: [6, 7], 120: [6, 7], 130: [5, 6],
          140: [5, 6], 150: [5, 6], 160: [4, 5], 170: [4, 5], 180: [4, 5],
