    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: *fox_air_shock_start
        note: Calculated from FOX's starting point (psi = rider weight in lb); set the final pressure by SAG
      - target: rebound
        input: pressure
        input_unit: psi
        when: { damper: dps_2018 }
        rows: {
          "<100": max, 100-120: 11, 120-140: 10, 140-160: 9, 160-180: 8,
          180-200: 7, 200-220: 6, 220-240: 5, 240-260: 4, 260-280: 3,
          280-300: min
        }
      - { target: compression_mode, value: Open }
      - { target: open_mode_adjust, value: "1", when: { damper: dps_2018, trim: [factory, performance-elite] } }
      - { target: sag, range: [25, 30], comfort_at: max, note: "25 % is FOX's firm end, 30 % the plush end" }

# --------------------------------------------------------------------------
# Shocks — current (2026/2027) FOX lineup, then legacy generations. A model
# gets a `generation` node only where its owner's manuals change a table, damper
# range or limit between model years (see SCHEMA.md, "Generations"); years with
# matching manuals share one node, and `years` spans them: the FLOAT X2 and DHX2
# manuals are identical from 2021 to 2025 and change in 2026.
# Shocks are sold by eye-to-eye/stroke length to match a given frame, not by a
# fixed "travel" like forks — `options.size` lists commonly offered strokes
# rather than an exhaustive per-frame spec.
#
# The model-level `specs.spring` names the spring type: air shocks share the
# `&air_spring` anchor (Pressure), coil shocks list a Spring Rate. Volume
# Spacers appear only on the FLOAT X2 2019-2025 generations, the only shocks
# whose manual publishes a maximum spacer count — see follow-ups.
# --------------------------------------------------------------------------
