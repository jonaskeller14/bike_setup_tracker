# FOX mountain-bike shocks — adjustment preset database
#
# Same design as fork/fox.yaml: click ranges belong to the DAMPER, defined once
# under `dampers:` and referenced by key from each shock's trims. See SCHEMA.md.

brand: FOX
component_type: shock
sources:
  - https://ridefox.com/pages/bike-shocks
  - https://ridefox.com/pages/fox-float-x2
  - https://ridefox.com/pages/fox-dhx2
  - https://ridefox.com/pages/fox-float-x
  - https://ridefox.com/pages/fox-float
  - https://ridefox.com/pages/fox-float-sl
updated: 2026-07-05
# Click ranges taken from the per-model spec tables on the official FOX
# product pages (ridefox.com/pages/fox-<model>). Clicks counted from fully
# closed (firmest) → default `dial_ccw`; an adjuster with "16 clicks" is 0..16.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
dampers:
  vvc2:
    name: VVC2 (4-Way Adjust)
    description: >
      Shared gravity damper platform in FLOAT X2 and DHX2. Variable Valve
      Control on both high-speed circuits. Optional 2-position independent
      Firm Mode lever on Factory/Performance Elite.
    adjustments:
      - { name: HSC, type: step, max: 8, notes: High-Speed Compression }
      - { name: LSC, type: step, max: 16, notes: Low-Speed Compression }
      - { name: HSR, type: step, max: 8, notes: High-Speed Rebound }
      - { name: LSR, type: step, max: 16, notes: Low-Speed Rebound }
    firm_mode: optional 2-position independent lever

  float_x:
    name: FLOAT X damper
    description: All-mountain air shock damper. Tool-free 2-position lever (Open/Firm).
    adjustments:
      - { name: Compression, type: step, max: 11, notes: Low-Speed Compression }
      - { name: Rebound, type: step, max: 16, notes: Low-Speed Rebound }
      - { name: Compression Mode, type: categorical, options: [Open, Firm] }

  float:
    name: FLOAT damper
    description: XC/Trail air shock damper. 2-position lever with 3-position micro-adjust in Open mode.
    adjustments:
      - { name: Rebound, type: step, max: 12 }
      - { name: Compression Mode, type: categorical, options: [Open, Firm] }
    open_mode_micro_adjust: 3-position

  float_sl:
    name: FLOAT SL damper
    description: >
      Lightest XC race damper. 3-position lever (Open/Medium/Firm) with
      3-position micro-adjust in Open mode; remote variants available in
      2-position or 3-position handlebar remote.
    adjustments:
      - { name: Rebound, type: step, max: 12 }
      - { name: Compression Mode, type: categorical, options: [Open, Medium, Firm] }

  dhx_coil:
    name: DHX damper (coil)
    description: Coil-sprung trail/enduro damper. Tool-free adjusters, 2-position Firm switch.
    adjustments:
      - { name: Compression, type: step, max: 11, notes: Low-Speed Compression }
      - { name: Rebound, type: step, max: 16, notes: Low-Speed Rebound }
      - { name: Compression Mode, type: categorical, options: [Open, Firm] }

# --------------------------------------------------------------------------
# Shocks — current (2025/2026) FOX lineup.
# Shocks are sold by eye-to-eye/stroke length to match a given frame, not by a
# fixed "travel" like forks — `stroke_mm` lists commonly offered strokes
# rather than an exhaustive per-frame spec.
#
# The model-level `spring:` decides the spring adjustment: air shocks share the
# `&air_spring` anchor (Pressure), coil shocks list a Spring Rate. Volume-spacer
# counts are not published per model, so no Volume Spacers adjustment is
# generated — see follow-ups.
# --------------------------------------------------------------------------
shocks:
  - model: "FLOAT SL"
    category: XC
    spring: Air
    year_range: "2025-2026"
    url: https://ridefox.com/pages/fox-float-sl
    trims:
      - trim: Factory
        stanchion: Kashima
        dampers: [float_sl]
        adjustments: &air_spring
          - { name: Pressure, type: numerical, unit: psi, min: 0 }
      - trim: Performance
        stanchion: 7000-series alloy, black anodized
        dampers: [float_sl]
        adjustments: *air_spring

  - model: "FLOAT"
    category: XC / Trail
    spring: Air
    year_range: "2025-2026"
    url: https://ridefox.com/pages/fox-float
    trims:
      - trim: Factory
        stanchion: Kashima
        dampers: [float]
        adjustments: *air_spring
      - trim: Performance Elite
        stanchion: 7000-series alloy, black anodized
        dampers: [float]
        adjustments: *air_spring
      - trim: Performance
        stanchion: 7000-series alloy, black anodized
        dampers: [float]
        adjustments: *air_spring
      - trim: Rhythm
        stanchion: 6000-series alloy, black anodized
        dampers: [float]
        adjustments: *air_spring
        note: OEM complete bikes only

  - model: "FLOAT X"
    category: All-Mountain
    spring: Air
    year_range: "2025-2026"
    url: https://ridefox.com/pages/fox-float-x
    trims:
      - trim: Factory
        stanchion: Kashima
        dampers: [float_x]
        adjustments: *air_spring
      - trim: Performance Elite
        stanchion: 7000-series alloy, black anodized
        dampers: [float_x]
        adjustments: *air_spring
      - trim: Performance
        stanchion: 7000-series alloy, black anodized
        dampers: [float_x]
        adjustments: *air_spring
        note: simplified/fixed LSC on some builds; LSR remains 16 clicks

  - model: "FLOAT X2"
    category: Enduro / Gravity
    spring: Air
    year_range: "2025-2026"
    url: https://ridefox.com/pages/fox-float-x2
    trims:
      - trim: Factory
        stanchion: Kashima
        dampers: [vvc2]
        adjustments: *air_spring
      - trim: Performance Elite
        stanchion: 7000-series alloy, black anodized
        dampers: [vvc2]
        adjustments: *air_spring
      - trim: Performance
        stanchion: 7000-series alloy, black anodized
        dampers: [vvc2]
        adjustments: *air_spring
        note: OEM complete bikes only; simplified external adjustments

  - model: "DHX"
    category: Trail / Enduro
    spring: Coil
    year_range: "2025-2026"
    url: https://ridefox.com/products/fox-dhx-factory
    trims:
      - trim: Factory
        stanchion: Kashima
        dampers: [dhx_coil]
        mount: [Metric, Metric Trunnion]
        stroke_mm: [55, 60, 62.5, 65]
        adjustments: &coil_spring
          - { name: Spring Rate, type: numerical, unit: lbs/in, min: 0 }
        note: "Coil spring sold separately. Common sizes: 210x55, 230x60, 230x65, 185x55, 205x60, 205x62.5"

  - model: "DHX2"
    category: Downhill / Enduro
    spring: Coil
    year_range: "2025-2026"
    url: https://ridefox.com/pages/fox-dhx2
    trims:
      - trim: Factory
        stanchion: Kashima
        dampers: [vvc2]
        adjustments: *coil_spring
      - trim: Performance Elite
        stanchion: 7000-series alloy, black anodized
        dampers: [vvc2]
        adjustments: *coil_spring
      - trim: Performance
        stanchion: 7000-series alloy, black anodized
        dampers: [vvc2]
        adjustments: *coil_spring
        note: OEM complete bikes only; simplified external adjustments

# --------------------------------------------------------------------------
