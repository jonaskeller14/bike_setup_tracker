# FOX mountain-bike shocks — adjustment preset database
#
# Same design as fork/fox.yaml: click ranges belong to the DAMPER, defined once
# under `option_values.damper` and referenced by id from each shock's trims. See SCHEMA.md.

brand: FOX
component_type: shock
sources:
  - https://ridefox.com/pages/bike-shocks
  - https://ridefox.com/pages/fox-float-x2
  - https://ridefox.com/pages/fox-dhx2
  - https://ridefox.com/pages/fox-float-x
  - https://ridefox.com/pages/fox-float
  - https://ridefox.com/pages/fox-float-sl
  - https://ridefox.com/products/fox-dhx-factory
  # Archived spec sheets + owner's manuals (tech.ridefox.com) — the source for
  # the open-mode adjust positions and every legacy damper below.
  # Shock sizes: per-variant listings (eye-to-eye x stroke, Metric / Metric Trunnion /
  # Imperial) on the ridefox.com shop collection pages below.
  - https://ridefox.com/collections/fox-float-sl
  - https://ridefox.com/collections/fox-float
  - https://ridefox.com/collections/fox-float-x
  - https://ridefox.com/collections/fox-float-x2
  - https://ridefox.com/collections/fox-dhx2
  - https://ridefox.com/collections/shocks
  - https://tech.ridefox.com/bike/list/spec-sheets
  - https://tech.ridefox.com/bike/list/owners-manuals
  - https://tech.ridefox.com/bike/owners-manuals/3099/shock--2026-float
  - https://tech.ridefox.com/bike/owners-manuals/3098/shock--2026-float-sl-and-float-x
  - https://tech.ridefox.com/bike/owners-manuals/3023/shock--2026-float-x2
  - https://tech.ridefox.com/bike/owners-manuals/3090/shock--2026-dhx2
  - https://tech.ridefox.com/bike/owners-manuals/3100/shock--2026-dhx-
  - https://tech.ridefox.com/bike/owners-manuals/1079/shock--2021-float-dps-and-dpx2
  - https://tech.ridefox.com/bike/owners-manuals/1036/shock--2020-float-x2
  - https://tech.ridefox.com/bike/owners-manuals/1078/shock--2021-float-x2
  - https://tech.ridefox.com/bike/owners-manuals/1038/shock--2020-all-coil-shocks-(dhx2-and-van-models)
updated: 2026-10-05
# Click ranges taken from the per-model spec tables on the official FOX
# product pages (ridefox.com/pages/fox-<model>). Clicks counted from fully
# closed (firmest) → default `dial_ccw`; an adjuster with "16 clicks" is 0..16.
#
# The FOX owner's manuals never state a total click range for a shock adjuster —
# they publish a pressure-vs-clicks starting-point table, which is a
# recommendation and must not be read as a range. So the legacy dampers below
# give a range only for what FOX describes in words (lever positions, open-mode
# detents) and declare every other adjuster with `max: ~`.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    vvc2:
      name: VVC2 (4-Way Adjust)
      description: |-
        - Gravity damper shared by FLOAT X2 and DHX2
        - Variable Valve Control on both high-speed circuits
        - Factory and Performance Elite add a 2-position Firm Mode lever
      adjustments:
        - { name: HSC, type: step, max: 8, notes: High-Speed Compression, dialColor: blue }
        - { name: LSC, type: step, max: 16, notes: Low-Speed Compression, dialColor: blue, dialSize: small }
        - { name: HSR, type: step, max: 8, notes: High-Speed Rebound, dialColor: red }
        - { name: LSR, type: step, max: 16, notes: Low-Speed Rebound, dialColor: red, dialSize: small }
      firm_mode: optional 2-position independent lever
      source:
        - https://ridefox.com/pages/fox-float-x2
        - https://ridefox.com/pages/fox-dhx2

    float_x:
      name: FLOAT X damper
      description: All-mountain air shock damper. Tool-free 2-position lever (Open/Firm).
      adjustments:
        - { name: Compression, type: step, max: 11, notes: Low-Speed Compression, dialColor: blue }
        - { name: Rebound, type: step, max: 16, notes: Low-Speed Rebound, dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Firm] }
      source: https://ridefox.com/pages/fox-float-x

    float:
      name: FLOAT damper
      description: XC/Trail air shock damper. 2-position lever (Open/Firm) plus a 3-position open-mode adjust (1 plush, 3 firm).
      adjustments:
        - { name: Rebound, type: step, max: 12, dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Firm] }
        - { name: Open Mode Adjust, type: categorical, options: ["1", "2", "3"], notes: "Low-Speed Compression in Open mode; 1 is plushest, 3 firmest" }
      open_mode_micro_adjust: 3-position
      source:
        - https://ridefox.com/pages/fox-float
        - https://tech.ridefox.com/bike/owners-manuals/3099/shock--2026-float

    float_sl:
      name: FLOAT SL damper
      description: |-
        - Lightest XC race damper
        - 3-position lever (Open/Medium/Firm) plus a 3-position open-mode adjust
        - 2-position and 3-position handlebar remotes available
      adjustments:
        - { name: Rebound, type: step, max: 12, dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Medium, Firm] }
        - { name: Open Mode Adjust, type: categorical, options: ["1", "2", "3"], notes: "Low-Speed Compression in Open mode; 1 is plushest, 3 firmest" }
      source:
        - https://ridefox.com/pages/fox-float-sl
        - https://tech.ridefox.com/bike/owners-manuals/3098/shock--2026-float-sl-and-float-x

    dhx_coil:
      name: DHX damper (coil)
      description: Coil-sprung trail/enduro damper. Tool-free adjusters, 2-position Firm switch.
      adjustments:
        - { name: Compression, type: step, max: 11, notes: Low-Speed Compression, dialColor: blue }
        - { name: Rebound, type: step, max: 16, notes: Low-Speed Rebound, dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Firm] }
      source: https://ridefox.com/products/fox-dhx-factory

    # ------------------------------------------------------------------------
    # Legacy dampers — one id per cartridge generation, never reusing a current
    # id. Click totals are absent from FOX's material for all of these, so the
    # adjusters FOX describes are declared with `max: ~`.
    # ------------------------------------------------------------------------
    x2_2016:
      name: X2 4-Way (2016-2020)
      description: |-
        - Four-way gravity damper shared by FLOAT X2 and DHX2 of these years
        - Hex-key adjusters: 6mm for the high-speed circuits, 3mm for the low-speed
      adjustments:
        - { name: HSC, type: step, max: ~, notes: High-Speed Compression, dialColor: blue }
        - { name: LSC, type: step, max: ~, notes: Low-Speed Compression, dialColor: blue, dialSize: small }
        - { name: HSR, type: step, max: ~, notes: High-Speed Rebound, dialColor: red }
        - { name: LSR, type: step, max: ~, notes: Low-Speed Rebound, dialColor: red, dialSize: small }
      source:
        - https://tech.ridefox.com/bike/owners-manuals/1036/shock--2020-float-x2
        - https://tech.ridefox.com/bike/owners-manuals/1038/shock--2020-all-coil-shocks-(dhx2-and-van-models)
      note: >-
        The 2020 manuals describe each adjuster and its hex size but publish only
        a pressure-vs-clicks starting-point table, so no total range is recorded.

    x2_vvc_2021:
      name: X2 VVC 4-Way (2021-2024)
      description: |-
        - Four-way gravity damper with Variable Valve Control high-speed circuits
        - Shared by FLOAT X2 and DHX2 of these years
      adjustments:
        - { name: HSC, type: step, max: ~, notes: High-Speed Compression, dialColor: blue }
        - { name: LSC, type: step, max: ~, notes: Low-Speed Compression, dialColor: blue, dialSize: small }
        - { name: HSR, type: step, max: ~, notes: High-Speed Rebound, dialColor: red }
        - { name: LSR, type: step, max: ~, notes: Low-Speed Rebound, dialColor: red, dialSize: small }
      source: https://tech.ridefox.com/bike/owners-manuals/1078/shock--2021-float-x2
      note: Same gap as x2_2016 — starting-point tables only, no stated click range.

    x2_2016_ls:
      name: X2 Low-Speed (2016-2020)
      description: Performance Elite version of the X2 damper. Low-speed compression and rebound only, no high-speed adjusters.
      adjustments:
        - { name: Compression, type: step, max: ~, notes: Low-Speed Compression, dialColor: blue }
        - { name: Rebound, type: step, max: ~, notes: Low-Speed Rebound, dialColor: red }
      source: https://tech.ridefox.com/bike/owners-manuals/1036/shock--2020-float-x2
      note: The 2020 FLOAT X2 manual reserves the high-speed adjusters for the Factory Series.

    dps_2016:
      name: DPS (2016-2023)
      description: |-
        - Dual Piston System trail damper with an EVOL negative air sleeve
        - 3-position lever (Open/Medium/Firm) plus a 3-position open-mode adjust
      adjustments:
        - { name: Rebound, type: step, max: ~, dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Medium, Firm] }
        - { name: Open Mode Adjust, type: categorical, options: ["1", "2", "3"], notes: "Low-Speed Compression in Open mode; Factory and Performance Elite non-remote shocks only" }
      source: https://tech.ridefox.com/bike/owners-manuals/1079/shock--2021-float-dps-and-dpx2
      note: Open-mode adjust described as "3 additional fine tuning adjustments"; rebound total never stated.

    dpx2_2018:
      name: DPX2 (2018-2021)
      description: |-
        - Larger-bodied trail/enduro version of the DPS damper
        - 3-position lever (Open/Medium/Firm) plus a Comp Adj knob for overall compression
      adjustments:
        - { name: Compression, type: step, max: ~, notes: Comp Adj knob, dialColor: blue }
        - { name: Rebound, type: step, max: ~, dialColor: red }
        - { name: Compression Mode, type: categorical, options: [Open, Medium, Firm] }
      source: https://tech.ridefox.com/bike/owners-manuals/1079/shock--2021-float-dps-and-dpx2
      note: Neither the Comp Adj knob's detent count nor the rebound total is stated in the 2018-2021 manuals.

# --------------------------------------------------------------------------
# Shocks — current (2025/2026) FOX lineup, then legacy generations.
# Shocks are sold by eye-to-eye/stroke length to match a given frame, not by a
# fixed "travel" like forks — `options.size` lists commonly offered strokes
# rather than an exhaustive per-frame spec.
#
# The model-level `specs.spring` names the spring type: air shocks share the
# `&air_spring` anchor (Pressure), coil shocks list a Spring Rate. FOX ships
# rear-shock volume spacers as tuning kits rather than a per-model maximum
# table, so no Volume Spacers adjustment is generated — see follow-ups.
# --------------------------------------------------------------------------
nodes:
  - label: "FLOAT SL"
    level: model
    category: XC
    years: "2025-2026"
    url: https://ridefox.com/pages/fox-float-sl
    setup_guide: https://tech.ridefox.com/bike/owners-manuals/3098/shock--2026-float-sl-and-float-x
    specs: { spring: Air }
    children:
      - label: Factory
        level: trim
        specs: { stanchion: Kashima }
        adjustments: &air_spring
          - { name: Pressure, type: numerical, unit: psi, min: 0 }
        options:
          damper: [float_sl]
          size:
            - { size: "190x40/42.5/45", mount: Standard }
            - { size: "210x55", mount: Standard }
            - { size: "165x40/42.5/45", mount: Trunnion }
      - label: Performance
        level: trim
        specs: { stanchion: "7000-series alloy, black anodized" }
        adjustments: *air_spring
        options:
