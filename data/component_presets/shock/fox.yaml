# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - Click totals. FOX's shock owner's manuals never state a total range.
#     x2_2019, x2_2019_ls, x2_vvc_2021, x2_vvc_2021_ls and dps_2018 use the
#     highest value of the manual's starting-point table (estimates, flagged
#     in the adjustment notes). Still `max: ~`: the FLOAT DPX2 rebound and Comp
#     Adj knob (dpx2_2018; the 2018-2021 manuals only tabulate FLOAT DPS). A
#     FOX service manual or a staff-written bench test stating the totals would
#     replace the estimates.
#   - Volume spacers. FLOAT, FLOAT SL, FLOAT X and FLOAT DPS/DPX2 are tuned
#     with volume-graded spacer kits (compression-ratio tables keyed to size
#     and eyelet), and the 2026-2027 FLOAT X2 uses 1 cc and 2 cc spacers
#     limited by ribs inside the sleeve, so FOX publishes no maximum spacer
#     count for them. The FLOAT X2 2019-2020 and 2021-2025 counts are
#     recorded. Coil shocks have none.
#   - Live Valve Neo variants (FLOAT X Live Valve Neo, FLOAT X2 Live Valve
#     Neo, DHX Live Valve Neo) are electronically controlled — no manual
#     click-based adjustment model. Would need modes/profiles (categorical
#     entries) instead of click counts if added.
#   - Shock sizes come from the per-variant listings on the ridefox.com shop
#     (currently sold trims, "Metric" read as the Standard mount) and, for the
#     FLOAT X2 2019-2020 and 2021-2025, from the owner's manuals' spacer
#     tables (mount not stated there for 2019-2020, hence `mounts`). Not
#     listed, so left without `size`: FLOAT Performance Elite and Rhythm,
#     FLOAT X Performance, FLOAT X2 Performance (2026-2027), DHX2 Performance
#     Elite and Performance (2026-2027), both DHX2 2019-2020 trims and the
#     DHX2 2021-2025 Performance Elite (the coil manuals give strokes only),
#     FLOAT DPS Performance Elite and FLOAT DPX2 (all trims). The
#     tech.ridefox.com spec sheets are images only. Imperial sizes carry no
#     stated mount. The 2021-2025 DHX2 Factory and the DPS sizes come from the
#     MY24 / current shop listings; older frame-specific sizes may exist.
#   - FLOAT X "Performance": whether that trim keeps the 11-click low-speed
#     compression dial or ships with a fixed setting is still unresolved, so its
#     trim note was removed rather than left as an unverified claim.
#   - Setup guides: the DHX2 2019-2025 damper tables are picked by shock
#     stroke × rear-wheel travel (tables A/B/C), a bike-level input the
#     catalog lacks (#71), so those guides carry SAG only. The FLOAT X2
#     2026-2027 and DHX2 2026-2027 manuals reserve HSR/HSC for the Factory
#     trim; their rules say so with `when: { trim: factory }` until the
#     damper is split.
#   - FLOAT X2 and DHX2 2016-2018: the 2016-2017 manuals carry an older
#     starting-point table (and a 2-position damper option in 2017), the 2018
#     manual lists volume spacers by stroke and tops out at 250 psi; the
#     2019-2020 generation therefore starts in 2019. The 2018 table's numbers
#     equal the 2019-2020 one up to 250 psi.
#   - FLOAT DPS 2016-2017 (a "FLOAT DPS / FLOAT X" manual with iRD and other
#     damper options) is not covered; FLOAT DPS starts in 2018. FLOAT SL is the
#     2024 successor of the DPS name, FLOAT X dates from the 2022 manual.
#   - Model-year coverage was checked against every FOX shock manual from 2016
#     to 2027 (tech.ridefox.com/bike/list/owners-manuals), comparing text and
#     the table images byte for byte: FLOAT, FLOAT SL and FLOAT X are
#     identical from 2024 (FLOAT X from 2022) to 2027, the coil shocks from
#     2022 to 2025 and again from 2026 to 2027.
#   - Pre-2016 CTD-era shocks (FLOAT CTD, FLOAT X CTD, DHX RC4, VAN R/RC) are
#     not covered: the 2014-2015 archived material is spec drawings plus
#     manuals with no click ranges.
