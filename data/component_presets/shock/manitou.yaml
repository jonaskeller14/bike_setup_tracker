    ipa_pro_g2:
      name: IPA (4-position)
      description: |-
        - Four-position Incremental Platform Adjust compression lever, from an open descending setting to a firm climbing platform
        - Rebound knob with 17 detented clicks
      description_de: |-
        - Vierstufiger Incremental-Platform-Adjust-Druckstufenhebel, von einer offenen Abfahrtseinstellung bis zu einer festen Klettergrundlage (Plattform)
        - Zugstufenknopf mit 17 Klicks
      description_fr: |-
        - Levier de compression Incremental Platform Adjust à quatre positions, d’un réglage ouvert pour la descente à une plateforme de montée ferme
        - Molette de détente à 17 clics crantés
      description_it: |-
        - Leva di compressione Incremental Platform Adjust a quattro posizioni, da un’impostazione aperta per la discesa a una piattaforma rigida per la salita
        - Manopola del ritorno con 17 scatti
      description_es: |-
        - Palanca de compresión Incremental Platform Adjust de cuatro posiciones, desde un ajuste abierto para bajar hasta una plataforma firme para subir
        - Rueda de rebote con 17 clics
      description_pt: |-
        - Alavanca de compressão Incremental Platform Adjust de quatro posições, de um ajuste aberto para descer a uma plataforma firme para subir
        - Seletor de retorno com 17 cliques
      adjustments:
        - { name: IPA Compression, name_de: IPA-Druckstufe, name_fr: Compression IPA, name_it: Compressione IPA, name_es: Compresión IPA, name_pt: Compressão IPA, type: categorical, options: [Aggressive Descend, Trail Control, Technical Climb, Aggressive Climb], options_de: [Aggressive Abfahrt, Trail Control, Technischer Anstieg, Aggressiver Anstieg], options_fr: [Descente agressive, Trail Control, Montée technique, Montée agressive], options_it: [Discesa aggressiva, Trail Control, Salita tecnica, Salita aggressiva], options_es: [Bajada agresiva, Trail Control, Subida técnica, Subida agresiva], options_pt: [Descida agressiva, Trail Control, Subida técnica, Subida agressiva] }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 17, notes: "Clockwise adds rebound damping", notes_de: Im Uhrzeigersinn erhöht die Zugstufendämpfung, notes_fr: Le sens horaire ajoute de l’amortissement de détente, notes_it: Il senso orario aumenta lo smorzamento del ritorno, notes_es: El sentido horario añade amortiguación de rebote, notes_pt: O sentido horário aumenta o amortecimento do retorno }
