# --------------------------------------------------------------------------
# Setup guides — the Hayes set-up guides' starting points as data (SCHEMA.md,
# "Setup guides"), transcribed from docs/research/setup_guides/manitou.md.
# No Mara guide prints a rider weight → pressure chart: the damper settings
# are constants for a 170 lb rider, in the catalog dampers' own directions
# (HSC from open, LSC and rebound from closed). The IPA lever positions are
# described by terrain only and get no rule.
# --------------------------------------------------------------------------
guides:
  # Compression by tune (two-way, not encoded): Aggressive HSC 3 / LSC 10,
  # Compliant HSC 1 / LSC 15.
  manitou_mara_pb_2024:
