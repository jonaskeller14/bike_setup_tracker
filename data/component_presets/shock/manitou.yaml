      adjustments:
        - { name: Platform Mode, name_de: Platform-Modus, name_fr: Mode Platform, name_it: Modalità Platform, name_es: Modo Platform, name_pt: Modo Platform, type: categorical, options: [Party, Work], options_de: [Party, Work], options_fr: [Party, Work], options_it: [Party, Work], options_es: [Party, Work], options_pt: [Party, Work], notes: "Party = adjustable circuit open; Work = separate preset climbing platform, compression adjusters deactivated", notes_de: "Party = einstellbarer Kreis offen; Work = separate voreingestellte Klettergrundlage, Druckstufenversteller deaktiviert", notes_fr: "Party = circuit réglable ouvert ; Work = plateforme de montée préréglée à part, réglages de compression désactivés", notes_it: "Party = circuito regolabile aperto; Work = piattaforma di salita preimpostata a parte, regolatori di compressione disattivati", notes_es: "Party = circuito ajustable abierto; Work = plataforma de subida preajustada aparte, ajustes de compresión desactivados", notes_pt: "Party = circuito ajustável aberto; Work = plataforma de subida pré-ajustada à parte, ajustes de compressão desativados" }
