      description: |-
        - Four-position Incremental Platform Adjust compression lever, from an open descending setting to a firm climbing platform
        - Simplified rebound knob with a smooth, non-detented 360 degrees of adjustment
      description_de: |-
        - Vierstufiger Incremental-Platform-Adjust-Druckstufenhebel, von einer offenen Abfahrtseinstellung bis zu einer festen Klettergrundlage (Plattform)
        - Vereinfachter Zugstufenknopf mit stufenlosen, rastenlosen 360 Grad Verstellbereich
      description_fr: |-
