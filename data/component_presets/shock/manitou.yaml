        - https://hayesbicycle.com/products/mara-pro-inline
      note: Mara Pro Inline Gen 2 set-up guide (2024) — "17 clicks available"; product page lists a 4-position IPA and rebound with detents.

    ipa_xc_g2:
      name: IPA XC (3-position)
      description: |-
        - Three-position compression lever on an XC-specific shim stack: plush open mode with a very firm lockout
        - Remote-compatible knobs
        - Rebound knob with 17 detented clicks
      description_de: |-
        - Drei-Positionen-Druckstufenhebel auf einem XC-spezifischen Shimstack: komfortabler offener Modus mit sehr festem Lockout
        - Knöpfe mit Fernbedienungsunterstützung
        - Zugstufenknopf mit 17 Klicks
      description_fr: |-
        - Levier de compression à trois positions sur une pile de lamelles spécifique au XC : mode ouvert souple avec un lockout très ferme
        - Molettes compatibles avec une commande déportée
        - Molette de détente à 17 clics crantés
      description_it: |-
        - Leva di compressione a tre posizioni su un pacco lamelle specifico per l’XC: modalità aperta morbida con un lockout molto rigido
        - Manopole compatibili con il comando remoto
        - Manopola del ritorno con 17 scatti
      description_es: |-
        - Palanca de compresión de tres posiciones sobre una pila de láminas específica para XC: modo abierto blando con un lockout muy firme
        - Ruedas compatibles con mando remoto
        - Rueda de rebote con 17 clics
      description_pt: |-
        - Alavanca de compressão de três posições sobre uma pilha de lâminas específica para XC: modo aberto macio com um lockout bem firme
        - Seletores compatíveis com comando remoto
        - Seletor de retorno com 17 cliques
      adjustments:
