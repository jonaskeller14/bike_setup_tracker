# Manitou mountain-bike shocks — adjustment preset database
#
# Same design as fork/manitou.yaml: click ranges belong to the DAMPER, defined
# once under `option_values.damper` and referenced by id from each shock's trims. See
# SCHEMA.md in this folder.

brand: Manitou
component_type: shock
sources:
  # Primary — Manitou product pages. manitoumtb.com now redirects to
  # manitou.hayesbicycle.com (bot-challenged); the same product specifications
  # are published on the Hayes Bicycle store below.
  - https://hayesbicycle.com/collections/shocks
  - https://hayesbicycle.com/products/mara-pro-piggyback
  - https://hayesbicycle.com/products/mara-pro-piggyback-dh
  - https://hayesbicycle.com/products/mara-pro-inline
  - https://hayesbicycle.com/products/mara-pro-inline-xc
  - https://hayesbicycle.com/products/mara-comp
  # Primary — official Manitou / Hayes Performance Systems set-up guides (PDF)
  - https://hayesbicycle.zendesk.com/hc/en-us/articles/25871692546583-Mara-Pro-PB-Gen-2-Set-Up-Guide
  - https://hayesbicycle.zendesk.com/hc/article_attachments/28476110600727
  - https://hayesbicycle.zendesk.com/hc/en-us/articles/25871616811799-Mara-IL-Gen-2-Set-Up-Guide
  - https://hayesbicycle.zendesk.com/hc/article_attachments/25871616439319
  - https://hayesbicycle.zendesk.com/hc/article_attachments/25871600341655
  - https://hayesbicycle.zendesk.com/hc/article_attachments/25871643572375
  - https://hayesbicycle.zendesk.com/hc/en-us/articles/360047142633-Mara-Pro-PB-Gen-1-Set-up-Guide
  - https://hayesbicycle.zendesk.com/hc/article_attachments/360066638914
  # Tertiary — retailer listing, for volume ring kit only (no figure used)
  - https://shockcraft.co.nz/manitou/tuning-upgrade/king-cans
  # Secondary — editorial (article body text only)
  - https://www.pinkbike.com/news/first-look-manitous-180mm-mezzer-pro-fork-and-mara-pro-shock-garda-trentino-2019.html
  # Primary — service intervals
  - https://hayesbicycle.zendesk.com/hc/en-us/articles/4407665097879-Suspension-Maintenance-Schedule
updated: 2026-10-13
# Service intervals (`tasks`) come from the Manitou suspension maintenance
# schedule: air can every 50 hours, a full service (IFP damper) every 200
# hours or yearly.
#
# Counting conventions, from the Mara Pro PB Gen 2 set-up guide: low-speed
# compression and rebound are counted from fully CLOSED (counterclockwise), but
# because of the damper's design the high-speed compression clicks are counted
# from fully OPEN (clockwise) — hence `dial_cw` on HSC.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    mara_pb_g2:
      name: Mara Pro PB Gen 2
      description: |-
        - Externally adjustable high- and low-speed compression plus rebound
        - Work / Party lever swaps between a preset climbing platform and the fully adjustable descending circuit
      description_de: |-
        - Extern einstellbare High- und Low-Speed-Druckstufe sowie Zugstufe
        - Der Work-/Party-Hebel wechselt zwischen einer voreingestellten Klettergrundlage (Plattform) und dem voll einstellbaren Abfahrtskreis
      description_fr: |-
        - Compression haute et basse vitesse et détente réglables de l’extérieur
        - Le levier Work / Party bascule entre une plateforme de montée préréglée et le circuit de descente entièrement réglable
      description_it: |-
        - Compressione ad alta e bassa velocità e ritorno regolabili dall’esterno
        - La leva Work / Party passa da una piattaforma di salita preimpostata al circuito di discesa completamente regolabile
      description_es: |-
        - Compresión de alta y baja velocidad y rebote ajustables desde el exterior
        - La palanca Work / Party alterna entre una plataforma de subida preajustada y el circuito de bajada totalmente ajustable
      description_pt: |-
        - Compressão de alta e baixa velocidade e retorno ajustáveis externamente
        - A alavanca Work / Party alterna entre uma plataforma de subida pré-ajustada e o circuito de descida totalmente ajustável
      adjustments:
        - { name: Platform Mode, name_de: Platform-Modus, name_fr: Mode Platform, name_it: Modalità Platform, name_es: Modo Platform, name_pt: Modo Platform, type: categorical, options: [Party, Work], options_de: [Party, Work], options_fr: [Party, Work], options_it: [Party, Work], options_es: [Party, Work], options_pt: [Party, Work], notes: "Party = adjustable circuit open; Work = separate preset climbing platform, compression adjusters deactivated", notes_de: "Party = einstellbarer Kreis offen; Work = separate voreingestellte Klettergrundlage, Druckstufenversteller deaktiviert", notes_fr: "Party = circuit réglable ouvert ; Work = plateforme de montée préréglée à part, réglages de compression désactivés", notes_it: "Party = circuito regolabile aperto; Work = piattaforma di salita preimpostata a parte, regolatori di compressione disattivati", notes_es: "Party = circuito ajustable abierto; Work = plataforma de subida preajustada aparte, ajustes de compresión desactivados", notes_pt: "Party = circuito ajustável aberto; Work = plataforma de subida pré-ajustada à parte, ajustes de compressão desativados" }
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 6, visualization: dial_cw, notes: "High-Speed Compression; Counted from fully open (softest)", notes_de: High-Speed-Druckstufe; von ganz offen (am weichsten) gezählt, notes_fr: Compression haute vitesse ; comptée depuis la position entièrement ouverte (la plus souple), notes_it: Compressione ad alta velocità; contata a partire dalla posizione completamente aperta (la più morbida), notes_es: Compresión de alta velocidad; contada desde la posición totalmente abierta (la más blanda), notes_pt: Compressão de alta velocidade; contada a partir da posição totalmente aberta (a mais macia) }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 30, notes: "Low-Speed Compression; Counted from fully closed (firmest)", notes_de: Low-Speed-Druckstufe; von ganz geschlossen (am festesten) gezählt, notes_fr: Compression basse vitesse ; comptée depuis la position entièrement fermée (la plus ferme), notes_it: Compressione a bassa velocità; contata a partire dalla posizione completamente chiusa (la più rigida), notes_es: Compresión de baja velocidad; contada desde la posición totalmente cerrada (la más firme), notes_pt: Compressão de baixa velocidade; contada a partir da posição totalmente fechada (a mais firme) }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 12, notes: Counted from fully closed (slowest), notes_de: Von ganz geschlossen (am langsamsten) gezählt, notes_fr: Compté depuis la position entièrement fermée (la plus lente), notes_it: Contato a partire dalla posizione completamente chiusa (la più lenta), notes_es: Contado desde la posición totalmente cerrada (la más lenta), notes_pt: Contado a partir da posição totalmente fechada (a mais lenta) }
      source:
        - https://hayesbicycle.zendesk.com/hc/article_attachments/28476110600727
      note: >-
        Mara Pro PB Gen 2 set-up guide (2024) — rebound "12-0", high-speed (outer)
        "0-6", low-speed (inner) "30-0"; the guide states LSC and rebound are counted
        from closed and HSC from open.

    mara_pb_dh_g2:
      name: Mara Pro PB DH Gen 2
      description: |-
        - Same damper as the Mara Pro PB without the Work / Party lever, so the platform can't be engaged by accident
        - Externally adjustable high- and low-speed compression plus rebound
      description_de: |-
        - Derselbe Dämpfer wie der Mara Pro PB, jedoch ohne Work-/Party-Hebel, sodass die Plattform nicht versehentlich aktiviert werden kann
        - Extern einstellbare High- und Low-Speed-Druckstufe sowie Zugstufe
      description_fr: |-
        - Même amortisseur que le Mara Pro PB sans le levier Work / Party, la plateforme ne peut donc pas s’enclencher par accident
        - Compression haute et basse vitesse et détente réglables de l’extérieur
      description_it: |-
        - Stesso ammortizzatore del Mara Pro PB senza la leva Work / Party, quindi la piattaforma non può essere inserita per errore
        - Compressione ad alta e bassa velocità e ritorno regolabili dall’esterno
      description_es: |-
        - Mismo amortiguador que el Mara Pro PB sin la palanca Work / Party, de modo que la plataforma no se puede activar por accidente
        - Compresión de alta y baja velocidad y rebote ajustables desde el exterior
      description_pt: |-
        - Mesmo amortecedor do Mara Pro PB sem a alavanca Work / Party, então a plataforma não pode ser acionada por acidente
        - Compressão de alta e baixa velocidade e retorno ajustáveis externamente
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: step, max: 6, visualization: dial_cw, notes: "High-Speed Compression; Counted from fully open (softest)", notes_de: High-Speed-Druckstufe; von ganz offen (am weichsten) gezählt, notes_fr: Compression haute vitesse ; comptée depuis la position entièrement ouverte (la plus souple), notes_it: Compressione ad alta velocità; contata a partire dalla posizione completamente aperta (la più morbida), notes_es: Compresión de alta velocidad; contada desde la posición totalmente abierta (la más blanda), notes_pt: Compressão de alta velocidade; contada a partir da posição totalmente aberta (a mais macia) }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 30, notes: "Low-Speed Compression; Counted from fully closed (firmest)", notes_de: Low-Speed-Druckstufe; von ganz geschlossen (am festesten) gezählt, notes_fr: Compression basse vitesse ; comptée depuis la position entièrement fermée (la plus ferme), notes_it: Compressione a bassa velocità; contata a partire dalla posizione completamente chiusa (la più rigida), notes_es: Compresión de baja velocidad; contada desde la posición totalmente cerrada (la más firme), notes_pt: Compressão de baixa velocidade; contada a partir da posição totalmente fechada (a mais firme) }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 12, notes: Counted from fully closed (slowest), notes_de: Von ganz geschlossen (am langsamsten) gezählt, notes_fr: Compté depuis la position entièrement fermée (la plus lente), notes_it: Contato a partire dalla posizione completamente chiusa (la più lenta), notes_es: Contado desde la posición totalmente cerrada (la más lenta), notes_pt: Contado a partir da posição totalmente fechada (a mais lenta) }
      source:
        - https://hayesbicycle.zendesk.com/hc/article_attachments/28476110600727
        - https://hayesbicycle.com/products/mara-pro-piggyback-dh
      note: >-
        The Mara Pro PB Gen 2 guide covers the DH shock ("Platform not included on
        Mara Pro PB DH") with the same ranges: rebound "12-0", HSC "0-6", LSC "30-0".

