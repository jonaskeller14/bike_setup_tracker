      description_pt: |-
        - Alavanca de compressão Incremental Platform Adjust de quatro posições, de um ajuste aberto para descer a uma plataforma firme para subir
        - Seletor de retorno simplificado com 360 graus de ajuste contínuo, sem cliques
      adjustments:
