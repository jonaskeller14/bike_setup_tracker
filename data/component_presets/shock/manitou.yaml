# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - manitoumtb.com redirects to manitou.hayesbicycle.com, which sits behind a
#     bot challenge; product specs were read from the identical listings on
#     hayesbicycle.com and click counts from the set-up guide PDFs hosted on the
#     Hayes Performance Systems help center.
#   - Year ranges are derived from the Hayes Gen 2 listing dates (Jun 2024) and
#     Pinkbike's May 2019 Mara Pro launch coverage. The Gen 1 end year (2023) is
#     not confirmed by a Manitou source, and Gen 1 stroke lengths were not
#     collected.
#   - Air-volume spacer ("volume ring") maximums for the King Can / Lite Can are
#     published nowhere by Manitou: the Gen 2 set-up guides only say "1 volume
#     ring" steps, and a retailer lists a 5-ring kit at 1.15cc each with no
#     per-side maximum. No Volume Spacers adjustment is offered.
#   - Gen 2 `size` values came from the Hayes variant lists (Eyelet is written
#     as Standard). Hayes' own text says the grid runs 45-65mm for the Pro
#     Piggyback and 45-75mm in total; the 70/72.5/75 strokes are the DH only.
#     The 250x70 variant of the DH shows a conflicting "255x70" image label;
#     the variant name (250x70) is used.
#   - Not covered: the earlier Mara IL (Gen 1, 4-position IPA, listing "Mara")
#     and the discontinued McLeod — the McLeod tuning guide gives the four IPA
#     positions but no rebound click count.
#   - Mara Pro Piggyback Gen 1 (2019-2023) `size`: no Manitou page lists the sizes
#     (the Gen 1 set-up guide is a settings table only and the Pinkbike launch
#     article is bot-blocked; only retailer listings state them), so none declared.
#   - Dial colors: no set-up guide or product page states a knob colour in text, so
#     all dials use the default blue / normal.
#   - Setup guides link the PDF attachments (the help-center articles themselves
#     are bot-blocked).
# --------------------------------------------------------------------------
