# Marzocchi mountain-bike shocks — adjustment preset database
#
# Marzocchi currently sells exactly two rear shocks: the air-sprung Bomber
# Air and the coil-sprung Bomber CR. See SCHEMA.md in this folder for the
# sparse `adjustments:` format and field defaults.

brand: Marzocchi
component_type: shock
sources:
  - https://bike.marzocchi.com/collections/shocks
  - https://bike.marzocchi.com/products/bomber-air
  - https://bike.marzocchi.com/products/bomber-cr-rear-shock
  - https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-269_REV_A%202022%20Marzocchi%20Bomber%20Air%20Shock%20Owners%20Guide%20Rev%20A_FINAL.pdf
  - https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-205_Marzocchi-BomberCR-Tuning-Guide-white-RevA.pdf
  - https://flowmountainbike.com/tests/marzocchi-bomber-air-shock-review/
  - https://nsmb.com/articles/marzocchi-bomber-cr-coil-shock-review/
  - https://www.mtb-mag.com/en/tested-marzocchi-bomber-cr/
  # Primary — service intervals
  - https://tech.ridefox.com/img/help/page2840-6BL4/inline/605-00-201_RevA%202019%20Marzocchi%20Rear%20Shock%20User%20Manual.pdf
updated: 2026-10-10
# Service intervals (`tasks`) come from the Marzocchi rear shock owner's
# guides: a full service every 125 hours or yearly. No separate air-can
# interval is published.
#
# Click counts (where known) come from the official owner's/tuning guide
# PDFs on tech.ridefox.com, not the marketing product pages. Clicks counted
# from fully closed (firmest) → default `dial_ccw` visualization.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    bomber_air:
      name: Bomber Air
      description: >
        Air shock with a 10-click rebound dial and a tool-free low-speed
        compression sweep between Open and Firm.
      adjustments:
        - { name: Compression Mode, type: categorical, options: [Open, Firm], notes: "Low-Speed Compression; non-indexed sweep, clockwise is firmer" }
        - { name: Rebound, type: step, max: 10, notes: Counted from fully closed (slowest), dialColor: red }
      source:
        - https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-269_REV_A%202022%20Marzocchi%20Bomber%20Air%20Shock%20Owners%20Guide%20Rev%20A_FINAL.pdf
        - https://flowmountainbike.com/tests/marzocchi-bomber-air-shock-review/
        - https://bike.marzocchi.com/products/bomber-air
      note: >-
        Flow Mountain Bike review (Nov 2022): "There are 10 clicks of adjustment
        for low-speed rebound damping"; the compression dial "uses a non-indexed
        sweep between 'Soft' and 'Firm'" (product page: "2-position, non-indexed
        compression sweep adjust"). The 2022 Bomber Air Shock Owner's Guide
        rebound table (counted counter-clockwise from fully closed) tops out at
        10, consistent with the review.

    bomber_cr:
      name: Bomber CR
      description: >
        Coil shock with indexed low-speed compression and rebound adjusters and
        adjustable spring preload.
      missing_adjustments: [Preload]
      adjustments:
        - { name: Compression, type: step, max: 16, notes: "Low-Speed Compression; clockwise is firmer" }
        - { name: Rebound, type: step, max: 16, notes: "Clockwise is slower; some units may have 15 clicks, check your dial and edit the maximum if it differs" }
      source:
        - https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-205_Marzocchi-BomberCR-Tuning-Guide-white-RevA.pdf
        - https://www.mtb-mag.com/en/tested-marzocchi-bomber-cr/
        - https://nsmb.com/articles/marzocchi-bomber-cr-coil-shock-review/
      note: >-
        The tuning guide (605-00-205) gives only directions (clockwise
        increases damping), no click counts. Counts are from magazine reviews
        (tier 2): MTB-Mag says "16 crisp, clear detents" for low-speed
        compression and "a similar 15 clicks" for rebound; NSMB (Jan 2019) says
        "16 noticeable clicks" on each dial. The two disagree on rebound
        (15 vs 16); the higher count is used so no valid setting is excluded.
        The counting origin is not stated; counted from fully closed
        (clockwise to the stop) as for the brand's other dampers. Preload: turn
        counter-clockwise to increase sag, never more than two full turns
        clockwise (no click count).

# --------------------------------------------------------------------------
# Shocks — current Marzocchi lineup. Sold by eye-to-eye x stroke to match a
# frame, not a fixed "travel"; `options.size` lists the sizes published per
# mount type on each product page. Imperial sizes are stored in mm and keep
# Marzocchi's inch figures as their label.
# --------------------------------------------------------------------------
nodes:
  - label: "Bomber Air"
    level: model
    category: Trail / Enduro
    years: "2025-2026"
    url: https://bike.marzocchi.com/products/bomber-air
    setup_guide: https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-269_REV_A%202022%20Marzocchi%20Bomber%20Air%20Shock%20Owners%20Guide%20Rev%20A_FINAL.pdf
    specs: { spring: Air }
    tasks: &marzocchi_service
      shock:full_service: { interval: { moving_time_h: 125 }, fallback: { days: 365 }, source: Marzocchi owner's guide }
    children:
      - label: Metric
        level: trim
        specs: { mount: Metric (compatible with FOX bearing mounts) }
        adjustments: &air_spring
          - { name: Pressure, type: numerical, unit: psi, min: 0, max: 350 }
        options:
          damper: [bomber_air]
          size: ["190x45", "210x50", "210x52.5", "210x55", "230x57.5", "230x60", "230x65", "250x75"]
        note: >
          Max air pressure 350psi. Adjustable volume spacers in 0.1 in³
          increments.
      - label: Trunnion
        level: trim
        specs: { mount: Trunnion }
        adjustments: *air_spring
        options:
          damper: [bomber_air]
          size: ["185x52.5", "185x55", "205x60", "205x62.5", "225x75"]

  - label: "Bomber CR"
    level: model
    category: Enduro / Downhill
    years: "2025-2026"
    url: https://bike.marzocchi.com/products/bomber-cr-rear-shock
    setup_guide: https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-205_Marzocchi-BomberCR-Tuning-Guide-white-RevA.pdf
    specs: { spring: Coil }
    tasks: *marzocchi_service
    children:
      - label: Standard
        level: trim
        specs: { mount: Standard eyelet }
        adjustments: &coil_spring
          - { name: Spring Rate, type: numerical, unit: lbs/in, min: 0 }
        options:
          damper: [bomber_cr]
          size: ["210x50", "210x55", "230x60", "230x65", "250x75", { eye_to_eye_mm: 190.5, stroke_mm: 50.8, label: "7.5x2.0in" }, { eye_to_eye_mm: 200.025, stroke_mm: 50.8, label: "7.875x2.0in" }, { eye_to_eye_mm: 200.025, stroke_mm: 57.15, label: "7.875x2.25in" }, { eye_to_eye_mm: 215.9, stroke_mm: 63.5, label: "8.5x2.5in" }, { eye_to_eye_mm: 222.25, stroke_mm: 69.85, label: "8.75x2.75in" }]
        note: >
          Coil spring sold separately, color-coded to rider weight
          (Purple/Blue/Green/Yellow ~ Soft/Medium/Firm/X-Firm); Marzocchi
          does not publish the actual lbs/in rate per color.
      - label: Trunnion
        level: trim
        specs: { mount: Trunnion (threaded reservoir end) }
        adjustments: *coil_spring
        options:
          damper: [bomber_cr]
          size: ["185x52.5", "185x55", "205x60", "205x65", "225x75", { eye_to_eye_mm: 241.3, stroke_mm: 76.2, label: "9.5x3.0in" }]

# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - Bomber CR click counts are from MTB-Mag (compression 16, rebound 15) and
#     NSMB (16 each) reviews; Marzocchi publishes none. Preload has no
#     published range and stays a missing adjuster.
#   - Bomber Air's compression is a non-indexed sweep (Flow Mountain Bike,
#     product page), so it is a two-state mode rather than a click count.
#   - Bomber Air's volume-spacer max count (spacers sold in 0.1 in³
#     increments) is not published as a "max spacers" number - omitted.
#   - Neither shock's coil Spring Rate color-code table (Purple/Blue/Green/
#     Yellow) gives an actual lbs/in number, only a rider-weight band and a
#     relative label (Soft/Medium/Firm/X-Firm) — same treatment as FOX/Öhlins
#     coil shocks in this catalog: Spring Rate stays a bare numerical field.
# --------------------------------------------------------------------------
