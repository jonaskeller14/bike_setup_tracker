# Marzocchi mountain-bike shocks — adjustment preset database
#
# Marzocchi currently sells exactly two rear shocks: the air-sprung Bomber
# Air and the coil-sprung Bomber CR. See SCHEMA.md in this folder for the
# sparse `adjustments:` format and field defaults.

brand: Marzocchi
component_type: shock
sources:
  - https://bike.marzocchi.com/collections/shocks
  - https://bike.marzocchi.com/products/bomber-air
  - https://bike.marzocchi.com/products/bomber-cr-rear-shock
  - https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-269_REV_A%202022%20Marzocchi%20Bomber%20Air%20Shock%20Owners%20Guide%20Rev%20A_FINAL.pdf
  - https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-205_Marzocchi-BomberCR-Tuning-Guide-white-RevA.pdf
  - https://flowmountainbike.com/tests/marzocchi-bomber-air-shock-review/
  - https://nsmb.com/articles/marzocchi-bomber-cr-coil-shock-review/
  - https://www.mtb-mag.com/en/tested-marzocchi-bomber-cr/
  # Primary — service intervals
  - https://tech.ridefox.com/img/help/page2840-6BL4/inline/605-00-201_RevA%202019%20Marzocchi%20Rear%20Shock%20User%20Manual.pdf
updated: 2026-10-13
# Service intervals (`tasks`) come from the Marzocchi rear shock owner's
# guides: a full service every 125 hours or yearly. No separate air-can
# interval is published.
#
# Click counts (where known) come from the official owner's/tuning guide
# PDFs on tech.ridefox.com, not the marketing product pages. Clicks counted
# from fully closed (firmest) → default `dial_ccw` visualization.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    bomber_air:
      name: Bomber Air
      description: >
        Air shock with a 10-click rebound dial and a tool-free low-speed
        compression sweep between Open and Firm.
      description_de: >
        Luftdämpfer mit Zugstufenrad mit 10 Klicks und werkzeuglosem
        Low-Speed-Druckstufen-Sweep zwischen Open und Firm.
      description_fr: Amortisseur pneumatique avec une molette de détente à 10 clics et un balayage de compression basse vitesse sans outil entre Open et Firm.
      description_it: Ammortizzatore pneumatico con una manopola del ritorno a 10 scatti e una corsa continua di compressione a bassa velocità senza attrezzi tra Open e Firm.
      description_es: Amortiguador neumático con una rueda de rebote de 10 clics y un barrido de compresión de baja velocidad sin herramientas entre Open y Firm.
      description_pt: Amortecedor a ar com um seletor de retorno de 10 cliques e uma varredura de compressão de baixa velocidade sem ferramentas entre Open e Firm.
      adjustments:
        - { name: Compression Mode, name_de: Druckstufenmodus, name_fr: Mode de compression, name_it: Modalità di compressione, name_es: Modo de compresión, name_pt: Modo de compressão, type: categorical, options: [Open, Firm], options_de: [Offen, Fest], options_fr: [Ouvert, Ferme], options_it: [Aperto, Rigido], options_es: [Abierto, Firme], options_pt: [Aberto, Firme], notes: "Low-Speed Compression; non-indexed sweep, clockwise is firmer", notes_de: "Low-Speed-Druckstufe; nicht indexiertes Sweep-Rad, im Uhrzeigersinn ist fester", notes_fr: "Compression basse vitesse ; balayage non indexé, le sens horaire est plus ferme", notes_it: "Compressione a bassa velocità; corsa continua non indicizzata, il senso orario è più rigido", notes_es: "Compresión de baja velocidad; barrido no indexado, el sentido horario es más firme", notes_pt: "Compressão de baixa velocidade; varredura não indexada, o sentido horário é mais firme" }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 10, notes: Counted from fully closed (slowest), notes_de: Von ganz geschlossen (am langsamsten) gezählt, notes_fr: Compté depuis la position entièrement fermée (la plus lente), notes_it: Contato a partire dalla posizione completamente chiusa (la più lenta), notes_es: Contado desde la posición totalmente cerrada (la más lenta), notes_pt: Contado a partir da posição totalmente fechada (a mais lenta), dialColor: red }
      source:
        - https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-269_REV_A%202022%20Marzocchi%20Bomber%20Air%20Shock%20Owners%20Guide%20Rev%20A_FINAL.pdf
        - https://flowmountainbike.com/tests/marzocchi-bomber-air-shock-review/
        - https://bike.marzocchi.com/products/bomber-air
      note: >-
        Flow Mountain Bike review (Nov 2022): "There are 10 clicks of adjustment
        for low-speed rebound damping"; the compression dial "uses a non-indexed
        sweep between 'Soft' and 'Firm'" (product page: "2-position, non-indexed
        compression sweep adjust"). The 2022 Bomber Air Shock Owner's Guide
        rebound table (counted counter-clockwise from fully closed) tops out at
        10, consistent with the review.

    bomber_cr:
      name: Bomber CR
      description: >
        Coil shock with indexed low-speed compression and rebound adjusters and
        adjustable spring preload.
      description_de: >
        Stahlfederdämpfer mit indexierten Verstellern für Low-Speed-Druckstufe
        und Zugstufe sowie einstellbarer Federvorspannung.
      description_fr: Amortisseur à ressort avec réglages indexés de compression basse vitesse et de détente et précontrainte de ressort réglable.
      description_it: Ammortizzatore a molla con regolatori indicizzati di compressione a bassa velocità e di ritorno e precarico della molla regolabile.
      description_es: Amortiguador de muelle con ajustes indexados de compresión de baja velocidad y de rebote y precarga del muelle ajustable.
      description_pt: Amortecedor a mola com ajustes indexados de compressão de baixa velocidade e de retorno e pré-carga da mola ajustável.
      missing_adjustments: [Preload]
      missing_adjustments_de: [Vorspannung]
      missing_adjustments_fr: [Précontrainte]
      missing_adjustments_it: [Precarico]
      missing_adjustments_es: [Precarga]
      missing_adjustments_pt: [Pré-carga]
      adjustments:
        - { name: Compression, name_de: Druckstufe, name_fr: Compression, name_it: Compressione, name_es: Compresión, name_pt: Compressão, type: step, max: 16, notes: "Low-Speed Compression; clockwise is firmer", notes_de: Low-Speed-Druckstufe; im Uhrzeigersinn ist fester, notes_fr: Compression basse vitesse ; le sens horaire est plus ferme, notes_it: Compressione a bassa velocità; il senso orario è più rigido, notes_es: Compresión de baja velocidad; el sentido horario es más firme, notes_pt: Compressão de baixa velocidade; o sentido horário é mais firme }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 16, notes: "Clockwise is slower; some units may have 15 clicks, check your dial and edit the maximum if it differs", notes_de: "Im Uhrzeigersinn ist langsamer; manche Dämpfer haben evtl. 15 Klicks, am Drehrad prüfen und das Maximum bei Abweichung anpassen", notes_fr: "Le sens horaire est plus lent ; certains exemplaires ont peut-être 15 clics, vérifiez votre cadran et modifiez le maximum s’il diffère", notes_it: "Il senso orario è più lento; alcuni esemplari potrebbero avere 15 scatti, controlla la tua manopola e modifica il massimo se è diverso", notes_es: "El sentido horario es más lento; algunas unidades pueden tener 15 clics, comprueba tu dial y edita el máximo si es distinto", notes_pt: "O sentido horário é mais lento; algumas unidades podem ter 15 cliques, confira o seu seletor e edite o máximo se for diferente" }
      source:
        - https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-205_Marzocchi-BomberCR-Tuning-Guide-white-RevA.pdf
        - https://www.mtb-mag.com/en/tested-marzocchi-bomber-cr/
        - https://nsmb.com/articles/marzocchi-bomber-cr-coil-shock-review/
      note: >-
        The tuning guide (605-00-205) gives only directions (clockwise
        increases damping), no click counts. Counts are from magazine reviews
        (tier 2): MTB-Mag says "16 crisp, clear detents" for low-speed
        compression and "a similar 15 clicks" for rebound; NSMB (Jan 2019) says
        "16 noticeable clicks" on each dial. The two disagree on rebound
        (15 vs 16); the higher count is used so no valid setting is excluded.
        The counting origin is not stated; counted from fully closed
        (clockwise to the stop) as for the brand's other dampers. Preload: turn
        counter-clockwise to increase sag, never more than two full turns
        clockwise (no click count).

# --------------------------------------------------------------------------
# Setup guides — the owner's and tuning guides' starting points as data
# (SCHEMA.md, "Setup guides"), transcribed from
# docs/research/setup_guides/marzocchi.md.
# --------------------------------------------------------------------------
guides:
  marzocchi_bomber_air_2022:
    label: Marzocchi Bomber Air shock owner's guide (2022)
    label_de: Marzocchi Bomber Luftdämpfer Bedienungsanleitung (2022)
    label_fr: Manuel d’utilisation de l’amortisseur pneumatique Marzocchi Bomber Air (2022)
    label_it: Manuale d’uso dell’ammortizzatore pneumatico Marzocchi Bomber Air (2022)
    label_es: Manual del usuario del amortiguador neumático Marzocchi Bomber Air (2022)
    label_pt: Manual do usuário do amortecedor a ar Marzocchi Bomber Air (2022)
    source: https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-269_REV_A%202022%20Marzocchi%20Bomber%20Air%20Shock%20Owners%20Guide%20Rev%20A_FINAL.pdf
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          50: 110, 55: 121, 60: 132, 65: 143, 70: 154,
          75: 165, 80: 176, 85: 187, 90: 198, 95: 209,
          100: 220, 105: 231, 110: 243, 115: 254, 120: 265
        }
        note: Calculated from Marzocchi's starting point (psi = rider weight in lb); set the final pressure by SAG
        note_de: Berechnet aus dem Ausgangspunkt von Marzocchi (psi = Fahrergewicht in lb); den endgültigen Druck über den SAG einstellen
        note_fr: Calculé à partir du point de départ de Marzocchi (psi = poids du pilote en lb) ; réglez la pression finale au SAG
        note_it: Calcolato dal punto di partenza di Marzocchi (psi = peso del rider in lb); regola la pressione finale in base al SAG
        note_es: Calculado a partir del punto de partida de Marzocchi (psi = peso del rider en lb); ajusta la presión final según el SAG
        note_pt: Calculado a partir do ponto de partida da Marzocchi (psi = peso do rider em lb); defina a pressão final pelo SAG
      # Counted from fully closed, the catalog's direction.
      - target: rebound
        input: pressure
        input_unit: psi
        rows: {
          "<100": 10, 100-120: 10, 120-140: 9, 140-160: 8, 160-180: 7,
          180-200: 6, 200-220: 5, 220-240: 4, 240-260: 3, 260-280: 2,
          280-300: 1
        }
      - { target: compression_mode, value: Open }
      - { target: sag, range: [25, 30], comfort_at: max, note: "25 % is Marzocchi's firm end, 30 % the plush end", note_de: "25 % ist das feste Ende von Marzocchi, 30 % das komfortable Ende", note_fr: "25 % est la limite ferme de Marzocchi, 30 % la limite confortable", note_it: "25 % è il limite rigido di Marzocchi, 30 % quello confortevole", note_es: 25 % es el extremo firme de Marzocchi y 30 % el cómodo, note_pt: 25 % é o extremo firme da Marzocchi e 30 % o confortável }

  marzocchi_bomber_cr_2018:
    label: Marzocchi Bomber CR tuning guide (2018)
    label_de: Marzocchi Bomber CR Tuning-Anleitung (2018)
    label_fr: Guide de réglage Marzocchi Bomber CR (2018)
    label_it: Guida alla taratura Marzocchi Bomber CR (2018)
    label_es: Guía de tarado Marzocchi Bomber CR (2018)
    label_pt: Guia de calibragem Marzocchi Bomber CR (2018)
    source: https://tech.ridefox.com/img/help/page2836-KNVM/inline/605-00-205_Marzocchi-BomberCR-Tuning-Guide-white-RevA.pdf
    # The guide prints no click starting points. Marzocchi's web spring
    # calculator needs the bike's rear wheel travel, so its rate is not
    # encoded until bike-level inputs exist (#71).
    rules:
      - { target: sag, value: 30 }

