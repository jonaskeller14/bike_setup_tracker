  - https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-ttx22m2-englisch--00003682.pdf
  # Primary - discontinued TTX22M listings (click counts and sizes)
  - https://www.ohlins.eu/en/products/mountainbike/coil-shocks/?show_unavailable=1
  - https://www.ohlins.eu/de/products/packages/mtbm-1893-210x55mm--102/
  - https://www.ohlins.eu/de/products/mountainbike/230x575mm-mtbm-1894--6314/
  - https://www.ohlins.eu/de/products/packages/mtbm-1895-230x60mm--104/
  - https://www.ohlins.eu/de/products/packages/mtbm-1896-230x65mm--105/
  - https://www.ohlins.eu/de/products/packages/mtbm-1898-250x70mm--107/
  - https://www.ohlins.eu/de/products/packages/mtbm-1899-250x75mm--224/
  - https://www.ohlins.eu/de/products/mountainbike/85x25-216x63mm-mtb-1491--6133/
  - https://www.ohlins.eu/de/products/mountainbike/875x275-222x70mm-mtb-1492--6134/
  - https://www.ohlins.eu/de/products/mountainbike/105x35-267x89-mm-mtb-1494--6136/
  - https://www.ohlins.eu/de/products/mountainbike/mtb-1495--6346/
updated: 2026-10-13
# Service intervals (`tasks`) come from the owner's manuals cited above: the
# TTX Air and TXC Air tables give the air spring 100 hours / 1 year and the
# damper 100 hours / 2 years; the TTX22 manual gives 100 hours or annually.
#
# Click ranges taken from each model's own listing at ohlins.eu. Clicks are
# counted from fully closed (firmest) → default `dial_ccw`.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    ttx1air_m1:
      name: TTX1Air (first generation)
      description: |-
        - Twin-tube air shock with a nitrogen-charged piggyback reservoir
        - Twin-tube flow keeps damping steady as shaft speed rises
        - High-speed compression is a three-position dial: Soft, Medium and Pedal
      description_de: |-
        - Zweirohr-Luftdämpfer mit stickstoffgefülltem Piggyback-Ausgleichsbehälter
        - Der Zweirohr-Durchfluss hält die Dämpfung auch bei steigender Kolbenstangengeschwindigkeit gleichmäßig
        - Die High-Speed-Druckstufe ist ein Rad mit drei Positionen: Soft, Medium und Pedal
      description_fr: |-
        - Amortisseur pneumatique bitube avec un réservoir piggyback chargé à l’azote
        - Le flux bitube garde un amortissement stable quand la vitesse de tige augmente
        - La compression haute vitesse est une molette à trois positions : Soft, Medium et Pedal
      description_it: |-
        - Ammortizzatore pneumatico bitubo con un serbatoio piggyback caricato ad azoto
        - Il flusso bitubo mantiene stabile lo smorzamento all’aumentare della velocità dello stelo
        - La compressione ad alta velocità è una manopola a tre posizioni: Soft, Medium e Pedal
      description_es: |-
        - Amortiguador neumático bitubo con un depósito piggyback cargado con nitrógeno
        - El flujo bitubo mantiene estable la amortiguación cuando aumenta la velocidad del vástago
        - La compresión de alta velocidad es una rueda de tres posiciones: Soft, Medium y Pedal
      description_pt: |-
        - Amortecedor a ar bitubo com um reservatório piggyback carregado com nitrogênio
        - O fluxo bitubo mantém o amortecimento estável quando a velocidade da haste aumenta
        - A compressão de alta velocidade é um seletor de três posições: Soft, Medium e Pedal
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: categorical, options: ["1", "2", P], options_de: ["1", "2", P], options_fr: ["1", "2", P], options_it: ["1", "2", P], options_es: ["1", "2", P], options_pt: ["1", "2", P], notes: "High-Speed Compression; 1 Soft, 2 Medium, P Pedal platform", notes_de: "High-Speed-Druckstufe; 1 Soft, 2 Medium, P Pedalplattform", notes_fr: "Compression haute vitesse ; 1 Souple, 2 Moyen, P plateforme Pedal", notes_it: "Compressione ad alta velocità; 1 Morbida, 2 Media, P piattaforma Pedal", notes_es: "Compresión de alta velocidad; 1 Blanda, 2 Media, P plataforma Pedal", notes_pt: "Compressão de alta velocidade; 1 Macia, 2 Média, P plataforma Pedal" }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 10, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade, dialColor: blue, dialSize: small }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 12, notes: Low-Speed Rebound, notes_de: Low-Speed-Zugstufe, notes_fr: Détente basse vitesse, notes_it: Ritorno a bassa velocità, notes_es: Rebote de baja velocidad, notes_pt: Retorno de baixa velocidade, dialColor: orange }
      source: https://www.ohlins.eu/en/products/mountainbike/ttx1air-universal--7689/
      note: >-
        TTX1Air listing: "12-fach verstellbare Low-Speed-Zugstufendämpfung",
        "10-fach verstellbare Low-Speed Druckstufendämpfung", "3-fach
        verstellbare High-Speed Druckstufendämpfung inkl. Pedal-Mode". This is
        NOT the m.2 table (7/16/3) — the two generations differ on every circuit.
        The TTX Air manuals label the high-speed dial 1 Soft, 2 Medium and P, so
        HSC is categorical on every TTX Air damper.

    ttx1air_m2:
      name: TTX1Air m.2
      description: |-
        - Twin-tube air shock, m.2 generation, with a volume-spacer air can
        - Far finer low-speed compression than the first generation, but coarser rebound
        - High-speed compression is a three-position dial: Soft, Medium and Pedal
      description_de: |-
        - Zweirohr-Luftdämpfer, Generation m.2, mit Luftkammer für Volumenspacer
        - Deutlich feinere Low-Speed-Druckstufe als bei der ersten Generation, aber gröbere Zugstufe
        - Die High-Speed-Druckstufe ist ein Rad mit drei Positionen: Soft, Medium und Pedal
      description_fr: |-
        - Amortisseur pneumatique bitube, génération m.2, avec une chambre à air à tokens de volume
        - Compression basse vitesse bien plus fine qu’en première génération, mais détente plus grossière
        - La compression haute vitesse est une molette à trois positions : Soft, Medium et Pedal
      description_it: |-
        - Ammortizzatore pneumatico bitubo, generazione m.2, con una camera d’aria a token di volume
        - Compressione a bassa velocità molto più fine rispetto alla prima generazione, ma ritorno più grossolano
        - La compressione ad alta velocità è una manopola a tre posizioni: Soft, Medium e Pedal
      description_es: |-
        - Amortiguador neumático bitubo, generación m.2, con una cámara de aire con tokens de volumen
        - Compresión de baja velocidad mucho más fina que la de la primera generación, pero rebote más grueso
        - La compresión de alta velocidad es una rueda de tres posiciones: Soft, Medium y Pedal
      description_pt: |-
        - Amortecedor a ar bitubo, geração m.2, com uma câmara de ar com tokens de volume
        - Compressão de baixa velocidade bem mais fina que a da primeira geração, mas retorno mais grosso
        - A compressão de alta velocidade é um seletor de três posições: Soft, Medium e Pedal
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: categorical, options: ["1", "2", P], options_de: ["1", "2", P], options_fr: ["1", "2", P], options_it: ["1", "2", P], options_es: ["1", "2", P], options_pt: ["1", "2", P], notes: "High-Speed Compression; 1 Soft, 2 Medium, P Pedal platform", notes_de: "High-Speed-Druckstufe; 1 Soft, 2 Medium, P Pedalplattform", notes_fr: "Compression haute vitesse ; 1 Souple, 2 Moyen, P plateforme Pedal", notes_it: "Compressione ad alta velocità; 1 Morbida, 2 Media, P piattaforma Pedal", notes_es: "Compresión de alta velocidad; 1 Blanda, 2 Media, P plataforma Pedal", notes_pt: "Compressão de alta velocidade; 1 Macia, 2 Média, P plataforma Pedal" }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 16, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade, dialColor: blue, dialSize: small }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 7, notes: Low-Speed Rebound, notes_de: Low-Speed-Zugstufe, notes_fr: Détente basse vitesse, notes_it: Ritorno a bassa velocità, notes_es: Rebote de baja velocidad, notes_pt: Retorno de baixa velocidade, dialColor: orange }
      source: https://www.ohlins.eu/en/products/mountainbike/ttx1air-m2-universal--7749/
      note: >-
        TTX1Air m.2 listing: "7-fach verstellbare Low-Speed-Zugstufendämpfung",
        "16-fach verstellbare Low-Speed Druckstufendämpfung", "3-fach
        verstellbare High-Speed Druckstufendämpfung inkl. Pedal-Mode".

    ttx2air_m1:
      name: TTX2Air (first generation)
      description: |-
        - Twin-tube air shock built around a larger-volume can than the TTX1Air
        - Twin-tube flow keeps damping steady as shaft speed rises
        - High-speed compression is a three-position dial: Soft, Medium and Pedal
      description_de: |-
        - Zweirohr-Luftdämpfer mit größerer Kammer als beim TTX1Air
        - Der Zweirohr-Durchfluss hält die Dämpfung auch bei steigender Kolbenstangengeschwindigkeit gleichmäßig
        - Die High-Speed-Druckstufe ist ein Rad mit drei Positionen: Soft, Medium und Pedal
      description_fr: |-
        - Amortisseur pneumatique bitube construit autour d’une chambre de plus grand volume que le TTX1Air
        - Le flux bitube garde un amortissement stable quand la vitesse de tige augmente
        - La compression haute vitesse est une molette à trois positions : Soft, Medium et Pedal
      description_it: |-
        - Ammortizzatore pneumatico bitubo costruito attorno a una camera di volume maggiore rispetto al TTX1Air
        - Il flusso bitubo mantiene stabile lo smorzamento all’aumentare della velocità dello stelo
        - La compressione ad alta velocità è una manopola a tre posizioni: Soft, Medium e Pedal
      description_es: |-
        - Amortiguador neumático bitubo construido en torno a una cámara de mayor volumen que el TTX1Air
        - El flujo bitubo mantiene estable la amortiguación cuando aumenta la velocidad del vástago
        - La compresión de alta velocidad es una rueda de tres posiciones: Soft, Medium y Pedal
      description_pt: |-
        - Amortecedor a ar bitubo construído em torno de uma câmara de maior volume que a do TTX1Air
        - O fluxo bitubo mantém o amortecimento estável quando a velocidade da haste aumenta
        - A compressão de alta velocidade é um seletor de três posições: Soft, Medium e Pedal
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: categorical, options: ["1", "2", P], options_de: ["1", "2", P], options_fr: ["1", "2", P], options_it: ["1", "2", P], options_es: ["1", "2", P], options_pt: ["1", "2", P], notes: "High-Speed Compression; 1 Soft, 2 Medium, P Pedal platform", notes_de: "High-Speed-Druckstufe; 1 Soft, 2 Medium, P Pedalplattform", notes_fr: "Compression haute vitesse ; 1 Souple, 2 Moyen, P plateforme Pedal", notes_it: "Compressione ad alta velocità; 1 Morbida, 2 Media, P piattaforma Pedal", notes_es: "Compresión de alta velocidad; 1 Blanda, 2 Media, P plataforma Pedal", notes_pt: "Compressão de alta velocidade; 1 Macia, 2 Média, P plataforma Pedal" }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 10, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade, dialColor: blue, dialSize: small }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 12, notes: Low-Speed Rebound, notes_de: Low-Speed-Zugstufe, notes_fr: Détente basse vitesse, notes_it: Ritorno a bassa velocità, notes_es: Rebote de baja velocidad, notes_pt: Retorno de baixa velocidade, dialColor: orange }
      source: https://www.ohlins.eu/en/products/mountainbike/ttx2-air-universal--7690/
      note: >-
        TTX2Air listing: "12-fach verstellbare Low-Speed-Zugstufendämpfung",
