        - { name: Ride Mode, name_de: Fahrmodus, name_fr: Mode de conduite, name_it: Modalità di guida, name_es: Modo de conducción, name_pt: Modo de pilotagem, type: categorical, options: [Open, Pedal, Lockout], options_de: [Offen, Pedal, Lockout], options_fr: [Ouvert, Pedal, Lockout], options_it: [Aperto, Pedal, Lockout], options_es: [Abierto, Pedal, Lockout], options_pt: [Aberto, Pedal, Lockout], notes: "Bar remote at 7.5mm cable pull per click, 5.5mm/click adapter available", notes_de: "Lenkerfernbedienung mit 7,5mm Seilzug pro Klick, Adapter mit 5,5mm/Klick erhältlich", notes_fr: "Commande au guidon à 7,5 mm de course de câble par clic, adaptateur de 5,5 mm/clic disponible", notes_it: "Comando al manubrio con 7,5 mm di corsa del cavo per scatto, adattatore da 5,5 mm/scatto disponibile", notes_es: "Mando de manillar con 7,5 mm de recorrido de cable por clic, adaptador de 5,5 mm/clic disponible", notes_pt: "Comando no guidão com 7,5 mm de puxada de cabo por clique, adaptador de 5,5 mm/clique disponível" }
      source: https://www.ohlins.eu/en/products/mountainbike/txc1air-universal--7691/
      note: >-
        TXC1Air listing gives "12 Klicks Zugstufendämpfung" and "drei
        hochdynamische Fahrmodi: Offen, Pedal und Lockout", and no compression
        click range at all. Its sibling TXC2Air is marketed as adding
        "Zusätzliche 16 Klick Low-Speed Druckstufendämpfung" over this shock,
        which is consistent with the TXC1Air having no compression clicks. No
        compression step is invented here.

