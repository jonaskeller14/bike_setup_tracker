        verstellbare High-Speed Druckstufendämpfung inkl. Pedal-Mode". Read off
        the TTX2Air's own listing, not carried over from the TTX1Air.

    ttx2air_m2:
      name: TTX2Air m.2
      description: |-
        - Twin-tube air shock, m.2 generation, with a double-can high-volume air spring
        - Rebound is a coarse four-position dial rather than a fine click range
        - High-speed compression is a three-position dial: Soft, Medium and Climb
      description_de: |-
        - Zweirohr-Luftdämpfer, Generation m.2, mit großvolumiger Doppelkammer-Luftfeder
        - Die Zugstufe ist ein grobes Rad mit vier Positionen statt eines feinen Klickbereichs
        - Die High-Speed-Druckstufe ist ein Rad mit drei Positionen: Soft, Medium und Climb
      description_fr: |-
        - Amortisseur pneumatique bitube, génération m.2, avec un ressort pneumatique grand volume à double chambre
        - La détente est une molette grossière à quatre positions plutôt qu’une plage fine de clics
        - La compression haute vitesse est une molette à trois positions : Soft, Medium et Climb
      description_it: |-
        - Ammortizzatore pneumatico bitubo, generazione m.2, con una molla pneumatica ad alto volume a doppia camera
        - Il ritorno è una manopola grossolana a quattro posizioni invece di una gamma fine di scatti
        - La compressione ad alta velocità è una manopola a tre posizioni: Soft, Medium e Climb
      description_es: |-
        - Amortiguador neumático bitubo, generación m.2, con un muelle neumático de gran volumen y doble cámara
        - El rebote es una rueda gruesa de cuatro posiciones en lugar de un rango fino de clics
        - La compresión de alta velocidad es una rueda de tres posiciones: Soft, Medium y Climb
      description_pt: |-
        - Amortecedor a ar bitubo, geração m.2, com uma mola a ar de alto volume e câmara dupla
        - O retorno é um seletor grosso de quatro posições em vez de uma faixa fina de cliques
        - A compressão de alta velocidade é um seletor de três posições: Soft, Medium e Climb
      adjustments:
        - { name: HSC, name_de: HSC, name_fr: HSC, name_it: HSC, name_es: HSC, name_pt: HSC, type: categorical, options: ["1", "2", P], options_de: ["1", "2", P], options_fr: ["1", "2", P], options_it: ["1", "2", P], options_es: ["1", "2", P], options_pt: ["1", "2", P], notes: "High-Speed Compression; 1 Soft, 2 Medium, P Climb platform", notes_de: "High-Speed-Druckstufe; 1 Soft, 2 Medium, P Climb-Plattform", notes_fr: "Compression haute vitesse ; 1 Souple, 2 Moyen, P plateforme Climb", notes_it: "Compressione ad alta velocità; 1 Morbida, 2 Media, P piattaforma Climb", notes_es: "Compresión de alta velocidad; 1 Blanda, 2 Media, P plataforma Climb", notes_pt: "Compressão de alta velocidade; 1 Macia, 2 Média, P plataforma Climb" }
        - { name: LSC, name_de: LSC, name_fr: LSC, name_it: LSC, name_es: LSC, name_pt: LSC, type: step, max: 12, notes: Low-Speed Compression, notes_de: Low-Speed-Druckstufe, notes_fr: Compression basse vitesse, notes_it: Compressione a bassa velocità, notes_es: Compresión de baja velocidad, notes_pt: Compressão de baixa velocidade, dialColor: blue, dialSize: small }
