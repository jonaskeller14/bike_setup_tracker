# --------------------------------------------------------------------------
# Setup guides — transcribed from docs/research/setup_guides/ohlins.md.
# The shock manuals give no rider-weight table: a start pressure before
# setting sag, a SAG band, the delivery position of the high-speed dial and
# the production spacer volume. The Performance Suspension Guide the manuals
# point to is keyed by bike model and is not encoded.
# --------------------------------------------------------------------------
guides:
  ohlins_ttx_air_m1_2020:
    label: Öhlins TTX Air owner's manual (2020)
    label_de: Öhlins TTX Air Bedienungsanleitung (2020)
    label_fr: Manuel d’utilisation Öhlins TTX Air (2020)
    label_it: Manuale d’uso Öhlins TTX Air (2020)
    label_es: Manual del usuario Öhlins TTX Air (2020)
    label_pt: Manual do usuário Öhlins TTX Air (2020)
    source: https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-ttx-air--00002997.pdf
    rules:
      - &ohlins_ttx_air_pressure { target: pressure, unit: psi, value: 170, note: Starting pressure; adjust it until the sag is right, note_de: "Startdruck; so lange anpassen, bis der SAG stimmt", note_fr: Pression de départ ; ajustez-la jusqu’à obtenir le bon SAG, note_it: Pressione iniziale; regolala finché il SAG non è giusto, note_es: Presión inicial; ajústala hasta que el SAG sea el correcto, note_pt: Pressão inicial; ajuste até o SAG ficar certo }
      - &ohlins_ttx_air_hsc { target: hsc, value: "2", note: "Delivery setting; set sag in 1 or 2, not P", note_de: "Auslieferungseinstellung; den SAG in 1 oder 2 einstellen, nicht in P", note_fr: "Réglage d’usine ; réglez le SAG en 1 ou 2, pas en P", note_it: "Impostazione di fabbrica; regola il SAG in 1 o 2, non in P", note_es: "Ajuste de fábrica; ajusta el SAG en 1 o 2, no en P", note_pt: "Ajuste de fábrica; regule o SAG em 1 ou 2, não em P" }
      - &ohlins_ttx_sag { target: sag, range: [25, 35], comfort_at: max }
      # TTX1Air = MTBM 1950-1955, all delivered with reducer A. The TTX2Air
      # production volume depends on a part number the catalog sizes don't map.
      - { target: volume_spacers, value: A, when: { damper: ttx1air_m1 }, note: Production setting, note_de: Serieneinstellung, note_fr: Réglage de série, note_it: Impostazione di serie, note_es: Ajuste de serie, note_pt: Ajuste de série }
      # The Specialized OEM sag table (SBC article numbers) has no catalog node.

  ohlins_ttx_air_m2_2025:
    label: Öhlins TTXAir m.2 owner's manual (2025)
    label_de: Öhlins TTXAir m.2 Bedienungsanleitung (2025)
    label_fr: Manuel d’utilisation Öhlins TTXAir m.2 (2025)
    label_it: Manuale d’uso Öhlins TTXAir m.2 (2025)
    label_es: Manual del usuario Öhlins TTXAir m.2 (2025)
    label_pt: Manual do usuário Öhlins TTXAir m.2 (2025)
    source: https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-ttx-air--00004276.pdf
    rules:
      - *ohlins_ttx_air_pressure
      - *ohlins_ttx_air_hsc
      - *ohlins_ttx_sag
      # TTX2Air m.2: 5 or 6 spacers by part number (MTBM 2565/2585 vs
      # 2569/2589), which the catalog sizes don't map.
      - { target: volume_spacers, value: 1, when: { damper: ttx1air_m2 }, note: Production setting, note_de: Serieneinstellung, note_fr: Réglage de série, note_it: Impostazione di serie, note_es: Ajuste de serie, note_pt: Ajuste de série }

  ohlins_txc_air_2023:
    label: Öhlins TXC Air owner's manual (2023)
    label_de: Öhlins TXC Air Bedienungsanleitung (2023)
    label_fr: Manuel d’utilisation Öhlins TXC Air (2023)
    label_it: Manuale d’uso Öhlins TXC Air (2023)
    label_es: Manual del usuario Öhlins TXC Air (2023)
    label_pt: Manual do usuário Öhlins TXC Air (2023)
    source: https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-txc-air--00003880.pdf
    rules:
      - { target: pressure, unit: psi, value: 200, note: Starting pressure; set sag with the lever in Open, note_de: Startdruck; den SAG mit dem Hebel in Open einstellen, note_fr: Pression de départ ; réglez le SAG avec le levier en Open, note_it: Pressione iniziale; imposta il SAG con la leva in Open, note_es: Presión inicial; ajusta el SAG con la palanca en Open, note_pt: Pressão inicial; defina o SAG com a alavanca em Open }
      - { target: sag, range: [20, 30], comfort_at: max }
      # The manual gives spacer maxima per stroke only, no production count.

  ohlins_ttx22_m2_2022:
    label: Öhlins TTX22m.2 owner's manual (2022)
    label_de: Öhlins TTX22m.2 Bedienungsanleitung (2022)
    label_fr: Manuel d’utilisation Öhlins TTX22m.2 (2022)
    label_it: Manuale d’uso Öhlins TTX22m.2 (2022)
    label_es: Manual del usuario Öhlins TTX22m.2 (2022)
    label_pt: Manual do usuário Öhlins TTX22m.2 (2022)
    source: https://www.ohlins.eu/download/db/Ohlins_DTC_benutzerhandbuch-oehlins-mtb-ttx22m2-englisch--00003682.pdf
    rules:
      - { target: hsc, value: II, note: Delivery setting, note_de: Auslieferungseinstellung, note_fr: Réglage d’usine, note_it: Impostazione di fabbrica, note_es: Ajuste de fábrica, note_pt: Ajuste de fábrica }
      - { target: sag, range: [25, 35], comfort_at: max, note: The right sag depends on the bike, note_de: Der richtige SAG hängt vom Bike ab, note_fr: Le bon SAG dépend du vélo, note_it: Il SAG giusto dipende dalla bici, note_es: El SAG correcto depende de la bici, note_pt: O SAG certo depende da bike }

# --------------------------------------------------------------------------
# Shocks — current Öhlins MTB lineup, both generations of each air shock.
# Shocks are sold by eye-to-eye × stroke length to match a given frame, not by
# a fixed "travel" like forks — `options.size` lists the eye-to-eye × stroke
