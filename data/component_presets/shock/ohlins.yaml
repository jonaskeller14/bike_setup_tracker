# Öhlins mountain-bike shocks — adjustment preset database
#
# Same design as shock/fox.yaml: click ranges belong to the DAMPER, defined
# once under `dampers:` and referenced by key from each shock's trims.
# See SCHEMA.md in this folder.

brand: Öhlins
component_type: shock
sources:
  - https://www.ohlins.eu/de/products/mountainbike/air-shocks/
  - https://www.ohlins.eu/de/products/mountainbike/coil-shocks/
  - https://www.ohlins.eu/de/products/mountainbike/ttx1air-m2-universal--7749/
  - https://www.ohlins.eu/de/products/mountainbike/ttx2air-m2-universal--7750/
  - https://www.ohlins.eu/de/products/mountainbike/txc1air-universal--7691/
  - https://www.ohlins.eu/de/products/mountainbike/txc2air-universal--7593/
  - https://www.ohlins.eu/de/products/mountainbike/ttx22-m2-piggyback-105x35-267x89mm--5708/
updated: 2026-07-05
# Click ranges taken from the individual product pages at ohlins.eu (German
# site). Clicks counted from fully closed (firmest) → default `dial_ccw`.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
dampers:
  ttx1air_m2:
    name: TTX1Air m.2
    description: Twin-tube air shock.
    adjustments:
      - { name: High-Speed Compression, type: step, max: 3 }
      - { name: Low-Speed Compression,  type: step, max: 16 }
      - { name: Rebound,                type: step, max: 7 }

  ttx2air_m2:
    name: TTX2Air m.2
    description: Twin-tube air shock; coarser external adjustment range than TTX1Air.
    adjustments:
      - { name: High-Speed Compression, type: step, max: 3 }
      - { name: Low-Speed Compression,  type: step, max: 12 }
      - { name: Rebound,                type: step, max: 3 }

  txc1air:
    name: TXC1Air
    description: >
      Cross-country air shock (pairs with RXC34 fork). Rebound is externally
      adjustable; compression click count was not separately specified on the
      product page — verify before relying on it.
    adjustments:
      - { name: Rebound, type: step, max: 12 }

  txc2air:
    name: TXC2Air
    description: Cross-country air shock, newer generation. Three riding modes via manual lever.
    adjustments:
      - { name: Low-Speed Compression, type: step, max: 16, notes: In Open mode }
      - { name: Rebound, type: step, max: 12 }
      - { name: Compression Mode, type: categorical, options: [Open, Medium, Firm], notes: Three riding modes via manual lever }

  ttx22_m2:
    name: TTX22 m.2
    description: Twin-tube coil shock. Same cartridge across Piggyback/Side-by-side/Trunnion mount variants.
    adjustments:
      - { name: High-Speed Compression, type: step, max: 3 }
      - { name: Low-Speed Compression,  type: step, max: 16 }
      - { name: Rebound,                type: step, max: 7 }

# --------------------------------------------------------------------------
# Shocks — current Öhlins MTB lineup.
# Shocks are sold by eye-to-eye/stroke length to match a given frame, not by a
# fixed "travel" like forks — `stroke_mm` lists the eye-to-eye × stroke sizes
# published on the product page.
#
# Air models share the `&air_spring` anchor (Pressure); the coil TTX22 m.2 lists
# a Spring Rate.
# --------------------------------------------------------------------------
shocks:
  - model: "TTX1Air"
    category: Trail / Enduro
    spring: Air
    year_range: "2025-2026"
    url: https://www.ohlins.eu/de/products/mountainbike/ttx1air-universal--7689/
    trims:
      - trim: Universal
        dampers: [ttx1air_m2]
        adjustments: &air_spring
          - { name: Pressure, type: numerical, unit: psi, min: 0 }

  - model: "TTX1Air m.2"
    category: Trail / Enduro
    spring: Air
    year_range: "2025-2026"
    url: https://www.ohlins.eu/de/products/mountainbike/ttx1air-m2-universal--7749/
    trims:
      - trim: Universal
        mount: [Trunnion, Standard eyelet]
        stroke_mm: ["165x45/42.5/40/37.5 (Trunnion)", "185x55/52.5/50/47.5 (Trunnion)", "190x45/42.5/40/37.5", "210x55/52.5/50/47.5"]
        dampers: [ttx1air_m2]
        adjustments: *air_spring

  - model: "TTX2Air"
    category: Trail / Enduro
    spring: Air
    year_range: "2025-2026"
    url: https://www.ohlins.eu/de/products/mountainbike/ttx2-air-universal--7690/
    trims:
      - trim: Universal
        dampers: [ttx2air_m2]
        adjustments: *air_spring

  - model: "TTX2Air m.2"
    category: Trail / Enduro
    spring: Air
    year_range: "2025-2026"
    url: https://www.ohlins.eu/de/products/mountainbike/ttx2air-m2-universal--7750/
    trims:
      - trim: Universal
        mount: [Trunnion, Metric]
        stroke_mm: ["185x55/52.5/50/47.5 (Trunnion)", "205x65/62.5/60/57.5 (Trunnion)", "210x55/52.5/50/47.5 (Metric)", "230x65/62.5/60/57.5 (Metric)"]
        dampers: [ttx2air_m2]
        adjustments: *air_spring
        note: air pressure adjustable up to 325psi; volume-spacer chamber system

  - model: "TXC1Air"
    category: XC
    spring: Air
    year_range: "2025-2026"
    url: https://www.ohlins.eu/de/products/mountainbike/txc1air-universal--7691/
    trims:
      - trim: Universal
        mount: [Trunnion Remote, Remote]
        stroke_mm: ["165x37.5/40 (Trunnion Remote)", "185x47.5/50 (Trunnion Remote)", "190x37.5/40 (Remote)", "210x47.5/50 (Remote)"]
        dampers: [txc1air]
        adjustments: *air_spring
        note: X-Country-tuned hydraulics; pairs with RXC34 fork

  - model: "TXC2Air"
    category: XC
    spring: Air
    year_range: "2025-2026"
    url: https://www.ohlins.eu/de/products/mountainbike/txc2air-universal--7593/
    trims:
      - trim: Universal
        mount: [Standard eyelet, Remote (5.5mm cable pull adapter)]
        stroke_mm: ["165x37.5/40/42.5/45", "185x47.5/50/52.5/55", "190x37.5/40/42.5/45", "210x47.5/50/52.5/55"]
        dampers: [txc2air]
        adjustments: *air_spring
        note: X-Country-tuned hydraulics; weighs from 255g

  - model: "TTX22 m.2"
    category: Enduro / Downhill
    spring: Coil
    year_range: "2025-2026"
    url: https://www.ohlins.eu/de/products/mountainbike/ttx22-m2-piggyback-105x35-267x89mm--5708/
    trims:
      - trim: Piggyback
        stroke_mm: ["51 (267 eye-to-eye)"]
        dampers: [ttx22_m2]
        adjustments: &coil_spring
          - { name: Spring Rate, type: numerical, unit: lbs/in, min: 0 }
      - trim: Side-by-side
        url: https://www.ohlins.eu/de/products/mountainbike/ttx22-m2-side-by-side--7681/
        mount: MTBM 220x series
        dampers: [ttx22_m2]
        adjustments: *coil_spring
      - trim: Trunnion Piggyback
        url: https://www.ohlins.eu/de/products/mountainbike/ttx22-m2-trunnion-piggyback-mtbm--7680/
        mount: MTBM 224x series
        dampers: [ttx22_m2]
        adjustments: *coil_spring
      - trim: Trunnion Side-by-side
        url: https://www.ohlins.eu/de/products/mountainbike/ttx22-m2-trunnion-side-by--7679/
        mount: MTBM 222x series
        dampers: [ttx22_m2]
        adjustments: *coil_spring
    note: Coil spring sold separately (Öhlins 18065-series).

