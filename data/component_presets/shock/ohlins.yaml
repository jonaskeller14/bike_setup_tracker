    txc1air:
      name: TXC1Air
      description: |-
        - Cross-country air shock, the rear half of the RXC34 package
        - A three-position lever steps between Open, Pedal and Lockout
        - Rebound is the only click adjuster; compression is set by the lever alone
      description_de: |-
        - Cross-Country-Luftdämpfer, die hintere Hälfte des RXC34-Pakets
        - Ein Drei-Positionen-Hebel schaltet zwischen Open, Pedal und Lockout
        - Die Zugstufe ist der einzige Klickversteller; die Druckstufe wird allein über den Hebel eingestellt
      description_fr: |-
        - Amortisseur pneumatique cross-country, moitié arrière de l’ensemble RXC34
        - Un levier à trois positions passe entre Open, Pedal et Lockout
        - La détente est le seul réglage à clics ; la compression se règle uniquement avec le levier
      description_it: |-
        - Ammortizzatore pneumatico cross-country, metà posteriore del pacchetto RXC34
        - Una leva a tre posizioni passa tra Open, Pedal e Lockout
        - Il ritorno è l’unico regolatore a scatti; la compressione si imposta solo con la leva
      description_es: |-
        - Amortiguador neumático cross-country, mitad trasera del paquete RXC34
        - Una palanca de tres posiciones alterna entre Open, Pedal y Lockout
        - El rebote es el único ajuste por clics; la compresión se regula solo con la palanca
      description_pt: |-
        - Amortecedor a ar cross-country, metade traseira do conjunto RXC34
        - Uma alavanca de três posições alterna entre Open, Pedal e Lockout
        - O retorno é o único ajuste por cliques; a compressão é definida só pela alavanca
      adjustments:
