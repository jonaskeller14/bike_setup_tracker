# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - setup_guide: the TTX Air manual (TTX Air AM, ...00002997) covers both
#     first-generation air shocks; ...00004276 is the m.2 one; the TXC manual
#     (...00003880) covers both TXC shocks.
#   - Dial colors: none found for the TXC1Air / TXC2Air rebound and the TXC2Air
#     lever, so those carry no `dialColor` beyond the TXC2Air compression.
#   - Volume spacers: counted from the TTXAir m.2 manual (00004276, TTX1Air 5,
#     TTX2Air 8 or 9 by part number) and the TXC manual (TXC1Air 4 + 2, TXC2Air
#     3 + 0-3 by stroke). The first-generation TTX1Air/TTX2Air use sized volume
#     reducers (parts A-E, plus stackable F on the double tube), not a count:
#     the TTX1Air (MTBM 1950-1955) lists A-E as a categorical. The TTX2Air's
#     production setting (D, D+F or D+2F) depends on a part number not yet
#     mapped to the catalog sizes, so no adjustment is declared for it.
#   - Maximum air pressure: 300 psi for the single-tube TTX1Air and 325 psi for
