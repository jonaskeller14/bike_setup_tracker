    category: Downhill
    years: "2023-2026"
    url: https://www.sram.com/en/rockshox/series/super-deluxe-dh
    setup_guide: https://www.sram.com/en/rockshox/learn/suspension-welcome-guide
    specs: { spring: Air }
    children:
      - label: Ultimate DH
        level: trim
        draft: true
        specs: { spring: DebonAir+ }
        adjustments: *air_spring
        options:
          damper: [rc2]
        note: Gravity-specific tune with a narrower damping window than the trail Super Deluxe

  - label: "Vivid Air"
    level: model
    category: Trail / Enduro
    children:
      - label: "2024–2026"
        level: generation
        id: "2024"
        years: "2024-2026"
