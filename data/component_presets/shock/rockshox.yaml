# Counting conventions, verified per damper against SRAM material:
#   * RC2T compression counts from the MIDDLE — SRAM: "5 positions for both HSC
#     and LSC ... the base tune is in the middle, with two positions to increase
#     damping and two positions to decrease damping" — so -2..+2 with
#     `visualization: dial_cw`.
#   * Rebound is counted from fully OPEN (fastest); SRAM's service "Record Your
#     Settings" tables count clicks turning the rebound adjuster fully
#     counter-clockwise.
#   * Vivid Ultimate (Gen C): the Vivid Coil service manual and SRAM's
#     downhill welcome guide count HSC/LSC clicks from the centre 0 position and
#     publish five positions, so they are stored as -2..+2. The Hydraulic Bottom
#     Out dial is documented as five settings from 0 clicks (open) to +4 (closed)
#     in the Suspension User Manual, so it is stored as 0..4.
#
# Service intervals (`tasks`) come from the SRAM/RockShox "Service Intervals"
# chart (GEN.0000000005593 Rev H); "1 year" is the spare-parts catalog's
# "200 HOUR/1 YEAR SERVICE KIT":
#   * Deluxe, Super Deluxe (2017-2026), SIDLuxe: 50 h air can, 200 h damper.
#   * Super Deluxe Coil, Vivid Coil (2025+): 200 h damper.
#   * Vivid (2024+): 100 h air can, 200 h damper.
#   * Monarch, Monarch Plus, Vivid Air (2011-2022): 50 h air can, 100 h damper.

