# RockShox mountain-bike shocks — adjustment preset database
#
# Same design as shock/fox.yaml and shock/ohlins.yaml: click ranges belong to
# the DAMPER cartridge, defined once under `dampers:` and referenced by key.
# See SCHEMA.md in this folder.

brand: RockShox
component_type: shock
sources:
  - https://www.sram.com/en/rockshox/products/shocks
  - https://support.rockshox.com/hc/en-us/articles/6004236989083-How-do-I-adjust-Rebound-High-Speed-Compression-HSC-and-Low-Speed-Compression-LSC-on-the-RockShox-RC2T-damper
  - https://enduro-mtb.com/en/rockshox_vivid_coil_super_deluxe_shock_review_2025/
  - https://flowmountainbike.com/features/rockshox-shock-setup/
  - https://road.cc/offroad/content/news/rockshox-rear-shocks-2024-your-guide-to-all-the-models-details-and-specs-from-the-range
updated: 2026-07-05
# Click ranges from SRAM/RockShox support documentation and official product
# pages (sram.com). Compression clicks counted from fully CLOSED (firmest) →
# default `dial_ccw`; rebound clicks counted from fully OPEN (fastest), noted
# per adjuster.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
dampers:
  rc2t:
    name: RC2T
    description: >
      Trail/enduro damper (Super Deluxe, Vivid Air Ultimate, others).
      Dual-compression + rebound + threshold/hydraulic-bottom-out system.
      Letters break down as: R (Rebound), C2 (dual compression: LSC + HSC),
      T (Threshold/HBO).
    adjustments:
      - { name: HSC, type: step, max: 5, notes: "High-Speed Compression; Requires a 3mm hex key" }
      - { name: LSC, type: step, max: 5, notes: "Low-Speed Compression; Adjusted by hand" }
      - { name: Rebound, type: step, max: 15, notes: Counted from fully open (fastest) }

  rc2:
    name: RC2
    description: >
      Downhill/gravity damper variant (Super Deluxe Ultimate DH, BoXXer DH).
      Two external compression circuits + rebound (no threshold).
    adjustments:
      - { name: HSC, type: step, max: 5, notes: High-Speed Compression }
      - { name: LSC, type: step, max: 5, notes: Low-Speed Compression }
      - { name: Rebound, type: step, max: 15, notes: Counted from fully open (fastest) }
    note: "Similar click counts to RC2T but tuned for DH/gravity riding."

  vivid_coil:
    name: Vivid Coil (Threshold damper)
    description: >
      Coil shock (Vivid Coil Ultimate 2025+). Dual-compression + rebound +
      hydraulic bottom-out adjustment + threshold climbing switch (lock-out
      position).
    adjustments:
      - { name: HSC, type: step, max: 5, notes: High-Speed Compression }
      - { name: LSC, type: step, max: 5, notes: Low-Speed Compression }
      - { name: Rebound, type: step, max: 20, notes: Counted from fully open (fastest) }
      - { name: Hydraulic Bottom Out, type: step, max: 5 }
      - { name: Threshold, type: categorical, options: [Open, Locked-out], notes: Climb/pedal-mode lock-out lever }

  rct:
    name: RCT
    description: >
      Trail air shock (Deluxe Ultimate, SIDLuxe Ultimate, Vivid Ultimate).
      Dual-compression + rebound damping. Similar architecture to RC2T but
      lacks the threshold/HBO system; may have different click counts.
    adjustments:
      - { name: HSC, type: step, max: 5, notes: High-Speed Compression }
      - { name: LSC, type: step, max: 5, notes: Low-Speed Compression }
      - { name: Rebound, type: step, max: 15, notes: Counted from fully open (fastest) }
    note: "Click counts inferred from RC2T; verify independently."

  debonair_plus:
    name: DebonAir+
    description: >
      Air spring system found on many RockShox shocks (Super Deluxe,
      SIDLuxe, Deluxe, Vivid air models). Large-volume, progressive tuning
      via air pressure and volume spacers, not manual click adjusters.
    adjustments: []
    note: >
      DebonAir+ is a spring design, not a damper. No click adjustments —
      tuning via air pressure (PSI) and optional volume spacers (spring-side).

  touch_down_rc2t:
    name: TouchDown RC2T
    description: >
      Air shock variant combining Vivid platform with RC2T damping and
      TouchDown hydraulic bottom-out (proprietary HBO system).
    adjustments:
      - { name: HSC, type: step, max: 5, notes: High-Speed Compression }
      - { name: LSC, type: step, max: 5, notes: Low-Speed Compression }
      - { name: Rebound, type: step, max: 15, notes: Counted from fully open (fastest) }

# --------------------------------------------------------------------------
# Shocks — current (2025/2026) RockShox lineup.
# Shocks are sold by stroke/eye-to-eye length to match a given frame, not by a
# fixed "travel" like forks — `stroke_mm` lists commonly offered lengths when
# published on the product page.
#
# The model-level `spring:` decides the spring adjustment; the trim-level
# `spring:` (DebonAir+, SoloAir, …) is the informational spring-variant name.
# Air shocks share the `&air_spring` anchor (Pressure), coil shocks list a
# Spring Rate. Volume-spacer counts are not published per model — see follow-ups.
# --------------------------------------------------------------------------
shocks:
  - model: "Deluxe"
    category: Trail
    spring: Air
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/deluxe
    trims:
      - trim: Ultimate
        dampers: [rct]
        spring: DebonAir+
        adjustments: &air_spring
          - { name: Pressure, type: numerical, unit: psi, min: 0 }
      - trim: Select+
        dampers: [rct]
        spring: DebonAir
        adjustments: *air_spring
        note: OEM only
      - trim: Select
        dampers: [rct]
        spring: SoloAir
        adjustments: *air_spring
        note: OEM only

  - model: "Super Deluxe"
    category: Trail / Enduro
    spring: Air
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/super-deluxe
    trims:
      - trim: Ultimate
        dampers: [rc2t]
        spring: DebonAir+
        adjustments: *air_spring
      - trim: Select+
        dampers: [rc2t]
        spring: DebonAir
        adjustments: *air_spring
        note: OEM only
      - trim: Select
        dampers: [rc2t]
        spring: SoloAir
        adjustments: *air_spring
        note: OEM only

  - model: "Super Deluxe Coil"
    category: Trail / Enduro
    spring: Coil
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/super-deluxe-coil
    trims:
      - trim: Ultimate
        dampers: [rc2t]
        adjustments: &coil_spring
          - { name: Spring Rate, type: numerical, unit: lbs/in, min: 0 }
      - trim: Select+
        dampers: [rc2t]
        adjustments: *coil_spring
        note: OEM only
      - trim: Select
        dampers: [rc2t]
        adjustments: *coil_spring
        note: OEM only

  - model: "Super Deluxe Ultimate DH"
    category: Downhill
    spring: Air
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/super-deluxe-dh
    trims:
      - trim: Ultimate DH
        dampers: [rc2]
        spring: DebonAir+
        adjustments: *air_spring
        note: DH/gravity tuning; tighter damping range than trail Super Deluxe

  - model: "Vivid Air"
    category: Trail / Enduro
    spring: Air
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/vivid-air
    trims:
      - trim: Ultimate
        dampers: [touch_down_rc2t]
        spring: DebonAir+
        adjustments: *air_spring
      - trim: Select+
        dampers: [touch_down_rc2t]
        spring: DebonAir
        adjustments: *air_spring
        note: OEM only
      - trim: Select
        dampers: [touch_down_rc2t]
        spring: SoloAir
        adjustments: *air_spring
        note: OEM only

  - model: "Vivid Coil"
    category: Trail / Enduro
    spring: Coil
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/vivid-coil
    trims:
      - trim: Ultimate
        dampers: [vivid_coil]
        adjustments: *coil_spring
        note: >
          Dual compression (5 clicks each) + 20-click rebound + 5-click
          adjustable HBO + threshold climb switch. Both compression dials
          accessed by hand (LSC) and 3mm hex (HSC).

  - model: "Vivid Coil Ultimate DH"
    category: Downhill
    spring: Coil
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/vivid-coil-dh
    trims:
      - trim: Ultimate DH
        dampers: [vivid_coil]
        adjustments: *coil_spring
        note: DH-tuned variant of Vivid Coil

  - model: "SIDLuxe"
    category: XC
    spring: Air
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/sidluxe
    trims:
      - trim: Ultimate Flight Attendant
        dampers: [rct]
        spring: DebonAir+
        adjustments: *air_spring
        note: Electronic damper adjustment
      - trim: Ultimate
        dampers: [rct]
        spring: DebonAir+
        adjustments: *air_spring
      - trim: Select+
        dampers: [rct]
        spring: DebonAir
        adjustments: *air_spring
        note: OEM only

  - model: "Monarch"
    category: XC / Trail
    spring: Air
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/monarch
    trims:
      - trim: XX
        dampers: [rct]
        spring: SoloAir
        adjustments: *air_spring
        note: XLoc remote lockout
      - trim: RT3
        dampers: [rct]
        spring: SoloAir
        adjustments: *air_spring
      - trim: RL
        dampers: [rct]
        spring: DebonAir
        adjustments: *air_spring
      - trim: R
        dampers: [rct]
        spring: SoloAir
        adjustments: *air_spring

  - model: "Monarch Plus RC3"
    category: Enduro / Gravity
    spring: Air
    year_range: "2025-2026"
    url: https://www.sram.com/en/rockshox/series/monarch-plus-rc3
    trims:
      - trim: Ultimate
        dampers: [rc2t]
        spring: DebonAir+
        adjustments: *air_spring
        note: Piggyback reservoir design

