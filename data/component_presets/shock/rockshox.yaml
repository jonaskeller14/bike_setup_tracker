# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - Sizes: SRAM publishes no per-model size table; sizes come from the 2026
#     spare-parts catalog and the support knowledge base's air-can lists.
#     Deluxe / Super Deluxe (2023-2026) and Vivid Air list all eye-to-eye lengths
#     with their mounts; the 2017-2022 Deluxe / Super Deluxe and SIDLuxe list
#     sizes without a per-size mount (no statement), Monarch / Monarch Plus list
#     the air-can sizes. Super Deluxe Coil and Vivid Coil list strokes only: the
#     Vivid Coil manual names the same four length pairs as Vivid Air but not
#     which pairs with which stroke, and the stroke-only ids are locked.
#   - No sizes for the DH trims (Super Deluxe Ultimate DH, Vivid Air Ultimate
#     DH, Vivid Coil Ultimate DH), Vivid Air R2C, and the Super Deluxe D1
#     (2027): its air cans are stroke-class only (37.5-45 / 47.5-55 / 57.5-65)
#     and no eye-to-eye table was found, so strokes are listed.
#   - Setup guides: no official page exists for Super Deluxe specifically; the
#     Suspension Welcome Guide (forks and shocks) is used. Dial colors: the RC2T
#     FAQ is the only source stating knob colors; no source states them for
#     Vivid Ultimate, so those dials keep the default.
#   - RCT damper (Deluxe Ultimate, SIDLuxe) click counts — rebound carries
#     `max: ~`, but compression and the climb lever are undocumented, so the
#     models are `draft: true` until SRAM publishes real counts.
#   - RC2 (Super Deluxe Ultimate DH) click counts — not published; the trail
#     RC2T numbers are a different tune and must not be reused. Rebound carries
#     `max: ~`; HSC/LSC have no documented zero point, so the trim stays
#     `draft: true`.
#   - Super Deluxe D1 (2027, `draft: true`): rebound (15 clicks), the two-position
#     lockout, 400 psi and the 4 / 5 / 6 internal token positions per stroke class
#     are published; HSC / LSC ranges and the lockout lever are not, so the
#     generation stays draft. Vivid Air D1 (2027+, 20 clicks, ABO -2..+2
#     positions, pressure chart as an image) and Vivid Coil D1 are not split
#     out from the 2024-2026 Vivid generations.
#   - RC2T threshold/climb lever — the "T" circuit is not documented as a
#     discrete set of named positions, so no Threshold adjustment is generated.
#   - Legacy damper click counts (Monarch RT3, Monarch Plus RC3, Deluxe RT3,
#     Super Deluxe RCT, Vivid Air R2C) — none published in SRAM's current
#     documentation; would need the archived per-year rear-shock spec sheets.
#     Rebound carries `max: ~`; the compression levers and dials stay
#     undocumented, so these models stay `draft: true`.
#   - Bottomless Token maxima still missing: Super Deluxe Coil / Vivid Coil
#     (coil), Super Deluxe Ultimate DH, SIDLuxe WCID / IsoStrut variants (3 / 2
#     tokens, separate products). Maximum pressure is published only for Super
#     Deluxe D1 (400 psi), Vivid Air (360 / 300 psi) and the SIDLuxe Linear XL
#     air can (325 psi); the Deluxe / Super Deluxe (2023-2026) and older
#     shocks carry no Pressure maximum.
#   - Kage, Deluxe Coil, Super Deluxe GENIE (190x45, 210x55, Specialized only)
#     and the Trek/Scott/Specialized OEM Deluxe variants (RE:aktiv, Thru Shaft,
#     NUDE) are not covered.
# --------------------------------------------------------------------------
