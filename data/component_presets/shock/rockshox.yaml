# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - Sizes: SRAM publishes no per-model size table. Super Deluxe (2023-2026)
#     lists all eight eye-to-eye lengths (catalog air cans and damper bodies for
#     "Super Deluxe C1-C2 (2023-2026)" cover 37.5-75 mm strokes). Vivid Air lists
#     only the 185-250 mm lengths: the catalog's Vivid C1 eyelet/body parts start
#     at 47.5 mm. Super Deluxe Coil and Vivid Coil list strokes only (parts
#     "SUPER DELUXE COIL B1+" / "VIVID COIL C1" by stroke class, Standard and
#     Trunnion) because no eye-to-eye is tied to the coil models.
#   - No sizes for the DH trims (Super Deluxe Ultimate DH, Vivid Air Ultimate
#     DH, Vivid Coil Ultimate DH): the catalog only ties the DH reservoir to the
#     regular models, not a size list to the DH shock. Also none for Deluxe,
#     SIDLuxe, the 2017-2022 generations, Vivid Air R2C, Monarch and Monarch
#     Plus (Deluxe/SIDLuxe stroke classes differ, older generations have no
#     mount statement, Monarch parts use rounded imperial names).
#   - Vivid Air 165/190 x 37.5-45: a "Vivid C1" air can exists but no matching
#     eyelet/body part, so it is left out.
#   - Setup guides: no official page exists for Super Deluxe specifically; the
#     Suspension Welcome Guide (forks and shocks) is used. Dial colors: the RC2T
#     FAQ is the only source stating knob colors; no source states them for
#     Vivid Ultimate, so those dials keep the default.
#   - RCT damper (Deluxe Ultimate, SIDLuxe) click counts — the previous entry
#     carried RC2T's numbers by inference; that has been removed. Rebound
#     carries `max: ~`, but compression and the climb lever are undocumented,
#     so the models are `draft: true` until SRAM publishes real counts.
#   - RC2 (Super Deluxe Ultimate DH) click counts — not published; the trail
#     RC2T numbers are a different tune and must not be reused. Rebound carries
#     `max: ~`; HSC/LSC have no documented zero point, so the trim stays
#     `draft: true`.
#   - Vivid Ultimate HSC/LSC/AHBO zero point — the five-position count is
#     published, but SRAM does not say whether the dials are centred on a base
#     tune the way RC2T's are, so they are stored as a plain 1..5 range.
#   - RC2T threshold/climb lever — the "T" circuit is not documented as a
#     discrete set of named positions, so no Threshold adjustment is generated.
#   - Legacy damper click counts (Monarch RT3, Monarch Plus RC3, Deluxe RT3,
#     Super Deluxe RCT, Vivid Air R2C) — none published in SRAM's current
#     documentation; would need the archived per-year rear-shock spec sheets.
#     Rebound carries `max: ~`; the compression levers and dials stay
#     undocumented, so these models stay `draft: true`.
#   - Bottomless Token / Bottomless Ring maxima for Deluxe, Super Deluxe and the
#     Monarch generation — the Tuning Tokens and Rings document lists part
#     numbers per model code but no maximum counts.
#   - Kage, Deluxe Coil and the Trek/Scott/Specialized OEM Deluxe variants
