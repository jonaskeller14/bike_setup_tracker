        one damper key covers both the air and coil Ultimate shocks. HSC / LSC are
        stored as -2..+2: the Vivid Coil service manual records compression clicks
        "clockwise or counterclockwise from the center 0 position" and the
        downhill welcome guide starts HSC / LSC at the middle (0). The AHBO dial is
        described in the Suspension User Manual as five settings from 0 clicks
        (open) to +4 (closed) for the Gen C shocks (the 2027 D1 uses -2..+2
        positions). Per Pinkbike's first-ride piece,
        LSC is a knurled hand knob while the removable rebound knob doubles as a
        3mm hex key for the small, tucked-away HSC and AHBO adjusters.

