# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - RCT damper (Deluxe Ultimate, SIDLuxe) click counts — the previous entry
#     carried RC2T's numbers by inference; that has been removed and the models
#     are `complete: false` until SRAM publishes real counts.
#   - RC2 (Super Deluxe Ultimate DH) click counts — not published; the trail
#     RC2T numbers are a different tune and must not be reused.
#   - Vivid Ultimate HSC/LSC/AHBO zero point — the five-position count is
#     published, but SRAM does not say whether the dials are centred on a base
#     tune the way RC2T's are, so they are stored as a plain 1..5 range.
#   - RC2T threshold/climb lever — the "T" circuit is not documented as a
#     discrete set of named positions, so no Threshold adjustment is generated.
#   - Legacy damper click counts (Monarch RT3, Monarch Plus RC3, Deluxe RT3,
#     Super Deluxe RCT, Vivid Air R2C) — none published in SRAM's current
#     documentation; would need the archived per-year rear-shock spec sheets.
#   - Bottomless Token / Bottomless Ring maxima for Deluxe, Super Deluxe and the
#     Monarch generation — the Tuning Tokens and Rings document lists part
#     numbers per model code but no maximum counts.
#   - Kage, Deluxe Coil and the Trek/Scott/Specialized OEM Deluxe variants
#     (RE:aktiv, Thru Shaft, NUDE) are not covered.
# --------------------------------------------------------------------------
