option_values:
  damper:
    rc2t:
      name: RC2T
      description: |-
        - Rebound, two independent compression circuits and a threshold climb setting
        - HSC and LSC are 5-position dials, centred on the shock's base tune
        - 15 clicks of rebound; LSC turns by hand, HSC takes a 3mm hex key
      description_de: |-
        - Zugstufe, zwei unabhängige Druckstufenkreise und eine Threshold-Climb-Einstellung
        - HSC und LSC sind Räder mit 5 Positionen, zentriert auf die Grundabstimmung des Dämpfers
        - 15 Klicks Zugstufe; LSC wird von Hand gedreht, HSC braucht einen 3-mm-Inbusschlüssel
      description_fr: |-
        - Détente, deux circuits de compression indépendants et un réglage threshold pour la montée
        - HSC et LSC sont des molettes à 5 positions, centrées sur le réglage de base de l’amortisseur
        - 15 clics de détente ; le LSC se tourne à la main, le HSC demande une clé hexagonale de 3 mm
      description_it: |-
        - Ritorno, due circuiti di compressione indipendenti e un’impostazione threshold per la salita
        - HSC e LSC sono manopole a 5 posizioni, centrate sulla taratura base dell’ammortizzatore
        - 15 scatti di ritorno; l’LSC si ruota a mano, l’HSC richiede una chiave a brugola da 3 mm
      description_es: |-
        - Rebote, dos circuitos de compresión independientes y un ajuste threshold para subir
        - HSC y LSC son ruedas de 5 posiciones, centradas en el tarado base del amortiguador
        - 15 clics de rebote; el LSC se gira a mano, el HSC requiere una llave Allen de 3 mm
      description_pt: |-
        - Retorno, dois circuitos de compressão independentes e um ajuste threshold para subir
        - HSC e LSC são seletores de 5 posições, centrados na calibragem base do amortecedor
        - 15 cliques de retorno; o LSC gira à mão, o HSC exige uma chave Allen de 3 mm
