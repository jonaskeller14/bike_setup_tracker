# RockShox mountain-bike shocks — adjustment preset database
#
# Same design as shock/fox.yaml and shock/ohlins.yaml: click ranges belong to
# the DAMPER cartridge, defined once under `dampers:` and referenced by key.
# See SCHEMA.md in this folder.

brand: RockShox
component_type: shock
sources:
  - https://www.sram.com/en/rockshox/products/shocks
  # Primary — RockShox rider-support knowledge base
  - https://support.rockshox.com/hc/en-us/articles/6004026399259-How-far-can-I-adjust-the-High-Speed-Compression-HSC-and-Low-Speed-Compression-LSC-on-Rockshox-RC2T-dampers
  - https://support.rockshox.com/hc/en-us/articles/6004236989083-How-do-I-adjust-Rebound-High-Speed-Compression-HSC-and-Low-Speed-Compression-LSC-on-the-RockShox-RC2T-damper
  - https://support.rockshox.com/hc/en-us/articles/6012267863835-How-many-clicks-of-Rebound-does-the-MY23-RockShox-Super-Deluxe-have
  - https://support.rockshox.com/hc/en-us/articles/48154327224219-How-many-rebound-clicks-does-the-Super-Deluxe-D1-have
  - https://support.rockshox.com/hc/en-us/articles/17939326675867-How-many-positions-of-High-Speed-Compression-HSC-Low-Speed-Compression-LSC-Rebound-and-Adjustable-Hydraulic-Bottom-Out-AHBO-does-Vivid-Ultimate-have
  - https://support.rockshox.com/hc/en-us/articles/46640345306779-How-many-rebound-clicks-does-Vivid-Coil-D1-feature
  - https://support.rockshox.com/hc/en-us/articles/48154956077851-How-many-rebound-clicks-does-the-2027-Vivid-Air-D1-feature
  - https://support.rockshox.com/hc/en-us/articles/17939965514523-What-kind-of-Bottomless-Tokens-does-Vivid-use-and-how-many-tokens-can-Vivid-hold
  - https://support.rockshox.com/hc/en-us/articles/17404773069851-What-is-the-maximum-number-of-Bottomless-Tokens-that-2024-SIDLuxe-can-use
  - https://support.rockshox.com/hc/en-us/articles/17938105283355-Will-Vivid-Ultimate-DH-replace-Super-Deluxe-Ultimate-DH
  # Primary — SRAM service documentation (PDF)
  - https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/bottomless-tokens-english.pdf
  # Secondary — editorial, used for context only, no numbers taken from them
  - https://enduro-mtb.com/en/rockshox_vivid_coil_super_deluxe_shock_review_2025/
  - https://flowmountainbike.com/features/rockshox-shock-setup/
  - https://www.pinkbike.com/news/first-ride-the-new-rockshox-vivid-ultimate.html
  - https://freehub.com/product-reviews/2014-rockshox-pike-rct3-160mm-review
updated: 2026-09-10
# Counting conventions, verified per damper against SRAM material:
#   * RC2T compression counts from the MIDDLE — SRAM: "5 positions for both HSC
#     and LSC ... the base tune is in the middle, with two positions to increase
#     damping and two positions to decrease damping" — so -2..+2 with
#     `visualization: dial_cw`.
#   * Rebound is counted from fully OPEN (fastest); SRAM's service "Record Your
#     Settings" tables count clicks turning the rebound adjuster fully
#     counter-clockwise.
#   * Vivid Ultimate's compression and bottom-out adjusters are published as a
#     count of positions without a stated zero point, so they are stored as a
#     plain 1..5 range rather than assuming a centre detent.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
dampers:
  rc2t:
    name: RC2T
    description: |-
      - Rebound, two independent compression circuits and a threshold climb setting
      - HSC and LSC are 5-position dials, centred on the shock's base tune
      - 15 clicks of rebound; LSC turns by hand, HSC takes a 3mm hex key
    adjustments:
      - { name: HSC, type: step, min: -2, max: 2, visualization: dial_cw, notes: "High-Speed Compression; Counted from the middle base tune; 3mm hex key", dialColor: blue, dialSize: small }
      - { name: LSC, type: step, min: -2, max: 2, visualization: dial_cw, notes: "Low-Speed Compression; Counted from the middle base tune; adjusted by hand", dialColor: blue }
      - { name: Rebound, type: step, max: 15, notes: Counted from fully open (fastest), dialColor: red }
    source:
      - https://support.rockshox.com/hc/en-us/articles/6004026399259-How-far-can-I-adjust-the-High-Speed-Compression-HSC-and-Low-Speed-Compression-LSC-on-Rockshox-RC2T-dampers
      - https://support.rockshox.com/hc/en-us/articles/6004236989083-How-do-I-adjust-Rebound-High-Speed-Compression-HSC-and-Low-Speed-Compression-LSC-on-the-RockShox-RC2T-damper
      - https://support.rockshox.com/hc/en-us/articles/6012267863835-How-many-clicks-of-Rebound-does-the-MY23-RockShox-Super-Deluxe-have
      - https://support.rockshox.com/hc/en-us/articles/48154327224219-How-many-rebound-clicks-does-the-Super-Deluxe-D1-have
      - https://freehub.com/product-reviews/2014-rockshox-pike-rct3-160mm-review
    note: >-
      Rebound count of 15 is published for both the MY23 Super Deluxe and the
      Super Deluxe D1, so it is carried by the damper rather than the model.
      The letters read as R (Rebound), C2 (dual compression) and T (Threshold).
      The RC2T FAQ describes the LSC knob as "knurled and blue" (hand-adjusted,
      the larger primary knob) and the HSC adjustment as "blue and silver",
      nestled into the top of the reservoir and turned with a 3mm hex wrench —
      the opposite size relationship from Charger 3's fork damper, where HSC is
      the larger hand knob and LSC nests smaller on top of it.

  rc2:
    name: RC2
    description: >-
      Downhill damper of the Super Deluxe Ultimate DH, with separate high- and
      low-speed compression and no climb switch. Adjustments incomplete: please
      add HSC, LSC and Rebound yourself.
    adjustments: []
    source: https://support.rockshox.com/hc/en-us/articles/17938105283355-Will-Vivid-Ultimate-DH-replace-Super-Deluxe-Ultimate-DH
    note: >-
      SRAM publishes no click counts for the DH-specific RC2. The RC2T numbers
      are deliberately NOT carried across — the gravity tune is a different
      cartridge.

  vivid_ultimate:
    name: Vivid Ultimate
    description: |-
      - Piggyback damper with five positions each of high- and low-speed compression
      - Twenty clicks of rebound
      - Five positions of adjustable hydraulic bottom-out to control the last of the stroke
    adjustments:
      - { name: HSC, type: step, min: 1, max: 5, notes: "High-Speed Compression; 5 positions in total", dialSize: small }
      - { name: LSC, type: step, min: 1, max: 5, notes: "Low-Speed Compression; 5 positions in total" }
      - { name: Rebound, type: step, max: 20, notes: Counted from fully open (fastest), dialColor: red }
      - { name: Hydraulic Bottom Out, type: step, min: 1, max: 5, notes: "Adjustable Hydraulic Bottom Out (AHBO); 5 positions in total", dialSize: small }
    source:
      - https://support.rockshox.com/hc/en-us/articles/17939326675867-How-many-positions-of-High-Speed-Compression-HSC-Low-Speed-Compression-LSC-Rebound-and-Adjustable-Hydraulic-Bottom-Out-AHBO-does-Vivid-Ultimate-have
      - https://support.rockshox.com/hc/en-us/articles/46640345306779-How-many-rebound-clicks-does-Vivid-Coil-D1-feature
      - https://support.rockshox.com/hc/en-us/articles/48154956077851-How-many-rebound-clicks-does-the-2027-Vivid-Air-D1-feature
      - https://www.pinkbike.com/news/first-ride-the-new-rockshox-vivid-ultimate.html
      - https://freehub.com/product-reviews/2014-rockshox-pike-rct3-160mm-review
    note: >-
      RockShox: "Vivid Ultimate has five positions of HSC, five positions of LSC,
      five positions AHBO, and 20 positions of Rebound." The 20-click rebound is
      separately confirmed for Vivid Coil D1 and for the 2027+ Vivid Air D1, so
      one damper key covers both the air and coil Ultimate shocks. SRAM does not
      state whether the 5-position dials are centred on a base tune the way RC2T
      is, so no centre detent is asserted here. Per Pinkbike's first-ride piece,
      LSC is a knurled hand knob while the removable rebound knob doubles as a
      3mm hex key for the small, tucked-away HSC and AHBO adjusters.

  rct:
    name: RCT
    description: >-
      Compact trail damper of the Deluxe and SIDLuxe, with compression damping,
      rebound and a climb lever. Adjustments incomplete: please add Compression
      and Rebound yourself.
    adjustments: []
    source: https://www.sram.com/en/rockshox/products/shocks
    note: >-
      Previously carried RC2T's numbers by inference; that was wrong and has been
      removed. SRAM publishes no click counts for the Deluxe/SIDLuxe damper.

  monarch_rt3:
    name: Monarch RT3
    description: >-
      Inline air damper with rebound and a three-position compression lever.
      Adjustments incomplete: please add Compression and Rebound yourself.
    adjustments: []
    source: https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/bottomless-tokens-english.pdf
    note: >-
      Model codes RS-MNR-RT3-C1..D2 in the Bottomless Tokens document confirm the
      trim; no click counts are published for the Monarch generation.

  monarch_plus_rc3:
    name: Monarch Plus RC3
    description: >-
      Piggyback air damper with rebound and a three-position compression lever
      for longer-travel bikes. Adjustments incomplete: please add Compression and
      Rebound yourself.
    adjustments: []
    source: https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/bottomless-tokens-english.pdf
    note: >-
      Model codes RS-MNRP-RC3-A2, B1-B4. No click counts published.

  deluxe_rt3:
    name: Deluxe RT3
    description: >-
      Inline trail damper with rebound and a three-position compression lever.
      Adjustments incomplete: please add Compression and Rebound yourself.
    adjustments: []
    source: https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/bottomless-tokens-english.pdf
    note: >-
      Model codes RS-DLX-RT3-A2, B1 (Deluxe <= 2022). No click counts published.

  super_deluxe_rct:
    name: Super Deluxe RCT
    description: >-
      Piggyback damper of the 2017-2022 Super Deluxe, with rebound, compression
      and a threshold lever. Adjustments incomplete: please add Compression and
      Rebound yourself.
    adjustments: []
    source: https://www.sram.com/globalassets/document-hierarchy/service-manuals/rockshox/bottomless-tokens-english.pdf
    note: >-
      Model codes RS-SDLX-RCT-A1, B1 and RS-SDLX-RC3-A2, B1 (Super Deluxe
      <= 2022). No click counts published for this generation; the current RC2T
      numbers must not be reused.

  vivid_air_r2c:
    name: Vivid Air R2C
    description: >-
      Downhill air damper with separate beginning- and ending-stroke rebound
      adjusters. Adjustments incomplete: please add the two Rebound adjusters and
      Compression yourself.
    adjustments: []
    source: https://www.sram.com/en/rockshox/products/shocks
    note: >-
      The classic Vivid Air (pre-2017). SRAM's current documentation no longer
      publishes its click counts.

# --------------------------------------------------------------------------
# Shocks — current lineup first, then earlier generations.
# Shocks are sold by stroke/eye-to-eye length to match a given frame, not by a
# fixed "travel" like forks — `stroke_mm` lists commonly offered lengths when
# published on the product page.
#
# The model-level `spring:` decides the spring adjustment; the trim-level
# `spring:` (DebonAir+, SoloAir, …) is the informational spring-variant name.
# Air shocks share the `&air_spring` anchor (Pressure), coil shocks list a
# Spring Rate. A Volume Spacers entry appears only where SRAM publishes a
# maximum token count.
# --------------------------------------------------------------------------
shocks:
  - model: "Deluxe"
    complete: false
    category: Trail
    spring: Air
    year_range: "2023-2026"
    url: https://www.sram.com/en/rockshox/series/deluxe
    trims:
      - trim: Ultimate
        key: shock-rockshox-deluxe-ultimate-2023
        dampers: [rct]
        spring: DebonAir+
        adjustments: &air_spring
          - { name: Pressure, type: numerical, unit: psi, min: 0 }
      - trim: Select+
        key: shock-rockshox-deluxe-select-plus-2023
        dampers: [rct]
        spring: DebonAir
        adjustments: *air_spring
        note: OEM only
      - trim: Select
        key: shock-rockshox-deluxe-select-2023
        dampers: [rct]
        spring: SoloAir
        adjustments: *air_spring
        note: OEM only

  - model: "Super Deluxe"
    category: Trail / Enduro
    spring: Air
    year_range: "2023-2026"
    url: https://www.sram.com/en/rockshox/series/super-deluxe
    trims:
      - trim: Ultimate
        key: shock-rockshox-super-deluxe-ultimate-2023
        dampers: [rc2t]
        spring: DebonAir+
        adjustments: *air_spring
      - trim: Select+
        key: shock-rockshox-super-deluxe-select-plus-2023
        dampers: [rc2t]
        spring: DebonAir
        adjustments: *air_spring
        note: OEM only
      - trim: Select
        key: shock-rockshox-super-deluxe-select-2023
        dampers: [rc2t]
        spring: SoloAir
        adjustments: *air_spring
        note: OEM only

  - model: "Super Deluxe Coil"
    category: Trail / Enduro
    spring: Coil
    year_range: "2023-2026"
    url: https://www.sram.com/en/rockshox/series/super-deluxe-coil
    trims:
      - trim: Ultimate
        key: shock-rockshox-super-deluxe-coil-ultimate-2023
        dampers: [rc2t]
        adjustments: &coil_spring
          - { name: Spring Rate, type: numerical, unit: lbs/in, min: 0 }
      - trim: Select+
        key: shock-rockshox-super-deluxe-coil-select-plus-2023
        dampers: [rc2t]
        adjustments: *coil_spring
        note: OEM only
      - trim: Select
        key: shock-rockshox-super-deluxe-coil-select-2023
        dampers: [rc2t]
        adjustments: *coil_spring
        note: OEM only

  - model: "Super Deluxe Ultimate DH"
    complete: false
    category: Downhill
    spring: Air
    year_range: "2023-2026"
    url: https://www.sram.com/en/rockshox/series/super-deluxe-dh
    trims:
      - trim: Ultimate DH
        key: shock-rockshox-super-deluxe-ultimate-dh-ultimate-dh-2023
        dampers: [rc2]
        spring: DebonAir+
        adjustments: *air_spring
        note: Gravity-specific tune with a narrower damping window than the trail Super Deluxe

  - model: "Vivid Air"
    category: Trail / Enduro
    spring: Air
    year_range: "2024-2026"
    url: https://www.sram.com/en/rockshox/series/vivid-air
    trims:
      - trim: Ultimate
        key: shock-rockshox-vivid-air-ultimate-2024
        dampers: [vivid_ultimate]
        spring: Vivid Air Spring
        adjustments: &vivid_air_spring
          - { name: Pressure, type: numerical, unit: psi, min: 0, notes: "Maximum 360 psi with 0-4 Bottomless Tokens, 300 psi with 5-6 Tokens or a 75mm stroke" }
          - { name: Volume Spacers, type: step, max: 6, unit: tokens, visualization: stepper, notes: "Bottomless Tokens; snap onto the inner air can; 4 maximum on 75mm-stroke shocks" }
      - trim: Ultimate DH
        key: shock-rockshox-vivid-air-ultimate-dh-2024
        dampers: [vivid_ultimate]
        spring: Vivid Air Spring
        adjustments: *vivid_air_spring
        note: Downhill build of the Vivid Air

  - model: "Vivid Coil"
    category: Trail / Enduro
    spring: Coil
    year_range: "2024-2026"
    url: https://www.sram.com/en/rockshox/series/vivid-coil
    trims:
      - trim: Ultimate
        key: shock-rockshox-vivid-coil-ultimate-2024
        dampers: [vivid_ultimate]
        adjustments: *coil_spring
        note: |-
          - Five positions each of high- and low-speed compression
          - Twenty clicks of rebound and five positions of hydraulic bottom-out
          - LSC turns by hand, HSC takes a 3mm hex key

  - model: "Vivid Coil Ultimate DH"
    category: Downhill
    spring: Coil
    year_range: "2024-2026"
    url: https://www.sram.com/en/rockshox/series/vivid-coil-dh
    trims:
      - trim: Ultimate DH
        key: shock-rockshox-vivid-coil-ultimate-dh-ultimate-dh-2024
        dampers: [vivid_ultimate]
        adjustments: *coil_spring
        note: Downhill build of the Vivid Coil

  - model: "SIDLuxe"
    complete: false
    category: XC
    spring: Air
    year_range: "2024-2026"
    url: https://www.sram.com/en/rockshox/series/sidluxe
    trims:
      - trim: Ultimate Flight Attendant
        key: shock-rockshox-sidluxe-ultimate-flight-attendant-2024
        dampers: [rct]
        spring: DebonAir+
        adjustments: &sidluxe_air_spring
          - { name: Pressure, type: numerical, unit: psi, min: 0 }
          - { name: Volume Spacers, type: step, max: 1, unit: tokens, visualization: stepper, notes: "Bottomless Token clamps onto the sealhead in a large or small size; only one fits at a time" }
        note: Compression is set electronically by Flight Attendant; the rebound dial stays manual
      - trim: Ultimate
        key: shock-rockshox-sidluxe-ultimate-2024
        dampers: [rct]
        spring: DebonAir+
        adjustments: *sidluxe_air_spring
      - trim: Select+
        key: shock-rockshox-sidluxe-select-plus-2024
        dampers: [rct]
        spring: DebonAir
        adjustments: *sidluxe_air_spring
        note: OEM only

