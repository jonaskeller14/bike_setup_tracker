              damper: [vivid_ultimate]
              size: &vivid_air_sizes
                - { size: "185x47.5/50/52.5/55", mount: Trunnion }
                - { size: "210x47.5/50/52.5/55", mount: Standard }
                - { size: "205x57.5/60/62.5/65", mount: Trunnion }
                - { size: "230x57.5/60/62.5/65", mount: Standard }
                - { size: "225x67.5/70/72.5/75", mount: Trunnion }
                - { size: "250x67.5/70/72.5/75", mount: Standard }
          - label: Ultimate DH
            level: trim
            specs: { spring: Vivid Air Spring }
            adjustments: *vivid_air_spring
            options:
              damper: [vivid_ultimate]
            note: Downhill build of the Vivid Air
      - label: "2010–2016"
        level: generation
        id: "2010"
        # Merges into the current Vivid Air row, which carries the category for the
        # whole nameplate — this generation was sold as a pure DH/freeride shock.
        years: "2010-2016"
        url: https://www.sram.com/en/rockshox/series/vivid-air
        specs: { spring: Air }
        note: Separate beginning- and ending-stroke rebound adjusters
        children:
          - label: R2C
            level: trim
            draft: true
            adjustments: *air_spring
            options:
              damper: [vivid_air_r2c]

  - label: "Vivid Coil"
    level: model
    category: Trail / Enduro
    years: "2024-2026"
    url: https://www.sram.com/en/rockshox/series/vivid-coil
    setup_guide: https://www.sram.com/en/rockshox/learn/downhill-suspension-welcome-guide
    specs: { spring: Coil }
