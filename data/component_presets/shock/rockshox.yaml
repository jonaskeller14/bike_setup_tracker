# --------------------------------------------------------------------------
# Setup guide — transcribed from docs/research/setup_guides/rockshox.md. SRAM
# publishes no per-shock chart: TrailHead's shock tune needs a serial number and
# the frame's rear-wheel travel. What is generic is the User Manual's starting
# pressure, its SAG targets per spring, the middle base tune of RC2T and Vivid
# Ultimate, and TrailHead's rebound formula, which only needs the damper's
# click count. Rebound dials with `max: ~` get no rule: the formula's N itself
# depends on that count.
# --------------------------------------------------------------------------
guides:
  rockshox_rear_shock_um:
    label: RockShox Suspension User Manual
    label_de: RockShox Fahrwerk-Bedienungsanleitung
    label_fr: Manuel d’utilisation des suspensions RockShox
    label_it: Manuale d’uso delle sospensioni RockShox
    label_es: Manual del usuario de las suspensiones RockShox
    label_pt: Manual do usuário das suspensões RockShox
    source: https://docs.sram.com/en-US/publications/5ODr3E6BhL1uWDnWhq4ATB
    rules:
      - target: pressure
        unit: psi
        input: rider_weight
        input_unit: kg
        rows: {
          50: 110, 55: 121, 60: 132, 65: 143, 70: 154,
          75: 165, 80: 176, 85: 187, 90: 198, 95: 209,
          100: 220, 105: 231, 110: 243, 115: 254, 120: 265
        }
        note: Calculated from RockShox's starting point (psi = rider weight in lb, with gear); set the final pressure by SAG
        note_de: Berechnet aus dem Ausgangspunkt von RockShox (psi = Fahrergewicht in lb, mit Ausrüstung); den endgültigen Druck über den SAG einstellen
        note_fr: Calculé à partir du point de départ de RockShox (psi = poids du pilote équipé en lb) ; réglez la pression finale au SAG
        note_it: Calcolato dal punto di partenza di RockShox (psi = peso del rider con l’attrezzatura in lb); regola la pressione finale in base al SAG
        note_es: Calculado a partir del punto de partida de RockShox (psi = peso del rider con equipo en lb); ajusta la presión final según el SAG
        note_pt: Calculado a partir do ponto de partida da RockShox (psi = peso do rider com equipamento em lb); defina a pressão final pelo SAG
      - target: rebound
        input: rider_weight
        input_unit: kg
        when: { damper: [rc2t, super_deluxe_d1] }
        rows: {
          50: max-12, 55: max-12, 60: max-11, 65: max-11, 70: max-10,
          75: max-9, 80: max-9, 85: max-8, 90: max-8, 95: max-7,
          100: max-6, 105: max-6, 110: max-5, 115: max-5, 120: max-4
        }
        note: Calculated from RockShox TrailHead's formula
        note_de: Berechnet nach der Formel von RockShox TrailHead
        note_fr: Calculé selon la formule du TrailHead de RockShox
        note_it: Calcolato con la formula del TrailHead di RockShox
        note_es: Calculado con la fórmula del TrailHead de RockShox
        note_pt: Calculado pela fórmula do TrailHead da RockShox
      - target: rebound
        input: rider_weight
        input_unit: kg
        when: { damper: vivid_ultimate }
        rows: {
          50: max-17, 55: max-16, 60: max-15, 65: max-14, 70: max-13,
          75: max-13, 80: max-12, 85: max-11, 90: max-10, 95: max-9,
          100: max-8, 105: max-8, 110: max-7, 115: max-6, 120: max-5
        }
        note: Calculated from RockShox TrailHead's formula
        note_de: Berechnet nach der Formel von RockShox TrailHead
        note_fr: Calculé selon la formule du TrailHead de RockShox
        note_it: Calcolato con la formula del TrailHead di RockShox
        note_es: Calculado con la fórmula del TrailHead de RockShox
        note_pt: Calculado pela fórmula do TrailHead da RockShox
      - { target: hsc, value: 0, when: { damper: [rc2t, vivid_ultimate] } }
      - { target: lsc, value: 0, when: { damper: [rc2t, vivid_ultimate] } }
      # DebonAir, DebonAir+ and coil springs.
      - { target: sag, range: [25, 35], comfort_at: max, note: "Around 30 %, ±5 %", note_de: "Etwa 30 %, ±5 %", note_fr: "Environ 30 %, ±5 %", note_it: "Circa il 30 %, ±5 %", note_es: "Alrededor del 30 %, ±5 %", note_pt: "Cerca de 30 %, ±5 %" }
      # SoloAir springs, then the Linear XL Super Deluxe and the classic Vivid
      # Air, for which SRAM states only its general 20-30 % band.
      - { target: sag, range: [20, 30], comfort_at: max, note: "Around 25 %, ±5 %", note_de: "Etwa 25 %, ±5 %", note_fr: "Environ 25 %, ±5 %", note_it: "Circa il 25 %, ±5 %", note_es: "Alrededor del 25 %, ±5 %", note_pt: "Cerca de 25 %, ±5 %", when: { model: [monarch, monarch-plus], trim: [rt3, xx, r] } }
      - { target: sag, range: [20, 30], comfort_at: max, note: "Around 25 %, ±5 %", note_de: "Etwa 25 %, ±5 %", note_fr: "Environ 25 %, ±5 %", note_it: "Circa il 25 %, ±5 %", note_es: "Alrededor del 25 %, ±5 %", note_pt: "Cerca de 25 %, ±5 %", when: { model: [deluxe, super-deluxe], trim: [select, rl, rc3] } }
      - { target: sag, range: [20, 30], comfort_at: max, note: "RockShox's general band for air shocks", note_de: Allgemeines Band von RockShox für Luftdämpfer, note_fr: Plage générale de RockShox pour les amortisseurs pneumatiques, note_it: Fascia generale di RockShox per gli ammortizzatori pneumatici, note_es: Banda general de RockShox para amortiguadores neumáticos, note_pt: Faixa geral da RockShox para amortecedores a ar, when: { model: super-deluxe, generation: "2027", trim: [ultimate, select-plus] } }
      - { target: sag, range: [20, 30], comfort_at: max, note: "RockShox's general band for air shocks", note_de: Allgemeines Band von RockShox für Luftdämpfer, note_fr: Plage générale de RockShox pour les amortisseurs pneumatiques, note_it: Fascia generale di RockShox per gli ammortizzatori pneumatici, note_es: Banda general de RockShox para amortiguadores neumáticos, note_pt: Faixa geral da RockShox para amortecedores a ar, when: { model: vivid-air, generation: "2010" } }
      - { target: sag, value: 30, when: { model: vivid-air, generation: "2024" } }

# --------------------------------------------------------------------------
# Shocks — current lineup first, then the models that only exist as an earlier
# generation (Monarch, Monarch Plus). A model with several generations nests
# them as `generation` nodes, newest first. Each generation gets its own
# damper id.
# Shocks are sold by stroke/eye-to-eye length to match a given frame, not by a
# fixed "travel" like forks — `options.size` lists only sizes the 2026 SRAM
# spare-parts catalog ties to that model. Eye-to-eye x stroke: the catalog's air
# can names (165/190 x 37.5-45, 185/210 x 47.5-55, 205/230 x 57.5-65,
# 225/250 x 67.5-75, 2.5 mm steps) for Super Deluxe C1-C2 and Vivid C1; mount:
# SRAM's Shock Fitment article, which states Trunnion for 165/185/205/225 and
# Standard for 190/210/230/250. Coil shocks (Super Deluxe Coil B1, Vivid Coil
# C1) are tied to strokes and both eyelet types only, so they list strokes plus
# a freeform `mounts`. Lists are written once (`&anchor`) and aliased.
#
# The model-level `specs.spring` names the spring type; a trim-level
# `specs.spring` (DebonAir+, SoloAir, …) is the informational spring-variant name.
# Air shocks share the `&air_spring` anchor (Pressure), coil shocks list a
# Spring Rate. A Volume Spacers entry appears only where SRAM publishes a
# maximum token count.
# --------------------------------------------------------------------------
nodes:
  - label: "Deluxe"
    level: model
    category: Trail
    category_de: Trail
    category_fr: Trail
    category_it: Trail
    category_es: Trail
    category_pt: Trail
    guide: rockshox_rear_shock_um
    tasks: &rockshox_service
      shock:air_can_service: &rockshox_air_can_service { interval: { moving_time_h: 50 }, source: RockShox service intervals, source_de: RockShox-Serviceintervalle, source_fr: Intervalles de révision RockShox, source_it: Intervalli di manutenzione RockShox, source_es: Intervalos de mantenimiento RockShox, source_pt: Intervalos de revisão RockShox }
      shock:full_service: &rockshox_full_service { interval: { moving_time_h: 200 }, fallback: { days: 365 }, source: RockShox service intervals, source_de: RockShox-Serviceintervalle, source_fr: Intervalles de révision RockShox, source_it: Intervalli di manutenzione RockShox, source_es: Intervalos de mantenimiento RockShox, source_pt: Intervalos de revisão RockShox }
    children:
      - label: "2023–2026"
        level: generation
        id: "2023"
        draft: true
        years: "2023-2026"
        url: https://www.sram.com/en/rockshox/series/deluxe
        specs: { spring: Air, spring_de: Luft, spring_fr: Air, spring_it: Aria, spring_es: Aire, spring_pt: Ar }
        children:
          - label: Ultimate
            level: trim
            specs: { spring: DebonAir+, spring_de: DebonAir+, spring_fr: DebonAir+, spring_it: DebonAir+, spring_es: DebonAir+, spring_pt: DebonAir+ }
            adjustments: &gen_c_air_spring
              - { name: Pressure, name_de: Luftdruck, name_fr: Pression d’air, name_it: Pressione dell’aria, name_es: Presión de aire, name_pt: Pressão do ar, type: numerical, unit: psi, min: 0 }
              - { name: Volume Spacers, name_de: Volumenspacer, name_fr: Tokens, name_it: Token, name_es: Tokens, name_pt: Tokens, type: step, max: 4, unit: tokens, visualization: stepper, notes: "Bottomless Tokens; a Linear XL air can takes up to 4 more air can tokens", notes_de: Bottomless Tokens; eine Linear-XL-Luftkammer nimmt bis zu 4 weitere Luftkammer-Tokens auf, notes_fr: Bottomless Tokens ; une chambre à air Linear XL accepte jusqu’à 4 tokens de chambre à air de plus, notes_it: Bottomless Token; una camera d’aria Linear XL accetta fino a 4 token della camera d’aria in più, notes_es: Bottomless Tokens; una cámara de aire Linear XL admite hasta 4 tokens de cámara de aire más, notes_pt: Bottomless Tokens; uma câmara de ar Linear XL aceita até 4 tokens de câmara de ar a mais }
            options:
              damper: [rct]
              size: &metric_sizes
                - { size: "165x37.5/40/42.5/45", mount: Trunnion }
                - { size: "190x37.5/40/42.5/45", mount: Standard }
                - { size: "185x47.5/50/52.5/55", mount: Trunnion }
                - { size: "210x47.5/50/52.5/55", mount: Standard }
                - { size: "205x57.5/60/62.5/65", mount: Trunnion }
                - { size: "230x57.5/60/62.5/65", mount: Standard }
                - { size: "225x67.5/70/72.5/75", mount: Trunnion }
                - { size: "250x67.5/70/72.5/75", mount: Standard }
          - label: Select+
            level: trim
            specs: { spring: DebonAir, spring_de: DebonAir, spring_fr: DebonAir, spring_it: DebonAir, spring_es: DebonAir, spring_pt: DebonAir }
            adjustments: *gen_c_air_spring
            options:
              damper: [rct]
              size: *metric_sizes
            note: OEM only
            note_de: Nur OEM
            note_fr: Uniquement en monte d’origine
            note_it: Solo primo equipaggiamento
            note_es: Solo para montaje original
            note_pt: Somente para montagem original
