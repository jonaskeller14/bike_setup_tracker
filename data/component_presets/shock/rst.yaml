# RST rear shocks — adjustment preset database
#
# Same design as shock/suntour.yaml, shock/fox.yaml: click ranges belong to
# the DAMPER, defined once under `option_values.damper` and referenced by id from each
# shock's trims. See SCHEMA.md in this folder.
#
# RST (RST Greenergy Tech Co., Taiwan) sells two rear-shock families: the air
# MONO (metric or trunnion, DPU or R damper) and the coil MEZZO (e-moto /
# freeride / downhill). RST publishes which functions each shock has, but no
# rebound or compression click counts anywhere (product pages, MONO owner's
# manual, 2026 catalogue), so every rebound/compression adjuster is left out
# and every trim is `draft: true`. See the Follow-ups footer.
#
# RST does not publish model years, so no `years` is set.

brand: RST
component_type: shock
sources:
  - https://rstsuspension.com/product-category/forks/rear-shock-forks/
  - https://rstsuspension.com/catalogues/2026.pdf
  - https://rstsuspension.com/owner-manual/
  - https://rstsuspension.com/wp-content/uploads/2026/02/01-%E8%AA%AA%E6%98%8E%E6%9B%B8-XC1800-301%E5%BE%8C%E9%81%BF%E9%9C%87-MONO-%E8%8B%B1%E6%96%87ENGLISH_A4-1.pdf
  - https://rstsuspension.com/products/mono-dpu-standard/
  - https://rstsuspension.com/products/mono-dpu-trunnion/
  - https://rstsuspension.com/products/elementor-12676/
  - https://rstsuspension.com/products/elementor-12687/
  - https://rstsuspension.com/products/elementor-12887/
updated: 2026-10-10

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    mono_dpu:
      name: MONO DPU
      description: >-
        Air-shock damper with a three-position lockout knob: Downhill (maximum
        absorption), Pedal (reduced force while pedalling) and Uphill (firmer for
        climbing), plus an external rebound adjuster.
      description_de: >-
        Luftdämpfer mit Drei-Positionen-Lockout-Knopf: Downhill (maximale
        Absorption), Pedal (reduzierte Kraft beim Treten) und Uphill (fester zum
        Klettern), plus externem Zugstufenversteller.
      description_fr: "Amortisseur pneumatique avec une molette de lockout à trois positions : Downhill (absorption maximale), Pedal (force réduite en pédalant) et Uphill (plus ferme pour grimper), plus un réglage de détente externe."
      description_it: "Ammortizzatore pneumatico con una manopola di lockout a tre posizioni: Downhill (assorbimento massimo), Pedal (forza ridotta pedalando) e Uphill (più rigido per salire), più un regolatore esterno del ritorno."
      description_es: "Amortiguador neumático con una rueda de lockout de tres posiciones: Downhill (máxima absorción), Pedal (fuerza reducida al pedalear) y Uphill (más firme para subir), más un ajuste de rebote externo."
      description_pt: "Amortecedor a ar com um seletor de lockout de três posições: Downhill (absorção máxima), Pedal (força reduzida ao pedalar) e Uphill (mais firme para subir), mais um ajuste de retorno externo."
      missing_adjustments: [Rebound]
      missing_adjustments_de: [Zugstufe]
      missing_adjustments_fr: [Détente]
      missing_adjustments_it: [Ritorno]
      missing_adjustments_es: [Rebote]
      missing_adjustments_pt: [Retorno]
      adjustments:
        - { name: Compression Mode, name_de: Druckstufenmodus, name_fr: Mode de compression, name_it: Modalità di compressione, name_es: Modo de compresión, name_pt: Modo de compressão, type: categorical, options: [Downhill, Pedal, Uphill], options_de: [Downhill, Pedal, Bergauf], options_fr: [Downhill, Pedal, Montée], options_it: [Downhill, Pedal, In salita], options_es: [Downhill, Pedal, Cuesta arriba], options_pt: [Downhill, Pedal, Subida], notes: 3-position lockout knob (D / P / U), notes_de: 3-Positionen-Lockout-Knopf (D / P / U), notes_fr: Molette de lockout à 3 positions (D / P / U), notes_it: Manopola di lockout a 3 posizioni (D / P / U), notes_es: Rueda de lockout de 3 posiciones (D / P / U), notes_pt: Seletor de lockout de 3 posições (D / P / U) }
      source:
        - https://rstsuspension.com/products/mono-dpu-standard/
        - https://rstsuspension.com/products/mono-dpu-trunnion/
        - https://rstsuspension.com/wp-content/uploads/2026/02/01-%E8%AA%AA%E6%98%8E%E6%9B%B8-XC1800-301%E5%BE%8C%E9%81%BF%E9%9C%87-MONO-%E8%8B%B1%E6%96%87ENGLISH_A4-1.pdf
      note: Rebound adjuster confirmed in the MONO owner's manual ("+" direction increases rebound damping); no click count is published.

    mono_r:
      name: MONO R
      description: >-
        Air-shock damper with an external rebound adjuster.
      description_de: >-
        Luftdämpfer mit externem Zugstufenversteller.
      description_fr: Amortisseur pneumatique avec un réglage de détente externe.
      description_it: Ammortizzatore pneumatico con un regolatore esterno del ritorno.
      description_es: Amortiguador neumático con un ajuste de rebote externo.
      description_pt: Amortecedor a ar com um ajuste de retorno externo.
      missing_adjustments: [Rebound]
      missing_adjustments_de: [Zugstufe]
      missing_adjustments_fr: [Détente]
      missing_adjustments_it: [Ritorno]
      missing_adjustments_es: [Rebote]
      missing_adjustments_pt: [Retorno]
      adjustments: []
      source:
        - https://rstsuspension.com/products/elementor-12676/
        - https://rstsuspension.com/products/elementor-12687/
        - https://rstsuspension.com/wp-content/uploads/2026/02/01-%E8%AA%AA%E6%98%8E%E6%9B%B8-XC1800-301%E5%BE%8C%E9%81%BF%E9%9C%87-MONO-%E8%8B%B1%E6%96%87ENGLISH_A4-1.pdf

    mezzo_coil:
      name: MEZZO
      description: >-
        Coil-shock damper with external compression and rebound adjusters.
      description_de: >-
        Stahlfederdämpfer mit externen Verstellern für Druckstufe und Zugstufe.
      description_fr: Amortisseur à ressort avec réglages externes de compression et de détente.
      description_it: Ammortizzatore a molla con regolatori esterni di compressione e di ritorno.
      description_es: Amortiguador de muelle con ajustes externos de compresión y de rebote.
      description_pt: Amortecedor a mola com ajustes externos de compressão e de retorno.
      missing_adjustments: [Compression, Rebound]
      missing_adjustments_de: [Druckstufe, Zugstufe]
      missing_adjustments_fr: [Compression, Détente]
      missing_adjustments_it: [Compressione, Ritorno]
      missing_adjustments_es: [Compresión, Rebote]
      missing_adjustments_pt: [Compressão, Retorno]
      adjustments: []
      source:
        - https://rstsuspension.com/products/elementor-12887/

