# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - setup_guide covers the MONO only (its owner's manual); no MEZZO manual
#     was found on rstsuspension.com/owner-manual/. No adjuster colors are
#     published.
#   - No rebound or compression click counts are published by RST for MONO
#     or MEZZO (product pages, MONO owner's manual, 2026 catalogue), so the
#     rebound (MONO DPU/R) and compression + rebound (MEZZO) adjusters are
#     left out and every trim is `draft: true`.
#   - Whether MONO DPU has a rebound adjuster is confirmed only by the shared
#     MONO owner's manual ("Adjust Rebound Damping"), not by the DPU product
#     pages, which list just the 3-position lockout.
#   - MONO owner's manual gives contradictory air limits (text: "should not
#     exceed 300 PSI"; table: "Maximum pressure is 400 psi"), so no Pressure
#     `max` is set.
#   - Second pass (2026-10-10): rstsuspension.com answered HTTP 403 to every
#     fetch (product pages, MONO manual, catalogue), and the general fork
#     manual on cdn.rstsuspension.com contains no shock figures. No editorial
#     review of a MONO or MEZZO with click counts or volume-spacer maxima was
#     found, so nothing was added.
#   - MEZZO spring rate unit is printed as "lb" only; assumed lbs/in.
#   - Eye-to-eye x stroke pairs are listed as RST prints them (e.g. 170x30/35
#     means 170mm eye-to-eye with 30mm or 35mm stroke, per the size list);
#     "Standard" mounts are recorded as "Standard eyelet".
# --------------------------------------------------------------------------
