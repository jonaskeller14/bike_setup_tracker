# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - No official SR SUNTOUR source publishes rebound/compression click
#     counts for EDGE Evo, EDGE X or RAIDON — only TRIAIR2's spec table states
#     an explicit "8 clicks rebound" (confirmed identical across its R/2CR/3CR
#     variants), which is captured above; everything else is left as
#     adjustments: [] rather than guessed.
#   - Volume-spacer max counts (mentioned as a tuning feature on EDGE Evo/EDGE
#     X/TRIAIR2 product pages) are not broken out per stroke length on the
#     pages fetched — no Volume Spacers adjustment was added rather than
#     guessing a number.
#   - The original TRIAIR (pre-TRIAIR2) product pages returned server errors
#     (HTTP 500) during verification and appear to have been superseded by
#     TRIAIR2 in the current catalog — not included as a separate model.
#   - An older EDGE generation (RS19: plain "EDGE", with LOR/LOR8/R/RC
#     variants) and EDGE Plus (RS21) are still listed in SR SUNTOUR's product
#     catalog but appear to predate the current EDGE Evo/EDGE X generation —
#     not included per the "current higher-end lineup" scope of this task.
#   - Stroke-length lists above were confirmed on each family's Metric-mount
#     product page only; Standard-eyelet/Trunnion-mount variants are assumed
#     to share the same stroke options (standard SR SUNTOUR practice) but
#     weren't independently re-verified per mount type.
# --------------------------------------------------------------------------
