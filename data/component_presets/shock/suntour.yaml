# air-sprung, so trims share the &air_spring anchor (Pressure, max 300 psi per
# the MY19 general rear shock manual's basic-setting table and warnings).
# --------------------------------------------------------------------------
nodes:
  - label: "EDGE Evo"
    level: model
    category: XC / Trail
    category_de: XC / Trail
    category_fr: XC / Trail
    category_it: XC / Trail
    category_es: XC / Trail
    category_pt: XC / Trail
    specs: { spring: Air, spring_de: Luft, spring_fr: Air, spring_it: Aria, spring_es: Aire, spring_pt: Ar }
    tasks: &suntour_service
      shock:full_service: { interval: { moving_time_h: 100 }, fallback: { days: 365 }, source: SR Suntour owner's manual, source_de: SR-Suntour-Handbuch, source_fr: Manuel d’utilisation SR Suntour, source_it: Manuale d’uso SR Suntour, source_es: Manual del usuario SR Suntour, source_pt: Manual do usuário SR Suntour }
    children:
      - label: "2025–2026"
