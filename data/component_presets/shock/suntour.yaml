# SR SUNTOUR mountain-bike rear shocks — adjustment preset database
#
# Same design as shock/fox.yaml and shock/ohlins.yaml: click ranges belong to
# the DAMPER, defined once under `option_values.damper` and referenced by id from each
# shock's trims. See SCHEMA.md in this folder.

brand: SR SUNTOUR
component_type: shock
sources:
  - https://www.srsuntour.com/products/rear-shock/
  - https://www.srsuntour.com/fileadmin/user_upload/Downloads/Consumer/Bike/Owners%20manuals/Rear%20Shock%20Manual/MY19_EN_General_Rear_shock_manual-20200623.pdf
  - https://www.srsuntour.com/fileadmin/user_upload/Downloads/Consumer/Bike/Owners%20manuals/MY_27_Rear_Shock_Manuals/SRS-2602-MY27-General-Rear-Shock-Manual-English-Web_Final.pdf
  - https://www.srsuntour.com/products/rear-shock/RS25-EDGE-EVO-2CR-METRIC-8187.html
  - https://www.srsuntour.com/products/rear-shock/RS24-EDGE-X-2CR-METRIC-8194.html
  - https://www.srsuntour.com/products/rear-shock/RS24-TRIAir2-3CR-METRIC-8203.html
  - https://www.srsuntour.com/products/rear-shock/RS24-TRIAir2-2CR-METRIC-8205.html
  - https://www.srsuntour.com/products/rear-shock/RS24-TRIAir2-R-METRIC-8207.html
  - https://www.srsuntour.com/products/rear-shock/RS25-Raidon-R-METRIC-8157.html
  - https://www.srsuntour.com/products/rear-shock/RS25-Raidon-LO-METRIC-8156.html
  - https://www.srsuntour.com/products/rear-shock/RS25-EDGE-EVO-R-METRIC-8188.html
  - https://www.srsuntour.com/products/rear-shock/RS24-EDGE-X-R-METRIC-8196.html
updated: 2026-10-13
# Service intervals (`tasks`) come from the general rear shock manual cited
# above: a full service including damper rebuild and air seal replacement
# every 100 hours or annually.
#
# Function codes on SR SUNTOUR's rear-shock spec tables ("R", "RC", "2CR",
# "3CR", "LO") follow the same PCS naming convention documented for their
# forks (fork/suntour.yaml / the suspension-fork glossary): R = rebound-only,
# 2CR/3CR = discrete-position on-the-fly compression lever + rebound, LO =
# hydraulic lockout. All current models are air-sprung.
#
# Click counts are published only as a key feature on some product pages: the
# TRIAIR2 spec table, and the EDGE Evo / EDGE X pages, state "8 click rebound"
# (R / 2CR variants). RAIDON pages state none, so its rebound dial is left
# undeclared rather than guessed — see the Follow-ups footer.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    edge_r:
      name: EDGE R
      description: >
        Rebound-only cartridge on the EDGE Evo/EDGE X shocks. External low-speed
        rebound dial; no user compression adjustment.
      adjustments:
        - { name: Rebound, type: step, max: 8 }
      source:
        - https://www.srsuntour.com/products/rear-shock/RS25-EDGE-EVO-R-METRIC-8188.html
        - https://www.srsuntour.com/products/rear-shock/RS24-EDGE-X-R-METRIC-8196.html
      note: Product pages list "8 click rebound" as a key feature of the R function.

    edge_2cr:
      name: EDGE 2CR
      description: >
        2-position on-the-fly compression lever (Open, Firm settings) plus a low-speed
        rebound dial. Shared cartridge naming/function across both EDGE Evo (XC/Trail)
        and EDGE X (reinforced eMTB) shocks.
      adjustments:
        - { name: Compression Mode, type: categorical, options: [Open, Firm], notes: 2-position on-the-fly lever }
        - { name: Rebound, type: step, max: 8 }
      source:
        - https://www.srsuntour.com/products/rear-shock/RS25-EDGE-EVO-2CR-METRIC-8187.html
        - https://www.srsuntour.com/products/rear-shock/RS24-EDGE-X-2CR-METRIC-8194.html
      note: Product pages of EDGE Evo 2CR and EDGE X 2CR list "8 click rebound" as a key feature.

    edge_evo_r_2cr:
      name: EDGE Evo R-2CR
      description: >
        Handlebar-remote version of EDGE 2CR: a remote-actuated 2-position compression
        lever (Open, Firm settings) plus a low-speed rebound dial.
      adjustments:
        - { name: Compression Mode, type: categorical, options: [Open, Firm], notes: Handlebar-remote 2-position lever }
        - { name: Rebound, type: step, max: 8 }
      source: https://www.srsuntour.com/products/rear-shock/RS25-EDGE-EVO-R-METRIC-8188.html
      note: The EDGE Evo family page (R / 2CR / R-2CR) lists "8 click rebound"; the R-2CR page itself could not be loaded.

    triair2_r:
      name: TRIAIR2 R
      description: >
        Rebound-only cartridge on the TRIAIR2 piggyback shock. Officially
        published spec: 8 clicks of rebound. Also features an air-backed IFP
        and volume-spacer spring-curve adjustment.
      adjustments:
        - { name: Rebound, type: step, max: 8 }

    triair2_2cr:
      name: TRIAIR2 2CR
      description: >
        TRIAIR2 cartridge with a 2-position on-the-fly compression lever (Open,
        Firm settings) plus the same 8-click rebound dial as the R variant.
      adjustments:
        - { name: Compression Mode, type: categorical, options: [Open, Firm], notes: 2-position on-the-fly lever }
        - { name: Rebound, type: step, max: 8 }

    triair2_3cr:
      name: TRIAIR2 3CR
      description: >
        TRIAIR2 cartridge with a 3-position on-the-fly compression lever (Open,
        Medium, Firm settings) plus the same 8-click rebound dial as the R
        variant.
      adjustments:
        - { name: Compression Mode, type: categorical, options: [Open, Medium, Firm], notes: 3-position on-the-fly lever }
        - { name: Rebound, type: step, max: 8 }

    raidon_shock_r:
      name: RAIDON R
      description: >
        Rebound-only cartridge on the RAIDON XC/Trail shock. External low-speed
        rebound dial; no user compression adjustment.
      missing_adjustments: [Rebound]
      adjustments: []
      note: Rebound click count is not published by SR SUNTOUR.

    raidon_shock_lo:
      name: RAIDON LO
      description: >
        Hydraulic lockout variant of the RAIDON shock (fixed-rate damping when
        unlocked).
      adjustments:
        - { name: Lockout, type: boolean, notes: Hydraulic lockout lever }

# --------------------------------------------------------------------------
# Setup guides — transcribed from docs/research/setup_guides/suntour.md.
#   * The MY27 manual prints no rider-weight table; only the SAG band per
#     shock stroke is a recommendation. Strokes between two printed rows are
#     interpolated (52.5 and 57.5mm fall between bands); 27.5mm is below the
#     table. Factory pressures (main 180 / reservoir 180 psi on TRIAIR2,
#     110 psi elsewhere) are shipping values, and the rebound advice (start
#     closed, open two clicks at a time) is a procedure, so neither is a rule.
# --------------------------------------------------------------------------
guides:
  suntour_shocks_my27:
    label: SR SUNTOUR general rear shock manual (MY27)
    source: https://www.srsuntour.com/fileadmin/user_upload/Downloads/Consumer/Bike/Owners%20manuals/MY_27_Rear_Shock_Manuals/SRS-2602-MY27-General-Rear-Shock-Manual-English-Web_Final.pdf
    rules:
      - target: sag
        input: stroke_mm
        rows: {
          30: [20, 25], 35: [20, 25], 40: [20, 25], 45: [20, 25], 50: [20, 25],
          55: [25, 30], 60: [25, 35], 65: [25, 35], 70: [25, 35], 75: [25, 35]
        }
        note: Measured with the compression open

# --------------------------------------------------------------------------
# Shocks — current (2025/2026) SR SUNTOUR MTB lineup. Shocks are sold by
# eye-to-eye/stroke length to fit a given frame; `options.size` lists the
# combinations published on the official product page. All current models are
# air-sprung, so trims share the &air_spring anchor (Pressure, max 300 psi per
# the MY19 general rear shock manual's basic-setting table and warnings).
# --------------------------------------------------------------------------
nodes:
  - label: "EDGE Evo"
    level: model
    category: XC / Trail
    specs: { spring: Air }
    tasks: &suntour_service
      shock:full_service: { interval: { moving_time_h: 100 }, fallback: { days: 365 }, source: SR Suntour owner's manual }
    children:
      - label: "2025–2026"
        level: generation
        id: "2025"
        years: "2025-2026"
        url: https://www.srsuntour.com/products/rear-shock/RS25-EDGE-EVO-2CR-METRIC-8187.html
        setup_guide: https://www.srsuntour.com/fileadmin/user_upload/Downloads/Consumer/Bike/Owners%20manuals/MY_27_Rear_Shock_Manuals/SRS-2602-MY27-General-Rear-Shock-Manual-English-Web_Final.pdf
        guide: suntour_shocks_my27
        children:
          - label: 2CR
            level: trim
            mounts: [Metric, Trunnion, Standard eyelet]
            adjustments: &air_spring
              - { name: Pressure, type: numerical, unit: psi, min: 0, max: 300 }
            options:
              damper: [edge_2cr]
              size: ["230x57.5/60/62.5/65", "210x47.5/50/52.5/55", "190x37.5/40/42.5/45"]
            note: Glide ring; air-volume-spacer spring-curve adjustment.
          - label: R
            level: trim
            url: https://www.srsuntour.com/products/rear-shock/RS25-EDGE-EVO-R-METRIC-8188.html
            mounts: [Metric, Trunnion, Standard eyelet]
            adjustments: *air_spring
            options:
              damper: [edge_r]
              size: ["230x57.5/60/62.5/65", "210x47.5/50/52.5/55", "190x37.5/40/42.5/45"]
          - label: R-2CR
            level: trim
            url: https://www.srsuntour.com/products/rear-shock/RS25-EDGE-EVO-R-2CR-METRIC-8201.html
            mounts: [Metric, Trunnion, Standard eyelet]
            adjustments: *air_spring
            options:
              damper: [edge_evo_r_2cr]
              size: ["230x57.5/60/62.5/65", "210x47.5/50/52.5/55", "190x37.5/40/42.5/45"]
            note: Handlebar-remote compression lever.

  - label: "EDGE X"
    level: model
    category: Trail (eMTB, reinforced)
    specs: { spring: Air }
    tasks: *suntour_service
    children:
      - label: "2024–2026"
        level: generation
        id: "2024"
        years: "2024-2026"
        url: https://www.srsuntour.com/products/rear-shock/RS24-EDGE-X-2CR-METRIC-8194.html
        setup_guide: https://www.srsuntour.com/fileadmin/user_upload/Downloads/Consumer/Bike/Owners%20manuals/MY_27_Rear_Shock_Manuals/SRS-2602-MY27-General-Rear-Shock-Manual-English-Web_Final.pdf
        guide: suntour_shocks_my27
        children:
          - label: 2CR
            level: trim
            mounts: [Metric, Trunnion, Standard eyelet]
            adjustments: *air_spring
            options:
              damper: [edge_2cr]
              size: ["210x47.5/50/52.5/55", "190x37.5/40/42.5/45", "170x27.5/30/32.5/35"]
            note: Reinforced/updated structure for demands of modern full-suspension e-MTBs.
          - label: R
            level: trim
            url: https://www.srsuntour.com/products/rear-shock/RS24-EDGE-X-R-METRIC-8196.html
            mounts: [Metric, Trunnion, Standard eyelet]
            adjustments: *air_spring
            options:
              damper: [edge_r]
              size: ["210x47.5/50/52.5/55", "190x37.5/40/42.5/45", "170x27.5/30/32.5/35"]

  - label: "TRIAIR2"
    level: model
    category: Enduro (eMTB)
    specs: { spring: Air }
    tasks: *suntour_service
    children:
      - label: "2024–2026"
        level: generation
        id: "2024"
        years: "2024-2026"
        url: https://www.srsuntour.com/products/rear-shock/RS24-TRIAir2-3CR-METRIC-8203.html
        setup_guide: https://www.srsuntour.com/fileadmin/user_upload/Downloads/Consumer/Bike/Owners%20manuals/MY_27_Rear_Shock_Manuals/SRS-2602-MY27-General-Rear-Shock-Manual-English-Web_Final.pdf
        guide: suntour_shocks_my27
        children:
          - label: 3CR
            level: trim
            mounts: [Metric, Trunnion, Standard eyelet]
            adjustments: &triair2_air_spring
              - { name: Pressure, type: numerical, unit: psi, min: 0, max: 300 }
              - { name: Reservoir Pressure, type: numerical, unit: psi, min: 170, max: 200, notes: "Air-backed piggyback reservoir (IFP); ships at 180 psi" }
            options:
              damper: [triair2_3cr]
              size: ["250x67.5/70/72.5/75", "230x57.5/60/62.5/65", "210x47.5/50/52.5/55", "190x37.5/40/42.5/45"]
            note: Redesigned piggyback for better oil flow/clearance; air-backed IFP; volume-spacer spring-curve adjustment; glide ring.
          - label: 2CR
            level: trim
            url: https://www.srsuntour.com/products/rear-shock/RS24-TRIAir2-2CR-METRIC-8205.html
            mounts: [Metric, Trunnion, Standard eyelet]
            adjustments: *triair2_air_spring
            options:
              damper: [triair2_2cr]
              size: ["250x67.5/70/72.5/75", "230x57.5/60/62.5/65", "210x47.5/50/52.5/55", "190x37.5/40/42.5/45"]
          - label: R
            level: trim
            url: https://www.srsuntour.com/products/rear-shock/RS24-TRIAir2-R-METRIC-8207.html
            mounts: [Metric, Trunnion, Standard eyelet]
            adjustments: *triair2_air_spring
            options:
              damper: [triair2_r]
              size: ["250x67.5/70/72.5/75", "230x57.5/60/62.5/65", "210x47.5/50/52.5/55", "190x37.5/40/42.5/45"]

  - label: "RAIDON"
    level: model
    category: XC / Trail
    specs: { spring: Air }
    tasks: *suntour_service
    children:
      - label: "2025–2026"
        level: generation
        id: "2025"
        years: "2025-2026"
        url: https://www.srsuntour.com/products/rear-shock/RS25-Raidon-R-METRIC-8157.html
        setup_guide: https://www.srsuntour.com/fileadmin/user_upload/Downloads/Consumer/Bike/Owners%20manuals/MY_27_Rear_Shock_Manuals/SRS-2602-MY27-General-Rear-Shock-Manual-English-Web_Final.pdf
        guide: suntour_shocks_my27
        children:
          - label: R
            level: trim
            draft: true
            mounts: [Metric, Standard eyelet]
            adjustments: *air_spring
            options:
              damper: [raidon_shock_r]
              size: ["190x37.5/40/42.5/45", "170x27.5/30/32.5/35"]
          - label: LO
            level: trim
            url: https://www.srsuntour.com/products/rear-shock/RS25-Raidon-LO-METRIC-8156.html
            mounts: [Metric, Standard eyelet]
            adjustments: *air_spring
            options:
              damper: [raidon_shock_lo]
              size: ["190x37.5/40/42.5/45", "170x27.5/30/32.5/35"]

# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - setup_guide is the MY27 general rear shock manual for every model; no
#     adjuster knob colors are published, so none are set. Pressure maxima
#     and the TRIAIR2 reservoir limits (170-200 psi) match the MY27 edition.
#   - Click counts: EDGE Evo (R, 2CR, R-2CR), EDGE X (R, 2CR) and TRIAIR2 pages
#     state "8 click rebound". The EDGE Evo R-2CR page (and the TRIAIR2 2CR
#     page) returned HTTP 503 on the last check, so R-2CR relies on the family
#     listing. RAIDON R / LO pages state no rebound count, so RAIDON R stays
#     `draft: true` with its rebound undeclared. No compression click counts
#     exist (all compression is a 2/3-position lever).
#   - Volume spacers: the EDGE / TRIAIR2 pages and the MY19 manual (p.9) describe
#     air volume spacers (LV / LVN / SV air sleeves) but state no maximum count,
#     so no Volume Spacers adjustment is added.
#   - The original TRIAIR (pre-TRIAIR2) product pages returned server errors
#     (HTTP 500) during verification and appear to have been superseded by
#     TRIAIR2 in the current catalog — not included as a separate model.
#   - An older EDGE generation (RS19: plain "EDGE", with LOR/LOR8/R/RC
#     variants) and EDGE Plus (RS21) are still listed in SR SUNTOUR's product
#     catalog but appear to predate the current EDGE Evo/EDGE X generation —
#     not included per the "current higher-end lineup" scope of this task.
#   - Stroke-length lists above were confirmed on each family's Metric-mount
#     product page only; Standard-eyelet/Trunnion-mount variants are assumed
#     to share the same stroke options (standard SR SUNTOUR practice) but
#     weren't independently re-verified per mount type.
# --------------------------------------------------------------------------
