# SR SUNTOUR mountain-bike rear shocks — adjustment preset database
#
# Same design as shock/fox.yaml and shock/ohlins.yaml: click ranges belong to
# the DAMPER, defined once under `option_values.damper` and referenced by id from each
# shock's trims. See SCHEMA.md in this folder.

brand: SR SUNTOUR
component_type: shock
sources:
  - https://www.srsuntour.com/products/rear-shock/
  - https://www.srsuntour.com/fileadmin/user_upload/Downloads/Consumer/Bike/Owners%20manuals/Rear%20Shock%20Manual/MY19_EN_General_Rear_shock_manual-20200623.pdf
  - https://www.srsuntour.com/fileadmin/user_upload/Downloads/Consumer/Bike/Owners%20manuals/MY_27_Rear_Shock_Manuals/SRS-2602-MY27-General-Rear-Shock-Manual-English-Web_Final.pdf
  - https://www.srsuntour.com/products/rear-shock/RS25-EDGE-EVO-2CR-METRIC-8187.html
  - https://www.srsuntour.com/products/rear-shock/RS24-EDGE-X-2CR-METRIC-8194.html
  - https://www.srsuntour.com/products/rear-shock/RS24-TRIAir2-3CR-METRIC-8203.html
  - https://www.srsuntour.com/products/rear-shock/RS24-TRIAir2-2CR-METRIC-8205.html
  - https://www.srsuntour.com/products/rear-shock/RS24-TRIAir2-R-METRIC-8207.html
  - https://www.srsuntour.com/products/rear-shock/RS25-Raidon-R-METRIC-8157.html
  - https://www.srsuntour.com/products/rear-shock/RS25-Raidon-LO-METRIC-8156.html
  - https://www.srsuntour.com/products/rear-shock/RS25-EDGE-EVO-R-METRIC-8188.html
  - https://www.srsuntour.com/products/rear-shock/RS24-EDGE-X-R-METRIC-8196.html
updated: 2026-10-13
# Service intervals (`tasks`) come from the general rear shock manual cited
# above: a full service including damper rebuild and air seal replacement
# every 100 hours or annually.
#
# Function codes on SR SUNTOUR's rear-shock spec tables ("R", "RC", "2CR",
# "3CR", "LO") follow the same PCS naming convention documented for their
# forks (fork/suntour.yaml / the suspension-fork glossary): R = rebound-only,
# 2CR/3CR = discrete-position on-the-fly compression lever + rebound, LO =
# hydraulic lockout. All current models are air-sprung.
#
# Click counts are published only as a key feature on some product pages: the
# TRIAIR2 spec table, and the EDGE Evo / EDGE X pages, state "8 click rebound"
# (R / 2CR variants). RAIDON pages state none, so its rebound dial is left
# undeclared rather than guessed — see the Follow-ups footer.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    edge_r:
      name: EDGE R
      description: >
        Rebound-only cartridge on the EDGE Evo/EDGE X shocks. External low-speed
        rebound dial; no user compression adjustment.
      description_de: >
        Reine Zugstufenkartusche der EDGE-Evo-/EDGE-X-Dämpfer. Externes
        Low-Speed-Zugstufenrad; keine Druckstufenverstellung durch den Fahrer.
      description_fr: Cartouche de détente seule des amortisseurs EDGE Evo/EDGE X. Molette externe de détente basse vitesse ; pas de réglage de compression pour l’utilisateur.
      description_it: Cartuccia solo ritorno degli ammortizzatori EDGE Evo/EDGE X. Manopola esterna del ritorno a bassa velocità; nessuna regolazione della compressione per l’utente.
      description_es: Cartucho solo de rebote de los amortiguadores EDGE Evo/EDGE X. Rueda externa de rebote de baja velocidad; sin ajuste de compresión para el usuario.
      description_pt: Cartucho somente de retorno dos amortecedores EDGE Evo/EDGE X. Seletor externo de retorno de baixa velocidade; sem ajuste de compressão para o usuário.
      adjustments:
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 8 }
      source:
        - https://www.srsuntour.com/products/rear-shock/RS25-EDGE-EVO-R-METRIC-8188.html
        - https://www.srsuntour.com/products/rear-shock/RS24-EDGE-X-R-METRIC-8196.html
      note: Product pages list "8 click rebound" as a key feature of the R function.

    edge_2cr:
      name: EDGE 2CR
      description: >
        2-position on-the-fly compression lever (Open, Firm settings) plus a low-speed
        rebound dial. Shared cartridge naming/function across both EDGE Evo (XC/Trail)
        and EDGE X (reinforced eMTB) shocks.
      description_de: >
        2-Positionen-Druckstufenhebel zum Umschalten während der Fahrt
        (Einstellungen Open, Firm) plus Low-Speed-Zugstufenrad. Gleiche
        Kartuschenbezeichnung und -funktion bei EDGE Evo (XC/Trail) und EDGE X
        (verstärkter E-MTB).
      description_fr: Levier de compression à 2 positions utilisable en roulant (réglages Open, Firm) plus une molette de détente basse vitesse. Nom et fonction de cartouche partagés par les amortisseurs EDGE Evo (XC/Trail) et EDGE X (eMTB renforcé).
      description_it: Leva di compressione a 2 posizioni azionabile in marcia (impostazioni Open, Firm) più una manopola del ritorno a bassa velocità. Nome e funzione della cartuccia in comune tra gli ammortizzatori EDGE Evo (XC/Trail) ed EDGE X (e-MTB rinforzata).
      description_es: Palanca de compresión de 2 posiciones accionable en marcha (ajustes Open, Firm) más una rueda de rebote de baja velocidad. Nombre y función del cartucho compartidos por los amortiguadores EDGE Evo (XC/Trail) y EDGE X (e-MTB reforzada).
      description_pt: Alavanca de compressão de 2 posições acionável em movimento (ajustes Open, Firm) mais um seletor de retorno de baixa velocidade. Nome e função do cartucho compartilhados pelos amortecedores EDGE Evo (XC/Trail) e EDGE X (e-MTB reforçada).
      adjustments:
        - { name: Compression Mode, name_de: Druckstufenmodus, name_fr: Mode de compression, name_it: Modalità di compressione, name_es: Modo de compresión, name_pt: Modo de compressão, type: categorical, options: [Open, Firm], options_de: [Offen, Fest], options_fr: [Ouvert, Ferme], options_it: [Aperto, Rigido], options_es: [Abierto, Firme], options_pt: [Aberto, Firme], notes: 2-position on-the-fly lever, notes_de: 2-Positionen-Hebel zum Umschalten während der Fahrt, notes_fr: "Levier à 2 positions, utilisable en roulant", notes_it: "Leva a 2 posizioni, azionabile in marcia", notes_es: "Palanca de 2 posiciones, accionable en marcha", notes_pt: "Alavanca de 2 posições, acionável em movimento" }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 8 }
      source:
        - https://www.srsuntour.com/products/rear-shock/RS25-EDGE-EVO-2CR-METRIC-8187.html
        - https://www.srsuntour.com/products/rear-shock/RS24-EDGE-X-2CR-METRIC-8194.html
      note: Product pages of EDGE Evo 2CR and EDGE X 2CR list "8 click rebound" as a key feature.

    edge_evo_r_2cr:
      name: EDGE Evo R-2CR
      description: >
        Handlebar-remote version of EDGE 2CR: a remote-actuated 2-position compression
        lever (Open, Firm settings) plus a low-speed rebound dial.
      description_de: >
        Lenkerfernbedienungs-Version der EDGE 2CR: ein ferngesteuerter
        2-Positionen-Druckstufenhebel (Einstellungen Open, Firm) plus
        Low-Speed-Zugstufenrad.
      description_fr: "Version à commande au guidon de l’EDGE 2CR : un levier de compression à 2 positions télécommandé (réglages Open, Firm) plus une molette de détente basse vitesse."
      description_it: "Versione con comando al manubrio dell’EDGE 2CR: una leva di compressione a 2 posizioni con comando remoto (impostazioni Open, Firm) più una manopola del ritorno a bassa velocità."
      description_es: "Versión con mando de manillar del EDGE 2CR: una palanca de compresión de 2 posiciones con control remoto (ajustes Open, Firm) más una rueda de rebote de baja velocidad."
      description_pt: "Versão com comando no guidão do EDGE 2CR: uma alavanca de compressão de 2 posições com controle remoto (ajustes Open, Firm) mais um seletor de retorno de baixa velocidade."
      adjustments:
        - { name: Compression Mode, name_de: Druckstufenmodus, name_fr: Mode de compression, name_it: Modalità di compressione, name_es: Modo de compresión, name_pt: Modo de compressão, type: categorical, options: [Open, Firm], options_de: [Offen, Fest], options_fr: [Ouvert, Ferme], options_it: [Aperto, Rigido], options_es: [Abierto, Firme], options_pt: [Aberto, Firme], notes: Handlebar-remote 2-position lever, notes_de: 2-Positionen-Hebel mit Lenkerfernbedienung, notes_fr: Levier à 2 positions déporté au guidon, notes_it: Leva a 2 posizioni remota al manubrio, notes_es: Palanca de 2 posiciones remota en el manillar, notes_pt: Alavanca de 2 posições remota no guidão }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 8 }
      source: https://www.srsuntour.com/products/rear-shock/RS25-EDGE-EVO-R-METRIC-8188.html
      note: The EDGE Evo family page (R / 2CR / R-2CR) lists "8 click rebound"; the R-2CR page itself could not be loaded.

    triair2_r:
      name: TRIAIR2 R
      description: >
        Rebound-only cartridge on the TRIAIR2 piggyback shock. Officially
        published spec: 8 clicks of rebound. Also features an air-backed IFP
        and volume-spacer spring-curve adjustment.
      description_de: >
        Reine Zugstufenkartusche des TRIAIR2-Piggyback-Dämpfers. Offiziell
        veröffentlichte Angabe: 8 Klicks Zugstufe. Mit luftunterstütztem IFP und
        Anpassung der Federkennlinie über Volumenspacer.
      description_fr: "Cartouche de détente seule de l’amortisseur piggyback TRIAIR2. Caractéristique officielle publiée : 8 clics de détente. Comporte aussi un IFP à contre-pression d’air et un réglage de la courbe du ressort par tokens de volume."
      description_it: "Cartuccia solo ritorno dell’ammortizzatore piggyback TRIAIR2. Specifica ufficiale pubblicata: 8 scatti di ritorno. Ha anche un IFP con contropressione d’aria e la regolazione della curva della molla con token di volume."
      description_es: "Cartucho solo de rebote del amortiguador piggyback TRIAIR2. Dato oficial publicado: 8 clics de rebote. También incluye un IFP con respaldo de aire y ajuste de la curva del muelle con tokens de volumen."
      description_pt: "Cartucho somente de retorno do amortecedor piggyback TRIAIR2. Especificação oficial publicada: 8 cliques de retorno. Também traz um IFP com contrapressão de ar e ajuste da curva da mola com tokens de volume."
      adjustments:
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 8 }

    triair2_2cr:
      name: TRIAIR2 2CR
      description: >
        TRIAIR2 cartridge with a 2-position on-the-fly compression lever (Open,
        Firm settings) plus the same 8-click rebound dial as the R variant.
      description_de: >
        TRIAIR2-Kartusche mit 2-Positionen-Druckstufenhebel zum Umschalten
        während der Fahrt (Einstellungen Open, Firm) plus demselben Zugstufenrad
        mit 8 Klicks wie die R-Variante.
      description_fr: Cartouche TRIAIR2 avec un levier de compression à 2 positions utilisable en roulant (réglages Open, Firm) plus la même molette de détente à 8 clics que la variante R.
      description_it: Cartuccia TRIAIR2 con una leva di compressione a 2 posizioni azionabile in marcia (impostazioni Open, Firm) più la stessa manopola del ritorno a 8 scatti della variante R.
      description_es: Cartucho TRIAIR2 con una palanca de compresión de 2 posiciones accionable en marcha (ajustes Open, Firm) más la misma rueda de rebote de 8 clics que la variante R.
      description_pt: Cartucho TRIAIR2 com uma alavanca de compressão de 2 posições acionável em movimento (ajustes Open, Firm) mais o mesmo seletor de retorno de 8 cliques da variante R.
      adjustments:
        - { name: Compression Mode, name_de: Druckstufenmodus, name_fr: Mode de compression, name_it: Modalità di compressione, name_es: Modo de compresión, name_pt: Modo de compressão, type: categorical, options: [Open, Firm], options_de: [Offen, Fest], options_fr: [Ouvert, Ferme], options_it: [Aperto, Rigido], options_es: [Abierto, Firme], options_pt: [Aberto, Firme], notes: 2-position on-the-fly lever, notes_de: 2-Positionen-Hebel zum Umschalten während der Fahrt, notes_fr: "Levier à 2 positions, utilisable en roulant", notes_it: "Leva a 2 posizioni, azionabile in marcia", notes_es: "Palanca de 2 posiciones, accionable en marcha", notes_pt: "Alavanca de 2 posições, acionável em movimento" }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 8 }

    triair2_3cr:
      name: TRIAIR2 3CR
      description: >
        TRIAIR2 cartridge with a 3-position on-the-fly compression lever (Open,
        Medium, Firm settings) plus the same 8-click rebound dial as the R
        variant.
      description_de: >
        TRIAIR2-Kartusche mit 3-Positionen-Druckstufenhebel zum Umschalten
        während der Fahrt (Einstellungen Open, Medium, Firm) plus demselben
        Zugstufenrad mit 8 Klicks wie die R-Variante.
      description_fr: Cartouche TRIAIR2 avec un levier de compression à 3 positions utilisable en roulant (réglages Open, Medium, Firm) plus la même molette de détente à 8 clics que la variante R.
      description_it: Cartuccia TRIAIR2 con una leva di compressione a 3 posizioni azionabile in marcia (impostazioni Open, Medium, Firm) più la stessa manopola del ritorno a 8 scatti della variante R.
      description_es: Cartucho TRIAIR2 con una palanca de compresión de 3 posiciones accionable en marcha (ajustes Open, Medium, Firm) más la misma rueda de rebote de 8 clics que la variante R.
      description_pt: Cartucho TRIAIR2 com uma alavanca de compressão de 3 posições acionável em movimento (ajustes Open, Medium, Firm) mais o mesmo seletor de retorno de 8 cliques da variante R.
      adjustments:
        - { name: Compression Mode, name_de: Druckstufenmodus, name_fr: Mode de compression, name_it: Modalità di compressione, name_es: Modo de compresión, name_pt: Modo de compressão, type: categorical, options: [Open, Medium, Firm], options_de: [Offen, Medium, Fest], options_fr: [Ouvert, Medium, Ferme], options_it: [Aperto, Medium, Rigido], options_es: [Abierto, Medium, Firme], options_pt: [Aberto, Medium, Firme], notes: 3-position on-the-fly lever, notes_de: 3-Positionen-Hebel zum Umschalten während der Fahrt, notes_fr: "Levier à 3 positions, utilisable en roulant", notes_it: "Leva a 3 posizioni, azionabile in marcia", notes_es: "Palanca de 3 posiciones, accionable en marcha", notes_pt: "Alavanca de 3 posições, acionável em movimento" }
        - { name: Rebound, name_de: Zugstufe, name_fr: Détente, name_it: Ritorno, name_es: Rebote, name_pt: Retorno, type: step, max: 8 }

    raidon_shock_r:
      name: RAIDON R
      description: >
        Rebound-only cartridge on the RAIDON XC/Trail shock. External low-speed
        rebound dial; no user compression adjustment.
      description_de: >
        Reine Zugstufenkartusche des RAIDON-XC/Trail-Dämpfers. Externes
        Low-Speed-Zugstufenrad; keine Druckstufenverstellung durch den Fahrer.
      description_fr: Cartouche de détente seule de l’amortisseur RAIDON XC/Trail. Molette externe de détente basse vitesse ; pas de réglage de compression pour l’utilisateur.
      description_it: Cartuccia solo ritorno dell’ammortizzatore RAIDON XC/Trail. Manopola esterna del ritorno a bassa velocità; nessuna regolazione della compressione per l’utente.
      description_es: Cartucho solo de rebote del amortiguador RAIDON XC/Trail. Rueda externa de rebote de baja velocidad; sin ajuste de compresión para el usuario.
      description_pt: Cartucho somente de retorno do amortecedor RAIDON XC/Trail. Seletor externo de retorno de baixa velocidade; sem ajuste de compressão para o usuário.
      missing_adjustments: [Rebound]
      missing_adjustments_de: [Zugstufe]
      missing_adjustments_fr: [Détente]
      missing_adjustments_it: [Ritorno]
      missing_adjustments_es: [Rebote]
      missing_adjustments_pt: [Retorno]
      adjustments: []
      note: Rebound click count is not published by SR SUNTOUR.

    raidon_shock_lo:
      name: RAIDON LO
      description: >
        Hydraulic lockout variant of the RAIDON shock (fixed-rate damping when
        unlocked).
      description_de: >
        Variante des RAIDON-Dämpfers mit hydraulischem Lockout (feste
        Dämpfungsrate im entsperrten Zustand).
      description_fr: Variante à lockout hydraulique de l’amortisseur RAIDON (amortissement à taux fixe lorsqu’il est déverrouillé).
      description_it: Variante con lockout idraulico dell’ammortizzatore RAIDON (smorzamento a rapporto fisso quando è sbloccato).
      description_es: Variante de lockout hidráulico del amortiguador RAIDON (amortiguación de tasa fija cuando está desbloqueado).
      description_pt: Variante com lockout hidráulico do amortecedor RAIDON (amortecimento de taxa fixa quando destravado).
      adjustments:
        - { name: Lockout, name_de: Lockout, name_fr: Lockout, name_it: Lockout, name_es: Lockout, name_pt: Lockout, type: boolean, notes: Hydraulic lockout lever, notes_de: Hydraulischer Lockout-Hebel, notes_fr: Levier de lockout hydraulique, notes_it: Leva di lockout idraulico, notes_es: Palanca de lockout hidráulico, notes_pt: Alavanca de lockout hidráulico }

# --------------------------------------------------------------------------
# Setup guides — transcribed from docs/research/setup_guides/suntour.md.
#   * The MY27 manual prints no rider-weight table; only the SAG band per
#     shock stroke is a recommendation. Strokes between two printed rows are
#     interpolated (52.5 and 57.5mm fall between bands); 27.5mm is below the
#     table. Factory pressures (main 180 / reservoir 180 psi on TRIAIR2,
#     110 psi elsewhere) are shipping values, and the rebound advice (start
#     closed, open two clicks at a time) is a procedure, so neither is a rule.
# --------------------------------------------------------------------------
guides:
  suntour_shocks_my27:
    label: SR SUNTOUR general rear shock manual (MY27)
    label_de: SR SUNTOUR Allgemeine Dämpferanleitung (MY27)
    label_fr: Manuel général des amortisseurs arrière SR SUNTOUR (MY27)
    label_it: Manuale generale degli ammortizzatori posteriori SR SUNTOUR (MY27)
    label_es: Manual general de amortiguadores traseros SR SUNTOUR (MY27)
    label_pt: Manual geral de amortecedores traseiros SR SUNTOUR (MY27)
    source: https://www.srsuntour.com/fileadmin/user_upload/Downloads/Consumer/Bike/Owners%20manuals/MY_27_Rear_Shock_Manuals/SRS-2602-MY27-General-Rear-Shock-Manual-English-Web_Final.pdf
    rules:
      - target: sag
        input: stroke_mm
        rows: {
          30: [20, 25], 35: [20, 25], 40: [20, 25], 45: [20, 25], 50: [20, 25],
          55: [25, 30], 60: [25, 35], 65: [25, 35], 70: [25, 35], 75: [25, 35]
        }
        note: Measured with the compression open
        note_de: Bei geöffneter Druckstufe gemessen
        note_fr: Mesuré avec la compression ouverte
        note_it: Misurato con la compressione aperta
        note_es: Medido con la compresión abierta
        note_pt: Medido com a compressão aberta

# --------------------------------------------------------------------------
