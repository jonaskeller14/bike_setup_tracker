# SR SUNTOUR mountain-bike rear shocks — adjustment preset database
#
# Same design as shock/fox.yaml and shock/ohlins.yaml: click ranges belong to
# the DAMPER, defined once under `option_values.damper` and referenced by id from each
# shock's trims. See SCHEMA.md in this folder.

brand: SR SUNTOUR
component_type: shock
sources:
  - https://www.srsuntour.com/products/rear-shock/
  - https://www.srsuntour.com/fileadmin/user_upload/Downloads/Consumer/Bike/Owners%20manuals/Rear%20Shock%20Manual/MY19_EN_General_Rear_shock_manual-20200623.pdf
  - https://www.srsuntour.com/products/rear-shock/RS25-EDGE-EVO-2CR-METRIC-8187.html
  - https://www.srsuntour.com/products/rear-shock/RS24-EDGE-X-2CR-METRIC-8194.html
  - https://www.srsuntour.com/products/rear-shock/RS24-TRIAir2-3CR-METRIC-8203.html
  - https://www.srsuntour.com/products/rear-shock/RS24-TRIAir2-2CR-METRIC-8205.html
  - https://www.srsuntour.com/products/rear-shock/RS24-TRIAir2-R-METRIC-8207.html
  - https://www.srsuntour.com/products/rear-shock/RS25-Raidon-R-METRIC-8157.html
  - https://www.srsuntour.com/products/rear-shock/RS25-Raidon-LO-METRIC-8156.html
updated: 2026-07-18
# Function codes on SR SUNTOUR's rear-shock spec tables ("R", "RC", "2CR",
# "3CR", "LO") follow the same PCS naming convention documented for their
# forks (fork/suntour.yaml / the suspension-fork glossary): R = rebound-only,
# 2CR/3CR = discrete-position on-the-fly compression lever + rebound, LO =
# hydraulic lockout. All current models are air-sprung.
#
# Click counts are almost never published on official product pages — the one
# confirmed exception is the TRIAIR2 family, whose spec table explicitly
# states "8 clicks rebound" for every variant (R/2CR/3CR). Every other
# rebound/compression dial below is left as adjustments: [] rather than
# guessed — see the Follow-ups footer.

# --------------------------------------------------------------------------
# Dampers
# --------------------------------------------------------------------------
option_values:
  damper:
    edge_r:
      name: EDGE R
      description: >
        Rebound-only cartridge on the EDGE Evo/EDGE X shocks. External
        low-speed rebound dial; no user compression adjustment. Click count is
        not published on the official product page.
      adjustments: []
      note: "Rebound click count unconfirmed"

    edge_2cr:
      name: EDGE 2CR
      description: >
        2-position on-the-fly compression lever (Open, Firm settings) plus a
        low-speed rebound dial. Shared cartridge naming/function across both
        EDGE Evo (XC/Trail) and EDGE X (reinforced eMTB) shocks. Rebound click
        count is not published.
      adjustments:
        - { name: Compression Mode, type: categorical, options: [Open, Firm], notes: 2-position on-the-fly lever }
      note: "Low-speed rebound click count unconfirmed"

    edge_evo_r_2cr:
      name: EDGE Evo R-2CR
      description: >
        Handlebar-remote version of EDGE 2CR: a remote-actuated 2-position
        compression lever (Open, Firm settings) plus a low-speed rebound dial.
        Rebound click count is not published.
      adjustments:
        - { name: Compression Mode, type: categorical, options: [Open, Firm], notes: Handlebar-remote 2-position lever }
      note: "Low-speed rebound click count unconfirmed"

    triair2_r:
      name: TRIAIR2 R
      description: >
        Rebound-only cartridge on the TRIAIR2 piggyback shock. Officially
        published spec: 8 clicks of rebound. Also features an air-backed IFP
        and volume-spacer spring-curve adjustment.
      adjustments:
        - { name: Rebound, type: step, max: 8 }

    triair2_2cr:
      name: TRIAIR2 2CR
      description: >
        TRIAIR2 cartridge with a 2-position on-the-fly compression lever (Open,
        Firm settings) plus the same 8-click rebound dial as the R variant.
      adjustments:
        - { name: Compression Mode, type: categorical, options: [Open, Firm], notes: 2-position on-the-fly lever }
        - { name: Rebound, type: step, max: 8 }

    triair2_3cr:
      name: TRIAIR2 3CR
      description: >
        TRIAIR2 cartridge with a 3-position on-the-fly compression lever (Open,
        Medium, Firm settings) plus the same 8-click rebound dial as the R
        variant.
      adjustments:
        - { name: Compression Mode, type: categorical, options: [Open, Medium, Firm], notes: 3-position on-the-fly lever }
        - { name: Rebound, type: step, max: 8 }

    raidon_shock_r:
      name: RAIDON R
      description: >
        Rebound-only cartridge on the RAIDON XC/Trail shock. External low-speed
        rebound dial; no user compression adjustment. Click count is not
        published on the official product page.
      adjustments: []
      note: "Rebound click count unconfirmed"

    raidon_shock_lo:
      name: RAIDON LO
      description: >
        Hydraulic lockout variant of the RAIDON shock (fixed-rate damping when
        unlocked); the lockout on/off function is documented on the official
        product page. No numeric click counts are published for this cartridge.
      adjustments:
        - { name: Lockout, type: boolean, notes: Hydraulic lockout lever }

# --------------------------------------------------------------------------
# Shocks — current (2025/2026) SR SUNTOUR MTB lineup. Shocks are sold by
# eye-to-eye/stroke length to fit a given frame; `options.size` lists the
# combinations published on the official product page. All current models are
# air-sprung, so trims share the &air_spring anchor (Pressure only).
# --------------------------------------------------------------------------
nodes:
  - label: "EDGE Evo"
    level: model
    draft: true
    category: XC / Trail
    years: "2025-2026"
    url: https://www.srsuntour.com/products/rear-shock/RS25-EDGE-EVO-2CR-METRIC-8187.html
    specs: { spring: Air }
    children:
      - label: 2CR
        level: trim
        mounts: [Metric, Trunnion, Standard eyelet]
        adjustments: &air_spring
          - { name: Pressure, type: numerical, unit: psi, min: 0 }
        options:
          damper: [edge_2cr]
          size: ["230x57.5/60/62.5/65", "210x47.5/50/52.5/55", "190x37.5/40/42.5/45"]
        note: Glide ring; air-volume-spacer spring-curve adjustment.
