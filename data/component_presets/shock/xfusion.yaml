# X-Fusion mountain-bike rear shocks — adjustment preset database
#
# Same design as shock/suntour.yaml, shock/rst.yaml: click ranges belong to the
# DAMPER, defined once under `option_values.damper` and referenced by id from
# each shock's trims. See SCHEMA.md in this folder. The brand id is `x-fusion`,
# like fork/xfusion.yaml.
#
# X-Fusion publishes no model years and the site shows only the current
# lineup, so there is no generation level.
#
# Click counts: only the H3C set-up guide gives them (about 14 rebound, 14
# low-speed compression, 10 high-speed compression, 3 platform positions). No
# page or guide gives a rebound count for the O2 Pro, Rezza or H3A, but the
# brand's other rebound dials are clicked and counted from fully closed
# (clockwise = slower), so those are declared with `max: ~`. Dial colors: the
# guides name the rebound dial red and the low-speed compression lever / knob
# blue; the high-speed knob is gold, which the catalog palette lacks.
#
# Sizes: each page lists "Standard", "Metric" and "Trunnion" sizes as "a/b"
# without saying what the numbers are; they are read as eye-to-eye / stroke in
# mm (the H3C page's rate calculator and the O2 Pro weight note "165x38" use the
# same pairs). The mount is stated per list, so it sits on each size.
#
# Left out: the Vector (air and coil) and older O2 / Stage / Microlite series,
# which the site no longer lists, although its set-up page still links their
# guides. See the Follow-ups footer.

brand: X-Fusion
component_type: shock
sources:
  - https://www.xfusionshox.com/products/20.htm
  - https://www.xfusionshox.com/help_detail/14.htm
  - https://www.xfusionshox.com/help_detail/6.htm
  - https://www.xfusionshox.com/upload/files/2012O2Setupguide1.pdf
  - https://www.xfusionshox.com/upload/files/H3C%20Setup%20guide1.pdf
  - https://www.xfusionshox.com/upload/files/XFUSION%20OIL%26AIR%20VALUE-v2.pdf
  - https://www.xfusionshox.com/upload/files/Owner's%20Manual-English(1).pdf
  - https://www.xfusionshox.com/products_detail/119.htm
  - https://www.xfusionshox.com/products_detail/126.htm
  - https://www.xfusionshox.com/products_detail/120.htm
  - https://www.xfusionshox.com/products_detail/125.htm
  - https://www.xfusionshox.com/products_detail/87.htm
  - https://www.xfusionshox.com/products_detail/84.htm
