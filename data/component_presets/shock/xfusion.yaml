updated: 2026-11-17
# Service intervals (`tasks`) from the O2 and H3C set-up guides: damper rebuild
# every 80 hours of ride time or annually (both), air sleeve maintenance and
# seal service every 40 hours (O2 only, 25 in extreme conditions). The Rezza
# and H3A have no guide, so they carry no `tasks`. The owner's manual's service
# table is ride-based instead, see the Follow-ups footer.

