# --------------------------------------------------------------------------
# Follow-ups (not yet captured — avoid guessing):
#   - Model years: none published; no generation level.
#   - Draft trim: H3A RCP, because the platform's three positions are named
#     only in the H3C guide (1 soft, 2 mid, 3 firm), not for the air shock.
#   - Rezza, O2 Pro and H3A rebound / compression dials are `max: ~`: the pages
#     name the adjusters but no page, guide or manual gives a click count for
#     them. Whether the O2 Pro and Rezza rebound dials are clicked at all is
#     taken from the brand's other dials (fork guides, H3C guide).
#   - O2 Pro RLX: the product page says Open / Pedal / Lock; the 2012 O2 guide
#     says Open / Firm / Lockout for the RLX. The page is used.
#   - Sizes: the pages print "a/b" or "axb" lists without saying what they are;
#     read as eye-to-eye / stroke in mm (the O2 Pro "Standard" list is 165x38,
#     184x44, 190x51, 200x51 / 56, 215x63).
#     The H3C calculator lists further sizes (200x56, 215x63, 222x69, 240x76,
#     267x89, imperial equivalents) that no product page offers.
#   - Pressure: 60 psi minimum, 300 psi maximum are on the O2 Pro and H3A pages
#     and in the owner's manual's general rear-suspension limits (used for the
#     Rezza too). The H3C is a coil shock.
#   - Volume spacers: the Rezza and H3A pages mention adjustable / available
#     volume spacers but no count, so none is declared.
#   - H3C preload: the guide gives minimum preload = 1 full turn past flush,
#     then up to 5 more turns (declared as 1 to 6 turns); the owner's manual's
#     warranty text says not to exceed three turns of prestress.
#   - H3C spring rate: no spring-rate list is published; only a calculator
#     (rider weight, bike weight, rear travel, sag) on the page.
#   - Set-up guides: the O2 guide (2012) says to start at 80 % of body weight
#     and sag 20-25 % XC / Trail, 25-35 % Enduro / All-Mountain, 30-40 %
#     DH / Freeride; the H3C guide gives the same sag bands. Sag bands are by
#     discipline and the pressure start has no stated unit, so there is no
#     `guides:` block.
#   - Service: the owner's manual lists oil and damper rebuild every 100 rides
#     or every year and the outer air chamber axle every 25 rides (seals every
#     50), the guides use hours; the guides' figures are used.
#   - The "Oil & Air Value" chart gives damper and air-sleeve oil volumes only.
#   - Not modelled: Vector air / coil and other series no longer on the site.
# --------------------------------------------------------------------------
