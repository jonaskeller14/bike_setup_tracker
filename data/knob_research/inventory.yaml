# Knob inventory for custom dials (issue #79). See README.md in this folder.
#
# One entry per physical knob. A knob shared by several dampers or generations
# is one entry; list every catalog adjuster that uses it under `catalog`.
#
# knobs:
#   - id: fox/grip_x2_hsc              # <brand>/<slug>, also the knob: value in the catalog
#     type: step                       # step | categorical | boolean
#     catalog:                         # <component_type>/<brand>#<damper>.<adjuster>
#       - fork/fox#grip_x2.hsc
#     shared_by: "36, 38, 40; 2023-2026 trims"
#     shape: "round ring with a scalloped grip; LSC cross nested inside"
#     colors: "black ring, red LSC marker"
#     sweep_degrees: null              # real rotation if the research finds one
#     positions: null                  # discrete positions for categorical and boolean knobs
#     images:
#       full: [fox/grip_x2_hsc/full/fox-tuning-guide-2025-1.jpg]
#       knob: []
#     rendering_notes: ""
#     status: researching              # researching | archived | no_image | drawn
#
# Adjusters with no usable image get status no_image and keep the generic dial.

knobs:
  - id: "fox/grip_x2_hsc"
    type: step
    catalog: ["fork/fox#grip_x2.hsc"]
    shared_by: "GRIP X2 cap on the 36, 38 and 40 and the 36 SL (same cap in the photos)"
    shape: "round cap; outer HSC ring with arc markings around a four-window dial"
    colors: "blue (dialColor blue)"
    sweep_degrees: null
    positions: null
    images:
      full: ["fox/grip_x2_hsc/full/fox-36-front-gripx2-1.png", "fox/grip_x2_hsc/full/enduro-mtb-fox38-grip-x2-fork-1.jpg"]
      knob: ["fox/grip_x2_hsc/knob/fox-36-product-carousel-1.jpg", "fox/grip_x2_hsc/knob/fox-36-learn-more-damper-1.jpg", "fox/grip_x2_hsc/knob/fox-36sl-grip-x2-carousel-1.jpg", "fox/grip_x2_hsc/knob/fox-38-learn-more-damper-config-1.jpg", "fox/grip_x2_hsc/knob/fox-40-learn-more-damper-config-1.jpg", "fox/grip_x2_hsc/knob/fox-38-learn-more-feature-left-1.jpg"]
