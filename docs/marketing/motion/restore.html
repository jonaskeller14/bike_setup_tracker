<!doctype html>
<!--
  The "restore" Short of kit 05_setup-restore: a Hyperframes composition (tool/marketing/README.md,
  Motion), 23.6 s before the end card. Times are Short seconds, timed to the voice in the kit's
  voice.at; the video's data-duration is the length of the kit's cut of demo_setup_restore.

    0.0  the hook in two beats, word by word
    3.7  what changed: the three fork values from the sample, then a trail line that turns rough
    7.4  the phone slides up on the real history, the setup that felt right boxed
   10.8  menu, Restore, the form; a push onto the rows that went back
   18.2  saved: the new setup boxed, then the old one, and an arrow from old to new

  README.md in this folder explains how compositions work.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<link rel="stylesheet" href="assets/marketing.css">
<link rel="stylesheet" href="assets/motion.css">
<script src="assets/gsap.min.js"></script>
<script src="assets/motion.js"></script>
<style>
  .scene { position: absolute; left: 60px; z-index: 3; }

  #hook { top: 300px; width: 860px; font-size: 128px; }
  #hook .beat { display: block; margin-top: .45em; }

  #changed { top: 270px; width: 860px; }
  #changed .row { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px solid var(--ink); padding: 30px 0 22px; }
  #changed .row .meta { font-size: 34px; }
  #changed .row .num { font-size: 148px; }
  #trail { display: block; margin-top: 44px; width: 860px; height: 230px; }
  #trail { overflow: visible; }
  #trail path { fill: none; stroke: var(--ink); stroke-width: 7; stroke-linejoin: miter; }
  #rough { margin-top: 26px; font-size: 104px; }

  /* Keeps the caption readable when the camera pushes the phone up behind it. */
  #band { position: absolute; inset: 0 0 auto 0; height: 456px; background: var(--paper); z-index: 2; }
  .caption { top: 244px; width: 960px; height: 200px; font-size: 96px; }

  #move { left: 190px; top: 470px; width: 700px; height: 1429px; }
  #move .phone { --pw: 700; }
  /* In recording pixels, inside the phone's screen: the tiles in the history. */
  .box { position: absolute; left: 14px; width: 1292px; border: 10px solid var(--ink); }
  #felt { top: 1282px; height: 488px; }
  #new { top: 640px; height: 496px; }
  #old { top: 1868px; height: 492px; }

  /* From the old setup's box up to the new one's, at the end's camera position; the head stops short of the phone. */
  #arrow div { position: absolute; background: var(--ink); z-index: 2; }
  #arrow-out { left: 70px; top: 1253px; width: 132px; height: 8px; transform-origin: right center; }
  #arrow-up { left: 70px; top: 611px; width: 8px; height: 650px; transform-origin: center bottom; }
  #arrow-in { left: 70px; top: 611px; width: 46px; height: 8px; transform-origin: left center; }
  #arrow-head { left: 114px; top: 589px; width: 36px; height: 52px; clip-path: polygon(0 0, 100% 50%, 0 100%); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="23.6" data-width="1080" data-height="1920">
  <div id="top">
    <div class="brand" data-decor>
      <img src="assets/logo_1024.png" alt="">
      <span>Bike Setup Tracker</span>
    </div>
    <div class="rule"></div>
  </div>

  <h1 id="hook" class="scene hl" data-words>You changed your <em>fork</em> settings. <span class="beat">But you liked it better before?</span></h1>

  <div id="changed" class="scene">
    <div class="row"><div class="meta muted">Fork psi</div><div class="num">84→<span class="new">88</span></div></div>
    <div class="row"><div class="meta muted">Fork LSC</div><div class="num">8→<span class="new">6</span></div></div>
    <div class="row"><div class="meta muted">Fork rebound</div><div class="num">9→<span class="new">11</span></div></div>
    <svg id="trail" viewBox="0 0 860 230"><path d="M0 130 C70 118 130 142 200 128 S300 118 350 132 L372 92 L392 168 L416 58 L440 186 L462 74 L490 196 L512 46 L538 178 L560 86 L586 200 L610 54 L636 180 L660 94 L686 190 L712 62 L738 172 L762 100 L790 186 L816 76 L860 150"/></svg>
    <h1 id="rough" class="hl" data-words>Harsh on the <em>roots</em></h1>
  </div>

  <div id="band"></div>
  <h1 id="c-history" class="caption hl" data-words>Still in your <em>history</em></h1>
  <h1 id="c-menu" class="caption hl" data-words>Open the menu, tap <em>Restore</em></h1>
  <h1 id="c-values" class="caption hl" data-words>Every click and psi, <em>back</em></h1>
  <h1 id="c-saved" class="caption hl" data-words>Saved as your <em>newest setup</em></h1>
  <h1 id="c-old" class="caption hl" data-words>The old one <em>stays</em></h1>

  <div id="move">
    <div class="phone">
      <div class="screen">
        <video id="recording" class="clip" src="assets/recording.mp4" muted playsinline data-start="7.4" data-duration="16.2" data-track-index="1"></video>
        <div id="felt" class="box"></div>
        <div id="new" class="box"></div>
        <div id="old" class="box"></div>
      </div>
      <img class="frame" src="assets/frame.png" alt="">
    </div>
  </div>

  <div id="arrow">
    <div id="arrow-out"></div>
    <div id="arrow-up"></div>
    <div id="arrow-in"></div>
    <div id="arrow-head"></div>
  </div>
</div>
<script>
  const { tl, word, words, caption, leave, finish } = Motion.create();

  // The first word is already on frame 0, which is what a feed shows before the Short plays.
  const hookWords = [...document.querySelectorAll('#hook .w')];
  gsap.set(hookWords.slice(1), { opacity: 0 });
  gsap.set(['#changed', '#band', '.box'], { autoAlpha: 0 });
  gsap.set('#move', { y: 1500 });
  gsap.set('#arrow-out', { scaleX: 0 });
  gsap.set('#arrow-up', { scaleY: 0 });
  gsap.set('#arrow-in', { scaleX: 0 });
  gsap.set('#arrow-head', { autoAlpha: 0 });

  [.48, .89, 1.13, 1.36, 2.15, 2.31, 2.47, 2.74, 2.85, 3.17].forEach((t, i) => word(hookWords[i + 1], t));
  leave('#hook', 3.56);

  tl.set('#changed', { autoAlpha: 1 }, 3.7);
  document.querySelectorAll('#changed .row').forEach((row, i) => {
    const t = 3.85 + i * .42;
    tl.fromTo(row, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .2, ease: 'power3.out' }, t);
    tl.fromTo(row.querySelector('.new'), { opacity: 0, scale: 1.5, transformOrigin: 'right bottom', display: 'inline-block' },
      { opacity: 1, scale: 1, duration: .22, ease: 'back.out(2)' }, t + .24);
  });
  // Drawn left to right. The smooth part holds still; the whole line shakes once the rough part appears (x 350 of 860).
  tl.fromTo('#trail', { clipPath: 'inset(-40px 100% -40px 0px)' }, { clipPath: 'inset(-40px 0% -40px 0px)', duration: 1.9, ease: 'none' }, 5);
  tl.fromTo('#trail', { y: -8 }, { y: 8, duration: .0667, repeat: 22, yoyo: true, ease: 'none', immediateRender: false }, 5.77);
  words('#rough', [5.9, 6.2, 6.35, 6.6]);
  leave('#changed', 7.2);

  tl.set('#band', { autoAlpha: 1 }, 7.36);
  tl.to('#move', { y: 0, duration: .5, ease: 'power3.out' }, 7.4);

  caption('#c-history', 7.5, 10.68);
  tl.set('#felt', { autoAlpha: 1 }, 8.6);
  tl.set('#felt', { autoAlpha: 0 }, 11.1);
  caption('#c-menu', 10.8, 13.43);
  caption('#c-values', 13.55, 17.48);
  caption('#c-saved', 17.6, 19.98);
  caption('#c-old', 20.1);

  tl.to('#move', { x: -105, y: -724, scale: 1.3, duration: .45, ease: 'power3.inOut' }, 13.85);
  tl.to('#move', { x: 0, y: 0, scale: 1, duration: .3, ease: 'power3.inOut' }, 17.3);
  // Both setups inside the safe area, with room on the left for the arrow.
  tl.to('#move', { x: -35, y: -355, scale: 1.1, duration: .4, ease: 'power3.inOut' }, 18.2);
  tl.set('#new', { autoAlpha: 1 }, 18.75);
  tl.set('#old', { autoAlpha: 1 }, 20.25);
  tl.to('#arrow-out', { scaleX: 1, duration: .14, ease: 'none' }, 20.7);
  tl.to('#arrow-up', { scaleY: 1, duration: .36, ease: 'none' }, 20.84);
  tl.to('#arrow-in', { scaleX: 1, duration: .12, ease: 'none' }, 21.2);
  tl.set('#arrow-head', { autoAlpha: 1 }, 21.32);

  finish();
</script>
</body>
</html>
