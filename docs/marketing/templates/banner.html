<!doctype html>
<!--
  Landscape banner at any size: YouTube thumbnail (1280×720), website OG image (1200×630) and
  forum header (1920×640). Phase 3 of #69. Text left, two phones right; everything scales with
  the window height.

  URL parameters:
    title=…, sub=…   texts; *word* is highlighted
    shots=04,03      store raws (docs/store/app-store/iPhone-17-Pro-Max/NN_raw.png), front phone first
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@500&display=block" rel="stylesheet">
<link rel="stylesheet" href="marketing.css">
<style>
  /* --u: 1 at a window height of 720 px. */
  html, body { width: 100vw; height: 100vh; }
  .copy {
    position: absolute;
    left: calc(var(--u) * 64px); top: 0; bottom: 0;
    width: calc(100vw - var(--u) * 600px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: calc(var(--u) * 32px);
  }
  .brand { gap: calc(var(--u) * 20px); }
  .brand img { width: calc(var(--u) * 72px); height: calc(var(--u) * 72px); }
  .brand span { font-size: calc(var(--u) * 34px); }
  h1 { font-size: calc(var(--u) * 84px); }
  .sub { font-size: calc(var(--u) * 32px); line-height: 1.3; color: var(--ink-muted); text-wrap: balance; }
  .phone.second { left: calc(100vw - var(--u) * 540px); top: calc(var(--u) * 110px); transform: scale(calc(var(--u) * .205)) rotate(-5deg); }
  .phone.first { left: calc(100vw - var(--u) * 330px); top: calc(var(--u) * 60px); transform: scale(calc(var(--u) * .22)) rotate(4deg); }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <img src="../../../assets/icons/logo_1024.png" alt="">
      <span>Bike Setup Tracker</span>
    </div>
    <h1 data-param="title"></h1>
    <p class="sub" data-param="sub"></p>
  </div>
  <div class="phone second">
    <img class="screen" data-shot="1" alt="">
    <img class="frame" src="../../../docs/store/app-store/iPhone-17-Pro-Max/frame.png" alt="">
  </div>
  <div class="phone first">
    <img class="screen" data-shot="0" alt="">
    <img class="frame" src="../../../docs/store/app-store/iPhone-17-Pro-Max/frame.png" alt="">
  </div>
<script>
  document.documentElement.style.setProperty('--u', innerHeight / 720);
</script>
<script src="template.js"></script>
</body>
</html>
