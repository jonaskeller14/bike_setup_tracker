<!doctype html>
<!--
  Landscape banners, a native layout per size (size=, see template.js):
    1280×720   YouTube thumbnail v2 (brand.md, Thumbnail formula): a 2–3 word headline filling
               the left, the phone on the right; ?lift= floats one UI element above it, ?dark is
               the high-contrast variant, ?bg= an illustration or AI image behind
    1200×630   website OG image (reference: "og" in docs/marketing/brand/reference/reference.html)
    1920×640   forum header

  URL parameters (and the shared ones in template.js):
    title=…   headline; *key phrase* in teal
    sub=…     the label row under it (OG image and forum header only), e.g. "Fork · Shock · Tires"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="marketing.css">
<style>
  .title { position: absolute; }
  .sub { position: absolute; }

  [data-size="1280x720"] .brand { left: 64px; top: 56px; --mark: 56px; }
  [data-size="1280x720"] .rule { left: 64px; width: 780px; top: 136px; }
  [data-size="1280x720"] .title { left: 62px; top: 172px; width: 700px; height: 470px; font-size: 180px; }
  [data-size="1280x720"] .sub { display: none; }
  [data-size="1280x720"] .phone { left: 820px; top: 64px; --pw: 380; }

  [data-size="1200x630"] .brand { left: 64px; top: 52px; --mark: 56px; }
  [data-size="1200x630"] .rule { left: 64px; right: 64px; top: 130px; --rule: 3px; }
  [data-size="1200x630"] .title { left: 60px; top: 178px; width: 740px; height: 330px; font-size: 92px; }
  [data-size="1200x630"] .sub { left: 64px; bottom: 52px; font-size: 22px; }
  [data-size="1200x630"] .phone { left: 830px; top: 96px; --pw: 382; }

  [data-size="1920x640"] .brand { left: 64px; top: 56px; --mark: 64px; }
  [data-size="1920x640"] .rule { left: 64px; width: 1420px; top: 150px; }
  [data-size="1920x640"] .title { left: 62px; top: 196px; width: 1240px; height: 300px; font-size: 120px; }
  [data-size="1920x640"] .sub { left: 64px; top: 548px; font-size: 26px; }
  [data-size="1920x640"] .phone { left: 1420px; top: 64px; --pw: 420; }
</style>
</head>
<body data-size="1280x720">
  <div class="brand">
    <img src="../../../assets/icons/logo_1024.png" alt="">
    <span>Bike Setup Tracker</span>
  </div>
  <div class="rule"></div>
  <h1 class="hl title" data-param="title" data-fit="64"></h1>
  <div class="meta muted sub" data-param="sub"></div>
  <div class="phone" data-shot="0"></div>
<script src="template.js"></script>
</body>
</html>
