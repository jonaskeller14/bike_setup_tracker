<!doctype html>
<!--
  Instagram carousel slide (also a YouTube community post image), 1080×1350. Phase 3 of #69.
  tool/marketing/build_kit.py renders one PNG per slide of the kit's carousel.

  URL parameters:
    kind=cover|screen|cta   cover: brand, title, sub and two phones
                            screen: title above one phone (the default)
                            cta: brand, title, sub, store badges
    title=…, sub=…          texts; *word* is highlighted
    shots=04,03             store raws (assets/store/app-store/iPhone-17-Pro-Max/NN_raw.png)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carousel Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@500&display=block" rel="stylesheet">
<link rel="stylesheet" href="marketing.css">
<style>
  html, body { width: 1080px; height: 1350px; }
  .brand { gap: 28px; }
  .brand img { width: 120px; height: 120px; }
  .brand span { font-size: 52px; }
  h1 { font-size: 100px; }
  .sub { font-size: 50px; line-height: 1.3; color: var(--ink-muted); text-wrap: balance; }
  .badges { --badge-h: 110px; }
  .copy { position: absolute; left: 80px; right: 80px; display: flex; flex-direction: column; gap: 40px; }

  /* screen */
  [data-kind="screen"] .copy { top: 70px; height: 250px; justify-content: center; text-align: center; }
  [data-kind="screen"] .brand, [data-kind="screen"] .sub, [data-kind="screen"] .badges { display: none; }
  [data-kind="screen"] .phone.second { display: none; }
  /* 685×1398 after scaling; the bottom is cut off by the slide edge. */
  [data-kind="screen"] .phone.first { left: 198px; top: 350px; transform: scale(.466); }

  /* cover */
  [data-kind="cover"] .copy { top: 90px; }
  [data-kind="cover"] .badges { display: none; }
  [data-kind="cover"] .phone.second { left: 80px; top: 700px; transform: scale(.33) rotate(-6deg); }
  [data-kind="cover"] .phone.first { left: 500px; top: 640px; transform: scale(.33) rotate(6deg); }

  /* cta */
  [data-kind="cta"] .copy { top: 0; bottom: 0; justify-content: center; align-items: center; text-align: center; gap: 64px; }
  [data-kind="cta"] .brand { flex-direction: column; gap: 32px; }
  [data-kind="cta"] .brand img { width: 260px; height: 260px; }
  [data-kind="cta"] .sub { order: 1; }
  [data-kind="cta"] .phone { display: none; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <img src="../../../assets/icons/logo_1024.png" alt="">
      <span>Bike Setup Tracker</span>
    </div>
    <h1 data-param="title"></h1>
    <p class="sub" data-param="sub"></p>
    <div class="badges">
      <img class="app-store" src="../../../tool/marketing/assets/badges/app-store_en-US.svg" alt="Download on the App Store">
      <div class="google-play"><img src="../../../tool/marketing/assets/badges/google-play_en-US.png" alt="Get it on Google Play"></div>
    </div>
  </div>
  <div class="phone second">
    <img class="screen" data-shot="1" alt="">
    <img class="frame" src="../../../assets/store/app-store/iPhone-17-Pro-Max/frame.png" alt="">
  </div>
  <div class="phone first">
    <img class="screen" data-shot="0" alt="">
    <img class="frame" src="../../../assets/store/app-store/iPhone-17-Pro-Max/frame.png" alt="">
  </div>
<script>
  document.body.dataset.kind = new URLSearchParams(location.search).get('kind') || 'screen';
</script>
<script src="template.js"></script>
</body>
</html>
