<!doctype html>
<!--
  Post, 1:1, 1080×1080: YouTube community posts (YouTube crops multi-image posts to square), X and
  Mastodon. The same kinds and parameters as post_4x5.html, laid out for the square: the phone is
  always shown whole, next to the text. The last slide is endcard.html at this size.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post 1:1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="marketing.css">
<style>
  html, body { width: 1080px; height: 1080px; }
  .abs { position: absolute; }

  .label { left: 72px; top: 72px; font-size: 28px; }
  .note { right: 72px; top: 72px; font-size: 28px; }
  .footer .brand { left: 72px; top: 930px; --mark: 72px; }
  .footer .meta { right: 72px; top: 952px; font-size: 28px; }

  /* cover and screen: text left, the whole phone right. */
  .cover-brand { left: 72px; top: 72px; --mark: 72px; }
  .copy { left: 72px; width: 500px; display: flex; flex-direction: column; gap: .4em; font-size: 100px; }
  .copy .sub { font-size: .36em; }
  .copy.cover { top: 220px; height: 788px; }
  .copy.screen { top: 168px; height: 840px; }
  .phone { left: 600px; top: 96px; --pw: 408; }
  body[data-kind="screen"] .phone { top: 72px; --pw: 432; left: 576px; }

  /* changed */
  .setup { left: 72px; top: 156px; width: 936px; font-size: 40px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .field { left: 72px; top: 240px; font-size: 28px; }
  .big { left: 64px; top: 284px; font-size: 270px; }
  .pairs { left: 72px; right: 72px; top: 620px; display: flex; justify-content: space-between; }
  .pairs .meta { font-size: 28px; margin-bottom: 12px; }
  .pairs .num { font-size: 130px; }

  /* tip */
  .tip-title { left: 72px; top: 160px; width: 936px; height: 440px; font-size: 112px; }
  .tip-body { left: 72px; top: 660px; width: 936px; height: 210px; font-size: 38px; }

  /* release */
  .version { left: 66px; top: 160px; font-size: 240px; }
  .items { left: 72px; right: 72px; top: 440px; }
  .items div { border-top: 2px solid var(--ink); padding: 20px 0; font-size: 38px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
</style>
</head>
<body data-size="1080x1080" data-kind="screen">
  <!-- cover -->
  <div class="brand cover-brand" data-kind="cover">
    <img src="../../../assets/icons/logo_1024.png" alt="">
    <span>Bike Setup Tracker</span>
  </div>
  <!-- Ends behind the phone. -->
  <div class="rule" data-kind="cover" style="left:72px; width:640px; top:180px"></div>
  <div class="abs copy cover" data-kind="cover" data-fit="72">
    <h1 class="hl" data-param="title"></h1>
    <p class="body muted sub" data-param="sub"></p>
  </div>
  <div class="phone" data-kind="cover screen" data-shot="0" data-callout></div>

  <!-- header of every kind; the note sits over the phone on cover and screen, so only text kinds -->
  <div class="abs meta label" data-kind="screen changed tip release" data-param="label" data-default-changed="Setup history" data-default-tip="Tip" data-default-release="What&#39;s new"></div>
  <div class="abs meta muted note" data-kind="changed tip release" data-param="note"></div>
  <div class="rule" data-kind="screen" style="left:72px; width:600px; top:128px"></div>
  <div class="rule" data-kind="changed tip release" style="left:72px; right:72px; top:128px"></div>

  <!-- screen -->
  <div class="abs copy screen" data-kind="screen" data-fit="72">
    <h1 class="hl" data-param="title"></h1>
    <p class="body muted sub" data-param="sub"></p>
  </div>

  <!-- changed -->
  <div class="abs setup" data-kind="changed" data-param="title"></div>
  <div class="abs meta muted field" data-kind="changed" data-param="field"></div>
  <div class="abs num big" data-kind="changed"><span data-param="from"></span>→<span class="new" data-param="to"></span></div>
  <div class="rule" data-kind="changed" data-if="field2 field3" style="left:72px; right:72px; top:588px; --rule:2px"></div>
  <div class="abs pairs" data-kind="changed">
    <div data-if="field2">
      <div class="meta muted" data-param="field2"></div>
      <div class="num"><span data-param="from2"></span>→<span class="new" data-param="to2"></span></div>
    </div>
    <div data-if="field3">
      <div class="meta muted" data-param="field3"></div>
      <div class="num"><span data-param="from3"></span>→<span class="new" data-param="to3"></span></div>
    </div>
  </div>

  <!-- tip -->
  <h1 class="abs hl tip-title" data-kind="tip" data-param="title" data-fit="96"></h1>
  <div class="rule" data-kind="tip" style="left:72px; right:72px; top:624px; --rule:2px"></div>
  <p class="abs body tip-body" data-kind="tip" data-param="body" data-fit="36"></p>

  <!-- release -->
  <div class="abs num version" data-kind="release" data-param="version"></div>
  <div class="abs items" data-kind="release">
    <div data-param="item1"></div>
    <div data-param="item2"></div>
    <div data-param="item3"></div>
    <div data-param="item4"></div>
  </div>

  <!-- footer of the text kinds -->
  <div class="footer" data-kind="changed tip release">
    <div class="rule" style="left:72px; right:72px; top:900px"></div>
    <div class="brand">
      <img src="../../../assets/icons/logo_1024.png" alt="">
      <span>Bike Setup Tracker</span>
    </div>
    <div class="abs meta muted" data-param="footer"></div>
  </div>
<script src="template.js"></script>
</body>
</html>
