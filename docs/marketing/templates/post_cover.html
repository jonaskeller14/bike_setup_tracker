<!doctype html>
<!--
  Post slide "cover": brand row, title, sub, and the whole phone. Formats: see post.css.

  URL parameters (and the shared ones in template.js: size, device, shots, bg, zoom, lift, safe):
    title=…, sub=…   texts; *key phrase* in teal, {9} a changed value
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post: Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="marketing.css">
<link rel="stylesheet" href="post.css">
<style>
  /* Sized in em, so data-fit shrinks title and sub together. */
  .copy { display: flex; flex-direction: column; gap: .4em; }
  .copy .sub { font-size: .35em; }

  /* The brand row sits on top in every format here: the same element, placed per format. */
  [data-size="1080x1350"] .top-brand { display: flex; left: 72px; top: 72px; --mark: 84px; }
  [data-size="1080x1350"] .top-rule { display: block; left: 72px; right: 72px; top: 200px; }
  [data-size="1080x1350"] .copy { left: 72px; top: 248px; width: 500px; height: 1000px; font-size: 104px; }
  [data-size="1080x1350"] .phone { left: 608px; top: 248px; --pw: 400; }

  /* The rule ends behind the phone. */
  [data-size="1080x1080"] .top-brand { display: flex; left: 72px; top: 72px; --mark: 72px; }
  [data-size="1080x1080"] .top-rule { display: block; left: 72px; width: 640px; top: 180px; }
  [data-size="1080x1080"] .copy { left: 72px; top: 220px; width: 500px; height: 788px; font-size: 100px; }
  [data-size="1080x1080"] .copy .sub { font-size: .36em; }
  [data-size="1080x1080"] .phone { left: 600px; top: 96px; --pw: 408; }

  [data-size="1080x1920"] .copy { left: 60px; top: 250px; width: 960px; height: 520px; font-size: 120px; }
  [data-size="1080x1920"] .phone { left: 300px; top: 820px; --pw: 480; }
</style>
</head>
<body data-size="1080x1350">
  <!-- The platforms' top bar may cover the brand row. -->
  <div class="brand top-brand" data-decor>
    <img src="../../../assets/icons/logo_1024.png" alt="">
    <span>Bike Setup Tracker</span>
  </div>
  <div class="rule top-rule"></div>
  <div class="abs copy" data-fit="72">
    <h1 class="hl" data-param="title"></h1>
    <p class="body muted sub" data-param="sub"></p>
  </div>
  <div class="phone" data-shot="0"></div>
<script src="template.js"></script>
</body>
</html>
