<!doctype html>
<!--
  Background of the 16:9 YouTube walkthrough, 1920×1080. tool/marketing/build_kit.py renders it
  once per chapter caption and puts the recording in the phone. The end card is endcard.html.

  URL parameters (and the shared ones in template.js: device, shots, bg, zoom, lift, safe, video):
    chapter=…   small label above the title, e.g. "3 / 9"
    title=…     chapter title; *key phrase* in teal
    caption=…   line under the title; {9} marks a changed value
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Walkthrough 16:9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="marketing.css">
<style>
  html, body { width: 1920px; height: 1080px; }
  .brand { left: 120px; top: 80px; --mark: 72px; }
  .chapter { position: absolute; left: 120px; top: 250px; font-size: 32px; }
  /* Fixed boxes, so a caption fading in doesn't move the title. */
  .title { position: absolute; left: 116px; top: 310px; width: 1040px; height: 380px; font-size: 132px; }
  .caption { position: absolute; left: 120px; top: 770px; width: 1000px; height: 230px; font-size: 52px; }
  .phone { left: 1290px; top: 40px; --pw: 490; }
</style>
</head>
<body>
  <div class="brand">
    <img src="../../../assets/icons/logo_1024.png" alt="">
    <span>Bike Setup Tracker</span>
  </div>
  <!-- Ends behind the phone. -->
  <div class="rule" style="left:120px; width:1300px; top:200px"></div>
  <div class="meta muted chapter" data-param="chapter"></div>
  <h1 class="hl title" data-param="title" data-fit="96"></h1>
  <div class="rule" style="left:120px; width:1000px; top:730px; --rule:2px"></div>
  <p class="body caption" data-param="caption" data-fit="40"></p>
  <div class="phone" data-video data-callout></div>
<script src="template.js"></script>
</body>
</html>
