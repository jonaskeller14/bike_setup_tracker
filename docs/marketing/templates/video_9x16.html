<!doctype html>
<!--
  Background of the 9:16 Shorts / Reels / TikTok videos, 1080×1920 (reference: "short" in
  docs/marketing/brand/reference/reference.html). tool/marketing/build_kit.py renders it once per
  caption and puts the recording in the phone. The end card is endcard.html.

  URL parameters (and the shared ones in template.js: device, shots, bg, zoom, lift, safe, video):
    caption=…   the headline above the phone; *key phrase* in teal, {9} a changed value
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Short 9:16</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="marketing.css">
<style>
  html, body { width: 1080px; height: 1920px; }
  .brand { left: 60px; top: 120px; --mark: 72px; }
  .caption { position: absolute; left: 60px; top: 262px; width: 960px; height: 460px; font-size: 132px; }
  /* Bleeds off the bottom; the rule above ends at the frame's margin, not at the phone. */
  .phone { left: 172px; top: 760px; --pw: 735; }
</style>
</head>
<body>
  <!-- The platforms' top bar may cover the brand row. -->
  <div class="brand" data-decor>
    <img src="../../../assets/icons/logo_1024.png" alt="">
    <span>Bike Setup Tracker</span>
  </div>
  <div class="rule" style="left:60px; right:60px; top:218px"></div>
  <h1 class="hl caption" data-param="caption" data-fit="96"></h1>
  <div class="phone" data-video data-callout></div>
<script src="template.js"></script>
</body>
</html>
