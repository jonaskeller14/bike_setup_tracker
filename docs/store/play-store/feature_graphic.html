<!doctype html>
<!--
  Play Store feature graphic, 1024×500 PNG. Phase 1b of #69.
  Notes and texts: README.md in this folder's parent (docs/store/README.md).

  URL parameters (append in Chrome; the page reloads):
    ?lang=de   German texts (default: English)
    ?safe      draw the centre where Play overlays its play button once a promo video is set

  Render (Windows and macOS, repo root):
    python tool/marketing/render_images.py play-feature
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Play Store Feature Graphic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@500&display=block" rel="stylesheet">
<link rel="stylesheet" href="../app-store/creative/creative.css">
<style>
  html, body { width: 1024px; height: 500px; }
  .safe-area { left: 462px; top: 190px; width: 100px; height: 120px; }
  .copy { position: absolute; left: 44px; top: 0; bottom: 0; width: 440px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
  .brand img { width: 56px; height: 56px; border-radius: 13px; box-shadow: 0 5px 12px rgba(0, 0, 0, .18); }
  .brand span { font-size: 28px; font-weight: 500; color: var(--ink-muted); }
  h1 { font-size: 66px; letter-spacing: -.5px; }
  :lang(de) h1 { font-size: 54px; }
  /* A phone is 1470×3000 before scaling; the bottoms run off the canvas on purpose. */
  .phone.back { left: 580px; top: 112px; transform: scale(.165); }
  .phone.front { left: 748px; top: 56px; transform: scale(.19); }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <img src="../../icons/logo_1024.png" alt="">
      <span>Bike Setup Tracker</span>
    </div>
    <h1 data-i18n="headline"></h1>
  </div>
  <div class="phone back">
    <img class="screen" src="../app-store/iPhone-17-Pro-Max/03_raw.png" alt="">
    <img class="frame" src="../app-store/iPhone-17-Pro-Max/frame.png" alt="">
  </div>
  <div class="phone front">
    <img class="screen" src="../app-store/iPhone-17-Pro-Max/04_raw.png" alt="">
    <img class="frame" src="../app-store/iPhone-17-Pro-Max/frame.png" alt="">
  </div>
  <div class="safe-area"></div>
<script>
  const strings = {
    en: { headline: 'Never Lose Your <em>Suspension Sweet Spot</em>' },
    de: { headline: 'Nie wieder den <em>Sweet&nbsp;Spot</em> deines Fahrwerks verlieren' },
  };
  const params = new URLSearchParams(location.search);
  const lang = params.get('lang') === 'de' ? 'de' : 'en';
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    el.innerHTML = strings[lang][el.dataset.i18n];
  });
  if (params.has('safe')) document.body.classList.add('show-safe');
</script>
</body>
</html>
