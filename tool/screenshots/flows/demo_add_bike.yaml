# scenario: empty
# Demo: from an empty garage to the first bike. Run it with
# `run_ios.sh iphone --demo` (or `run_android.sh --demo`), which records it with
# touch dots to build/marketing/raw/.
appId: ${APP_ID}
---
- runFlow: _launch.yaml
- tapOn:
    id: nav.bikes
- waitForAnimationToEnd:
    timeout: 5000
- startRecording: demo_add_bike
- runFlow:
    file: _pause.yaml
    env:
      MS: 1500

# The name field is focused when the form opens. Typing during the page
# transition can double the first letter.
- tapOn:
    id: garage.addBike
- waitForAnimationToEnd:
    timeout: 3000
- inputText: Yeti SB160
- runFlow:
    file: _pause.yaml
    env:
      MS: 1000
- tapOn:
    id: bikeForm.save
- runFlow:
    file: _stop_recording.yaml
    env:
      MS: 2500
