# scenario: one_bike_no_components
# Demo: give the Hightower, which has no components yet, its fork, with
# Pressure and Rebound from the suggestions for the type. The name comes last:
# returning from an adjustment page refocuses the name field, which would bring
# the keyboard back up.
appId: ${APP_ID}
---
- runFlow: _launch.yaml
# Without components the app opens on the garage, but only as the default
# tab, which turns to the setups once a component exists. Picking the tab
# keeps the garage on screen after saving.
- tapOn:
    id: nav.setups
- tapOn:
    id: nav.bikes
- waitForAnimationToEnd:
    timeout: 5000
- startRecording: demo_add_component
- runFlow:
    file: _pause.yaml
    env:
      MS: 1500

# Santa Cruz Hightower
- tapOn:
    id: garage.addComponent.93f93d45-3a56-43ae-8936-5cfcbd768c9b
- tapOn:
    id: componentForm.type
- tapOn:
    id: componentType.fork

- tapOn:
    id: componentForm.addAdjustment
- runFlow:
    file: _pause.yaml
    env:
      MS: 1000
- tapOn:
    id: adjustmentPreset.fork:pressure
- runFlow:
    file: _pause.yaml
    env:
      MS: 800
- tapOn:
    id: adjustmentForm.save
- tapOn:
    id: componentForm.addAdjustment
- tapOn:
    id: adjustmentPreset.fork:rebound
- runFlow:
    file: _pause.yaml
    env:
      MS: 800
- tapOn:
    id: adjustmentForm.save

- tapOn:
    id: componentForm.name
# Typing while the keyboard slides in can double the first letter.
- waitForAnimationToEnd:
    timeout: 3000
- inputText: RockShox Lyrik Ultimate
- runFlow: _hide_keyboard_android.yaml
- runFlow:
    file: _pause.yaml
    env:
      MS: 1000
# Back in the garage with the fork on the bike.
- tapOn:
    id: componentForm.save
- runFlow:
    file: _stop_recording.yaml
    env:
      MS: 2500
