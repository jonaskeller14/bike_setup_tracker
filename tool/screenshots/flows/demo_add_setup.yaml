# scenario: no_setups
# Demo: record the first setup. Location and weather fill in on their own (the
# run scripts pin the GPS to Finale Ligure; the screenshot build's weather is
# fixed), then the flow sets the fork's rebound and pressure, names the setup
# and saves it. demo_setup_list is the second take: the history a season of
# setups builds.
appId: ${APP_ID}
---
- runFlow: _launch.yaml
- startRecording: demo_add_setup
- runFlow:
    file: _pause.yaml
    env:
      MS: 1000
- tapOn:
    id: setups.add
- runFlow:
    when:
      platform: Android
    file: _accept_location_accuracy.yaml
- extendedWaitUntil:
    visible:
      id: setupForm.name
    timeout: 15000
# Let the place and weather chips fill in.
- runFlow:
    file: _pause.yaml
    env:
      MS: 2500

# Lyrik Rebound first, while no keyboard covers the form. "Set value" starts
# the slider at its minimum; tapping the slider's centre then moves it to
# mid-range.
- scrollUntilVisible:
    element:
      id: setAdjustment.aefea436-580a-479b-bcd4-943a93c8e2fb
    direction: DOWN
- tapOn:
    id: setAdjustment.aefea436-580a-479b-bcd4-943a93c8e2fb
- runFlow:
    file: _pause.yaml
    env:
      MS: 600
- tapOn:
    id: setAdjustment.aefea436-580a-479b-bcd4-943a93c8e2fb
- runFlow:
    file: _pause.yaml
    env:
      MS: 1000

# Lyrik Pressure
- scrollUntilVisible:
    element:
      id: setAdjustment.22866141-fe35-4cdc-99df-6e1ba91c1033
    direction: UP
- tapOn:
    id: setAdjustment.22866141-fe35-4cdc-99df-6e1ba91c1033
# Typing while the keyboard slides in can double the first letter.
- waitForAnimationToEnd:
    timeout: 3000
- inputText: '84'
- runFlow: _hide_keyboard_android.yaml
- runFlow:
    file: _pause.yaml
    env:
      MS: 800

- scrollUntilVisible:
    element:
      id: setupForm.name
    direction: UP
- tapOn:
    id: setupForm.name
- waitForAnimationToEnd:
    timeout: 3000
- inputText: Finale Ligure - baseline
- runFlow: _hide_keyboard_android.yaml
- runFlow:
    file: _pause.yaml
    env:
      MS: 1000

# Saving returns to the history with the new setup on top.
- tapOn:
    id: setupForm.save
- runFlow:
    file: _stop_recording.yaml
    env:
      MS: 2500
