# scenario: analysis
# Demo: the Lyrik's details page with every setup selected. The line chart
# first, with one adjustment highlighted from the legend, then a short look at
# the radial chart and the activity histogram, without interaction.
appId: ${APP_ID}
---
- runFlow: _launch.yaml
- tapOn:
    id: nav.bikes
- waitForAnimationToEnd:
    timeout: 5000
- startRecording: demo_analysis
- runFlow:
    file: _pause.yaml
    env:
      MS: 1000
# RockShox Lyrik Ultimate: double-tap opens its details page
- doubleTapOn:
    id: garage.component.e47480ee-0f71-453e-bb97-61d2041d05f5
- runFlow:
    file: _pause.yaml
    env:
      MS: 1500
# The table starts with the 3 newest setups; all of them fill the line chart
# and the histogram with the whole season.
- tapOn:
    id: setupTable.selectAll
- runFlow:
    file: _pause.yaml
    env:
      MS: 1000

- scrollUntilVisible:
    element:
      id: componentDetails.lineChart
    direction: DOWN
    centerElement: true
- runFlow:
    file: _pause.yaml
    env:
      MS: 1500
# LSC, the series that moves most (legend entries follow the table's columns)
- tapOn:
    id: lineChart.legend.1
- runFlow:
    file: _pause.yaml
    env:
      MS: 2500

- scrollUntilVisible:
    element:
      id: componentDetails.radialChart
    direction: DOWN
    centerElement: true
- runFlow:
    file: _pause.yaml
    env:
      MS: 2000
- scrollUntilVisible:
    element:
      id: componentDetails.histogram
    direction: DOWN
    centerElement: true
- runFlow:
    file: _stop_recording.yaml
    env:
      MS: 2500
