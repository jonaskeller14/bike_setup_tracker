# scenario: one_bike_no_components
# Demo: the app in six languages. The home menu's Settings, Preferences and the
# language sheet, then the page relabels itself through the languages and stays
# on German. Back on the garage, the Hightower gets its fork from the catalog,
# whose adjusters are written in the language active when it's picked, so the
# form lists Zugstufe. The sample's records stay English. No text selectors after
# the switch: labels change with the language.
appId: ${APP_ID}
---
- runFlow: _launch.yaml
# Without components the app opens on the garage, but only as the default
# tab, which turns to the setups once a component exists. Picking the tab
# keeps the garage on screen after saving.
- tapOn:
    id: nav.setups
- tapOn:
    id: nav.bikes
- waitForAnimationToEnd:
    timeout: 5000
- startRecording: demo_language
- runFlow:
    file: _pause.yaml
    env:
      MS: 2500
- tapOn:
    id: appBar.options
- runFlow:
    file: _pause.yaml
    env:
      MS: 1000
- tapOn:
    id: appBar.options.settings
- runFlow:
    file: _pause.yaml
    env:
      MS: 1200
- tapOn:
    id: settings.preferences
- runFlow:
    file: _pause.yaml
    env:
      MS: 1500
- tapOn:
    id: preferences.language
- runFlow:
    file: _pause.yaml
    env:
      MS: 2000

- tapOn:
    id: language.option.fr
- runFlow:
    file: _pause.yaml
    env:
      MS: 1500
- tapOn:
    id: preferences.language
- runFlow:
    file: _pause.yaml
    env:
      MS: 800
- tapOn:
    id: language.option.it
- runFlow:
    file: _pause.yaml
    env:
      MS: 1500
- tapOn:
    id: preferences.language
- runFlow:
    file: _pause.yaml
    env:
      MS: 800
- tapOn:
    id: language.option.es
- runFlow:
    file: _pause.yaml
    env:
      MS: 1500
- tapOn:
    id: preferences.language
- runFlow:
    file: _pause.yaml
    env:
      MS: 800
- tapOn:
    id: language.option.pt
- runFlow:
    file: _pause.yaml
    env:
      MS: 1500
- tapOn:
    id: preferences.language
- runFlow:
    file: _pause.yaml
    env:
      MS: 800
- tapOn:
    id: language.option.de
- runFlow:
    file: _pause.yaml
    env:
      MS: 2000

- runFlow: _back.yaml
- runFlow: _back.yaml
- runFlow:
    file: _pause.yaml
    env:
      MS: 2000

# Santa Cruz Hightower
- tapOn:
    id: garage.addComponent.93f93d45-3a56-43ae-8936-5cfcbd768c9b
- tapOn:
    id: componentForm.type
- tapOn:
    id: componentType.fork
- runFlow:
    file: _pause.yaml
    env:
      MS: 1000
- tapOn:
    id: componentForm.catalog
- runFlow:
    file: _pause.yaml
    env:
      MS: 1000
- tapOn:
    id: catalogPicker.search
# Typing while the keyboard slides in can double the first letter.
- waitForAnimationToEnd:
    timeout: 3000
- inputText: Lyrik
- runFlow:
    file: _pause.yaml
    env:
      MS: 1000
# The first Charger 3.1 row is the 2025–2026 Ultimate.
- tapOn:
    text: ".*Charger 3.1.*"
    index: 0
- runFlow:
    file: _pause.yaml
    env:
      MS: 1000
- tapOn: "160 mm"
- runFlow:
    file: _pause.yaml
    env:
      MS: 800
- tapOn:
    id: catalogPicker.apply
- runFlow:
    file: _pause.yaml
    env:
      MS: 1500
- tapOn:
    id: componentForm.additionalFields
- runFlow:
    file: _pause.yaml
    env:
      MS: 800
# Slow enough that Flutter doesn't fling: the form stops with Rebound, the
# last adjuster, above Add Adjustment.
- swipe:
    start: 50%,80%
    end: 50%,30%
    duration: 2000
- runFlow:
    file: _stop_recording.yaml
    env:
      MS: 5000
