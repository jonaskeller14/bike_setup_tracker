# Demo: the Strava dashboard (linked gear, latest rides), then a ride with the
# setup it was ridden on. The screenshot build's Strava service is an offline
# fake that appears connected.
appId: ${APP_ID}
---
- runFlow: _launch.yaml
- startRecording: demo_strava
- runFlow:
    file: _pause.yaml
    env:
      MS: 1000
- tapOn:
    id: appBar.strava
- runFlow:
    file: _pause.yaml
    env:
      MS: 3000
# Hometrails - end of May reference, the newest ride
- tapOn:
    id: stravaActivity.18000000016
- runFlow:
    file: _pause.yaml
    env:
      MS: 2000
- tapOn:
    id: stravaActivity.setups
- runFlow:
    file: _stop_recording.yaml
    env:
      MS: 3000
