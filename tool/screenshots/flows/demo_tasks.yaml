# scenario: tasks_one_due
# Demo: tick off the only due task. The due section turns into the "all caught
# up" placeholder, then the list scrolls to the completed section, where the
# task went (it doesn't repeat).
appId: ${APP_ID}
---
- runFlow: _launch.yaml
- startRecording: demo_tasks
- runFlow:
    file: _pause.yaml
    env:
      MS: 1000
- tapOn:
    id: nav.tasks
- runFlow:
    file: _pause.yaml
    env:
      MS: 2000
# Investigate BB creaking noise
- tapOn:
    id: taskRule.complete.d18b5523-f7a1-46b2-8348-ee765964d139
- runFlow:
    file: _pause.yaml
    env:
      MS: 1500
- runFlow: _hide_keyboard_android.yaml
- tapOn:
    id: taskEntryForm.save
- runFlow:
    file: _pause.yaml
    env:
      MS: 2500
- scrollUntilVisible:
    element:
      id: taskRule.complete.d18b5523-f7a1-46b2-8348-ee765964d139
    direction: DOWN
    speed: 20
    centerElement: true
- runFlow:
    file: _stop_recording.yaml
    env:
      MS: 3000
