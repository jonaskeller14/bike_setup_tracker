# Demo: tick off a due maintenance task; it moves from "Due now" to
# "Upcoming".
appId: ${APP_ID}
---
- runFlow: _launch.yaml
- startRecording: demo_tasks
- runFlow:
    file: _pause.yaml
    env:
      MS: 1000
- tapOn:
    id: nav.tasks
- runFlow:
    file: _pause.yaml
    env:
      MS: 2000
# Bolt torque check (every 150 km, due on the Hightower)
- tapOn:
    id: taskRule.complete.6b0f4d7e-2c1a-4e59-8f3d-9a7c5e1b2d40
- runFlow:
    file: _pause.yaml
    env:
      MS: 1500
- runFlow: _hide_keyboard_android.yaml
- tapOn:
    id: taskEntryForm.save
- runFlow:
    file: _stop_recording.yaml
    env:
      MS: 3000
